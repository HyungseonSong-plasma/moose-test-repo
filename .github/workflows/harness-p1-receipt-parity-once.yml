name: P4 adjacency benchmark and parity (one-shot)
on:
  push:
    branches: [issue-758-harness-p1-receipt-parity]
    paths: ['.github/workflows/harness-p1-receipt-parity-once.yml']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 758a3a8b74b0569ecefb1ddbfdb485fb48d8e695
          path: before
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ab84f1e0cd28c7940db389be4a02aaa053c4db0d
          path: after
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assert immutable checkouts and install requirements
        run: |
          test "$(git -C before rev-parse HEAD)" = 758a3a8b74b0569ecefb1ddbfdb485fb48d8e695
          test "$(git -C after rev-parse HEAD)" = ab84f1e0cd28c7940db389be4a02aaa053c4db0d
          python -m pip install -r before/physics_harness/code/requirements.txt
      - name: Paired benchmark, peak allocation and full receipt comparison
        run: |
          cat > "$RUNNER_TEMP/p4_worker.py" <<'PY'
          import os,sys,json,time,gc,tracemalloc,hashlib
          from pathlib import Path
          from dataclasses import fields,is_dataclass
          from collections.abc import Mapping
          from collections import Counter
          from unittest.mock import patch
          from physics_harness.code.diagnostics import GitSourceProvider,ScanRequest,ScanBudget,run_scan
          from physics_harness.code.analysis.usage_matrix import UsageRelation,build_usage_matrix
          from physics_harness.code.analysis.impact import analyze_target_coverage
          from physics_harness.code.graph import GraphSnapshot
          
          def normalize(v):
              if is_dataclass(v): return {f.name:normalize(getattr(v,f.name)) for f in fields(v)}
              if isinstance(v,Mapping): return {str(k):normalize(x) for k,x in v.items()}
              if isinstance(v,(tuple,list)): return [normalize(x) for x in v]
              if isinstance(v,(set,frozenset)): return [normalize(x) for x in sorted(v,key=repr)]
              return v
          def encoded(v): return json.dumps(normalize(v),sort_keys=True,separators=(",",":"),allow_nan=False).encode()
          def digest(v): return hashlib.sha256(encoded(v)).hexdigest()
          source=Path(os.environ["P4_SOURCE"])
          req=ScanRequest(repository="HyungseonSong-plasma/moose-test-repo",revision="758a3a8b74b0569ecefb1ddbfdb485fb48d8e695",includes=("physics_harness/code/*.py","libs/*.py"),collectors=("python_ast",),budget=ScanBudget(max_files=500,max_bytes=20_000_000,max_seconds=180))
          scan=run_scan(req,GitSourceProvider(source))
          g,receipt=scan.graph,scan.receipt
          targets=tuple(n.id for n in g.nodes if n.kind=="python_function" and n.location and "/tests/" not in n.location.path)[:50]
          assert len(targets)==50 and scan.verification.status!="FAILED"
          receipt_value=normalize(receipt); receipt_value.pop("elapsed_seconds",None)
          kwargs=dict(required_paths=("physics_harness/code/analysis/usage_matrix.py",),unverified_surfaces=("external consumers","runtime"),ignored_relations=("DEFINES",))
          rules=(UsageRelation("CALLS_CANDIDATE","call-site","FORWARD"),)
          def invoke(n): return build_usage_matrix(g,receipt,targets[:n],rules,**kwargs)
          ready={"graph_sha256":digest(g),"receipt_sha256_excluding_elapsed":digest(receipt_value),"scope":g.scope.id,"edges":len(g.edges),"nodes":len(g.nodes),"evidence":len(g.evidence),"targets":targets,"files":dict(Counter(x.status for x in receipt.files)),"scan_status":scan.status,"verification":scan.verification.status}
          print(json.dumps(ready),flush=True)
          for line in sys.stdin:
              mode,n=json.loads(line)
              if mode=="exit": break
              if mode=="time":
                  t=time.perf_counter(); result=invoke(n); elapsed=(time.perf_counter()-t)*1000
                  out={"ms":elapsed}
              elif mode=="memory":
                  gc.collect(); tracemalloc.start()
                  result=invoke(n)
                  current,peak=tracemalloc.get_traced_memory(); tracemalloc.stop()
                  out={"peak":peak}
              elif mode=="counts":
                  counts=Counter()
                  class CountedEdges(tuple):
                      def __iter__(self):
                          counts["full_edge_passes"]+=1
                          for edge in super().__iter__():
                              counts["full_edge_items"]+=1
                              yield edge
                  original_edges=g.edges
                  original_nodes=GraphSnapshot.nodes_by_id; original_evidence=GraphSnapshot.evidence_by_id
                  def nodes(obj):
                      counts["node_maps"]+=1; return original_nodes(obj)
                  def evidence(obj):
                      counts["evidence_maps"]+=1; return original_evidence(obj)
                  counted=CountedEdges(original_edges)
                  object.__setattr__(g,"edges",counted)
                  try:
                      with patch.object(GraphSnapshot,"nodes_by_id",nodes),patch.object(GraphSnapshot,"evidence_by_id",evidence):
                          result=invoke(n)
                  finally: object.__setattr__(g,"edges",original_edges)
                  out={"counts":dict(counts)}
              elif mode=="parity":
                  result=invoke(n)
                  for row in result.rows:
                      assert row.coverage==analyze_target_coverage(g,receipt,row.target_id,required_paths=kwargs["required_paths"],unverified_surfaces=kwargs["unverified_surfaces"])
                  p=Path(os.environ["RUNNER_TEMP"])/f"p4-{os.environ['P4_VARIANT']}-{n}.json"
                  p.write_bytes(encoded(result.to_dict()))
                  out={"sha256":hashlib.sha256(p.read_bytes()).hexdigest(),"standalone_parity":True}
              else: raise ValueError(mode)
              print(json.dumps(out),flush=True)
              del result
          PY
          python - <<'PY'
          import json,os,sys,subprocess,statistics,platform
          from pathlib import Path
          root=Path.cwd(); tmp=Path(os.environ["RUNNER_TEMP"])
          workers={}
          def start(label):
              env=dict(os.environ,PYTHONPATH=str(root/label),P4_SOURCE=str(root/"before"),P4_VARIANT=label,PYTHONHASHSEED="0")
              p=subprocess.Popen([sys.executable,str(tmp/"p4_worker.py")],cwd=root/label,env=env,stdin=subprocess.PIPE,stdout=subprocess.PIPE,text=True,bufsize=1)
              workers[label]=p
              return json.loads(p.stdout.readline())
          def send(label,mode,n):
              p=workers[label]; p.stdin.write(json.dumps([mode,n])+"\n");p.stdin.flush()
              return json.loads(p.stdout.readline())
          try:
              a=start("before"); b=start("after"); assert a==b,(a,b)
              report={"source":"758a3a8b74b0569ecefb1ddbfdb485fb48d8e695","candidate":"ab84f1e0cd28c7940db389be4a02aaa053c4db0d","graph":a,"python":platform.python_version(),"machine":platform.machine(),"results":{}}
              for n in (1,10,50):
                  for label in workers: send(label,"time",n)
                  times={"before":[],"after":[]}
                  for k in range(5):
                      for label in (("before","after") if k%2==0 else ("after","before")):
                          times[label].append(send(label,"time",n)["ms"])
                  m={label:statistics.median(v) for label,v in times.items()}
                  peaks={label:[send(label,"memory",n)["peak"] for _ in range(3)] for label in workers}
                  counts={label:send(label,"counts",n)["counts"] for label in workers}
                  parity={label:send(label,"parity",n) for label in workers}
                  assert parity["before"]==parity["after"] and (tmp/f"p4-before-{n}.json").read_bytes()==(tmp/f"p4-after-{n}.json").read_bytes()
                  time_ok=(m["after"]<=m["before"]+max(.1*m["before"],2)) if n==1 else (m["after"]<=.8*m["before"] and (n!=50 or m["before"]-m["after"]>=50))
                  memory_ok=max(peaks["after"])<=max(peaks["before"])+max(.1*max(peaks["before"]),1024**2)
                  traversal_ok=counts["after"]["full_edge_passes"]==1 and counts["after"]["node_maps"]==1 and counts["after"]["evidence_maps"]==1
                  report["results"][str(n)]={"times_ms":times,"medians_ms":m,"peak_bytes":peaks,"counts":counts,"parity":parity,"time_ok":time_ok,"memory_ok":memory_ok,"traversal_ok":traversal_ok}
              report["acceptance"]=all(x["time_ok"] and x["memory_ok"] and x["traversal_ok"] for x in report["results"].values())
              (tmp/"p4-report.json").write_text(json.dumps(report,indent=2,sort_keys=True))
              print("P4_REPORT="+json.dumps(report,sort_keys=True),flush=True)
          finally:
              for p in workers.values():
                  if p.poll() is None:
                      try: p.stdin.write('["exit",0]\n');p.stdin.flush()
                      except BrokenPipeError: pass
                      p.wait(timeout=10)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p4-adjacency-benchmark
          path: |
            ${{ runner.temp }}/p4-report.json
            ${{ runner.temp }}/p4-before-*.json
            ${{ runner.temp }}/p4-after-*.json
          if-no-files-found: warn
          retention-days: 30
