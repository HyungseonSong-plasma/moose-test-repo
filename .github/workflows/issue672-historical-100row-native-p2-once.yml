name: Issue672 original 100-row historical Public B/D real Native P2 one-shot
on:
  push:
    branches:
      - issue-672-historical-100row-native-p2-custody-20261118
permissions:
  contents: read
jobs:
  historical_100row_P2:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CANDIDATE_SHA: 1efdd922096df10239cff8adc132e8f3811c1a63
      HISTORY_SHA: 29d1acc6ef7969908b86719e4b95c73a1565136d
      OCI: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
      OXYGEN_RESEARCH_400: '1'
      OXYGEN_RESEARCH_FULL24: '0'
      OXYGEN_RESEARCH_EI2738_FORMULA: '0'
      OXYGEN_RESEARCH_QUICK_5MIN: '0'
    steps:
      - name: Checkout only review wrapper from isolated main-derived branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout immutable PR578 historical-compatible PhysicsApp source
        uses: actions/checkout@v4
        with:
          ref: 1efdd922096df10239cff8adc132e8f3811c1a63
          path: control
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout original Historical 100-row source independently
        uses: actions/checkout@v4
        with:
          ref: 29d1acc6ef7969908b86719e4b95c73a1565136d
          path: historical
          fetch-depth: 1
          persist-credentials: false
      - name: Confirm exact heads and two different public lookup tables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p review_100row
          test "$(git -C control rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C historical rev-parse HEAD)" = "$HISTORY_SHA"
          original=historical/experiments/Issue91_real_qvt_r3/r3_e0/electron_moments.txt
          alternative=historical/.github/oxygen25_eedf/initial_mixture_23xsec_transport.txt
          echo "994f6b1deece3c53be7fb3e7f9526555d0f9314fd58749bea6346639f08aa387  $original" | sha256sum --check -
          echo "35534a522fa48ccb5222339c5040040630eef31e623e1c53f1e1c4540d2d653b  $alternative" | sha256sum --check -
          test "$(awk 'END {print NR}' "$original")" -eq 100
          test "$(awk 'END {print NR}' "$alternative")" -eq 42
          test ! -e historical/experiments/Issue395_powered_chemistry_ladder/private_rates
          test ! -e control/physics_app/physics-opt
          python3 -m py_compile ci/issue672_historical_100row_native_p2.py
          echo ORIGINAL_HISTORICAL_100ROW_UNCHANGED_BEFORE_PREP
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned public 400W mesh and manifest dependencies
        run: >-
          python3 -m pip install --disable-pip-version-check --quiet
          numpy==2.1.2 scipy==1.14.1 matplotlib==3.9.2
          'pytest>=8,<9' -r control/requirements-evidence-engine.txt
          -r control/requirements-ontology.txt
      - name: Run exact Public P0 and original 100-row public parent mesh construction
        shell: bash
        run: |
          set -euo pipefail
          (cd control && EXPECTED_SOURCE_HEAD="$CANDIDATE_SHA" bash experiments/Issue402_plasma_dsl_g1/preflight_public_option_s6.sh)
          (cd historical && export CHATGPT_WORK_BASE_SHA="$HISTORY_SHA" && bash experiments/Issue395_powered_chemistry_ladder/issue397_l1_power_scan_replay.sh prepare 400)
          original=historical/experiments/Issue91_real_qvt_r3/r3_e0/electron_moments.txt
          echo "994f6b1deece3c53be7fb3e7f9526555d0f9314fd58749bea6346639f08aa387  $original" | sha256sum --check -
          test "$(awk 'END {print NR}' "$original")" -eq 100
          test -s historical/experiments/Issue395_powered_chemistry_ladder/baseline_plasma_plus_unstructured_cover_plus_wafer.msh
          test ! -e historical/experiments/Issue395_powered_chemistry_ladder/private_rates
          echo HISTORICAL_400W_PARENT_MESH_WITH_100ROW_UNMODIFIED_PASS
      - name: Build real PR578 historical-compatible PhysicsApp in immutable OCI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p control/experiments/Issue402_plasma_dsl_g1/evidence
          docker pull "$OCI"
          docker run --rm --network none --entrypoint /bin/bash --user 0:0 --workdir /workspace \
            --mount "type=bind,src=$PWD/control,dst=/workspace" "$OCI" -lc '
              set -euo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt
              make -C physics_app -j2 app_non_unity_dirs="%/utils"
              test -x physics_app/physics-opt
            ' 2>&1 | tee control/experiments/Issue402_plasma_dsl_g1/evidence/native_build.log
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('control')
          evidence=root/'experiments/Issue402_plasma_dsl_g1/evidence'
          def sha(path):return hashlib.sha256(path.read_bytes()).hexdigest()
          actual=root/'physics_app/physics-opt'
          report={'schema':'issue402.native_p1.job_local.v1',
                  'source_sha':os.environ['CANDIDATE_SHA'],
                  'oci_image':os.environ['OCI'],
                  'binary_sha256':sha(actual),
                  'build_log_sha256':sha(evidence/'native_build.log'),
                  'reusable_scope':'same_exact_head_ci_job_only',
                  'P1':'PASS','P3':'NOT_RUN','science':'SCIENCE_HOLD'}
          assert not (evidence/'native_p1_identity.json').exists()
          (evidence/'native_p1_identity.json').write_text(json.dumps(report,sort_keys=True,indent=2)+'\n')
          print('HISTORICAL_100ROW_EXACT_BINARY',report['binary_sha256'])
          PY
          test -f control/physics_app/lib/libphysics-opt.so.0
          bundle=(physics-opt lib/libphysics-opt.so.0)
          if test -f control/physics_app/test/lib/libphysics_test-opt.so.0; then
            bundle+=(test/lib/libphysics_test-opt.so.0)
          elif test -f control/physics_app/lib/libphysics_test-opt.so.0; then
            bundle+=(lib/libphysics_test-opt.so.0)
          fi
          tar --dereference -czf review_100row/real_elf_libraries.tar.gz -C control/physics_app "${bundle[@]}"
          sha256sum review_100row/real_elf_libraries.tar.gz > review_100row/real_elf_libraries.sha256
          cp control/experiments/Issue402_plasma_dsl_g1/evidence/native_p1_identity.json review_100row/native_p1_identity.json
      - name: Execute exact Historical 100-row Public B/D S6-417 and 941 Native P2
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/issue672_historical_100row_native_p2.py \
            --control "$GITHUB_WORKSPACE/control" \
            --historical "$GITHUB_WORKSPACE/historical" \
            --out "$GITHUB_WORKSPACE/review_100row"
      - name: Require original Historical lookup still byte-identical
        if: always()
        shell: bash
        run: |
          original=historical/experiments/Issue91_real_qvt_r3/r3_e0/electron_moments.txt
          echo "994f6b1deece3c53be7fb3e7f9526555d0f9314fd58749bea6346639f08aa387  $original" | sha256sum --check -
          test "$(awk 'END {print NR}' "$original")" -eq 100
          test "$(git -C historical rev-parse HEAD)" = "$HISTORY_SHA"
      - name: Upload sanitized four Native logs and independently rehashable real ELF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue672-historical100row-real-native-p2
          path: |
            review_100row/
            control/experiments/Issue402_plasma_dsl_g1/evidence/S6_*_P2.log
            control/experiments/Issue402_plasma_dsl_g1/evidence/issue402_option_s6_p2_status.json
          if-no-files-found: warn
          retention-days: 14
