name: predictor heavy corrector adaptive 1ns then 9ns

on:
  push:
    branches: [ prototype-fully-implicit-electron-poisson ]
    paths:
      - 'experiments/heavy_fast_logmolar_coupling/prepare_predictor_heavy_corrector_adaptive.py'
      - 'experiments/heavy_fast_logmolar_coupling/prepare_fast_first_adaptive_1ns_9ns.py'
      - 'experiments/heavy_fast_logmolar_coupling/prepare_fast_first_matrix_case.py'
      - 'experiments/heavy_fast_logmolar_coupling/prepare_heavy_energy_ep_once.py'
      - 'experiments/heavy_fast_logmolar_coupling/prepare_fast_child.py'
      - 'experiments/heavy_fast_logmolar_coupling/prepare_heavy_parent.py'
      - 'experiments/Issue91_real_qvt_r3/r3_e0/heavy_base.i'
      - '.github/workflows/predictor-heavy-corrector-adaptive.yml'
      - 'physics_app/**'
  workflow_dispatch:

jobs:
  predictor-heavy-corrector:
    runs-on: ubuntu-24.04
    env:
      BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
    steps:
      - uses: actions/checkout@v4
      - run: docker pull "$BUILD_BASE_REF"
      - name: Run predictor heavy corrector with 1 ns then 9 ns
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace \
            -e CORRECTIONS='5' \
            -e STARTUP_RHO='7.009816816733094e-6' \
            -v "$GITHUB_WORKSPACE:/workspace" "$BUILD_BASE_REF" -lc '
              set -euo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory /opt/physics_vendor/moose
              git config --global --add safe.directory /opt/physics_vendor/crane
              git config --global --add safe.directory /opt/physics_vendor/squirrel
              git config --global --add safe.directory /opt/physics_vendor/zapdos
              export MOOSE_DIR=/opt/physics_vendor/moose CRANE_DIR=/opt/physics_vendor/crane SQUIRREL_DIR=/opt/physics_vendor/squirrel ZAPDOS_DIR=/opt/physics_vendor/zapdos METHOD=opt
              make -C physics_app -j2

              cd experiments/heavy_fast_logmolar_coupling
              python3 prepare_predictor_heavy_corrector_adaptive.py

              ../../physics_app/physics-opt -i electron_poisson_stage.i --check-input
              ../../physics_app/physics-opt -i fast_child.i --check-input
              ../../physics_app/physics-opt -i electron_poisson_corrector_stage.i --check-input
              ../../physics_app/physics-opt -i fast_corrector.i --check-input
              ../../physics_app/physics-opt -i heavy_parent.i --check-input

              rm -rf output_predictor_corrector && mkdir output_predictor_corrector
              set +e
              /usr/bin/time -f "wall_seconds=%e\nuser_seconds=%U\nsys_seconds=%S\nmax_rss_kb=%M" \
                -o output_predictor_corrector/wall_time.txt \
                ../../physics_app/physics-opt -i heavy_parent.i > output_predictor_corrector/run.log 2>&1
              rc=$?
              set -e

              echo "run_rc=$rc" | tee output_predictor_corrector/status.txt
              cp heavy_parent.i fast_child.i electron_poisson_stage.i fast_corrector.i electron_poisson_corrector_stage.i output_predictor_corrector/
              grep -E "Time Step|dt =|Fixed Point|fixed point|Solve Converged|Solve Did NOT Converge|SNES Function norm|log_ne|log_energy|potential|potential_fast|phi_max|phi_min|charge_|mean_energy|positive_ion|O2p_|n_O2p|nonlinear_iterations|ERROR|DIVERGED|CONVERGED" \
                output_predictor_corrector/run.log > output_predictor_corrector/summary.txt || true
              cat output_predictor_corrector/wall_time.txt || true
              tail -n 7000 output_predictor_corrector/summary.txt || true
              exit $rc
            '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: predictor-heavy-corrector-adaptive-corr5
          path: experiments/heavy_fast_logmolar_coupling/output_predictor_corrector/**
          retention-days: 30
