name: Issue667 P1-D4 RF/Joule 11-layer actual-byte audit P0 only
on:
  push:
    branches: [issue-667-p1-d4-rf-joule-20261117]
permissions:
  contents: read
  actions: read
concurrency:
  group: issue667-p1-d4-rf-joule
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download exact 665 HEAD P1-0 artifact
        uses: actions/download-artifact@v4
        with:
          name: issue667-p1-0-sourcepin-9c15a4f-44180190753-1
          run-id: 44180190753
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: capture
      - name: Independently hash and inspect S6-417/941 RF and energy connection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy,hashlib,json,re
          from pathlib import Path
          ROOT=Path("capture");OUT=Path("receipt");OUT.mkdir(exist_ok=True)
          PIN="9c15a4f0e2cf8042cb0d4b2f18af31511021d168"
          HIST="29d1acc6ef7969908b86719e4b95c73a1565136d"
          SECTIONS={"Kernels","FVKernels","FVBCs","FunctorMaterials","Materials","UserObjects","AuxKernels","AuxVariables","Variables","Postprocessors"}
          TARGETS=["rf_heating_t6","q_rf_eV_mol_t6","sigma_real_rf_t6","muN_rf_t6",
                   "maxwell_solution_t6","map_E_real_t6","map_E_imag_t6",
                   "freeze_log_ne_t6","freeze_log_energy_t6","freeze_pressure_t6",
                   "mean_energy_rf_state_t6_aux","q_rf_raw_t6","q_rf_scaled_t6",
                   "charge_number_density","charge_density","poisson_source",
                   "phi_source","energy_time","energy_transport","energy_joule"]
          def h(b):return hashlib.sha256(b).hexdigest()
          def ok(condition,msg):
              if not condition:raise ValueError(msg)
          def parse(data,filename,ordinal):
              out=[];stack=[];offset=0
              data.decode("utf-8")
              for ln,line in enumerate(data.splitlines(keepends=True),1):
                  match=re.fullmatch(rb"\[([^\[\]]*)\]",line.strip())
                  if match:
                      name=match[1].decode()
                      if name:stack.append((name,offset,ln))
                      elif stack:
                          name,start,first=stack.pop()
                          if len(stack)==1 and stack[0][0] in SECTIONS:
                              sec=stack[0][0];raw=data[start:offset+len(line)]
                              params={}
                              for text in raw.decode().splitlines()[1:-1]:
                                  if not text.strip() or text.lstrip().startswith("#"):continue
                                  m=re.fullmatch(r"\s*([A-Za-z_][A-Za-z_0-9]*)\s*=\s*(.*?)\s*",text)
                                  if m:
                                      ok(m[1] not in params,"DUP_PARAM:"+name+":"+m[1])
                                      params[m[1]]=m[2].strip().strip("'\"")
                              out.append(dict(section=sec,object_name=name,layer_ordinal=ordinal,
                                              filename=filename,line_start=first,line_end=ln,
                                              block_sha256=h(raw),params=params))
                  offset+=len(line)
              ok(not stack,"UNBALANCED:"+filename)
              ok(not re.search(rb"(?m)^\s*!include\b",data),"INCLUDE_NOT_RESOLVED:"+filename)
              return out
          def unique(obs,name,section=None):
              items=[x for x in obs if x["object_name"]==name and (section is None or x["section"]==section)]
              ok(len(items)==1,"OWNER_COUNT:"+name+":"+str(len(items)))
              return items[0]
          def has(obj,**kwargs):
              p=obj["params"]
              for key,want in kwargs.items():
                  ok(p.get(key)==want,"PARAM:"+obj["object_name"]+":"+key+":"+repr(p.get(key))+"!="+repr(want))
          def canonical_energy(obs,overlay):
              rf=unique(obs,"rf_heating_t6","Kernels")
              has(rf,type="MatBodyForce",variable="log_e_energy",material_property="q_rf_eV_mol_t6",block="plasma")
              qr=unique(obs,"q_rf_eV_mol_t6","Materials")
              has(qr,type="ParsedMaterial",property_name="q_rf_eV_mol_t6",material_property_names="sigma_real_rf_t6",coupled_variables="E_real_rf_t6 E_imag_rf_t6")
              expr=qr["params"].get("expression","")
              ok(all(token in expr for token in ("enabled","scale","0.5","sigma_real_rf_t6","E_real_rf_t6","E_imag_rf_t6","/F")),"RF_ENERGY_FORMULA")
              ok(qr["params"].get("constant_names")=="scale enabled F","RF_CONSTANT_NAMES")
              sig=unique(obs,"sigma_real_rf_t6","Materials")
              has(sig,type="ParsedMaterial",property_name="sigma_real_rf_t6",material_property_names="muN_rf_t6",
                  coupled_variables="log_ne_rf_state_t6 pressure_rf_state_t6")
              mun=unique(obs,"muN_rf_t6","Materials")
              ok(mun["params"].get("variable")=="mean_energy_rf_state_t6","RF_MOBILITY_MEAN_ENERGY_LINK")
              sol=unique(obs,"maxwell_solution_t6","UserObjects")
              has(sol,type="SolutionUserObject",system_variables="E_real E_imag",timestep="LATEST")
              er=unique(obs,"map_E_real_t6","AuxKernels");ei=unique(obs,"map_E_imag_t6","AuxKernels")
              has(er,type="SolutionAux",solution="maxwell_solution_t6",from_variable="E_real",variable="E_real_rf_t6")
              has(ei,type="SolutionAux",solution="maxwell_solution_t6",from_variable="E_imag",variable="E_imag_rf_t6")
              freezes={}
              for name,variable,coupled in (("freeze_log_ne_t6","log_ne_rf_state_t6","log_e"),
                                             ("freeze_log_energy_t6","log_energy_rf_state_t6","log_e_energy"),
                                             ("freeze_pressure_t6","pressure_rf_state_t6","p")):
                  item=unique(obs,name,"AuxKernels")
                  has(item,type="ParsedAux",variable=variable,coupled_variables=coupled)
                  freezes[name]=item
              mean=unique(obs,"mean_energy_rf_state_t6_aux","AuxKernels")
              has(mean,type="ParsedAux",variable="mean_energy_rf_state_t6",coupled_variables="log_ne_rf_state_t6 log_energy_rf_state_t6")
              raw=unique(obs,"q_rf_raw_t6","Materials")
              scaled=unique(obs,"q_rf_scaled_t6","Materials")
              has(raw,property_name="q_rf_raw_t6",material_property_names="sigma_real_rf_t6")
              has(scaled,property_name="q_rf_scaled_t6",material_property_names="sigma_real_rf_t6")
              # The prior Native energy_joule is retired in Hybrid Scratch D. Its equivalent
              # full FEM action is configured by Energy.fem_potential in layer 11, not as another Native Joule kernel.
              old=[x for x in obs if x["object_name"]=="energy_joule"]
              ok(len(old)==0,"LEGACY_ENERGY_JOULE_STILL_PRESENT")
              ok(len([x for x in obs if x["object_name"]=="energy_time"])==0,"LEGACY_ENERGY_TIME_STILL_PRESENT")
              ok(len([x for x in obs if x["object_name"]=="energy_transport"])==0,"LEGACY_ENERGY_TRANSPORT_STILL_PRESENT")
              ok("[Energy]" in overlay and "fem_potential = potential" in overlay,"PHYSICS_ENERGY_OVERLAY_MISSING")
              ok("rf_heating_material =" not in overlay,"DOUBLE_RF_OWNER_OVERLAY")
              charge=unique(obs,"charge_number_density")
              ok(all(x in charge["params"].get("functor_names","").split() for x in
                     ("n_i_physical","n_op_physical","n_e_physical","n_m_physical")),"CHARGE_DENSITY_INPUTS")
              source=unique(obs,"poisson_source")
              ok("charge_number_density" in source["params"].get("functor_names","").split(),"POISSON_SOURCE_CHARGE")
              phi=unique(obs,"phi_source","Kernels")
              has(phi,variable="potential",functor="poisson_source")
              charge_c=unique(obs,"charge_density")
              ok("charge_number_density" in charge_c["params"].get("functor_names","").split(),"CHARGE_C_M3_INPUT")
              return dict(rf_kernel=rf,rf_power_material=qr,
                          conductivity=sig,mobility_lookup=mun,maxwell_solution=sol,
                          rf_maps=[er,ei],state_freezes=freezes,mean_energy=mean,
                          rf_diagnostics_materials=[raw,scaled],
                          poisson_charge=[charge,charge_c,source,phi],
                          retired_native_joule_kernel_count=0,
                          new_energy_action_overlay_contains_fem_potential=True)

          status=json.loads((ROOT/"status.json").read_bytes())
          ok(status["status"]=="SOURCE_BYTES_PINNED_PENDING_INDEPENDENT_READBACK","WRONG_PIN_STATUS")
          ok(set(p.name for p in ROOT.iterdir())=={"S6-417","S6-941","status.json"},"TOPLEVEL_ALLOWLIST")
          outputs={}
          for case in ("417","941"):
              folder=ROOT/("S6-"+case)
              man=json.loads((folder/"manifest.json").read_bytes())
              ok(man["source_head"]==PIN and man["historical_head"]==HIST and man["case"]==case,"MANIFEST_HEAD")
              order=man["input_order"];layers=man["layers"]
              ok(len(order)==11 and len(layers)==11 and len(set(order))==11 and order[-1]=="migrated_continuity.i","ORDER_INVALID")
              ok(set(x.name for x in folder.iterdir())==set(order)|{"manifest.json"},"FILES_MISMATCH")
              ok(status["cases"][case]=="SOURCE_BYTE_PIN_PASS","CASE_NOT_PINNED")
              files=[];objects=[];allfv=[];texts=[]
              for ordinal,(name,layer) in enumerate(zip(order,layers,strict=True),1):
                  ok(name==layer["filename"] and ordinal==layer["layer_ordinal"] and Path(name).name==name,"FILE_ID")
                  f=folder/name;ok(f.is_file() and not f.is_symlink(),"FILE_UNSAFE")
                  b=f.read_bytes()
                  ok(0<len(b)<=150000 and b"\x00" not in b,"BAD_BYTES")
                  sha=h(b)
                  ok(sha==layer["file_sha256"] and len(b)==layer["size_bytes"],"FILE_SHA_MISMATCH:"+name)
                  parsed=parse(b,name,ordinal);objects.extend(parsed)
                  allfv.extend(o for o in parsed if o["section"] in ("FVBCs","FVKernels"))
                  files.append(dict(layer_ordinal=ordinal,filename=name,sha256=sha))
                  texts.append(b.decode())
              pin={(x["layer_ordinal"],x["section"],x["object_name"]):x["block_sha256"] for x in man["fv_object_blocks"]}
              ok(len(pin)==len(man["fv_object_blocks"])==len(allfv),"FV_BLOCK_MANIFEST_COUNT")
              for o in allfv:
                  ok(pin.get((o["layer_ordinal"],o["section"],o["object_name"]))==o["block_sha256"],
                     "FV_BLOCK_HASH:"+o["object_name"])
              checked=canonical_energy(objects,texts[10])
              # Fail closed negative controls independently prove missing, duplicate, wrong energy,
              # wrong Maxwell variable, erroneous RF producer edge, wrong charge density and hash.
              tests={}
              for mode in ("missing_rf","duplicate_rf","wrong_energy","wrong_maxwell_source","wrong_rf_property","wrong_charge_density"):
                  bad=copy.deepcopy(objects)
                  target=next(x for x in bad if x["object_name"]=="rf_heating_t6" and x["section"]=="Kernels")
                  if mode=="missing_rf":bad.remove(target)
                  elif mode=="duplicate_rf":bad.append(copy.deepcopy(target))
                  elif mode=="wrong_energy":target["params"]["variable"]="log_Om"
                  elif mode=="wrong_maxwell_source":next(x for x in bad if x["object_name"]=="map_E_real_t6")["params"]["from_variable"]="B_real"
                  elif mode=="wrong_rf_property":target["params"]["material_property"]="q_wrong"
                  else:next(x for x in bad if x["object_name"]=="charge_number_density")["params"]["functor_names"]="n_e_physical"
                  try:canonical_energy(bad,texts[10])
                  except ValueError:tests[mode]="REJECTED"
                  else:raise ValueError("NEGATIVE_FALSE_PASS:"+mode)
              outputs[case]=dict(status="PASS_HYBRID_D_STATIC_BYTES",file_sha=files,
                                 fv_block_manifest_matches=len(allfv),
                                 rf_energy=checked,negative_controls=tests,
                                 diagnostics={"rf_source_enable_count":sum(bool(re.search(r"(?m)^\s*source_enable_t6\s*=\s*1\.0\s*$",t)) for t in texts),
                                              "rf_heating_material_declared_count":sum(t.count("rf_heating_material =") for t in texts)})
              print("P1_D4_S6_"+case+f" FILE_SHA=11/11 FV_BLOCK={len(allfv)} RF_ENERGY=PASS CHARGE=PASS NEGATIVE=6/6",flush=True)
          report=dict(schema="issue667.p1_d4.source_bound.v1",task_id="P1-D4",source_head=PIN,historical_head=HIST,
                      upstream_p1_0_run=44180190753,upstream_artifact=14372315897,
                      status="PASS_HYBRID_SCRATCH_D_STATIC_ONLY",cases=outputs,
                      hold=["Maxwell Exodus file and dynamic SolutionUserObject availability not tested",
                            "Material property values, conductivity numerics, and RF power integration not tested",
                            "No actual Native/Physics-generated FE kernel Warehouse inventory or P2/P3/P4 run",
                            "P1-E integration with 29 receipts not performed",
                            "No new-only 26-to-24 cutover or scientific equivalence claim"],
                      private_rate_bytes_read=False,science="SCIENCE_HOLD")
          (OUT/"p1-d4-rf-joule-final11.json").write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          print("P1_D4_FINAL_BOTH_CASES_STATIC_PASS_RUNTIME_HOLD",flush=True)
          PY
      - name: Preserve bounded D4 receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue667-p1-d4-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: receipt/
          if-no-files-found: warn
          retention-days: 30
