name: QPX Issue 144 final migration fix

on:
  push:
    branches:
      - development

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair final migration paths
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("qpx_harness/cli/app.py")
          text = p.read_text()
          text = text.replace(
              "from qpx_harness.specification import MutationSpecError",
              "from qpx_harness.specification import ExperimentSpecError",
          )
          text = text.replace("MutationSpecError, ValueError, TypeError", "ExperimentSpecError, ValueError, TypeError")
          p.write_text(text)

          p = Path("qpx_harness/adapters/moose/electron_inventory/first_linear.py")
          text = p.read_text()
          old = 'SPEC_PATH = Path(__file__).resolve().parents[3] / "specs" / "experiments" / "issue45_first_linear.json"'
          new = 'SPEC_PATH = Path(__file__).resolve().parents[4] / "specs" / "experiments" / "issue45_first_linear.json"'
          if old not in text:
              raise SystemExit("expected first-linear SPEC_PATH not found")
          p.write_text(text.replace(old, new))
          PY
          python -m compileall -q qpx_harness
          python tools/qpx_architecture_census.py --require-no-legacy
          python tools/qpx_dependency_guard.py --check all
      - name: Commit repair
        run: |
          git config user.name "HyungseonSong-plasma"
          git config user.email "hssongplasma@gmail.com"
          git add -A
          git rm -f .github/workflows/qpx-issue144-final-fix.yml
          git commit -m "fix: restore semantic spec errors and first-linear spec path"
          git push origin HEAD:development
