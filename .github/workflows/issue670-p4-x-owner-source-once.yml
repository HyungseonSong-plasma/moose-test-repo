name: Issue 670 P4-X exact owner source one-shot
on:
  push:
    branches:
      - issue-670-p4-x-owner-runner-integration-20261118
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact P3-X artifact (immutable CI source)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' repos/HyungseonSong-plasma/moose-test-repo/actions/artifacts/14406746397/zip > p3x-actual.zip
          printf '%s  %s\n' '592a7c82834bab841f6a2e1807db305d0eff1e953f50a0dcc6d7e21ff8820111' 'p3x-actual.zip' | sha256sum -c -
      - name: Run independent dual-case P4-X source owner test
        run: |
          set -euo pipefail
          python3 ci/check_issue670_p4_x_owner_cutover.py --artifact p3x-actual.zip --report p4-x-owner-source-ci.json
      - name: Retain source-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue670-p4-x-source-owner-test
          path: p4-x-owner-source-ci.json
          if-no-files-found: warn
          retention-days: 14
