name: Physics EI01 runtime validation

on:
  push:
    branches:
      - development
    paths:
      - 'physics_app/include/fvkernels/PhysicsFVElectronReactionSource.h'
      - 'physics_app/src/fvkernels/PhysicsFVElectronReactionSource.C'
      - 'physics_app/ci/ei01_attachment_runtime_smoke.i'
      - '.github/workflows/physics-ei01-runtime-validation.yml'
  pull_request:
    branches:
      - development
    paths:
      - 'physics_app/include/fvkernels/PhysicsFVElectronReactionSource.h'
      - 'physics_app/src/fvkernels/PhysicsFVElectronReactionSource.C'
      - 'physics_app/ci/ei01_attachment_runtime_smoke.i'
      - '.github/workflows/physics-ei01-runtime-validation.yml'

concurrency:
  group: physics-ei01-runtime-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/qpx-build-base@sha256:910d406eb3574a918290dc3621df1133569907d6e7af7884f68abe257a9a1999

jobs:
  controlled-ei01-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare runner disk
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get clean || true
          docker system prune -af --volumes || true

      - name: Pull immutable accepted build base
        shell: bash
        run: |
          set -euxo pipefail
          docker pull "$BUILD_BASE_REF"

      - name: Build exact head and run EI01 discriminator
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm \
            --entrypoint /bin/bash \
            --user 0:0 \
            --workdir /workspace/physics_app \
            -e GITHUB_SHA="$GITHUB_SHA" \
            -v "$PWD:/workspace" \
            "$BUILD_BASE_REF" \
            -lc '
              set -euxo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              export MOOSE_DIR=/opt/qpx_vendor/moose
              export CRANE_DIR=/opt/qpx_vendor/crane
              export SQUIRREL_DIR=/opt/qpx_vendor/squirrel
              export ZAPDOS_DIR=/opt/qpx_vendor/zapdos
              export METHOD=opt

              test "$(git -C /workspace rev-parse HEAD)" = "${GITHUB_SHA}"
              make -j2
              ./physics-opt --check-input -i ci/ei01_attachment_runtime_smoke.i
              (
                cd ci
                ../physics-opt -i ei01_attachment_runtime_smoke.i
                python3 -c '"'"'import csv, math; rows=list(csv.DictReader(open("ei01_attachment_runtime_smoke_out.csv"))); assert len(rows)>=2, rows; initial=float(rows[0]["n_e_hat_avg"]); final=float(rows[-1]["n_e_hat_avg"]); assert math.isclose(initial,1.0,rel_tol=0.0,abs_tol=1e-12),(initial,final); assert final<initial,(initial,final); assert math.isclose(final,0.9,rel_tol=1e-10,abs_tol=1e-12),(initial,final); print("PHYSICS_EI01_CONTROLLED_RUNTIME_PASS")'"'"'
              )
            '
