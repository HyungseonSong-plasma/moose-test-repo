name: Plasma Native Regression

on:
  pull_request:
    paths:
      - 'physics_app/**'
      - 'experiments/Issue402_plasma_dsl_g1/**'
      - 'tests/test_issue402_g1_external_species_binding.py'
      - '.github/workflows/plasma-native-regression.yml'

permissions:
  contents: read

jobs:
  plasma_native_regression:
    if: github.event.pull_request.head.repo.full_name == 'HyungseonSong-plasma/moose-test-repo'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Confirm source and pinned build container
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -f experiments/Issue402_plasma_dsl_g1/run_native_binding_smoke.sh
          grep -Fq 'sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008' physics_app/dependencies.lock
          docker --version
      - name: Set up Python for numerical comparisons
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical comparison packages
        run: python3 -m pip install 'numpy>=1.26,<3' 'scipy>=1.14,<2'
      - name: Build PhysicsApp and verify generated and native solver operators
        shell: bash
        run: bash experiments/Issue402_plasma_dsl_g1/run_native_binding_smoke.sh
      - name: Upload Native regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plasma-native-regression-${{ github.event.pull_request.head.sha }}
          path: experiments/Issue402_plasma_dsl_g1/evidence/**
          if-no-files-found: warn
          retention-days: 30
