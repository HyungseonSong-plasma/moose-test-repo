name: Plasma Native Regression (manual)
run-name: Plasma Native Regression (manual) @ ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact selected branch HEAD SHA'
        required: true
        type: string
      pr_number:
        description: 'Open same-repository PR into main (empty only for main)'
        required: false
        type: string
      validation_approval:
        description: 'Type NATIVE_VALIDATION_APPROVED to run'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: plasma-native-regression-${{ github.sha }}
  cancel-in-progress: false

jobs:
  plasma_native_regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Verify explicit manual approval and current source scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.source_sha }}
          REQUESTED_PR: ${{ inputs.pr_number }}
          APPROVAL: ${{ inputs.validation_approval }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = HyungseonSong-plasma/moose-test-repo
          test "$APPROVAL" = NATIVE_VALIDATION_APPROVED
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$REQUESTED_SHA" = "$GITHUB_SHA"
          [[ "$GITHUB_REF" == refs/heads/* ]]
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            test -z "$REQUESTED_PR"
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$REQUESTED_SHA"
          else
            [[ "$REQUESTED_PR" =~ ^[1-9][0-9]*$ ]]
            gh api "repos/$GITHUB_REPOSITORY/pulls/$REQUESTED_PR" | jq -e \
              --arg repo "$GITHUB_REPOSITORY" --arg sha "$REQUESTED_SHA" --arg ref "${GITHUB_REF#refs/heads/}" \
              '.state == "open" and .base.repo.full_name == $repo and .base.ref == "main" and .head.repo.full_name == $repo and .head.sha == $sha and .head.ref == $ref' >/dev/null
          fi
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Confirm source and pinned build container
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test -f experiments/Issue402_plasma_dsl_g1/run_native_binding_smoke.sh
          grep -Fq 'sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008' physics_app/dependencies.lock
          docker --version
      - name: Set up Python for numerical comparisons
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical comparison packages
        run: python3 -m pip install 'numpy>=1.26,<3' 'scipy>=1.14,<2'
      # Fast, independent gate: fail configuration/data/mount/scratch checks
      # BEFORE rebuilding the expensive solver, without changing global CI.
      - name: P0 - Public S6 environment and scratch-permission preflight
        shell: bash
        env:
          EXPECTED_SOURCE_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if test -f experiments/Issue402_plasma_dsl_g1/preflight_public_option_s6.sh; then
            bash experiments/Issue402_plasma_dsl_g1/preflight_public_option_s6.sh
          else
            echo 'P6 FAIL_CLOSED: required Public S6 option preflight is missing' >&2
            exit 1
          fi
      - name: P1 - Build PhysicsApp and verify generated and native solver operators
        shell: bash
        run: bash experiments/Issue402_plasma_dsl_g1/run_native_binding_smoke.sh
      # Distinct step: an S6 input or cleanup failure cannot erase earlier
      # Native build/small-fixture results. The exact P1 binary is reused.
      - name: P2 - Public S6-417 and S6-941 four-way Native input checks
        shell: bash
        run: |
          set -euo pipefail
          if test -f experiments/Issue402_plasma_dsl_g1/run_public_option_s6_p2.sh; then
            set +e
            bash experiments/Issue402_plasma_dsl_g1/run_public_option_s6_p2.sh > experiments/Issue402_plasma_dsl_g1/evidence/p6_public_legacy_run.log 2>&1
            result=$?
            set -e
            test "$result" -eq 3
            python3 ci/guards/p6_legacy_hold_receipt.py --mode public \
              --root experiments/Issue402_plasma_dsl_g1/evidence \
              --expected-head "$(git rev-parse HEAD)" \
              --output experiments/Issue402_plasma_dsl_g1/evidence/p6_public_keep_hold_receipt.json
            echo P6_PUBLIC_B_PASS_D_KEEP_HOLD_EVIDENCE_NOT_NATIVE_D_PASS
          else
            echo 'P6 FAIL_CLOSED: required S6-417/941 input gate is missing' >&2
            exit 1
          fi
      - name: Require explicit Public D KEEP_HOLD evidence, not Native D PASS
        shell: bash
        run: |
          set -euo pipefail
          test -s experiments/Issue402_plasma_dsl_g1/evidence/p6_public_keep_hold_receipt.json
          python3 ci/guards/p6_legacy_hold_receipt.py --mode public \
            --root experiments/Issue402_plasma_dsl_g1/evidence \
            --expected-head "$(git rev-parse HEAD)" \
            --output experiments/Issue402_plasma_dsl_g1/evidence/p6_public_keep_hold_receipt.json
      - name: Require actual native regression evidence before success
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/guards/issue541_artifact_evidence_guard.py --check-regression
      - name: Upload native regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plasma-native-regression-${{ github.sha }}
          path: experiments/Issue402_plasma_dsl_g1/evidence/**
          if-no-files-found: error
          retention-days: 30
