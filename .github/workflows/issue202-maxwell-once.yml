    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - experiments/Issue202_maxwell_scalar_fem_m0/**
      - experiments/Issue18_qvt_plasma_mapping/qvt.msh
      - automation/manifests/experiments/Issue_202_experiments01.json
      - automation/manifests/experiments/Issue_202_experiments01_prep.json
