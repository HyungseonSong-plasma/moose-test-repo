permissions:
  contents: read

jobs:
  run:
    if: github.head_ref == 'issue-202-maxwell-scalar-fem-m0'
    uses: HyungseonSong-plasma/chatgpt-operation/.github/workflows/governed-matrix.yml@4599ce446ab8a9e56d872e93541b1215d1702ab0
    with:
      issue: "202"
      sequence: "01"
      manifest: automation/manifests/experiments/Issue_202_experiments01.json
      base_sha: ${{ github.event.pull_request.head.sha }}
      operation_sha: 4599ce446ab8a9e56d872e93541b1215d1702ab0
