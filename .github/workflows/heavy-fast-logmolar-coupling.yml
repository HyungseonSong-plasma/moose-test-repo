name: heavy fast logmolar coupling

on:
  push:
    branches: [ prototype-fully-implicit-electron-poisson ]
    paths:
      - 'experiments/heavy_fast_logmolar_coupling/**'
      - '.github/workflows/heavy-fast-logmolar-coupling.yml'
      - 'experiments/Issue91_real_qvt_r3/r3_e0/heavy_base.i'
      - 'experiments/implicit_logmolar_surface_loss/input_10step.i'
      - 'physics_app/**'
  workflow_dispatch:

jobs:
  heavy-to-fast:
    runs-on: ubuntu-24.04
    env:
      BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
    steps:
      - uses: actions/checkout@v4
      - run: docker pull "$BUILD_BASE_REF"
      - name: Build and run dynamic-ion feedback coupling
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace -v "$GITHUB_WORKSPACE:/workspace" "$BUILD_BASE_REF" -lc '
            set -euo pipefail
            source /environment
            git config --global --add safe.directory /workspace
            git config --global --add safe.directory /opt/physics_vendor/moose
            git config --global --add safe.directory /opt/physics_vendor/crane
            git config --global --add safe.directory /opt/physics_vendor/squirrel
            git config --global --add safe.directory /opt/physics_vendor/zapdos
            export MOOSE_DIR=/opt/physics_vendor/moose CRANE_DIR=/opt/physics_vendor/crane SQUIRREL_DIR=/opt/physics_vendor/squirrel ZAPDOS_DIR=/opt/physics_vendor/zapdos METHOD=opt
            make -C physics_app -j2
            cd experiments/heavy_fast_logmolar_coupling

            # Use one internally consistent heavy/electron state for exact quasi-neutral startup.
            export STARTUP_RHO=7.009816816733094e-6
            python3 prepare_fast_child.py
            python3 prepare_heavy_parent.py
            sed -i "s/initial_condition = 7.01e-6/initial_condition = ${STARTUP_RHO}/g" heavy_parent.i

            # Keep Joule heating in the energy equation, but evaluate its complete
            # constitutive state at the previous 1 ns physical state. This isolates
            # the fully coupled Joule/Newton feedback without changing dt or deleting Q_J.
            sed -i "/^  \\[energy_joule\\]$/,/^  \\[\\]$/{s/    state_form = molar_eV/    state_form = molar_eV\\n    lag_one_timestep = true/}" fast_child.i
            printf "\n[Debug]\n  show_var_residual_norms = true\n[]\n" >> fast_child.i

            retired_prefix="QP""X"
            retired_issue="Issue #""27"
            if grep -REn "${retired_prefix}|${retired_issue}" prepare_fast_child.py prepare_heavy_parent.py fast_child.i heavy_parent.i; then
              echo "retired nomenclature detected in active coupling path"
              exit 1
            fi

            ../../physics_app/physics-opt -i fast_child.i --check-input
            ../../physics_app/physics-opt -i heavy_parent.i --check-input
            rm -rf output && mkdir output
            set +e
            ../../physics_app/physics-opt -i heavy_parent.i \
              "MultiApps/fast_plasma/cli_args=Executioner/dt=1e-9;Executioner/dtmin=1e-9;Executioner/dtmax=1e-9;Executioner/num_steps=20;Executioner/end_time=2e-8;Executioner/nl_abs_tol=1e-10;Executioner/nl_rel_tol=1e-9;Executioner/nl_max_its=80;Outputs/file_base=output/fast" \
              "Outputs/file_base=output/heavy" \
              > output/run.log 2>&1
            rc=$?
            set -e
            echo "run_rc=$rc" | tee output/status.txt
            cp heavy_parent.i fast_child.i output/
            grep -E "Time Step|Solve Converged|Solve Did NOT Converge|SNES Function norm|log_ne|log_energy|potential|O2p_migration|positive_ion|n_O2p|phi_max|mean_energy|rho_snapshot_rel_error|max|outside lookup range|ERROR" output/run.log > output/summary.txt || true
            tail -n 720 output/summary.txt || true
            exit $rc
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heavy-fast-logmolar-coupling
          path: experiments/heavy_fast_logmolar_coupling/output/**
          retention-days: 30
