name: Issue669 P3-T4 S6-417 New-only JSON electron static audit (P0)
on:
  push:
    branches:
      - issue-669-p3-t4-s6-417-20261117
permissions:
  contents: read
concurrency:
  group: issue669-p3-t4-417
  cancel-in-progress: false
jobs:
  static_source_audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout immutable PR665 source revision
        uses: actions/checkout@v4
        with:
          ref: 9c15a4f0e2cf8042cb0d4b2f18af31511021d168
          persist-credentials: false
      - name: Verify source HEAD and source-bound 417 JSON, overlay and negative controls
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "9c15a4f0e2cf8042cb0d4b2f18af31511021d168"
          python3 - <<'PY'
          import ast,copy,hashlib,json,math,re,subprocess
          from pathlib import Path

          ROOT=Path.cwd().resolve()
          SRC="9c15a4f0e2cf8042cb0d4b2f18af31511021d168"
          BASE=Path("experiments/Issue402_plasma_dsl_g1")
          J=BASE/"chemistry/unified_s6_417_newonly.json"
          TEMPLATE=BASE/"issue633_newonly_s6_417_continuity.template.i"
          HYBRID=BASE/"chemistry/prepare_hybrid_json_s6.py"
          CPP_CONT=Path("physics_app/src/physics/plasma/DDContinuityEq.C")
          CPP_TPT=Path("physics_app/src/materials/DDTransportMaterial.C")
          EXPECT_TABLE="../../Issue91_real_qvt_r3/r3_e0/electron_moments.txt"
          N_A=6.02214076e23
          EXPECT_DENSITY=1000000000000001.6
          EXPECT_LOG=-20.216123548032986
          def require(x,why):
              if not x:raise ValueError(why)
          def sha(raw):return hashlib.sha256(raw).hexdigest()
          def dup_guard(pairs):
              ret={}
              for key,value in pairs:
                  if key in ret:raise ValueError("DUPLICATE_JSON_KEY:"+key)
                  ret[key]=value
              return ret
          def load(raw):return json.loads(raw.decode("utf-8"),object_pairs_hook=dup_guard)
          def exactly(text,phrase,count=1):
              require(text.count(phrase)==count,"WRONG_COUNT:"+phrase+":"+str(text.count(phrase)))
          # Input sources only, not a generated new-only Scratch (blocked by #668).
          jbytes=J.read_bytes();tbytes=TEMPLATE.read_bytes();hbytes=HYBRID.read_bytes()
          j=load(jbytes);template=tbytes.decode("utf-8");hybrid=hbytes.decode("utf-8")
          jreal=(ROOT/J).resolve()
          tname=j["species"]["e"]["transport_coef"]["file"]
          table=(jreal.parent/tname).resolve()
          require(table.is_relative_to(ROOT) and table.is_file() and not table.is_symlink(),"LOOKUP_TABLE_NOT_TRACKED")
          require(table.relative_to(ROOT)==Path("experiments/Issue91_real_qvt_r3/r3_e0/electron_moments.txt"),
                  "INCORRECT_LOOKUP_RELATIVE_PATH")
          tdata=table.read_bytes()
          table_lines=tdata.decode("utf-8").splitlines()
          require(len(table_lines)>=20,"LOOKUP_TOO_SHORT")
          vals=[]
          for k,line in enumerate(table_lines):
              parts=line.strip().split()
              require(len(parts)==3,"LOOKUP_BAD_COLUMNS:"+str(k))
              row=[float(p) for p in parts]
              require(all(math.isfinite(a) for a in row),"LOOKUP_NONFINITE:"+str(k))
              require(row[0]>0 and row[1]>=0 and row[2]>=0,"LOOKUP_NEGATIVE:"+str(k))
              vals.append(row)
          require(all(b[0]>a[0] for a,b in zip(vals,vals[1:])),"LOOKUP_COORDINATES_NOT_ASCENDING")
          # Historical Hybrid initial-state contract, itself pinned to source HEAD.
          module=ast.parse(hybrid)
          pinned=[ast.literal_eval(node.value) for node in module.body
                  if isinstance(node,ast.Assign) and any(isinstance(t,ast.Name) and t.id=="PINNED_INITIAL_LOG" for t in node.targets)]
          require(len(pinned)==1,"HISTORICAL_PINNED_INITIALS_AMBIGUOUS")
          old_log=float(pinned[0]["log_e"])
          cppc=CPP_CONT.read_text();cppt=CPP_TPT.read_text()
          for token in ("initial_number_density", "std::log(density) - std::log(PHYSICS_CONSTANTS::N_A)",
                        "mechanism.ddTransport(id)", "getParam<std::vector<std::string>>(\"fem_species\")"):
              require(token in cppc,"MISSING_CXX_CONTINUITY_CONTRACT:"+token)
          for token in ('getFunctorByName<ADReal>("e_energy_eV")',
                        'if (_reduced)', 'gas_temperature', 'pressure', '"clamp"'):
              require(token in cppt,"MISSING_CXX_LOOKUP_CONTRACT:"+token)

          def check(data,text):
              require(isinstance(data,dict) and isinstance(data.get("species"),dict),"MISSING_SPECIES")
              e=data["species"].get("e")
              require(isinstance(e,dict),"MISSING_E_SPECIES")
              require(e.get("charge_number")==-1,"E_CHARGE_WRONG")
              n=e.get("initial_number_density")
              require(type(n) in (float,int) and math.isfinite(n) and n>0,"E_INITIAL_MISSING_OR_NONPOSITIVE")
              require(math.isclose(n,EXPECT_DENSITY,rel_tol=1e-15),"E_INITIAL_ARCHIVE_MISMATCH")
              require(math.isclose(math.log(n)-math.log(N_A),old_log,rel_tol=0,abs_tol=1e-12),"E_LOG_MOLAR_MISMATCH")
              transport=e.get("transport_coef")
              require(isinstance(transport,dict),"MISSING_E_TRANSPORT")
              require(set(transport)=={"type","file","unit","bounds_policy"},"E_TRANSPORT_SCHEMA")
              for key,want in {"type":"lookup","file":EXPECT_TABLE,"unit":"reduced","bounds_policy":"clamp"}.items():
                  require(transport.get(key)==want,"E_TRANSPORT_"+key.upper())
              # Binding is declared by the root Physics Plasma block, not inferred from prior Hybrid runs.
              exactly(text,"files = 'chemistry/unified_s6_417_newonly.json'")
              exactly(text,"[Continuity]")
              exactly(text,"[Energy]")
              exactly(text,"fem_species = e",2)
              exactly(text,"fvm_species = 'O2p Om Op'")
              exactly(text,"fem_potential = potential",2)
              exactly(text,"transport_coefficient = fluid")
              exactly(text,"pressure = 1.333223684")
              exactly(text,"temperature = 300")
              exactly(text,"state_model = ideal_gas")
              require("dont_create_kernels" not in text,"BINDING_ONLY_ESCAPE_FORBIDDEN")
              overlay_relative=re.search(r"(?m)^\s*files\s*=\s*'([^']+)'\s*$",text)
              require(overlay_relative and overlay_relative[1]=="chemistry/unified_s6_417_newonly.json","OVERLAY_FILES_BINDING")
              resolved=(ROOT/BASE/overlay_relative[1]).resolve()
              require(resolved==jreal and resolved.is_file(),"OVERLAY_BINDING_DOES_NOT_RESOLVE")
              return {"density_m3":n,"initial_log_molar":math.log(n)-math.log(N_A),
                      "transport":transport,"file_binding":overlay_relative[1]}
          baseline=check(j,template)
          controls={}
          def reject(name,bad_json,bad_template):
              try:check(bad_json,bad_template)
              except (ValueError,KeyError,TypeError):controls[name]="REJECTED"
              else:raise RuntimeError("NEGATIVE_CONTROL_FALSE_PASS:"+name)
          alt=copy.deepcopy(j);del alt["species"]["e"]["transport_coef"];reject("missing_transport",alt,template)
          alt=copy.deepcopy(j);alt["species"]["e"]["transport_coef"]["unit"]="physical";reject("wrong_unit",alt,template)
          alt=copy.deepcopy(j);alt["species"]["e"]["transport_coef"]["bounds_policy"]="error";reject("wrong_bounds",alt,template)
          alt=copy.deepcopy(j);alt["species"]["e"]["transport_coef"]["file"]="../../wrong.txt";reject("wrong_table_path",alt,template)
          alt=copy.deepcopy(j);del alt["species"]["e"]["initial_number_density"];reject("missing_initial",alt,template)
          alt=copy.deepcopy(j);alt["species"]["e"]["initial_number_density"]*=2;reject("changed_initial",alt,template)
          reject("wrong_overlay_filename",j,template.replace("unified_s6_417_newonly.json","unified_s6_941_newonly.json"))
          reject("missing_e_continuity",j,template.replace("fem_species = e","fem_species = Om",1))
          reject("wrong_energy_closure",j,template.replace("transport_coefficient = fluid","transport_coefficient = invalid"))
          reject("missing_gas_pressure",j,template.replace("pressure = 1.333223684",""))
          require(len(controls)==10 and all(v=="REJECTED" for v in controls.values()),"NEGATIVE_COUNT")
          hashes={"newonly_json_sha256":sha(jbytes),"overlay_template_sha256":sha(tbytes),
                  "electron_table_sha256":sha(tdata),"historical_hybrid_preparer_sha256":sha(hbytes)}
          report={"schema":"issue669.p3_t4.s6_417_source_audit.v1","task_id":"P3-T4","case":"S6-417",
                  "source_head":SRC,"status":"STATIC_SOURCE_PASS__P2_DEPENDENCY_HOLD",
                  "files":{"json":str(J),"overlay_template":str(TEMPLATE),
                           "electron_table":str(table.relative_to(ROOT))},
                  "sha256":hashes,"lookup_row_count":len(vals),
                  "json_e_contract":baseline,"prior_hybrid_log_state":old_log,
                  "physics_connections":{"continuity_species":"e","energy_fem_species":"e",
                                          "fem_potential":"potential","transport_coefficient":"fluid",
                                          "gas_pressure_pa":1.333223684,"gas_temperature_K":300,
                                          "lookup_energy":"e_energy_eV"},
                  "producer_consumer_edges":[{"from":"species.e.transport_coef.lookup","to":"DDContinuityEq::ddTransport(e)"},
                    {"from":"electron_moments.txt","to":"DDTransportMaterial::lookup e coefficients"},
                    {"from":"species.e.initial_number_density","to":"DDContinuityEq::addInitialConditions(log_e)"},
                    {"from":"[Physics]/[Plasmas]/files","to":"chemistry/unified_s6_417_newonly.json"},
                    {"from":"[Energy].transport_coefficient=fluid","to":"electron_energy_transport from same lookup"}],
                  "negative_controls":controls,
                  "unresolved":["#668 independent actual 417 ion 26-owner retirement and New-only 11-layer before/after SHA absent",
                                "Overlay template is not proved installed into New-only Scratch as layer 11",
                                "Runtime relative lookup file existence in New-only Scratch and binary Warehouse not proved",
                                "P3-X single-writer integration and P5 Native check-input not run"],
                  "layer_ordinal":None,"staged_file_sha256":None,"staged_block_sha256":None,
                  "physics_run":"NOT_RUN","science":"SCIENCE_HOLD"}
          out=Path("p3t4-receipt");out.mkdir(exist_ok=True)
          (out/"p3-t4-417-source-audit.json").write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          print("P3_T4_417_JSON_SHA256="+hashes["newonly_json_sha256"],flush=True)
          print("P3_T4_417_OVERLAY_SHA256="+hashes["overlay_template_sha256"],flush=True)
          print("P3_T4_417_ELECTRON_TABLE_SHA256="+hashes["electron_table_sha256"],flush=True)
          print("P3_T4_417_ELECTRON_MOMENTS_ROWS="+str(len(vals)),flush=True)
          print("P3_T4_417_NEGATIVE_CONTROLS=10/10_REJECTED",flush=True)
          print("P3_T4_417_STATIC_SOURCE_PASS__P2_DEPENDENCY_HOLD",flush=True)
          PY
      - name: Upload isolated receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue669-p3-t4-417-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: p3t4-receipt/
          if-no-files-found: warn
          retention-days: 30
