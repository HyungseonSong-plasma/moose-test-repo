name: Issue 395 RF plus elastic PID 1000 W absorbed power

on:
  push:
    branches:
      - issue395-rf-elastic-constant-1000w
    paths:
      - '.github/workflows/issue395-rf-elastic-pid-1000w-once.yml'
      - 'experiments/Issue395_powered_chemistry_ladder/add_rf_pid_power_control.py'
      - 'experiments/Issue395_powered_chemistry_ladder/run_rf_elastic_pid_power.py'
      - 'experiments/Issue395_powered_chemistry_ladder/build_o2_elastic_overlay.py'
      - 'experiments/Issue395_powered_chemistry_ladder/run_rf_elastic_constant_power.py'
      - 'experiments/Issue376_maxwell_plasma_rf_transfer/**'
      - 'experiments/Issue3_dielectric_surface_charge/**'
      - 'experiments/Issue202_maxwell_scalar_fem_m0/**'
      - 'experiments/Issue91_real_qvt_r3/r3_e0/electron_moments.txt'
      - 'experiments/fem_fvm_plasma_discriminator/generate_contour_mesh.py'
      - 'physics_app/**'

permissions:
  contents: read

jobs:
  rf-elastic-pid-1000w:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
      CHEM: experiments/Issue395_powered_chemistry_ladder
      T6: experiments/Issue376_maxwell_plasma_rf_transfer
      DIEL: experiments/Issue3_dielectric_surface_charge
      BASE: experiments/fem_fvm_plasma_discriminator
      MAXWELL: experiments/Issue202_maxwell_scalar_fem_m0
      TABLE: experiments/Issue91_real_qvt_r3/r3_e0/electron_moments.txt
      RESULT: experiments/Issue395_powered_chemistry_ladder/results_rf_elastic_pid_1000w

    steps:
      - name: Checkout exact pushed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify exact source revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install host preparation dependencies
        shell: bash
        run: python3 -m pip install --disable-pip-version-check --quiet numpy==2.1.2 scipy==1.14.1

      - name: Build fresh RF plus EI02 elastic PID inputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RESULT"
          mkdir -p "$RESULT/prep"

          python3 "$BASE/generate_contour_mesh.py" > "$RESULT/prep/mesh_plasma.log" 2>&1
          python3 "$DIEL/extend_cover_mesh.py" \
            "$BASE/plasma_contour_l3_4p5mm.msh" "$DIEL/baseline_cover_fine_source.msh" \
            > "$RESULT/prep/mesh_cover.log" 2>&1
          python3 "$DIEL/build_unstructured_cover_wafer_mesh.py" \
            "$DIEL/baseline_cover_fine_source.msh" "$DIEL/baseline_plasma_plus_unstructured_cover_plus_wafer.msh" \
            > "$RESULT/prep/mesh_cover_wafer.log" 2>&1
          python3 "$DIEL/add_focus_ring_block.py" \
            "$DIEL/baseline_plasma_plus_unstructured_cover_plus_wafer.msh" "$DIEL/baseline_plasma_plus_unstructured_cover_plus_wafer.msh" \
            > "$RESULT/prep/mesh_focus.log" 2>&1
          python3 "$DIEL/add_vacuum_coils_block.py" \
            "$DIEL/baseline_plasma_plus_unstructured_cover_plus_wafer.msh" "$DIEL/baseline_plasma_plus_unstructured_cover_plus_wafer.msh" \
            > "$RESULT/prep/mesh_vacuum.log" 2>&1

          cp "$DIEL/baseline_plasma_plus_unstructured_cover_plus_wafer.msh" \
             "$CHEM/baseline_plasma_plus_unstructured_cover_plus_wafer.msh"
          python3 "$DIEL/prepare_baseline_cover_pilot.py" "$CHEM/a0_full_icp.i" > "$RESULT/prep/materialize.log" 2>&1
          python3 "$DIEL/finalize_baseline_cover_pilot.py" "$CHEM/a0_full_icp.i" > "$RESULT/prep/finalize.log" 2>&1
          python3 "$DIEL/promote_cover_wafer_15us.py" "$CHEM/a0_full_icp.i" > "$RESULT/prep/wafer.log" 2>&1
          python3 "$DIEL/promote_focus_ring_15us.py" "$CHEM/a0_full_icp.i" > "$RESULT/prep/focus.log" 2>&1
          python3 "$DIEL/promote_vacuum_coils_15us.py" "$CHEM/a0_full_icp.i" > "$RESULT/prep/vacuum.log" 2>&1

          cp "$CHEM/a0_full_icp.i" "$CHEM/rf_elastic_pid_1000w_grid.i"
          python3 "$DIEL/promote_cover_15us.py" "$CHEM/rf_elastic_pid_1000w_grid.i" \
            | tee "$RESULT/prep/timegrid.log"

          python3 "$T6/build_t6_overlays_v2.py" \
            --table "$TABLE" \
            --maxwell-overlay "$CHEM/rf_elastic_pid_1000w_maxwell_overlay.i" \
            --plasma-overlay "$CHEM/rf_elastic_pid_1000w_plasma_overlay.i" \
            | tee "$RESULT/prep/rf_overlays.log"

          python3 "$CHEM/add_rf_pid_power_control.py" \
            --overlay "$CHEM/rf_elastic_pid_1000w_plasma_overlay.i" \
            --target-w 1000 \
            --kp=-0.001 \
            --minimum-scale 0.5 \
            --maximum-scale 1.5 \
            | tee "$RESULT/prep/rf_pid_overlay.log"

          cp physics_app/data/electron_impact/o2_elastic.txt "$CHEM/o2_elastic.txt"
          python3 "$CHEM/build_o2_elastic_overlay.py" \
            --base-input "$CHEM/a0_full_icp.i" \
            --output "$CHEM/o2_elastic_pid_1000w_overlay.i" \
            --elastic-table o2_elastic.txt \
            | tee "$RESULT/prep/elastic_overlay.log"

          python3 -m py_compile \
            "$CHEM/add_rf_pid_power_control.py" \
            "$CHEM/build_o2_elastic_overlay.py" \
            "$CHEM/run_rf_elastic_constant_power.py" \
            "$CHEM/run_rf_elastic_pid_power.py"

          grep -q 'type = PIDTransientControl' "$CHEM/rf_elastic_pid_1000w_plasma_overlay.i"
          grep -q 'K_proportional = -0.001' "$CHEM/rf_elastic_pid_1000w_plasma_overlay.i"
          ! grep -q 'R_diss_O2\|diss_energy\|R_ion_O2' "$CHEM/o2_elastic_pid_1000w_overlay.i"

      - name: Pull pinned Physics build image
        shell: bash
        run: docker pull "$BUILD_BASE_REF"

      - name: Build exact-head Physics application
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash --user 0:0 \
            --workdir /workspace -v "$GITHUB_WORKSPACE:/workspace" \
            "$BUILD_BASE_REF" -lc '
              set -euo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory /opt/physics_vendor/moose
              git config --global --add safe.directory /opt/physics_vendor/crane
              git config --global --add safe.directory /opt/physics_vendor/squirrel
              git config --global --add safe.directory /opt/physics_vendor/zapdos
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt
              make -C physics_app -j2
            '
          test -x physics_app/physics-opt

      - name: Run fresh RF plus EI02 elastic with lagged PID power feedback
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash --user 0:0 \
            --workdir /workspace -v "$GITHUB_WORKSPACE:/workspace" \
            "$BUILD_BASE_REF" -lc "
              set -euo pipefail
              source /environment
              python3 '$CHEM/run_rf_elastic_pid_power.py' \
                --physics physics_app/physics-opt \
                --plasma-input '$CHEM/rf_elastic_pid_1000w_grid.i' \
                --rf-plasma-overlay '$CHEM/rf_elastic_pid_1000w_plasma_overlay.i' \
                --elastic-overlay '$CHEM/o2_elastic_pid_1000w_overlay.i' \
                --maxwell-input '$MAXWELL/rf_power.i' \
                --maxwell-overlay '$CHEM/rf_elastic_pid_1000w_maxwell_overlay.i' \
                --output-dir '$RESULT/run' \
                --analysis '$RESULT/analysis.json'
            " 2>&1 | tee "$RESULT/driver.log"

      - name: Upload RF plus EI02 elastic PID evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue395-rf-elastic-pid-1000w-evidence
          path: |
            experiments/Issue395_powered_chemistry_ladder/results_rf_elastic_pid_1000w/**
            experiments/Issue395_powered_chemistry_ladder/a0_full_icp.i
            experiments/Issue395_powered_chemistry_ladder/rf_elastic_pid_1000w_grid.i
            experiments/Issue395_powered_chemistry_ladder/rf_elastic_pid_1000w_plasma_overlay.i
            experiments/Issue395_powered_chemistry_ladder/rf_elastic_pid_1000w_maxwell_overlay.i
            experiments/Issue395_powered_chemistry_ladder/o2_elastic_pid_1000w_overlay.i
            experiments/Issue395_powered_chemistry_ladder/o2_elastic.txt
            experiments/Issue395_powered_chemistry_ladder/add_rf_pid_power_control.py
            experiments/Issue395_powered_chemistry_ladder/build_o2_elastic_overlay.py
            experiments/Issue395_powered_chemistry_ladder/run_rf_elastic_constant_power.py
            experiments/Issue395_powered_chemistry_ladder/run_rf_elastic_pid_power.py
          if-no-files-found: warn
          retention-days: 30
