name: Physics governed science validation

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/physics-science-validation.yml'
      - 'physics_app/**'
      - 'bin/physics.py'
      - 'docs/development/2026-09-10_issue176_stage5_s5c_edetach_contract.json'
      - 'docs/development/2026-09-10_issue176_stage5_s5d_heavy_reactions_contract.json'
  workflow_dispatch:

concurrency:
  group: physics-science-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
  MOOSE_SHA: 9f388366ccf38b9c34542ec5561198249fde0ac9
  CRANE_SHA: ba26970cf419dcac563a20ed7079d445bc6341c3
  SQUIRREL_SHA: 16a26d504f3ee11161a86d4e3ebf3c0e5f2afbb1
  ZAPDOS_SHA: 9eceffbc46048c3760bbfa9a7f1ca681ae35af1d

jobs:
  r2-o2-ionization:
    name: Stage-3/4 regressions + Stage-5 S5-A/S5-B/S5-C/S5-D controlled P3
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Validate immutable JIT-capable build-base identity
        shell: bash
        run: |
          set -euxo pipefail
          [[ "$BUILD_BASE_REF" =~ ^ghcr\.io/hyungseonsong-plasma/physics-build-base@sha256:[0-9a-f]{64}$ ]]
          source physics_app/dependencies.lock
          test "$MOOSE" = "$MOOSE_SHA"
          test "$CRANE" = "$CRANE_SHA"
          test "$SQUIRREL" = "$SQUIRREL_SHA"
          test "$ZAPDOS" = "$ZAPDOS_SHA"
          test "$PHYSICS_BUILD_BASE_IMAGE" = "ghcr.io/hyungseonsong-plasma/physics-build-base"
      - name: Pull and verify JIT-capable Physics build base
        shell: bash
        run: |
          set -euxo pipefail
          docker pull "$BUILD_BASE_REF"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.moose.sha" }}')" = "$MOOSE_SHA"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.crane.sha" }}')" = "$CRANE_SHA"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.squirrel.sha" }}')" = "$SQUIRREL_SHA"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.zapdos.sha" }}')" = "$ZAPDOS_SHA"
      - name: Build current Physics source and execute bounded science P0-P3
        shell: bash
        run: |
          set -euxo pipefail
          rm -f r2-o2-ionization-runtime-evidence.json r2-o2-ionization-environment.txt r3-o2s-excitation-runtime-evidence.json r3-o2s-excitation-environment.txt e8-ei10-inelastic-energy-runtime-evidence.json e8-ei10-inelastic-energy-environment.txt e8-ei16-ionization-energy-runtime-evidence.json e8-ei16-ionization-energy-environment.txt e8-elastic-ei19-runtime-evidence.json e8-elastic-ei19-environment.txt stage5-ei18-runtime-evidence.json stage5-ei18-environment.txt stage5-ei20-runtime-evidence.json stage5-ei20-environment.txt stage5-edetach-runtime-evidence.json stage5-edetach-environment.txt stage5-s5d-heavy-runtime-evidence.json stage5-s5d-heavy-environment.txt
          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace -e GITHUB_SHA="$GITHUB_SHA" -e BUILD_BASE_REF="$BUILD_BASE_REF" -v "$PWD:/workspace" "$BUILD_BASE_REF" -lc '
              set -euxo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory /opt/physics_vendor/moose
              git config --global --add safe.directory /opt/physics_vendor/crane
              git config --global --add safe.directory /opt/physics_vendor/squirrel
              git config --global --add safe.directory /opt/physics_vendor/zapdos
              test "$(git -C /workspace rev-parse HEAD)" = "$GITHUB_SHA"
              export MOOSE_DIR=/opt/physics_vendor/moose CRANE_DIR=/opt/physics_vendor/crane SQUIRREL_DIR=/opt/physics_vendor/squirrel ZAPDOS_DIR=/opt/physics_vendor/zapdos METHOD=opt
              command -v mpicxx
              command -v c++
              {
                echo "REPOSITORY_SHA=$GITHUB_SHA"
                echo "BUILD_BASE_REF=$BUILD_BASE_REF"
                echo "MPICXX=$(command -v mpicxx)"
                echo "CXX=$(command -v c++)"
                echo "MPICXX_VERSION=$(mpicxx --version | head -n 1)"
                echo "SCIENTIFIC_SEMANTICS_CHANGED=false"
              } > /workspace/r2-o2-ionization-environment.txt
              cp /workspace/r2-o2-ionization-environment.txt /workspace/r3-o2s-excitation-environment.txt
              cp /workspace/r2-o2-ionization-environment.txt /workspace/e8-ei10-inelastic-energy-environment.txt
              cp /workspace/r2-o2-ionization-environment.txt /workspace/e8-ei16-ionization-energy-environment.txt
              cp /workspace/r2-o2-ionization-environment.txt /workspace/e8-elastic-ei19-environment.txt
              cp /workspace/r2-o2-ionization-environment.txt /workspace/stage5-ei18-environment.txt
              cp /workspace/r2-o2-ionization-environment.txt /workspace/stage5-ei20-environment.txt
              cp /workspace/r2-o2-ionization-environment.txt /workspace/stage5-edetach-environment.txt
              cp /workspace/r2-o2-ionization-environment.txt /workspace/stage5-s5d-heavy-environment.txt
              sed -i "s/SCIENTIFIC_SEMANTICS_CHANGED=false/SCIENTIFIC_SEMANTICS_CHANGED=true/" /workspace/stage5-ei18-environment.txt
              sed -i "s/SCIENTIFIC_SEMANTICS_CHANGED=false/SCIENTIFIC_SEMANTICS_CHANGED=true/" /workspace/stage5-ei20-environment.txt
              sed -i "s/SCIENTIFIC_SEMANTICS_CHANGED=false/SCIENTIFIC_SEMANTICS_CHANGED=true/" /workspace/stage5-edetach-environment.txt
              sed -i "s/SCIENTIFIC_SEMANTICS_CHANGED=false/SCIENTIFIC_SEMANTICS_CHANGED=true/" /workspace/stage5-s5d-heavy-environment.txt
              python3 bin/physics.py preflight --self-test
              python3 physics_app/ci/check_r2_o2_ionization_implementation.py
              python3 physics_app/ci/check_r3_o2s_excitation_implementation.py
              python3 physics_app/ci/check_e8_ei10_energy_contract.py
              python3 physics_app/ci/check_e8_ei10_energy_implementation.py
              python3 physics_app/ci/check_e8_ei10_energy_runtime.py --self-test
              python3 physics_app/ci/check_e8_ei16_energy_contract.py
              python3 physics_app/ci/check_e8_ei16_energy_runtime.py --self-test
              python3 physics_app/ci/check_e8_elastic_ei19_implementation.py
              python3 physics_app/ci/check_e8_elastic_ei19_runtime.py --self-test
              python3 physics_app/ci/check_stage5_ei18_runtime.py --self-test
              python3 physics_app/ci/check_stage5_ei18_runtime.py --static
              python3 physics_app/ci/check_stage5_ei20_runtime.py --self-test
              python3 physics_app/ci/check_stage5_ei20_runtime.py --static
              python3 physics_app/ci/check_stage5_edetach_runtime.py --self-test
              python3 physics_app/ci/check_stage5_edetach_runtime.py --static
              python3 physics_app/ci/check_stage5_s5d_heavy_reactions.py --self-test
              python3 physics_app/ci/check_stage5_s5d_heavy_reactions.py --static
              test ! -e physics_app/physics-opt
              make -C physics_app -j2
              test -x physics_app/physics-opt
              python3 physics_app/ci/check_r2_o2_ionization_implementation.py --executable /workspace/physics_app/physics-opt --repository-sha "$GITHUB_SHA" --build-base-ref "$BUILD_BASE_REF" --evidence-out /workspace/r2-o2-ionization-runtime-evidence.json
              python3 physics_app/ci/check_r3_o2s_excitation_implementation.py --executable /workspace/physics_app/physics-opt --repository-sha "$GITHUB_SHA" --build-base-ref "$BUILD_BASE_REF" --evidence-out /workspace/r3-o2s-excitation-runtime-evidence.json
              python3 physics_app/ci/check_e8_ei10_energy_runtime.py --executable /workspace/physics_app/physics-opt --repository-sha "$GITHUB_SHA" --build-base-ref "$BUILD_BASE_REF" --evidence-out /workspace/e8-ei10-inelastic-energy-runtime-evidence.json
              python3 physics_app/ci/check_e8_ei16_energy_runtime.py --executable /workspace/physics_app/physics-opt --repository-sha "$GITHUB_SHA" --build-base-ref "$BUILD_BASE_REF" --evidence-out /workspace/e8-ei16-ionization-energy-runtime-evidence.json
              python3 physics_app/ci/check_e8_elastic_ei19_runtime.py --executable /workspace/physics_app/physics-opt --repository-sha "$GITHUB_SHA" --build-base-ref "$BUILD_BASE_REF" --evidence-out /workspace/e8-elastic-ei19-runtime-evidence.json
              python3 physics_app/ci/check_stage5_ei18_runtime.py --executable /workspace/physics_app/physics-opt --repository-sha "$GITHUB_SHA" --build-base-ref "$BUILD_BASE_REF" --evidence-out /workspace/stage5-ei18-runtime-evidence.json
              python3 physics_app/ci/check_stage5_ei20_runtime.py --executable /workspace/physics_app/physics-opt --repository-sha "$GITHUB_SHA" --build-base-ref "$BUILD_BASE_REF" --evidence-out /workspace/stage5-ei20-runtime-evidence.json
              python3 physics_app/ci/check_stage5_edetach_runtime.py --executable /workspace/physics_app/physics-opt --repository-sha "$GITHUB_SHA" --build-base-ref "$BUILD_BASE_REF" --evidence-out /workspace/stage5-edetach-runtime-evidence.json
              python3 physics_app/ci/check_stage5_s5d_heavy_reactions.py --executable /workspace/physics_app/physics-opt --repository-sha "$GITHUB_SHA" --build-base-ref "$BUILD_BASE_REF" --evidence-out /workspace/stage5-s5d-heavy-runtime-evidence.json
            '
      - name: Upload R2 controlled science evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-o2-ionization-governed-runtime-evidence
          path: |
            r2-o2-ionization-runtime-evidence.json
            r2-o2-ionization-environment.txt
      - name: Upload R3 controlled science evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-o2s-excitation-governed-runtime-evidence
          path: |
            r3-o2s-excitation-runtime-evidence.json
            r3-o2s-excitation-environment.txt
      - name: Upload E8 EI10 controlled science evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e8-ei10-inelastic-energy-governed-runtime-evidence
          path: |
            e8-ei10-inelastic-energy-runtime-evidence.json
            e8-ei10-inelastic-energy-environment.txt
      - name: Upload E8 EI16 controlled science evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e8-ei16-ionization-energy-governed-runtime-evidence
          path: |
            e8-ei16-ionization-energy-runtime-evidence.json
            e8-ei16-ionization-energy-environment.txt
      - name: Upload E8 elastic and EI19 controlled science evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e8-elastic-ei19-governed-runtime-evidence
          path: |
            e8-elastic-ei19-runtime-evidence.json
            e8-elastic-ei19-environment.txt
      - name: Upload Stage-5 EI18 controlled science evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage5-ei18-governed-runtime-evidence
          path: |
            stage5-ei18-runtime-evidence.json
            stage5-ei18-environment.txt
      - name: Upload Stage-5 EI20 controlled science evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage5-ei20-governed-runtime-evidence
          path: |
            stage5-ei20-runtime-evidence.json
            stage5-ei20-environment.txt
      - name: Upload Stage-5 electron detachment controlled science evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage5-edetach-governed-runtime-evidence
          path: |
            stage5-edetach-runtime-evidence.json
            stage5-edetach-environment.txt
      - name: Upload Stage-5 H01-H04 heavy-reaction controlled science evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage5-s5d-heavy-governed-runtime-evidence
          path: |
            stage5-s5d-heavy-runtime-evidence.json
            stage5-s5d-heavy-environment.txt
