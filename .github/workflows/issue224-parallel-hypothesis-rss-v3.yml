name: Issue-224 parallel hypothesis OS RSS fan-out v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue224-parallel-hypothesis-rss-v3.yml'
      - 'experiments/Issue224_element_aggregate_memory/run_parallel.py'
  workflow_dispatch:
    inputs:
      base_sha:
        description: 'Immutable experiment base SHA (40 hex chars)'
        required: true
        type: string
      experiments_json:
        description: 'JSON array of restricted hypothesis specs'
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

concurrency:
  group: issue224-rss-v3-${{ github.event_name }}-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

env:
  BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
  MOOSE_SHA: 9f388366ccf38b9c34542ec5561198249fde0ac9
  CRANE_SHA: ba26970cf419dcac563a20ed7079d445bc6341c3
  SQUIRREL_SHA: 16a26d504f3ee11161a86d4e3ebf3c0e5f2afbb1
  ZAPDOS_SHA: 9eceffbc46048c3760bbfa9a7f1ca681ae35af1d

jobs:
  p0-static-contract:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate pinned dependency identity
        shell: bash
        run: |
          set -euxo pipefail
          source physics_app/dependencies.lock
          test "$MOOSE" = "$MOOSE_SHA"
          test "$CRANE" = "$CRANE_SHA"
          test "$SQUIRREL" = "$SQUIRREL_SHA"
          test "$ZAPDOS" = "$ZAPDOS_SHA"
          docker pull "$BUILD_BASE_REF"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.moose.sha" }}')" = "$MOOSE_SHA"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.crane.sha" }}')" = "$CRANE_SHA"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.squirrel.sha" }}')" = "$SQUIRREL_SHA"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.zapdos.sha" }}')" = "$ZAPDOS_SHA"

      - name: P0 runner unit and construction contract
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace \
            -e GITHUB_SHA="$GITHUB_SHA" \
            -v "$PWD:/workspace" "$BUILD_BASE_REF" -lc '
              set -euxo pipefail
              source /environment
              export PYTHONPATH=/workspace
              git config --global --add safe.directory /workspace
              test "$(git -C /workspace rev-parse HEAD)" = "$GITHUB_SHA"
              uv pip install --system --python "$(command -v python3)" -r requirements-evidence-engine.txt
              python3 -m py_compile /workspace/experiments/Issue224_element_aggregate_memory/run_parallel.py
              python3 /workspace/experiments/Issue224_element_aggregate_memory/run_parallel.py --self-test
            '

      - name: State P0 scope explicitly
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          P0 validates static/unit/construction contracts only.
          It does NOT authorize N-way fan-out.
          Fan-out authorization requires the P1 infrastructure canary to execute
          the same downloaded runtime bundle driver used by every science matrix job.
          EOF

  plan:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 224 &&
       github.event.comment.user.login == 'HyungseonSong-plasma' &&
       startsWith(github.event.comment.body, '/issue224-rss-fanout'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      base_sha: ${{ steps.parse.outputs.base_sha }}
      matrix: ${{ steps.parse.outputs.matrix }}
    steps:
      - name: Parse bounded fan-out request
        id: parse
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_BASE_SHA: ${{ inputs.base_sha }}
          DISPATCH_EXPERIMENTS_JSON: ${{ inputs.experiments_json }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          if os.environ['EVENT_NAME'] == 'workflow_dispatch':
              base_sha = os.environ['DISPATCH_BASE_SHA'].strip()
              experiments = json.loads(os.environ['DISPATCH_EXPERIMENTS_JSON'])
          else:
              lines = os.environ['COMMENT_BODY'].splitlines()
              if not lines or lines[0].strip() != '/issue224-rss-fanout':
                  raise SystemExit('invalid issue-comment command header')
              payload = json.loads('\n'.join(lines[1:]).strip())
              base_sha = str(payload.get('base_sha', '')).strip()
              experiments = payload.get('experiments')

          if not re.fullmatch(r'[0-9a-fA-F]{40}', base_sha):
              raise SystemExit(f'invalid base_sha: {base_sha!r}')
          if not isinstance(experiments, list) or not (1 <= len(experiments) <= 12):
              raise SystemExit('experiments must be a JSON list with 1..12 entries')

          ids = set()
          normalized = []
          for spec in experiments:
              if not isinstance(spec, dict):
                  raise SystemExit('each experiment spec must be an object')
              sid = spec.get('id')
              mode = spec.get('mode')
              if not isinstance(sid, str) or not re.fullmatch(r'[A-Za-z0-9_.-]{1,48}', sid):
                  raise SystemExit(f'invalid experiment id: {sid!r}')
              if sid in ids:
                  raise SystemExit(f'duplicate experiment id: {sid}')
              ids.add(sid)
              if mode not in {'keep_initial', 'cell_average'}:
                  raise SystemExit(f'unsupported mode for {sid}: {mode!r}')
              extra = sorted(set(spec) - {'id', 'mode', 'keep_paths', 'target_paths'})
              if extra:
                  raise SystemExit(f'unsupported keys for {sid}: {extra}')
              normalized.append(spec)

          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as f:
              f.write(f'base_sha={base_sha.lower()}\n')
              f.write('matrix<<EOF\n')
              f.write(json.dumps({'spec': normalized}, separators=(',', ':')) + '\n')
              f.write('EOF\n')
          print(json.dumps({'base_sha': base_sha.lower(), 'experiment_ids': sorted(ids)}))
          PY

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.parse.outputs.base_sha }}
          fetch-depth: 1

      - name: P1a validate specs against real production inventory
        env:
          EXPERIMENT_BASE_SHA: ${{ steps.parse.outputs.base_sha }}
          MATRIX_JSON: ${{ steps.parse.outputs.matrix }}
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPERIMENT_BASE_SHA"
          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace \
            -e EXPERIMENT_BASE_SHA="$EXPERIMENT_BASE_SHA" \
            -e MATRIX_JSON="$MATRIX_JSON" \
            -v "$PWD:/workspace" "$BUILD_BASE_REF" -lc '
              set -euxo pipefail
              source /environment
              export PYTHONPATH=/workspace
              git config --global --add safe.directory /workspace
              test "$(git -C /workspace rev-parse HEAD)" = "$EXPERIMENT_BASE_SHA"
              uv pip install --system --python "$(command -v python3)" -r requirements-evidence-engine.txt
              python3 - <<"PY"
          import json, os
          from experiments.Issue224_element_aggregate_memory import run_parallel as rp

          matrix = json.loads(os.environ["MATRIX_JSON"])
          text, _ = rp._production()
          accepted = rp._element_paths(text)
          assert len(accepted) == 57, len(accepted)
          normalized = [rp._validate_spec(spec, text) for spec in matrix["spec"]]
          print(json.dumps({
              "status": "PASS",
              "accepted_element_aggregate_count": len(accepted),
              "validated_specs": [spec["id"] for spec in normalized],
          }, indent=2, sort_keys=True))
          PY
            '

  build-runtime-bundle:
    needs: plan
    if: needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      build_key: ${{ steps.build-key.outputs.key }}
      cache_hit: ${{ steps.runtime-cache.outputs.cache-hit }}
      binary_sha256: ${{ steps.manifest.outputs.binary_sha256 }}
      bundle_sha256: ${{ steps.manifest.outputs.bundle_sha256 }}
      driver_sha256: ${{ steps.manifest.outputs.driver_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.base_sha }}
          fetch-depth: 1

      - name: Verify immutable build identity
        env:
          EXPERIMENT_BASE_SHA: ${{ needs.plan.outputs.base_sha }}
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPERIMENT_BASE_SHA"
          source physics_app/dependencies.lock
          test "$MOOSE" = "$MOOSE_SHA"
          test "$CRANE" = "$CRANE_SHA"
          test "$SQUIRREL" = "$SQUIRREL_SHA"
          test "$ZAPDOS" = "$ZAPDOS_SHA"
          docker pull "$BUILD_BASE_REF"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.moose.sha" }}')" = "$MOOSE_SHA"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.crane.sha" }}')" = "$CRANE_SHA"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.squirrel.sha" }}')" = "$SQUIRREL_SHA"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.zapdos.sha" }}')" = "$ZAPDOS_SHA"

      - name: Compute build-relevant cache key
        id: build-key
        shell: bash
        run: |
          set -euo pipefail
          physics_tree="$(git ls-files -s physics_app | sha256sum | awk '{print $1}')"
          vendor_identity="$(printf '%s\n' "$BUILD_BASE_REF" "$MOOSE_SHA" "$CRANE_SHA" "$SQUIRREL_SHA" "$ZAPDOS_SHA" 'METHOD=opt' | sha256sum | awk '{print $1}')"
          key="issue224-runtime-closure-v3-${physics_tree}-${vendor_identity}"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore exact runtime-closure cache
        id: runtime-cache
        uses: actions/cache@v4
        with:
          path: physics_app/.issue224-runtime-cache
          key: ${{ steps.build-key.outputs.key }}

      - name: Build runtime closure on exact cache miss
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        env:
          EXPERIMENT_BASE_SHA: ${{ needs.plan.outputs.base_sha }}
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf physics_app/.issue224-runtime-cache
          mkdir -p physics_app/.issue224-runtime-cache
          rm -f physics_app/physics-opt
          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace \
            -e EXPERIMENT_BASE_SHA="$EXPERIMENT_BASE_SHA" \
            -v "$PWD:/workspace" "$BUILD_BASE_REF" -lc '
              set -euxo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt
              test "$(git -C /workspace rev-parse HEAD)" = "$EXPERIMENT_BASE_SHA"
              make -C /workspace/physics_app -j2
              test -x /workspace/physics_app/physics-opt
              ldd /workspace/physics_app/physics-opt | tee /workspace/physics_app/.issue224-runtime-cache/build-ldd.txt
              ! grep -q "not found" /workspace/physics_app/.issue224-runtime-cache/build-ldd.txt
              test -d /workspace/physics_app/lib
              test -d /workspace/physics_app/test/lib
              tar -C /workspace/physics_app -czf /workspace/physics_app/.issue224-runtime-cache/runtime-bundle.tgz physics-opt lib test/lib
            '

      - name: Verify cached or newly built closure
        shell: bash
        run: |
          set -euxo pipefail
          test -f physics_app/.issue224-runtime-cache/runtime-bundle.tgz
          tar -tzf physics_app/.issue224-runtime-cache/runtime-bundle.tgz > /tmp/issue224-runtime-bundle.contents.txt
          grep -qx 'physics-opt' /tmp/issue224-runtime-bundle.contents.txt
          grep -q '^lib/.libs/libphysics-opt.so' /tmp/issue224-runtime-bundle.contents.txt
          grep -q '^test/lib/.libs/libphysics_test-opt.so' /tmp/issue224-runtime-bundle.contents.txt
          cp physics_app/.issue224-runtime-cache/runtime-bundle.tgz physics_app/issue224-runtime-bundle.tgz

      - name: Create single runtime driver used by canary and matrix
        shell: bash
        run: |
          set -euxo pipefail
          cat > physics_app/issue224-runtime-driver.sh <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail

          : "${EXPERIMENT_BASE_SHA:?}"
          : "${EXPECTED_BINARY_SHA256:?}"
          : "${EXPECTED_BUNDLE_SHA256:?}"
          : "${EXPECTED_DRIVER_SHA256:?}"
          : "${CONTROL_PLANE_SHA:?}"
          : "${SPEC_JSON:?}"
          : "${RESULTS_ROOT:?}"
          : "${BUILD_BASE_REF:?}"
          : "${MOOSE_SHA:?}"
          : "${CRANE_SHA:?}"
          : "${SQUIRREL_SHA:?}"
          : "${ZAPDOS_SHA:?}"

          rm -rf "$RESULTS_ROOT"
          mkdir -p "$RESULTS_ROOT"
          printf '%s\n' "$SPEC_JSON" > "$RESULTS_ROOT/requested_spec.json"
          phase="bootstrap"
          on_exit() {
            rc=$?
            trap - EXIT
            printf '{"phase":"%s","exit_code":%d}\n' "$phase" "$rc" > "$RESULTS_ROOT/runtime_driver_state.json"
            exit "$rc"
          }
          trap on_exit EXIT

          test "$(git rev-parse HEAD)" = "$EXPERIMENT_BASE_SHA"
          test -f physics_app/issue224-runtime-bundle.tgz
          test -f physics_app/issue224-runtime-bundle.manifest.json

          phase="artifact-integrity"
          read -r actual_bundle_sha256 _ < <(sha256sum physics_app/issue224-runtime-bundle.tgz)
          test "$actual_bundle_sha256" = "$EXPECTED_BUNDLE_SHA256"
          read -r actual_driver_sha256 _ < <(sha256sum physics_app/issue224-runtime-driver.sh)
          test "$actual_driver_sha256" = "$EXPECTED_DRIVER_SHA256"

          python3 - <<'PY'
          import json, os, tarfile
          from pathlib import Path

          manifest = json.loads(Path('physics_app/issue224-runtime-bundle.manifest.json').read_text())
          expected = {
              'experiment_base_sha': os.environ['EXPERIMENT_BASE_SHA'],
              'control_plane_sha': os.environ['CONTROL_PLANE_SHA'],
              'binary_sha256': os.environ['EXPECTED_BINARY_SHA256'],
              'bundle_sha256': os.environ['EXPECTED_BUNDLE_SHA256'],
              'driver_sha256': os.environ['EXPECTED_DRIVER_SHA256'],
              'build_base_ref': os.environ['BUILD_BASE_REF'],
              'moose_sha': os.environ['MOOSE_SHA'],
              'crane_sha': os.environ['CRANE_SHA'],
              'squirrel_sha': os.environ['SQUIRREL_SHA'],
              'zapdos_sha': os.environ['ZAPDOS_SHA'],
              'method': 'opt',
          }
          for key, value in expected.items():
              assert manifest.get(key) == value, (key, manifest.get(key), value)

          with tarfile.open('physics_app/issue224-runtime-bundle.tgz', 'r:gz') as tf:
              names = tf.getnames()
          assert names, 'empty runtime bundle'
          for name in names:
              p = Path(name)
              assert not p.is_absolute(), name
              assert '..' not in p.parts, name
              assert p.parts[0] in {'physics-opt', 'lib', 'test'}, name
          print({'manifest': manifest, 'bundle_members': len(names)})
          PY

          cp physics_app/issue224-runtime-bundle.manifest.json "$RESULTS_ROOT/runtime_bundle.manifest.json"
          printf '%s  %s\n' "$EXPECTED_DRIVER_SHA256" 'issue224-runtime-driver.sh' > "$RESULTS_ROOT/runtime_driver.sha256"

          phase="build-image-identity"
          docker pull "$BUILD_BASE_REF"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.moose.sha" }}')" = "$MOOSE_SHA"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.crane.sha" }}')" = "$CRANE_SHA"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.squirrel.sha" }}')" = "$SQUIRREL_SHA"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.zapdos.sha" }}')" = "$ZAPDOS_SHA"

          phase="clean-restore"
          test ! -e physics_app/physics-opt
          test ! -e physics_app/lib
          test ! -e physics_app/test/lib

          phase="runner"
          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace \
            -e GITHUB_SHA="$CONTROL_PLANE_SHA" \
            -e EXPERIMENT_BASE_SHA="$EXPERIMENT_BASE_SHA" \
            -e EXPECTED_BINARY_SHA256="$EXPECTED_BINARY_SHA256" \
            -e SPEC_JSON="$SPEC_JSON" \
            -e RESULTS_ROOT="$RESULTS_ROOT" \
            -v "$PWD:/workspace" "$BUILD_BASE_REF" -lc '
              set -euo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt
              export PYTHONPATH=/workspace

              test "$(git -C /workspace rev-parse HEAD)" = "$EXPERIMENT_BASE_SHA"
              tar -xzf /workspace/physics_app/issue224-runtime-bundle.tgz -C /workspace/physics_app
              test -x /workspace/physics_app/physics-opt
              read -r actual_binary_sha256 _ < <(sha256sum /workspace/physics_app/physics-opt)
              test "$actual_binary_sha256" = "$EXPECTED_BINARY_SHA256"
              ldd /workspace/physics_app/physics-opt | tee /tmp/issue224-restored-ldd.txt
              ! grep -q "not found" /tmp/issue224-restored-ldd.txt

              uv pip install --system --python "$(command -v python3)" -r requirements-evidence-engine.txt
              python3 -m py_compile /workspace/experiments/Issue224_element_aggregate_memory/run_parallel.py
              python3 /workspace/experiments/Issue224_element_aggregate_memory/run_parallel.py --self-test
              python3 /workspace/experiments/Issue224_element_aggregate_memory/run_parallel.py \
                --physics-opt /workspace/physics_app/physics-opt \
                --results-root "/workspace/$RESULTS_ROOT" \
                --spec-json "$SPEC_JSON" \
                --timeout 180
            '

          phase="evidence-contract"
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ['RESULTS_ROOT'])
          s = json.loads((root / 'summary.json').read_text())
          assert s['status'] == 'ISSUE224_PARALLEL_EVIDENCE_READY'
          assert s['base_sha'] == os.environ['EXPERIMENT_BASE_SHA']
          assert s['workflow_event_sha'] == os.environ['CONTROL_PLANE_SHA']
          assert s['physics_opt_sha256'] == os.environ['EXPECTED_BINARY_SHA256']
          assert s['physical_timesteps_authorized'] == 0
          assert s['decision']['production_control_drift']['stable'] is True
          assert s['decision']['low_control_reduction_classification'] == 'MAJOR'
          assert s['decision']['promotion_authorized'] is False
          assert s['decision']['full_r2_solve_executed'] is False
          for name in ('production_before', 'candidate', 'all_57_deferred', 'production_after'):
              case = s['cases'][name]
              assert case['hard_pass'] is True, name
              assert case['guards']['no_linear_solve'] is True, name
              assert case['guards']['no_physical_timestep'] is True, name
              assert case['guards']['num_steps_is_zero'] is True, name
          print({
              'STATUS': s['status'],
              'HYPOTHESIS': s['hypothesis_id'],
              'CANDIDATE_CLASS': s['decision']['candidate_reduction_classification'],
          })
          PY

          phase="complete"
          BASH
          chmod +x physics_app/issue224-runtime-driver.sh

      - name: Record runtime closure provenance
        id: manifest
        env:
          EXPERIMENT_BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          BUILD_KEY: ${{ steps.build-key.outputs.key }}
          CACHE_HIT: ${{ steps.runtime-cache.outputs.cache-hit }}
        shell: bash
        run: |
          set -euxo pipefail
          binary_sha256="$(tar -xOzf physics_app/issue224-runtime-bundle.tgz physics-opt | sha256sum | awk '{print $1}')"
          bundle_sha256="$(sha256sum physics_app/issue224-runtime-bundle.tgz | awk '{print $1}')"
          driver_sha256="$(sha256sum physics_app/issue224-runtime-driver.sh | awk '{print $1}')"
          runner_blob_sha="$(git hash-object experiments/Issue224_element_aggregate_memory/run_parallel.py)"
          export binary_sha256 bundle_sha256 driver_sha256 runner_blob_sha
          echo "binary_sha256=$binary_sha256" >> "$GITHUB_OUTPUT"
          echo "bundle_sha256=$bundle_sha256" >> "$GITHUB_OUTPUT"
          echo "driver_sha256=$driver_sha256" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          Path('physics_app/issue224-runtime-bundle.manifest.json').write_text(json.dumps({
              'experiment_base_sha': os.environ['EXPERIMENT_BASE_SHA'],
              'control_plane_sha': os.environ['GITHUB_SHA'],
              'build_key': os.environ['BUILD_KEY'],
              'cache_hit': os.environ.get('CACHE_HIT') == 'true',
              'binary_sha256': os.environ['binary_sha256'],
              'bundle_sha256': os.environ['bundle_sha256'],
              'driver_sha256': os.environ['driver_sha256'],
              'runner_blob_sha': os.environ['runner_blob_sha'],
              'build_base_ref': os.environ['BUILD_BASE_REF'],
              'moose_sha': os.environ['MOOSE_SHA'],
              'crane_sha': os.environ['CRANE_SHA'],
              'squirrel_sha': os.environ['SQUIRREL_SHA'],
              'zapdos_sha': os.environ['ZAPDOS_SHA'],
              'method': 'opt',
          }, indent=2, sort_keys=True) + '\n')
          PY

      - name: Upload shared runtime control package
        uses: actions/upload-artifact@v4
        with:
          name: issue224-v3-runtime-control-package
          path: |
            physics_app/issue224-runtime-bundle.tgz
            physics_app/issue224-runtime-bundle.manifest.json
            physics_app/issue224-runtime-driver.sh
          if-no-files-found: error
          retention-days: 1

  p1-infrastructure-canary:
    needs: [plan, build-runtime-bundle]
    if: needs.plan.result == 'success' && needs.build-runtime-bundle.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.base_sha }}
          fetch-depth: 1

      - name: Download exact runtime control package
        uses: actions/download-artifact@v4
        with:
          name: issue224-v3-runtime-control-package
          path: physics_app

      - name: Execute P1 canary through production runtime driver
        env:
          EXPERIMENT_BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          EXPECTED_BINARY_SHA256: ${{ needs.build-runtime-bundle.outputs.binary_sha256 }}
          EXPECTED_BUNDLE_SHA256: ${{ needs.build-runtime-bundle.outputs.bundle_sha256 }}
          EXPECTED_DRIVER_SHA256: ${{ needs.build-runtime-bundle.outputs.driver_sha256 }}
          CONTROL_PLANE_SHA: ${{ github.sha }}
          SPEC_JSON: '{"id":"INFRA-CANARY-domain-volume","mode":"keep_initial","keep_paths":["Postprocessors/domain_volume"]}'
          RESULTS_ROOT: issue224-v3-infra-canary-results
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPERIMENT_BASE_SHA"
          chmod +x physics_app/issue224-runtime-driver.sh
          physics_app/issue224-runtime-driver.sh
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          P1 infrastructure canary passed the same runtime driver used by the N-way matrix:
          artifact download -> manifest/hash verification -> clean restore -> ldd ->
          runner self-test -> P2 -> zero-step four-case measurement -> evidence contract.
          EOF

      - name: Upload canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue224-v3-infrastructure-canary-evidence
          path: issue224-v3-infra-canary-results/**
          if-no-files-found: error
          retention-days: 7

  hypothesis:
    needs: [plan, build-runtime-bundle, p1-infrastructure-canary]
    if: >-
      needs.plan.result == 'success' &&
      needs.build-runtime-bundle.result == 'success' &&
      needs.p1-infrastructure-canary.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.spec.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.base_sha }}
          fetch-depth: 1

      - name: Download exact runtime control package
        uses: actions/download-artifact@v4
        with:
          name: issue224-v3-runtime-control-package
          path: physics_app

      - name: Execute hypothesis through canary-proven runtime driver
        env:
          EXPERIMENT_BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          EXPECTED_BINARY_SHA256: ${{ needs.build-runtime-bundle.outputs.binary_sha256 }}
          EXPECTED_BUNDLE_SHA256: ${{ needs.build-runtime-bundle.outputs.bundle_sha256 }}
          EXPECTED_DRIVER_SHA256: ${{ needs.build-runtime-bundle.outputs.driver_sha256 }}
          CONTROL_PLANE_SHA: ${{ github.sha }}
          SPEC_JSON: ${{ toJSON(matrix.spec) }}
          RESULTS_ROOT: issue224-v3-${{ matrix.spec.id }}-results
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPERIMENT_BASE_SHA"
          chmod +x physics_app/issue224-runtime-driver.sh
          physics_app/issue224-runtime-driver.sh

      - name: Upload hypothesis evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue224-v3-${{ matrix.spec.id }}-evidence
          path: issue224-v3-${{ matrix.spec.id }}-results/**
          if-no-files-found: error
          retention-days: 7
