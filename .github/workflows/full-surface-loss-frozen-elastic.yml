name: full surface loss frozen elastic

on:
  push:
    branches: [ prototype-fully-implicit-electron-poisson ]
    paths:
      - 'experiments/implicit_logmolar_surface_loss/**'
      - 'physics_app/**'
      - '.github/workflows/full-surface-loss-frozen-elastic.yml'
  workflow_dispatch:

jobs:
  full-3x3-frozen-elastic:
    runs-on: ubuntu-24.04
    env:
      BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
    steps:
      - uses: actions/checkout@v4
      - run: docker pull "$BUILD_BASE_REF"
      - name: Build and run frozen-elastic full 3x3
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace -v "$GITHUB_WORKSPACE:/workspace" "$BUILD_BASE_REF" -lc '
            set -euo pipefail
            source /environment
            git config --global --add safe.directory /workspace
            git config --global --add safe.directory /opt/physics_vendor/moose
            git config --global --add safe.directory /opt/physics_vendor/crane
            git config --global --add safe.directory /opt/physics_vendor/squirrel
            git config --global --add safe.directory /opt/physics_vendor/zapdos
            export MOOSE_DIR=/opt/physics_vendor/moose CRANE_DIR=/opt/physics_vendor/crane SQUIRREL_DIR=/opt/physics_vendor/squirrel ZAPDOS_DIR=/opt/physics_vendor/zapdos METHOD=opt
            make -C physics_app -j2
            cd experiments/implicit_logmolar_surface_loss
            python3 prepare_frozen_elastic.py | tee frozen_elastic_prepare.txt
            ../../physics_app/physics-opt -i input_10step_frozen_elastic.i --check-input
            rm -rf full_frozen_elastic_0p1ns && mkdir full_frozen_elastic_0p1ns
            set +e
            ../../physics_app/physics-opt -i input_10step_frozen_elastic.i \
              "Executioner/dt=1e-10" "Executioner/dtmin=1e-10" "Executioner/dtmax=1e-10" \
              "Executioner/num_steps=10" "Executioner/end_time=1e-9" \
              "Executioner/nl_abs_tol=1e-10" "Executioner/nl_rel_tol=1e-9" "Executioner/nl_max_its=60" \
              "Outputs/file_base=full_frozen_elastic_0p1ns/solve" \
              > full_frozen_elastic_0p1ns/run.log 2>&1
            rc=$?
            set -e
            echo "run_rc=$rc" > full_frozen_elastic_0p1ns/status.txt
            cp frozen_elastic_prepare.txt input_10step_frozen_elastic.i full_frozen_elastic_0p1ns/
            grep -E "Time Step|SNES Function norm|CONVERGED|DIVERGED|Solve Converged|Solve Did NOT Converge|outside lookup range" full_frozen_elastic_0p1ns/run.log > full_frozen_elastic_0p1ns/summary.txt || true
            cat full_frozen_elastic_0p1ns/status.txt
            tail -n 220 full_frozen_elastic_0p1ns/summary.txt || true
          '
      - uses: actions/upload-artifact@v4
        with:
          name: full-surface-loss-frozen-elastic-0p1ns
          path: experiments/implicit_logmolar_surface_loss/full_frozen_elastic_0p1ns/**
          retention-days: 30
