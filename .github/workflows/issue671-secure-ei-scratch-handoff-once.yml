# Source-only protected handoff: never upload or log original kinetic table bytes.
name: Issue671 protected original EI rates to 417/941 disposable tmpfs Scratch
on:
  push:
    branches:
      - issue-671-secure-original-ei-scratch-handoff-20261118
    paths:
      - .github/workflows/issue671-secure-ei-scratch-handoff-once.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: issue671-protected-ei-rate-original-handoff-one-shot
  cancel-in-progress: false
jobs:
  original-rate-private-handoff:
    if: github.repository == 'HyungseonSong-plasma/moose-test-repo' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout source-only exact pinned historical ancestry
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse unreviewed code, unexpected source or extra changes before exposing secret
        shell: bash
        run: |
          set -euo pipefail
          BASE=395eeac274125ffa632b4d75a4531996dee24fe0
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e "$BASE^{commit}"
          git merge-base --is-ancestor "$BASE" HEAD
          git cat-file -e 9c15a4f0e2cf8042cb0d4b2f18af31511021d168^{commit}
          git cat-file -e 29d1acc6ef7969908b86719e4b95c73a1565136d^{commit}
          git diff --name-only "$BASE" "$GITHUB_SHA" | sort > "$RUNNER_TEMP/actual-files.txt"
          printf '%s\n' \
            .github/workflows/issue671-secure-ei-scratch-handoff-once.yml \
            ci/guards/issue671_secure_ei_rate_scratch.py \
            | sort > "$RUNNER_TEMP/approved-files.txt"
          diff -u "$RUNNER_TEMP/approved-files.txt" "$RUNNER_TEMP/actual-files.txt"
          python3 -m py_compile ci/guards/issue671_secure_ei_rate_scratch.py
          python3 ci/guards/issue671_secure_ei_rate_scratch.py --self-test
      - name: Download immutable public P3-X S6-417/941 source inputs only
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue671-public"
          curl --fail --location --silent --show-error --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/14406746397/zip" \
            --output "$RUNNER_TEMP/issue671-public/p3x-417-941.zip"
          echo "592a7c82834bab841f6a2e1807db305d0eff1e953f50a0dcc6d7e21ff8820111  $RUNNER_TEMP/issue671-public/p3x-417-941.zip" | sha256sum --check -
      - name: Rehash original protected six EI tables, stage five per case in tmpfs, then destroy
        shell: bash
        env:
          PROTECTED_ARCHIVE_B64: ${{ secrets.OXYGEN24_RATES_TAR_XZ_B64 }}
        run: |
          set -euo pipefail
          umask 077
          python3 ci/guards/issue671_secure_ei_rate_scratch.py \
            --source-zip "$RUNNER_TEMP/issue671-public/p3x-417-941.zip" \
            --source-head 395eeac274125ffa632b4d75a4531996dee24fe0 \
            --receipt "$RUNNER_TEMP/issue671_secure_rate_handoff_receipt.json"
      - name: Upload ONLY explicit SHA/count/equality receipt, never tables or scratch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue671-protected-original-ei-scratch-sha-only
          path: ${{ runner.temp }}/issue671_secure_rate_handoff_receipt.json
          if-no-files-found: warn
          retention-days: 7
