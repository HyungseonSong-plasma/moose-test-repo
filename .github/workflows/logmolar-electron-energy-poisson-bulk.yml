name: log-molar electron energy Poisson bulk

on:
  push:
    branches:
      - prototype-fully-implicit-electron-poisson
    paths:
      - 'experiments/implicit_logmolar_electron_energy_poisson/**'
      - 'physics_app/**'
      - '.github/workflows/logmolar-electron-energy-poisson-bulk.yml'
  workflow_dispatch:

jobs:
  bulk:
    name: logmolar-3x3-bulk
    runs-on: ubuntu-24.04
    env:
      BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
    steps:
      - uses: actions/checkout@v4

      - name: Pull Physics build base
        run: docker pull "$BUILD_BASE_REF"

      - name: Build and run log-molar 3x3 bulk
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint /bin/bash \
            --user 0:0 \
            --workdir /workspace \
            -v "$GITHUB_WORKSPACE:/workspace" \
            "$BUILD_BASE_REF" \
            -lc '
              set -euo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory /opt/physics_vendor/moose
              git config --global --add safe.directory /opt/physics_vendor/crane
              git config --global --add safe.directory /opt/physics_vendor/squirrel
              git config --global --add safe.directory /opt/physics_vendor/zapdos
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt

              make -C physics_app -j2
              cd experiments/implicit_logmolar_electron_energy_poisson
              mkdir -p results

              ../../physics_app/physics-opt --check-input -i input_bulk.i \
                > results/check-input.log 2>&1

              set +e
              ../../physics_app/physics-opt -i input_bulk.i \
                "Executioner/nl_max_its=1" \
                "Outputs/file_base=results/jacobian" \
                -snes_test_jacobian \
                > results/jacobian.log 2>&1
              jac_rc=$?

              ../../physics_app/physics-opt -i input_bulk.i \
                "Outputs/file_base=results/solve" \
                > results/solve.log 2>&1
              solve_rc=$?
              set -e

              printf "jacobian_rc=%s\nsolve_rc=%s\n" "$jac_rc" "$solve_rc" > results/status.txt
              grep -E "J - Jfd|Jfd|SNES Function norm|CONVERGED|DIVERGED" results/jacobian.log > results/jacobian_summary.txt || true
              grep -E "SNES Function norm|CONVERGED|DIVERGED|Solve Converged|Solve Did NOT Converge" results/solve.log > results/solve_summary.txt || true
              cat results/status.txt
              cat results/jacobian_summary.txt || true
              cat results/solve_summary.txt || true
            '

      - name: Upload diagnostic output
        uses: actions/upload-artifact@v4
        with:
          name: logmolar-electron-energy-poisson-bulk
          path: experiments/implicit_logmolar_electron_energy_poisson/results/**
          retention-days: 30
