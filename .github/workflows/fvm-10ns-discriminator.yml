name: FVM 10 ns plasma discriminator

on:
  push:
    branches:
      - prototype-fully-implicit-electron-poisson
    paths:
      - 'experiments/fem_fvm_plasma_discriminator/.run10ns'
  workflow_dispatch:

jobs:
  fvm10ns:
    name: plasma-fvm-dt1ns-10steps
    runs-on: ubuntu-24.04
    env:
      BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008

    steps:
      - uses: actions/checkout@v4

      - name: Pull build image
        run: docker pull "$BUILD_BASE_REF"

      - name: Build and run FVM 10 ns discriminator
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash --user 0:0 \
            --workdir /workspace \
            -v "$GITHUB_WORKSPACE:/workspace" \
            "$BUILD_BASE_REF" -lc '
              set -euo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory /opt/physics_vendor/moose
              git config --global --add safe.directory /opt/physics_vendor/crane
              git config --global --add safe.directory /opt/physics_vendor/squirrel
              git config --global --add safe.directory /opt/physics_vendor/zapdos
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt

              make -C physics_app -j2
              cd experiments/fem_fvm_plasma_discriminator
              python3 prepare_fvm_10ns.py

              INPUT="fvm_plasma_discriminator_10ns.i"
              OUTDIR="output_fvm_10ns"

              ../../physics_app/physics-opt -i "$INPUT" --check-input

              rm -rf "$OUTDIR"
              mkdir -p "$OUTDIR"
              set +e
              /usr/bin/time \
                -f "wall_seconds=%e\nuser_seconds=%U\nsystem_seconds=%S\nmax_rss_kb=%M" \
                -o "$OUTDIR/wall_time.txt" \
                timeout --signal=TERM 120m stdbuf -oL -eL \
                ../../physics_app/physics-opt -i "$INPUT" \
                > "$OUTDIR/run.log" 2>&1
              rc=$?
              set -e

              echo "run_rc=$rc" | tee "$OUTDIR/status.txt"
              cp "$INPUT" prepare_cases.py prepare_cases_plasma_only.py prepare_fvm_10ns.py "$OUTDIR/"
              cp "${INPUT%.i}_out.csv" "$OUTDIR/" 2>/dev/null || true
              cp "${INPUT%.i}_out.e" "$OUTDIR/" 2>/dev/null || true
              tail -n 400 "$OUTDIR/run.log" > "$OUTDIR/tail.log" || true
              exit "$rc"
            '

      - name: Upload FVM 10 ns result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fem-fvm-plasma-fvm-dt1ns-10steps
          path: experiments/fem_fvm_plasma_discriminator/output_fvm_10ns/**
          retention-days: 30
