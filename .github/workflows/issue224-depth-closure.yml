name: Issue-224 depth-aware closure packets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue224-depth-closure.yml'
      - 'experiments/Issue224_element_aggregate_memory/run_depth_closure.py'
  workflow_dispatch:
    inputs:
      base_sha:
        description: 'Immutable experiment base SHA (40 hex chars)'
        required: true
        type: string
      packets_json:
        description: 'JSON array of 1..20 depth-aware closure packets'
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

concurrency:
  group: issue224-depth-closure-${{ github.event_name }}-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

env:
  BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
  MOOSE_SHA: 9f388366ccf38b9c34542ec5561198249fde0ac9
  CRANE_SHA: ba26970cf419dcac563a20ed7079d445bc6341c3
  SQUIRREL_SHA: 16a26d504f3ee11161a86d4e3ebf3c0e5f2afbb1
  ZAPDOS_SHA: 9eceffbc46048c3760bbfa9a7f1ca681ae35af1d

jobs:
  p0-static-contract:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate pinned dependency identity
        shell: bash
        run: |
          set -euxo pipefail
          source physics_app/dependencies.lock
          test "$MOOSE" = "$MOOSE_SHA"
          test "$CRANE" = "$CRANE_SHA"
          test "$SQUIRREL" = "$SQUIRREL_SHA"
          test "$ZAPDOS" = "$ZAPDOS_SHA"
          docker pull "$BUILD_BASE_REF"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.moose.sha" }}')" = "$MOOSE_SHA"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.crane.sha" }}')" = "$CRANE_SHA"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.squirrel.sha" }}')" = "$SQUIRREL_SHA"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.zapdos.sha" }}')" = "$ZAPDOS_SHA"

      - name: P0 depth-runner self-test
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace \
            -e GITHUB_SHA="$GITHUB_SHA" \
            -v "$PWD:/workspace" "$BUILD_BASE_REF" -lc '
              set -euxo pipefail
              source /environment
              export PYTHONPATH=/workspace
              git config --global --add safe.directory /workspace
              test "$(git -C /workspace rev-parse HEAD)" = "$GITHUB_SHA"
              uv pip install --system --python "$(command -v python3)" -r requirements-evidence-engine.txt
              python3 -m py_compile /workspace/experiments/Issue224_element_aggregate_memory/run_depth_closure.py
              python3 /workspace/experiments/Issue224_element_aggregate_memory/run_depth_closure.py --self-test
            '

      - name: State P0 boundary
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          P0 validates depth-packet schema, mutation guards, and inherited v3 construction self-tests only.
          No science fan-out is authorized by this push job. The issue-comment/dispatch path has its own
          immutable-base plan gate, shared runtime build, infrastructure canary, and isolated 20-way matrix.
          EOF

  plan:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 224 &&
       github.event.comment.user.login == 'HyungseonSong-plasma' &&
       startsWith(github.event.comment.body, '/issue224-depth-closure'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      base_sha: ${{ steps.parse.outputs.base_sha }}
      matrix: ${{ steps.parse.outputs.matrix }}
    steps:
      - name: Parse bounded depth-aware request
        id: parse
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_BASE_SHA: ${{ inputs.base_sha }}
          DISPATCH_PACKETS_JSON: ${{ inputs.packets_json }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          if os.environ['EVENT_NAME'] == 'workflow_dispatch':
              base_sha = os.environ['DISPATCH_BASE_SHA'].strip()
              packets = json.loads(os.environ['DISPATCH_PACKETS_JSON'])
          else:
              lines = os.environ['COMMENT_BODY'].splitlines()
              if not lines or lines[0].strip() != '/issue224-depth-closure':
                  raise SystemExit('invalid issue-comment command header')
              payload = json.loads('\n'.join(lines[1:]).strip())
              base_sha = str(payload.get('base_sha', '')).strip()
              packets = payload.get('packets')

          if not re.fullmatch(r'[0-9a-fA-F]{40}', base_sha):
              raise SystemExit(f'invalid base_sha: {base_sha!r}')
          if not isinstance(packets, list) or not (1 <= len(packets) <= 20):
              raise SystemExit('packets must be a JSON list with 1..20 entries')

          ids = set()
          for packet in packets:
              if not isinstance(packet, dict):
                  raise SystemExit('each packet must be an object')
              pid = packet.get('id')
              if not isinstance(pid, str) or not re.fullmatch(r'[A-Za-z0-9_.-]{1,64}', pid):
                  raise SystemExit(f'invalid packet id: {pid!r}')
              if pid in ids:
                  raise SystemExit(f'duplicate packet id: {pid}')
              ids.add(pid)

          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as f:
              f.write(f'base_sha={base_sha.lower()}\n')
              f.write('matrix<<EOF\n')
              f.write(json.dumps({'packet': packets}, separators=(',', ':')) + '\n')
              f.write('EOF\n')
          print(json.dumps({'base_sha': base_sha.lower(), 'packet_count': len(packets), 'packet_ids': sorted(ids)}))
          PY

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.parse.outputs.base_sha }}
          fetch-depth: 1

      - name: P1 validate every packet against exact production inventory
        env:
          EXPERIMENT_BASE_SHA: ${{ steps.parse.outputs.base_sha }}
          MATRIX_JSON: ${{ steps.parse.outputs.matrix }}
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPERIMENT_BASE_SHA"
          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace \
            -e EXPERIMENT_BASE_SHA="$EXPERIMENT_BASE_SHA" \
            -e MATRIX_JSON="$MATRIX_JSON" \
            -v "$PWD:/workspace" "$BUILD_BASE_REF" -lc '
              set -euxo pipefail
              source /environment
              export PYTHONPATH=/workspace
              git config --global --add safe.directory /workspace
              test "$(git -C /workspace rev-parse HEAD)" = "$EXPERIMENT_BASE_SHA"
              uv pip install --system --python "$(command -v python3)" -r requirements-evidence-engine.txt
              python3 - <<"PY"
          import json, os
          from experiments.Issue224_element_aggregate_memory import run_depth_closure as rd

          matrix = json.loads(os.environ["MATRIX_JSON"])
          normalized = [rd._validate_packet(packet) for packet in matrix["packet"]]
          print(json.dumps({
              "status": "PASS",
              "packet_count": len(normalized),
              "packets": [
                  {
                      "id": packet["id"],
                      "depth": packet["depth"],
                      "regime": packet["regime"],
                      "case_count": len(packet["cases"]),
                  }
                  for packet in normalized
              ],
          }, indent=2, sort_keys=True))
          PY
            '

  build-runtime-bundle:
    needs: plan
    if: needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      binary_sha256: ${{ steps.manifest.outputs.binary_sha256 }}
      bundle_sha256: ${{ steps.manifest.outputs.bundle_sha256 }}
      driver_sha256: ${{ steps.manifest.outputs.driver_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.base_sha }}
          fetch-depth: 1

      - name: Verify immutable build identity
        env:
          EXPERIMENT_BASE_SHA: ${{ needs.plan.outputs.base_sha }}
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPERIMENT_BASE_SHA"
          source physics_app/dependencies.lock
          test "$MOOSE" = "$MOOSE_SHA"
          test "$CRANE" = "$CRANE_SHA"
          test "$SQUIRREL" = "$SQUIRREL_SHA"
          test "$ZAPDOS" = "$ZAPDOS_SHA"
          docker pull "$BUILD_BASE_REF"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.moose.sha" }}')" = "$MOOSE_SHA"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.crane.sha" }}')" = "$CRANE_SHA"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.squirrel.sha" }}')" = "$SQUIRREL_SHA"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.zapdos.sha" }}')" = "$ZAPDOS_SHA"

      - name: Build exact runtime bundle once
        env:
          EXPERIMENT_BASE_SHA: ${{ needs.plan.outputs.base_sha }}
        shell: bash
        run: |
          set -euxo pipefail
          rm -f physics_app/physics-opt
          rm -rf physics_app/lib physics_app/test/lib
          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace \
            -e EXPERIMENT_BASE_SHA="$EXPERIMENT_BASE_SHA" \
            -v "$PWD:/workspace" "$BUILD_BASE_REF" -lc '
              set -euxo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt
              test "$(git -C /workspace rev-parse HEAD)" = "$EXPERIMENT_BASE_SHA"
              make -C /workspace/physics_app -j2
              test -x /workspace/physics_app/physics-opt
              ldd /workspace/physics_app/physics-opt | tee /tmp/issue224-depth-build-ldd.txt
              ! grep -q "not found" /tmp/issue224-depth-build-ldd.txt
              test -d /workspace/physics_app/lib
              test -d /workspace/physics_app/test/lib
              tar -C /workspace/physics_app -czf /workspace/physics_app/issue224-depth-runtime-bundle.tgz physics-opt lib test/lib
            '

      - name: Create shared runtime driver
        shell: bash
        run: |
          set -euxo pipefail
          cat > physics_app/issue224-depth-runtime-driver.sh <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail
          : "${EXPERIMENT_BASE_SHA:?}"
          : "${CONTROL_PLANE_SHA:?}"
          : "${EXPECTED_BINARY_SHA256:?}"
          : "${EXPECTED_BUNDLE_SHA256:?}"
          : "${EXPECTED_DRIVER_SHA256:?}"
          : "${PACKET_JSON:?}"
          : "${RESULTS_ROOT:?}"
          : "${BUILD_BASE_REF:?}"
          : "${MOOSE_SHA:?}"
          : "${CRANE_SHA:?}"
          : "${SQUIRREL_SHA:?}"
          : "${ZAPDOS_SHA:?}"

          rm -rf "$RESULTS_ROOT"
          mkdir -p "$RESULTS_ROOT"
          printf '%s\n' "$PACKET_JSON" > "$RESULTS_ROOT/requested_packet.raw.json"
          test "$(git rev-parse HEAD)" = "$EXPERIMENT_BASE_SHA"
          test -f physics_app/issue224-depth-runtime-bundle.tgz
          test -f physics_app/issue224-depth-runtime-bundle.manifest.json
          read -r actual_bundle _ < <(sha256sum physics_app/issue224-depth-runtime-bundle.tgz)
          test "$actual_bundle" = "$EXPECTED_BUNDLE_SHA256"
          read -r actual_driver _ < <(sha256sum physics_app/issue224-depth-runtime-driver.sh)
          test "$actual_driver" = "$EXPECTED_DRIVER_SHA256"

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path('physics_app/issue224-depth-runtime-bundle.manifest.json').read_text())
          expected = {
              'experiment_base_sha': os.environ['EXPERIMENT_BASE_SHA'],
              'control_plane_sha': os.environ['CONTROL_PLANE_SHA'],
              'binary_sha256': os.environ['EXPECTED_BINARY_SHA256'],
              'bundle_sha256': os.environ['EXPECTED_BUNDLE_SHA256'],
              'driver_sha256': os.environ['EXPECTED_DRIVER_SHA256'],
              'build_base_ref': os.environ['BUILD_BASE_REF'],
              'moose_sha': os.environ['MOOSE_SHA'],
              'crane_sha': os.environ['CRANE_SHA'],
              'squirrel_sha': os.environ['SQUIRREL_SHA'],
              'zapdos_sha': os.environ['ZAPDOS_SHA'],
          }
          for key, value in expected.items():
              assert manifest.get(key) == value, (key, manifest.get(key), value)
          PY

          docker pull "$BUILD_BASE_REF"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.moose.sha" }}')" = "$MOOSE_SHA"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.crane.sha" }}')" = "$CRANE_SHA"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.squirrel.sha" }}')" = "$SQUIRREL_SHA"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.zapdos.sha" }}')" = "$ZAPDOS_SHA"

          rm -f physics_app/physics-opt
          rm -rf physics_app/lib physics_app/test/lib
          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace \
            -e GITHUB_SHA="$CONTROL_PLANE_SHA" \
            -e EXPERIMENT_BASE_SHA="$EXPERIMENT_BASE_SHA" \
            -e EXPECTED_BINARY_SHA256="$EXPECTED_BINARY_SHA256" \
            -e PACKET_JSON="$PACKET_JSON" \
            -e RESULTS_ROOT="$RESULTS_ROOT" \
            -v "$PWD:/workspace" "$BUILD_BASE_REF" -lc '
              set -euxo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt
              export PYTHONPATH=/workspace
              test "$(git -C /workspace rev-parse HEAD)" = "$EXPERIMENT_BASE_SHA"
              tar -xzf /workspace/physics_app/issue224-depth-runtime-bundle.tgz -C /workspace/physics_app
              test -x /workspace/physics_app/physics-opt
              read -r actual_binary _ < <(sha256sum /workspace/physics_app/physics-opt)
              test "$actual_binary" = "$EXPECTED_BINARY_SHA256"
              ldd /workspace/physics_app/physics-opt | tee /tmp/issue224-depth-restored-ldd.txt
              ! grep -q "not found" /tmp/issue224-depth-restored-ldd.txt
              uv pip install --system --python "$(command -v python3)" -r requirements-evidence-engine.txt
              python3 -m py_compile /workspace/experiments/Issue224_element_aggregate_memory/run_depth_closure.py
              python3 /workspace/experiments/Issue224_element_aggregate_memory/run_depth_closure.py --self-test
              python3 /workspace/experiments/Issue224_element_aggregate_memory/run_depth_closure.py \
                --physics-opt /workspace/physics_app/physics-opt \
                --results-root "/workspace/$RESULTS_ROOT" \
                --packet-json "$PACKET_JSON" \
                --timeout 1800
            '

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RESULTS_ROOT'])
          s = json.loads((root / 'summary.json').read_text())
          assert s['status'] == 'ISSUE224_DEPTH_EVIDENCE_READY', s['status']
          assert s['base_sha'] == os.environ['EXPERIMENT_BASE_SHA']
          assert s['workflow_event_sha'] == os.environ['CONTROL_PLANE_SHA']
          assert s['physics_opt_sha256'] == os.environ['EXPECTED_BINARY_SHA256']
          assert s['promotion_authorized'] is False
          assert s['p0']['status'] == 'PASS'
          assert s['cases']['production_before']['hard_pass'] is True
          assert s['cases']['production_after']['hard_pass'] is True
          if s['regime'] == 'zero_step':
              assert s['cases']['all_57_deferred']['hard_pass'] is True
              assert s['decision']['production_control_drift']['stable'] is True
              assert s['decision']['low_control_reduction_classification'] == 'MAJOR'
          else:
              assert s['decision']['production_control_endpoint_parity']['pass'] is True
          print({'STATUS': s['status'], 'PACKET': s['packet']['id'], 'DEPTH': s['packet']['depth'], 'REGIME': s['regime']})
          PY
          BASH
          chmod +x physics_app/issue224-depth-runtime-driver.sh

      - name: Record runtime bundle provenance
        id: manifest
        env:
          EXPERIMENT_BASE_SHA: ${{ needs.plan.outputs.base_sha }}
        shell: bash
        run: |
          set -euxo pipefail
          binary_sha256="$(tar -xOzf physics_app/issue224-depth-runtime-bundle.tgz physics-opt | sha256sum | awk '{print $1}')"
          bundle_sha256="$(sha256sum physics_app/issue224-depth-runtime-bundle.tgz | awk '{print $1}')"
          driver_sha256="$(sha256sum physics_app/issue224-depth-runtime-driver.sh | awk '{print $1}')"
          runner_blob_sha="$(git hash-object experiments/Issue224_element_aggregate_memory/run_depth_closure.py)"
          export binary_sha256 bundle_sha256 driver_sha256 runner_blob_sha
          echo "binary_sha256=$binary_sha256" >> "$GITHUB_OUTPUT"
          echo "bundle_sha256=$bundle_sha256" >> "$GITHUB_OUTPUT"
          echo "driver_sha256=$driver_sha256" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('physics_app/issue224-depth-runtime-bundle.manifest.json').write_text(json.dumps({
              'experiment_base_sha': os.environ['EXPERIMENT_BASE_SHA'],
              'control_plane_sha': os.environ['GITHUB_SHA'],
              'binary_sha256': os.environ['binary_sha256'],
              'bundle_sha256': os.environ['bundle_sha256'],
              'driver_sha256': os.environ['driver_sha256'],
              'runner_blob_sha': os.environ['runner_blob_sha'],
              'build_base_ref': os.environ['BUILD_BASE_REF'],
              'moose_sha': os.environ['MOOSE_SHA'],
              'crane_sha': os.environ['CRANE_SHA'],
              'squirrel_sha': os.environ['SQUIRREL_SHA'],
              'zapdos_sha': os.environ['ZAPDOS_SHA'],
              'method': 'opt',
          }, indent=2, sort_keys=True) + '\n')
          PY

      - name: Upload shared runtime control package
        uses: actions/upload-artifact@v4
        with:
          name: issue224-depth-runtime-control-package
          path: |
            physics_app/issue224-depth-runtime-bundle.tgz
            physics_app/issue224-depth-runtime-bundle.manifest.json
            physics_app/issue224-depth-runtime-driver.sh
          if-no-files-found: error
          retention-days: 1

  p1-infrastructure-canary:
    needs: [plan, build-runtime-bundle]
    if: needs.plan.result == 'success' && needs.build-runtime-bundle.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.base_sha }}
          fetch-depth: 1

      - name: Download exact runtime control package
        uses: actions/download-artifact@v4
        with:
          name: issue224-depth-runtime-control-package
          path: physics_app

      - name: Execute same runtime driver used by matrix
        env:
          EXPERIMENT_BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          CONTROL_PLANE_SHA: ${{ github.sha }}
          EXPECTED_BINARY_SHA256: ${{ needs.build-runtime-bundle.outputs.binary_sha256 }}
          EXPECTED_BUNDLE_SHA256: ${{ needs.build-runtime-bundle.outputs.bundle_sha256 }}
          EXPECTED_DRIVER_SHA256: ${{ needs.build-runtime-bundle.outputs.driver_sha256 }}
          PACKET_JSON: >-
            {"id":"INFRA-CANARY","depth":1,"regime":"zero_step","question":"artifact restore and dense runner infrastructure canary","cases":[{"id":"domain-volume-only","schedule":"only","paths":["Postprocessors/domain_volume"],"role":"infrastructure-canary","mutations":[]}]}
          RESULTS_ROOT: issue224-depth-infra-canary-results
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPERIMENT_BASE_SHA"
          chmod +x physics_app/issue224-depth-runtime-driver.sh
          physics_app/issue224-depth-runtime-driver.sh

      - name: Upload canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue224-depth-infrastructure-canary-evidence
          path: issue224-depth-infra-canary-results/**
          if-no-files-found: error
          retention-days: 7

  closure-packet:
    needs: [plan, build-runtime-bundle, p1-infrastructure-canary]
    if: >-
      needs.plan.result == 'success' &&
      needs.build-runtime-bundle.result == 'success' &&
      needs.p1-infrastructure-canary.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.packet.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.base_sha }}
          fetch-depth: 1

      - name: Download exact runtime control package
        uses: actions/download-artifact@v4
        with:
          name: issue224-depth-runtime-control-package
          path: physics_app

      - name: Execute depth-aware closure packet
        env:
          EXPERIMENT_BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          CONTROL_PLANE_SHA: ${{ github.sha }}
          EXPECTED_BINARY_SHA256: ${{ needs.build-runtime-bundle.outputs.binary_sha256 }}
          EXPECTED_BUNDLE_SHA256: ${{ needs.build-runtime-bundle.outputs.bundle_sha256 }}
          EXPECTED_DRIVER_SHA256: ${{ needs.build-runtime-bundle.outputs.driver_sha256 }}
          PACKET_JSON: ${{ toJSON(matrix.packet) }}
          RESULTS_ROOT: issue224-depth-${{ matrix.packet.id }}-results
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPERIMENT_BASE_SHA"
          chmod +x physics_app/issue224-depth-runtime-driver.sh
          physics_app/issue224-depth-runtime-driver.sh

      - name: Upload packet evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue224-depth-${{ matrix.packet.id }}-evidence
          path: issue224-depth-${{ matrix.packet.id }}-results/**
          if-no-files-found: error
          retention-days: 7
