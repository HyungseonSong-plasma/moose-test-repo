name: Issue 395 A0-A1 powered chemistry check-input

on:
  push:
    branches:
      - issue395-powered-chemistry-ladder
    paths:
      - '.github/workflows/issue395-a0-a1-check-input.yml'
      - 'experiments/Issue395_powered_chemistry_ladder/**'
      - 'experiments/Issue3_dielectric_surface_charge/**'
      - 'experiments/fem_fvm_plasma_discriminator/**'
      - 'physics_app/**'

permissions:
  contents: read

jobs:
  a0-a1-check-input:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
      CHEM: experiments/Issue395_powered_chemistry_ladder
      DIEL: experiments/Issue3_dielectric_surface_charge
      BASE: experiments/fem_fvm_plasma_discriminator

    steps:
      - name: Checkout exact pushed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify exact source revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install host geometry dependencies
        shell: bash
        run: python3 -m pip install --disable-pip-version-check --quiet numpy==2.1.2 scipy==1.14.1

      - name: Validate Issue 395 activation contract
        shell: bash
        run: |
          set -euo pipefail
          python3 "$CHEM/check_chemistry_sets.py"
          python3 -m py_compile "$CHEM/build_a1_chemistry_overlay.py"

      - name: Materialize chemistry-off full dielectric powered-plasma input
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$CHEM/generated"
          mkdir -p "$CHEM/generated"

          python3 "$BASE/generate_contour_mesh.py" > "$CHEM/generated/mesh_plasma.log" 2>&1
          python3 "$DIEL/extend_cover_mesh.py" \
            "$BASE/plasma_contour_l3_4p5mm.msh" "$DIEL/baseline_cover_fine_source.msh" \
            > "$CHEM/generated/mesh_cover.log" 2>&1
          python3 "$DIEL/build_unstructured_cover_wafer_mesh.py" \
            "$DIEL/baseline_cover_fine_source.msh" "$DIEL/baseline_plasma_plus_unstructured_cover_plus_wafer.msh" \
            > "$CHEM/generated/mesh_cover_wafer.log" 2>&1
          python3 "$DIEL/add_focus_ring_block.py" \
            "$DIEL/baseline_plasma_plus_unstructured_cover_plus_wafer.msh" "$DIEL/baseline_plasma_plus_unstructured_cover_plus_wafer.msh" \
            > "$CHEM/generated/mesh_focus_ring.log" 2>&1
          python3 "$DIEL/add_vacuum_coils_block.py" \
            "$DIEL/baseline_plasma_plus_unstructured_cover_plus_wafer.msh" "$DIEL/baseline_plasma_plus_unstructured_cover_plus_wafer.msh" \
            > "$CHEM/generated/mesh_vacuum_coils.log" 2>&1

          cp "$DIEL/baseline_plasma_plus_unstructured_cover_plus_wafer.msh" \
             "$CHEM/baseline_plasma_plus_unstructured_cover_plus_wafer.msh"

          python3 "$DIEL/prepare_baseline_cover_pilot.py" "$CHEM/a0_full_icp.i" \
            > "$CHEM/generated/materialize.log" 2>&1
          python3 "$DIEL/finalize_baseline_cover_pilot.py" "$CHEM/a0_full_icp.i" \
            > "$CHEM/generated/finalize.log" 2>&1
          python3 "$DIEL/promote_cover_wafer_15us.py" "$CHEM/a0_full_icp.i" \
            > "$CHEM/generated/wafer.log" 2>&1
          python3 "$DIEL/promote_focus_ring_15us.py" "$CHEM/a0_full_icp.i" \
            > "$CHEM/generated/focus.log" 2>&1
          python3 "$DIEL/promote_vacuum_coils_15us.py" "$CHEM/a0_full_icp.i" \
            > "$CHEM/generated/vacuum.log" 2>&1

          cp physics_app/data/electron_impact/o2_elastic.txt "$CHEM/o2_elastic.txt"
          cp physics_app/data/electron_impact/o2_ionization.txt "$CHEM/o2_ionization.txt"

          python3 "$CHEM/build_a1_chemistry_overlay.py" \
            --base-input "$CHEM/a0_full_icp.i" \
            --output "$CHEM/a1_chemistry_overlay.i" \
            --ei02-table o2_elastic.txt \
            --ei16-table o2_ionization.txt \
            | tee "$CHEM/generated/overlay.log"

          grep -q 'type = PhysicsElectronImpactRateMaterial' "$CHEM/a1_chemistry_overlay.i"
          grep -q 'type = PhysicsElectronImpactIonizationMaterial' "$CHEM/a1_chemistry_overlay.i"
          grep -q 'variable = log_ne' "$CHEM/a1_chemistry_overlay.i"
          grep -q 'variable = log_ni' "$CHEM/a1_chemistry_overlay.i"
          grep -q 'variable = log_energy' "$CHEM/a1_chemistry_overlay.i"
          grep -q 'variable = p' "$CHEM/a1_chemistry_overlay.i"

      - name: Pull pinned Physics build environment
        shell: bash
        run: docker pull "$BUILD_BASE_REF"

      - name: Build exact-head Physics application
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash --user 0:0 \
            --workdir /workspace -v "$GITHUB_WORKSPACE:/workspace" \
            "$BUILD_BASE_REF" -lc '
              set -euo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory /opt/physics_vendor/moose
              git config --global --add safe.directory /opt/physics_vendor/crane
              git config --global --add safe.directory /opt/physics_vendor/squirrel
              git config --global --add safe.directory /opt/physics_vendor/zapdos
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt
              make -C physics_app -j2
            '
          test -x physics_app/physics-opt

      - name: A0 chemistry-off check-input
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash --user 0:0 \
            --workdir /workspace -v "$GITHUB_WORKSPACE:/workspace" \
            "$BUILD_BASE_REF" -lc "
              set -euo pipefail
              source /environment
              cd '$CHEM'
              ../../physics_app/physics-opt -i a0_full_icp.i --check-input
            " 2>&1 | tee "$CHEM/generated/a0_check.log"

      - name: A1 EI02+EI16 check-input
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash --user 0:0 \
            --workdir /workspace -v "$GITHUB_WORKSPACE:/workspace" \
            "$BUILD_BASE_REF" -lc "
              set -euo pipefail
              source /environment
              cd '$CHEM'
              ../../physics_app/physics-opt -i a0_full_icp.i a1_chemistry_overlay.i --check-input
            " 2>&1 | tee "$CHEM/generated/a1_check.log"

      - name: Upload A0-A1 construction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue395-a0-a1-check-input-evidence
          path: |
            experiments/Issue395_powered_chemistry_ladder/generated/**
            experiments/Issue395_powered_chemistry_ladder/a0_full_icp.i
            experiments/Issue395_powered_chemistry_ladder/a1_chemistry_overlay.i
            experiments/Issue395_powered_chemistry_ladder/chemistry_sets.json
            experiments/Issue395_powered_chemistry_ladder/build_a1_chemistry_overlay.py
          if-no-files-found: warn
          retention-days: 30
