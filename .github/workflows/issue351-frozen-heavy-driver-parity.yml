name: Issue351 Frozen Heavy Driver Parity

on:
  push:
    branches:
      - issue-plasma-closures-gummel-heavy
    paths:
      - 'experiments/Issue351_frozen_heavy_driver_parity/**'
      - 'physics_app/include/**'
      - 'physics_app/src/**'
      - '.github/workflows/issue351-frozen-heavy-driver-parity.yml'

permissions:
  contents: read
  packages: read

env:
  BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
  QUALIFIED_SOURCE: c9726d45e912f2476958d580c88e3421b5d4868b

jobs:
  short-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Verify exact source head
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Prepare immutable qualified source
        shell: bash
        run: |
          set -euxo pipefail
          git fetch --no-tags origin "$QUALIFIED_SOURCE"
          git worktree add --detach /tmp/qualified "$QUALIFIED_SOURCE"
          test "$(git -C /tmp/qualified rev-parse HEAD)" = "$QUALIFIED_SOURCE"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build current Physics and run short scientific parity
        shell: bash
        run: |
          set -euxo pipefail
          docker pull "$BUILD_BASE_REF"
          docker run --rm \
            --entrypoint /bin/bash \
            --user 0:0 \
            --workdir /workspace \
            -e GITHUB_SHA="$GITHUB_SHA" \
            -e QUALIFIED_REPO=/qualified \
            -v "$PWD:/workspace" \
            -v "/tmp/qualified:/qualified:ro" \
            "$BUILD_BASE_REF" \
            -lc '
              set -euxo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory /opt/physics_vendor/moose
              git config --global --add safe.directory /opt/physics_vendor/crane
              git config --global --add safe.directory /opt/physics_vendor/squirrel
              git config --global --add safe.directory /opt/physics_vendor/zapdos
              test "$(git -C /workspace rev-parse HEAD)" = "$GITHUB_SHA"

              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt
              export PYTHONPATH=/qualified

              make -C /workspace/physics_app -j2
              test -x /workspace/physics_app/physics-opt

              python3 /workspace/experiments/Issue351_frozen_heavy_driver_parity/control.py --horizon short --p0
              python3 /workspace/experiments/Issue351_frozen_heavy_driver_parity/control.py --horizon short --p1
              python3 /workspace/experiments/Issue351_frozen_heavy_driver_parity/control.py --horizon short --run
            '

      - name: Upload short parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue351-frozen-heavy-driver-short
          path: |
            experiments/Issue351_frozen_heavy_driver_parity/results/short
            experiments/Issue351_frozen_heavy_driver_parity/generated/short
          if-no-files-found: ignore
