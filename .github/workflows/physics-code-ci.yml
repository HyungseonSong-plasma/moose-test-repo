name: Physics Code CI

on:
  push:
    branches: [main]
    paths:
      - 'physics_app/**'
      - 'physics_harness/analysis/**'
      - 'physics_harness/application/**'
      - 'physics_harness/cli/**'
      - 'physics_harness/evaluation/**'
      - 'physics_harness/evidence/**'
      - 'physics_harness/execution/**'
      - 'physics_harness/validation/**'
      - 'physics_harness/provenance/**'
      - 'experiments/**'
      - 'tests/**'
      - 'ci/guards/**'
      - 'ci/contracts/**'
      - 'ci/workflow_templates/**'
      - '.github/workflows/physics-code-ci.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'physics_app/**'
      - 'physics_harness/analysis/**'
      - 'physics_harness/application/**'
      - 'physics_harness/cli/**'
      - 'physics_harness/evaluation/**'
      - 'physics_harness/evidence/**'
      - 'physics_harness/execution/**'
      - 'physics_harness/validation/**'
      - 'physics_harness/provenance/**'
      - 'experiments/**'
      - 'tests/**'
      - 'ci/guards/**'
      - 'ci/contracts/**'
      - 'ci/workflow_templates/**'
      - '.github/workflows/physics-code-ci.yml'

permissions:
  contents: read

env:
  PHYSICS_RUNTIME_REF: ghcr.io/hyungseonsong-plasma/physics-runtime@sha256:cda9f0d09a17aed5fa606e97d1ee5c3450f7280536cec2e5c635402bb07d972c
  EXPECTED_BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
  EXPECTED_RUNTIME_REVISION: 565b500722c00e4ff6e759a02bd7bae52f8b13f0

concurrency:
  group: physics-code-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  physics_code_validate:
    name: Physics Code Validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FDEG_CACHE_DIR: /tmp/fdeg-index-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact validation source HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git fetch --no-tags --depth=1 origin 0755571b5d011f89a7473704337e23c042273381
          test "$(git rev-parse 0755571b5d011f89a7473704337e23c042273381^{commit})" = "0755571b5d011f89a7473704337e23c042273381"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependencies
        run: >-
          python -m pip install
          'pydantic>=2,<3'
          'pytest>=8,<9'
          'numpy>=1.26,<3'
          'scipy>=1.14,<2'
          'matplotlib>=3.8,<4'
          -r requirements-evidence-engine.txt
          -r requirements-ontology.txt
          -r physics_harness/code/requirements.txt
      - name: Verify current-source P0 invariants formerly duplicated in Issue jobs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m physics_app.ci.check_issue402_json_rate_native_p2 --self-test
          python3 physics_app/ci/check_stage5_s5d_heavy_reactions.py --static
          python3 physics_app/ci/check_stage5_s5d_heavy_reactions.py --self-test
          python3 physics_app/ci/check_stage5_h05_runtime.py --static
          python3 physics_app/ci/check_stage5_s5r_assembly.py --static
          python3 physics_app/ci/check_stage5_s5r_assembly.py --self-test
          python3 physics_app/ci/check_stage5_s5r_ei16_recovery.py
          python3 physics_app/ci/check_standard_moose_energy_projection.py --self-test
          python3 physics_app/ci/audit_issue402_initial_composition_routes.py --fail-on-legacy
      - name: Validate FDEG Structural Evidence P0
        run: python3 -m unittest discover -s tests -p test_fdeg_structural.py -v
      - name: Validate FDEG Functional Contract P0
        run: python3 -m unittest discover -s tests -p test_fdeg_functional.py -v
      - name: Validate FDEG Transition Evidence P0
        run: python3 -m unittest discover -s tests -p test_fdeg_transition.py -v
      - name: Validate FDEG Harness A-D P0
        run: python3 -m unittest discover -s tests -p test_fdeg_harness_abcd.py -v
      - name: Validate FDEG Scan Cache P0
        run: python3 -m unittest discover -s tests -p test_fdeg_scan_cache.py -v
      - name: Capture live FDEG graph and verify retired Factory archives
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          python3 ci/guards/fdeg_retirement_evidence.py --mode capture --target PhysicsFVLogMolarElectronReactionSource --expected-head "$head" --output-dir "$RUNNER_TEMP/fdeg-retirement-code7/live-electron"
          python3 ci/guards/fdeg_retirement_evidence.py --mode verify-archive --expected-head "$head" --output-dir "$RUNNER_TEMP/fdeg-retirement-code7/live-electron"
          python3 ci/guards/issue774_main_retirement.py --self-test --expected-head "$head" --output-dir "$RUNNER_TEMP/fdeg-retirement-code7/retired-factories"
          python3 -m ci.guards.issue817_code3_production_migration --expected-head "$head" --phase postcut --output "$RUNNER_TEMP/fdeg-retirement-code7/retired-factories/code3_consumer_receipt.json"
      - name: Upload live FDEG and frozen retired Factory evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fdeg-retirement-code7-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fdeg-retirement-code7/
          retention-days: 14
      - name: Regression-test scoped Native P1 harness and Issue493 delegation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/unit -p test_native_build_harness.py -v
          python3 experiments/Issue493_s6_boltzmann/test_run_issue493.py
          python3 experiments/Issue493_s6_boltzmann/test_public_p3_run.py
          python3 experiments/Issue493_s6_boltzmann/test_public_p3_diagnostic.py
      - name: Validate central scientific semantics compatibility
        shell: bash
        run: |
          set -euo pipefail
          central_revision="d7e5d16e1ed1b9d3561c25cc3b2f0d3533de4a87"
          central_dir="$(mktemp -d)"
          git -C "$central_dir" init -q
          git -C "$central_dir" remote add origin https://github.com/HyungseonSong-plasma/chatgpt-operation.git
          git -C "$central_dir" fetch --quiet --depth=1 origin "$central_revision"
          git -C "$central_dir" checkout --quiet FETCH_HEAD
          python3 ci/guards/scientific_centralization_guard.py \
            --central-root "$central_dir" \
            --central-revision "$central_revision" \
            --json-out scientific-centralization-compatibility.json
          rm -rf "$central_dir"
      - name: Upload scientific centralization compatibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: scientific-centralization-compatibility
          path: scientific-centralization-compatibility.json
          if-no-files-found: error
          retention-days: 30
      - name: Validate plasma semantic ownership
        run: python ci/guards/physics_plasma_semantic_residue_guard.py
      - name: Validate campaign/performance/scale ownership
        run: python ci/guards/physics_campaign_residue_guard.py
      - name: Validate numerical-method ownership
        run: python ci/guards/physics_numerical_method_ownership_guard.py
      - name: Validate model terminology and MOOSE boundary ownership
        run: python ci/guards/physics_boundary_terminology_guard.py
      - name: Upload migration source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics-migration-source
          path: |
            physics_harness/**/*.py
            experiments/**/*.py
            tests/**/*.py
          if-no-files-found: error
          retention-days: 1
      - name: Run Physics pytest (FDEG P0 suites already executed above)
        run: >-
          python -m pytest -q
          --ignore=tests/test_fdeg_structural.py
          --ignore=tests/test_fdeg_functional.py
          --ignore=tests/test_fdeg_transition.py
          --ignore=tests/test_fdeg_harness_abcd.py
          --ignore=tests/test_fdeg_scan_cache.py
      - name: Regression-test Issue493 canonical/archive Exodus P4 diagnostics
        run: python experiments/Issue493_s6_boltzmann/test_compare_native_reference.py
      - name: Validate normalized-to-physical coupled equivalence fixture
        run: python physics_app/ci/check_physical_state_coupled_equivalence.py --self-test
      - name: Validate n_epsilon-to-mean_en symbol equivalence fixture
        run: python physics_app/ci/check_mean_en_symbol_equivalence.py --self-test
      - name: Validate retired Gummel Action is absent
        run: python physics_app/ci/check_retired_gummel_action_contract.py
      - name: Validate #17 R1 EI01 attachment source contract
        run: python physics_app/ci/check_ei01_attachment_source_contract.py
      - name: Validate #17 R2 O2 ionization lookup and ownership contract
        run: python physics_app/ci/check_r2_o2_ionization_contract.py
      - name: Validate #176 R3 O2s excitation constant-surrogate ownership contract
        run: python physics_app/ci/check_r3_o2s_excitation_contract.py
      - name: Validate #26 E8 EI10 inelastic energy ownership contract
        run: python physics_app/ci/check_e8_ei10_energy_contract.py
      - name: Validate #26 E8 EI10 inelastic energy production implementation
        run: python physics_app/ci/check_e8_ei10_energy_implementation.py
      - name: Validate #26 E8 EI10 runtime discriminator logic
        run: python physics_app/ci/check_e8_ei10_energy_runtime.py --self-test
      - name: Validate #26 E8 EI16 ionization energy ownership contract
        run: python physics_app/ci/check_e8_ei16_energy_contract.py
      - name: Validate #26 E8 EI16 runtime discriminator logic
        run: python physics_app/ci/check_e8_ei16_energy_runtime.py --self-test
      - name: Validate #176 R3 O2s excitation production implementation
        run: python physics_app/ci/check_r3_o2s_excitation_implementation.py
      - name: Validate #17 R2 O2 ionization production implementation
        run: python physics_app/ci/check_r2_o2_ionization_implementation.py
      - name: Validate canonical electron molar representation contract
        run: |
          python physics_app/ci/check_electron_molar_representation_contract.py --self-test
          python physics_app/ci/check_electron_molar_representation_contract.py
      - name: Validate Issue 43/45 science refactor
        run: python experiments/Issue43_45_science_refactor/final_guard.py
      - name: Validate Issue 89 post-science canonicalization
        run: python experiments/Issue89_post_science_canonicalization/final_guard.py
      - name: Validate execution contract refactor
        run: python experiments/execution_contract_refactor/guard.py
  issue541_group_a_evidence:
    name: Issue541 Group A evidence and negative controls (no Native)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind Group A audit to exact source HEAD
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Validate Group A evidence and rejection mutations
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/guards/issue541_group_a_retirement.py --self-test
          python3 ci/guards/issue541_group_a_retirement.py --check
      - name: Validate workflow generation and surface self-tests
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/workflow_harness.py --self-test
          python3 ci/workflow_harness.py --check
          python3 ci/guards/workflow_surface_guard.py --self-test
      - name: Verify scoped DD/S6 archived originals absent and global guard clean
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/issue402-dd-json-p3-smoke-once.yml
          test ! -e .github/workflows/issue402-hybrid-json-s6-p3-p4-once.yml
          test -f docs/development/archive/issue402-dd-json-p3-smoke-once.yml.txt
          test -f .github/workflows/issue541-arch-dd-p3-replay.yml
          test -f .github/workflows/issue541-arch-s6-p3-p4-replay.yml
          python3 ci/guards/workflow_surface_guard.py --check | tee /tmp/issue541_group_a_surface.log
          grep -Fq 'WORKFLOW_SURFACE_GUARD=PASS' /tmp/issue541_group_a_surface.log
          echo 'ISSUE541_GLOBAL_SURFACE_GUARD=PASS; DD_S6_STAGED_ABSENT; ARCHIVE_PROVEN; SCIENCE_HOLD; NO_WAIVER'
      - name: Preserve source-bound Group A audit and guard output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue541-group-a-audit-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ci/baselines/issue541_group_a_retirement.json
            /tmp/issue541_group_a_surface.log
          if-no-files-found: warn
          retention-days: 30
  issue541_arch_replay_p0:
    name: Issue541 ARCH independent P3 source and manual replay P0 (no Native)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == 'HyungseonSong-plasma/moose-test-repo'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact P3 source, retention, manual authorization, and negative mutations
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 -m py_compile ci/guards/issue541_arch_replay_p0.py ci/guards/issue541_arch_dd_p3_result_gate.py
          python3 ci/guards/issue541_arch_replay_p0.py --self-test --check
          python3 ci/guards/issue541_arch_dd_p3_result_gate.py --self-test
          python3 experiments/Issue402_plasma_dsl_g1/p3_chemistry_preflight.py --output "$RUNNER_TEMP/issue541_arch_s6_static_readiness.json"
          python3 -m pip install --disable-pip-version-check --quiet 'pytest>=8,<9'
          python3 -m pytest -q tests/test_issue402_hybrid_json_s6_owner_preflight.py
          python3 ci/guards/workflow_surface_guard.py --self-test
          echo ISSUE541_ARCH_P3_REPLACEMENT_P0_PASS_NO_LIVE_P3_SCIENCE_HOLD
