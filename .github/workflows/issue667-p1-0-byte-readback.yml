name: Issue 667 P1-0 exact-head 11-layer byte readback
on:
  push:
    branches:
      - 'issue-667-p1-0-byte-readback-*'
    paths:
      - '.github/workflows/issue667-p1-0-byte-readback.yml'
permissions:
  contents: read
  actions: read
jobs:
  pin-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9c15a4f0e2cf8042cb0d4b2f18af31511021d168
          persist-credentials: false
      - name: Reconstruct exact-HEAD scratch inputs (no physics-opt, no private rates)
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys, json, shutil, hashlib, re, subprocess, zipfile
          ROOT=Path.cwd()
          EXPECTED='9c15a4f0e2cf8042cb0d4b2f18af31511021d168'
          observed=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert observed == EXPECTED, ('wrong source HEAD',observed)
          sys.path[:0] = [str(ROOT),str(ROOT/'experiments/Issue402_plasma_dsl_g1')]
          import public_option_s6_p2 as option
          from chemistry.prepare_s6_run_input import prepare as prep_chemistry
          from chemistry.prepare_hybrid_json_s6 import prepare as prep_hybrid
          from chemistry.retire_s6_ion_fv_owners import BLOCK, ROOT as HEADING, parsed_parameters
          option.p2.preflight(ROOT)  # public data-only P0; no solver, no private rates
          metadata=json.loads((ROOT/option.p2.DECKS/'manifest.json').read_text())
          result=ROOT/'_issue667_p1_0_evidence'
          if result.exists():raise ValueError('refuse overwrite of existing capture')
          result.mkdir()
          src_table=ROOT/'experiments/Issue91_real_qvt_r3/r3_e0/electron_moments.txt'
          assert src_table.is_file() and src_table.stat().st_size
          H=lambda b:hashlib.sha256(b).hexdigest()
          manifest={
            'schema':'issue667.p1_0_exact_pr_head_scratch_11_layer_bytes.v1',
            'pinned_pr':665,'source_head':EXPECTED,
            'evidence':'exact-head deterministic input PREP; no native P2/P3/P4',
            'execution':'P0_ONLY_NO_SOLVER','science':'SCIENCE_HOLD',
            'rate_bytes_in_artifact':False,'cases':{}
          }
          for case in ('417','941'):
            rec=metadata['cases'][case]
            names=rec['input_order']+['migrated_continuity.i']
            assert len(names)==11 and len(set(names))==11
            staged=result/case
            chem=staged/option.p2.CHEM
            chem.mkdir(parents=True)
            source_dir=ROOT/option.p2.DECKS/rec['name']/'C'
            dbase=ROOT/'experiments/Issue402_plasma_dsl_g1/native/s6_c0_physics_base_no_d1.i'
            assert dbase.is_file()
            for i,name in enumerate(names):
              src=dbase if i==0 else source_dir/name
              if not src.is_file():raise ValueError('missing pinned source '+str(src))
              shutil.copyfile(src,chem/name)
            dest_table=staged/'experiments/Issue91_real_qvt_r3/r3_e0/electron_moments.txt'
            dest_table.parent.mkdir(parents=True)
            shutil.copyfile(src_table,dest_table)
            order=[str(option.p2.CHEM/name) for name in names]
            canonical=option.canonicalize_staged_D_inputs(chem,order)
            remap=option.remap_staged_fem_types(chem,order)
            chemistry=prep_chemistry(chem,order,case)
            hybrid=prep_hybrid(chem,order,case,chemistry_cutover=chemistry)
            assert hybrid['removed_generated_owner_count']==10
            assert hybrid['rebound_native_sheath_bc_count']==8
            assert hybrid['integrated_species_count']==7 and hybrid['integrated_reaction_count']==8
            assert hybrid['status']=='SCRATCH_HYBRID_PREPARED_NO_SOLVE'
            files=[]
            ion_kernel=[];ion_bc=[]
            for ordinal,name in enumerate(names,1):
              b=(chem/name).read_bytes()
              assert b and b'\r' not in b and b'!include' not in b
              entry={'ordinal':ordinal,'file_name':name,'file_sha256':H(b),'byte_count':len(b)}
              files.append(entry)
              content=b.decode('utf-8')
              roots=list(HEADING.finditer(content))
              for match in BLOCK.finditer(content):
                parent=next((x[1] for x in reversed(roots) if x.start()<match.start()),None)
                if parent not in ('FVKernels','FVBCs'):continue
                params=parsed_parameters(match['body'])
                if params.get('variable') not in ('log_O2p','log_Om','log_Op'):continue
                obj={'name':match['name'],'section':parent,'ordinal':ordinal,
                     'file_name':name,'block_sha256':H(match.group().encode('utf-8')),
                     'factory_type':params.get('type'),'variable':params.get('variable'),
                     'functor_v':params.get('v'), 'params':params}
                (ion_kernel if parent=='FVKernels' else ion_bc).append(obj)
            assert len(ion_kernel)==14 and len(ion_bc)==12,(case,len(ion_kernel),len(ion_bc))
            expected_op=('legacy8_h05_ei417_op','h25_atomic_positive_ion') if case=='417' else ('ei941_atomic_positive_ion_source','h25_atomic_positive_ion')
            candidates=[]
            for name in expected_op:
              m=[v for v in ion_kernel if v['name']==name]
              assert len(m)==1,(case,name,m)
              candidates.append(m[0])
            assert len(set(v['ordinal'] for v in candidates))==2
            assert len(set(v['functor_v'] for v in candidates))==2
            assert len(set(v['block_sha256'] for v in candidates))==2
            manifest['cases'][case]={
              'status':'P0_INPUT_SOURCE_BYTES_REPLAY_PASS','files':files,
              'native_ion_fv_kernel_count':len(ion_kernel),
              'native_ion_fv_bc_count':len(ion_bc),
              'ion_kernels':ion_kernel,'ion_bcs':ion_bc,
              'op_sources':candidates,
              'input_path_order':order,'public_p2_deck_name':rec['name'],
              'canonicalization':canonical['status'],
              'type_remap':remap['status'],
              'chemistry_cutover':chemistry['status'],
              'hybrid_cutover':hybrid['status'],
              'overlay_sha256':hybrid['overlay_sha256'],
              'scientific_acceptance':'HOLD',
            }
            print('S6-'+case,'input 11/11; ion kernels',len(ion_kernel),'FV BCs',len(ion_bc),
                  'Op sources',[(x['name'],x['ordinal']) for x in candidates],flush=True)
          manpath=result/'p1_0_final_11_layer_manifest.json'
          manpath.write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          with zipfile.ZipFile(result/'p1_0_final_11_layer_inputs.zip','w',compression=zipfile.ZIP_DEFLATED) as bundle:
            bundle.write(manpath,arcname='p1_0_final_11_layer_manifest.json')
            for case in ('417','941'):
              for row in manifest['cases'][case]['files']:
                src=result/case/option.p2.CHEM/row['file_name']
                assert H(src.read_bytes())==row['file_sha256']
                bundle.write(src,arcname=case+'/'+row['file_name'])
          print('FINAL_MANIFEST_SHA256',H(manpath.read_bytes()),flush=True)
          print('ZIP_SHA256',H((result/'p1_0_final_11_layer_inputs.zip').read_bytes()),flush=True)
          PY
      - name: Retain all 22 exact-head .i bytes and source-bound SHA manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue667-p1-0-exact-head-11layer
          path: |
            _issue667_p1_0_evidence/p1_0_final_11_layer_manifest.json
            _issue667_p1_0_evidence/p1_0_final_11_layer_inputs.zip
          if-no-files-found: warn
          retention-days: 14
