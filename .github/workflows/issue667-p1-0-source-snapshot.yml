name: Issue667 P1-0 source snapshot (no Native)
on:
  push:
    branches:
      - issue-667-p1-0-source-pin-20261117
    paths:
      - .github/workflows/issue667-p1-0-source-snapshot.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable integration source and bounded workflow-only diff
        shell: bash
        env:
          PIN: 9c15a4f0e2cf8042cb0d4b2f18af31511021d168
        run: |
          set -euo pipefail
          test "$(git merge-base "$PIN" HEAD)" = "$PIN"
          test "$(git diff --name-only "$PIN" HEAD)" = ".github/workflows/issue667-p1-0-source-snapshot.yml"
          test "$(git rev-list --count "$PIN"..HEAD)" = "1"
          echo "PIN=9c15a4f0e2cf8042cb0d4b2f18af31511021d168" > p1_0_source_head.txt
          echo "SOURCE_SNAPSHOT_SHA=$GITHUB_SHA" >> p1_0_source_head.txt
      - name: Snapshot only public input-generating code and public numeric tables
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, shutil
          root=pathlib.Path('.').resolve()
          target=pathlib.Path('/tmp/issue667_source_snapshot')
          selected=[
            'p1_0_source_head.txt',
            'physics_harness',
            'experiments/Issue402_plasma_dsl_g1/chemistry',
            'experiments/Issue402_plasma_dsl_g1/public_option_s6_p2.py',
            'experiments/Issue402_plasma_dsl_g1/s6_417_chemistry_run.template.i',
            'experiments/Issue402_plasma_dsl_g1/s6_941_chemistry_run.template.i',
            'experiments/Issue402_plasma_dsl_g1/plasma_species_only.json',
            'experiments/Issue402_plasma_dsl_g1/native/s6_c0_physics_base_no_d1.i',
            'experiments/Issue402_plasma_dsl_g1/issue633_newonly_s6_417_continuity.template.i',
            'experiments/Issue402_plasma_dsl_g1/issue633_newonly_s6_941_continuity.template.i',
            'experiments/Issue493_s6_boltzmann/public_p2_check.py',
            'experiments/Issue493_s6_boltzmann/public_p2_decks.tar.xz.b64',
            'physics_app/data/electron_impact/boltz',
          ]
          for name in selected:
            src=root/name
            if not src.exists(): raise RuntimeError('PUBLIC_PIN_SOURCE_MISSING:'+name)
            dst=target/name
            dst.parent.mkdir(parents=True,exist_ok=True)
            if src.is_dir(): shutil.copytree(src,dst)
            else: shutil.copyfile(src,dst)
          print('PUBLIC_SOURCE_SNAPSHOT_COMPLETE',len(selected))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: issue667-p1-0-public-source-${{ github.sha }}
          path: /tmp/issue667_source_snapshot/
          if-no-files-found: error
          retention-days: 7
