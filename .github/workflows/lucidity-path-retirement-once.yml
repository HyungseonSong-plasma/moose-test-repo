name: Lucidity explicit path retirement evidence (one-shot)
on:
  push:
    branches: [issue-758-lucidity-retirement-validation]
    paths: ['.github/workflows/lucidity-path-retirement-once.yml']
permissions:
  contents: read
jobs:
  transition:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 436cb7b3210ed9423c3001c9c5f5c351f8f2219e
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact source and dependencies
        run: |
          test "$(git rev-parse HEAD)" = 436cb7b3210ed9423c3001c9c5f5c351f8f2219e
          git cat-file -e b342e9e8861736a7af59b02b90f1d7bed01c7dc6^{commit}
          python -m pip install -r physics_harness/code/requirements.txt
      - name: Actual module transition receipts and repository references
        run: |
          PYTHONPATH="$PWD" python - <<'PY'
          from dataclasses import asdict
          from collections import Counter
          from pathlib import Path
          import json, os, subprocess
          from physics_harness.code.diagnostics.providers.git import GitSourceProvider
          from physics_harness.code.verification.naming_consumers import verify_module_path_transition
          base="b342e9e8861736a7af59b02b90f1d7bed01c7dc6"; head="436cb7b3210ed9423c3001c9c5f5c351f8f2219e"
          root=Path.cwd(); provider=GitSourceProvider(root)
          prefix="physics_harness/code/analysis/"
          transitions=[("libs/code_understandability/__init__.py","libs/code_lucidity/__init__.py")]
          for name in ("adapter","interpretation"):
              for former in ("understandability","lucidity"):
                  transitions.append((prefix+former+"_"+name+".py",prefix+"adapters/lucidity_"+name+".py"))
          receipts=[]
          for old,new in transitions:
              receipt=verify_module_path_transition(provider,base,head,old,new,"RETIRE_OLD_PATH",max_files=5000,max_bytes=100_000_000)
              receipts.append(asdict(receipt))
              print("TRANSITION="+json.dumps({"old":old,"new":new,"status":receipt.status,"old_present":receipt.old_path_present,"new_present":receipt.new_path_present,"witnessed":receipt.path_policy_witnessed,"files":receipt.scanned_files,"blockers":receipt.blockers,"unknowns":receipt.unresolved,"refs":dict(Counter(x.category for x in receipt.references)),"static":[asdict(x) for x in receipt.references if x.category=="STATIC_IMPORT"]}),flush=True)
          grep=subprocess.run(["git","grep","-n","-I","-E",r"code_understandability|analysis[./](understandability|lucidity)_(adapter|interpretation)|from [.]?((understandability|lucidity)_(adapter|interpretation)) import",head,"--"],capture_output=True,text=True)
          assert grep.returncode in (0,1),grep.stderr
          lines=grep.stdout.splitlines()
          print("TRACKED_REFERENCE_COUNT="+str(len(lines)))
          for line in lines:
              print("TRACKED_REF="+line[:600])
          data={"baseline":base,"candidate":head,"receipts":receipts,"grep":lines}
          (Path(os.environ["RUNNER_TEMP"])/"lucidity-retirement.json").write_text(json.dumps(data,indent=2))
          assert all(r["path_policy_witnessed"] and not r["old_path_present"] and r["new_path_present"] and not r["blockers"] for r in receipts)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lucidity-retirement-evidence
          path: ${{ runner.temp }}/lucidity-retirement.json
          if-no-files-found: warn
          retention-days: 30
