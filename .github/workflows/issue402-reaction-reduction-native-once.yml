name: Issue402 EI10 EI16 generic reaction reduction Native compatibility
on:
  push:
    branches: [issue-402-species-functor-naming]
    paths: [.github/workflows/issue402-reaction-reduction-native-once.yml]
permissions:
  contents: read
jobs:
  ei10-ei16-factory-reduction-and-s6-p2:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      HISTORICAL_SHA: 29d1acc6ef7969908b86719e4b95c73a1565136d
      OCI: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
      CHEM: experiments/Issue395_powered_chemistry_ladder
      OXYGEN_RESEARCH_400: '1'
      OXYGEN_RESEARCH_FULL24: '0'
      OXYGEN_RESEARCH_EI2738_FORMULA: '0'
      OXYGEN_RESEARCH_QUICK_5MIN: '0'
    steps:
      - name: Checkout exact PR524
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout pinned historical public S6
        uses: actions/checkout@v4
        with:
          ref: 29d1acc6ef7969908b86719e4b95c73a1565136d
          path: historical
          persist-credentials: false
          fetch-depth: 1
      - name: Verify immutable sources and P2-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C control rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C historical rev-parse HEAD)" = "$HISTORICAL_SHA"
          test ! -e historical/"$CHEM"/private_rates
          test ! -e control/physics_app/physics-opt
          test ! -e control/physics_app/src/functormaterials/PhysicsIonWallTotalFluxMaterial.C
          grep -Fq "$OCI" control/physics_app/dependencies.lock
          python3 control/experiments/Issue493_s6_boltzmann/public_p2_check.py --control control --mode preflight
          echo "EXACT_SOURCE_HEAD=$GITHUB_SHA"
          echo "P3=NOT_RUN SCIENCE=SCIENCE_HOLD"
      - name: Install Python for P0 and historical public mesh
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: P0 analytical Wall parity and archived S6 input guards
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet 'pytest>=8,<9' 'pydantic>=2,<3' numpy==2.1.2 scipy==1.14.1 matplotlib==3.9.2 -r control/requirements-evidence-engine.txt -r control/requirements-ontology.txt
          cd control
          export ISSUE402_HISTORICAL_PUBLIC_TABLE="$GITHUB_WORKSPACE/historical/.github/oxygen25_eedf/initial_mixture_23xsec_transport.txt"
          test -s "$ISSUE402_HISTORICAL_PUBLIC_TABLE"
          python3 -m pytest -q tests/test_issue402_d_base_staging.py \
            tests/test_issue402_s6_electron_transport_compatibility.py \
            tests/test_issue402_wall_semantic_parity.py \
            tests/test_issue402_species_functor_naming.py \
            tests/test_issue402_s6_wall_naming_staging.py \
            tests/test_retired_legacy_physics_owners_contract.py \
            tests/test_issue402_s6_chemistry_run_templates.py \
            tests/test_issue402_full_s6_p2_only.py \
            tests/test_issue402_reaction_reduction_p2_only.py
          python3 -m pytest -q tests/characterization/test_issue192_s5r.py tests/characterization/test_issue192_s5r_runtime.py
          python3 physics_app/ci/check_r2_o2_ionization_implementation.py
          python3 physics_app/ci/check_r3_o2s_excitation_implementation.py
          python3 physics_app/ci/check_e8_ei10_energy_contract.py
          python3 physics_app/ci/check_e8_ei10_energy_implementation.py
          python3 physics_app/ci/check_e8_ei16_energy_contract.py
          python3 physics_app/ci/check_standard_moose_energy_projection.py --self-test
          test ! -f physics_app/src/materials/PhysicsElectronImpactIonizationMaterial.C
          test ! -f physics_app/src/materials/PhysicsElectronImpactO2sExcitationMaterial.C
          test ! -f physics_app/src/materials/PhysicsO2IonizationSourceMaterial.C
          test ! -f physics_app/src/materials/PhysicsO2sExcitationSourceMaterial.C
          echo 'ISSUE402_REACTION_REDUCTION_TARGET_P0_PASS_NO_NEW_COMMITS_UNTIL_P2'
          echo 'D_BASE_SOURCE=PREBUILT_PINNED_NO_RUNTIME_DEBUG_FILTER_ALL_FOUR_D_ENTRYPOINTS'
      - name: Materialize pinned public historical 400W mesh
        shell: bash
        run: |
          set -euo pipefail
          cd historical
          SRC=.github/oxygen25_eedf/initial_mixture_23xsec_transport.txt
          DST=experiments/Issue91_real_qvt_r3/r3_e0/electron_moments.txt
          test "$(sha256sum "$SRC" | cut -d' ' -f1)" = 35534a522fa48ccb5222339c5040040630eef31e623e1c53f1e1c4540d2d653b
          cp "$SRC" "$DST"
          export CHATGPT_WORK_BASE_SHA="$HISTORICAL_SHA"
          bash "$CHEM/issue397_l1_power_scan_replay.sh" prepare 400
          python3 .github/scripts/oxygen_legacy6_latest_100us.py --power-w 400 --prepare
          test -s "$CHEM/baseline_plasma_plus_unstructured_cover_plus_wafer.msh"
          test ! -e "$CHEM/private_rates"
          echo 'ISSUE402_PUBLIC_S6_MESH_P0_PASS'
      - name: Native P1 compile and exact-head same-job binary identity
        shell: bash
        run: |
          set -euo pipefail
          cd control
          mkdir -p experiments/Issue402_plasma_dsl_g1/evidence
          test ! -e physics_app/physics-opt
          docker pull "$OCI"
          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace \
            -v "$PWD:/workspace" "$OCI" -lc '
              set -euo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt
              make -C physics_app -j2 app_non_unity_dirs="%/utils"
              test -x physics_app/physics-opt
            ' 2>&1 | tee experiments/Issue402_plasma_dsl_g1/evidence/native_build.log
          python3 - "$GITHUB_SHA" "$OCI" <<'PY'
          import hashlib,json,pathlib,sys
          sha,oci=sys.argv[1:]
          E=pathlib.Path("experiments/Issue402_plasma_dsl_g1/evidence")
          def digest(p):
              h=hashlib.sha256()
              with open(p,"rb") as f:
                  for chunk in iter(lambda:f.read(1048576),b""):h.update(chunk)
              return h.hexdigest()
          assert not (E/"native_p1_identity.json").exists()
          (E/"native_p1_identity.json").write_text(json.dumps({
              "schema":"issue402.native_p1.job_local.v1","source_sha":sha,
              "oci_image":oci,
              "binary_sha256":digest("physics_app/physics-opt"),
              "build_log_sha256":digest(E/"native_build.log"),
              "reusable_scope":"same_exact_head_ci_job_only",
              "P1":"PASS","P3":"NOT_RUN","science":"SCIENCE_HOLD",
          },indent=2,sort_keys=True)+"\n")
          PY
          echo 'ISSUE402_REAL_S6_SOURCE_BOUND_P1_PASS'
      - name: Native EI10 EI16 four-fixture syntax-only P2 (never solve)
        shell: bash
        run: |
          set -euo pipefail
          cd control
          docker run --rm --user 0:0 --entrypoint /bin/bash --workdir /workspace \
            -v "$PWD:/workspace" "$OCI" -lc '
              set -euo pipefail
              source /environment
              python3 -m physics_app.ci.check_issue402_reaction_reduction_p2_only \
                --executable /workspace/physics_app/physics-opt
            ' 2>&1 | tee experiments/Issue402_plasma_dsl_g1/evidence/reduction_native_p2.log
          echo 'ISSUE402_EI10_EI16_SOURCE_P2_SYNTAX_ONLY_PASS'
      - name: Direct prebuilt D base S6 417/941 Native P2 (no filtering/scans)
        shell: bash
        run: |
          set -euo pipefail
          cd control
          s=experiments/Issue402_plasma_dsl_g1/run_chemistry_s6_p2_only.py
          set +e
          python3 "$s" --historical ../historical --expected-head "$GITHUB_SHA" \
            --case 417 --output "$RUNNER_TEMP/pr524_full_s6_417" --timeout-seconds 600 \
            > "$RUNNER_TEMP/pr524_417_driver.log" 2>&1
          e417=$?
          python3 "$s" --historical ../historical --expected-head "$GITHUB_SHA" \
            --case 941 --output "$RUNNER_TEMP/pr524_full_s6_941" --timeout-seconds 600 \
            > "$RUNNER_TEMP/pr524_941_driver.log" 2>&1
          e941=$?
          set -e
          python3 - "$e417" "$e941" "$RUNNER_TEMP" <<'PY'
          import json,os,pathlib,sys
          a,b,root=sys.argv[1:]
          root=pathlib.Path(root)
          out={"schema":"issue402_pr524_active_s6_p2_v1",
               "source_sha":os.environ["GITHUB_SHA"],
               "historical_sha":os.environ["HISTORICAL_SHA"],
               "P3":"NOT_RUN","science":"SCIENCE_HOLD","cases":{}}
          for case,exitcode in (("417",int(a)),("941",int(b))):
              path=root/f"pr524_full_s6_{case}"/"readiness.json"
              evidence=json.loads(path.read_text()) if path.exists() else {}
              log=root/f"pr524_{case}_driver.log"
              out["cases"][case]={
                  "exit_code":exitcode, "P2":evidence.get("P2","HOLD"),
                  "native":evidence.get("cases",{}).get(case,{}).get("check_input",{}),
                  "driver_tail":log.read_text(errors="replace")[-1200:]
              }
          out["P2"]="PASS" if all(
              x["exit_code"]==0 and x["P2"]=="PASS"
              for x in out["cases"].values()) else "HOLD"
          # The canonical D base is already free of obsolete debug probes.
          # Physical input validity is the only P2 gate; no debug strip/scan.
          out["input_source"] = "PINNED_PREBUILT_D_PHYSICS_BASE"
          out["ACTIVE_MODEL_P2"] = out["P2"]
          (root/"pr524_s6_p2_summary.json").write_text(
              json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps({"ACTIVE_MODEL_P2":out["ACTIVE_MODEL_P2"], "INPUT_SOURCE":"PINNED_PREBUILT_D_PHYSICS_BASE", "P3":"NOT_RUN",
              "science":"SCIENCE_HOLD","cases":{
                  k:{"P2":v["P2"],"native":v["native"]} for k,v in out["cases"].items()
              }},sort_keys=True))
          sys.exit(0 if out["ACTIVE_MODEL_P2"]=="PASS" else 3)
          PY
          echo 'ISSUE402_DIRECT_D_BASE_NATIVE_P2_PASS_NO_DEBUG_FILTER_SCIENCE_HOLD'
      - name: Diagnose real public S6 P2 rejection from raw native check-input log
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for case in 417 941; do
            file="$RUNNER_TEMP/pr524_full_s6_$case/S6-$case/native_P2.log"
            echo "ISSUE402_NATIVE_P2_DIAG_CASE=$case"
            if test -f "$file"; then
              sha256sum "$file"
              grep -E -A 8 -B 3 -i 'error|exception|unknown|not found|failed|unrecognized|Syntax OK|unused' "$file" | tail -90 || true
              echo "ISSUE402_NATIVE_P2_DIAG_LOG_PRESENT_$case"
            else
              echo "ISSUE402_NATIVE_P2_DIAG_LOG_MISSING_$case"
            fi
          done
      - name: Preserve sanitized P2 statuses, not source/mesh/rates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue402-pr524-reaction-reduction-native-${{ github.sha }}
          path: |
            control/experiments/Issue402_plasma_dsl_g1/evidence/reduction_native_p2.log
            ${{ runner.temp }}/pr524_s6_p2_summary.json
            ${{ runner.temp }}/pr524_full_s6_417/readiness.json
            ${{ runner.temp }}/pr524_full_s6_941/readiness.json
            ${{ runner.temp }}/pr524_full_s6_417/S6-417/native_P2.log
            ${{ runner.temp }}/pr524_full_s6_941/S6-941/native_P2.log
            ${{ runner.temp }}/pr524_417_driver.log
            ${{ runner.temp }}/pr524_941_driver.log
          if-no-files-found: warn
          retention-days: 14
