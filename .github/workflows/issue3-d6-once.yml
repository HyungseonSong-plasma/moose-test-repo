name: Issue 3 D6 canonical promotion one-shot

on:
  push:
    branches:
      - issue3-d0-dielectric-surface-charge
    paths:
      - '.github/workflows/issue3-d6-once.yml'
      - 'experiments/Issue3_dielectric_surface_charge/test.json'
      - 'experiments/Issue3_dielectric_surface_charge/d6_2d_integrated.i'
      - 'experiments/Issue3_dielectric_surface_charge/analyze_d6_2d.py'

permissions:
  contents: read

jobs:
  d6-canonical:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008

    steps:
      - uses: actions/checkout@v4

      - name: Pull build image
        run: docker pull "$BUILD_BASE_REF"

      - name: Build and validate canonical D6 manifest
        shell: bash
        run: |
          set -euo pipefail
          OUT=experiments/Issue3_dielectric_surface_charge/output_d6_canonical
          mkdir -p "$OUT"

          docker run --rm --entrypoint /bin/bash --user 0:0 \
            --workdir /workspace -v "$GITHUB_WORKSPACE:/workspace" \
            "$BUILD_BASE_REF" -lc '
              set -euo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory /opt/physics_vendor/moose
              git config --global --add safe.directory /opt/physics_vendor/crane
              git config --global --add safe.directory /opt/physics_vendor/squirrel
              git config --global --add safe.directory /opt/physics_vendor/zapdos
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt

              CASE_DIR=experiments/Issue3_dielectric_surface_charge
              OUT=$CASE_DIR/output_d6_canonical

              python3 -m json.tool "$CASE_DIR/test.json" > "$OUT/test_manifest.json"
              python3 -c "from physics_harness.adapters.moose.preflight import parser_symbol_self_test; raise SystemExit(parser_symbol_self_test())" \
                > "$OUT/preflight_selftest.log" 2>&1

              make -C physics_app -j2
              python3 -c "from pathlib import Path; from physics_harness.adapters.moose.regression import run_case; raise SystemExit(run_case(Path(\"$CASE_DIR\"), executable=Path(\"/workspace/physics_app/physics-opt\"), heartbeat_seconds=5.0, stall_after_seconds=60.0))" \
                > "$OUT/harness.log" 2>&1

              cp "$CASE_DIR/d6_2d_integrated_out.csv" "$OUT/"
              cp "$CASE_DIR/d6_2d_integrated_out.e" "$OUT/"
            '

      - name: Upload canonical D6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue3-d6-canonical-evidence
          path: experiments/Issue3_dielectric_surface_charge/output_d6_canonical/**
          if-no-files-found: warn
          retention-days: 30
