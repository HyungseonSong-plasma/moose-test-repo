name: One-shot Samuel skill-first pin migration

on:
  push:
    branches: [ops/adopt-samuel-skill-first]
    paths: [.github/workflows/adopt-samuel-skill-first-once.yml]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/adopt-samuel-skill-first
          fetch-depth: 0
      - name: Update active Samuel pins and consumer contract checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old = "4599ce446ab8a9e56d872e93541b1215d1702ab0"
          new = "125bae0358da93edd6726b013ebc4639ed2cff77"
          active = [
              Path("docs/protocols/coding.md"),
              Path("automation/manifests/README.md"),
              Path("automation/mutations/README.md"),
              Path(".github/workflows/ci.yml"),
              Path(".github/workflows/experiment.yml"),
              Path(".github/workflows/refactor.yml"),
          ]
          for path in active:
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected old Samuel pin missing from {path}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          ci = Path(".github/workflows/ci.yml")
          text = ci.read_text(encoding="utf-8")
          replacements = {
              '"expected_blob_sha": "0116d5c33dc88cc2fedea3e5294e847b7bc2cbf5"':
                  '"expected_blob_sha": "640a10680839b80cb7ef73ad70ac28961682231a"',
              '"expected_blob_sha": "b5ab05b358f47cdfaa9c9b7841581c519846b857"':
                  '"expected_blob_sha": "aa87d20fa68dc6e171ffd3240b4e4bc6d3bf28be"',
              'assert entries["repository-mutation"]["load_on"] == ["MUTATE"]':
                  'assert entries["repository-mutation"]["load_on"] == ["MUTATE","GITHUB_BRANCH_DELETE"]',
          }
          for before, after in replacements.items():
              if before not in text:
                  raise SystemExit(f"expected CI contract fragment missing: {before}")
              text = text.replace(before, after)
          ci.write_text(text, encoding="utf-8")
          PY

          grep -Fq '125bae0358da93edd6726b013ebc4639ed2cff77' docs/operating_system/README.md
          grep -Fq '125bae0358da93edd6726b013ebc4639ed2cff77' docs/operating_system/CENTRAL_SKILLS.md
          grep -Fq 'GITHUB_BRANCH_DELETE' docs/operating_system/central_skills.json
          git diff --check

      - name: Commit migration and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Samuel controller"
          git config user.email "actions@users.noreply.github.com"
          git add docs/protocols/coding.md automation/manifests/README.md automation/mutations/README.md \
                  .github/workflows/ci.yml .github/workflows/experiment.yml .github/workflows/refactor.yml
          git rm .github/workflows/adopt-samuel-skill-first-once.yml
          git commit -m "ops: complete Samuel skill-first pin adoption"
          git push origin HEAD:ops/adopt-samuel-skill-first
