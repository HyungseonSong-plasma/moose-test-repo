# One-shot source contract guard. Not Physics P2, no science or private rates.
name: Issue672 P6 D2 D4 Public D frozen authority contract 16 negative
on:
  push:
    branches:
      - issue-672-p6-d2-d4-authority-singleowner-contract-20261118
    paths:
      - .github/workflows/issue672-p6-d2-d4-contract-audit-once.yml
permissions:
  contents: read
concurrency:
  group: issue672-p6-d2-d4-contract-once-20261118
  cancel-in-progress: false
jobs:
  source-only-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout isolated contract evidence only
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse unauthorized changes relative to exact parent
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/issue-672-p6-d2-d4-authority-singleowner-contract-20261118"
          git diff --name-only 74a2b0fbeaf411d9c76cb82a69de1629fa55fa7f HEAD | sort > "$RUNNER_TEMP/changed.txt"
          printf '%s\n' \
            ".github/workflows/issue672-p6-d2-d4-contract-audit-once.yml" \
            "ci/guards/p6_d2_d4_public_authority_contract_guard.py" \
            "reports/issue672/p6-d2-d4-public-authority-single-owner-decision-20261118.md" \
            "reports/issue672/p6-d2-d4-public-authority-and-single-owner-contract-20261118.json" | sort > "$RUNNER_TEMP/allowed.txt"
          diff -u "$RUNNER_TEMP/allowed.txt" "$RUNNER_TEMP/changed.txt"
          python3 -m py_compile ci/guards/p6_d2_d4_public_authority_contract_guard.py
      - name: Checkout exact current PR665 parent source
        uses: actions/checkout@v4
        with:
          ref: 74a2b0fbeaf411d9c76cb82a69de1629fa55fa7f
          path: parent
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout exact unmerged PR684 candidate source
        uses: actions/checkout@v4
        with:
          ref: 3e48a0651ac53ec32e34b4b31e44098ffad80e1c
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout original historical source
        uses: actions/checkout@v4
        with:
          ref: 29d1acc6ef7969908b86719e4b95c73a1565136d
          path: historical
          fetch-depth: 1
          persist-credentials: false
      - name: Verify real source file bytes, 100 and 42 lookups, Chemistry and 16 negative mutants
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/guards/p6_d2_d4_public_authority_contract_guard.py \
            --parent "$GITHUB_WORKSPACE/parent" \
            --candidate "$GITHUB_WORKSPACE/candidate" \
            --history "$GITHUB_WORKSPACE/historical" \
            --contract "$GITHUB_WORKSPACE/reports/issue672/p6-d2-d4-public-authority-and-single-owner-contract-20261118.json" \
            --output "$RUNNER_TEMP/p6_d2_d4_authority_source_guard_receipt.json"
          python3 -m json.tool "$RUNNER_TEMP/p6_d2_d4_authority_source_guard_receipt.json" >/dev/null
          sha256sum "$RUNNER_TEMP/p6_d2_d4_authority_source_guard_receipt.json" | tee "$RUNNER_TEMP/sha256sum.txt"
      - name: Archive independent bounded SHA+negative receipt (no secret files)
        uses: actions/upload-artifact@v4
        with:
          name: issue672-p6-d2-d4-contract-source-16negative
          path: |
            ${{ runner.temp }}/p6_d2_d4_authority_source_guard_receipt.json
            ${{ runner.temp }}/sha256sum.txt
          if-no-files-found: error
          retention-days: 7
