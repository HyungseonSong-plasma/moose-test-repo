name: Harness Code Source Scan
run-name: Harness source scan @ ${{ github.sha }}

# On-demand only: manual dispatch or an explicit request-file push on the control branch.
# No regular source push, pull_request, schedule, or repository mutation by this job.
on:
  # ChatGPT can deliberately submit one request on the dedicated control branch.
  # This branch/path pair is NOT triggered by regular main/PR commits.
  push:
    branches: [issue-758-harness-scan-dispatch]
    paths: [automation/harness-scan/request.json]
  workflow_dispatch:
    inputs:
      includes:
        description: 'Comma-separated tracked-source globs'
        type: string
        required: true
        default: 'physics_harness/code/*.py,libs/hu/*.py'
      excludes:
        description: 'Optional comma-separated exclusion globs'
        type: string
        required: false
        default: ''
      collectors:
        description: 'Comma-separated built-in collector names'
        type: string
        required: true
        default: 'python_ast'
      max_files:
        description: 'Source-file scan budget (1..1500)'
        type: number
        required: true
        default: 500
      max_bytes:
        description: 'Tracked-source byte budget (1..100000000)'
        type: number
        required: true
        default: 20000000
      max_seconds:
        description: 'Elapsed scan budget (1..600)'
        type: number
        required: true
        default: 240

permissions:
  contents: read
  actions: read

concurrency:
  group: harness-source-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-scan:
    name: Exact-HEAD Harness Diagnostics (read-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 135
    steps:
      - name: Checkout ChatGPT request commit
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: scan-control
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve bounded scan request
        id: request
        shell: bash
        env:
          SCAN_UI_INCLUDES: ${{ inputs.includes }}
          SCAN_UI_EXCLUDES: ${{ inputs.excludes }}
          SCAN_UI_COLLECTORS: ${{ inputs.collectors }}
          SCAN_UI_MAX_FILES: ${{ inputs.max_files }}
          SCAN_UI_MAX_BYTES: ${{ inputs.max_bytes }}
          SCAN_UI_MAX_SECONDS: ${{ inputs.max_seconds }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          def safe_csv(value, field, *, required):
              if isinstance(value, list):
                  if any(not isinstance(item, str) for item in value):
                      raise ValueError(f"{field}: expected strings")
                  value = ",".join(value)
              if not isinstance(value, str):
                  raise ValueError(f"{field}: expected text")
              parts = tuple(part.strip() for part in value.split(",") if part.strip())
              if (len(parts) > 16 or len(set(parts)) != len(parts)
                      or any("\r" in part or "\n" in part for part in parts)
                      or (required and not parts)):
                  raise ValueError(f"{field}: invalid list")
              return ",".join(parts)

          def safe_int(value, field, maximum):
              if type(value) is bool:
                  raise ValueError(f"{field}: invalid integer")
              try:
                  integer = int(value)
              except (TypeError, ValueError) as exc:
                  raise ValueError(f"{field}: invalid integer") from exc
              if str(value) != str(integer) or not 1 <= integer <= maximum:
                  raise ValueError(f"{field}: outside 1..{maximum}")
              return str(integer)

          if os.environ["GITHUB_EVENT_NAME"] == "push":
              if os.environ["GITHUB_REF"] != "refs/heads/issue-758-harness-scan-dispatch":
                  raise ValueError("UNAUTHORIZED_SCAN_REQUEST_REF")
              path = Path("scan-control/automation/harness-scan/request.json")
              payload = json.loads(path.read_text(encoding="utf-8"))
              expected = {"schema", "request_id", "source_sha", "includes", "excludes",
                          "collectors", "max_files", "max_bytes", "max_seconds"}
              if set(payload) != expected or payload["schema"] != "harness.source_scan.v1":
                  raise ValueError("INVALID_SCAN_REQUEST_SCHEMA")
              source_sha = payload["source_sha"]
              request_id = payload["request_id"]
              params = payload
          elif os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
              source_sha = os.environ["GITHUB_SHA"]
              request_id = os.environ["GITHUB_RUN_ID"]
              params = {
                  "includes": os.environ["SCAN_UI_INCLUDES"],
                  "excludes": os.environ["SCAN_UI_EXCLUDES"],
                  "collectors": os.environ["SCAN_UI_COLLECTORS"],
                  "max_files": os.environ["SCAN_UI_MAX_FILES"],
                  "max_bytes": os.environ["SCAN_UI_MAX_BYTES"],
                  "max_seconds": os.environ["SCAN_UI_MAX_SECONDS"],
              }
          else:
              raise ValueError("UNSUPPORTED_SCAN_TRIGGER")

          if not isinstance(source_sha, str) or re.fullmatch("[0-9a-f]{40}", source_sha) is None:
              raise ValueError("INVALID_EXACT_SOURCE_SHA")
          if not isinstance(request_id, str) or re.fullmatch(r"[A-Za-z0-9._-]{1,80}", request_id) is None:
              raise ValueError("INVALID_SCAN_REQUEST_ID")

          values = {
              "SCAN_REQUEST_ID": request_id,
              "SCAN_SOURCE_SHA": source_sha,
              "SCAN_INCLUDES": safe_csv(params["includes"], "includes", required=True),
              "SCAN_EXCLUDES": safe_csv(params["excludes"], "excludes", required=False),
              "SCAN_COLLECTORS": safe_csv(params["collectors"], "collectors", required=True),
              "SCAN_MAX_FILES": safe_int(params["max_files"], "max_files", 1500),
              "SCAN_MAX_BYTES": safe_int(params["max_bytes"], "max_bytes", 100000000),
              "SCAN_MAX_SECONDS": safe_int(params["max_seconds"], "max_seconds", 600),
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              for key, value in values.items():
                  stream.write(f"{key}={value}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"source_sha={source_sha}\n")
          print(f"SCAN_SOURCE_SHA={source_sha}")
          print(f"SCAN_REQUEST_EVENT={os.environ['GITHUB_EVENT_NAME']}")
          PY

      - name: Checkout selected exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.source_sha }}
          path: scan-source
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact scanned-source HEAD
        shell: bash
        run: test "$(git -C scan-source rev-parse HEAD)" = "$SCAN_SOURCE_SHA"

      - name: Checkout modern pinned Harness engine
        uses: actions/checkout@v4
        with:
          ref: 156a5117ebe6816e67b352a9470572c2e74da367
          path: scan-engine
          fetch-depth: 1
          persist-credentials: false
      - name: Assert Harness engine pinned
        run: test "$(git -C scan-engine rev-parse HEAD)" = "156a5117ebe6816e67b352a9470572c2e74da367"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Harness scan dependencies
        run: python -m pip install -r scan-engine/physics_harness/code/requirements.txt

      - name: Run G1–G6 exact-source Python and negative controls
        shell: bash
        working-directory: scan-source
        run: |
          set -euo pipefail
          python3 -m pip install 'pytest>=8,<9'
          python3 -m pytest -q \
            tests/test_issue652_poisson_g1_json_contract.py \
            tests/test_issue652_poisson_g2_density_ownership.py \
            tests/test_issue652_poisson_g3_charge_ownership.py \
            tests/test_issue652_poisson_g4_fem_ownership.py \
            tests/test_issue652_poisson_g5_source_retirement.py \
            tests/test_issue652_poisson_g6_registration_p3.py \
            tests/test_issue633_newonly_run_species_schema.py \
            tests/test_issue402_retired_charge_poisson_ownership.py

      - name: Run scoped source scan and export evidence
        shell: bash
        working-directory: scan-engine
        run: |
          set -euo pipefail
          python - <<'PY'
          from collections import Counter
          from collections.abc import Mapping
          from dataclasses import fields, is_dataclass
          import json
          import os
          from pathlib import Path

          from physics_harness.code.diagnostics import (
              GitSourceProvider, ScanBudget, ScanRequest, run_scan,
          )

          output = Path("../harness-scan-output")
          output.mkdir(exist_ok=True)

          def json_value(value):
              if is_dataclass(value) and not isinstance(value, type):
                  return {item.name: json_value(getattr(value, item.name))
                          for item in fields(value)}
              if isinstance(value, Mapping):
                  return {str(key): json_value(item) for key, item in value.items()}
              if isinstance(value, (tuple, list)):
                  return [json_value(item) for item in value]
              if isinstance(value, (set, frozenset)):
                  return [json_value(item) for item in sorted(value, key=repr)]
              if value is None or isinstance(value, (str, bool, int, float)):
                  return value
              raise TypeError(f"unsupported scan result value: {type(value).__name__}")

          def save(name, value):
              (output / name).write_text(
                  json.dumps(json_value(value), sort_keys=True, indent=2,
                             ensure_ascii=False, allow_nan=False) + "\n",
                  encoding="utf-8",
              )

          def tokens(name, *, required):
              result = tuple(part.strip() for part in os.environ[name].split(",")
                             if part.strip())
              if len(result) > 16 or len(result) != len(set(result)):
                  raise ValueError(f"{name}: duplicate or excessive entries")
              if required and not result:
                  raise ValueError(f"{name}: no entries")
              return result

          def bounded(name, maximum):
              value = int(os.environ[name])
              if not 1 <= value <= maximum:
                  raise ValueError(f"{name}: outside 1..{maximum}")
              return value

          try:
              collectors = tokens("SCAN_COLLECTORS", required=True)
              valid_collectors = {"python_ast", "workflow", "cpp", "moose_input"}
              if not set(collectors) <= valid_collectors:
                  raise ValueError("unknown or unsupported collector")
              request = ScanRequest(
                  repository=os.environ["GITHUB_REPOSITORY"],
                  revision=os.environ["SCAN_SOURCE_SHA"],
                  includes=tokens("SCAN_INCLUDES", required=True),
                  excludes=tokens("SCAN_EXCLUDES", required=False),
                  collectors=collectors,
                  budget=ScanBudget(
                      max_files=bounded("SCAN_MAX_FILES", 1500),
                      max_bytes=bounded("SCAN_MAX_BYTES", 100000000),
                      max_seconds=bounded("SCAN_MAX_SECONDS", 600),
                  ),
              )
              save("request.json", request)
              save("engine-provenance.json", {"harness_engine_sha":"156a5117ebe6816e67b352a9470572c2e74da367","target_source_sha":request.revision,"runtime":"GitSourceProvider → run_scan"})
              result = run_scan(request, GitSourceProvider(Path('../scan-source')))
              verification = result.verification
              if verification is None:
                  raise ValueError("MISSING_VERIFICATION_RECEIPT")

              save("graph.json", result.graph)
              save("evidence-receipt.json", result.receipt)
              save("verification-receipt.json", verification)
              summary = {
                  "repository": request.repository,
                  "revision": request.revision,
                  "run_id": os.environ["GITHUB_RUN_ID"],
                  "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                  "request_id": os.environ["SCAN_REQUEST_ID"],
                  "request_event": os.environ["GITHUB_EVENT_NAME"],
                  "request_revision": os.environ["GITHUB_SHA"],
                  "scope_id": result.receipt.scope_id,
                  "scan_status": result.status,
                  "verification_status": verification.status,
                  "files_by_status": dict(sorted(Counter(
                      item.status for item in result.receipt.files
                  ).items())),
                  "nodes": len(result.graph.nodes),
                  "edges": len(result.graph.edges),
                  "evidence": len(result.graph.evidence),
                  "unresolved_count": len(result.receipt.unresolved),
                  "unresolved": list(result.receipt.unresolved),
                  "verification_failures": list(verification.failures),
                  "unverified_properties": list(verification.unverified_properties),
                  "semantic_compatibility_proven": False,
                  "global_consumer_closure_proven": False,
                  "safe_delete_authorized": False,
              }
              save("summary.json", summary)
              print(json.dumps(summary, sort_keys=True, indent=2))
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as report:
                  report.write(
                      "## Exact-HEAD Harness source scan\n\n"
                      f"- Revision: `{request.revision}`\n"
                      f"- Scope: `{result.receipt.scope_id}`\n"
                      f"- Scan coverage: **{result.status}**\n"
                      f"- Source verification: **{verification.status}**\n"
                      f"- Files: {result.receipt.included_count}; "
                      f"scanned: {result.receipt.scanned_count}\n"
                      f"- Nodes: {len(result.graph.nodes)}; "
                      f"edges: {len(result.graph.edges)}; "
                      f"evidence: {len(result.graph.evidence)}\n"
                      f"- Unresolved facts: {len(result.receipt.unresolved)}\n\n"
                      "**Scope completion is not runtime equivalence, "
                      "global consumer closure, or deletion permission.**\n"
                  )
              if verification.status == "FAILED":
                  raise ValueError("SOURCE_VERIFICATION_FAILED")
              if result.status != "COMPLETE" or verification.status != "VERIFIED":
                  print("::warning::Scoped scan is PARTIAL/UNVERIFIED; review receipts.")
          except Exception as error:
              save("execution-error.json", {
                  "type": type(error).__name__, "message": str(error),
                  "revision": os.environ.get("SCAN_SOURCE_SHA", ""),
              })
              raise
          PY

      - name: Checkout immutable historical public S6 mesh and support
        uses: actions/checkout@v4
        with:
          ref: 29d1acc6ef7969908b86719e4b95c73a1565136d
          path: historical
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare exact public historical 400W mesh, no private tables
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          test "$SCAN_SOURCE_SHA" = "548d5328d9a4f4469658d2785652b2bda7034643"
          test "$(git -C scan-source rev-parse HEAD)" = "$SCAN_SOURCE_SHA"
          python3 -m pip install --disable-pip-version-check --quiet \
            numpy==2.1.2 scipy==1.14.1 matplotlib==3.9.2
          cd historical
          SRC=.github/oxygen25_eedf/initial_mixture_23xsec_transport.txt
          DST=experiments/Issue91_real_qvt_r3/r3_e0/electron_moments.txt
          echo "35534a522fa48ccb5222339c5040040630eef31e623e1c53f1e1c4540d2d653b  $SRC" | sha256sum --check -
          cp "$SRC" "$DST"
          export CHATGPT_WORK_BASE_SHA=29d1acc6ef7969908b86719e4b95c73a1565136d
          export OXYGEN_RESEARCH_400=1
          export OXYGEN_RESEARCH_FULL24=0
          export OXYGEN_RESEARCH_EI2738_FORMULA=0
          export OXYGEN_RESEARCH_QUICK_5MIN=0
          CHEM=experiments/Issue395_powered_chemistry_ladder
          bash "$CHEM/issue397_l1_power_scan_replay.sh" prepare 400
          python3 .github/scripts/oxygen_legacy6_latest_100us.py --power-w 400 --prepare
          echo "ac70642df75bf7b4bc4ec0d92511e545f0942f9e07a1361618fb9eb5696b83fc  $CHEM/baseline_plasma_plus_unstructured_cover_plus_wafer.msh" | sha256sum --check -
          test ! -e "$CHEM/private_rates"
          echo G5_PUBLIC_HISTORICAL_SOURCE_AND_MESH_PASS

      - name: Download SHA-pinned P3X public staged sources and independent stager
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/g5-source"
          curl --fail --location --silent --show-error --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/14406746397/zip" \
            -o "$RUNNER_TEMP/g5-source/p3x-source.zip"
          echo "592a7c82834bab841f6a2e1807db305d0eff1e953f50a0dcc6d7e21ff8820111  $RUNNER_TEMP/g5-source/p3x-source.zip" | sha256sum --check -
          curl --fail --location --silent --show-error --retry 3 \
            "https://raw.githubusercontent.com/HyungseonSong-plasma/moose-test-repo/41ab61e442a497db2388c025075237bd24cfd025/ci/issue671_p5_d8_native_probe.py" \
            -o "$RUNNER_TEMP/g5-source/pinned_public_stager.py"
          test "$(git hash-object "$RUNNER_TEMP/g5-source/pinned_public_stager.py")" = 8bf49b7807c9f9b3eed8e622e72062f2b5c822bc
          python3 -m py_compile "$RUNNER_TEMP/g5-source/pinned_public_stager.py"
          echo G5_PINNED_P3X_AND_STAGER_PASS

      - name: Stage exact P3X → P4X → G5 15 owners in disposable S6 Scratch
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          export G5_EXPECTED_SOURCE_HEAD="$SCAN_SOURCE_SHA"
          python3 "$RUNNER_TEMP/g5-source/pinned_public_stager.py" \
            --source "$GITHUB_WORKSPACE/scan-source" \
            --repo-head "$SCAN_SOURCE_SHA" \
            --artifact "$RUNNER_TEMP/g5-source/p3x-source.zip" \
            --historical-mesh "$GITHUB_WORKSPACE/historical/experiments/Issue395_powered_chemistry_ladder/baseline_plasma_plus_unstructured_cover_plus_wafer.msh" \
            --historical-support-root "$GITHUB_WORKSPACE/historical" \
            --output "$RUNNER_TEMP/g5-staged" --stage-only
          python3 scan-source/ci/guards/issue652_g5_native_p2.py \
            --staged "$RUNNER_TEMP/g5-staged" \
            --output "$RUNNER_TEMP/g5-result" --stage-only
          cp "$RUNNER_TEMP/g5-result/g5_stage_receipt.json" harness-scan-output/g5_stage_receipt.json
          echo G5_417_941_SOURCE_CUTOVER_READY_P2_HOLD

      - name: Build exact G6 PhysicsApp once in pinned OCI
        shell: bash
        timeout-minutes: 75
        run: |
          set -euo pipefail
          OCI='ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008'
          test "$(git -C scan-source rev-parse HEAD)" = "$SCAN_SOURCE_SHA"
          test "$SCAN_SOURCE_SHA" = "548d5328d9a4f4469658d2785652b2bda7034643"
          test ! -e scan-source/physics_app/physics-opt
          docker pull "$OCI"
          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace \
            --mount "type=bind,src=$GITHUB_WORKSPACE/scan-source,dst=/workspace" \
            "$OCI" -lc '
              set -euo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt
              make -C physics_app -j2 app_non_unity_dirs="%/utils"
              test -x physics_app/physics-opt
              test -s physics_app/lib/libphysics-opt.so.0
            ' 2>&1 | tee harness-scan-output/g5_build.log
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path("scan-source"); out=pathlib.Path("harness-scan-output")
          binary=root/"physics_app/physics-opt"
          d={"schema":"issue652.g6.p1_exact_source.v1","source_sha":os.environ["SCAN_SOURCE_SHA"],
             "oci":"ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008","binary_sha256":hashlib.sha256(binary.read_bytes()).hexdigest(),
             "build_log_sha256":hashlib.sha256((out/"g5_build.log").read_bytes()).hexdigest(),
             "P1":"PASS","P2":"NOT_RUN","science":"SCIENCE_HOLD"}
          (out/"g5_p1_identity.json").write_text(json.dumps(d,indent=2,sort_keys=True)+"\n")
          print("G5_P1_COMPILE_SOURCE_SHA_PASS",d["source_sha"],d["binary_sha256"])
          PY

      - name: Build independent G6 MOOSE registration observer in pinned OCI
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          OCI='ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008'
          mkdir -p "$RUNNER_TEMP/g6-observer"
          docker run --rm --network none --entrypoint /bin/bash --user 0:0 \
            --mount "type=bind,src=$GITHUB_WORKSPACE/scan-source/ci/guards,dst=/observer,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/g6-observer,dst=/out" \
            "$OCI" -lc 'set -euo pipefail; source /environment; g++ -std=c++17 -O2 -fPIC -shared -o /out/g6_owner_tracer.so /observer/issue652_g6_owner_tracer.cc -ldl'
          test -s "$RUNNER_TEMP/g6-observer/g6_owner_tracer.so"
          nm -D "$RUNNER_TEMP/g6-observer/g6_owner_tracer.so" | grep -Fq '_ZN13FEProblemBase11addVariable'
          nm -D "$RUNNER_TEMP/g6-observer/g6_owner_tracer.so" | grep -Fq '_ZN13FEProblemBase18addFunctorMaterial'
          nm -D "$RUNNER_TEMP/g6-observer/g6_owner_tracer.so" | grep -Fq '_ZN13FEProblemBase20addBoundaryCondition'
          cp "$RUNNER_TEMP/g6-observer/g6_owner_tracer.so" scan-source/physics_app/g6_owner_tracer.so
          chmod 0755 scan-source/physics_app/g6_owner_tracer.so
          cmp "$RUNNER_TEMP/g6-observer/g6_owner_tracer.so" scan-source/physics_app/g6_owner_tracer.so
          echo G6_INDEPENDENT_ELF_OBSERVER_READY

      - name: Real protected-rate G6 15-owner trace and bounded 3ns P3 for both S6 cases
        shell: bash
        timeout-minutes: 35
        env:
          PROTECTED_ARCHIVE_B64: ${{ secrets.OXYGEN24_RATES_TAR_XZ_B64 }}
        run: |
          set -euo pipefail
          umask 077
          export G5_EXPECTED_SOURCE_HEAD="$SCAN_SOURCE_SHA"
          export G6_EXPECTED_SOURCE_SHA="$SCAN_SOURCE_SHA"
          mkdir -p "$RUNNER_TEMP/g6-result"
          if ! python3 scan-source/ci/guards/issue652_g6_runtime_gate.py \
            --staged "$RUNNER_TEMP/g5-staged" \
            --output "$RUNNER_TEMP/g6-result/g6_registration_p3_receipt.json"; then
            if test -s "$RUNNER_TEMP/g6-result/g6_registration_p3_receipt.json"; then
              cp "$RUNNER_TEMP/g6-result/g6_registration_p3_receipt.json" harness-scan-output/g6_registration_p3_receipt.json
            fi
            exit 1
          fi
          cp "$RUNNER_TEMP/g6-result/g6_registration_p3_receipt.json" harness-scan-output/g6_registration_p3_receipt.json
          echo G6_REGISTERED_15_AND_SHORT_3NS_417_941_PASS_BASELINE_SCIENCE_HOLD

      - name: Upload Graph and provenance receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-source-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: harness-scan-output/
          if-no-files-found: warn
          retention-days: 30
