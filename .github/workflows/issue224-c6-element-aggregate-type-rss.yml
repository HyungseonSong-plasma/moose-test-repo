name: Issue-224 C6 element-aggregate type OS RSS discriminator

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/issue224-c6-element-aggregate-type-rss.yml'
      - 'experiments/Issue224_element_aggregate_memory/run_c6.py'
  workflow_dispatch:

concurrency:
  group: issue224-c6-element-aggregate-type-rss-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
  MOOSE_SHA: 9f388366ccf38b9c34542ec5561198249fde0ac9
  CRANE_SHA: ba26970cf419dcac563a20ed7079d445bc6341c3
  SQUIRREL_SHA: 16a26d504f3ee11161a86d4e3ebf3c0e5f2afbb1
  ZAPDOS_SHA: 9eceffbc46048c3760bbfa9a7f1ca681ae35af1d

jobs:
  element-aggregate-type-rss:
    name: R2 zero-timestep element-aggregate type OS RSS split
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate immutable build-base identity
        shell: bash
        run: |
          set -euxo pipefail
          source physics_app/dependencies.lock
          test "$MOOSE" = "$MOOSE_SHA"
          test "$CRANE" = "$CRANE_SHA"
          test "$SQUIRREL" = "$SQUIRREL_SHA"
          test "$ZAPDOS" = "$ZAPDOS_SHA"
          docker pull "$BUILD_BASE_REF"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.moose.sha" }}')" = "$MOOSE_SHA"

      - name: P0 C6 type-split self-test
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace \
            -e GITHUB_SHA="$GITHUB_SHA" \
            -v "$PWD:/workspace" "$BUILD_BASE_REF" -lc '
              source /environment
              export PYTHONPATH=/workspace
              git config --global --add safe.directory /workspace
              test "$(git -C /workspace rev-parse HEAD)" = "$GITHUB_SHA"
              test -x /usr/bin/time
              uv pip install --system --python "$(command -v python3)" -r requirements-evidence-engine.txt
              python3 -m py_compile /workspace/experiments/Issue224_element_aggregate_memory/run_c6.py
              python3 /workspace/experiments/Issue224_element_aggregate_memory/run_c6.py --self-test
            '

      - name: Build exact head and execute C6 type RSS split
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf issue224-c6-element-aggregate-type-rss-results
          mkdir -p issue224-c6-element-aggregate-type-rss-results
          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace \
            -e GITHUB_SHA="$GITHUB_SHA" \
            -v "$PWD:/workspace" "$BUILD_BASE_REF" -lc '
              set -euxo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt
              export PYTHONPATH=/workspace
              uv pip install --system --python "$(command -v python3)" -r requirements-evidence-engine.txt
              test "$(git -C /workspace rev-parse HEAD)" = "$GITHUB_SHA"
              test ! -e physics_app/physics-opt
              make -C physics_app -j2
              test -x physics_app/physics-opt
              python3 /workspace/experiments/Issue224_element_aggregate_memory/run_c6.py \
                --physics-opt /workspace/physics_app/physics-opt \
                --results-root /workspace/issue224-c6-element-aggregate-type-rss-results \
                --timeout 180
            '

      - name: Verify C6 setup-only RSS contract and attribution
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          s = json.loads(Path('issue224-c6-element-aggregate-type-rss-results/summary.json').read_text())
          assert s['status'] == 'ISSUE224_C6_TYPE_ATTRIBUTION_READY'
          assert s['diagnostic'] == 'C6_ELEMENT_AGGREGATE_TYPE_OS_RSS'
          assert s['physical_timesteps_authorized'] == 0
          assert s['decision']['full_r2_solve_executed'] is False
          assert s['decision']['promotion_authorized'] is False
          assert s['decision']['production_control_drift']['stable'] is True
          assert s['decision']['positive_control_classification'] == 'MAJOR'
          assert set(s['decision']['type_classification']) == {
              'element_average', 'ad_element_integral'
          }
          assert s['cases']['r2_element_average_deferred']['meta']['observer_mutation']['target_type_counts'] == {
              'ElementAverageFunctorPostprocessor': 45
          }
          assert s['cases']['r2_ad_element_integral_deferred']['meta']['observer_mutation']['target_type_counts'] == {
              'ADElementIntegralFunctorPostprocessor': 12
          }
          assert s['cases']['r2_element_aggregate_all_deferred']['meta']['observer_mutation']['target_type_counts'] == {
              'ADElementIntegralFunctorPostprocessor': 12,
              'ElementAverageFunctorPostprocessor': 45
          }
          for name, case in s['cases'].items():
              assert case['hard_pass'] is True, name
              assert case['guards']['no_linear_solve'] is True, name
              assert case['guards']['no_physical_timestep'] is True, name
              assert case['guards']['num_steps_is_zero'] is True, name
              assert case['memory']['os_max_rss_mib'] > 0.0, name
              assert case['memory']['authoritative_peak_metric'] == 'os_max_rss_mib', name
          print({
              'STATUS': s['status'],
              'CLASSIFICATION': s['decision']['classification'],
              'TYPE_CLASSIFICATION': s['decision']['type_classification'],
              'POSITIVE_CONTROL': s['decision']['positive_control_classification'],
              'COMPARISONS': s['decision']['comparisons'],
              'INTERACTION_RESIDUAL_MIB': s['decision']['interaction_residual_mib'],
              'CONTROL_DRIFT': s['decision']['production_control_drift'],
          })
          PY

      - name: Upload Issue-224 C6 type-RSS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue224-c6-element-aggregate-type-rss-evidence
          path: issue224-c6-element-aggregate-type-rss-results/**
          if-no-files-found: error
          retention-days: 7
