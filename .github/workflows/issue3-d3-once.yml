name: Issue 3 D3 combined primary-current one-shot

on:
  push:
    branches:
      - issue3-d0-dielectric-surface-charge
    paths:
      - '.github/workflows/issue3-d3-once.yml'
      - 'experiments/Issue3_dielectric_surface_charge/d3_combined_primary.i'
      - 'experiments/Issue3_dielectric_surface_charge/analyze_d3.py'

permissions:
  contents: read

jobs:
  d3:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008

    steps:
      - uses: actions/checkout@v4

      - name: Pull build image
        run: docker pull "$BUILD_BASE_REF"

      - name: Build and run D3 combined-current discriminator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p experiments/Issue3_dielectric_surface_charge/output_d3

          docker run --rm --entrypoint /bin/bash --user 0:0 \
            --workdir /workspace -v "$GITHUB_WORKSPACE:/workspace" \
            "$BUILD_BASE_REF" -lc '
              set -euo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory /opt/physics_vendor/moose
              git config --global --add safe.directory /opt/physics_vendor/crane
              git config --global --add safe.directory /opt/physics_vendor/squirrel
              git config --global --add safe.directory /opt/physics_vendor/zapdos
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt

              python3 -m py_compile experiments/Issue3_dielectric_surface_charge/analyze_d3.py
              make -C physics_app -j2

              cd experiments/Issue3_dielectric_surface_charge
              rm -f d3_combined_primary_out.csv

              set +e
              ../../physics_app/physics-opt -i d3_combined_primary.i --check-input > output_d3/check_input.log 2>&1
              check_rc=$?
              set -e
              echo "check_rc=$check_rc" > output_d3/check_status.txt
              if [ "$check_rc" -ne 0 ]; then
                cat output_d3/check_input.log
                exit "$check_rc"
              fi

              set +e
              ../../physics_app/physics-opt -i d3_combined_primary.i > output_d3/run.log 2>&1
              run_rc=$?
              set -e
              echo "run_rc=$run_rc" > output_d3/run_status.txt
              if [ "$run_rc" -ne 0 ]; then
                cat output_d3/run.log
                exit "$run_rc"
              fi

              cp d3_combined_primary_out.csv output_d3/
              python3 analyze_d3.py d3_combined_primary_out.csv | tee output_d3/analysis.json
            '

      - name: Upload D3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue3-d3-evidence
          path: experiments/Issue3_dielectric_surface_charge/output_d3/**
          if-no-files-found: warn
          retention-days: 30
