# TEMPORARY P6-C1/C2/C3 source-only guard execution harness.
# Corrected aliases after fail-closed proof: 24a2b278c3bd33649cb2c83be33e7abb2febd4eb
# Scoped to this branch AND this file path; delete once evidence is read back.
# Does not build PhysicsApp, run Native, dispatch P3/P4, use protected EI,
# or alter .github/workflows/ci.yml.
name: Issue672 P6 CI Guard source-only P0 once
on:
  push:
    branches: [issue-672-p6-c3-artifact-compat-20261118]
    paths:
      - .github/workflows/issue672-p6-ci3-source-guards-p0-once.yml
permissions:
  contents: read
jobs:
  p6-ci-guard-p0:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Exact source and no-solver assertion
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test -s ci/guards/p6_ci_workflow_safety_guard.py
          test -s tests/test_issue672_p6_ci_workflow_safety.py
          test -s .github/workflows/ci.yml
          test -s ci/workflow_templates/general-ci.yml
          mkdir -p p6_ci_guard_evidence
          echo "source_sha=${{ github.sha }}" > p6_ci_guard_evidence/source.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run real P6 CI Python guard and all 21 failure mutations
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ci/guards/p6_ci_workflow_safety_guard.py tests/test_issue672_p6_ci_workflow_safety.py
          python3 ci/guards/p6_ci_workflow_safety_guard.py --self-test --check 2>&1 | tee p6_ci_guard_evidence/p6_guard.log
      - name: Run real P6 focused pytest
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'pytest>=8,<9'
          python3 -m pytest -q tests/test_issue672_p6_ci_workflow_safety.py 2>&1 | tee p6_ci_guard_evidence/pytest.log
      - name: Run Workflow Harness and governed Surface Guard (candidate surface)
        shell: bash
        run: |
          set -euo pipefail
          # Temporary branch-only execution YAML is not part of approved final surface.
          # Remove it in this ephemeral worktree, NOT in git history or remote.
          test -s .github/workflows/issue672-p6-ci3-source-guards-p0-once.yml
          rm .github/workflows/issue672-p6-ci3-source-guards-p0-once.yml
          python3 ci/workflow_harness.py --self-test 2>&1 | tee p6_ci_guard_evidence/harness_self_test.log
          python3 ci/workflow_harness.py --check 2>&1 | tee p6_ci_guard_evidence/harness_check.log
          python3 ci/guards/workflow_surface_guard.py --self-test 2>&1 | tee p6_ci_guard_evidence/surface_self_test.log
          python3 ci/guards/workflow_surface_guard.py --check 2>&1 | tee p6_ci_guard_evidence/surface_check.log
      - name: Create bounded immutable execution receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,datetime
          root=pathlib.Path("p6_ci_guard_evidence")
          source=pathlib.Path(".github/workflows/ci.yml")
          generated=pathlib.Path("ci/workflow_templates/general-ci.yml")
          def sha(f):
              return hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()
          data={
              "schema":"issue672.p6_ci_guard_exact_source_execution.v1",
              "source_sha":os.environ["GITHUB_SHA"],
              "run_id":os.environ["GITHUB_RUN_ID"],
              "run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],
              "workflow_git_sha":sha(source),
              "template_git_sha":sha(generated),
              "byte_parity":source.read_bytes()==generated.read_bytes(),
              "scope":"source-only Python guard/pytest/harness/surface; NO Native, P3, P4, private rates",
              "logs":{p.name:sha(p) for p in sorted(root.glob("*.log"))},
          }
          (root/"execution_receipt.json").write_text(json.dumps(data,sort_keys=True,indent=2)+"\n")
          print("P6_CI_GUARD_P0_RECEIPT",data["source_sha"],data["byte_parity"])
          PY
      - name: Always upload P0-only evidence, never scratch/private rates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue672-p6-ci3-source-guards-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: p6_ci_guard_evidence/**
          if-no-files-found: error
          retention-days: 30
