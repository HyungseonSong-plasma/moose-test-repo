name: Issue402 real public S6 Wall cutover P0 one-shot
on:
  push:
    branches: [issue-402-species-functor-naming]
    paths:
      - .github/workflows/issue402-s6-real-public-wall-p0-once.yml
permissions:
  contents: read
jobs:
  s6-public-wall-p0:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact-head and P3 exclusion
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "SOURCE_HEAD=$GITHUB_SHA P3=NOT_RUN SCIENCE=SCIENCE_HOLD"
      - name: P0 replay against immutable public S6-417/941 C archive bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'pytest>=8,<9'
          python3 -m py_compile experiments/Issue402_plasma_dsl_g1/chemistry/prepare_s6_run_input.py
          python3 -m pytest -q tests/test_issue402_s6_wall_naming_staging.py
          echo 'ISSUE402_REAL_PUBLIC_S6_WALL_CUTOVER_P0_PASS'
