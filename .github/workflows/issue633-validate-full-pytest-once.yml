name: Issue633 repository validate full pytest one-shot
on:
  push:
    branches:
      - issue-633-validate-pytest-pin-fixtures-20261118
permissions:
  contents: read
jobs:
  validate_full_pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact Repository CI validate pytest dependencies
        run: >-
          python -m pip install
          'pydantic>=2,<3'
          'pytest>=8,<9'
          'numpy>=1.26,<3'
          'scipy>=1.14,<2'
          'matplotlib>=3.8,<4'
          -r requirements-evidence-engine.txt
          -r requirements-ontology.txt
      - name: Run Physics pytest
        run: python -m pytest -q
