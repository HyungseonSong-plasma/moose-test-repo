                                          conversions[side][species]={"observed_kg_s":mass,"number_to_mass_kg_s":expected_mass,
                                            "within_tolerance":bool(mass is not None and expected_mass is not None
                                               and math.isclose(mass,expected_mass,rel_tol=1e-8,abs_tol=1e-18))}
                                      n={sp:vals.get(f"rf_d8_{side}_{sp}_number") for sp in ("O2p","Op","Om","electron")}
                                      expected_current=(e_charge*(n["O2p"]+n["Op"]-n["Om"]-n["electron"])
