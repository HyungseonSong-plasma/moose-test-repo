                                          d8_required += [f"rf_d8_{side}_{sp}_number" for sp in ("O2p","Om","Op","electron")]
                                      d8_required += [f"rf_d8_{side}_{sp}_mass" for sp in ("O2p","Om","Op")]
                                      d8_required += [f"rf_d8_{side}_sigma_integral",f"rf_d8_{side}_residual_l2"]
                                  d8_required += ["rf_d8_poisson_charge_number","rf_d8_poisson_charge_C","rf_d8_poisson_residual_l2"]
