                                          for v in r["d8_coupled_postprocessors"].values()))
                                  r["d8_wall_number_count"]=sum(key.endswith("_number")
                                      for key in r["d8_coupled_postprocessors"])
                                  r["d8_surface_current_count"]=sum(key.endswith("_current")
                                      for key in r["d8_coupled_postprocessors"])
                                  r["d8_mass_flux_count"]=sum(key.endswith("_mass")
                                      for key in r["d8_coupled_postprocessors"])
                                  vals=r["d8_coupled_postprocessors"]
                                  e_charge=1.602176634e-19
                                  avogadro=6.02214076e23
                                  masses={"O2p":0.032,"Om":0.016,"Op":0.016}
