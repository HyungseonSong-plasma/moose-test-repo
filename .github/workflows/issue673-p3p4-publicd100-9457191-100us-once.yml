          def read_final_csv(p):
              with open(p,newline="") as f:
                  records=list(csv.DictReader(f))
              if not records: return {}
              return {k:float(v) for k,v in records[-1].items()
                      if v is not None and v.strip() and math.isfinite(float(v))}
          def limit_log(raw):
              # Never upload raw protected-rate files or full solver output.
              clean=re.sub(r"/dev/shm/[^ '\n\"]+","[PROTECTED_SCRATCH]",raw)
              rx=re.compile(r"Time Step|Solve Converged|Solve failed|^.*ERROR|^.*Error|maxwell|MultiApp|transfer|Converged|DIVERGED|P_abs|Nonlinear|^.*Exception|residual|sigma_s|sigma_wafer|sigma_focus_ring|potential",re.I)
              return "\n".join(line[:350] for line in clean.splitlines() if rx.search(line))[-18000:]
          def run_native(work,ordered,extra,check=False):
              argv=["/workspace/physics_app/physics-opt"]
              if check: argv+=["--check-input"]
              argv+=["-i",*ordered,str(chemroot/extra),
                      "Executioner/num_steps=3",
                      "Outputs/csv=true","Outputs/exodus=false","Outputs/checkpoint=false",
                      "Outputs/file_base=rf_full_plasma",
                      "MultiApps/maxwell_t6/input_files=rf_full_d8_child.i",
                      "MultiApps/maxwell_t6/cli_args=Outputs/exodus=false;Outputs/csv=true"]
