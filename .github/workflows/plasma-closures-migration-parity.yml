name: One-shot Plasma Closures Migration Parity

on:
  push:
    branches:
      - issue-336-standard-scalarized-convergence
    paths:
      - 'physics_app/include/**'
      - 'physics_app/src/**'
      - 'experiments/Issue337_plasma_closures_migration/**'
      - '.github/workflows/plasma-closures-migration-parity.yml'

permissions:
  contents: read
  packages: read

env:
  BUILD_BASE: ghcr.io/hyungseonsong-plasma/physics-build-base:moose-9f388366-deps-ba26970-16a26d5-9eceffb-v1

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and validate closure migration
        shell: bash
        run: |
          set -euxo pipefail
          docker pull "$BUILD_BASE"
          docker run --rm \
            --entrypoint /bin/bash \
            --user 0:0 \
            --workdir /workspace \
            -v "$PWD:/workspace" \
            "$BUILD_BASE" \
            -lc '
              set -euxo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt
              export PYTHONPATH=/workspace

              make -C /workspace/physics_app -j2

              python3 /workspace/experiments/Issue337_plasma_closures_migration/control.py --horizon short --p0
              python3 /workspace/experiments/Issue337_plasma_closures_migration/control.py --horizon short --p1
              python3 /workspace/experiments/Issue337_plasma_closures_migration/control.py --horizon short --run

              python3 /workspace/experiments/Issue337_plasma_closures_migration/control.py --horizon full --p0
              python3 /workspace/experiments/Issue337_plasma_closures_migration/control.py --horizon full --p1
              python3 /workspace/experiments/Issue337_plasma_closures_migration/control.py --horizon full --run
            '

      - name: Upload migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plasma-closures-migration-evidence
          path: |
            experiments/Issue337_plasma_closures_migration/results_short
            experiments/Issue337_plasma_closures_migration/results_full
          if-no-files-found: ignore
