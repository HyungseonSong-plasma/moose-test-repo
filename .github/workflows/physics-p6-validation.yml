name: Physics P6 validation (manual)
run-name: Physics P6 validation (manual) @ ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact selected branch HEAD SHA'
        required: true
        type: string
      pr_number:
        description: 'Open same-repository PR into main (empty only for main)'
        required: false
        type: string
      validation_approval:
        description: 'Type NATIVE_VALIDATION_APPROVED to run'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: physics-p6-validation-${{ github.sha }}
  cancel-in-progress: false

jobs:
  p6_newonly_s6_build:
    name: "P6 mandatory New-only W1 exact HEAD / ELF and 2 app libs (no Native)"
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    permissions:
      contents: read
      pull-requests: read
    env:
      SOURCE_HEAD: ${{ github.sha }}
      OCI: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
    steps:
      - name: Verify explicit manual approval and current source scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.source_sha }}
          REQUESTED_PR: ${{ inputs.pr_number }}
          APPROVAL: ${{ inputs.validation_approval }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = HyungseonSong-plasma/moose-test-repo
          test "$APPROVAL" = NATIVE_VALIDATION_APPROVED
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$REQUESTED_SHA" = "$GITHUB_SHA"
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            test -z "$REQUESTED_PR"
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$REQUESTED_SHA"
          else
            [[ "$REQUESTED_PR" =~ ^[1-9][0-9]*$ ]]
            gh api "repos/$GITHUB_REPOSITORY/pulls/$REQUESTED_PR" | jq -e \
              --arg repo "$GITHUB_REPOSITORY" --arg sha "$REQUESTED_SHA" --arg ref "${GITHUB_REF#refs/heads/}" \
              '.state == "open" and .base.repo.full_name == $repo and .base.ref == "main" and .head.repo.full_name == $repo and .head.sha == $sha and .head.ref == $ref' >/dev/null
          fi
      - name: Checkout immutable PR HEAD for main integration
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Validate P6 split-CI Native build and unsafe-bypass contracts
        run: |
          set -euo pipefail
          python3 ci/guards/p6_ci_workflow_safety_guard.py --self-test --check
      - name: Validate source, OCI and vendor commits before build
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test -z "$(git status --porcelain --untracked-files=no -- physics_app ci/physics-build-base)"
          test ! -e physics_app/physics-opt
          test "$(git hash-object physics_app/dependencies.lock)" = 0aae0ffb5699fcd5c17e8ebe9ea4f2effde9ff47
          grep -Fqx "PHYSICS_BUILD_BASE=$OCI" physics_app/dependencies.lock
          docker pull "$OCI"
          for pair in 'moose MOOSE' 'crane CRANE' 'squirrel SQUIRREL' 'zapdos ZAPDOS'; do
            read -r key envname <<< "$pair"
            expected="$(sed -n "s/^$envname=//p" physics_app/dependencies.lock)"
            actual="$(docker image inspect "$OCI" --format "{{ index .Config.Labels \"io.physics.$key.sha\" }}")"
            test -n "$expected"
            test "$expected" = "$actual"
          done
          mkdir -p evidence
          docker run --rm --entrypoint /bin/bash "$OCI" -lc '
            set -euo pipefail
            source /environment
            command -v g++
            g++ --version | head -1
            command -v make
            test -f /opt/physics_vendor/moose/framework/Makefile
            test -f /opt/physics-build-base/BUILD_BASE_PROVENANCE.txt
          ' > evidence/toolchain.log
          echo P5_0_EXACT_HEAD_SOURCE_AND_VENDOR_OCI_PASS
      - name: Build PhysicsApp exactly one time in the pinned OCI image
        shell: bash
        run: |
          set -euo pipefail
          test ! -e physics_app/physics-opt
          docker run --rm --platform linux/amd64 --entrypoint /bin/bash --user 0:0 \
            --workdir /workspace -v "$PWD:/workspace" "$OCI" -lc '
              set -euo pipefail
              source /environment
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt
              make -C physics_app -j2 app_non_unity_dirs="%/utils"
            ' 2>&1 | tee evidence/build.log
          test -x physics_app/physics-opt
          test -s physics_app/physics-opt
          echo P5_0_ONE_COMPILE_PASS
      - name: Freeze and roundtrip verify actual ELF and all app shared libraries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, re, subprocess, tarfile, io
          root = Path.cwd()
          out = root / "evidence"
          out.mkdir(exist_ok=True)
          binary = root / "physics_app/physics-opt"
          assert binary.is_file() and not binary.is_symlink() and binary.stat().st_size > 0
          assert binary.open("rb").read(4) == b"\x7fELF"
          head = subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          assert head == os.environ["SOURCE_HEAD"]
          tree = subprocess.check_output(["git","rev-parse","HEAD^{tree}"],text=True).strip()
          def sha(path):
              dig = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda:stream.read(8*1024*1024),b""):
                      dig.update(chunk)
              return dig.hexdigest()
          def dynamic(path):
              return subprocess.check_output(["readelf","-d",str(path)],text=True)
          def needed(info):
              return re.findall(r"Shared library: \[([^\]]+)\]",info)
          def soname(info):
              m = re.findall(r"Library soname: \[([^\]]+)\]",info)
              return m[0] if m else None
          exe_dyn = dynamic(binary)
          app_needed = {n for n in needed(exe_dyn) if n.startswith("libphysics")}
          assert app_needed, "Executable has no app library dependencies"
          candidates = []
          for f in (root/"physics_app").rglob("libphysics*.so*"):
              if f.is_file() and f.resolve().is_file():
                  target=f.resolve(strict=True)
                  if target.open("rb").read(4)!=b"\x7fELF":
                      continue
                  info=dynamic(target)
                  name=soname(info)
                  if name:
                      candidates.append((name,f,target,needed(info)))
          assert candidates, "No actual application shared libraries found"
          # Required app SONAMEs transitively follow other app-library NEEDED.
          required=set(app_needed)
          while True:
              more={n for name,p,t,deps in candidates if name in required
                    for n in deps if n.startswith("libphysics")}
              if more <= required: break
              required |= more
          actual={}
          for need in sorted(required):
              found=[(p,t,deps) for name,p,t,deps in candidates if name==need]
              assert found, f"App library dependency missing from build tree: {need}"
              digests={sha(t) for p,t,deps in found}
              assert len(digests)==1,f"Conflicting app libs with SONAME {need}"
              source=next(((p,t,deps) for p,t,deps in found if p.name==need),found[0])
              actual[need]=source
          # Fail if application built other independently named libphysics SONAMEs,
          # so that this bundle covers all compiled application libraries.
          names={name for name,_,_,_ in candidates}
          assert names <= required, f"Unexpected extra app libraries: {sorted(names-required)}"
          files={"physics-opt":binary}
          source_paths={"physics-opt":"physics_app/physics-opt"}
          libraries={}
          for n,(original,target,deps) in sorted(actual.items()):
              files["lib/"+n]=target
              source_paths["lib/"+n]=str(original.relative_to(root))
              libraries[n]={"source_path":str(original.relative_to(root)),
                            "real_target":str(target.relative_to(root)),
                            "sha256":sha(target),
                            "bytes":target.stat().st_size,
                            "app_dependencies":[v for v in deps if v.startswith("libphysics")]}
          total=sum(p.stat().st_size for p in files.values())
          assert len(files)==3 and len(libraries)==2, "Expected exactly one executable and two distinct physics app libs"
          assert total<2_000_000_000, "Unexpectedly large app-only binaries"
          info={"schema":"issue671.p5_0.exact_head_single_build_app_shared_libraries.v1",
                "source_repository":"HyungseonSong-plasma/moose-test-repo",
                "source_pr":665,
                "source_head":head, "source_tree":tree,
                "branch_workflow_sha":os.environ["GITHUB_SHA"],
                "run_id":os.environ["GITHUB_RUN_ID"],
                "oci":os.environ["OCI"],
                "lock_sha256":sha(root/"physics_app/dependencies.lock"),
                "build_command":"make -C physics_app -j2 app_non_unity_dirs='%/utils'",
                "build_count":1,
                "binary":"physics-opt",
                "binary_sha256":sha(binary),
                "binary_size":binary.stat().st_size,
                "binary_elf_needed":needed(exe_dyn),
                "app_libraries":libraries,
                "file_records":[{"stored_path":p,"source_path":source_paths[p],
                                 "bytes":f.stat().st_size,"sha256":sha(f)}
                                for p,f in sorted(files.items())],
                "total_uncompressed_binary_bytes":total,
                "build_log_sha256":sha(out/"build.log"),
                "toolchain_sha256":sha(out/"toolchain.log"),
                "native_check_input":"NOT_RUN",
                "native_P3_P4":"NOT_RUN",
                "science":"SCIENCE_HOLD",
                "vendor_shared_libraries_bundled":False,
                "private_data_bundled":False}
          archive=out/"physics-opt-and-app-libs.tar.gz"
          with tarfile.open(archive,mode="w:gz",compresslevel=7,format=tarfile.PAX_FORMAT) as tar:
              for arc,source in sorted(files.items()):
                  meta=tarfile.TarInfo(arc)
                  meta.size=source.stat().st_size
                  meta.mode=0o755 if arc=="physics-opt" else 0o644
                  meta.mtime=0; meta.uid=0; meta.gid=0; meta.uname="";meta.gname=""
                  with source.open("rb") as stream:
                      tar.addfile(meta,stream)
          with tarfile.open(archive,"r:gz") as tar:
              actual_names=set(tar.getnames())
              assert actual_names==set(files),f"Missing tar members: {set(files)-actual_names}"
              for member in info["file_records"]:
                  data=tar.extractfile(member["stored_path"])
                  assert data is not None
                  digest=hashlib.sha256()
                  total_read=0
                  for block in iter(lambda:data.read(8*1024*1024),b""):
                      digest.update(block);total_read+=len(block)
                  assert total_read==member["bytes"] and digest.hexdigest()==member["sha256"]
          info["archive_sha256"]=sha(archive)
          info["archive_size"]=archive.stat().st_size
          info["archive_member_count"]=len(files)
          info["archive_roundtrip_check"]="PASS"
          (out/"identity.json").write_text(json.dumps(info,ensure_ascii=False,indent=2,sort_keys=True)+"\n")
          (out/"sha256sums.txt").write_text("".join(
              record["sha256"]+"  "+record["stored_path"]+"\n" for record in info["file_records"]))
          print("P5_0_SAME_HEAD_EXE_AND_APP_LIBS_SHA_PASS")
          print(json.dumps({"head":head,"binary_sha":info["binary_sha256"],
              "app_libraries":libraries,"archive_sha":info["archive_sha256"],
              "archive_size":info["archive_size"],
              "files":len(files)},indent=2))
          PY
      - name: Upload app ELF + libraries + manifest, without private inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p6-newonly-w1-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            evidence/physics-opt-and-app-libs.tar.gz
            evidence/identity.json
            evidence/sha256sums.txt
            evidence/toolchain.log
            evidence/build.log
          if-no-files-found: error
          retention-days: 14
          compression-level: 0


  p6_newonly_s6_native_p2:
    name: "P6 REQUIRED New-only 417/941 Native P2 typed 12+12+8 and N1-N8 x2"
    needs: p6_newonly_s6_build
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    permissions:
      contents: read
      pull-requests: read
      actions: read
    env:
      BASE_HEAD: ${{ github.sha }}
      OCI: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
    steps:
      - name: Verify explicit manual approval and current source scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.source_sha }}
          REQUESTED_PR: ${{ inputs.pr_number }}
          APPROVAL: ${{ inputs.validation_approval }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = HyungseonSong-plasma/moose-test-repo
          test "$APPROVAL" = NATIVE_VALIDATION_APPROVED
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$REQUESTED_SHA" = "$GITHUB_SHA"
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            test -z "$REQUESTED_PR"
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$REQUESTED_SHA"
          else
            [[ "$REQUESTED_PR" =~ ^[1-9][0-9]*$ ]]
            gh api "repos/$GITHUB_REPOSITORY/pulls/$REQUESTED_PR" | jq -e \
              --arg repo "$GITHUB_REPOSITORY" --arg sha "$REQUESTED_SHA" --arg ref "${GITHUB_REF#refs/heads/}" \
              '.state == "open" and .base.repo.full_name == $repo and .base.ref == "main" and .head.repo.full_name == $repo and .head.sha == $sha and .head.ref == $ref' >/dev/null
          fi
      - name: Checkout exact PR source and validate P05 source contract
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Fail closed on source, OCI and private data safety before Native
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_HEAD"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$(git hash-object physics_app/src/physics/plasma/DDContinuityEq.C)" = 98ad4267aa530c9b2e06402530c3d4a43807429f
          test "$(git hash-object physics_app/src/physics/plasma/Chemistry.C)" = 951e1056cfdaf2531d6f604862c1224240e0b848
          test "$(git hash-object experiments/Issue402_plasma_dsl_g1/chemistry/retire_s6_p4_duplicate_owners.py)" = a3f9d93ea1095c9d00053e5104bb7326d1af8f31
          test "$(git hash-object ci/guards/issue671_secure_ei_rate_scratch.py)" = cd75238df8083f54b5b08330e46f88276ff8370a
          test ! -e physics_app/physics-opt
          test ! -e experiments/Issue395_powered_chemistry_ladder/private_rates
          echo P6_NEWONLY_SOURCE_AND_PRIVATE_GUARD_PASS
      - name: Checkout immutable historical public S6 mesh and support source
        uses: actions/checkout@v4
        with:
          ref: 29d1acc6ef7969908b86719e4b95c73a1565136d
          path: historical
          fetch-depth: 1
          persist-credentials: false
      - name: Reproduce exact SHA-pinned 400 W public parent plasma mesh
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet \
            'pytest>=8,<9' 'pydantic>=2,<3' numpy==2.1.2 scipy==1.14.1 matplotlib==3.9.2 \
            -r requirements-evidence-engine.txt -r requirements-ontology.txt
          cd historical
          SRC=.github/oxygen25_eedf/initial_mixture_23xsec_transport.txt
          DST=experiments/Issue91_real_qvt_r3/r3_e0/electron_moments.txt
          echo "35534a522fa48ccb5222339c5040040630eef31e623e1c53f1e1c4540d2d653b  $SRC" | sha256sum --check -
          cp "$SRC" "$DST"
          export CHATGPT_WORK_BASE_SHA=29d1acc6ef7969908b86719e4b95c73a1565136d
          export OXYGEN_RESEARCH_400=1
          CHEM=experiments/Issue395_powered_chemistry_ladder
          bash "$CHEM/issue397_l1_power_scan_replay.sh" prepare 400
          python3 .github/scripts/oxygen_legacy6_latest_100us.py --power-w 400 --prepare
          echo "ac70642df75bf7b4bc4ec0d92511e545f0942f9e07a1361618fb9eb5696b83fc  $CHEM/baseline_plasma_plus_unstructured_cover_plus_wafer.msh" | sha256sum --check -
          test ! -e "$CHEM/private_rates"
          echo P05_PUBLIC_MESH_SHA_PASS

      - name: Download exact verified 417 941 P3-X public source and immutable diagnostic staging helper
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p05-in"
          curl --fail --location --silent --show-error --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/14406746397/zip" \
            --output "$RUNNER_TEMP/p05-in/p3x-source.zip"
          echo "592a7c82834bab841f6a2e1807db305d0eff1e953f50a0dcc6d7e21ff8820111  $RUNNER_TEMP/p05-in/p3x-source.zip" | sha256sum --check -
          curl --fail --location --silent --show-error --retry 3 \
            "https://raw.githubusercontent.com/HyungseonSong-plasma/moose-test-repo/41ab61e442a497db2388c025075237bd24cfd025/ci/issue671_p5_d8_native_probe.py" \
            --output "$RUNNER_TEMP/p05-in/pinned_source_stager.py"
          test "$(git hash-object "$RUNNER_TEMP/p05-in/pinned_source_stager.py")" = 8bf49b7807c9f9b3eed8e622e72062f2b5c822bc
          python3 -m py_compile "$RUNNER_TEMP/p05-in/pinned_source_stager.py"
          echo P05_PUBLIC_ARTIFACT_AND_STAGER_PIN_PASS

      - name: Stage real eleven-layer inputs with original mesh and support; exact P4-X owner cutover
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p05-in/staged"
          python3 "$RUNNER_TEMP/p05-in/pinned_source_stager.py" \
            --source "$GITHUB_WORKSPACE" --repo-head "$BASE_HEAD" \
            --artifact "$RUNNER_TEMP/p05-in/p3x-source.zip" \
            --historical-mesh "$GITHUB_WORKSPACE/historical/experiments/Issue395_powered_chemistry_ladder/baseline_plasma_plus_unstructured_cover_plus_wafer.msh" \
            --historical-support-root "$GITHUB_WORKSPACE/historical" \
            --output "$RUNNER_TEMP/p05-in/staged" --stage-only
          # Isolate the actual G5 staging from the pre-G5 P6 regression.
          cp -a "$RUNNER_TEMP/p05-in/staged" "$RUNNER_TEMP/p05-in/g5-staged"
          G5_EXPECTED_SOURCE_HEAD="$BASE_HEAD" python3 ci/guards/issue652_g5_native_p2.py \
            --staged "$RUNNER_TEMP/p05-in/g5-staged" --output "$RUNNER_TEMP/g5-out" --stage-only
          python3 - "$RUNNER_TEMP/p05-in/staged" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/p05-in/p4_receipt.json" <<'PY'
          from pathlib import Path
          import sys,json,hashlib
          stage=Path(sys.argv[1]); root=Path(sys.argv[2]); out=Path(sys.argv[3])
          sys.path.insert(0,str(root/"experiments/Issue402_plasma_dsl_g1/chemistry"))
          from retire_s6_p4_duplicate_owners import retire_p4_duplicate_owners, C0, AFTER_SHA
          stages=json.loads((stage/"readiness.json").read_text())["stage_cases"]
          receipts={}
          for case in ("417","941"):
              folder=stage/"scratch"/case/"experiments"/"Issue395_powered_chemistry_ladder"
              raw_ordered=stages[case]["ordered"]
              ordered=[Path(p).name for p in raw_ordered]
              assert len(ordered)==11 and ordered[0]==C0 and len(set(ordered))==11
              sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
              baseline={n:sha(folder/n) for n in ordered}
              marker=folder/".issue633_disposable_scratch"
              assert not marker.is_symlink()
              if marker.exists():
                  assert marker.read_text().strip()=="issue633-scratch-only"
              else:
                  marker.write_text("issue633-scratch-only\n")
              js=json.loads((folder/"chemistry"/f"unified_s6_{case}_newonly.json").read_text())
              cut=retire_p4_duplicate_owners(folder,ordered,js,post_p3_layer_sha=baseline)
              assert sha(folder/C0)==AFTER_SHA
              assert all(sha(folder/n)==baseline[n] for n in ordered[1:])
              assert cut["retired_source_materials"]==6 and cut["carrier_one_preserved"]
              receipts[case]={"P4X":"P4X_7_OWNER_SOURCE_PASS","post_p4_C0_sha256":sha(folder/C0),
                              "retired_old_ion_FV":26,"retired_old_electron":10,
                              "retired_old_duplicate_materials":6,"carrier_one_preserved":True,
                              "ordered_inputs":raw_ordered,
                              "11_layer_sha256":{n:sha(folder/n) for n in ordered},
                              "JSON_sha256":sha(folder/"chemistry"/f"unified_s6_{case}_newonly.json"),
                              "parent_mesh_sha256":sha(folder/"baseline_plasma_plus_unstructured_cover_plus_wafer.msh")}
          out.write_text(json.dumps(receipts,indent=2,sort_keys=True)+"\n")
          print("P05_REAL_POST_P4X_STAGE_BOTH_CASES_11_LAYER_PASS")
          PY

      - name: Download one exact-head W1 from this CI run (never rebuild)
        uses: actions/download-artifact@v4
        with:
          name: p6-newonly-w1-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/p05-in/w1bundle
      - name: Verify actual ELF and both application libraries against W1 manifest
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$BASE_HEAD"
          test ! -e physics_app/physics-opt
          test -s "$RUNNER_TEMP/p05-in/w1bundle/identity.json"
          test -s "$RUNNER_TEMP/p05-in/w1bundle/physics-opt-and-app-libs.tar.gz"
          mkdir -p "$RUNNER_TEMP/p05-in/w1"
          cp "$RUNNER_TEMP/p05-in/w1bundle/identity.json" "$RUNNER_TEMP/p05-in/w1_identity.json"
          python3 - "$RUNNER_TEMP/p05-in/w1_identity.json" "$RUNNER_TEMP/p05-in/w1bundle/physics-opt-and-app-libs.tar.gz" "$RUNNER_TEMP/p05-in/w1" "$BASE_HEAD" "$OCI" "$GITHUB_RUN_ID" <<'PY'
          import hashlib,json,pathlib,sys,tarfile
          record=json.loads(pathlib.Path(sys.argv[1]).read_text())
          bundle=pathlib.Path(sys.argv[2]); directory=pathlib.Path(sys.argv[3])
          head,oci,run_id=sys.argv[4:]
          assert record["source_head"]==head and record["oci"]==oci and record["run_id"]==run_id
          assert record["build_count"]==1 and record["native_check_input"]=="NOT_RUN"
          assert record["archive_member_count"]==3 and record["archive_roundtrip_check"]=="PASS"
