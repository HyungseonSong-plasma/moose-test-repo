      - name: Compile external read-only MOOSE registration tracer without rebuilding PhysicsApp
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/p05-in/p5x_owner_tracer.cc" <<'P5XCPP'
          #include <string>
          #include <cstdlib>
          #include <cstdio>
          #include <cstring>
          #include <dlfcn.h>
          #include <fcntl.h>
          #include <unistd.h>
          class InputParameters;
          class FEProblemBase {
          public:
            void addFVKernel(const std::string &, const std::string &, InputParameters &);
            void addFVBC(const std::string &, const std::string &, InputParameters &);
            void addBoundaryCondition(const std::string &, const std::string &, InputParameters &);
          };
          using OriginalFn = void (*)(FEProblemBase *, const std::string &, const std::string &, InputParameters &);
          static OriginalFn actual(const char * symbol) {
