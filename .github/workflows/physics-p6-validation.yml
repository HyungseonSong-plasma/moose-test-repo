          "N2":("P05 FV Native/Physics duplicate or unexpected owner",),
          "N3":("P05 legacy, duplicate or unexpected FV BC",),
          "N4":("P05 FV Native/Physics duplicate or unexpected owner",),
          "N5":("P05 legacy, duplicate or unexpected FV BC",),
          "N6":("equation without matching reaction ID: EI-401",),
