          from pathlib import Path
          import hashlib, json, os, re, shutil, shlex, subprocess, sys, tempfile, stat
          
          staged, repo, out, head, oci = map(str, sys.argv[1:6])
          staged, repo, out = Path(staged), Path(repo), Path(out)
