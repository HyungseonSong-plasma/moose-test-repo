              "W1_elf_sha256":w1_manifest["binary_sha256"],
              "libphysics_opt_sha256":w1_manifest["app_libraries"]["libphysics-opt.so.0"]["sha256"],
              "libphysics_test_opt_sha256":w1_manifest["app_libraries"]["libphysics_test-opt.so.0"]["sha256"],
              "build_count":w1_manifest["build_count"],
              "one_shared_binary_across_clean_and_16_negatives":True}
