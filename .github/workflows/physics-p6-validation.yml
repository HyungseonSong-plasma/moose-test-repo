          #include <string>
          #include <cstdlib>
          #include <cstdio>
          #include <cstring>
          #include <dlfcn.h>
          #include <fcntl.h>
          #include <unistd.h>
          class InputParameters;
          class FEProblemBase {
          public:
            void addFVKernel(const std::string &, const std::string &, InputParameters &);
            void addFVBC(const std::string &, const std::string &, InputParameters &);
            void addBoundaryCondition(const std::string &, const std::string &, InputParameters &);
          };
          using OriginalFn = void (*)(FEProblemBase *, const std::string &, const std::string &, InputParameters &);
          static OriginalFn actual(const char * symbol) {
            void * p = dlsym(RTLD_NEXT, symbol);
            if (!p) {
              const char * error = dlerror();
              std::fprintf(stderr, "P5X_INTERPOSER_UNRESOLVED symbol=%s error=%s\n", symbol, error ? error : "none");
              std::_Exit(83);
            }
            return reinterpret_cast<OriginalFn>(p);
          }
          static void record(const char * family, const std::string & name, const std::string & type) {
            const char * file = std::getenv("P5X_REGISTER_LOG");
            if (!file || !*file) std::_Exit(84);
            if (name.find('\t') != std::string::npos || name.find('\n') != std::string::npos ||
                type.find('\t') != std::string::npos || type.find('\n') != std::string::npos) std::_Exit(85);
            const int fd = open(file, O_WRONLY | O_CREAT | O_APPEND | O_CLOEXEC | O_NOFOLLOW, 0600);
            if (fd < 0) std::_Exit(86);
            const std::string line = std::string("P5X_REGISTER\t") + family + "\t" + name + "\t" + type + "\n";
            if (write(fd, line.data(), line.size()) != static_cast<ssize_t>(line.size())) std::_Exit(87);
            close(fd);
          }
          void FEProblemBase::addFVKernel(const std::string & type, const std::string & name, InputParameters & params) {
            static OriginalFn fn = actual("_ZN13FEProblemBase11addFVKernelERKNSt7__cxx1112basic_stringIcSt11char_traitsIcESaIcEEES7_R15InputParameters");
            fn(this, type, name, params);
            record("FVKernel", name, type);
          }
          void FEProblemBase::addFVBC(const std::string & type, const std::string & name, InputParameters & params) {
            static OriginalFn fn = actual("_ZN13FEProblemBase7addFVBCERKNSt7__cxx1112basic_stringIcSt11char_traitsIcESaIcEEES7_R15InputParameters");
            fn(this, type, name, params);
            record("FVBC", name, type);
          }
          void FEProblemBase::addBoundaryCondition(const std::string & type, const std::string & name, InputParameters & params) {
            static OriginalFn fn = actual("_ZN13FEProblemBase20addBoundaryConditionERKNSt7__cxx1112basic_stringIcSt11char_traitsIcESaIcEEES7_R15InputParameters");
            fn(this, type, name, params);
            record("FEBoundaryCondition", name, type);
          }
          // Linker/load diagnostic, independent of registration interception.
          __attribute__((constructor)) static void p5x_preload_ready() {
            const char *p = std::getenv("P5X_REGISTER_LOG");
            if (!p || !*p) return;
            const int fd = open(p, O_WRONLY | O_CREAT | O_APPEND | O_CLOEXEC | O_NOFOLLOW, 0600);
            if (fd < 0) return;
            constexpr char marker[] = "P5X_PRELOAD_READY\n";
            (void)write(fd, marker, sizeof(marker) - 1);
            close(fd);
          }
          P5XCPP
          # Compile against the pinned runtime OCI glibc/libstdc++; ubuntu-24.04 host-built .so is ABI-incompatible.
          # This builds the independent observer ONLY. W1 physics-opt and both app libraries are byte-preserved.
          docker run --rm --network none --entrypoint /bin/bash --user 0:0 \
            --mount "type=bind,src=$RUNNER_TEMP/p05-in,dst=/probe" \
            "$OCI" -lc 'set -euo pipefail; source /environment; g++ -std=c++17 -O2 -fPIC -shared -o /probe/libp5x_owner_tracer.so /probe/p5x_owner_tracer.cc -ldl'
          test -s "$RUNNER_TEMP/p05-in/libp5x_owner_tracer.so"
          nm -D "$RUNNER_TEMP/p05-in/libp5x_owner_tracer.so" | grep -Fq '_ZN13FEProblemBase11addFVKernel'
          nm -D "$RUNNER_TEMP/p05-in/libp5x_owner_tracer.so" | grep -Fq '_ZN13FEProblemBase7addFVBC'
          nm -D "$RUNNER_TEMP/p05-in/libp5x_owner_tracer.so" | grep -Fq '_ZN13FEProblemBase20addBoundaryCondition'
          sha256sum "$RUNNER_TEMP/p05-in/libp5x_owner_tracer.so" > "$RUNNER_TEMP/p05-in/tracer.sha256"
          # The protected /dev/shm mount is noexec; load observer from read-only /workspace.
