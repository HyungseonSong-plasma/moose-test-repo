          import json, sys
          from pathlib import Path
          result = json.loads(Path(sys.argv[1]).read_text())
          assert result["source_sha"] == sys.argv[2]
          assert result["lookup_rows"] == 42
          assert result["Native_P2"] == "PASS_SYNTAX_ONLY"
          assert set(result["cases"]) == {"417", "941"}
          assert all(row["passed"] for row in result["cases"].values())
          assert result["private_cleanup_verified"] is True
          assert result["science"] == "SCIENCE_HOLD"
          print("G5_BOTH_CASES_NATIVE_P2_42ROW_PASS")
          PY
      - name: Upload sanitized N1-N8 receipt and exact binary hash only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p6-newonly-native-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/p05-out/p05_negative_receipt.json
            ${{ runner.temp }}/p05-in/p4_receipt.json
            ${{ runner.temp }}/p05-in/physics-opt.sha256
            ${{ runner.temp }}/p05-in/w1_identity.json
            ${{ runner.temp }}/p05-in/tracer.sha256
            ${{ runner.temp }}/g5-out/*.json
          if-no-files-found: error
          retention-days: 14

