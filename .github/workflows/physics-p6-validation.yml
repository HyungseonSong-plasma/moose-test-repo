                        "observer_abi_caveat":"External interposition logs successful addObject call, not direct warehouse traversal"}
                  receipt["cases"][case]={"source_layer_sha256":expected_case["11_layer_sha256"],
                         "JSON_sha256":expected_case["JSON_sha256"],
                         "parent_mesh_sha256":expected_case["parent_mesh_sha256"],
                         "clean_exit":rc,"clean_syntax_ok":valid,
                         "clean_log_sha256":hashlib.sha256(log.encode()).hexdigest(),"tests":{}}
                  clean[case]=clean_sha
                  if not valid:raise RuntimeError("CLEAN_CASE_NATIVE_CHECK_INPUT_HOLD_"+case)
              for case in ("417","941"):
                  public=staged/"scratch"/case
                  exp=p4[case]
                  for test in expected:
                      work=private/(case+"-"+test)
                      shutil.copytree(public,work,symlinks=False)
                      modified=mutate(work,case,test)
                      baseline=clean[case]
                      changed=modified.relative_to(work).as_posix()
                      delta=[p for p,s in file_shas(work).items() if baseline.get(p)!=s]
                      if delta != [changed]: raise RuntimeError("NON_SINGLE_FILE_MUTATION_"+case+"_"+test)
                      before=baseline[changed];after=sha(modified)
                      if before==after:raise RuntimeError("MUTATION_NOOP")
                      stage_rates(work,case,rates)
                      rc,log=native(work,exp["ordered_inputs"],receipt["binary_sha256"])
                      matched=rc!=0 and any(p in log for p in expected[test])
                      category=("P05" if "P05 " in log and matched else
                                "CHEMISTRY" if matched else "UNRELATED_OR_ACCEPTED")
                      if test=="N5" and not matched and rc!=0 and "O2p_cover_dielectric" in log and (
                          "duplicate" in log.lower() or "already" in log.lower() or "exists" in log.lower()):
                          matched=True;category="EARLY_REGISTRATION"
                      receipt["cases"][case]["tests"][test]={
                         "changed_file":changed,"before_sha256":before,"after_sha256":after,
                         "unchanged_file_count":len(baseline)-1,"exit_code":rc,
                         "expected_error_substrings":list(expected[test]),
                         "matched_expected":matched,"first_failure_class":category,
                         "log_sha256":hashlib.sha256(log.encode()).hexdigest(),
                         "syntax_ok":"Syntax OK" in log}
                      receipt["native_tests_completed"]+=1
                      if matched:receipt["native_expected_rejections"]+=1
                  if file_shas(public)!=clean[case]:
                      raise RuntimeError("PUBLIC_STAGE_CHANGED_AFTER_NEGATIVES")
                  receipt["cases"][case]["source_restoration"]="SHA_ALL_PUBLIC_FILES_UNCHANGED"
              receipt["status"]=("PASS_16_INTENDED_NATIVE_REJECTIONS" if receipt["native_expected_rejections"]==16
                                else "HOLD_WRONG_NATIVE_FAILURES")
          except Exception as e:
              receipt["status"]="HOLD_NATIVE_OR_HARNESS"
              receipt["harness_error_type"]=type(e).__name__
              if str(e).startswith(("CLEAN_CASE_","NON_SINGLE_FILE_","PUBLIC_STAGE_","MUTATION_","P5X_","OWNER_")):
                  receipt["harness_error_code"]=str(e)[:330]
          finally:
              os.environ.pop("PROTECTED_ARCHIVE_B64",None)
              if private is not None and private.exists():
                  changed_owner=subprocess.run(["sudo","chown","-R",f"{os.getuid()}:{os.getgid()}",str(private)],
                                                capture_output=True,check=False)
                  if changed_owner.returncode==0:
                      shutil.rmtree(private)
                  else:
                      receipt["cleanup_error"]="PROTECTED_CHOWN_REPAIR_FAILED"
              receipt["tmpfs_cleanup_verified"]=private is not None and not private.exists()
              if not receipt["tmpfs_cleanup_verified"]:
                  receipt["status"]="HOLD_PRIVATE_SCRATCH_NOT_CLEANED"
              (out/"p05_negative_receipt.json").write_text(json.dumps(receipt,sort_keys=True,indent=2)+"\n")
              print("P05_NEGATIVES",receipt["status"],"COUNT",receipt["native_expected_rejections"],"/16",
                    "SOURCE_HEAD",receipt["source_head"],"BINARY_SHA",receipt["binary_sha256"],
                    "PRIVATE_CLEANUP",receipt["tmpfs_cleanup_verified"])
          sys.exit(0 if receipt["status"]=="PASS_16_INTENDED_NATIVE_REJECTIONS" else 1)
          PY

      - name: Require G5 Poisson 417/941 exact-stage Native P2 (42-row lookup)
        shell: bash
        env:
          G5_EXPECTED_SOURCE_HEAD: ${{ github.sha }}
          PROTECTED_ARCHIVE_B64: ${{ secrets.OXYGEN24_RATES_TAR_XZ_B64 }}
