          sys.path.insert(0, str(repo / "ci" / "guards"))
          from issue671_secure_ei_rate_scratch import read_hashed_rows, EXPECTED, REQUIRED, validate_rows
          
          def sha(p):
              h=hashlib.sha256()
              with p.open("rb") as f:
                  for b in iter(lambda:f.read(1048576),b""): h.update(b)
              return h.hexdigest()
          
          def file_shas(root):
              d={}
              for path in sorted(root.rglob("*")):
                  if path.is_symlink(): raise RuntimeError("UNSAFE_SYMLINK_IN_STAGE")
                  if path.is_file():
                      if not stat.S_ISREG(path.lstat().st_mode): raise RuntimeError("NONREGULAR_SOURCE")
                      d[path.relative_to(root).as_posix()]=sha(path)
              return d
          
          def insert(deck, section, name, params):
              lines=deck.splitlines(keepends=True)
              starts=[i for i,v in enumerate(lines) if v.strip()=="["+section+"]" and v==v.lstrip()]
              if len(starts)!=1: raise RuntimeError("EXACT_ROOT_SECTION_REQUIRED")
              close=next((i for i in range(starts[0]+1,len(lines)) if re.fullmatch(r"\[\]\s*",lines[i])),None)
              if close is None: raise RuntimeError("UNBALANCED_ROOT_SECTION")
              if re.search(r"(?m)^\s*\["+re.escape(name)+r"\]\s*$",deck):
                  raise RuntimeError("MUTANT_ALREADY_PRESENT")
              s="  ["+name+"]\n"+"".join("    "+k+" = "+v+"\n" for k,v in params.items())+"  []\n"
              lines.insert(close,s)
              return "".join(lines)
          
          def mutate(folder,case,test):
              c0=folder/"experiments"/"Issue395_powered_chemistry_ladder"/"rf_elastic_diss_ion_ei20_ei01_400w_adjacent_sheath_wall_closed_100us_dt1000ns__C0_chemistry_off.i"
              js=folder/"experiments"/"Issue395_powered_chemistry_ladder"/"chemistry"/("unified_s6_"+case+"_newonly.json")
