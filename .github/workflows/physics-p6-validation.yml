                      if matched:receipt["native_expected_rejections"]+=1
                  if file_shas(public)!=clean[case]:
                      raise RuntimeError("PUBLIC_STAGE_CHANGED_AFTER_NEGATIVES")
                  receipt["cases"][case]["source_restoration"]="SHA_ALL_PUBLIC_FILES_UNCHANGED"
                  assert sha(public/"experiments/Issue91_real_qvt_r3/r3_e0/electron_moments.txt")==receipt["one_build_bundle"]["public_d_original100_sha256"]
              receipt["status"]=("PASS_16_INTENDED_NATIVE_REJECTIONS" if receipt["native_expected_rejections"]==16
                                else "HOLD_WRONG_NATIVE_FAILURES")
          except Exception as e:
              receipt["status"]="HOLD_NATIVE_OR_HARNESS"
              receipt["harness_error_type"]=type(e).__name__
              if str(e).startswith(("CLEAN_CASE_","NON_SINGLE_FILE_","PUBLIC_STAGE_","MUTATION_","P5X_","OWNER_")):
                  receipt["harness_error_code"]=str(e)[:330]
          finally:
              os.environ.pop("PROTECTED_ARCHIVE_B64",None)
              if private is not None and private.exists():
                  changed_owner=subprocess.run(["sudo","chown","-R",f"{os.getuid()}:{os.getgid()}",str(private)],
                                                capture_output=True,check=False)
                  if changed_owner.returncode==0:
                      shutil.rmtree(private)
                  else:
                      receipt["cleanup_error"]="PROTECTED_CHOWN_REPAIR_FAILED"
              receipt["tmpfs_cleanup_verified"]=private is not None and not private.exists()
              if not receipt["tmpfs_cleanup_verified"]:
                  receipt["status"]="HOLD_PRIVATE_SCRATCH_NOT_CLEANED"
              (out/"p05_negative_receipt.json").write_text(json.dumps(receipt,sort_keys=True,indent=2)+"\n")
              print("P05_NEGATIVES",receipt["status"],"COUNT",receipt["native_expected_rejections"],"/16",
                    "SOURCE_HEAD",receipt["source_head"],"BINARY_SHA",receipt["binary_sha256"],
                    "PRIVATE_CLEANUP",receipt["tmpfs_cleanup_verified"])
          sys.exit(0 if receipt["status"]=="PASS_16_INTENDED_NATIVE_REJECTIONS" else 1)
          PY
      - name: Require G5 Poisson 417/941 exact-stage Native P2 (100-row lookup)
        shell: bash
        env:
          G5_EXPECTED_SOURCE_HEAD: ${{ github.sha }}
          PROTECTED_ARCHIVE_B64: ${{ secrets.OXYGEN24_RATES_TAR_XZ_B64 }}
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$BASE_HEAD"
          sha256sum -c "$RUNNER_TEMP/p05-in/physics-opt.sha256"
          python3 ci/guards/issue652_g5_native_p2.py \
            --staged "$RUNNER_TEMP/p05-in/g5-staged" --output "$RUNNER_TEMP/g5-out" \
            --native-only --lookup-rows 100
          sha256sum -c "$RUNNER_TEMP/p05-in/physics-opt.sha256"
          python3 - "$RUNNER_TEMP/g5-out/g5_native_receipt.json" "$BASE_HEAD" <<'PY'
          import json, sys
          from pathlib import Path
          result = json.loads(Path(sys.argv[1]).read_text())
          assert result["source_sha"] == sys.argv[2]
          assert result["lookup_rows"] == 100
          assert result["Native_P2"] == "PASS_SYNTAX_ONLY"
          assert set(result["cases"]) == {"417", "941"}
          assert all(row["passed"] for row in result["cases"].values())
          assert result["private_cleanup_verified"] is True
          assert result["science"] == "SCIENCE_HOLD"
          print("G5_BOTH_CASES_NATIVE_P2_100ROW_PASS")
          PY
      - name: Upload exact HEAD Public D 100row typed and N1-N8 sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p6-public-d-original100-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/p05-out/p05_negative_receipt.json
            ${{ runner.temp }}/p05-out/public-d-417.json
            ${{ runner.temp }}/p05-out/public-d-941.json
            ${{ runner.temp }}/p05-in/p4_receipt.json
            ${{ runner.temp }}/p05-in/physics-opt.sha256
            ${{ runner.temp }}/p05-in/w1_identity.json
            ${{ runner.temp }}/p05-in/tracer.sha256
            ${{ runner.temp }}/g5-out/*.json
          if-no-files-found: error
          retention-days: 14
