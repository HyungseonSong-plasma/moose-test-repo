name: QPX CI validation

# Canonical architecture and regression acceptance gate.
on:
  push:
    branches:
      - main
      - development
      - issue-126-qpx-harness-refactor
      - issue-128-retire-issue-namespaces
      - issue-129-root-surface-cleanup
      - review/development-semantic-architecture
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # BATCH6_APPLY_START
      - name: Apply one-shot Batch 6 migration
        run: |
          python tools/qpx_batch6_apply.py
          git checkout HEAD -- .github/workflows/qpx-cleanup-validation.yml tools/qpx_batch6_apply.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "refactor: consolidate model terminology and MOOSE boundary"
            git push origin HEAD:development
          fi
      # BATCH6_APPLY_END
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependencies
        run: >-
          python -m pip install
          'pydantic>=2,<3'
          'pytest>=8,<9'
          -r requirements-evidence-engine.txt
          -r requirements-ontology.txt
      - name: Validate Evidence dependency direction
        run: python tools/qpx_dependency_guard.py --check evidence
      - name: Validate Analysis dependency direction
        run: python tools/qpx_dependency_guard.py --check analysis
      - name: Validate Execution dependency direction
        run: python tools/qpx_dependency_guard.py --check execution
      - name: Validate presentation dependency direction
        run: python tools/qpx_dependency_guard.py --check presentation
      - name: Validate canonical package cycles
        run: python tools/qpx_dependency_guard.py --check cycle
      - name: Validate declarative experiment gateway
        run: python tools/qpx_experiment_gateway_guard.py
      - name: Validate plasma semantic ownership
        run: python tools/qpx_plasma_semantic_residue_guard.py
      - name: Validate campaign/performance/scale ownership
        run: python tools/qpx_campaign_residue_guard.py
      - name: Validate model terminology and MOOSE boundary ownership
        run: python tools/qpx_boundary_terminology_guard.py
      - name: Validate strict zero-legacy architecture census
        run: |
          python tools/qpx_architecture_census.py --require-no-legacy
          python tools/qpx_architecture_census.py --json-out qpx-architecture-census.json --require-no-legacy
      - name: Upload architecture census
        uses: actions/upload-artifact@v4
        with:
          name: qpx-architecture-census
          path: qpx-architecture-census.json
      - name: Run QPX-free pytest
        run: python -m pytest -q
      - name: Run canonical QPX internal validation
        run: python qpx -i all
      - name: Validate Issue 43/45 science refactor
        run: python experiments/Issue43_45_science_refactor/final_guard.py
      - name: Validate Issue 89 post-science canonicalization
        run: python experiments/Issue89_post_science_canonicalization/final_guard.py
      - name: Validate execution contract refactor
        run: python experiments/execution_contract_refactor/guard.py
