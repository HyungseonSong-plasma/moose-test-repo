name: Issue672 Public D mandatory CI source-only premerge checker
on:
  push:
    branches:
      - issue-672-p6-public-d-100row-required-ci-20261118
    paths:
      - .github/workflows/ci.yml
      - ci/workflow_templates/general-ci.yml
      - ci/guards/p6_ci_workflow_safety_guard.py
      - tests/test_issue672_p6_ci_workflow_safety.py
      - .github/workflows/issue672-public-d-required-ci-source-only-once.yml
permissions:
  contents: read
jobs:
  premerge-p0:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate exact candidate SHA and no global Native
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 ci/guards/p6_ci_workflow_safety_guard.py --self-test --check
      - name: Test required Public D and CI mutation controls
        run: |
          set -euo pipefail
          python3 -m pip install -q 'pytest>=8,<9'
          python3 -m pytest -q tests/test_issue672_p6_ci_workflow_safety.py tests/test_issue672_p6_d4_public_d_100row_newphysics.py
      - name: Validate workflow parity and route manifest
        run: |
          set -euo pipefail
          python3 ci/workflow_harness.py --check
          python3 ci/guards/workflow_surface_guard.py --check
