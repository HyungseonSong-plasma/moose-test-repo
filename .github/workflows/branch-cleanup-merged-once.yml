name: One-shot merged branch cleanup
on:
  push:
    branches: [main]
    paths: [.github/workflows/branch-cleanup-merged-once.yml]
permissions:
  contents: write
jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete exact-SHA merged branches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/prune.py <<'PY'
          import json, os, urllib.request, urllib.error
          repo=os.environ["GITHUB_REPOSITORY"]; token=os.environ["GITHUB_TOKEN"]
          targets={"issue-23-telemetry-e2e":"d53233dd13fd8951973ac051723be7342d77873f","issue-26-central-actions-observation-pin":"cb1f93f9b5579879f85f80c6877b62fa1cc3e250","issue-279-stable-sol-runtime-consumer":"b695b482ba07e811b8119b3322a04da0e237b975","issue-297-central-os-binding":"0801f8014e61b562a10f471d441bea2a252cc332","issue-299-adopt-os-generation-model":"8bd3d53f1020bab14c5284f2c17d2e09b3792154","issue-301-paul-cutover":"04ac38193e9bb9aedc6e7cf32844ad9f25ff43a8"}
          headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          for branch, expected in targets.items():
              ref="heads/"+branch
              u=f"https://api.github.com/repos/{repo}/git/ref/{ref}"
              req=urllib.request.Request(u,headers=headers)
              with urllib.request.urlopen(req) as r: live=json.load(r)["object"]["sha"]
              if live != expected: raise SystemExit(f"SHA mismatch {branch}: {live} != {expected}")
          for branch in targets:
              u=f"https://api.github.com/repos/{repo}/git/refs/heads/{branch}"
              req=urllib.request.Request(u,headers=headers,method="DELETE")
              try:
                  with urllib.request.urlopen(req) as r: pass
                  print("deleted",branch)
              except urllib.error.HTTPError as e:
                  print(e.read().decode()); raise
          
          PY
          python /tmp/prune.py
