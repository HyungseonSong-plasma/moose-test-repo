name: Issue 3 full dielectric grounded-electrode 100 ns

on:
  push:
    branches:
      - issue3-d0-dielectric-surface-charge
    paths:
      - '.github/workflows/issue3-full-dielectric-100ns.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-dielectric-100ns:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008

    steps:
      - uses: actions/checkout@v4

      - name: Pull build image
        run: docker pull "$BUILD_BASE_REF"

      - name: Build and run 100 ns full dielectric pilot
        shell: bash
        run: |
          set -euo pipefail
          OUT=experiments/Issue3_dielectric_surface_charge/output_full_dielectric_100ns
          mkdir -p "$OUT"

          docker run --rm --entrypoint /bin/bash --user 0:0 \
            --workdir /workspace -v "$GITHUB_WORKSPACE:/workspace" \
            "$BUILD_BASE_REF" -lc '
              set -euo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory /opt/physics_vendor/moose
              git config --global --add safe.directory /opt/physics_vendor/crane
              git config --global --add safe.directory /opt/physics_vendor/squirrel
              git config --global --add safe.directory /opt/physics_vendor/zapdos
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt

              CASEDIR=experiments/Issue3_dielectric_surface_charge
              CASE=$CASEDIR/full_dielectric_100ns.i
              OUT=$CASEDIR/output_full_dielectric_100ns

              python3 "$CASEDIR/prepare_baseline_cover_pilot.py" "$CASE" > "$OUT/materialize.log" 2>&1
              python3 "$CASEDIR/finalize_baseline_cover_pilot.py" "$CASE" > "$OUT/finalize.log" 2>&1
              python3 "$CASEDIR/expand_full_dielectric_pilot.py" "$CASE" > "$OUT/expand.log" 2>&1
              python3 "$CASEDIR/finalize_full_dielectric_pilot.py" "$CASE" > "$OUT/finalize_full.log" 2>&1

              python3 -c "from physics_harness.adapters.moose.preflight import parser_symbol_self_test; raise SystemExit(parser_symbol_self_test())" > "$OUT/preflight_selftest.log" 2>&1
              python3 -c "from pathlib import Path; from physics_harness.adapters.moose.preflight import validate_input_preflight; validate_input_preflight(Path(\"$CASE\"))" > "$OUT/preflight_input.log" 2>&1

              make -C physics_app -j2
              physics_app/physics-opt -i "$CASE" --check-input > "$OUT/check.log" 2>&1

              set +e
              physics_app/physics-opt -i "$CASE" > "$OUT/run.log" 2>&1
              solve_rc=$?
              set -e

              cp "$CASE" "$OUT/"
              cp experiments/Issue19_sccm_pressure_boundary/qvt.msh "$OUT/qvt.msh"
              test -f ${CASE%.i}_out.csv && cp ${CASE%.i}_out.csv "$OUT/" || true
              test -f ${CASE%.i}_out.e && cp ${CASE%.i}_out.e "$OUT/" || true

              if [ "$solve_rc" -ne 0 ]; then
                exit "$solve_rc"
              fi
            '

          CSV="$OUT/full_dielectric_100ns_out.csv"
          EXODUS="$OUT/full_dielectric_100ns_out.e"
          converged_count=$(grep -c "Solve Converged!" "$OUT/run.log" || true)
          test "$converged_count" -ge 100
          test -f "$CSV"
          test -f "$EXODUS"
          python3 -c 'import csv,math,sys; rows=list(csv.DictReader(open(sys.argv[1], newline=""))); assert len(rows) >= 101, len(rows); final=float(rows[-1]["time"]); assert math.isclose(final, 1.0e-7, rel_tol=0.0, abs_tol=1.0e-15), final' "$CSV"
          printf '{"classification":"FULL_DIELECTRIC_GROUNDED_ELECTRODE_100NS_SOLVE_PASS","expected_steps":100,"converged_solves":%s,"exodus_preserved":true}\n' "$converged_count" | tee "$OUT/acceptance.json"

      - name: Upload full dielectric 100 ns evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue3-full-dielectric-100ns-evidence
          path: experiments/Issue3_dielectric_surface_charge/output_full_dielectric_100ns/**
          if-no-files-found: warn
          retention-days: 30
