name: Issue402 PR524 synced Wall naming P0 P1 P2 one-shot
on:
  push:
    branches:
      - issue-402-species-functor-naming
    paths:
      - .github/workflows/issue402-pr524-parent-sync-p012-once.yml

permissions:
  contents: read

jobs:
  synced-wall-p012:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PINNED_BASE: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 8
      - name: Verify source ancestry and no P3
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor ed608a23f79fe25e31041b184fa27edb21ba7385 HEAD
          test ! -e physics_app/src/functormaterials/PhysicsIonWallTotalFluxMaterial.C
          echo "SOURCE_SHA=$GITHUB_SHA"
          echo 'SCIENCE_HOLD P3=NOT_RUN'
      - name: P0 legacy-owner retirement and public S6 cutover
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'pytest>=8,<9'
          python3 -m py_compile experiments/Issue402_plasma_dsl_g1/chemistry/prepare_s6_run_input.py
          python3 -m pytest -q \
            tests/test_retired_legacy_physics_owners_contract.py \
            tests/test_issue402_species_functor_naming.py \
            tests/test_issue402_s6_wall_naming_staging.py \
            tests/test_issue402_s6_chemistry_run_templates.py \
            tests/test_issue402_full_s6_p2_only.py
          echo 'ISSUE402_PR524_SYNC_P0_PASS'
      - name: P1 compile active PhysicsApp no retired ion total flux class
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$PINNED_BASE"
          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace \
            -v "$PWD:/workspace" "$PINNED_BASE" -lc '
            set -euo pipefail
            source /environment
            git config --global --add safe.directory /workspace
            export MOOSE_DIR=/opt/physics_vendor/moose
            export CRANE_DIR=/opt/physics_vendor/crane
            export SQUIRREL_DIR=/opt/physics_vendor/squirrel
            export ZAPDOS_DIR=/opt/physics_vendor/zapdos
            export METHOD=opt
            make -C physics_app -j2 app_non_unity_dirs="%/utils"
            test -x physics_app/physics-opt
          '
          echo 'ISSUE402_PR524_SYNC_P1_PASS'
      - name: P2 check three ions O2p Om Op and electron Wall bindings only
        shell: bash
        run: |
          set -euo pipefail
          test -x physics_app/physics-opt
          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace \
            -v "$PWD:/workspace" "$PINNED_BASE" -lc '
            set -euo pipefail
            source /environment
            export MOOSE_DIR=/opt/physics_vendor/moose
            export CRANE_DIR=/opt/physics_vendor/crane
            export SQUIRREL_DIR=/opt/physics_vendor/squirrel
            export ZAPDOS_DIR=/opt/physics_vendor/zapdos
            physics_app/physics-opt --check-input -i physics_app/ci/species_wall_functor_naming_smoke.i
          '
          echo 'ISSUE402_PR524_SYNC_P2_PASS'
          echo 'P3=NOT_RUN SCIENCE=SCIENCE_HOLD'
