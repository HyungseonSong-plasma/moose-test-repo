name: QPX Issue 144 final runtime-path fix

on:
  push:
    branches:
      - development
    paths:
      - .github/workflows/qpx-issue144-final-runtime-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - name: Repair final canonical paths
        run: |
          python - <<'PY'
          from pathlib import Path

          runner = Path('qpx_harness/execution/performance/runner.py')
          text = runner.read_text(encoding='utf-8')
          old = 'from ..analysis.stats_builder import build_convergence_stats, build_simulation_stats'
          new = 'from qpx_harness.analysis.stats_builder import build_convergence_stats, build_simulation_stats'
          assert text.count(old) == 1, text.count(old)
          runner.write_text(text.replace(old, new), encoding='utf-8')

          test = Path('tests/architecture/test_issue90_selftest_retirement.py')
          text = test.read_text(encoding='utf-8')
          old = '"qpx_harness/inventory/cli.py",'
          new = '"qpx_harness/cli/commands/inventory.py",'
          assert text.count(old) == 1, text.count(old)
          test.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Remove helper and commit repair
        run: |
          rm .github/workflows/qpx-issue144-final-runtime-fix.yml
          git config user.name "HyungseonSong-plasma"
          git config user.email "hssongplasma@gmail.com"
          git add -A
          git commit -m "fix: complete Issue 144 canonical path migration"
          git push origin HEAD:development
