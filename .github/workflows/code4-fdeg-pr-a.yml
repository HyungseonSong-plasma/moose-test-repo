name: Code4 FDEG PR-A pinned evidence

on:
  push:
    branches:
      - code4-retirement-pr-a-evidence-20261119
    paths:
      - ci/guards/code4_retirement_baseline.py
      - .github/workflows/code4-fdeg-pr-a.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code4-pr-a:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout immutable event source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate exact HEAD and clean tracked source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          python3 --version

      - name: Generate Structural v0.3 evidence (unresolved is HOLD, not false PASS)
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p code4-pr-a-evidence
          rc=0
          python3 ci/guards/fdeg_structural.py \
            --target PhysicsFVElectrostaticDrift \
            --expected-head "$GITHUB_SHA" \
            --output code4-pr-a-evidence/structural.json || rc=$?
          echo "CODE4_STRUCTURAL_EXIT=$rc"
          test -s code4-pr-a-evidence/structural.json || exit 1
          if [ "$rc" != 0 ] && [ "$rc" != 2 ]; then exit "$rc"; fi
          if [ "$rc" = 2 ]; then
            echo "CODE4_STRUCTURAL_STATUS=INCOMPLETE_HOLD"
          fi

      - name: Generate Functional v0.2 evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/guards/fdeg_functional.py \
            --target PhysicsFVElectrostaticDrift \
            --structural code4-pr-a-evidence/structural.json \
            --expected-head "$GITHUB_SHA" \
            --output code4-pr-a-evidence/functional.json

      - name: Generate Transition v0.1 gated change DAG
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/guards/fdeg_transition.py \
            --target PhysicsFVElectrostaticDrift \
            --structural code4-pr-a-evidence/structural.json \
            --functional code4-pr-a-evidence/functional.json \
            --expected-head "$GITHUB_SHA" \
            --output code4-pr-a-evidence/transition.json

      - name: Validate P0 evidence contracts and negative controls
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_fdeg_structural.py -v
          python3 -m unittest discover -s tests -p test_fdeg_functional.py -v
          python3 -m unittest discover -s tests -p test_fdeg_transition.py -v

      - name: Produce machine-readable code4 consumer and blocker inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/guards/code4_retirement_baseline.py \
            --structural code4-pr-a-evidence/structural.json \
            --functional code4-pr-a-evidence/functional.json \
            --transition code4-pr-a-evidence/transition.json \
            --expected-head "$GITHUB_SHA" \
            --output code4-pr-a-evidence/summary.json
          test -s code4-pr-a-evidence/summary.json

      - name: Upload pinned evidence (including partial evidence on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code4-pr-a-fdeg-${{ github.sha }}
          path: code4-pr-a-evidence/
          if-no-files-found: warn
          retention-days: 30
