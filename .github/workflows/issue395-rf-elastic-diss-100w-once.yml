name: Issue 395 RF plus elastic plus dissociation MultiApp PID 100 W

on:
  push:
    branches:
      - issue395-rf-elastic-diss-100w
    paths:
      - '.github/workflows/issue395-rf-elastic-diss-100w-once.yml'
      - 'experiments/Issue395_powered_chemistry_ladder/build_rf_multiapp_coupling_100w.py'
      - 'experiments/Issue395_powered_chemistry_ladder/analyze_rf_elastic_diss_multiapp_100w.py'
      - 'experiments/Issue395_powered_chemistry_ladder/build_o2_dissociation_overlay.py'

permissions:
  contents: read

jobs:
  rf-elastic-diss-multiapp-100w:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
      CHEM: experiments/Issue395_powered_chemistry_ladder
      DIEL: experiments/Issue3_dielectric_surface_charge
      BASE: experiments/fem_fvm_plasma_discriminator
      TABLE: experiments/Issue91_real_qvt_r3/r3_e0/electron_moments.txt
      RESULT: experiments/Issue395_powered_chemistry_ladder/results_rf_elastic_diss_multiapp_100w

    steps:
      - name: Checkout exact pushed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify exact source revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install host preparation dependencies
        shell: bash
        run: python3 -m pip install --disable-pip-version-check --quiet numpy==2.1.2 scipy==1.14.1

      - name: Build fresh 100 W plasma plus Maxwell MultiApp inputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RESULT"
          mkdir -p "$RESULT/prep" "$RESULT/run"

          python3 "$BASE/generate_contour_mesh.py" > "$RESULT/prep/mesh_plasma.log" 2>&1
          python3 "$DIEL/extend_cover_mesh.py" \
            "$BASE/plasma_contour_l3_4p5mm.msh" "$DIEL/baseline_cover_fine_source.msh" \
            > "$RESULT/prep/mesh_cover.log" 2>&1
          python3 "$DIEL/build_unstructured_cover_wafer_mesh.py" \
            "$DIEL/baseline_cover_fine_source.msh" "$DIEL/baseline_plasma_plus_unstructured_cover_plus_wafer.msh" \
            > "$RESULT/prep/mesh_cover_wafer.log" 2>&1
          python3 "$DIEL/add_focus_ring_block.py" \
            "$DIEL/baseline_plasma_plus_unstructured_cover_plus_wafer.msh" "$DIEL/baseline_plasma_plus_unstructured_cover_plus_wafer.msh" \
            > "$RESULT/prep/mesh_focus.log" 2>&1
          python3 "$DIEL/add_vacuum_coils_block.py" \
            "$DIEL/baseline_plasma_plus_unstructured_cover_plus_wafer.msh" "$DIEL/baseline_plasma_plus_unstructured_cover_plus_wafer.msh" \
            > "$RESULT/prep/mesh_vacuum.log" 2>&1

          cp "$DIEL/baseline_plasma_plus_unstructured_cover_plus_wafer.msh" \
             "$CHEM/baseline_plasma_plus_unstructured_cover_plus_wafer.msh"
          python3 "$DIEL/prepare_baseline_cover_pilot.py" "$CHEM/a0_full_icp.i" > "$RESULT/prep/materialize.log" 2>&1
          python3 "$DIEL/finalize_baseline_cover_pilot.py" "$CHEM/a0_full_icp.i" > "$RESULT/prep/finalize.log" 2>&1
          python3 "$DIEL/promote_cover_wafer_15us.py" "$CHEM/a0_full_icp.i" > "$RESULT/prep/wafer.log" 2>&1
          python3 "$DIEL/promote_focus_ring_15us.py" "$CHEM/a0_full_icp.i" > "$RESULT/prep/focus.log" 2>&1
          python3 "$DIEL/promote_vacuum_coils_15us.py" "$CHEM/a0_full_icp.i" > "$RESULT/prep/vacuum.log" 2>&1

          cp "$CHEM/a0_full_icp.i" "$CHEM/rf_elastic_diss_pid_100w_grid.i"
          python3 "$DIEL/promote_cover_15us.py" "$CHEM/rf_elastic_diss_pid_100w_grid.i" \
            | tee "$RESULT/prep/timegrid.log"

          python3 "$CHEM/build_rf_multiapp_coupling_100w.py" \
            --table "$TABLE" \
            --parent-overlay "$CHEM/rf_elastic_diss_multiapp_parent_100w_overlay.i" \
            --child-overlay "$CHEM/rf_elastic_diss_multiapp_maxwell_100w_overlay.i" \
            --child-input "$CHEM/rf_elastic_diss_multiapp_maxwell_100w_child.i" \
            | tee "$RESULT/prep/multiapp.log"

          cp physics_app/data/electron_impact/o2_elastic.txt "$CHEM/o2_elastic.txt"
          python3 "$CHEM/build_o2_elastic_overlay.py" \
            --base-input "$CHEM/a0_full_icp.i" \
            --output "$CHEM/o2_elastic_pid_100w_overlay.i" \
            --elastic-table o2_elastic.txt \
            | tee "$RESULT/prep/elastic_overlay.log"

          python3 "$CHEM/build_o2_dissociation_overlay.py" \
            --base-input "$CHEM/a0_full_icp.i" \
            --output "$CHEM/o2_dissociation_100w_overlay.i" \
            | tee "$RESULT/prep/dissociation_overlay.log"

          python3 -m py_compile \
            "$CHEM/build_rf_multiapp_coupling_100w.py" \
            "$CHEM/analyze_rf_elastic_diss_multiapp_100w.py" \
            "$CHEM/build_o2_dissociation_overlay.py"

          grep -q 'type = FullSolveMultiApp' "$CHEM/rf_elastic_diss_multiapp_parent_100w_overlay.i"
          grep -q 'postprocessor = P_rf_raw_W_t6' "$CHEM/rf_elastic_diss_multiapp_parent_100w_overlay.i"
          grep -q 'target = 100' "$CHEM/rf_elastic_diss_multiapp_parent_100w_overlay.i"
          grep -q 'postprocessor = rf_drive_scale_child' "$CHEM/rf_elastic_diss_multiapp_maxwell_100w_overlay.i"
          grep -q 'R_elastic_O2' "$CHEM/o2_elastic_pid_100w_overlay.i"
          grep -q 'R_diss_O2' "$CHEM/o2_dissociation_100w_overlay.i"
          grep -q '12.62' "$CHEM/o2_dissociation_100w_overlay.i"
          ! grep -q 'O2_dissociation.csv' "$CHEM/o2_dissociation_100w_overlay.i" || grep -q 'intentionally not used' "$CHEM/o2_dissociation_100w_overlay.i"
          ! grep -q 'SolutionUserObject\|maxwell_solution_file_t6' "$CHEM/rf_elastic_diss_multiapp_parent_100w_overlay.i"
          ! grep -q 'SolutionUserObject\|plasma_solution_file_t6' "$CHEM/rf_elastic_diss_multiapp_maxwell_100w_overlay.i"

      - name: Pull pinned Physics build image
        shell: bash
        run: docker pull "$BUILD_BASE_REF"

      - name: Build exact-head Physics application
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash --user 0:0 \
            --workdir /workspace -v "$GITHUB_WORKSPACE:/workspace" \
            "$BUILD_BASE_REF" -lc '
              set -euo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory /opt/physics_vendor/moose
              git config --global --add safe.directory /opt/physics_vendor/crane
              git config --global --add safe.directory /opt/physics_vendor/squirrel
              git config --global --add safe.directory /opt/physics_vendor/zapdos
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt
              make -C physics_app -j2
            '
          test -x physics_app/physics-opt

      - name: Check 100 W elastic plus dissociation MultiApp input
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash --user 0:0 \
            --workdir /workspace -v "$GITHUB_WORKSPACE:/workspace" \
            "$BUILD_BASE_REF" -lc "
              set -euo pipefail
              source /environment
              physics_app/physics-opt --check-input \
                -i '$CHEM/rf_elastic_diss_pid_100w_grid.i' \
                '$CHEM/rf_elastic_diss_multiapp_parent_100w_overlay.i' \
                '$CHEM/o2_elastic_pid_100w_overlay.i' \
                '$CHEM/o2_dissociation_100w_overlay.i' \
                Executioner/end_time=1.0e-7
            " 2>&1 | tee "$RESULT/check_input.log"

      - name: Run continuous 100 W RF plus EI02 elastic plus dissociation to 100 ns
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash --user 0:0 \
            --workdir /workspace -v "$GITHUB_WORKSPACE:/workspace" \
            "$BUILD_BASE_REF" -lc "
              set -euo pipefail
              source /environment
              physics_app/physics-opt \
                -i '$CHEM/rf_elastic_diss_pid_100w_grid.i' \
                '$CHEM/rf_elastic_diss_multiapp_parent_100w_overlay.i' \
                '$CHEM/o2_elastic_pid_100w_overlay.i' \
                '$CHEM/o2_dissociation_100w_overlay.i' \
                Executioner/end_time=1.0e-7 \
                Outputs/file_base='$RESULT/run/plasma'
            " 2>&1 | tee "$RESULT/runtime.log"

      - name: Analyze 100 W RF plus elastic plus dissociation evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 "$CHEM/analyze_rf_elastic_diss_multiapp_100w.py" \
            --exodus "$RESULT/run/plasma.e" \
            --csv "$RESULT/run/plasma.csv" \
            --output "$RESULT/analysis.json" \
            | tee "$RESULT/analysis.log"

      - name: Upload 100 W RF plus elastic plus dissociation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue395-rf-elastic-diss-multiapp-100w-evidence
          path: |
            experiments/Issue395_powered_chemistry_ladder/results_rf_elastic_diss_multiapp_100w/**
            experiments/Issue395_powered_chemistry_ladder/a0_full_icp.i
            experiments/Issue395_powered_chemistry_ladder/rf_elastic_diss_pid_100w_grid.i
            experiments/Issue395_powered_chemistry_ladder/rf_elastic_diss_multiapp_parent_100w_overlay.i
            experiments/Issue395_powered_chemistry_ladder/rf_elastic_diss_multiapp_maxwell_100w_overlay.i
            experiments/Issue395_powered_chemistry_ladder/rf_elastic_diss_multiapp_maxwell_100w_child.i
            experiments/Issue395_powered_chemistry_ladder/o2_elastic_pid_100w_overlay.i
            experiments/Issue395_powered_chemistry_ladder/o2_dissociation_100w_overlay.i
            experiments/Issue395_powered_chemistry_ladder/o2_elastic.txt
            experiments/Issue395_powered_chemistry_ladder/build_rf_multiapp_coupling.py
            experiments/Issue395_powered_chemistry_ladder/build_rf_multiapp_coupling_100w.py
            experiments/Issue395_powered_chemistry_ladder/analyze_rf_elastic_multiapp.py
            experiments/Issue395_powered_chemistry_ladder/analyze_rf_elastic_diss_multiapp_100w.py
            experiments/Issue395_powered_chemistry_ladder/build_o2_elastic_overlay.py
            experiments/Issue395_powered_chemistry_ladder/build_o2_dissociation_overlay.py
          if-no-files-found: warn
          retention-days: 30
