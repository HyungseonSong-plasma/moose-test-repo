name: Issue-224 C5 observer-family memory discriminator

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/issue224-c5-observer-family-memory.yml'
      - 'experiments/Issue224_observability_memory/run_c5.py'
  workflow_dispatch:

concurrency:
  group: issue224-c5-observer-family-memory-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
  MOOSE_SHA: 9f388366ccf38b9c34542ec5561198249fde0ac9
  CRANE_SHA: ba26970cf419dcac563a20ed7079d445bc6341c3
  SQUIRREL_SHA: 16a26d504f3ee11161a86d4e3ebf3c0e5f2afbb1
  ZAPDOS_SHA: 9eceffbc46048c3760bbfa9a7f1ca681ae35af1d

jobs:
  observer-family-memory:
    name: R2 zero-timestep observer-family split
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate immutable build-base identity
        shell: bash
        run: |
          set -euxo pipefail
          source physics_app/dependencies.lock
          test "$MOOSE" = "$MOOSE_SHA"
          test "$CRANE" = "$CRANE_SHA"
          test "$SQUIRREL" = "$SQUIRREL_SHA"
          test "$ZAPDOS" = "$ZAPDOS_SHA"
          docker pull "$BUILD_BASE_REF"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.moose.sha" }}')" = "$MOOSE_SHA"

      - name: P0 observer-family discriminator self-test
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace \
            -e GITHUB_SHA="$GITHUB_SHA" \
            -v "$PWD:/workspace" "$BUILD_BASE_REF" -lc '
              source /environment
              export PYTHONPATH=/workspace
              git config --global --add safe.directory /workspace
              test "$(git -C /workspace rev-parse HEAD)" = "$GITHUB_SHA"
              uv pip install --system --python "$(command -v python3)" -r requirements-evidence-engine.txt
              python3 -m py_compile /workspace/experiments/Issue224_observability_memory/run_c5.py
              python3 /workspace/experiments/Issue224_observability_memory/run_c5.py --self-test
            '

      - name: Build exact head and execute C5 family split
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf issue224-c5-observer-family-memory-results
          mkdir -p issue224-c5-observer-family-memory-results
          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace \
            -e GITHUB_SHA="$GITHUB_SHA" \
            -v "$PWD:/workspace" "$BUILD_BASE_REF" -lc '
              set -euxo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt
              export PYTHONPATH=/workspace
              uv pip install --system --python "$(command -v python3)" -r requirements-evidence-engine.txt
              test "$(git -C /workspace rev-parse HEAD)" = "$GITHUB_SHA"
              test ! -e physics_app/physics-opt
              make -C physics_app -j2
              test -x physics_app/physics-opt
              /usr/bin/time -v -o /workspace/issue224-c5-observer-family-memory-results/runner_resource.txt \
                python3 /workspace/experiments/Issue224_observability_memory/run_c5.py \
                  --physics-opt /workspace/physics_app/physics-opt \
                  --results-root /workspace/issue224-c5-observer-family-memory-results \
                  --timeout 180
            '

      - name: Verify C5 setup-only contract and attribution
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          s = json.loads(Path('issue224-c5-observer-family-memory-results/summary.json').read_text())
          assert s['status'] == 'ISSUE224_C5_ATTRIBUTION_READY'
          assert s['diagnostic'] == 'C5_OBSERVER_FAMILY_INITIAL_MEMORY'
          assert s['physical_timesteps_authorized'] == 0
          assert s['decision']['full_r2_solve_executed'] is False
          assert s['decision']['promotion_authorized'] is False
          assert s['decision']['production_control_drift']['stable'] is True
          assert set(s['decision']['family_classification']) == {
              'side_flux', 'element_aggregate', 'ad_extreme', 'light_derived'
          }
          for name, case in s['cases'].items():
              assert case['hard_pass'] is True, name
              assert case['guards']['no_linear_solve'] is True, name
              assert case['guards']['no_physical_timestep'] is True, name
              assert case['guards']['num_steps_is_zero'] is True, name
          print({
              'STATUS': s['status'],
              'CLASSIFICATION': s['decision']['classification'],
              'FAMILY_CLASSIFICATION': s['decision']['family_classification'],
              'MAJOR_FAMILIES': s['decision']['major_families'],
              'SECONDARY_FAMILIES': s['decision']['secondary_families'],
              'CONTROL_DRIFT': s['decision']['production_control_drift'],
          })
          PY

      - name: Upload Issue-224 C5 family-memory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue224-c5-observer-family-memory-evidence
          path: issue224-c5-observer-family-memory-results/**
          if-no-files-found: error
          retention-days: 7
