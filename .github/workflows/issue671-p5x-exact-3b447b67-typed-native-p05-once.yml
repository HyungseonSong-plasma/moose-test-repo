name: Issue671 P5-X exact 3b447b67 W1 417 941 typed P05 N1-N8
on:
  push:
    branches:
      - issue-671-p5x-exact-3b447b67-typed-native-p05-20261118
    paths:
      - .github/workflows/issue671-p5x-exact-3b447b67-typed-native-p05-once.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: issue671-p5x-w1-p05-owner-registration-3b447b67-one-shot
  cancel-in-progress: false
jobs:
  exact-head-w1-native-p05:
    if: github.repository == 'HyungseonSong-plasma/moose-test-repo'
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    env:
      OCI: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
      BASE_HEAD: 3b447b67283dac3b1d5e592ed3db6e56754c3d0e
    steps:
      - name: Checkout exact source without writing authentication credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse unexpected checkout and unreviewed modifications before secret access
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$BASE_HEAD" HEAD
          git diff --name-only "$BASE_HEAD" HEAD | sort > "$RUNNER_TEMP/actual-changes.txt"
          printf '%s\n' '.github/workflows/issue671-p5x-exact-3b447b67-typed-native-p05-once.yml' > "$RUNNER_TEMP/approved-changes.txt"
          diff -u "$RUNNER_TEMP/approved-changes.txt" "$RUNNER_TEMP/actual-changes.txt"
          test "$(git hash-object physics_app/src/physics/plasma/DDContinuityEq.C)" = 13b25226d463b8fd1e4acaee16358f8f17d710a0
          test "$(git hash-object physics_app/src/physics/plasma/Chemistry.C)" = 045de080e3d836d75495b1749d75d5d3deea2330
          test "$(git hash-object experiments/Issue402_plasma_dsl_g1/chemistry/retire_s6_p4_duplicate_owners.py)" = a3f9d93ea1095c9d00053e5104bb7326d1af8f31
          test "$(git hash-object ci/guards/issue671_secure_ei_rate_scratch.py)" = cd75238df8083f54b5b08330e46f88276ff8370a
          # Keep the workflow on this isolated branch, but compile and stage the EXACT PR665 source.
          git checkout --detach "$BASE_HEAD"
          test "$(git rev-parse HEAD)" = "$BASE_HEAD"
          echo P05_SOURCE_HEAD_AND_CODE_BLOBS_PIN_PASS

      - name: Checkout immutable historical public S6 mesh and support source
        uses: actions/checkout@v4
        with:
          ref: 29d1acc6ef7969908b86719e4b95c73a1565136d
          path: historical
          fetch-depth: 1
          persist-credentials: false
      - name: Reproduce exact SHA-pinned 400 W public parent plasma mesh
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet \
            'pytest>=8,<9' 'pydantic>=2,<3' numpy==2.1.2 scipy==1.14.1 matplotlib==3.9.2 \
            -r requirements-evidence-engine.txt -r requirements-ontology.txt
          cd historical
          SRC=.github/oxygen25_eedf/initial_mixture_23xsec_transport.txt
          DST=experiments/Issue91_real_qvt_r3/r3_e0/electron_moments.txt
          echo "35534a522fa48ccb5222339c5040040630eef31e623e1c53f1e1c4540d2d653b  $SRC" | sha256sum --check -
          cp "$SRC" "$DST"
          export CHATGPT_WORK_BASE_SHA=29d1acc6ef7969908b86719e4b95c73a1565136d
          export OXYGEN_RESEARCH_400=1
          CHEM=experiments/Issue395_powered_chemistry_ladder
          bash "$CHEM/issue397_l1_power_scan_replay.sh" prepare 400
          python3 .github/scripts/oxygen_legacy6_latest_100us.py --power-w 400 --prepare
          echo "ac70642df75bf7b4bc4ec0d92511e545f0942f9e07a1361618fb9eb5696b83fc  $CHEM/baseline_plasma_plus_unstructured_cover_plus_wafer.msh" | sha256sum --check -
          test ! -e "$CHEM/private_rates"
          echo P05_PUBLIC_MESH_SHA_PASS

      - name: Download exact verified 417 941 P3-X public source and immutable diagnostic staging helper
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p05-in"
          curl --fail --location --silent --show-error --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/14406746397/zip" \
            --output "$RUNNER_TEMP/p05-in/p3x-source.zip"
          echo "592a7c82834bab841f6a2e1807db305d0eff1e953f50a0dcc6d7e21ff8820111  $RUNNER_TEMP/p05-in/p3x-source.zip" | sha256sum --check -
          curl --fail --location --silent --show-error --retry 3 \
            "https://raw.githubusercontent.com/HyungseonSong-plasma/moose-test-repo/41ab61e442a497db2388c025075237bd24cfd025/ci/issue671_p5_d8_native_probe.py" \
            --output "$RUNNER_TEMP/p05-in/pinned_source_stager.py"
          test "$(git hash-object "$RUNNER_TEMP/p05-in/pinned_source_stager.py")" = 8bf49b7807c9f9b3eed8e622e72062f2b5c822bc
          python3 -m py_compile "$RUNNER_TEMP/p05-in/pinned_source_stager.py"
          echo P05_PUBLIC_ARTIFACT_AND_STAGER_PIN_PASS

      - name: Stage real eleven-layer inputs with original mesh and support; exact P4-X owner cutover
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p05-in/staged"
          python3 "$RUNNER_TEMP/p05-in/pinned_source_stager.py" \
            --source "$GITHUB_WORKSPACE" --repo-head "$BASE_HEAD" \
            --artifact "$RUNNER_TEMP/p05-in/p3x-source.zip" \
            --historical-mesh "$GITHUB_WORKSPACE/historical/experiments/Issue395_powered_chemistry_ladder/baseline_plasma_plus_unstructured_cover_plus_wafer.msh" \
            --historical-support-root "$GITHUB_WORKSPACE/historical" \
            --output "$RUNNER_TEMP/p05-in/staged" --stage-only
          python3 - "$RUNNER_TEMP/p05-in/staged" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/p05-in/p4_receipt.json" <<'PY'
          from pathlib import Path
          import sys,json,hashlib
          stage=Path(sys.argv[1]); root=Path(sys.argv[2]); out=Path(sys.argv[3])
          sys.path.insert(0,str(root/"experiments/Issue402_plasma_dsl_g1/chemistry"))
          from retire_s6_p4_duplicate_owners import retire_p4_duplicate_owners, C0, AFTER_SHA
          stages=json.loads((stage/"readiness.json").read_text())["stage_cases"]
          receipts={}
          for case in ("417","941"):
              folder=stage/"scratch"/case/"experiments"/"Issue395_powered_chemistry_ladder"
              raw_ordered=stages[case]["ordered"]
              ordered=[Path(p).name for p in raw_ordered]
              assert len(ordered)==11 and ordered[0]==C0 and len(set(ordered))==11
              sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
              baseline={n:sha(folder/n) for n in ordered}
              marker=folder/".issue633_disposable_scratch"
              assert not marker.is_symlink()
              if marker.exists():
                  assert marker.read_text().strip()=="issue633-scratch-only"
              else:
                  marker.write_text("issue633-scratch-only\n")
              js=json.loads((folder/"chemistry"/f"unified_s6_{case}_newonly.json").read_text())
              cut=retire_p4_duplicate_owners(folder,ordered,js,post_p3_layer_sha=baseline)
              assert sha(folder/C0)==AFTER_SHA
              assert all(sha(folder/n)==baseline[n] for n in ordered[1:])
              assert cut["retired_source_materials"]==6 and cut["carrier_one_preserved"]
              receipts[case]={"P4X":"P4X_7_OWNER_SOURCE_PASS","post_p4_C0_sha256":sha(folder/C0),
                              "retired_old_ion_FV":26,"retired_old_electron":10,
                              "retired_old_duplicate_materials":6,"carrier_one_preserved":True,
                              "ordered_inputs":raw_ordered,
                              "11_layer_sha256":{n:sha(folder/n) for n in ordered},
                              "JSON_sha256":sha(folder/"chemistry"/f"unified_s6_{case}_newonly.json"),
                              "parent_mesh_sha256":sha(folder/"baseline_plasma_plus_unstructured_cover_plus_wafer.msh")}
          out.write_text(json.dumps(receipts,indent=2,sort_keys=True)+"\n")
          print("P05_REAL_POST_P4X_STAGE_BOTH_CASES_11_LAYER_PASS")
          PY

      - name: Download immutable exact-head W1 bundle and pin one ELF plus both app libraries
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$BASE_HEAD"
          test ! -e physics_app/physics-opt
          mkdir -p "$RUNNER_TEMP/p05-in/w1"
          curl --fail --location --silent --show-error --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/14449097760/zip" \
            --output "$RUNNER_TEMP/p05-in/w1.zip"
          echo "84ce92ead209f458042977452a9284b78cac224c9adadc7b74015568474fcb7e  $RUNNER_TEMP/p05-in/w1.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/p05-in/w1.zip" identity.json > "$RUNNER_TEMP/p05-in/w1_identity.json"
          unzip -p "$RUNNER_TEMP/p05-in/w1.zip" physics-opt-and-app-libs.tar.gz > "$RUNNER_TEMP/p05-in/w1-binary.tar.gz"
          echo "40aa3da97c9710530831859dcaf85f11f36224f81605f93a471ded6056bc00d4  $RUNNER_TEMP/p05-in/w1-binary.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/p05-in/w1-binary.tar.gz" -C "$RUNNER_TEMP/p05-in/w1"
          test "$(find "$RUNNER_TEMP/p05-in/w1" -type f | wc -l)" = 3
          echo "efab43df773398d0c1f6eadf5bc384fbb325da10e67a5c21571039fec6dadcc6  $RUNNER_TEMP/p05-in/w1/physics-opt" | sha256sum -c -
          echo "141c951d6887eea44694324c70f48add2d6fd8e31285327196b5aa49f48f6b41  $RUNNER_TEMP/p05-in/w1/lib/libphysics-opt.so.0" | sha256sum -c -
          echo "80cc6690292a4c26064756be14ab0d82aea2c53f85f60c16546c871af1f6568f  $RUNNER_TEMP/p05-in/w1/lib/libphysics_test-opt.so.0" | sha256sum -c -
          python3 - "$RUNNER_TEMP/p05-in/w1_identity.json" "$BASE_HEAD" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1]))
          assert j["source_head"]==sys.argv[2]
          assert j["source_tree"]=="7a325366563f9dee0de6c8087c3ce480858c301b"
          assert j["binary_sha256"]=="efab43df773398d0c1f6eadf5bc384fbb325da10e67a5c21571039fec6dadcc6"
          assert j["oci"]=="ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008"
          assert j["app_libraries"]["libphysics-opt.so.0"]["sha256"]=="141c951d6887eea44694324c70f48add2d6fd8e31285327196b5aa49f48f6b41"
          assert j["app_libraries"]["libphysics_test-opt.so.0"]["sha256"]=="80cc6690292a4c26064756be14ab0d82aea2c53f85f60c16546c871af1f6568f"
          assert j["build_count"]==1 and j["native_check_input"]=="NOT_RUN"
          print("P5X_W1_EXACT_SOURCE_OCI_ELF_LIBS_ARTIFACT_SHA_PASS")
          PY
          docker pull "$OCI"
          mkdir -p physics_app/lib physics_app/test/lib
          cp "$RUNNER_TEMP/p05-in/w1/physics-opt" physics_app/physics-opt
          cp "$RUNNER_TEMP/p05-in/w1/lib/libphysics-opt.so.0" physics_app/lib/libphysics-opt.so.0
          cp "$RUNNER_TEMP/p05-in/w1/lib/libphysics_test-opt.so.0" physics_app/test/lib/libphysics_test-opt.so.0
          chmod 0755 physics_app/physics-opt
          echo "efab43df773398d0c1f6eadf5bc384fbb325da10e67a5c21571039fec6dadcc6  physics_app/physics-opt" | sha256sum -c -
          echo "141c951d6887eea44694324c70f48add2d6fd8e31285327196b5aa49f48f6b41  physics_app/lib/libphysics-opt.so.0" | sha256sum -c -
          echo "80cc6690292a4c26064756be14ab0d82aea2c53f85f60c16546c871af1f6568f  physics_app/test/lib/libphysics_test-opt.so.0" | sha256sum -c -
          printf '%s  %s\n' efab43df773398d0c1f6eadf5bc384fbb325da10e67a5c21571039fec6dadcc6 physics_app/physics-opt > "$RUNNER_TEMP/p05-in/physics-opt.sha256"
          echo P5X_REUSED_EXACT_HEAD_ONE_BINARY_FOR_BOTH_CASES_AND_ALL_NEGATIVES

      - name: Compile external read-only MOOSE registration tracer without rebuilding PhysicsApp
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/p05-in/p5x_owner_tracer.cc" <<'P5XCPP'
          #include <string>
          #include <cstdlib>
          #include <cstdio>
          #include <cstring>
          #include <dlfcn.h>
          #include <fcntl.h>
          #include <unistd.h>
          class InputParameters;
          class FEProblemBase {
          public:
            void addFVKernel(const std::string &, const std::string &, InputParameters &);
            void addFVBC(const std::string &, const std::string &, InputParameters &);
            void addBoundaryCondition(const std::string &, const std::string &, InputParameters &);
          };
          using OriginalFn = void (*)(FEProblemBase *, const std::string &, const std::string &, InputParameters &);
          static OriginalFn actual(const char * symbol) {
            void * p = dlsym(RTLD_NEXT, symbol);
            if (!p) {
              const char * error = dlerror();
              std::fprintf(stderr, "P5X_INTERPOSER_UNRESOLVED symbol=%s error=%s\n", symbol, error ? error : "none");
              std::_Exit(83);
            }
            return reinterpret_cast<OriginalFn>(p);
          }
          static void record(const char * family, const std::string & name, const std::string & type) {
            const char * file = std::getenv("P5X_REGISTER_LOG");
            if (!file || !*file) std::_Exit(84);
            if (name.find('\t') != std::string::npos || name.find('\n') != std::string::npos ||
                type.find('\t') != std::string::npos || type.find('\n') != std::string::npos) std::_Exit(85);
            const int fd = open(file, O_WRONLY | O_CREAT | O_APPEND | O_CLOEXEC | O_NOFOLLOW, 0600);
            if (fd < 0) std::_Exit(86);
            const std::string line = std::string("P5X_REGISTER\t") + family + "\t" + name + "\t" + type + "\n";
            if (write(fd, line.data(), line.size()) != static_cast<ssize_t>(line.size())) std::_Exit(87);
            close(fd);
          }
          void FEProblemBase::addFVKernel(const std::string & type, const std::string & name, InputParameters & params) {
            static OriginalFn fn = actual("_ZN13FEProblemBase11addFVKernelERKNSt7__cxx1112basic_stringIcSt11char_traitsIcESaIcEEES7_R15InputParameters");
            fn(this, type, name, params);
            record("FVKernel", name, type);
          }
          void FEProblemBase::addFVBC(const std::string & type, const std::string & name, InputParameters & params) {
            static OriginalFn fn = actual("_ZN13FEProblemBase7addFVBCERKNSt7__cxx1112basic_stringIcSt11char_traitsIcESaIcEEES7_R15InputParameters");
            fn(this, type, name, params);
            record("FVBC", name, type);
          }
          void FEProblemBase::addBoundaryCondition(const std::string & type, const std::string & name, InputParameters & params) {
            static OriginalFn fn = actual("_ZN13FEProblemBase20addBoundaryConditionERKNSt7__cxx1112basic_stringIcSt11char_traitsIcESaIcEEES7_R15InputParameters");
            fn(this, type, name, params);
            record("FEBoundaryCondition", name, type);
          }
          // Linker/load diagnostic, independent of registration interception.
          __attribute__((constructor)) static void p5x_preload_ready() {
            const char *p = std::getenv("P5X_REGISTER_LOG");
            if (!p || !*p) return;
            const int fd = open(p, O_WRONLY | O_CREAT | O_APPEND | O_CLOEXEC | O_NOFOLLOW, 0600);
            if (fd < 0) return;
            constexpr char marker[] = "P5X_PRELOAD_READY\n";
            (void)write(fd, marker, sizeof(marker) - 1);
            close(fd);
          }
          P5XCPP
          # Compile against the pinned runtime OCI glibc/libstdc++; ubuntu-24.04 host-built .so is ABI-incompatible.
          # This builds the independent observer ONLY. W1 physics-opt and both app libraries are byte-preserved.
          docker run --rm --network none --entrypoint /bin/bash --user 0:0 \
            --mount "type=bind,src=$RUNNER_TEMP/p05-in,dst=/probe" \
            "$OCI" -lc 'set -euo pipefail; source /environment; g++ -std=c++17 -O2 -fPIC -shared -o /probe/libp5x_owner_tracer.so /probe/p5x_owner_tracer.cc -ldl'
          test -s "$RUNNER_TEMP/p05-in/libp5x_owner_tracer.so"
          nm -D "$RUNNER_TEMP/p05-in/libp5x_owner_tracer.so" | grep -Fq '_ZN13FEProblemBase11addFVKernel'
          nm -D "$RUNNER_TEMP/p05-in/libp5x_owner_tracer.so" | grep -Fq '_ZN13FEProblemBase7addFVBC'
          nm -D "$RUNNER_TEMP/p05-in/libp5x_owner_tracer.so" | grep -Fq '_ZN13FEProblemBase20addBoundaryCondition'
          sha256sum "$RUNNER_TEMP/p05-in/libp5x_owner_tracer.so" > "$RUNNER_TEMP/p05-in/tracer.sha256"
          # The protected /dev/shm mount is noexec; load observer from read-only /workspace.
          cp "$RUNNER_TEMP/p05-in/libp5x_owner_tracer.so" physics_app/p5x_owner_tracer.so
          chmod 0755 physics_app/p5x_owner_tracer.so
          cmp physics_app/p5x_owner_tracer.so "$RUNNER_TEMP/p05-in/libp5x_owner_tracer.so"
          test "$(git rev-parse HEAD)" = "$BASE_HEAD"
          echo P5X_AUDIT_ONLY_SHARED_OBJECT_COMPILATION_PASS

      - name: Public-only observer loader preflight before protected rates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p05-in/observer-preflight"
          docker run --rm --network none --entrypoint /bin/bash --user 0:0 \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/p05-in/observer-preflight,dst=/probe" \
            "$OCI" -lc 'set -euo pipefail; source /environment; P5X_REGISTER_LOG=/probe/preload-ready.log LD_PRELOAD=/workspace/physics_app/p5x_owner_tracer.so /workspace/physics_app/physics-opt --version >/probe/version.txt; test -s /probe/version.txt; grep -Fxq P5X_PRELOAD_READY /probe/preload-ready.log'
          # Trace marker remains root-owned 0600: validation happens in-container, not via host.
          echo P5X_PRELOAD_ELF_LOADER_PASS_NO_PRIVATE_RATE
      - name: Protected original EI Rate, clean controls, and N1-N8 actual Native mutants
        shell: bash
        env:
          PROTECTED_ARCHIVE_B64: ${{ secrets.OXYGEN24_RATES_TAR_XZ_B64 }}
          P5X_OWNER_SO: ${{ runner.temp }}/p05-in/libp5x_owner_tracer.so
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/p05-out"
          python3 - "$RUNNER_TEMP/p05-in/staged" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/p05-out" "$BASE_HEAD" "$OCI" <<'PY'
          from pathlib import Path
          import hashlib, json, os, re, shutil, shlex, subprocess, sys, tempfile, stat
          
          staged, repo, out, head, oci = map(str, sys.argv[1:6])
          staged, repo, out = Path(staged), Path(repo), Path(out)
          out.mkdir(parents=True, exist_ok=True)
          sys.path.insert(0, str(repo / "ci" / "guards"))
          from issue671_secure_ei_rate_scratch import read_hashed_rows, EXPECTED, REQUIRED, validate_rows
          
          def sha(p):
              h=hashlib.sha256()
              with p.open("rb") as f:
                  for b in iter(lambda:f.read(1048576),b""): h.update(b)
              return h.hexdigest()
          
          def file_shas(root):
              d={}
              for path in sorted(root.rglob("*")):
                  if path.is_symlink(): raise RuntimeError("UNSAFE_SYMLINK_IN_STAGE")
                  if path.is_file():
                      if not stat.S_ISREG(path.lstat().st_mode): raise RuntimeError("NONREGULAR_SOURCE")
                      d[path.relative_to(root).as_posix()]=sha(path)
              return d
          
          def insert(deck, section, name, params):
              lines=deck.splitlines(keepends=True)
              starts=[i for i,v in enumerate(lines) if v.strip()=="["+section+"]" and v==v.lstrip()]
              if len(starts)!=1: raise RuntimeError("EXACT_ROOT_SECTION_REQUIRED")
              close=next((i for i in range(starts[0]+1,len(lines)) if re.fullmatch(r"\[\]\s*",lines[i])),None)
              if close is None: raise RuntimeError("UNBALANCED_ROOT_SECTION")
              if re.search(r"(?m)^\s*\["+re.escape(name)+r"\]\s*$",deck):
                  raise RuntimeError("MUTANT_ALREADY_PRESENT")
              s="  ["+name+"]\n"+"".join("    "+k+" = "+v+"\n" for k,v in params.items())+"  []\n"
              lines.insert(close,s)
              return "".join(lines)
          
          def mutate(folder,case,test):
              c0=folder/"experiments"/"Issue395_powered_chemistry_ladder"/"rf_elastic_diss_ion_ei20_ei01_400w_adjacent_sheath_wall_closed_100us_dt1000ns__C0_chemistry_off.i"
              js=folder/"experiments"/"Issue395_powered_chemistry_ladder"/"chemistry"/("unified_s6_"+case+"_newonly.json")
              if test in ("N1","N2","N3","N4","N5"):
                  spec={
                    "N1":("FVKernels","p5_n1_extra_time",{"type":"FVLogMolarTimeDerivative","variable":"log_O2p","block":"plasma"}),
                    "N2":("FVKernels","p5_n2_extra_diffusion",{"type":"FVLogMolarDiffusion","variable":"log_Om","coeff":"Om_diffusivity","block":"plasma"}),
                    "N3":("FVBCs","p5_n3_extra_wall",{"type":"FVFunctorNeumannBC","variable":"log_Op","boundary":"inlet","functor":"Op_wall_number_flux","factor":"-1.6605390671738466e-24"}),
                    "N4":("FVKernels","p5_n4_extra_source",{"type":"FVCoupledForce","variable":"log_Op","v":"S_Op_molar","coef":"1","block":"plasma"}),
                    "N5":("FVBCs","O2p_cover_dielectric",{"type":"FVLogMolarDielectricFluxBC","variable":"log_O2p","boundary":"plasma_cover","signed_number_flux":"O2p_wall_number_flux"})}
                  section,name,params=spec[test]
                  c0.write_text(insert(c0.read_text(),section,name,params))
                  return c0
              doc=json.loads(js.read_text())
              if test=="N6":
                  if sum(x["id"]=="EI-401" for x in doc["reactions"])!=1: raise RuntimeError("NO_UNIQUE_EI401")
                  doc["reactions"]=[x for x in doc["reactions"] if x["id"]!="EI-401"]
              elif test=="N7":
                  if doc["species"]["Om"]["initial_number_density"]<=0: raise RuntimeError("ALREADY_INVALID_DENSITY")
                  doc["species"]["Om"]["initial_number_density"]=0
              elif test=="N8":
                  if doc["species"]["Om"]["charge_number"]!=-1: raise RuntimeError("ALREADY_BAD_SIGN")
                  doc["species"]["Om"]["charge_number"]=1
              else: raise RuntimeError("UNKNOWN_MUTATION")
              js.write_text(json.dumps(doc,indent=2,ensure_ascii=False)+"\n")
              return js
          
          def stage_rates(work,case,rates):
              dest=work/"experiments"/"Issue395_powered_chemistry_ladder"/"private_rates"
              if dest.exists() or dest.is_symlink(): raise RuntimeError("PRIVATE_DEST_ALREADY_PRESENT")
              dest.mkdir(mode=0o700)
              for name in sorted(REQUIRED[case]):
                  data=rates[name]
                  if hashlib.sha256(data).hexdigest()!=EXPECTED[name] or validate_rows(data)!=100: raise RuntimeError("PROTECTED_RATE_PIN_INVALID")
                  target=dest/name
                  fd=os.open(target,os.O_CREAT|os.O_EXCL|os.O_WRONLY|getattr(os,"O_NOFOLLOW",0),0o600)
                  with os.fdopen(fd,"wb") as f:f.write(data)
                  if sha(target)!=EXPECTED[name] or (target.stat().st_mode & 0o777)!=0o600:raise RuntimeError("PROTECTED_RATE_READBACK_INVALID")
              return len(REQUIRED[case])
          
          def native(work, ordered, binary, trace=False):
              cmd=["docker","run","--rm","--network","none","--entrypoint","/bin/bash","--user","0:0","--workdir","/case",
                   "--env","OXYGEN_RESEARCH_400=1","--env","OXYGEN_RESEARCH_FULL24=0",
                   "--env","OXYGEN_RESEARCH_EI2738_FORMULA=0","--env","OXYGEN_RESEARCH_QUICK_5MIN=0",
                   "--mount",f"type=bind,src={repo},dst=/workspace,readonly",
                   "--mount",f"type=bind,src={work},dst=/case",oci,"-lc",
                   "set -euo pipefail; source /environment; "+("P5X_REGISTER_LOG=/case/p5x_registrations.log LD_PRELOAD=/workspace/physics_app/p5x_owner_tracer.so " if trace else "")+"/workspace/physics_app/physics-opt --check-input -i "+
                   " ".join(shlex.quote(x) for x in ordered)]
              try:
                  p=subprocess.run(cmd,text=True,capture_output=True,timeout=480,check=False,
                                   env={k:v for k,v in os.environ.items() if k!="PROTECTED_ARCHIVE_B64"})
                  return p.returncode, (p.stdout or "")+"\n"+(p.stderr or "")
              except subprocess.TimeoutExpired:
                  return 124,"NATIVE_INPUT_TIMEOUT"
          
          expected={
          "N1":("P05 FV Native/Physics duplicate or unexpected owner",),
          "N2":("P05 FV Native/Physics duplicate or unexpected owner",),
          "N3":("P05 legacy, duplicate or unexpected FV BC",),
          "N4":("P05 FV Native/Physics duplicate or unexpected owner",),
          "N5":("P05 legacy, duplicate or unexpected FV BC",),
          "N6":("equation without matching reaction ID: EI-401",),
          "N7":("initial_number_density must be finite and strictly positive",),
          "N8":("EI-401: charge conservation failed",)}
          receipt={"schema":"issue671.p05.n1_n8.native_s6.v1","source_head":head,"OCI":oci,
                   "binary_sha256":sha(repo/"physics_app"/"physics-opt"),"cases":{},
                   "tests_total":16,"native_tests_completed":0,"native_expected_rejections":0,
                   "status":"HOLD","science":"SCIENCE_HOLD","Native_P3":"NOT_RUN","Native_P4":"NOT_RUN",
                   "private_data_in_artifacts":False,"tmpfs_cleanup_verified":False}
          private=None
          receipt["one_build_bundle"]={"source_head":head,
                  "W1_artifact_id":14449097760,
                  "W1_zip_sha256":"84ce92ead209f458042977452a9284b78cac224c9adadc7b74015568474fcb7e",
                  "W1_elf_sha256":"efab43df773398d0c1f6eadf5bc384fbb325da10e67a5c21571039fec6dadcc6",
                  "libphysics_opt_sha256":"141c951d6887eea44694324c70f48add2d6fd8e31285327196b5aa49f48f6b41",
                  "libphysics_test_opt_sha256":"80cc6690292a4c26064756be14ab0d82aea2c53f85f60c16546c871af1f6568f",
                  "one_shared_binary_across_clean_and_16_negatives":True}
          assert receipt["binary_sha256"]==receipt["one_build_bundle"]["W1_elf_sha256"]
          try:
              assert os.popen("git -C "+shlex.quote(str(repo))+" rev-parse HEAD").read().strip()==head
              meta,rates=read_hashed_rows()
              assert set(rates)==set(EXPECTED) and all(meta[n]["sha256_match"] and meta[n]["numeric_shape_pass"] for n in EXPECTED)
              os.environ.pop("PROTECTED_ARCHIVE_B64",None)
              assert Path("/dev/shm").is_dir()
              private=Path(tempfile.mkdtemp(prefix="issue671-native-negatives-",dir="/dev/shm"))
              assert (private.stat().st_mode & 0o777)==0o700
              p4=json.loads((staged.parent/"p4_receipt.json").read_text())
              clean={}
              # Clean controls before any negative; original staged bytes cannot be mutated.
              for case in ("417","941"):
                  public=staged/"scratch"/case
                  expected_case=p4[case]
                  clean_sha=file_shas(public)
                  chem=public/"experiments"/"Issue395_powered_chemistry_ladder"
                  assert len(expected_case["ordered_inputs"])==11
                  assert all(sha(chem/n)==s for n,s in expected_case["11_layer_sha256"].items())
                  assert sha(chem/"chemistry"/("unified_s6_"+case+"_newonly.json"))==expected_case["JSON_sha256"]
                  assert sha(chem/"baseline_plasma_plus_unstructured_cover_plus_wafer.msh")==expected_case["parent_mesh_sha256"]
                  work=private/("clean-"+case)
                  shutil.copytree(public,work,symlinks=False)
                  stage_rates(work,case,rates)
                  observer=Path(os.environ["P5X_OWNER_SO"])
                  assert observer.is_file() and observer.stat().st_size>10000
                  # Observer stays in untracked /workspace (noexec private scratch has only rate/data).
                  rc,log=native(work,expected_case["ordered_inputs"],receipt["binary_sha256"],trace=True)
                  valid=(rc==0 and "Syntax OK" in log)
                  tracefile=work/"p5x_registrations.log"
                  if tracefile.is_symlink():
                      raise RuntimeError("P5X_TRACE_SYMLINK_DENIED")
                  if tracefile.is_file():
                      # OCI root creates the trace as 0600. Transfer ownership of this log only.
                      ownership=subprocess.run(["sudo","chown",f"{os.getuid()}:{os.getgid()}",str(tracefile)],
                                               capture_output=True,check=False)
                      if ownership.returncode!=0:
                          raise RuntimeError("P5X_TRACE_LOG_CHOWN_FAILED")
                      if (tracefile.stat().st_mode & 0o777)!=0o600:
                          raise RuntimeError("P5X_TRACE_PERMISSIONS_NOT_0600")
                  if not tracefile.is_file():
                      diag=re.search(r"P5X_INTERPOSER_UNRESOLVED[^\n]{0,150}",log)
                      reason=("_"+diag.group(0) if diag else "")
                      markers={"preload_cannot_load":"cannot be preloaded",
                               "undefined_symbol":"undefined symbol",
                               "dlsym_error":"P5X_INTERPOSER_UNRESOLVED",
                               "segfault":"Segmentation fault",
                               "aborted":"Aborted",
                               "permission_denied":"Permission denied",
                               "mpi_abort":"MPI_ABORT",
                               "syntax_ok":"Syntax OK",
                               "native_error":"*** ERROR ***",
                               "terminated":"terminate called",
                               "libstdcpp":"std::"}
                      receipt["observer_failure_categories"]={k:(v in log) for k,v in markers.items()}
                      receipt["observer_failure_stdout_stderr_sha256"]=hashlib.sha256(log.encode()).hexdigest()
                      receipt["observer_failure_stdout_stderr_len"]=len(log)
                      import re as _re
                      whitelisted=[_re.sub(r"/dev/shm/[^ \\n]+","[PRIVATE_SCRATCH]",line[:230])
                          for line in log.splitlines()
                          if any(k in line for k in ("P5X_INTERPOSER_","ld.so:","undefined symbol",
                              "terminate called","Segmentation fault","cannot be preloaded","std::",
                              "docker:","Error response from daemon","bash:","not found",
                              "No such file or directory","OCI runtime","mount failed"))]
                      receipt["observer_failure_safe_excerpt"]=whitelisted[-8:]
                      raise RuntimeError("OWNER_INTERPOSER_NOT_INVOKED_"+case+"_rc_"+str(rc)+reason)
                  from collections import Counter
                  raw_trace=tracefile.read_text().splitlines()
                  assert "P5X_PRELOAD_READY" in raw_trace, "P5X_PRELOAD_MARKER_MISSING"
                  events=[line.split("\t") for line in raw_trace if line.startswith("P5X_REGISTER\t")]
                  if not events: raise RuntimeError("P5X_OWNER_HOOK_NOT_INVOKED_"+case)
                  assert all(len(e)==4 and e[0]=="P5X_REGISTER" for e in events)
                  counts=Counter((e[1],e[2],e[3]) for e in events)
                  ion_species=("O2p","Om","Op")
                  kernel_types={"time":"FVLogMolarTimeDerivative","diffusion":"FVLogMolarDiffusion",
                                "drift":"FVLogMolarElectrostaticDrift","source":"FVCoupledForce"}
                  expected_kernels={("FVKernel",f"{s}_{part}",typ)
                        for s in ion_species for part,typ in kernel_types.items()}
                  document=json.loads((public/"experiments"/"Issue395_powered_chemistry_ladder"/"chemistry"/
                                     f"unified_s6_{case}_newonly.json").read_text())
                  expected_bc=set()
                  expected_e=set()
                  for group, catalog in document["drift_diffusion_boundaries"].items():
                      for name, entry in catalog.items():
                          typ=entry["type"]
                          if typ in ("FVFunctorNeumannBC","FVLogMolarDielectricFluxBC"):
                              expected_bc.add(("FVBC",name,typ))
                          elif typ in ("FEMElectronSheathBC","FEMElectronEnergySheathBC"):
                              expected_e.add(("FEBoundaryCondition",name,typ))
                  assert len(expected_kernels)==12 and len(expected_bc)==12 and len(expected_e)==8
                  for key in expected_kernels|expected_bc|expected_e:
                      if counts[key]!=1: raise RuntimeError(f"P5X_OWNER_REGISTRATION_UNIQUE_FAIL_{case}_{key}_{counts[key]}")
                  bad=[key for key in counts if (key[0]=="FVKernel" and key[1].split("_")[0] in ion_species and key not in expected_kernels)
                        or (key[0]=="FVBC" and key[1].split("_")[0] in ion_species and key not in expected_bc)
                        or (key[0]=="FEBoundaryCondition" and key[1].startswith("e_") and key not in expected_e)]
                  if bad: raise RuntimeError(f"P5X_OWNER_UNEXPECTED_{case}_{bad}")
                  receipt.setdefault("owner_registration",{})[case]={
                        "source":"actual FEProblemBase addFVKernel/addFVBC/addBoundaryCondition native registrations after original call and live P05 checkIntegrity",
                        "observer_kind":"EXTERNAL_LD_PRELOAD_AFTER_ORIGINAL_REGISTRATION",
                        "tracer_shared_object_sha256":sha(observer),
                        "registration_log_sha256":sha(tracefile),
                        "observed_FVKernel":sorted([list(k) for k in expected_kernels]),
                        "observed_FVBC":sorted([list(k) for k in expected_bc]),
                        "observed_electron_FE_BC":sorted([list(k) for k in expected_e]),
                        "actual_registered_count":{"FVKernel":12,"FVBC":12,"electron_FE_BC":8},
                        "native_clean_success":valid,
                        "recorded_all_events":len(events),
                        "p05_warehouse_integrity_executed":valid,
                        "warehouse_raw_memory_snapshot":False,
                        "observer_abi_caveat":"External interposition logs successful addObject call, not direct warehouse traversal"}
                  receipt["cases"][case]={"source_layer_sha256":expected_case["11_layer_sha256"],
                         "JSON_sha256":expected_case["JSON_sha256"],
                         "parent_mesh_sha256":expected_case["parent_mesh_sha256"],
                         "clean_exit":rc,"clean_syntax_ok":valid,
                         "clean_log_sha256":hashlib.sha256(log.encode()).hexdigest(),"tests":{}}
                  clean[case]=clean_sha
                  if not valid:raise RuntimeError("CLEAN_CASE_NATIVE_CHECK_INPUT_HOLD_"+case)
              for case in ("417","941"):
                  public=staged/"scratch"/case
                  exp=p4[case]
                  for test in expected:
                      work=private/(case+"-"+test)
                      shutil.copytree(public,work,symlinks=False)
                      modified=mutate(work,case,test)
                      baseline=clean[case]
                      changed=modified.relative_to(work).as_posix()
                      delta=[p for p,s in file_shas(work).items() if baseline.get(p)!=s]
                      if delta != [changed]: raise RuntimeError("NON_SINGLE_FILE_MUTATION_"+case+"_"+test)
                      before=baseline[changed];after=sha(modified)
                      if before==after:raise RuntimeError("MUTATION_NOOP")
                      stage_rates(work,case,rates)
                      rc,log=native(work,exp["ordered_inputs"],receipt["binary_sha256"])
                      matched=rc!=0 and any(p in log for p in expected[test])
                      category=("P05" if "P05 " in log and matched else
                                "CHEMISTRY" if matched else "UNRELATED_OR_ACCEPTED")
                      if test=="N5" and not matched and rc!=0 and "O2p_cover_dielectric" in log and (
                          "duplicate" in log.lower() or "already" in log.lower() or "exists" in log.lower()):
                          matched=True;category="EARLY_REGISTRATION"
                      receipt["cases"][case]["tests"][test]={
                         "changed_file":changed,"before_sha256":before,"after_sha256":after,
                         "unchanged_file_count":len(baseline)-1,"exit_code":rc,
                         "expected_error_substrings":list(expected[test]),
                         "matched_expected":matched,"first_failure_class":category,
                         "log_sha256":hashlib.sha256(log.encode()).hexdigest(),
                         "syntax_ok":"Syntax OK" in log}
                      receipt["native_tests_completed"]+=1
                      if matched:receipt["native_expected_rejections"]+=1
                  if file_shas(public)!=clean[case]:
                      raise RuntimeError("PUBLIC_STAGE_CHANGED_AFTER_NEGATIVES")
                  receipt["cases"][case]["source_restoration"]="SHA_ALL_PUBLIC_FILES_UNCHANGED"
              receipt["status"]=("PASS_16_INTENDED_NATIVE_REJECTIONS" if receipt["native_expected_rejections"]==16
                                else "HOLD_WRONG_NATIVE_FAILURES")
          except Exception as e:
              receipt["status"]="HOLD_NATIVE_OR_HARNESS"
              receipt["harness_error_type"]=type(e).__name__
              if str(e).startswith(("CLEAN_CASE_","NON_SINGLE_FILE_","PUBLIC_STAGE_","MUTATION_","P5X_","OWNER_")):
                  receipt["harness_error_code"]=str(e)[:330]
          finally:
              os.environ.pop("PROTECTED_ARCHIVE_B64",None)
              if private is not None and private.exists():
                  changed_owner=subprocess.run(["sudo","chown","-R",f"{os.getuid()}:{os.getgid()}",str(private)],
                                                capture_output=True,check=False)
                  if changed_owner.returncode==0:
                      shutil.rmtree(private)
                  else:
                      receipt["cleanup_error"]="PROTECTED_CHOWN_REPAIR_FAILED"
              receipt["tmpfs_cleanup_verified"]=private is not None and not private.exists()
              if not receipt["tmpfs_cleanup_verified"]:
                  receipt["status"]="HOLD_PRIVATE_SCRATCH_NOT_CLEANED"
              (out/"p05_negative_receipt.json").write_text(json.dumps(receipt,sort_keys=True,indent=2)+"\n")
              print("P05_NEGATIVES",receipt["status"],"COUNT",receipt["native_expected_rejections"],"/16",
                    "SOURCE_HEAD",receipt["source_head"],"BINARY_SHA",receipt["binary_sha256"],
                    "PRIVATE_CLEANUP",receipt["tmpfs_cleanup_verified"])
          sys.exit(0 if receipt["status"]=="PASS_16_INTENDED_NATIVE_REJECTIONS" else 1)
