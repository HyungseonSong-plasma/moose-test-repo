name: Issue652 G6B PublicD100 input-contract P0 (branch-only)
on:
  push:
    branches:
      - issue-652-poisson-g6b-publicd100-preflight-20261123
    paths:
      - .github/workflows/issue652-g6b-publicd100-p0-once.yml
permissions:
  contents: read
concurrency:
  group: issue652-g6b-publicd100-preflight
  cancel-in-progress: false
jobs:
  public-d-100row-exact-head-p0:
    name: Public D 100-row + 100us time grid P0 (no Native run)
    if: github.repository == 'HyungseonSong-plasma/moose-test-repo'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify SHA identity and repository path restrictions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git branch --show-current)" = "issue-652-poisson-g6b-publicd100-preflight-20261123"
          git diff --quiet
          python3 -m py_compile ci/guards/issue652_g6b_publicd100_stage.py \
            tests/test_issue652_poisson_g6b_publicd100.py
          echo G6B_SOURCE_AND_PYTHON_AST_PASS
      - name: Run only standalone 100-row source and time-grid P0 checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'pytest>=8,<9'
          python3 -m pytest -q tests/test_issue652_poisson_g6b_publicd100.py
          echo G6B_PUBLIC_D_100ROW_100US_TIMEGRID_P0_PASS
      - name: Record bounded scope
        shell: bash
        run: |
          printf '%s\n' \
            'G6B_P0=PASS_ONLY_IF_PREVIOUS_STEPS_PASSED' \
            'S6_417_941_100US_NATIVE=NOT_RUN' \
            'G6B_SCIENTIFIC_PARITY=HOLD' \
            'NO_PROTECTED_EI_RATE_INPUTS' \
            'NO_MAIN_MERGE'
