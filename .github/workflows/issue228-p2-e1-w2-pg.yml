name: Issue-228 P2 E1 W2 PG discriminator campaign

on:
  push:
    branches: [issue-228-p2-e1-w2-pg]
    paths:
      - '.github/workflows/issue228-p2-e1-w2-pg.yml'
      - 'experiments/Issue228_p2_e1_w2_pg/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: issue228-p2-e1-w2-pg-${{ github.sha }}
  cancel-in-progress: false

env:
  BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
  MOOSE_SHA: 9f388366ccf38b9c34542ec5561198249fde0ac9
  CRANE_SHA: ba26970cf419dcac563a20ed7079d445bc6341c3
  SQUIRREL_SHA: 16a26d504f3ee11161a86d4e3ebf3c0e5f2afbb1
  ZAPDOS_SHA: 9eceffbc46048c3760bbfa9a7f1ca681ae35af1d

jobs:
  fe-coupled:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        mode: [fe_baseline, fe_wafer_matched, fe_right_matched]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify provenance and pinned image
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          source physics_app/dependencies.lock
          test "$MOOSE" = "$MOOSE_SHA"
          test "$CRANE" = "$CRANE_SHA"
          test "$SQUIRREL" = "$SQUIRREL_SHA"
          test "$ZAPDOS" = "$ZAPDOS_SHA"
          docker pull "$BUILD_BASE_REF"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.moose.sha" }}')" = "$MOOSE_SHA"
      - name: Coupled FV transport plus FE Poisson ${{ matrix.mode }}
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euxo pipefail
          RESULTS="issue228-next-${MODE}-results"
          rm -rf "$RESULTS"
          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace \
            -e GITHUB_SHA="$GITHUB_SHA" -e MODE="$MODE" \
            -v "$PWD:/workspace" "$BUILD_BASE_REF" -lc '
              set -euxo pipefail
              source /environment
              export PYTHONPATH=/workspace
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt
              git config --global --add safe.directory /workspace
              uv pip install --system --python "$(command -v python3)" -r requirements-evidence-engine.txt
              uv pip install --system --python "$(command -v python3)" scipy
              python3 -m py_compile experiments/Issue228_p2_e1_w2_pg/run.py
              python3 experiments/Issue228_p2_e1_w2_pg/run.py fe --mode fe_baseline --physics-opt /bin/true --results-root /tmp/r228-self --self-test
              make -C physics_app -j2
              test -x physics_app/physics-opt
              python3 experiments/Issue228_p2_e1_w2_pg/run.py fe \
                --mode "$MODE" \
                --physics-opt physics_app/physics-opt \
                --results-root "issue228-next-${MODE}-results" \
                --timeout 1800
            '
      - name: Upload FE coupled evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue228-next-${{ matrix.mode }}
          path: issue228-next-${{ matrix.mode }}-results
          if-no-files-found: error
          retention-days: 7

  e1-av-balance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: h0500um
            h_m: 0.0005
          - name: h1000um
            h_m: 0.001
          - name: h2000um
            h_m: 0.002
          - name: h3000um
            h_m: 0.003
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run orthogonal one-cell A/V balance ${{ matrix.name }}
        shell: bash
        env:
          CASE_NAME: ${{ matrix.name }}
          H_M: ${{ matrix.h_m }}
        run: |
          set -euxo pipefail
          docker pull "$BUILD_BASE_REF"
          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace \
            -e CASE_NAME="$CASE_NAME" -e H_M="$H_M" \
            -v "$PWD:/workspace" "$BUILD_BASE_REF" -lc '
              set -euxo pipefail
              source /environment
              export PYTHONPATH=/workspace
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt
              uv pip install --system --python "$(command -v python3)" -r requirements-evidence-engine.txt
              uv pip install --system --python "$(command -v python3)" scipy
              make -C physics_app -j2
              python3 experiments/Issue228_p2_e1_w2_pg/run.py e1 \
                --h-m "$H_M" \
                --physics-opt physics_app/physics-opt \
                --results-root "issue228-next-e1-${CASE_NAME}-results"
            '
      - name: Upload E1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue228-next-e1-${{ matrix.name }}
          path: issue228-next-e1-${{ matrix.name }}-results
          if-no-files-found: error
          retention-days: 7

  w2-frozen-fv:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: f000
            fraction: 0.0
          - name: f025
            fraction: 0.25
          - name: f050
            fraction: 0.5
          - name: f075
            fraction: 0.75
          - name: f100
            fraction: 1.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download governed step-10 baseline snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p snapshot
          gh run download 34949699566 -n issue228-pgw-baseline-snapshot -D snapshot
          test -f snapshot/summary.json
          test -f snapshot/case/input_out.e
      - name: Frozen FV wall-charge suppression ${{ matrix.name }}
        shell: bash
        env:
          CASE_NAME: ${{ matrix.name }}
          FRACTION: ${{ matrix.fraction }}
        run: |
          set -euxo pipefail
          docker pull "$BUILD_BASE_REF"
          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace \
            -e CASE_NAME="$CASE_NAME" -e FRACTION="$FRACTION" \
            -v "$PWD:/workspace" "$BUILD_BASE_REF" -lc '
              set -euxo pipefail
              source /environment
              export PYTHONPATH=/workspace
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt
              uv pip install --system --python "$(command -v python3)" -r requirements-evidence-engine.txt
              uv pip install --system --python "$(command -v python3)" scipy
              make -C physics_app -j2
              python3 experiments/Issue228_p2_e1_w2_pg/run.py w2 \
                --suppression-fraction "$FRACTION" \
                --snapshot-root snapshot \
                --physics-opt physics_app/physics-opt \
                --results-root "issue228-next-w2-${CASE_NAME}-results"
            '
      - name: Upload W2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue228-next-w2-${{ matrix.name }}
          path: issue228-next-w2-${{ matrix.name }}-results
          if-no-files-found: error
          retention-days: 7
