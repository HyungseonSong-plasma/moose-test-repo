# Separate-run genuine MOOSE recovery of preserved 2ns checkpoint to 4ns.
# Scientific hold: a 4ns terminal time and checkpoint do not validate full oxygen chemistry.
name: Issue419 Oxygen24 cross-run 2ns to 4ns checkpoint once
run-name: Oxygen24 cross-run 2ns to 4ns ${{ github.sha }}
on:
  push:
    branches: [issue-419-oxygen24-4ns-to-100ns-20261031]
    paths: [.github/workflows/issue419-oxygen24-crossrun-4ns-once.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: issue419-oxygen24-crossrun-4ns-once
  cancel-in-progress: false

jobs:
  private-rate-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check private 19-table rate secret availability
        env:
          PRIVATE_RATES_B64: ${{ secrets.OXYGEN24_RATES_TAR_XZ_B64 }}
        run: |
          test -n "$PRIVATE_RATES_B64" || { echo "::error::Missing authorized private rate input"; exit 22; }
          echo "OXYGEN24_PRIVATE_RATE_SECRET_PRESENT=YES"

  restore-and-recover:
    needs: private-rate-gate
    name: Separate-run real PhysicsApp ${{ matrix.power_w }}W 2ns to 4ns
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        power_w: [400, 1000]
    env:
      CHATGPT_WORK_BASE_SHA: ${{ github.sha }}
      SOURCE_RUN_ID: '41193613390'
      SOURCE_SHA: '070ef30b81d1be0acf0751188f080082118269ea'
      POWER_W: ${{ matrix.power_w }}
      OXYGEN_RESEARCH_400: '1'
      OXYGEN_RESEARCH_FULL24: '1'
      OXYGEN_RESEARCH_QUICK_5MIN: '1'
      OXYGEN_RESEARCH_RATE_DIR: /tmp/oxygen24/private_rates
      PWD_IN_RUNNER: ${{ github.workspace }}
    steps:
      - name: Checkout exact replay source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify source and physics lineage
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CHATGPT_WORK_BASE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          git diff --exit-code "$SOURCE_SHA" HEAD -- physics_app experiments/Issue395_powered_chemistry_ladder
          test ! -e experiments/Issue395_powered_chemistry_ladder/private_rates
          echo "SOURCE_RUN_ID=$SOURCE_RUN_ID SOURCE_SHA=$SOURCE_SHA REPLAY_SHA=$CHATGPT_WORK_BASE_SHA"

      - name: Download 2ns checkpoint artifact from earlier Actions run
        uses: actions/download-artifact@v4
        with:
          name: oxygen24-real-checkpoint-restart-${{ matrix.power_w }}W
          run-id: 41193613390
          repository: HyungseonSong-plasma/moose-test-repo
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/oxygen24-2ns-parent

      - name: Verify exact source artifact paths
        run: |
          set -euo pipefail
          CHEM=experiments/Issue395_powered_chemistry_ladder
          RESULT="$CHEM/results_rf_elastic_diss_ion_ei20_ei01_${POWER_W}w_adjacent_sheath_wall_closed_100us_dt1000ns"
          INPUT="$CHEM/rf_elastic_diss_ion_ei20_ei01_${POWER_W}w_adjacent_sheath_wall_closed_100us_dt1000ns.i"
          SOURCE_DIR="$RUNNER_TEMP/oxygen24-2ns-parent/$RESULT"
          for f in checkpoint_2ns.tar.gz checkpoint_2ns.tar.gz.sha256 checkpoint_2ns_manifest.json first_2ns.csv input_2ns_checkpoint.i; do
            test -s "$SOURCE_DIR/$f" || { echo "::error::Required 2ns source artifact missing: $f"; exit 2; }
          done
          python3 "$CHEM/oxygen24_checkpoint_restart.py" --verify-first "$SOURCE_DIR/first_2ns.csv" --power-w "$POWER_W"
          echo "CHEM=$CHEM" >> "$GITHUB_ENV"
          echo "RESULT=$RESULT" >> "$GITHUB_ENV"
          echo "INPUT=$INPUT" >> "$GITHUB_ENV"
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          echo "OXYGEN24_PREVIOUS_RUN_2NS_ARTIFACT_PASS=$POWER_W"

      - name: Restore and validate authorized private 19 rate tables
        env:
          PRIVATE_RATES_B64: ${{ secrets.OXYGEN24_RATES_TAR_XZ_B64 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$OXYGEN_RESEARCH_RATE_DIR"
          printf '%s' "$PRIVATE_RATES_B64" | base64 --decode | tar -xJ -C "$OXYGEN_RESEARCH_RATE_DIR" --no-same-owner
          python3 - <<'PY'
          import importlib.util, os
          from pathlib import Path
          src=Path("experiments/Issue395_powered_chemistry_ladder/build_oxygen_24_source_overlay.py")
          spec=importlib.util.spec_from_file_location("chem24", src)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          rates=module.validate_files(Path(os.environ["OXYGEN_RESEARCH_RATE_DIR"]))
          assert len(rates)==19 and set(rates)==set(module.LOOKUP_IDS)
          assert module.validate_network()["atoms_charge_mass"]=="PASS"
          print("OXYGEN24_PRIVATE_RATE_SET_VALIDATED")
          PY

      - name: P0 run replay and checkpoint preflight checks
        run: |
          set -euo pipefail
          python3 -m venv .issue419-4ns-venv
          .issue419-4ns-venv/bin/python -m pip install --disable-pip-version-check --quiet 'pytest>=8,<9' numpy==2.1.2 scipy==1.14.1
          .issue419-4ns-venv/bin/python -m pytest -q             tests/test_issue395_oxygen_full24_source_overlay.py             tests/test_issue395_oxygen_full24_seeds.py             tests/test_issue395_oxygen_full24_smoke_timegrid.py             tests/test_issue395_oxygen_full24_wall_sticking.py             tests/test_issue395_receiver_200sccm_inlet.py
          python3 "$CHEM/oxygen24_checkpoint_restart.py" --self-test
          bash -n "$CHEM/oxygen24_resume_native.sh"
          bash -n "$CHEM/issue397_l1_power_scan_replay.sh"

      - name: P0 regenerate identical 2ns input and extend to 4ns
        run: |
          set -euo pipefail
          source .issue419-4ns-venv/bin/activate
          bash "$CHEM/issue397_l1_power_scan_replay.sh" prepare "$POWER_W"
          python3 "$CHEM/oxygen24_checkpoint_restart.py" --enable-checkpoint "$INPUT"
          cmp "$SOURCE_DIR/input_2ns_checkpoint.i" "$INPUT" || {
            echo "::error::2ns input does not match archived original"; exit 3;
          }
          python3 "$CHEM/oxygen24_checkpoint_restart.py" --extend "$INPUT"
          cp "$SOURCE_DIR/first_2ns.csv" "$RESULT/first_2ns.csv"
          echo "OXYGEN24_EXACT_INITIAL_INPUT_AND_4NS_GRID_PASS=$POWER_W"

      - name: P1 build exact-source real physics-opt
        run: |
          set -euo pipefail
          bash "$CHEM/issue397_l1_power_scan_replay.sh" build "$POWER_W"

      - name: P2 production 4ns input check
        run: |
          set -euo pipefail
          bash "$CHEM/issue397_l1_power_scan_replay.sh" check "$POWER_W"

      - name: Restore original genuine 2ns checkpoint only after prepare
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, tarfile
          from pathlib import Path
          import sys
          chem=Path(os.environ["CHEM"])
          sys.path.insert(0,str(chem.resolve()))
          from oxygen24_checkpoint_restart import checkpoint_manifest
          src=Path(os.environ["SOURCE_DIR"])
          dest=Path(os.environ["RESULT"])/"run"
          archive=src/"checkpoint_2ns.tar.gz"
          assert dest.is_dir()
          sha_line=(src/"checkpoint_2ns.tar.gz.sha256").read_text().strip().split()
          assert len(sha_line)==2 and Path(sha_line[1]).name==archive.name
          actual=hashlib.sha256(archive.read_bytes()).hexdigest()
          assert actual==sha_line[0], "2ns source archive SHA256 mismatch"
          with tarfile.open(archive,"r:gz") as tar:
              members=tar.getmembers()
              assert members
              for item in members:
                  parts=Path(item.name).parts
                  assert parts and parts[0]=="plasma_cp" and ".." not in parts and not item.name.startswith("/")
                  assert not item.issym() and not item.islnk(), "unexpected archived symlink"
              tar.extractall(dest, filter="data")
          checkpoint=dest/"plasma_cp"
          reference=json.loads((src/"checkpoint_2ns_manifest.json").read_text())
          observed=checkpoint_manifest(checkpoint)
          assert reference["files"]==observed["files"], "2ns checkpoint member/hash inventory mismatch"
          assert (checkpoint/"0002-restart-0.rd/data").is_file()
          assert (checkpoint/"0002-mesh.cpa.gz/1/header.gz").is_file()
          (Path(os.environ["RESULT"])/"source_artifact_verification.json").write_text(
              json.dumps({"source_run_id":os.environ["SOURCE_RUN_ID"],"source_sha":os.environ["SOURCE_SHA"],
                          "power_w":int(os.environ["POWER_W"]),"archive_sha256":actual,
                          "checkpoint_members":len(observed["files"]),"checkpoint_source":"2ns genuine MOOSE"},indent=2)+"\n")
          print("OXYGEN24_CROSS_RUN_2NS_CHECKPOINT_RESTORED_AND_HASH_VERIFIED")
          PY

      - name: P2b remove unavailable prior-run Exodus append dependency only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          script=Path(os.environ["CHEM"])/"oxygen24_resume_native.sh"
          source=script.read_text(encoding="utf-8")
          needle="      --recover "
          assert source.count(needle)==1, "native --recover invocation not unique"
          # Original run archived the complete MOOSE checkpoint, but NOT
          # plasma.e. Recovery would otherwise attempt to append an absent
          # Exodus file. Suppress Exodus output only; preserve CSV, checkpoint,
          # exact solver input, chemistry, and native --recover identity.
          patched=source.replace(needle,"      Outputs/exodus=false "+chr(92)+"\n"+needle)
          assert patched.replace("      Outputs/exodus=false "+chr(92)+"\n","")==source
          dest=Path(os.environ["RUNNER_TEMP"])/"oxygen24_crossrun_no_exodus.sh"
          dest.write_text(patched,encoding="utf-8")
          print("OXYGEN24_EXODUS_OUTPUT_ONLY_RESTART_OVERRIDE_PASS", dest)
          PY
          bash -n "$RUNNER_TEMP/oxygen24_crossrun_no_exodus.sh"

      - name: P3 native 2ns to 4ns recovery with generous 4h wall-time cap
        run: |
          set -euo pipefail
          started="$(date +%s)"
          set +e
          timeout -s TERM -k 60s 14400s bash "$RUNNER_TEMP/oxygen24_crossrun_no_exodus.sh" "$POWER_W"
          code="$?"
          set -e
          elapsed=$(( $(date +%s) - started ))
          printf 'source_run_id=%s\nsource_sha=%s\nreplay_sha=%s\nrecovery_seconds=%s\nrecovery_exit_code=%s\n'             "$SOURCE_RUN_ID" "$SOURCE_SHA" "$CHATGPT_WORK_BASE_SHA" "$elapsed" "$code" > "$RESULT/cross_run_status.txt"
          echo "OXYGEN24_CROSS_RUN_RECOVERY_SECONDS=$elapsed CODE=$code POWER_W=$POWER_W"
          test "$code" -eq 0

      - name: P4 verify 4ns endpoint and final MOOSE checkpoint
        run: |
          set -euo pipefail
          python3 "$CHEM/oxygen24_checkpoint_restart.py"             --verify-restart "$RESULT/run/plasma.csv" --first-csv "$RESULT/first_2ns.csv"             --power-w "$POWER_W" --log "$RESULT/recovery_runtime.log"             --manifest "$RESULT/recovery_2ns_to_4ns_evidence.json"
          python3 - <<'PY'
          import json, math, os, re, sys
          from pathlib import Path
          chem=Path(os.environ["CHEM"])
          sys.path.insert(0,str(chem.resolve()))
          from oxygen24_checkpoint_restart import checkpoint_manifest
          result=Path(os.environ["RESULT"])
          checkpoint=result/"run/plasma_cp"
          text=(result/"recovery_runtime.log").read_text(errors="replace")
          assert re.search(r"Using\s+\S*/plasma_cp/0002\s+for recovery",text), "exact MOOSE 2ns recover evidence missing"
          steps=re.findall(r"Time Step\s+(\d+),\s*time\s*=\s*([0-9.eE+-]+)",text)
          assert steps, "native MOOSE timestep trace missing"
          final=[int(i) for i,t in steps if math.isclose(float(t),4e-9,rel_tol=1e-10,abs_tol=1e-16)]
          assert final, "no actual MOOSE time step at 4ns"
          last_step=max(final)
          data=checkpoint/f"{last_step:04d}-restart-0.rd/data"
          header=checkpoint/f"{last_step:04d}-restart-0.rd/header"
          mesh=checkpoint/f"{last_step:04d}-mesh.cpa.gz/1/header.gz"
          assert all(p.is_file() and p.stat().st_size>0 for p in (data,header,mesh)), (
              "MOOSE 4ns endpoint checkpoint absent or incomplete",last_step)
          manifest=checkpoint_manifest(checkpoint)
          manifest.update({"power_w":int(os.environ["POWER_W"]),"physical_final_time_s":4e-9,
                           "m oose_final_step".replace(" ",""):last_step,
                           "source_run_id":os.environ["SOURCE_RUN_ID"],
                           "source_sha":os.environ["SOURCE_SHA"],
                           "replay_sha":os.environ["CHATGPT_WORK_BASE_SHA"]})
          (result/"checkpoint_4ns_manifest.json").write_text(json.dumps(manifest,indent=2)+"\n")
          print("OXYGEN24_CROSS_RUN_REAL_4NS_CHECKPOINT_VERIFIED",last_step,len(manifest["files"]))
          PY

      - name: Package SHA256-pinned 4ns checkpoint for later 4ns to 100ns run
        run: |
          set -euo pipefail
          tar -czf "$RESULT/checkpoint_4ns.tar.gz" -C "$RESULT/run" plasma_cp
          tar -tzf "$RESULT/checkpoint_4ns.tar.gz" > "$RESULT/checkpoint_4ns_listing.txt"
          grep -q '^plasma_cp/' "$RESULT/checkpoint_4ns_listing.txt"
          sha256sum "$RESULT/checkpoint_4ns.tar.gz" > "$RESULT/checkpoint_4ns.tar.gz.sha256"
          echo "OXYGEN24_4NS_CHECKPOINT_ARTIFACT_READY=$POWER_W"

      - name: Upload verified 4ns checkpoint for a separate future CI run
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: oxygen24-4ns-checkpoint-${{ matrix.power_w }}W
          if-no-files-found: error
          retention-days: 90
          path: |
            ${{ env.RESULT }}/checkpoint_4ns.tar.gz
            ${{ env.RESULT }}/checkpoint_4ns.tar.gz.sha256
            ${{ env.RESULT }}/checkpoint_4ns_listing.txt
            ${{ env.RESULT }}/checkpoint_4ns_manifest.json
            ${{ env.RESULT }}/source_artifact_verification.json
            ${{ env.RESULT }}/cross_run_status.txt
            ${{ env.RESULT }}/first_2ns.csv
            ${{ env.RESULT }}/recovery_2ns_to_4ns_evidence.json
            ${{ env.RESULT }}/recovery_runtime.log
            ${{ env.RESULT }}/run/plasma.csv
            ${{ env.INPUT }}

      - name: Upload diagnostic data even if 4ns runtime does not finish
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oxygen24-4ns-diagnostics-${{ matrix.power_w }}W
          if-no-files-found: warn
          retention-days: 21
          path: |
            ${{ env.RESULT }}/source_artifact_verification.json
            ${{ env.RESULT }}/cross_run_status.txt
            ${{ env.RESULT }}/check_input.log
            ${{ env.RESULT }}/recovery_runtime.log
            ${{ env.RESULT }}/run/plasma.csv
            ${{ env.RESULT }}/checkpoint_4ns_manifest.json
