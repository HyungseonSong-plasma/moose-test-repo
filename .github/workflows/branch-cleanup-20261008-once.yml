name: One-shot branch cleanup 2026-10-08

# One-shot trigger: merge this workflow change to main, then self-remove.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/branch-cleanup-20261008-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Run exact-SHA guarded branch cleanup
        run: python3 tools/workflow/branch_cleanup_20261008_once.py
