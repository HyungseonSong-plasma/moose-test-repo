name: Issue670 Poisson RHS actual Native Functor numerical test
on:
  push:
    branches:
      - issue-670-poisson-rhs-numeric-20261118
permissions:
  contents: read
  actions: read
jobs:
  numeric_rhs:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OCI: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
      W1_SOURCE: 05d7ce4eceb81769cb2f0146c51535fc35e74ac1
      INTEGRATION_HEAD: 74a2b0fbeaf411d9c76cb82a69de1629fa55fa7f
    steps:
      - name: Checkout source SHA and verify exact source provenance
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Ensure scientific C++ sources unchanged from pinned W1 binary build
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$INTEGRATION_HEAD" HEAD
          git merge-base --is-ancestor "$W1_SOURCE" HEAD
          test "$(git hash-object experiments/Issue402_plasma_dsl_g1/native/s6_c0_physics_base_no_d1.i)" = 793f3f24bc95bf71d0b2537288cb2ecc8a5f74fa
          python3 - <<'PY'
          import subprocess
          actual=set(subprocess.check_output(['git','diff','--name-only','05d7ce4eceb81769cb2f0146c51535fc35e74ac1','HEAD'],text=True).splitlines())
          expected={'tests/test_issue633_s6_scratch_ion_retirement.py',
                    'ci/check_issue670_poisson_rhs_native_numeric.py',
                    '.github/workflows/issue670-poisson-rhs-numeric-once.yml'}
          assert actual==expected,(actual,expected)
          print('PINNED_W1_SCIENTIFIC_CPLUSPLUS_UNCHANGED',len(actual))
          PY
          python3 -m py_compile ci/check_issue670_poisson_rhs_native_numeric.py
      - name: Prepare five controlled log-molar Native input cases
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/check_issue670_poisson_rhs_native_numeric.py prepare --dir "$RUNNER_TEMP/poisson" > "$RUNNER_TEMP/poisson-prepare.json"
          test "$(find "$RUNNER_TEMP/poisson" -maxdepth 1 -name '*.i' | wc -l)" -eq 5
      - name: Download immutable W1 physics-opt and app libraries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bundle"
          curl --fail --location --silent --show-error --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/14422701532/zip" \
            --output "$RUNNER_TEMP/w1-artifact.zip"
          echo "ce50a51f2ab565b5dc6aced272adcf12f1075f7593417c603ce05274c8291c18  $RUNNER_TEMP/w1-artifact.zip" | sha256sum --check -
          unzip -p "$RUNNER_TEMP/w1-artifact.zip" physics-opt-and-app-libs.tar.gz > "$RUNNER_TEMP/w1-payload.tar.gz"
          echo "705e1f3fa58c4da3c1d76cbca7f2a761045f8f46ee6f54d3391aeaf5ab62033c  $RUNNER_TEMP/w1-payload.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/w1-payload.tar.gz" -C "$RUNNER_TEMP/bundle"
          cd "$RUNNER_TEMP/bundle"
          echo 'cab62a4a9caa4d99a82564f31f915f1a7dc14565607712841123a30276d329bc  physics-opt' | sha256sum --check -
          echo '3274751989604b06e7e7e677435b16c874388a4f7b8735b059eafc605fbb7e51  lib/libphysics-opt.so.0' | sha256sum --check -
          echo '86aa0d4ebe18d731e7e052f5ad62594b1a3b48074f848693b0958f728b61ba80  lib/libphysics_test-opt.so.0' | sha256sum --check -
          test -f physics-opt
          chmod 755 physics-opt
      - name: Run compiled PhysicsApp five numerical Poisson cases in pinned OCI
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$OCI"
          docker run --rm --network none --entrypoint /bin/bash --user 0:0 \
            --mount "type=bind,src=$RUNNER_TEMP/bundle,dst=/bundle,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/poisson,dst=/case" \
            --workdir /case "$OCI" -lc '
              source /environment
              export LD_LIBRARY_PATH="/bundle/lib:${LD_LIBRARY_PATH:-}"
              set -euo pipefail
              for case in balanced O2p_plus Op_plus electron_plus Om_plus; do
                set +e
                /bundle/physics-opt -i "$case.i" > "$case.stdout.log" 2>&1
                rc=$?
                set -e
                printf "%s\n" "$rc" > "$case.exit"
                echo "REAL_CPP_FUNCTOR_CASE=$case EXIT=$rc"
                if [ "$rc" -ne 0 ]; then tail -n 45 "$case.stdout.log"; fi
              done
            '
      - name: Verify actual numeric Functor CSV against independent analytic oracle
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/check_issue670_poisson_rhs_native_numeric.py verify --dir "$RUNNER_TEMP/poisson"
      - name: Archive sanitized numeric values, inputs, logs and SHA receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue670-poisson-rhs-numerical-native-values
          path: |
            ${{ runner.temp }}/poisson
            ${{ runner.temp }}/poisson-prepare.json
          if-no-files-found: warn
          retention-days: 14
