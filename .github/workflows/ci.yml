name: Repository CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

env:
  PHYSICS_RUNTIME_REF: ghcr.io/hyungseonsong-plasma/physics-runtime@sha256:cda9f0d09a17aed5fa606e97d1ee5c3450f7280536cec2e5c635402bb07d972c
  EXPECTED_BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
  EXPECTED_RUNTIME_REVISION: 565b500722c00e4ff6e759a02bd7bae52f8b13f0

jobs:
  validate:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action != 'edited' ||
      github.event.changes.base != null
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate governed workflow surface
        run: |
          python3 ci/guards/workflow_surface_guard.py --self-test
          python3 ci/guards/workflow_surface_guard.py --check
      - name: Regression-test central Skill manifest contract
        run: python3 ci/guards/central_skill_contract_guard.py --self-test
      - name: Validate Paul central operating contracts
        shell: bash
        run: |
          set -euo pipefail
          test ! -e skills
          test ! -e src/chatgpt_operation
          test -f docs/operating_system/README.md
          test -f docs/operating_system/CENTRAL_SKILLS.md
          test -f docs/operating_system/central_skills.json
          grep -Fq '6474eb7b77f890b7cf9d7134ccebea31662bcdbe' docs/operating_system/README.md
          grep -Fq 'Expected OS:** Paul' docs/operating_system/README.md
          grep -Fq '6474eb7b77f890b7cf9d7134ccebea31662bcdbe' docs/operating_system/CENTRAL_SKILLS.md

          # Calvin operating metrics are archive-only under Paul.
          test ! -e docs/metrics
          test ! -e docs/protocols/metrics_closure.md
          test -d archive/operating_metrics/calvin/docs_metrics
          test -f archive/operating_metrics/calvin/metrics_closure.md

          # Executable central actions use the same exact Paul revision.
          grep -Fq 'HyungseonSong-plasma/chatgpt-operation/.github/actions/repository-mutation@6474eb7b77f890b7cf9d7134ccebea31662bcdbe' .github/workflows/refactor.yml
          grep -Fq 'HyungseonSong-plasma/chatgpt-operation/.github/actions/governed-work@6474eb7b77f890b7cf9d7134ccebea31662bcdbe' .github/workflows/refactor.yml
          grep -Fq 'HyungseonSong-plasma/chatgpt-operation/.github/actions/governed-work@6474eb7b77f890b7cf9d7134ccebea31662bcdbe' .github/workflows/experiment.yml

          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest=json.loads(Path("docs/operating_system/central_skills.json").read_text(encoding="utf-8"))
          assert manifest["schema_version"] == 2
          assert manifest["source_repository"] == "HyungseonSong-plasma/chatgpt-operation"
          os_meta=manifest["operating_system"]
          assert os_meta["revision"] == "6474eb7b77f890b7cf9d7134ccebea31662bcdbe"
          assert os_meta["expected_version"] == "Paul"
          assert os_meta["index"] == {
              "path": "docs/operating_system/README.md",
              "expected_blob_sha": "38e5ba53b1440abb7722def876c2a278bae30d9f",
          }
          assert os_meta["essential_rules"] == {
              "path": "docs/operating_system/ESSENTIAL_RULES.md",
              "expected_blob_sha": "adfad6c7acc7b371b5aa840c6fb830ca696e60ac",
          }
          assert manifest["skill_catalog"] == {
              "path": "skills/catalog.json",
              "expected_blob_sha": "8e43eb8a4b8fa334cf6210a638ad25e782d27b90",
          }

          entries={item["name"]: item for item in manifest["skills"]}
          assert set(entries) == {
              "session-bootstrap",
              "state-refresh",
              "repository-mutation",
              "governed-work",
              "controller-throughput",
              "controller-lifecycle",
              "github-actions-execution",
              "github-actions-observation",
              "artifact-staging",
              "scientific-discriminator-controller",
          }
          for item in entries.values():
              assert item["revision"] == "6474eb7b77f890b7cf9d7134ccebea31662bcdbe"
          assert entries["session-bootstrap"]["load_on"] == ["INIT"]
          assert entries["state-refresh"]["load_on"] == ["INIT","SCHEDULED_CONTROLLER"]
          assert entries["repository-mutation"]["load_on"] == ["MUTATE"]
          assert entries["governed-work"]["load_on"] == ["GOVERNED_WORK"]
          assert entries["controller-throughput"]["load_on"] == ["SCHEDULED_CONTROLLER"]
          assert entries["controller-lifecycle"]["load_on"] == ["SCHEDULED_CONTROLLER"]
          assert entries["github-actions-execution"]["load_on"] == ["GITHUB_ACTIONS_EXECUTION"]
          assert entries["github-actions-observation"]["load_on"] == ["GITHUB_ACTIONS_OBSERVATION"]
          assert entries["artifact-staging"]["load_on"] == ["ARTIFACT_STAGING"]
          assert entries["scientific-discriminator-controller"]["load_on"] == ["SCIENTIFIC_DISCRIMINATOR_CONTROLLER"]

          policy=json.loads(Path(".chatgpt-operation.json").read_text(encoding="utf-8"))
          assert policy["schema_version"] == 1
          assert policy["repository"] == "HyungseonSong-plasma/moose-test-repo"
          assert policy["validation_gate"]["mode"] == "named_workflows"
          assert "Repository CI" in policy["validation_gate"]["workflows"]
          PY

          central_dir="$(mktemp -d)"
          git -C "$central_dir" init -q
          git -C "$central_dir" remote add origin https://github.com/HyungseonSong-plasma/chatgpt-operation.git
          git -C "$central_dir" fetch --quiet --depth=1 origin "6474eb7b77f890b7cf9d7134ccebea31662bcdbe"
          CENTRAL_DIR="$central_dir" python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          manifest=json.loads(Path("docs/operating_system/central_skills.json").read_text(encoding="utf-8"))
          root=os.environ["CENTRAL_DIR"]
          revision=manifest["operating_system"]["revision"]

          expected=[
              manifest["operating_system"]["index"],
              manifest["operating_system"]["essential_rules"],
              manifest["skill_catalog"],
          ]
          expected += [
              {"path": item["path"], "expected_blob_sha": item["expected_blob_sha"]}
              for item in manifest["skills"]
          ]

          for item in expected:
              actual=subprocess.check_output(
                  ["git","-C",root,"rev-parse",f'{revision}:{item["path"]}'],
                  text=True,
              ).strip()
              assert actual == item["expected_blob_sha"], (
                  item["path"], item["expected_blob_sha"], actual
              )
          PY
          rm -rf "$central_dir"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependencies
        run: >-
          python -m pip install
          'pydantic>=2,<3'
          'pytest>=8,<9'
          -r requirements-evidence-engine.txt
          -r requirements-ontology.txt
      - name: Validate Evidence dependency direction
        run: python ci/guards/physics_dependency_guard.py --check evidence
      - name: Validate Analysis dependency direction
        run: python ci/guards/physics_dependency_guard.py --check analysis
      - name: Validate Execution dependency direction
        run: python ci/guards/physics_dependency_guard.py --check execution
      - name: Validate presentation dependency direction
        run: python ci/guards/physics_dependency_guard.py --check presentation
      - name: Validate repository-tool dependency direction
        run: python ci/guards/physics_dependency_guard.py --check repository
      - name: Validate canonical package cycles
        run: python ci/guards/physics_dependency_guard.py --check cycle
      - name: Validate declarative experiment gateway
        run: python ci/guards/physics_experiment_gateway_guard.py
      - name: Validate plasma semantic ownership
        run: python ci/guards/physics_plasma_semantic_residue_guard.py
      - name: Validate campaign/performance/scale ownership
        run: python ci/guards/physics_campaign_residue_guard.py
      - name: Validate numerical-method ownership
        run: python ci/guards/physics_numerical_method_ownership_guard.py
      - name: Validate model terminology and MOOSE boundary ownership
        run: python ci/guards/physics_boundary_terminology_guard.py
      - name: Validate Physics to SOL adapter boundary
        run: |
          python ci/guards/physics_sol_adapter_boundary_guard.py --self-test
          python ci/guards/physics_sol_adapter_boundary_guard.py --check
      - name: Validate strict zero-legacy architecture census
        run: |
          python ci/guards/physics_architecture_census.py --json-out physics-architecture-census.json
          python ci/guards/physics_architecture_census.py --require-no-legacy
      - name: Validate zero-legacy active CI surface
        run: python ci/guards/physics_public_artifact_residue_guard.py
      - name: Upload architecture census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics-architecture-census
          path: physics-architecture-census.json
      - name: Upload migration source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics-migration-source
          path: |
            physics_harness/**/*.py
            experiments/**/*.py
            tests/**/*.py
          retention-days: 1
      - name: Run Physics pytest
        run: python -m pytest -q
      - name: Validate #17 R1 EI01 attachment source contract
        run: python physics_app/ci/check_ei01_attachment_source_contract.py
      - name: Validate #17 R2 O2 ionization lookup and ownership contract
        run: python physics_app/ci/check_r2_o2_ionization_contract.py
      - name: Validate #176 R3 O2s excitation constant-surrogate ownership contract
        run: python physics_app/ci/check_r3_o2s_excitation_contract.py
      - name: Validate #26 E8 EI10 inelastic energy ownership contract
        run: python physics_app/ci/check_e8_ei10_energy_contract.py
      - name: Validate #26 E8 EI10 inelastic energy production implementation
        run: python physics_app/ci/check_e8_ei10_energy_implementation.py
      - name: Validate #26 E8 EI10 runtime discriminator logic
        run: python physics_app/ci/check_e8_ei10_energy_runtime.py --self-test
      - name: Validate #26 E8 EI16 ionization energy ownership contract
        run: python physics_app/ci/check_e8_ei16_energy_contract.py
      - name: Validate #26 E8 EI16 runtime discriminator logic
        run: python physics_app/ci/check_e8_ei16_energy_runtime.py --self-test
      - name: Validate #176 R3 O2s excitation production implementation
        run: python physics_app/ci/check_r3_o2s_excitation_implementation.py
      - name: Validate #17 R2 O2 ionization production implementation
        run: python physics_app/ci/check_r2_o2_ionization_implementation.py
      - name: Validate canonical electron molar representation contract
        run: |
          python physics_app/ci/check_electron_molar_representation_contract.py --self-test
          python physics_app/ci/check_electron_molar_representation_contract.py
      - name: Validate Issue 43/45 science refactor
        run: python experiments/Issue43_45_science_refactor/final_guard.py
      - name: Validate Issue 89 post-science canonicalization
        run: python experiments/Issue89_post_science_canonicalization/final_guard.py
      - name: Validate execution contract refactor
        run: python experiments/execution_contract_refactor/guard.py

  runtime-smoke:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action != 'edited' ||
      github.event.changes.base != null
    name: Public immutable Physics runtime smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate accepted immutable runtime ref
        shell: bash
        run: |
          set -euxo pipefail
          [[ "$PHYSICS_RUNTIME_REF" =~ ^ghcr\.io/hyungseonsong-plasma/physics-runtime@sha256:[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_BUILD_BASE_REF" =~ ^ghcr\.io/hyungseonsong-plasma/physics-build-base@sha256:[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_RUNTIME_REVISION" =~ ^[0-9a-f]{40}$ ]]
      - name: Pull accepted public Physics runtime without package credentials
        id: pull
        shell: bash
        run: |
          set -euxo pipefail
          start="$(date +%s)"
          docker pull "$PHYSICS_RUNTIME_REF"
          end="$(date +%s)"
          echo "pull_seconds=$((end - start))" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$(docker image inspect "$PHYSICS_RUNTIME_REF" --format '{{.Size}}')" >> "$GITHUB_OUTPUT"
      - name: Verify accepted runtime provenance
        shell: bash
        run: |
          set -euxo pipefail
          test "$(docker image inspect "$PHYSICS_RUNTIME_REF" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$EXPECTED_RUNTIME_REVISION"
          test "$(docker image inspect "$PHYSICS_RUNTIME_REF" --format '{{ index .Config.Labels "io.physics.build-base.ref" }}')" = "$EXPECTED_BUILD_BASE_REF"
          test "$(docker image inspect "$PHYSICS_RUNTIME_REF" --format '{{ index .Config.Labels "io.physics.source.owner" }}')" = "moose-test-repo/physics_app"
      - name: Run Physics check-input smoke
        shell: bash
        run: docker run --rm "$PHYSICS_RUNTIME_REF" --check-input -i /opt/physics/ci/smoke.i
      - name: Run bounded real Physics smoke
        shell: bash
        run: docker run --rm "$PHYSICS_RUNTIME_REF" -i /opt/physics/ci/smoke.i
      - name: Record ordinary CI runtime evidence
        shell: bash
        run: |
          {
            echo "PHYSICS_RUNTIME_REF=$PHYSICS_RUNTIME_REF"
            echo "RUNTIME_PULL_SECONDS=${{ steps.pull.outputs.pull_seconds }}"
            echo "RUNTIME_LOCAL_SIZE_BYTES=${{ steps.pull.outputs.size_bytes }}"
            echo "ORDINARY_CI_USES_PHYSICS_RUNTIME=true"
            echo "ORDINARY_CI_USES_RETIRED_RUNTIME=false"
            echo "ORDINARY_CI_PULLS_MOOSE_DEV=false"
            echo "ORDINARY_CI_PULLS_PHYSICS_BUILD_BASE=false"
            echo "ORDINARY_CI_REBUILDS_MOOSE_STACK=false"
            echo "ORDINARY_CI_COMPILES_PHYSICS_APPLICATION=false"
          }
