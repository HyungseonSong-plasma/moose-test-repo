          test ! -e issue541_arch_p2_scratch
          mkdir issue541_arch_p2_scratch issue541_arch_p2_logs
          python3 - <<'PY'
          import json, pathlib, shutil
          scratch=pathlib.Path('issue541_arch_p2_scratch')
          original=pathlib.Path('physics_app/ci/dd_plasma_boundary_json_p2.json')
          d=json.loads(original.read_text())
          assert d['species']['e']['initial_number_density'] > 0
          assert d['species']['e']['energy_transport_coef'] == 'fluid'
          assert d['boundaries']['left']['bcs'] and d['boundaries']['bottom']['bcs']
          del d['species']['e']['initial_number_density']
          (scratch/'dd_plasma_boundary_json_p2.json').write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          shutil.copyfile('physics_app/ci/dd_plasma_boundary_json_p3_smoke.i',scratch/'input.i')
          assert 'num_steps = 2' in (scratch/'input.i').read_text()
          PY
          echo ISSUE541_ARCH_DD_P2_FIXTURE_PREPARED
      - name: Build pinned exact-source Native and assert both DD P2 outcomes
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$OCI"
          docker run --rm --network none --entrypoint /bin/bash --user 0:0 \
            --workdir /workspace -v "$PWD:/workspace" "$OCI" -lc '
              set -euo pipefail
              source /environment
              git config --global --add safe.directory /workspace
