# Issue359 RZ-only rerun marker 2026-10-02
name: Repository CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PHYSICS_RUNTIME_REF: ghcr.io/hyungseonsong-plasma/physics-runtime@sha256:cda9f0d09a17aed5fa606e97d1ee5c3450f7280536cec2e5c635402bb07d972c
  EXPECTED_BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
  EXPECTED_RUNTIME_REVISION: 565b500722c00e4ff6e759a02bd7bae52f8b13f0

jobs:
  electron-energy-wall-flux-comparison:
    if: github.event_name == 'pull_request' && github.head_ref == 'issue-359-qualified-gummel-icp'
    name: Electron energy wall flux comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      CASE_DIR: experiments/2d-icp-electron-diffusion-energy-experiment
      POISSON_DIR: experiments/2d-icp-poisson-experiment
      BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Validate catalog and configurable wall-flux contract
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python3 bin/physics.py simple-case check
          python3 bin/physics.py simple-case list
          python3 bin/physics.py simple-case show electron-diffusion-experiment
          python3 bin/physics.py simple-case show electron-diffusion-energy-experiment
          python3 bin/physics.py simple-case show poisson
          if python3 bin/physics.py simple-case show 1; then
            echo "numeric simple-case selector unexpectedly accepted" >&2
            exit 1
          fi
          python3 physics_app/ci/check_electron_molar_representation_contract.py --self-test
          python3 physics_app/ci/check_electron_molar_representation_contract.py

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build exact-head Physics runtime
        shell: bash
        run: |
          set -euxo pipefail
          docker pull "$BUILD_BASE_REF"
          docker run --rm \
            --entrypoint /bin/bash \
            --user 0:0 \
            --workdir /workspace \
            -v "$PWD:/workspace" \
            "$BUILD_BASE_REF" \
            -lc '
              set -euxo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory /opt/physics_vendor/moose
              git config --global --add safe.directory /opt/physics_vendor/crane
              git config --global --add safe.directory /opt/physics_vendor/squirrel
              git config --global --add safe.directory /opt/physics_vendor/zapdos
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt
              make -C /workspace/physics_app -j2
              chmod -R a+rwX /workspace/physics_app
            '
          test -x physics_app/physics-opt

      - name: Prepare 2Te and 5over2Te cases
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .ci-electron-energy-wall wall-flux-artifacts
          mkdir -p .ci-electron-energy-wall wall-flux-artifacts

          for spec in "kinetic_4over3 2.0" "matched_5over3 2.5"; do
            set -- $spec
            label="$1"
            factor="$2"
            run_dir=".ci-electron-energy-wall/$label"
            cp -a "$CASE_DIR" "$run_dir"
            python3 "$CASE_DIR/prepare_wall_flux_case.py" \
              "$run_dir/input.i" \
              --energy-factor "$factor"
            mkdir -p "wall-flux-artifacts/electron-energy-wall-$label"
          done

      - name: Run exact-head wall-flux cases
        shell: bash
        run: |
          set -euxo pipefail
          for spec in "kinetic_4over3 2.0" "matched_5over3 2.5"; do
            set -- $spec
            label="$1"
            factor="$2"
            run_dir=".ci-electron-energy-wall/$label"

            docker run --rm \
              --entrypoint /bin/bash \
              --user "$(id -u):$(id -g)" \
              --workdir "/workspace/$run_dir" \
              -v "$PWD:/workspace" \
              "$BUILD_BASE_REF" \
              -lc '
                set -euxo pipefail
                source /environment
                /workspace/physics_app/physics-opt --check-input -i input.i
                /workspace/physics_app/physics-opt -i input.i > runtime.log 2>&1
              '

            (
              cd "$run_dir"
              EXPECTED_DT_S="1.0e-9" \
              EXPECTED_STEPS="4" \
              EXPECTED_END_TIME_S="4.0e-9" \
              EXPECTED_ENERGY_PER_PARTICLE_TE_FACTOR="$factor" \
                python3 check.py | tee checker.log
            )

            cp -a "$run_dir"/. "wall-flux-artifacts/electron-energy-wall-$label/"
          done

      - name: Compare temperature profiles
        shell: bash
        run: |
          set -euxo pipefail
          python3 "$CASE_DIR/check_wall_flux_matrix.py" wall-flux-artifacts

      - name: Run grounded-wall Poisson candidate
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .ci-poisson
          cp -a "$POISSON_DIR" .ci-poisson

          docker run --rm \
            --entrypoint /bin/bash \
            --user "$(id -u):$(id -g)" \
            --workdir /workspace/.ci-poisson \
            -v "$PWD:/workspace" \
            "$BUILD_BASE_REF" \
            -lc '
              set -euxo pipefail
              source /environment
              /workspace/physics_app/physics-opt --check-input -i input.i
              /workspace/physics_app/physics-opt -i input.i > runtime.log 2>&1
            '

          (
            cd .ci-poisson
            python3 check.py | tee checker.log
          )

      - name: Upload Poisson candidate
        uses: actions/upload-artifact@v4
        with:
          name: poisson-candidate
          path: |
            .ci-poisson/input.i
            .ci-poisson/runtime.log
            .ci-poisson/checker.log
            .ci-poisson/poisson.csv
            .ci-poisson/poisson.e
            .ci-poisson/poisson_final_profile_*.csv
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Run Poisson profile boundary discriminator
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .ci-poisson-profile
          mkdir -p .ci-poisson-profile

          python3 - <<'PY'
          from pathlib import Path
          import shutil
          from physics_harness.adapters.moose import parameters as mp

          root = Path(".ci-poisson-profile")
          source = Path("experiments/2d-icp-poisson-experiment")
          all_b = "'inlet outlet plasma_electrode plasma_metal plasma_right plasma_cover plasma_wafer plasma_focus_ring'"
          solid_b = "'plasma_electrode plasma_metal plasma_right plasma_cover plasma_wafer plasma_focus_ring'"

          electron_paths = (
              "FVBCs/electron_thermal_wall_loss",
              "FVBCs/electron_energy_thermal_wall_loss",
              "Postprocessors/electron_wall_particle_rate",
              "Postprocessors/electron_wall_energy_rate_eV_mol_s",
          )
          electro_paths = (
              "FVBCs/phi_grounded_walls",
              "Postprocessors/gauss_flux_reduced",
          )

          cases = {
              "source_solid_walls": (True, False),
              "phi_solid_walls": (False, True),
              "both_solid_walls": (True, True),
          }

          for name, (solid_source, solid_phi) in cases.items():
              dst = root / name
              shutil.copytree(source, dst)
              path = dst / "input.i"
              text = path.read_text()

              if solid_source:
                  for block_path in electron_paths:
                      text = mp.upsert_parameter(text, block_path, "boundary", solid_b)
              if solid_phi:
                  for block_path in electro_paths:
                      text = mp.upsert_parameter(text, block_path, "boundary", solid_b)

              assert mp.get_parameter(text, "Executioner", "dt") == "1.0e-9"
              assert mp.get_parameter(text, "Executioner", "num_steps") == "4"
              expected_source = set(solid_b.strip("'").split() if solid_source else all_b.strip("'").split())
              expected_phi = set(solid_b.strip("'").split() if solid_phi else all_b.strip("'").split())
              assert set(mp.words(mp.get_parameter(text, "FVBCs/electron_thermal_wall_loss", "boundary") or "")) == expected_source
              assert set(mp.words(mp.get_parameter(text, "FVBCs/electron_energy_thermal_wall_loss", "boundary") or "")) == expected_source
              assert set(mp.words(mp.get_parameter(text, "FVBCs/phi_grounded_walls", "boundary") or "")) == expected_phi
              assert "SideSetsAroundSubdomainGenerator" not in text
              assert "plasma_all_ground" not in text
              path.write_text(text)
          PY

          for name in source_solid_walls phi_solid_walls both_solid_walls; do
            run_dir=".ci-poisson-profile/$name"
            docker run --rm \
              --entrypoint /bin/bash \
              --user "$(id -u):$(id -g)" \
              --workdir "/workspace/$run_dir" \
              -v "$PWD:/workspace" \
              "$BUILD_BASE_REF" \
              -lc '
                set -euxo pipefail
                source /environment
                /workspace/physics_app/physics-opt --check-input -i input.i
                /workspace/physics_app/physics-opt -i input.i > runtime.log 2>&1
              '
          done

          python3 - <<'PY'
          from pathlib import Path
          import csv
          import json
          import math

          def final_profile(case_dir):
              matches = sorted(Path(case_dir).glob("poisson_final_profile_*.csv"))
              if not matches:
                  raise SystemExit(f"missing final profile in {case_dir}")
              with matches[-1].open(newline="") as handle:
                  rows = list(csv.DictReader(handle))
              rows.sort(key=lambda row: int(row["id"]))
              return rows

          def stats(rows):
              phi = [float(row["phi"]) for row in rows]
              ne = [float(row["electron_density"]) for row in rows]
              xs = [float(row["x"]) for row in rows]
              ys = [float(row["y"]) for row in rows]
              i_max = max(range(len(phi)), key=phi.__getitem__)
              return {
                  "phi_min_V": min(phi),
                  "phi_max_V": max(phi),
                  "phi_peak_x_m": xs[i_max],
                  "phi_peak_y_m": ys[i_max],
                  "ne_min_m3": min(ne),
                  "ne_max_m3": max(ne),
                  "ne_mean_m3": sum(ne) / len(ne),
              }

          def normalized(values):
              lo, hi = min(values), max(values)
              span = hi - lo
              if span <= 0.0:
                  return [0.0 for _ in values]
              return [(value - lo) / span for value in values]

          baseline = final_profile(".ci-poisson")
          base_phi = [float(row["phi"]) for row in baseline]
          base_norm = normalized(base_phi)
          result = {"canonical": stats(baseline), "comparisons": {}}

          for name in ("source_solid_walls", "phi_solid_walls", "both_solid_walls"):
              rows = final_profile(f".ci-poisson-profile/{name}")
              if [int(r["id"]) for r in rows] != [int(r["id"]) for r in baseline]:
                  raise SystemExit(f"cell identity mismatch for {name}")
              phi = [float(row["phi"]) for row in rows]
              norm = normalized(phi)
              delta = [a - b for a, b in zip(norm, base_norm)]
              rms = math.sqrt(sum(v*v for v in delta) / len(delta))
              max_abs = max(abs(v) for v in delta)
              mean_a = sum(base_phi) / len(base_phi)
              mean_b = sum(phi) / len(phi)
              cov = sum((a-mean_a)*(b-mean_b) for a,b in zip(base_phi,phi))
              va = sum((a-mean_a)**2 for a in base_phi)
              vb = sum((b-mean_b)**2 for b in phi)
              corr = cov / math.sqrt(va*vb)
              result["comparisons"][name] = {
                  **stats(rows),
                  "normalized_phi_rms_vs_canonical": rms,
                  "normalized_phi_linf_vs_canonical": max_abs,
                  "phi_correlation_vs_canonical": corr,
              }

          out = Path(".ci-poisson-profile/profile_boundary_matrix.json")
          out.write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps(result, indent=2))
          PY

      - name: Upload Poisson profile boundary discriminator
        uses: actions/upload-artifact@v4
        with:
          name: poisson-profile-boundary-matrix
          path: |
            .ci-poisson-profile/profile_boundary_matrix.json
            .ci-poisson-profile/source_solid_walls/input.i
            .ci-poisson-profile/source_solid_walls/runtime.log
            .ci-poisson-profile/source_solid_walls/poisson.csv
            .ci-poisson-profile/source_solid_walls/poisson.e
            .ci-poisson-profile/source_solid_walls/poisson_final_profile_*.csv
            .ci-poisson-profile/phi_solid_walls/input.i
            .ci-poisson-profile/phi_solid_walls/runtime.log
            .ci-poisson-profile/phi_solid_walls/poisson.csv
            .ci-poisson-profile/phi_solid_walls/poisson.e
            .ci-poisson-profile/phi_solid_walls/poisson_final_profile_*.csv
            .ci-poisson-profile/both_solid_walls/input.i
            .ci-poisson-profile/both_solid_walls/runtime.log
            .ci-poisson-profile/both_solid_walls/poisson.csv
            .ci-poisson-profile/both_solid_walls/poisson.e
            .ci-poisson-profile/both_solid_walls/poisson_final_profile_*.csv
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30


      - name: Upload kinetic 2Te Exodus
        uses: actions/upload-artifact@v4
        with:
          name: electron-energy-wall-kinetic_4over3
          path: |
            .ci-electron-energy-wall/kinetic_4over3/input.i
            .ci-electron-energy-wall/kinetic_4over3/runtime.log
            .ci-electron-energy-wall/kinetic_4over3/checker.log
            .ci-electron-energy-wall/kinetic_4over3/electron_diffusion.csv
            .ci-electron-energy-wall/kinetic_4over3/electron_diffusion.e
            .ci-electron-energy-wall/kinetic_4over3/electron_diffusion_final_profile_*.csv
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Upload matched 5over3 Exodus
        uses: actions/upload-artifact@v4
        with:
          name: electron-energy-wall-matched_5over3
          path: |
            .ci-electron-energy-wall/matched_5over3/input.i
            .ci-electron-energy-wall/matched_5over3/runtime.log
            .ci-electron-energy-wall/matched_5over3/checker.log
            .ci-electron-energy-wall/matched_5over3/electron_diffusion.csv
            .ci-electron-energy-wall/matched_5over3/electron_diffusion.e
            .ci-electron-energy-wall/matched_5over3/electron_diffusion_final_profile_*.csv
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Upload wall-flux comparison
        uses: actions/upload-artifact@v4
        with:
          name: electron-energy-wall-flux-comparison
          path: |
            wall_flux_comparison.json
            wall_flux_comparison.csv
          if-no-files-found: error
          retention-days: 30
