              grep -Fq "Syntax OK" /workspace/issue541_arch_p2_logs/dd_valid.log
              cd /workspace/issue541_arch_p2_scratch
              set +e
              /workspace/physics_app/physics-opt --check-input -i input.i > /workspace/issue541_arch_p2_logs/dd_missing_ic.log 2>&1
              exit_code=$?
              set -e
              test "$exit_code" -ne 0
