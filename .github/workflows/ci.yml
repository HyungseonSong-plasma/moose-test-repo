# Issue359 RZ-only rerun marker 2026-10-02
name: Repository CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PHYSICS_RUNTIME_REF: ghcr.io/hyungseonsong-plasma/physics-runtime@sha256:cda9f0d09a17aed5fa606e97d1ee5c3450f7280536cec2e5c635402bb07d972c
  EXPECTED_BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
  EXPECTED_RUNTIME_REVISION: 565b500722c00e4ff6e759a02bd7bae52f8b13f0

jobs:
  electron-energy-wall-flux-matrix:
    if: github.event_name == 'pull_request' && github.head_ref == 'issue-359-qualified-gummel-icp'
    name: Electron energy wall flux ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: native_4over3
            mode: native
            energy_per_particle_te_factor: '2.0'
          - label: functor_4over3
            mode: functor
            energy_per_particle_te_factor: '2.0'
          - label: matched_5over3
            mode: functor
            energy_per_particle_te_factor: '2.5'
    env:
      BASELINE_RUNTIME_REF: ghcr.io/hyungseonsong-plasma/physics-jit-runtime@sha256:2460cf70922490b26412345a09a67364e8b32fbd5310cd25efa5415b12486cf3
      BASELINE_PHYSICS_MANIFEST_SHA256: a9654d344e9c60e48992165bc855b154707ecf2e659e4428117e8f6ae8fdba3b
      CASE_DIR: experiments/2d-icp-electron-diffusion-energy-experiment
      RUN_DIR: .ci-electron-energy-wall/${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Prepare controlled wall-flux case
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          rm -rf "$RUN_DIR"
          mkdir -p "$(dirname "$RUN_DIR")"
          cp -a "$CASE_DIR" "$RUN_DIR"
          python3 "$CASE_DIR/prepare_wall_flux_case.py"             "$RUN_DIR/input.i"             --mode "${{ matrix.mode }}"             --energy-factor "${{ matrix.energy_per_particle_te_factor }}"
          grep -E '^  (dt|dtmin|dtmax|num_steps|end_time) = ' "$RUN_DIR/input.i"
          grep -A7 '^  \[electron_energy_thermal_wall_loss\]' "$RUN_DIR/input.i"

          git ls-files -z physics_app             | sort -z             | xargs -0 sha256sum > /tmp/physics-source-file-hashes.txt
          manifest="$(sha256sum /tmp/physics-source-file-hashes.txt | awk '{print $1}')"
          test "$manifest" = "$BASELINE_PHYSICS_MANIFEST_SHA256"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and verify qualified Physics runtime
        shell: bash
        run: |
          set -euxo pipefail
          docker pull "$BASELINE_RUNTIME_REF"
          test "$(docker image inspect "$BASELINE_RUNTIME_REF" --format '{{ index .Config.Labels "io.physics.source.manifest-sha256" }}')" = "$BASELINE_PHYSICS_MANIFEST_SHA256"

      - name: Check and run wall-flux case
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm             --user "$(id -u):$(id -g)"             --workdir "/workspace/$RUN_DIR"             -v "$PWD:/workspace"             "$BASELINE_RUNTIME_REF"             --check-input -i input.i

          docker run --rm             --user "$(id -u):$(id -g)"             --workdir "/workspace/$RUN_DIR"             -v "$PWD:/workspace"             "$BASELINE_RUNTIME_REF"             -i input.i > "$RUN_DIR/runtime.log" 2>&1

          (
            cd "$RUN_DIR"
            EXPECTED_DT_S="1.0e-9"             EXPECTED_STEPS="4"             EXPECTED_END_TIME_S="4.0e-9"             EXPECTED_ENERGY_PER_PARTICLE_TE_FACTOR="${{ matrix.energy_per_particle_te_factor }}"               python3 check.py | tee checker.log
          )

      - name: Upload wall-flux case
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-energy-wall-${{ matrix.label }}
          path: |
            .ci-electron-energy-wall/${{ matrix.label }}/input.i
            .ci-electron-energy-wall/${{ matrix.label }}/runtime.log
            .ci-electron-energy-wall/${{ matrix.label }}/checker.log
            .ci-electron-energy-wall/${{ matrix.label }}/electron_diffusion.csv
            .ci-electron-energy-wall/${{ matrix.label }}/electron_diffusion.e
            .ci-electron-energy-wall/${{ matrix.label }}/electron_diffusion_final_profile_*.csv
          if-no-files-found: error
          retention-days: 30

  electron-energy-wall-flux-comparison:
    if: github.event_name == 'pull_request' && github.head_ref == 'issue-359-qualified-gummel-icp'
    needs: electron-energy-wall-flux-matrix
    name: Electron energy wall flux comparison
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          pattern: electron-energy-wall-*
          path: wall-flux-artifacts

      - name: Compare final temperature profiles
        shell: bash
        run: |
          set -euxo pipefail
          python3 experiments/2d-icp-electron-diffusion-energy-experiment/check_wall_flux_matrix.py             wall-flux-artifacts

      - name: Upload wall-flux comparison
        uses: actions/upload-artifact@v4
        with:
          name: electron-energy-wall-flux-comparison
          path: |
            wall_flux_comparison.json
            wall_flux_comparison.csv
          if-no-files-found: error
          retention-days: 30

