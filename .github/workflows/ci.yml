name: Repository CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

env:
  PHYSICS_RUNTIME_REF: ghcr.io/hyungseonsong-plasma/physics-runtime@sha256:cda9f0d09a17aed5fa606e97d1ee5c3450f7280536cec2e5c635402bb07d972c
  EXPECTED_BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
  EXPECTED_RUNTIME_REVISION: 565b500722c00e4ff6e759a02bd7bae52f8b13f0

jobs:
  validate:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action != 'edited' ||
      github.event.changes.base != null
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate governed workflow surface
        run: |
          python3 ci/guards/workflow_surface_guard.py --self-test
          python3 ci/guards/workflow_surface_guard.py --check
      - name: Validate deterministic workflow routing and generated bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/workflow_harness.py --self-test
          python3 ci/workflow_harness.py --check
      - name: Regression-test scoped Native P1 harness and Issue493 delegation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/unit -p test_native_build_harness.py -v
          python3 experiments/Issue493_s6_boltzmann/test_run_issue493.py
          python3 experiments/Issue493_s6_boltzmann/test_public_p3_run.py
          python3 experiments/Issue493_s6_boltzmann/test_public_p3_diagnostic.py
      - name: Regression-test moose-test-init capability restoration
        shell: bash
        run: |
          python3 ci/guards/moose_test_init_capability_guard.py --self-test
          python3 ci/guards/moose_test_init_capability_guard.py --check
      - name: Regression-test central Skill manifest contract
        run: python3 ci/guards/central_skill_contract_guard.py --self-test
      - name: Validate Samuel central operating contracts
        shell: bash
        run: |
          set -euo pipefail
          test ! -e skills
          test ! -e src/chatgpt_operation
          test -f docs/operating_system/README.md
          test -f docs/operating_system/CENTRAL_SKILLS.md
          test -f docs/operating_system/central_skills.json
          grep -Fq '9b335e3fbb9c5e8e323e382daeec56fa25336822' docs/operating_system/README.md
          grep -Fq 'Expected OS:** Samuel' docs/operating_system/README.md
          grep -Fq '9b335e3fbb9c5e8e323e382daeec56fa25336822' docs/operating_system/CENTRAL_SKILLS.md

          # Calvin operating metrics remain archive-only under Samuel.
          test ! -e docs/metrics
          test ! -e docs/protocols/metrics_closure.md
          test -d archive/operating_metrics/calvin/docs_metrics
          test -f archive/operating_metrics/calvin/metrics_closure.md

          # Executable central actions use the same exact Samuel revision.
          grep -Fq 'HyungseonSong-plasma/chatgpt-operation/.github/actions/repository-mutation@9b335e3fbb9c5e8e323e382daeec56fa25336822' .github/workflows/refactor.yml
          grep -Fq 'HyungseonSong-plasma/chatgpt-operation/.github/actions/governed-work@9b335e3fbb9c5e8e323e382daeec56fa25336822' .github/workflows/refactor.yml
          grep -Fq 'HyungseonSong-plasma/chatgpt-operation/.github/actions/governed-work@9b335e3fbb9c5e8e323e382daeec56fa25336822' .github/workflows/experiment.yml

          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest=json.loads(Path("docs/operating_system/central_skills.json").read_text(encoding="utf-8"))
          assert manifest["schema_version"] == 2
          assert manifest["source_repository"] == "HyungseonSong-plasma/chatgpt-operation"
          os_meta=manifest["operating_system"]
          revision="9b335e3fbb9c5e8e323e382daeec56fa25336822"
          assert os_meta["revision"] == revision
          assert os_meta["expected_version"] == "Samuel"
          assert os_meta["index"] == {
              "path": "docs/operating_system/README.md",
              "expected_blob_sha": "77448ab850a06c141b16976c1c75353e7224973d",
          }
          assert os_meta["essential_rules"] == {
              "path": "docs/operating_system/ESSENTIAL_RULES.md",
              "expected_blob_sha": "9d11cb64007964a6c1fdea91779a3b25618a5098",
          }
          assert manifest["skill_catalog"] == {
              "path": "skills/catalog.json",
              "expected_blob_sha": "9bee98efd28235ccafdcffde18da06dcc0386702",
          }
          assert manifest["capability_registry"] == {
              "path": "skills/capability-registry.json",
              "expected_blob_sha": "aa87d20fa68dc6e171ffd3240b4e4bc6d3bf28be",
          }

          entries={item["name"]: item for item in manifest["skills"]}
          expected_names={
              "session-bootstrap",
              "state-refresh",
              "repository-mutation",
              "governed-work",
              "controller-throughput",
              "controller-lifecycle",
              "github-actions-execution",
              "github-actions-observation",
              "artifact-staging",
              "scientific-discriminator-controller",
              "pull-request-merge",
              "research-controller",
          }
          assert set(entries) == expected_names
          for item in entries.values():
              assert item["revision"] == revision
          assert entries["session-bootstrap"]["load_on"] == ["INIT"]
          assert entries["state-refresh"]["load_on"] == ["INIT","SCHEDULED_CONTROLLER"]
          assert entries["repository-mutation"]["load_on"] == ["MUTATE","GITHUB_BRANCH_DELETE","GITHUB_MUTATION_CAPABILITY_VERDICT"]
          assert entries["governed-work"]["load_on"] == ["GOVERNED_WORK"]
          assert entries["controller-throughput"]["load_on"] == ["SCHEDULED_CONTROLLER"]
          assert entries["controller-lifecycle"]["load_on"] == ["SCHEDULED_CONTROLLER"]
          assert entries["github-actions-execution"]["load_on"] == ["GITHUB_ACTIONS_EXECUTION"]
          assert entries["github-actions-observation"]["load_on"] == ["GITHUB_ACTIONS_OBSERVATION"]
          assert entries["artifact-staging"]["load_on"] == ["ARTIFACT_STAGING"]
          assert entries["scientific-discriminator-controller"]["load_on"] == ["SCIENTIFIC_DISCRIMINATOR_CONTROLLER"]
          assert entries["pull-request-merge"]["load_on"] == ["GITHUB_PR_MERGE"]
          assert entries["research-controller"]["load_on"] == ["RESEARCH_CONTROLLER"]

          policy=json.loads(Path(".chatgpt-operation.json").read_text(encoding="utf-8"))
          assert policy["schema_version"] == 1
          assert policy["repository"] == "HyungseonSong-plasma/moose-test-repo"
          assert policy["validation_gate"]["mode"] == "named_workflows"
          assert "Repository CI" in policy["validation_gate"]["workflows"]
          PY

          central_revision="$(python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('docs/operating_system/central_skills.json').read_text(encoding='utf-8'))
          print(manifest['operating_system']['revision'])
          PY
          )"
          central_dir="$(mktemp -d)"
          git -C "$central_dir" init -q
          git -C "$central_dir" remote add origin https://github.com/HyungseonSong-plasma/chatgpt-operation.git
          git -C "$central_dir" fetch --quiet --depth=1 origin "$central_revision"
          git -C "$central_dir" show "$central_revision:skills/catalog.json" > "$central_dir/skill-catalog.json"
          python3 ci/guards/central_skill_contract_guard.py \
            --manifest docs/operating_system/central_skills.json \
            --catalog "$central_dir/skill-catalog.json"

          CENTRAL_DIR="$central_dir" python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          manifest=json.loads(Path("docs/operating_system/central_skills.json").read_text(encoding="utf-8"))
          root=os.environ["CENTRAL_DIR"]
          revision=manifest["operating_system"]["revision"]

          expected=[
              manifest["operating_system"]["index"],
              manifest["operating_system"]["essential_rules"],
              manifest["skill_catalog"],
              manifest["capability_registry"],
          ]
          expected += [
              {"path": item["path"], "expected_blob_sha": item["expected_blob_sha"]}
              for item in manifest["skills"]
          ]

          for item in expected:
              actual=subprocess.check_output(
                  ["git","-C",root,"rev-parse",f'{revision}:{item["path"]}'],
                  text=True,
              ).strip()
              assert actual == item["expected_blob_sha"], (
                  item["path"], item["expected_blob_sha"], actual
              )

          readme=subprocess.check_output(
              ["git","-C",root,"show",f"{revision}:docs/operating_system/README.md"],
              text=True,
          )
          assert "**Current version name:** Samuel" in readme
          essential=subprocess.check_output(
              ["git","-C",root,"show",f"{revision}:docs/operating_system/ESSENTIAL_RULES.md"],
              text=True,
          )
          assert essential.startswith("# Samuel Essential Rules")
          PY
          rm -rf "$central_dir"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependencies
        run: >-
          python -m pip install
          'pydantic>=2,<3'
          'pytest>=8,<9'
          'numpy>=1.26,<3'
          'scipy>=1.14,<2'
          'matplotlib>=3.8,<4'
          -r requirements-evidence-engine.txt
          -r requirements-ontology.txt

      - name: Validate central scientific semantics compatibility
        shell: bash
        run: |
          set -euo pipefail
          central_revision="d7e5d16e1ed1b9d3561c25cc3b2f0d3533de4a87"
          central_dir="$(mktemp -d)"
          git -C "$central_dir" init -q
          git -C "$central_dir" remote add origin https://github.com/HyungseonSong-plasma/chatgpt-operation.git
          git -C "$central_dir" fetch --quiet --depth=1 origin "$central_revision"
          git -C "$central_dir" checkout --quiet FETCH_HEAD
          python3 ci/guards/scientific_centralization_guard.py \
            --central-root "$central_dir" \
            --central-revision "$central_revision" \
            --json-out scientific-centralization-compatibility.json
          rm -rf "$central_dir"

      - name: Upload scientific centralization compatibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: scientific-centralization-compatibility
          path: scientific-centralization-compatibility.json
          if-no-files-found: error
          retention-days: 30

      - name: Validate Evidence dependency direction
        run: python ci/guards/physics_dependency_guard.py --check evidence
      - name: Validate Analysis dependency direction
        run: python ci/guards/physics_dependency_guard.py --check analysis
      - name: Validate Execution dependency direction
        run: python ci/guards/physics_dependency_guard.py --check execution
      - name: Validate presentation dependency direction
        run: python ci/guards/physics_dependency_guard.py --check presentation
      - name: Validate repository-tool dependency direction
        run: python ci/guards/physics_dependency_guard.py --check repository
      - name: Validate canonical package cycles
        run: python ci/guards/physics_dependency_guard.py --check cycle
      - name: Validate declarative experiment gateway
        run: python ci/guards/physics_experiment_gateway_guard.py
      - name: Validate plasma semantic ownership
        run: python ci/guards/physics_plasma_semantic_residue_guard.py
      - name: Validate campaign/performance/scale ownership
        run: python ci/guards/physics_campaign_residue_guard.py
      - name: Validate numerical-method ownership
        run: python ci/guards/physics_numerical_method_ownership_guard.py
      - name: Validate model terminology and MOOSE boundary ownership
        run: python ci/guards/physics_boundary_terminology_guard.py
      - name: Validate Physics to SOL adapter boundary
        run: |
          python ci/guards/physics_sol_adapter_boundary_guard.py --self-test
          python ci/guards/physics_sol_adapter_boundary_guard.py --check
      - name: Validate declared Physics directory roles and exception boundaries
        run: |
          python ci/guards/physics_directory_role_guard.py --self-test
          python ci/guards/physics_directory_role_guard.py --check --json-out physics-directory-role-audit.json
      - name: Upload directory-role audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics-directory-role-audit
          path: physics-directory-role-audit.json
          if-no-files-found: warn
      - name: Validate strict zero-legacy architecture census
        run: |
          python ci/guards/physics_architecture_census.py --json-out physics-architecture-census.json
          python ci/guards/physics_architecture_census.py --require-no-legacy
      - name: Validate zero-legacy active CI surface
        run: python ci/guards/physics_public_artifact_residue_guard.py
      - name: Upload architecture census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics-architecture-census
          path: physics-architecture-census.json
      - name: Upload migration source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics-migration-source
          path: |
            physics_harness/**/*.py
            experiments/**/*.py
            tests/**/*.py
          retention-days: 1
      - name: Run Physics pytest
        run: python -m pytest -q
      - name: Regression-test Issue493 canonical/archive Exodus P4 diagnostics
        run: python experiments/Issue493_s6_boltzmann/test_compare_native_reference.py
      - name: Validate normalized-to-physical coupled equivalence fixture
        run: python physics_app/ci/check_physical_state_coupled_equivalence.py --self-test
      - name: Validate n_epsilon-to-mean_en symbol equivalence fixture
        run: python physics_app/ci/check_mean_en_symbol_equivalence.py --self-test
      - name: Validate retired Gummel Action is absent
        run: python physics_app/ci/check_retired_gummel_action_contract.py
      - name: Validate #17 R1 EI01 attachment source contract
        run: python physics_app/ci/check_ei01_attachment_source_contract.py
      - name: Validate #17 R2 O2 ionization lookup and ownership contract
        run: python physics_app/ci/check_r2_o2_ionization_contract.py
      - name: Validate #176 R3 O2s excitation constant-surrogate ownership contract
        run: python physics_app/ci/check_r3_o2s_excitation_contract.py
      - name: Validate #26 E8 EI10 inelastic energy ownership contract
        run: python physics_app/ci/check_e8_ei10_energy_contract.py
      - name: Validate #26 E8 EI10 inelastic energy production implementation
        run: python physics_app/ci/check_e8_ei10_energy_implementation.py
      - name: Validate #26 E8 EI10 runtime discriminator logic
        run: python physics_app/ci/check_e8_ei10_energy_runtime.py --self-test
      - name: Validate #26 E8 EI16 ionization energy ownership contract
        run: python physics_app/ci/check_e8_ei16_energy_contract.py
      - name: Validate #26 E8 EI16 runtime discriminator logic
        run: python physics_app/ci/check_e8_ei16_energy_runtime.py --self-test
      - name: Validate #176 R3 O2s excitation production implementation
        run: python physics_app/ci/check_r3_o2s_excitation_implementation.py
      - name: Validate #17 R2 O2 ionization production implementation
        run: python physics_app/ci/check_r2_o2_ionization_implementation.py
      - name: Validate canonical electron molar representation contract
        run: |
          python physics_app/ci/check_electron_molar_representation_contract.py --self-test
          python physics_app/ci/check_electron_molar_representation_contract.py
      - name: Validate Issue 43/45 science refactor
        run: python experiments/Issue43_45_science_refactor/final_guard.py
      - name: Validate Issue 89 post-science canonicalization
        run: python experiments/Issue89_post_science_canonicalization/final_guard.py
      - name: Validate execution contract refactor
        run: python experiments/execution_contract_refactor/guard.py

  runtime-smoke:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action != 'edited' ||
      github.event.changes.base != null
    name: Public immutable Physics runtime smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate accepted immutable runtime ref
        shell: bash
        run: |
          set -euxo pipefail
          [[ "$PHYSICS_RUNTIME_REF" =~ ^ghcr\.io/hyungseonsong-plasma/physics-runtime@sha256:[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_BUILD_BASE_REF" =~ ^ghcr\.io/hyungseonsong-plasma/physics-build-base@sha256:[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_RUNTIME_REVISION" =~ ^[0-9a-f]{40}$ ]]
      - name: Pull accepted public Physics runtime without package credentials
        id: pull
        shell: bash
        run: |
          set -euxo pipefail
          start="$(date +%s)"
          docker pull "$PHYSICS_RUNTIME_REF"
          end="$(date +%s)"
          echo "pull_seconds=$((end - start))" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$(docker image inspect "$PHYSICS_RUNTIME_REF" --format '{{.Size}}')" >> "$GITHUB_OUTPUT"
      - name: Verify accepted runtime provenance
        shell: bash
        run: |
          set -euxo pipefail
          test "$(docker image inspect "$PHYSICS_RUNTIME_REF" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$EXPECTED_RUNTIME_REVISION"
          test "$(docker image inspect "$PHYSICS_RUNTIME_REF" --format '{{ index .Config.Labels "io.physics.build-base.ref" }}')" = "$EXPECTED_BUILD_BASE_REF"
          test "$(docker image inspect "$PHYSICS_RUNTIME_REF" --format '{{ index .Config.Labels "io.physics.source.owner" }}')" = "moose-test-repo/physics_app"
      - name: Run Physics check-input smoke
        shell: bash
        run: docker run --rm "$PHYSICS_RUNTIME_REF" --check-input -i /opt/physics/ci/smoke.i
      - name: Run bounded real Physics smoke
        shell: bash
        run: docker run --rm "$PHYSICS_RUNTIME_REF" -i /opt/physics/ci/smoke.i
      - name: Run normalized-to-physical coupled field equivalence
        shell: bash
        run: |
          set -euxo pipefail
          work="$PWD/.physical-state-equivalence"
          python physics_app/ci/check_physical_state_coupled_equivalence.py --prepare "$work"
          for mode in normalized physical; do
            docker run --rm -v "$work/$mode:/work" -w /work "$PHYSICS_RUNTIME_REF" --check-input -i input.i
            docker run --rm -v "$work/$mode:/work" -w /work "$PHYSICS_RUNTIME_REF" -i input.i
          done
          python physics_app/ci/check_physical_state_coupled_equivalence.py --compare "$work"
      - name: Run n_epsilon-to-mean_en symbol equivalence
        shell: bash
        run: |
          set -euxo pipefail
          work="$PWD/.mean-en-symbol-equivalence"
          python physics_app/ci/check_mean_en_symbol_equivalence.py --prepare "$work"
          for mode in old new; do
            docker run --rm -v "$work/$mode:/work" -w /work "$PHYSICS_RUNTIME_REF" --check-input -i input.i
            docker run --rm -v "$work/$mode:/work" -w /work "$PHYSICS_RUNTIME_REF" -i input.i
          done
          python physics_app/ci/check_mean_en_symbol_equivalence.py --compare "$work"
      - name: Record ordinary CI runtime evidence
        shell: bash
        run: |
          {
            echo "PHYSICS_RUNTIME_REF=$PHYSICS_RUNTIME_REF"
            echo "RUNTIME_PULL_SECONDS=${{ steps.pull.outputs.pull_seconds }}"
            echo "RUNTIME_LOCAL_SIZE_BYTES=${{ steps.pull.outputs.size_bytes }}"
            echo "ORDINARY_CI_USES_PHYSICS_RUNTIME=true"
            echo "ORDINARY_CI_USES_RETIRED_RUNTIME=false"
            echo "ORDINARY_CI_PULLS_MOOSE_DEV=false"
            echo "ORDINARY_CI_PULLS_PHYSICS_BUILD_BASE=false"
            echo "ORDINARY_CI_REBUILDS_MOOSE_STACK=false"
            echo "ORDINARY_CI_COMPILES_PHYSICS_APPLICATION=false"
          }

  boltzmann-eepf-controls:
    name: Native Boltzmann EEPF development controls
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action != 'edited' ||
      github.event.changes.base != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check BOLSIG-format EFFECTIVE momentum / excitation contracts (synthetic P0/P1)
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            -Iphysics_app/include/utils \
            physics_app/src/utils/PhysicsBoltzmannElasticSolver.C \
            physics_app/src/utils/PhysicsBoltzmannCrossSections.C \
            tests/boltzmann/cross_section_import_test.C \
            -o /tmp/boltzmann-cross-section-import-test
          /tmp/boltzmann-cross-section-import-test
      - name: P0-1 independent energy-ceiling convergence, threshold and actual C++ elastic re-solves
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            -Iphysics_app/include/utils \
            physics_app/src/utils/PhysicsBoltzmannElasticSolver.C \
            tests/boltzmann/energy_ceiling_controller_test.C \
            -o /tmp/boltzmann-energy-ceiling-test
          /tmp/boltzmann-energy-ceiling-test
      - name: P0-1 actual C++ coupled temporal-growth Emax re-solves (synthetic cross sections)
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            -Iphysics_app/include/utils \
            physics_app/src/utils/PhysicsBoltzmannElasticSolver.C \
            physics_app/src/utils/PhysicsBoltzmannGrowth.C \
            physics_app/src/utils/PhysicsBoltzmannTemporalGrowth.C \
            tests/boltzmann/growth_energy_ceiling_test.C \
            -o /tmp/boltzmann-growth-energy-ceiling-test
          /tmp/boltzmann-growth-energy-ceiling-test
      - name: P0-2 threshold-aware nonuniform FV mesh and actual C++ M6b eigen/rates (synthetic)
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            -Iphysics_app/include/utils \
            physics_app/src/utils/PhysicsBoltzmannElasticSolver.C \
            physics_app/src/utils/PhysicsBoltzmannGrowth.C \
            physics_app/src/utils/PhysicsBoltzmannTemporalGrowth.C \
            tests/boltzmann/threshold_mesh_growth_test.C \
            -o /tmp/boltzmann-threshold-mesh-growth-test
          /tmp/boltzmann-threshold-mesh-growth-test
      - name: P0-1/P0-2 integrated adaptive Emax + threshold mesh M6b eigen/rates (synthetic)
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            -Iphysics_app/include/utils \
            physics_app/src/utils/PhysicsBoltzmannElasticSolver.C \
            physics_app/src/utils/PhysicsBoltzmannGrowth.C \
            physics_app/src/utils/PhysicsBoltzmannTemporalGrowth.C \
            tests/boltzmann/adaptive_growth_ceiling_test.C \
            -o /tmp/boltzmann-adaptive-growth-ceiling-test
          /tmp/boltzmann-adaptive-growth-ceiling-test
      - name: P0-2 fixed-Emax independent M6b mesh refinement, EEPF L1 and rate convergence (synthetic)
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            -Iphysics_app/include/utils \
            physics_app/src/utils/PhysicsBoltzmannElasticSolver.C \
            physics_app/src/utils/PhysicsBoltzmannGrowth.C \
            physics_app/src/utils/PhysicsBoltzmannTemporalGrowth.C \
            tests/boltzmann/fixed_emax_mesh_convergence_test.C \
            -o /tmp/boltzmann-fixed-emax-mesh-test
          /tmp/boltzmann-fixed-emax-mesh-test
      - name: P0-1/P0-2 joint Emax and independent mesh convergence gate (synthetic M6b)
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            -Iphysics_app/include/utils \
            physics_app/src/utils/PhysicsBoltzmannElasticSolver.C \
            physics_app/src/utils/PhysicsBoltzmannGrowth.C \
            physics_app/src/utils/PhysicsBoltzmannTemporalGrowth.C \
            tests/boltzmann/joint_emax_mesh_convergence_test.C \
            -o /tmp/boltzmann-joint-emax-mesh-test
          /tmp/boltzmann-joint-emax-mesh-test
      - name: P0-3 conservative reconstructed growth operator and actual M6b Picard eigen re-solves (synthetic)
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            -Iphysics_app/include/utils \
            physics_app/src/utils/PhysicsBoltzmannElasticSolver.C \
            physics_app/src/utils/PhysicsBoltzmannGrowth.C \
            physics_app/src/utils/PhysicsBoltzmannTemporalGrowth.C \
            tests/boltzmann/reconstructed_growth_picard_test.C \
            -o /tmp/boltzmann-reconstructed-growth-picard-test
          /tmp/boltzmann-reconstructed-growth-picard-test
      - name: Compile and run actual C++ Boltzmann solver on invented elastic controls
        run: python3 physics_app/ci/export_boltzmann_ci_eepf.py --out boltzmann-ci-eepf
      - name: Upload C++ EEPF data, explicitly marked not real-gas parity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boltzmann-native-eepf-synthetic-controls
          path: boltzmann-ci-eepf/*.json
          if-no-files-found: warn
          retention-days: 30
      # Developer binary only: no LXCat rows, no native BOLSIG+ reference
      # and no selected third-party collision files are copied to CI.
      # Download the binary and run it with privately held files locally.
      - name: Build standalone native Boltzmann candidate for private-source local comparison
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            -Iphysics_app/include/utils \
            physics_app/src/utils/PhysicsBoltzmannElasticSolver.C \
            physics_app/src/utils/PhysicsBoltzmannGrowth.C \
            physics_app/src/utils/PhysicsBoltzmannTemporalGrowth.C \
            physics_app/src/utils/PhysicsBoltzmannTransport.C \
            physics_app/src/utils/PhysicsBoltzmannCrossSections.C \
            physics_app/ci/boltzmann_candidate_export.C \
            -o /tmp/boltzmann-candidate-example4
          mkdir -p boltzmann-candidate-bin
          cp /tmp/boltzmann-candidate-example4 boltzmann-candidate-bin/boltzmann-candidate-example4
          (cd boltzmann-candidate-bin && sha256sum boltzmann-candidate-example4 > SHA256SUMS)
          echo 'PRIVATE INPUT REQUIRED; THIS ARTIFACT CONTAINS NO LXCat/BOLSIG+ INPUT OR OUTPUT DATA' > boltzmann-candidate-bin/README.txt
      - name: Upload development-only C++ candidate binary without collision data
        uses: actions/upload-artifact@v4
        with:
          name: boltzmann-candidate-local-private-input
          path: boltzmann-candidate-bin/*
          if-no-files-found: error
          retention-days: 1


  # Exact-head read-only replacement for historical issue402-legacy-symbol-audit-once.yml.
  # Separate from the pre-existing validate workflow-surface gate so it can
  # supply independent P0 evidence without weakening or bypassing that gate.
  issue402_legacy_p0_inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact event source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert source identity
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Regress symbol inventory counting and detect mutation
        run: python3 ci/guards/issue402_symbol_inventory.py --self-test
      - name: Inventory tracked Issue402 symbols without rewriting sources
        run: python3 ci/guards/issue402_symbol_inventory.py --check
      - name: Install exact historical P0 test dependency
        run: python3 -m pip install --disable-pip-version-check --quiet 'pytest>=8,<9'
      - name: Run eight canonical Issue402 static source regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pytest -q \
            tests/test_issue402_dd_plasma_boundary_json.py \
            tests/test_issue402_material_class_names.py \
            tests/test_issue402_species_functor_naming.py \
            tests/test_issue402_s6_wall_naming_staging.py \
            tests/test_issue402_s6_electron_transport_compatibility.py \
            tests/test_issue402_retired_plasma_closures.py \
            tests/test_issue402_transport_material_consolidation.py \
            tests/test_issue402_species_transport_rule.py
          echo ISSUE402_CANONICAL_ENERGY_WALL_P0_PASS

  # Reusable, governed CI gate for native plasma solver-object changes.
  plasma_native_regression:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == 'HyungseonSong-plasma/moose-test-repo'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Confirm source and pinned build container
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -f experiments/Issue402_plasma_dsl_g1/run_native_binding_smoke.sh
          grep -Fq 'sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008' physics_app/dependencies.lock
          docker --version
      - name: Set up Python for numerical comparisons
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical comparison packages
        run: python3 -m pip install 'numpy>=1.26,<3' 'scipy>=1.14,<2'
      # Fast, independent gate: fail configuration/data/mount/scratch checks
      # BEFORE rebuilding the expensive solver, without changing global CI.
      - name: P0 - Public S6 environment and scratch-permission preflight
        shell: bash
        env:
          EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if test -f experiments/Issue402_plasma_dsl_g1/preflight_public_option_s6.sh; then
            bash experiments/Issue402_plasma_dsl_g1/preflight_public_option_s6.sh
          else
            echo 'Public S6 option preflight is not present on this PR head (legacy smoke scope)'
          fi
      - name: P1 - Build PhysicsApp and verify generated and native solver operators
        shell: bash
        run: bash experiments/Issue402_plasma_dsl_g1/run_native_binding_smoke.sh
      # Distinct step: an S6 input or cleanup failure cannot erase earlier
      # Native build/small-fixture results. The exact P1 binary is reused.
      - name: P2 - Public S6-417 and S6-941 four-way Native input checks
        shell: bash
        run: |
          set -euo pipefail
          if test -f experiments/Issue402_plasma_dsl_g1/run_public_option_s6_p2.sh; then
            bash experiments/Issue402_plasma_dsl_g1/run_public_option_s6_p2.sh
          else
            echo 'Public S6 full-input gate is not present on this PR head (legacy smoke scope)'
          fi
      - name: Upload native regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plasma-native-regression-${{ github.event.pull_request.head.sha }}
          path: experiments/Issue402_plasma_dsl_g1/evidence/**
          if-no-files-found: warn
          retention-days: 30

  artifact-api-probe:
    name: Artifact CreateArtifact API probe (1 day, no Native)
    if: github.event_name == 'pull_request' && github.event.action != 'edited'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Prepare minimal public artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue518-artifact-probe"
          {
            printf 'schema=issue518.artifact_api_probe.v1\n'
            printf 'repo=%s\n' "$GITHUB_REPOSITORY"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'revision=%s\n' "${{ github.event.pull_request.head.sha }}"
          } > "$RUNNER_TEMP/issue518-artifact-probe/probe.txt"
          test -s "$RUNNER_TEMP/issue518-artifact-probe/probe.txt"
      - name: Probe Artifact creation and upload
        id: probe
        uses: actions/upload-artifact@v4
        with:
          name: issue518-artifact-api-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/issue518-artifact-probe/probe.txt
          if-no-files-found: error
          retention-days: 1
      - name: Verify Artifact ID is visible in GitHub REST
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ID: ${{ steps.probe.outputs.artifact-id }}
          EXPECTED_NAME: issue518-artifact-api-probe-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_ID" =~ ^[0-9]+$ ]]
          for n in $(seq 1 12); do
            response="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100")"
            if printf '%s' "$response" | python3 -c '
          import json, os, sys
          r=json.load(sys.stdin)
          exp_id=int(os.environ["EXPECTED_ID"])
          exp_name=os.environ["EXPECTED_NAME"]
          assert any(a["id"] == exp_id and a["name"] == exp_name and not a["expired"]
                     for a in r["artifacts"])
          '; then
              echo "ISSUE518_ARTIFACT_CREATE_REST_VERIFIED id=$EXPECTED_ID"
              echo "Artifact CreateArtifact probe: PASS; id=$EXPECTED_ID" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Artifact CreateArtifact returned id but REST did not expose it"
          exit 1
