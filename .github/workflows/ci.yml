# Issue359 RZ-only rerun marker 2026-10-02
name: Repository CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PHYSICS_RUNTIME_REF: ghcr.io/hyungseonsong-plasma/physics-runtime@sha256:cda9f0d09a17aed5fa606e97d1ee5c3450f7280536cec2e5c635402bb07d972c
  EXPECTED_BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
  EXPECTED_RUNTIME_REVISION: 565b500722c00e4ff6e759a02bd7bae52f8b13f0

jobs:
  electron-energy-wall-flux-comparison:
    if: github.event_name == 'pull_request' && github.head_ref == 'issue-359-qualified-gummel-icp'
    name: Electron energy wall flux comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      CASE_DIR: experiments/2d-icp-electron-diffusion-energy-experiment
      POISSON_DIR: experiments/2d-icp-poisson-experiment
      BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Validate catalog and configurable wall-flux contract
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python3 bin/physics.py simple-case check
          python3 bin/physics.py simple-case list
          python3 bin/physics.py simple-case show electron-diffusion-experiment
          python3 bin/physics.py simple-case show electron-diffusion-energy-experiment
          if python3 bin/physics.py simple-case show 1; then
            echo "numeric simple-case selector unexpectedly accepted" >&2
            exit 1
          fi
          python3 physics_app/ci/check_electron_molar_representation_contract.py --self-test
          python3 physics_app/ci/check_electron_molar_representation_contract.py

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build exact-head Physics runtime
        shell: bash
        run: |
          set -euxo pipefail
          docker pull "$BUILD_BASE_REF"
          docker run --rm \
            --entrypoint /bin/bash \
            --user 0:0 \
            --workdir /workspace \
            -v "$PWD:/workspace" \
            "$BUILD_BASE_REF" \
            -lc '
              set -euxo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory /opt/physics_vendor/moose
              git config --global --add safe.directory /opt/physics_vendor/crane
              git config --global --add safe.directory /opt/physics_vendor/squirrel
              git config --global --add safe.directory /opt/physics_vendor/zapdos
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt
              make -C /workspace/physics_app -j2
              chmod -R a+rwX /workspace/physics_app
            '
          test -x physics_app/physics-opt

      - name: Prepare 2Te and 5over2Te cases
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .ci-electron-energy-wall wall-flux-artifacts
          mkdir -p .ci-electron-energy-wall wall-flux-artifacts

          for spec in "kinetic_4over3 2.0" "matched_5over3 2.5"; do
            set -- $spec
            label="$1"
            factor="$2"
            run_dir=".ci-electron-energy-wall/$label"
            cp -a "$CASE_DIR" "$run_dir"
            python3 "$CASE_DIR/prepare_wall_flux_case.py" \
              "$run_dir/input.i" \
              --energy-factor "$factor"
            mkdir -p "wall-flux-artifacts/electron-energy-wall-$label"
          done

      - name: Run exact-head wall-flux cases
        shell: bash
        run: |
          set -euxo pipefail
          for spec in "kinetic_4over3 2.0" "matched_5over3 2.5"; do
            set -- $spec
            label="$1"
            factor="$2"
            run_dir=".ci-electron-energy-wall/$label"

            docker run --rm \
              --entrypoint /bin/bash \
              --user "$(id -u):$(id -g)" \
              --workdir "/workspace/$run_dir" \
              -v "$PWD:/workspace" \
              "$BUILD_BASE_REF" \
              -lc '
                set -euxo pipefail
                source /environment
                /workspace/physics_app/physics-opt --check-input -i input.i
                /workspace/physics_app/physics-opt -i input.i > runtime.log 2>&1
              '

            (
              cd "$run_dir"
              EXPECTED_DT_S="1.0e-9" \
              EXPECTED_STEPS="4" \
              EXPECTED_END_TIME_S="4.0e-9" \
              EXPECTED_ENERGY_PER_PARTICLE_TE_FACTOR="$factor" \
                python3 check.py | tee checker.log
            )

            cp -a "$run_dir"/. "wall-flux-artifacts/electron-energy-wall-$label/"
          done

      - name: Compare temperature profiles
        shell: bash
        run: |
          set -euxo pipefail
          python3 "$CASE_DIR/check_wall_flux_matrix.py" wall-flux-artifacts

      - name: Run all-ground Poisson candidate
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .ci-poisson
          cp -a "$POISSON_DIR" .ci-poisson

          docker run --rm \
            --entrypoint /bin/bash \
            --user "$(id -u):$(id -g)" \
            --workdir /workspace/.ci-poisson \
            -v "$PWD:/workspace" \
            "$BUILD_BASE_REF" \
            -lc '
              set -euxo pipefail
              source /environment
              /workspace/physics_app/physics-opt --check-input -i input.i
              /workspace/physics_app/physics-opt -i input.i > runtime.log 2>&1
            '

          (
            cd .ci-poisson
            python3 check.py | tee checker.log
          )

      - name: Upload Poisson candidate
        uses: actions/upload-artifact@v4
        with:
          name: poisson-candidate
          path: |
            .ci-poisson/input.i
            .ci-poisson/runtime.log
            .ci-poisson/checker.log
            .ci-poisson/poisson.csv
            .ci-poisson/poisson.e
            .ci-poisson/poisson_final_profile_*.csv
          if-no-files-found: error
          retention-days: 30

      - name: Upload kinetic 2Te Exodus
        uses: actions/upload-artifact@v4
        with:
          name: electron-energy-wall-kinetic_4over3
          path: |
            .ci-electron-energy-wall/kinetic_4over3/input.i
            .ci-electron-energy-wall/kinetic_4over3/runtime.log
            .ci-electron-energy-wall/kinetic_4over3/checker.log
            .ci-electron-energy-wall/kinetic_4over3/electron_diffusion.csv
            .ci-electron-energy-wall/kinetic_4over3/electron_diffusion.e
            .ci-electron-energy-wall/kinetic_4over3/electron_diffusion_final_profile_*.csv
          if-no-files-found: error
          retention-days: 30

      - name: Upload matched 5over3 Exodus
        uses: actions/upload-artifact@v4
        with:
          name: electron-energy-wall-matched_5over3
          path: |
            .ci-electron-energy-wall/matched_5over3/input.i
            .ci-electron-energy-wall/matched_5over3/runtime.log
            .ci-electron-energy-wall/matched_5over3/checker.log
            .ci-electron-energy-wall/matched_5over3/electron_diffusion.csv
            .ci-electron-energy-wall/matched_5over3/electron_diffusion.e
            .ci-electron-energy-wall/matched_5over3/electron_diffusion_final_profile_*.csv
          if-no-files-found: error
          retention-days: 30

      - name: Upload wall-flux comparison
        uses: actions/upload-artifact@v4
        with:
          name: electron-energy-wall-flux-comparison
          path: |
            wall_flux_comparison.json
            wall_flux_comparison.csv
          if-no-files-found: error
          retention-days: 30
