# Historical Public D source-only evidence. No private rates, no native P2/science.
# Exact original lookup block includes terminal LF; rerun receipt with byte-perfect block hash.
name: Issue672 P6-D3 Public D transport original byte provenance once
on:
  push:
    branches:
      - issue-672-p6-d3-public-d-transport-origin-sha-20261118
    paths:
      - .github/workflows/issue672-p6-d3-public-transport-origin-sha-once.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: issue672-p6-d3-public-origin-20261118
  cancel-in-progress: false
jobs:
  independent-original-sha:
    if: github.repository == 'HyungseonSong-plasma/moose-test-repo' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SOURCE_HEAD: '74a2b0fbeaf411d9c76cb82a69de1629fa55fa7f'
    steps:
      - name: Checkout single-worker audit source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify no changes outside one audit script and workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/issue-672-p6-d3-public-d-transport-origin-sha-20261118"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$SOURCE_HEAD" HEAD
          git diff --name-only "$SOURCE_HEAD" HEAD | sort > "$RUNNER_TEMP/actual.txt"
          printf '%s\n' \
            ci/guards/p6_d3_public_transport_original_sha_audit.py \
            .github/workflows/issue672-p6-d3-public-transport-origin-sha-once.yml | sort > "$RUNNER_TEMP/allowed.txt"
          diff -u "$RUNNER_TEMP/allowed.txt" "$RUNNER_TEMP/actual.txt"
          python3 -m py_compile ci/guards/p6_d3_public_transport_original_sha_audit.py
          cp ci/guards/p6_d3_public_transport_original_sha_audit.py "$RUNNER_TEMP/p6_d3_public_audit.py"
          git checkout --detach "$SOURCE_HEAD"
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test ! -e ci/guards/p6_d3_public_transport_original_sha_audit.py
      - name: Retrieve original independent P3-X archival table bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/14406746397/zip" \
            --output "$RUNNER_TEMP/p3x_source.zip"
          echo "592a7c82834bab841f6a2e1807db305d0eff1e953f50a0dcc6d7e21ff8820111  $RUNNER_TEMP/p3x_source.zip" | sha256sum --check -
      - name: Independent raw Public D e-ion Transport/Lookup/charge SHA and 8 negatives
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/p6_d3_public_audit.py" \
            --repo "$GITHUB_WORKSPACE" \
            --p3x-zip "$RUNNER_TEMP/p3x_source.zip" \
            --out "$RUNNER_TEMP/p6_d3_public_origin_receipt.json"
          python3 -m json.tool "$RUNNER_TEMP/p6_d3_public_origin_receipt.json" >/dev/null
          sha256sum "$RUNNER_TEMP/p6_d3_public_origin_receipt.json" > "$RUNNER_TEMP/sha256sum.txt"
      - name: Upload only sanitized source SHA, units and charge receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue672-p6-d3-public-original-source-sha
          path: |
            ${{ runner.temp }}/p6_d3_public_origin_receipt.json
            ${{ runner.temp }}/sha256sum.txt
          if-no-files-found: warn
          retention-days: 7
