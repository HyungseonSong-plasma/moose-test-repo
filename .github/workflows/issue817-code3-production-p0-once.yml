# #817 one-off only: remove before ANY production integration.
name: Issue817 Code3 current consumers production migration P0 once

on:
  push:
    branches: [issue-817-code3-production-retirement]
    paths:
      - '.github/workflows/issue817-code3-production-p0-once.yml'
      - 'physics_app/ci/**'
      - 'experiments/historical_recipe_support/issue192_s5r.py'
      - 'ci/guards/issue817_code3_production_migration.py'
      - 'tests/test_issue817_code3_production_migration.py'
  pull_request:
    branches: [issue-774-d9-newonly-fvkernel-retirement-closure-20261123]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  active_source_p0:
    name: Exact-head current Code3 consumer migration and negative P0
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Pin CI identity and self-test canonical workflow safety
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test -z "$(git status --porcelain --untracked-files=no)"
          python3 ci/workflow_harness.py --self-test
          python3 ci/workflow_harness.py --check
          python3 ci/guards/p6_ci_workflow_safety_guard.py --self-test --check
          python3 -m pip install --disable-pip-version-check --quiet \
            -r requirements-evidence-engine.txt -r requirements-ontology.txt pytest
      - name: Run source generator and explicit signed source contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 -m py_compile \
            ci/guards/issue817_code3_production_migration.py \
            tests/test_issue817_code3_production_migration.py \
            physics_app/ci/check_stage5_h05_runtime.py \
            physics_app/ci/check_r2_o2_ionization_implementation.py \
            physics_app/ci/check_stage5_ei20_runtime.py \
            physics_app/ci/check_stage5_edetach_runtime.py \
            experiments/historical_recipe_support/issue192_s5r.py
          python3 -m unittest discover -s tests -p test_issue817_code3_production_migration.py -v 2>&1 | tee evidence/owner_negative_tests.log
          python3 -m ci.guards.issue817_code3_production_migration \
            --expected-head "$SOURCE_HEAD" --phase postcut \
            --output evidence/current_signed_source_census.json
      - name: Execute current live CI source contracts and S5R static validators
        shell: bash
        run: |
          set -euo pipefail
          python3 physics_app/ci/check_r2_o2_ionization_implementation.py
          python3 physics_app/ci/check_r2_o2_ionization_implementation.py --self-test
          python3 physics_app/ci/check_stage5_h05_runtime.py --static
          python3 physics_app/ci/check_stage5_h05_runtime.py --self-test
          python3 physics_app/ci/check_stage5_ei20_runtime.py --static
          python3 physics_app/ci/check_stage5_ei20_runtime.py --self-test
          python3 physics_app/ci/check_stage5_edetach_runtime.py --static
          python3 physics_app/ci/check_stage5_edetach_runtime.py --self-test
          python3 physics_app/ci/check_e8_ei16_energy_contract.py
          python3 physics_app/ci/check_e8_ei16_energy_runtime.py --self-test
          python3 physics_app/ci/check_standard_moose_energy_projection.py --self-test
          python3 physics_app/ci/check_issue402_json_rate_native_p2.py --self-test
          python3 physics_app/ci/check_stage5_s5r_preflight.py
          python3 physics_app/ci/check_stage5_s5r_assembly.py --static
          python3 physics_app/ci/check_stage5_s5r_assembly.py --self-test
          python3 -m pytest -q \
            tests/characterization/test_issue192_s5r.py \
            tests/characterization/test_issue192_s5r_runtime.py
          echo ISSUE817_CODE3_ALL_LIVE_SOURCE_P0_PASS
      - name: Upload scoped P0 source and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue817-code3-production-p0-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
