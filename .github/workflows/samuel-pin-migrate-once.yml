name: Samuel pin migration once

on:
  push:
    branches:
      - samuel-pin-negative-capability-guard
    paths:
      - automation/mutations/samuel-pin-migrate.request

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: samuel-pin-negative-capability-guard
          fetch-depth: 0

      - name: Replace exact Samuel pin
        shell: bash
        run: |
          set -euo pipefail
          test -f automation/mutations/samuel-pin-migrate.request || exit 0
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          import subprocess

          request = json.loads(Path('automation/mutations/samuel-pin-migrate.request').read_text())
          if set(request) != {'old_sha', 'new_sha', 'expected_files'}:
              raise SystemExit('request must contain exactly old_sha, new_sha, expected_files')
          old = request['old_sha']
          new = request['new_sha']
          expected = request['expected_files']
          if re.fullmatch(r'[0-9a-f]{40}', old) is None or re.fullmatch(r'[0-9a-f]{40}', new) is None:
              raise SystemExit('old/new SHA must be exact 40-hex commits')
          if not isinstance(expected, int) or expected <= 0:
              raise SystemExit('expected_files must be positive int')

          proc = subprocess.run(['git', 'grep', '-l', old], text=True, capture_output=True)
          if proc.returncode not in (0, 1):
              raise SystemExit(proc.stderr)
          files = [line for line in proc.stdout.splitlines() if line]
          if len(files) != expected:
              raise SystemExit(f'expected {expected} files with old pin, found {len(files)}: {files}')

          for name in files:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count == 0:
                  raise SystemExit(f'old pin disappeared from {name}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          verify = subprocess.run(['git', 'grep', '-n', old], text=True, capture_output=True)
          if verify.returncode == 0:
              raise SystemExit(f'old pin remains:\n{verify.stdout}')
          if verify.returncode != 1:
              raise SystemExit(verify.stderr)

          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          if sorted(changed) != sorted(files):
              raise SystemExit(f'unexpected changed files: expected={files} actual={changed}')

          print('SAMUEL_PIN_MIGRATION_PASS')
          print('files=' + ','.join(files))
          PY

      - name: Commit pin migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No migration changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'Samuel: pin negative capability verdict hard guard'
          git push origin HEAD:samuel-pin-negative-capability-guard
