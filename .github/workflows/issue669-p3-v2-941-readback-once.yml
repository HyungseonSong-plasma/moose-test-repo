name: Issue669 P3-V2 941 electron/energy/pressure/8 FEM BC source and pinned-stage audit
on:
  push:
    branches: [issue-669-p3-v2-s6-941-20261117]
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9c15a4f0e2cf8042cb0d4b2f18af31511021d168
          persist-credentials: false
      - name: Download source-only P2 staged Scratch evidence
        uses: actions/download-artifact@v4
        with:
          name: issue668-newonly-maxwell-child-mesh-exactsha-417-941
          run-id: 44196762787
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: evidence
      - name: Independent P3-V2 source/static and P2-staged 941 byte readback
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "9c15a4f0e2cf8042cb0d4b2f18af31511021d168"
          python3 - <<'PY'
          import copy, hashlib, json, math, re
          from pathlib import Path

          HEAD="9c15a4f0e2cf8042cb0d4b2f18af31511021d168"
          PROJ=Path("experiments/Issue402_plasma_dsl_g1")
          ROOT=Path.cwd().resolve()
          JPATH=PROJ/"chemistry/unified_s6_941_newonly.json"
          TPATH=PROJ/"issue633_newonly_s6_941_continuity.template.i"
          HJSON="2a7d6b191eddf6a92a6bcf74fc818ade8f30836fdd857dc70516f3aa57fa5dde"
          HTEMPLATE="76f52e0aa5e25bb094ca1946f5cb820ccbf5e64c1abc54fb4f1f5e45b23eacac"
          HTABLE_DEFAULT="994f6b1deece3c53be7fb3e7f9526555d0f9314fd58749bea6346639f08aa387"
          HTABLE_PREPARED="35534a522fa48ccb5222339c5040040630eef31e623e1c53f1e1c4540d2d653b"
          EXPECT_TABLE="../../Issue91_real_qvt_r3/r3_e0/electron_moments.txt"
          EXPECTED_FILES=[
          ("rf_elastic_diss_ion_ei20_ei01_400w_adjacent_sheath_wall_closed_100us_dt1000ns__C0_chemistry_off.i","39826e1e95372d226cca4036b520a7f13dfd79c8b6ef0ca2d7c0ca49f904e17e"),
          ("rf_elastic_multiapp_parent_400w_100us_dt1000ns_overlay.i","1acaafa6f65e67b24252756b0a8730a4d37ba94bdb35cb59b8ae07bde7f98864"),
          ("o2_elastic_400w_100us_dt1000ns_overlay.i","1e50c72580583f64f87ad80014a550fcdf76ca7cceae32e04c4fba8a8ad3a818"),
          ("o_elastic_ei17_400w_100us_dt1000ns_overlay.i","ced2d475a44b1f845fdf47b91c5af6cf5e09866a945502da9fe0e9ed2528143e"),
          ("issue477_S2-415_generation_overlay.i","398137e4d6edeac38558fb2b291763426e9b2e239a5fd507554650077f6c5d76"),
          ("issue477_S3-415-401_extra_overlay.i","de41c87c7ae4f99884352d82ce657b1fa47099c118acc3782ec95d5519e7ff05"),
          ("issue477_S4-401-941_op_ionization_overlay.i","e71a979ee5459c29db9a3593516eb60498c4d2c3af81101c8a5938669521bdfa"),
          ("issue477_S5-941-407_o2_consumer_overlay.i","04cea2077abb32552d9fffe2c79518b724529ea05ccc074a20bc582390a63863"),
          ("issue477_S6-941-407-2069-H25_EI2069_overlay.i","d2f4ecf7e7498980d27892d36c3f485bff18d886a8f1c6a5e7b693ec76ab8d35"),
          ("issue477_S6-941-407-2069-H25_H25_overlay.i","dfb177dc17cd0ac350dd38966a8efda392859de6ecb665c85f1e312f8c157acc"),
          ("migrated_continuity.i","19c1b1b25fedc76706b8becca327d2b9f32766c50c4947aabfcec49088ce9cb0")
          ]
          BC_SPECS={
            "plasma_electrode plasma_metal plasma_right":("e_wall","e_energy_wall",
                                                          "electron_sheath","electron_energy_sheath"),
            "plasma_cover":("e_cover_dielectric","e_energy_cover_dielectric",
                             "electron_cover_dielectric","electron_energy_cover"),
            "plasma_wafer":("e_wafer_dielectric","e_energy_wafer_dielectric",
                             "electron_wafer_dielectric","electron_energy_wafer"),
            "plasma_focus_ring":("e_focus_ring_dielectric","e_energy_focus_ring_dielectric",
                                 "electron_focus_ring_dielectric","electron_energy_focus_ring"),
          }
          def h(b):return hashlib.sha256(b).hexdigest()
          def guard(ok,msg):
              if not ok:raise ValueError(msg)
          def strict_pairs(pairs):
              obj={}
              for key,value in pairs:
                  guard(key not in obj,"DUPLICATE_JSON_KEY:"+key)
                  obj[key]=value
              return obj
          def load(b):return json.loads(b.decode("utf-8"),object_pairs_hook=strict_pairs)
          jb=JPATH.read_bytes();tb=TPATH.read_bytes()
          guard(h(jb)==HJSON,"PINNED_941_JSON_SHA");guard(h(tb)==HTEMPLATE,"PINNED_941_TEMPLATE_SHA")
          j=load(jb);templ=tb.decode("utf-8")
          default=PROJ.parent/"Issue91_real_qvt_r3/r3_e0/electron_moments.txt"
          guard(default.is_file() and h(default.read_bytes())==HTABLE_DEFAULT,"SOURCE_TRACKED_DEFAULT_TABLE_SHA")
          default_rows=default.read_bytes().splitlines()
          guard(len(default_rows)==100 and all(len(row.split())==3 for row in default_rows),"SOURCE_DEFAULT_TABLE_SCHEMA")
          n_A=6.02214076e23
          expected_density=1000000000000001.6
          def check_source(blob,overlay):
              e=blob.get("species",{}).get("e",{})
              guard(e.get("charge_number")==-1 and e.get("initial_number_density")==expected_density,"E_INITIAL_OR_CHARGE")
              guard(e.get("temperature_eV")==2.6666666666666665,"ENERGY_TEMPERATURE_SOURCE")
              guard(e.get("transport_coef")=={"type":"lookup","file":EXPECT_TABLE,"unit":"reduced","bounds_policy":"clamp"},"E_LOOKUP_CONTRACT")
              guard(set(blob.get("drift_diffusion_boundaries",{}))==set(BC_SPECS)|{"inlet outlet"},"BOUNDARY_CATALOGUE_SHAPE")
              found=[]
              for sides,(particle,energy,_,_) in BC_SPECS.items():
                  region=blob["drift_diffusion_boundaries"][sides]
                  for name,fac in ((particle,"FEMElectronSheathBC"),(energy,"FEMElectronEnergySheathBC")):
                      guard(region.get(name)=={"type":fac},"BC_SPEC:"+name)
                      found.append({"region":sides,"name":name,"factory":fac})
              guard(len(found)==8 and len({x["name"] for x in found})==8,"BC_COUNT")
              guard(overlay.count("files = 'chemistry/unified_s6_941_newonly.json'")==1,"OVERLAY_SOURCE_FILES")
              for token,expected in {
                  "[Continuity]":1,"[Energy]":1,"fem_species = e":2,
                  "fvm_species = 'O2p Om Op'":1,"fem_potential = potential":2,
                  "transport_coefficient = fluid":1,"pressure = 1.333223684":1,
                  "temperature = 300":1,"state_model = ideal_gas":1
              }.items():
                  guard(overlay.count(token)==expected,"OVERLAY_TOKEN:"+token)
              guard("dont_create_kernels" not in overlay,"DISABLED_KERNELS_ESCAPE")
              return found
          new_bc=check_source(j,templ)
          json_table_resolved=(ROOT/JPATH.parent/EXPECT_TABLE).resolve()
          guard(json_table_resolved==default.resolve(),"SOURCE_TABLE_PATH_MISMATCH")

          STAGE=Path("evidence/cases/941/experiments/Issue395_powered_chemistry_ladder")
          if not STAGE.is_dir():
              print("P3_V2_DIAGNOSTIC_ARTIFACT_FILES="+repr([str(p) for p in Path("evidence").rglob("*") if p.is_file()][:55]),flush=True)
              raise ValueError("NO_941_P2_STAGE_ARTIFACT")
          actual=[]; objects=[];files=[]
          def parse(data,filename,ord):
              results=[];stack=[];offset=0
              for ln,line in enumerate(data.splitlines(keepends=True),1):
                  m=re.fullmatch(rb"\[([^\[\]]*)\]",line.strip())
                  if m:
                      name=m[1].decode("utf-8")
                      if name:stack.append((name,offset,ln))
                      elif stack:
                          name,start,lstart=stack.pop()
                          if len(stack)==1 and stack[0][0] in ("Variables","ICs","BCs","Kernels","FVKernels","FVBCs","Materials","FunctorMaterials"):
                              raw=data[start:offset+len(line)]
                              params={}
                              for row in raw.decode("utf-8").splitlines()[1:-1]:
                                  m2=re.fullmatch(r"\s*([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*?)\s*",row)
                                  if m2:
                                      guard(m2[1] not in params,"DUPLICATE_OBJECT_PARAM:"+name)
                                      params[m2[1]]=m2[2].strip().strip("'\"")
                              results.append({"name":name,"section":stack[0][0],"line_start":lstart,
                                              "line_end":ln,"layer":ord,"filename":filename,
                                              "block_sha256":h(raw),"params":params})
                  offset+=len(line)
              guard(not stack,"UNBALANCED_STAGE_BLOCK:"+filename)
              guard(not re.search(rb"(?m)^\s*!include\b",data),"UNRESOLVED_INCLUDE_IN_PARENT")
              return results
          for ordinal,(name,expect) in enumerate(EXPECTED_FILES,1):
              path=STAGE/name
              guard(path.is_file() and not path.is_symlink(),"MISSING_STAGE_LAYER:"+name)
              data=path.read_bytes()
              guard(h(data)==expect,"P2_STAGE_LAYER_SHA_MISMATCH:"+name)
              guard(0<len(data)<=200000,"P2_STAGE_LAYER_SIZE:"+name)
              objs=parse(data,name,ordinal);objects.extend(objs)
              files.append({"ordinal":ordinal,"filename":name,"sha256":h(data),"bytes":len(data)})
          oldBC=[]
          for sides,(particle,energy,oldparticle,oldenergy) in BC_SPECS.items():
              for name,fac,var in ((oldparticle,"FEMElectronSheathBC","log_e"),
                                   (oldenergy,"FEMElectronEnergySheathBC","log_e_energy")):
                  hits=[x for x in objects if x["section"]=="BCs" and x["name"]==name]
                  guard(len(hits)==1,"MISSING_OR_DUPLICATE_RETAINED_BC:"+name)
                  o=hits[0];p=o["params"]
                  guard(p.get("type")==fac and p.get("variable")==var,"WRONG_RETAINED_BC_FACTORY_OR_VARIABLE:"+name)
                  guard(p.get("boundary")==sides,"WRONG_RETAINED_BC_SIDESET:"+name)
                  guard(p.get("wall_number_flux")=="e_wall_number_flux","WRONG_RETAINED_BC_FLUX:"+name)
                  if var=="log_e_energy":guard(p.get("mean_energy")=="e_energy_eV","WRONG_RETAINED_ENERGY_BC_MEAN:"+name)
                  oldBC.append({k:v for k,v in o.items() if k!="params"} | {"params":p})
          guard(len(oldBC)==8,"OLD_BC_COUNT")
          old_names={x["name"] for x in oldBC};new_names={x["name"] for x in new_bc}
          guard(not old_names.intersection(new_names),"DIFFERENT_BC_NAME_CATALOGUES_EXPECTED")
          stage11=(STAGE/"migrated_continuity.i").read_text()
          guard("unified_s6_941.json" in stage11,"P2_STAGE_EXPECT_HYBRID_941")
          guard("unified_s6_941_newonly.json" not in stage11,"P2_STAGE_NEWONLY_ALREADY_PRESENT_UNEXPECTED")
          guard("transport_coefficient = fluid" not in stage11,"P2_STAGE_STILL_HYBRID_ENERGY_EXPECTED")
          stage_pressure=[{k:v for k,v in o.items() if k!="params"} | {"params":o["params"]}
                          for o in objects if o["section"] in ("Variables","ICs") and
                          o["name"] in ("pressure","p","p_fixed","neutral_pressure")]
          stage_energy=re.findall(r"(?ms)^\s*\[Energy\]\s*\n(.*?)^\s*\[\]\s*$",stage11)
          guard(len(stage_energy)==1,"P2_STAGE_ENERGY_OWNER_COUNT")
          # Revalidate retention controls independently; do not call this a runtime owner count.
          negative={}
          for mutation in ("missing_json_transport","wrong_json_unit","wrong_json_initial","missing_json_bc",
                           "wrong_json_bc_factory","duplicate_overlay_energy","wrong_overlay_pressure",
                           "wrong_overlay_temperature","wrong_overlay_json_file","wrong_energy_fluid"):
              bad=copy.deepcopy(j);t=templ
              if mutation=="missing_json_transport":del bad["species"]["e"]["transport_coef"]
              elif mutation=="wrong_json_unit":bad["species"]["e"]["transport_coef"]["unit"]="physical"
              elif mutation=="wrong_json_initial":bad["species"]["e"]["initial_number_density"]=2e15
              elif mutation=="missing_json_bc":del bad["drift_diffusion_boundaries"]["plasma_wafer"]["e_energy_wafer_dielectric"]
              elif mutation=="wrong_json_bc_factory":bad["drift_diffusion_boundaries"]["plasma_cover"]["e_cover_dielectric"]["type"]="WrongFactory"
              elif mutation=="duplicate_overlay_energy":t=t.replace("[Energy]","[Energy]\n        [Energy]",1)
              elif mutation=="wrong_overlay_pressure":t=t.replace("pressure = 1.333223684","pressure = 0")
              elif mutation=="wrong_overlay_temperature":t=t.replace("temperature = 300","temperature = 0")
              elif mutation=="wrong_overlay_json_file":t=t.replace("unified_s6_941_newonly.json","unified_s6_417_newonly.json")
              elif mutation=="wrong_energy_fluid":t=t.replace("transport_coefficient = fluid","transport_coefficient = other")
              try:check_source(bad,t)
              except ValueError:negative[mutation]="REJECTED"
              else:raise ValueError("NEGATIVE_FALSE_PASS:"+mutation)
          # Stage mutation controls on byte-hash and duplicate-presence preconditions.
          def verify_layer_hash(data, expected):
              guard(h(data)==expected,"STAGE_LAYER_SHA_REJECTED")
          bad_stage=(STAGE/EXPECTED_FILES[0][0]).read_bytes()+b"# altered staged input\\n"
          try:verify_layer_hash(bad_stage,EXPECTED_FILES[0][1])
          except ValueError:negative["altered_stage_file_sha"]="REJECTED"
          else:raise ValueError("NEGATIVE_FALSE_PASS:altered_stage_file_sha")
          def check_unique_existing_bc(records):
              for old in oldBC:
                  seen=[o for o in records if o["name"]==old["name"] and o["section"]=="BCs"]
                  guard(len(seen)==1,"STAGE_BC_DUPLICATE:"+old["name"])
          modified=copy.deepcopy(objects);modified.append(copy.deepcopy(oldBC[0]))
          try:check_unique_existing_bc(modified)
          except ValueError:negative["duplicate_existing_bc"]="REJECTED"
          else:raise ValueError("NEGATIVE_FALSE_PASS:duplicate_existing_bc")
          # Independent source inspection supports a structural potential overlap, not actual
          # warehouse duplicate assertion. Only P3-X may retire/rebind retained FEM BCs.
          report={"schema":"issue669.p3_v2.s6_941.static_source_and_p2_stage.v1","task_id":"P3-V2",
           "source_head":HEAD,"case":"S6-941",
           "status":"SOURCE_JSON_ENERGY_PRESSURE_BC_PASS__P2_STAGE_BYTE_PASS__P3_X_NEWONLY_HOLD",
           "newonly_source":{"json_path":str(JPATH),"json_sha256":h(jb),
                             "overlay_template_path":str(TPATH),"overlay_template_sha256":h(tb),
                             "tracked_default_table_sha256":h(default.read_bytes()),
                             "tracked_default_table_rows":len(default_rows),
                             "required_42row_s6_prepared_table_sha256":HTABLE_PREPARED,
                             "electron_initial_number_density":j["species"]["e"]["initial_number_density"],
                             "electron_initial_log_molar":math.log(expected_density)-math.log(n_A),
                             "electron_transport":j["species"]["e"]["transport_coef"],
                             "electron_energy_initial_molar_eV_m3":1.5*j["species"]["e"]["temperature_eV"]*expected_density/n_A,
                             "electron_newonly_bc_count":len(new_bc),
                             "electron_newonly_bcs":new_bc,
                             "root_gas":{"pressure_Pa":1.333223684,"temperature_K":300}},
           "p2_source_only_stage":{"run_id":44196762787,"artifact_id":14379920938,
                                   "case_path":"cases/941/experiments/Issue395_powered_chemistry_ladder",
                                   "file_sha_verified_count":len(files),"files":files,
                                   "old_nonion_8_bc_preserved":oldBC,
                                   "legacy_energy_overlay_sha":h(stage11.encode()),
                                   "legacy_energy_overlay_present":True,
                                   "newonly_json_staged":False,
                                   "newonly_overlay_staged":False,
                                   "stage_pressure_or_ic_observed":stage_pressure,
                                   "physics_generated_warehouse":"NOT_RUN"},
           "overlap":{"old_8_bc_retained_in_stage":len(oldBC),
                      "newonly_8_bc_declared_in_source":len(new_bc),
                      "same_side_region_and_residual_family":True,
                      "same_object_names":False,
                      "status":"P3_X_OWNER_COLLISION_RISK_HOLD"},
           "negative_controls":negative,
           "unresolved":["#668 full package Production Runner final handoff not accepted",
                         "Actual New-only JSON + layer11 not staged in the source-only P2 artifact",
                         "Retained 8 electron FEM BCs versus eight JSON declared BCs require single-writer cutover",
                         "Pressure state/root gas aliases and external neutral consumers require P3-X runtime check",
                         "Prepared historical 42-row electron table SHA not physically verified in this stage",
                         "No Native check-input, FE Warehouse, dynamic Maxwell, P3/P4 or science parity performed"],
           "science":"SCIENCE_HOLD"}
          out=Path("v2-receipt");out.mkdir(exist_ok=True)
          (out/"p3-v2-s6-941-p0-readback.json").write_text(json.dumps(report,sort_keys=True,indent=2)+"\n")
          print("P3_V2_JSON_SHA256="+h(jb))
          print("P3_V2_OVERLAY_SHA256="+h(tb))
          print("P3_V2_P2_STAGE_L11_SHA256="+h(stage11.encode()))
          print("P3_V2_STAGE_941_11_OF_11_FILE_SHA=PASS")
          print("P3_V2_RETAINED_8_OF_8_BC=PASS")
          print("P3_V2_NEWONLY_JSON_8_OF_8_BC=PASS")
          print("P3_V2_STAGE_PRESSURE_OBSERVED="+repr([(x["section"],x["name"],x["params"]) for x in stage_pressure])[:1300])
          for old in oldBC:
              print(f"P3_V2_RETAINED_BC_SHA256={old['name']}:{old['block_sha256']}")
          print("P3_V2_NEGATIVES=12_OF_12_REJECTED")
          print("P3_V2_SOURCE_STATIC_PASS_P3_X_NEWONLY_BC_OWNER_HOLD")
          PY
      - name: Upload task-scoped verification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue669-p3-v2-941-${{ github.run_id }}-${{ github.run_attempt }}
          path: v2-receipt/
          if-no-files-found: warn
          retention-days: 30
