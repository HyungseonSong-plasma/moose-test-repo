name: Issue 397 Physics Integration Build

on:
  pull_request:
    branches: [main]
    paths:
      - 'physics_app/**'
      - 'experiments/Issue395_powered_chemistry_ladder/**'
      - 'tests/characterization/test_issue395_ei17_overlay.py'
      - '.github/workflows/issue397-physics-integration-build.yml'

permissions:
  contents: read

jobs:
  compile-and-regress:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008

    steps:
      - name: Checkout PR merge ref
        uses: actions/checkout@v4

      - name: Python source syntax and EI17 chemistry contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/Issue395_powered_chemistry_ladder/*.py
          python3 -m unittest discover -s tests/characterization -p test_issue395_ei17_overlay.py -v

      - name: Pull immutable Physics build image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$BUILD_BASE_REF"

      - name: Compile PhysicsApp from this PR's source
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash --user 0:0 \
            --workdir /workspace -v "$GITHUB_WORKSPACE:/workspace" \
            "$BUILD_BASE_REF" -lc '
              set -euo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory /opt/physics_vendor/moose
              git config --global --add safe.directory /opt/physics_vendor/crane
              git config --global --add safe.directory /opt/physics_vendor/squirrel
              git config --global --add safe.directory /opt/physics_vendor/zapdos
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt
              make -C physics_app -j2
              test -x physics_app/physics-opt
              physics_app/physics-opt --help > /dev/null
            '
