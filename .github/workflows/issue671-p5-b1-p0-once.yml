name: issue671-p5-b1-417-p0-static-audit-once
on:
  push:
    branches: [issue-671-p5-b1-p0-preflight-20261118]
    paths:
      - .github/workflows/issue671-p5-b1-p0-once.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: issue671-p5-b1-417-static-only
  cancel-in-progress: false
jobs:
  verify-p0:
    name: S6-417 exact-head source-only P0 preflight (expected collision HOLD)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 395eeac274125ffa632b4d75a4531996dee24fe0
          path: source
          persist-credentials: false
      - name: Checkout source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "395eeac274125ffa632b4d75a4531996dee24fe0"
          test "$(git -C source hash-object ci/p1_ion_new_only_preflight.py)" = "c913bfbced72a9c37d0ed2214a44e5dd31657b35"
      - name: Fetch immutable production New-only stage ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          curl --retry 3 --retry-delay 2 -fLsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/HyungseonSong-plasma/moose-test-repo/actions/artifacts/14405784430/zip' \
            -o evidence/source_p3x.zip
          echo '9e6e8a646e3c3706e56b681c2a272081fbb55aaf74c4914f52c9db37507d0de6  evidence/source_p3x.zip' | sha256sum -c -
      - name: Reconstruct exact 417 11-layer P0 audit ZIP and record SHA
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          h=lambda b:hashlib.sha256(b).hexdigest()
          out=Path('evidence')
          with zipfile.ZipFile(out/'source_p3x.zip') as z:
              assert z.testzip() is None
              ords=json.loads(z.read('cases/417/ordered.json'))
              assert len(ords)==11 and len(set(ords))==11
              receipt=json.loads(z.read('cases/417/newonly_stage_receipt.json'))
              assert receipt['source_head']=='9c15a4f0e2cf8042cb0d4b2f18af31511021d168'
              assert receipt['retired_native_ion_owners']==26 and receipt['remaining_native_ion_fv_owners']==0
              assert receipt['p3_x_electron']['removed_native_electron_owners']==10
              input_sha={}
              with zipfile.ZipFile(out/'repacked417.zip','w') as target:
                  for item in ords:
                      raw=z.read('cases/417/'+item)
                      name=item.rsplit('/',1)[-1]
                      assert h(raw)==receipt['layers_after_sha256'][name]
                      target.writestr('S6_417/11_layers/'+name,raw)
                      input_sha[name]=h(raw)
              jb=z.read('cases/417/experiments/Issue395_powered_chemistry_ladder/chemistry/unified_s6_417_newonly.json')
              assert h(jb)==receipt['json_sha256']=='ed99493d992c71b30e7a4120646af388894032d262b9af5bf299522629fe24ef'
              (out/'unified_s6_417_newonly.json').write_bytes(jb)
              expected_nonion=['ion_wall_flux','negative_ion_wall_flux','atomic_positive_ion_wall_flux','cover_surface_current','wafer_surface_current','focus_ring_surface_current']
              c0=z.read('cases/417/'+ords[0]).decode()
              for name in expected_nonion:
                  assert c0.count('  ['+name+']\n')==1,name
              meta={'run_mode':'source-only','case':'417','source_head':'395eeac274125ffa632b4d75a4531996dee24fe0','staged_artifact_id':14405784430,'artifact_sha256':'9e6e8a646e3c3706e56b681c2a272081fbb55aaf74c4914f52c9db37507d0de6','full_layers_sha256':input_sha,'json_sha256':h(jb),'old_ion_retired':26,'old_ion_remaining':0,'old_electron_owners_retired':10,'remaining_explicit_nonion_owner_names':expected_nonion,'native_p2':'NOT_RUN','science':'SCIENCE_HOLD'}
              (out/'p0_source_input_identity.json').write_text(json.dumps(meta,indent=2,sort_keys=True)+'\n')
              print('417_INPUT_SHA_SOURCE_IDENTIFIED')
          PY
      - name: Execute exact current HEAD P0 contract (expected fail-closed)
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python source/ci/p1_ion_new_only_preflight.py \
            --zip evidence/repacked417.zip \
            --case 417 \
            --json evidence/unified_s6_417_newonly.json \
            --contract new-only > evidence/authoritative_p0.json 2> evidence/authoritative_p0_stderr.log
          RC=$?
          set -e
          P0_EXIT="$RC" python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('evidence/authoritative_p0.json').read_text())
          errors=r.get('errors',[])
          has_collision=any(x.startswith('P1_GENERATED_C2_FUNCTOR_OWNER_COLLISION_') for x in errors)
          result={'case':'417','authoritative_current_source_preflight_exit_code':int(os.environ['P0_EXIT']),'authoritative_p0_status':r['status'],'errors':errors,'native_fv_owner_count':r.get('native_fv_owner_count'),'c2_native_producer_collision_count':r.get('c2_native_producer_collision_count'),'c2_native_producer_collisions':r.get('c2_native_producer_collisions'),'fem_species':r.get('fem_species'),'fvm_species':r.get('fvm_species'),'audit_verdict':'HOLD_SOURCE_P0_WALL_CURRENT_OWNER_COLLISION_EXPECTED','native_p2':'NOT_RUN','native_p3_p4':'NOT_RUN','science':'SCIENCE_HOLD'}
          Path('evidence/p5_b1_p0_417_observed.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          assert int(os.environ['P0_EXIT'])!=0, 'P0 silently accepted known duplicate source owners'
          assert r['status']=='FAIL',r
          assert has_collision,errors
          assert r.get('native_fv_owner_count')==0,r
          assert r.get('c2_native_producer_collision_count',0)>=3,r
          print('P5_B1_EXPECTED_P0_OWNER_COLLISION_FAIL_CLOSED; Native NOT_RUN')
          PY
      - name: Upload immutable source-only fail-closed P0 audit result
        uses: actions/upload-artifact@v4
        with:
          name: issue671-p5-b1-417-p0-authoritative-input-audit
          path: |
            evidence/authoritative_p0.json
            evidence/authoritative_p0_stderr.log
            evidence/p0_source_input_identity.json
            evidence/p5_b1_p0_417_observed.json
            evidence/unified_s6_417_newonly.json
            evidence/repacked417.zip
          retention-days: 30
          if-no-files-found: error
