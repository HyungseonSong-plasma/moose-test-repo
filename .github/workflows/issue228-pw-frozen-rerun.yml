name: Issue-228 frozen P/W rerun

on:
  push:
    branches: [issue-228-pgw-parallel]
    paths:
      - '.github/workflows/issue228-pw-frozen-rerun.yml'
      - 'experiments/Issue228_pgw_parallel/**'

permissions:
  contents: read
  actions: read

jobs:
  frozen-pw:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: p_step1
            step_index: 1
            relocate: 0.0
          - name: p_step10
            step_index: 10
            relocate: 0.0
          - name: w50_step10
            step_index: 10
            relocate: 0.5
          - name: w100_step10
            step_index: 10
            relocate: 1.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download governed baseline snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p snapshot
          gh run download 34949699566 -n issue228-pgw-baseline-snapshot -D snapshot
          test -f snapshot/summary.json
          test -f snapshot/case/input_out.e
      - name: Frozen P/W discriminator ${{ matrix.name }}
        shell: bash
        env:
          CASE_NAME: ${{ matrix.name }}
          STEP_INDEX: ${{ matrix.step_index }}
          RELOCATE: ${{ matrix.relocate }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euxo pipefail
          python3 -m pip install --disable-pip-version-check --quiet -r requirements-evidence-engine.txt numpy scipy
          python3 -m py_compile experiments/Issue228_pgw_parallel/run.py
          python3 experiments/Issue228_pgw_parallel/run.py frozen \
            --snapshot-root snapshot \
            --step-index "$STEP_INDEX" \
            --relocate-fraction "$RELOCATE" \
            --results-root "issue228-pgw-${CASE_NAME}-results"
      - name: Upload frozen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue228-pgw-${{ matrix.name }}-rerun
          path: issue228-pgw-${{ matrix.name }}-results
          if-no-files-found: error
          retention-days: 7
