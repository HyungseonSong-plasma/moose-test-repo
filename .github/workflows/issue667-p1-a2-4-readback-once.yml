name: Issue667 P1-A2-4 exact-head final-11 focus ring byte readback (P0 only)
on:
  push:
    branches: [issue-667-p1-a2-4-focus-ring-20261117]
permissions:
  contents: read
  actions: read
concurrency:
  group: issue667-p1-a2-4-readback-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download only the pinned P1-0 artifact from successful exact-head source run
        uses: actions/download-artifact@v4
        with:
          name: issue667-p1-0-sourcepin-9c15a4f-44180190753-1
          run-id: 44180190753
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: capture
      - name: Independent byte readback and Focus ring FVBC verification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy, hashlib, json, re
          from pathlib import Path

          PIN="9c15a4f0e2cf8042cb0d4b2f18af31511021d168"
          ORIGIN="29d1acc6ef7969908b86719e4b95c73a1565136d"
          EXPECTED={
            "ion_focus_ring_dielectric":("log_O2p","ion_wall_number_flux"),
            "negative_ion_focus_ring_dielectric":("log_Om","negative_ion_wall_number_flux"),
            "atomic_positive_ion_focus_ring_dielectric":("log_Op","atomic_positive_ion_wall_number_flux")
          }
          ROOT=Path("capture")
          OUT=Path("readback")
          OUT.mkdir(exist_ok=True)

          def h(data): return hashlib.sha256(data).hexdigest()

          def objects_from_raw(data, ordinal, name):
              data.decode("utf-8")
              entries=[]
              stack=[]
              pos=0
              for lineno,line in enumerate(data.splitlines(keepends=True),1):
                  m=re.fullmatch(rb"\[([^\[\]]*)\]",line.strip())
                  if m:
                      symbol=m.group(1).decode("utf-8")
                      if symbol:
                          stack.append((symbol,pos,lineno))
                      elif stack:
                          object_name,start,line_start=stack.pop()
                          if len(stack)==1 and stack[0][0]=="FVBCs":
                              raw=data[start:pos+len(line)]
                              params={}
                              for setting in raw.decode("utf-8").splitlines()[1:-1]:
                                  m2=re.fullmatch(r"\s*([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*?)\s*",setting)
                                  if m2:
                                      if m2[1] in params: raise ValueError("duplicate parameter "+object_name)
                                      params[m2[1]]=m2[2].strip().strip("'\"")
                              entries.append(dict(section="FVBCs",object_name=object_name,layer_ordinal=ordinal,filename=name,block_sha256=h(raw),line_start=line_start,line_end=lineno,params=params))
                  pos+=len(line)
              if stack: raise ValueError("unbalanced input "+name)
              if re.search(rb"(?m)^\s*!include\b",data): raise ValueError("unresolved include "+name)
              return entries

          def check_targets(objs):
              for target,(var,flux) in EXPECTED.items():
                  matches=[o for o in objs if o["object_name"]==target]
                  if len(matches)!=1: raise ValueError("missing or duplicated "+target+": "+str(len(matches)))
                  p=matches[0]["params"]
                  for key,want in {"type":"PhysicsFVLogMolarDielectricFluxBC","variable":var,"signed_number_flux":flux,"boundary":"plasma_focus_ring"}.items():
                      if p.get(key)!=want: raise ValueError(f"{target}.{key}: {p.get(key)} != {want}")
                  if "factor" in p: raise ValueError("Unexpected explicit factor "+target)

          results={}
          for case in ("417","941"):
              folder=ROOT/("S6-"+case)
              if not folder.is_dir() or folder.is_symlink(): raise ValueError("Missing S6-"+case)
              manifest=json.loads((folder/"manifest.json").read_bytes())
              if manifest["source_head"]!=PIN or manifest["historical_head"]!=ORIGIN or manifest["case"]!=case:
                  raise ValueError("Wrong source identity "+case)
              names=manifest["input_order"]
              layers=manifest["layers"]
              if len(names)!=11 or len(set(names))!=11 or names[-1]!="migrated_continuity.i":
                  raise ValueError("Wrong 11-layer order "+case)
              if set(p.name for p in folder.iterdir())!=set(names)|{"manifest.json"}:
                  raise ValueError("Unexpected or missing artifact entries "+case)
              if len(layers)!=11: raise ValueError("Wrong layers count "+case)
              all_objects=[]; file_receipts=[]
              for ordinal,(name,record) in enumerate(zip(names,layers,strict=True),1):
                  if name.startswith(".") or "/" in name or "\\" in name or record["layer_ordinal"]!=ordinal or record["filename"]!=name:
                      raise ValueError("Malformed layer "+case+":"+name)
                  file=folder/name
                  if not file.is_file() or file.is_symlink(): raise ValueError("Unsafe layer "+name)
                  data=file.read_bytes()
                  if len(data)>150000 or not data: raise ValueError("Unexpected layer byte length "+name)
                  digest=h(data)
                  if digest!=record["file_sha256"] or len(data)!=record["size_bytes"]:
                      raise ValueError("Independent file SHA mismatch "+case+":"+name)
                  found=objects_from_raw(data,ordinal,name)
                  all_objects.extend(found)
                  file_receipts.append({"layer_ordinal":ordinal,"filename":name,"sha256":digest})
              # Independent cross-check vs the producer-generated manifest hashes
              manifest_index={(o["layer_ordinal"],o["section"],o["object_name"]):o["block_sha256"] for o in manifest["fv_object_blocks"]}
              all_fvbc=all_objects
              for entry in all_fvbc:
                  key=(entry["layer_ordinal"],entry["section"],entry["object_name"])
                  if manifest_index.get(key)!=entry["block_sha256"]:
                      raise ValueError("Independent block SHA mismatch "+case+":"+entry["object_name"])
              check_targets(all_fvbc)
              targets=[x for x in all_fvbc if x["object_name"] in EXPECTED]
              # Confirm the negative gate rejects omission, duplication, changed variable.
              for mutation in ("missing","duplicate","wrong_variable"):
                  bad=copy.deepcopy(all_fvbc)
                  target=EXPECTED.keys().__iter__().__next__()
                  if mutation=="missing":bad=[x for x in bad if x["object_name"]!=target]
                  elif mutation=="duplicate":bad.append(copy.deepcopy(next(x for x in bad if x["object_name"]==target)))
                  else:next(x for x in bad if x["object_name"]==target)["params"]["variable"]="log_wrong"
                  try:check_targets(bad)
                  except ValueError:pass
                  else:raise ValueError("Negative self-test incorrectly accepted: "+mutation)
              results[case]={"status":"PASS_ACTUAL_SCRATCH_D_BYTES", "file_count":len(file_receipts),
                             "files":file_receipts,
                             "objects":targets,"negative_controls_rejected":3}
              for t in targets:
                  print(f"P1_A2_4_S6_{case}_FOCUS_RING {t['object_name']} layer={t['layer_ordinal']} sha256={t['block_sha256']}",flush=True)
              print(f"P1_A2_4_S6_{case}_FILE_SHA=11/11_PASS FOCUS_RING=3/3_PASS NEGATIVE=3/3_REJECTED",flush=True)
          if set(p.name for p in ROOT.iterdir())!={"S6-417","S6-941","status.json"}:
              raise ValueError("Unexpected top-level artifact entries")
          status=json.loads((ROOT/"status.json").read_bytes())
          if status.get("status")!="SOURCE_BYTES_PINNED_PENDING_INDEPENDENT_READBACK":
              raise ValueError("Producer status unexpected")
          for case in ("417","941"):
              if status["cases"].get(case)!="SOURCE_BYTE_PIN_PASS":raise ValueError("Source case not pinned "+case)
          report={"schema":"issue667.p1_a2_4.final_11_readback.v1","task_id":"P1-A2-4",
                  "source_head":PIN,"producer_run_id":44180190753,"producer_artifact_id":14372315897,
                  "sourcepin_artifact_digest_expected":"sha256:962d71a4689efac7b2fd24e10bc82c912a0ac5e5956aaaf277c8f0f6526e2620",
                  "status":"PASS_ACTUAL_SCRATCH_D_INPUT_BYTE_VERIFIED",
                  "scope":"Exact PR665 HEAD hybrid Scratch D P1-0 artifact; NOT New-only/Native P2",
                  "cases":results,
                  "limitations":["Full P1-E 26-owner integration not performed",
                                 "No physical runtime/P2/P3/P4 executed",
                                 "No private rate bytes read or published",
                                 "This verifies sourcepin Scratch D, not later New-only cutover"],
                  "science":"SCIENCE_HOLD"}
          (OUT/"p1-a2-4-final11-readback.json").write_text(json.dumps(report,sort_keys=True,indent=2)+"\n")
          print("P1_A2_4_FINAL11_P0_PASS BOTH_CASES",flush=True)
          PY
      - name: Upload only Focus ring readback receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue667-p1-a2-4-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: readback/
          if-no-files-found: warn
          retention-days: 30
