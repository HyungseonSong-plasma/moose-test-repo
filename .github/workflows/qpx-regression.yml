name: QPX static validation

on:
  push:
    branches: [main]
    paths:
      - 'qpx_harness/**'
      - 'performance/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/qpx-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile harness and scripts
        run: python3 -m compileall -q qpx_harness scripts

      - name: Parser-symbol preflight self-test
        run: python3 scripts/qpx.py preflight --self-test

      - name: Temporal CSV self-test
        run: python3 scripts/qpx.py temporal-csv --self-test

      - name: Performance measurement core self-test
        run: python3 -m qpx_harness.performance_core --self-test

      - name: Managed performance smoke self-test
        run: python3 -m qpx_harness.performance_smoke --self-test

      - name: Performance investigation self-test
        run: python3 -m qpx_harness.performance_investigation --self-test

      - name: Resilient transport analysis self-test
        run: python3 -m qpx_harness.performance_transport_probe_resilient --self-test

      - name: Targeted transport probe self-test
        run: python3 -m qpx_harness.performance_transport_probe_direct --self-test

      - name: D_mix cache feasibility self-test
        run: python3 -m qpx_harness.performance_cache_audit --self-test

      - name: Runtime scope notice
        run: |
          echo 'Static validation only.'
          echo 'Canonical P2/P3 regression requires the user-local qpx-opt runtime and is not claimed by GitHub Actions.'
