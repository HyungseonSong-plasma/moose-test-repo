name: QPX regression

on:
  push:
    branches: [main]
    paths:
      - 'tests/**'
      - 'scripts/**'
      - 'bin/qpx-opt'
      - '.github/workflows/qpx-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect executable
        run: |
          chmod +x bin/qpx-opt
          file bin/qpx-opt
          ldd bin/qpx-opt || true

      - name: Canonical regressions
        run: python3 scripts/run_all.py --type canonical

      - name: Diagnostic investigations
        if: always()
        continue-on-error: true
        run: python3 scripts/run_all.py --type diagnostic
