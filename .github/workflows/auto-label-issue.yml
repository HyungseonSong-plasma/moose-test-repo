name: Auto-label issue by title

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Apply labels from title
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title.toLowerCase();
            const labels = [];

            // All matching labels are applied (multiple allowed)
            const rules = [
              { keywords: ['bug', 'error', 'fail', 'broken', 'crash', 'fix'], label: 'bug' },
              { keywords: ['refactor', 'cleanup', 'restructure', 'rewrite'], label: 'refactor' },
              { keywords: ['feature', 'add', 'support', 'enhancement', 'new'], label: 'enhancement' },
              { keywords: ['development', 'implement', 'code', 'dev'], label: 'development' },
              { keywords: ['operation', 'ops', 'llm', 'automation'], label: 'operation' },
            ];

            for (const rule of rules) {
              if (rule.keywords.some(k => title.includes(k))) {
                labels.push(rule.label);
              }
            }

            if (labels.length === 0) {
              console.log('No matching labels for title:', title);
              return;
            }

            // Only add labels that are not already present
            const existing = (context.payload.issue.labels || []).map(l => l.name);
            const toAdd = [...new Set(labels)].filter(l => !existing.includes(l));

            if (toAdd.length === 0) {
              console.log('All matching labels already present');
              return;
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              labels: toAdd,
            });

            console.log('Added labels:', toAdd);
