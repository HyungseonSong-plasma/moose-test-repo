# PR #488: real native 400W/100us S5-417-407 replay against immutable artifact.
# Run on same-repository PR only, without merging the candidate.
name: Issue477 PR488 S5-417-407 linear native parity
run-name: PR488 S5-417-407 linear ${{ github.event.pull_request.head.sha }}
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/issue477-pr488-s5-linear-parity.yml
      - physics_app/include/materials/PhysicsElectronImpactRateMaterial.h
      - physics_app/src/materials/PhysicsElectronImpactRateMaterial.C
      - experiments/Issue477_electron_shape/compare_s5_417_407_linear_native.py

permissions:
  contents: read
  actions: read

concurrency:
  group: issue477-pr488-linear-parity-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  native-parity:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: Native S5-417-407 / MOOSE LinearInterpolation 400W
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        case: [S5-417-407]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PINNED_SOURCE: 29d1acc6ef7969908b86719e4b95c73a1565136d
      PINNED_EEDF: 35534a522fa48ccb5222339c5040040630eef31e623e1c53f1e1c4540d2d653b
      OXYGEN_RESEARCH_400: '1'
      OXYGEN_RESEARCH_FULL24: '0'
      OXYGEN_RESEARCH_EI2738_FORMULA: '0'
      OXYGEN_RESEARCH_QUICK_5MIN: '0'
      BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
      CHEM: experiments/Issue395_powered_chemistry_ladder
      BASELINE_ARTIFACT: '13641179390'
      BASELINE_RUN: '42521896067'
      BASELINE_NAME: issue477-s5-o2-S5-417-407-400W-100us-8ed89338e24595029c124bca0ccc93efd9bf70c9
      BASELINE_DIGEST: sha256:7dae80cfe050aadc9e2e5d1cea19167a317b73eeb9463a96ff8be344c4c49d4
    steps:
      - name: Checkout exact merged control / current plotting implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: control
          fetch-depth: 1

      - name: Checkout pinned Oxygen14 physics implementation
        uses: actions/checkout@v4
        with:
          ref: 29d1acc6ef7969908b86719e4b95c73a1565136d
          path: target/pinned_oxygen14
          fetch-depth: 1

      - name: P0 pin original S4 and add exactly one O2 consumer
        id: p0
        shell: bash
        env:
          PRIVATE_RATES_B64: ${{ secrets.OXYGEN24_RATES_TAR_XZ_B64 }}
        run: |
          set -euo pipefail
          CONTROL_ROOT="$GITHUB_WORKSPACE/control"
          cd target/pinned_oxygen14
          test "$(git rev-parse HEAD)" = "$PINNED_SOURCE"
          test "$(git -C "$CONTROL_ROOT" rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python3 -m venv "$GITHUB_WORKSPACE/.issue477_venv"
          "$GITHUB_WORKSPACE/.issue477_venv/bin/python" -m pip install --disable-pip-version-check --quiet numpy==2.1.2 scipy==1.14.1 matplotlib==3.9.2
          source "$GITHUB_WORKSPACE/.issue477_venv/bin/activate"
          SOURCE=".github/oxygen25_eedf/initial_mixture_23xsec_transport.txt"
          DEST="experiments/Issue91_real_qvt_r3/r3_e0/electron_moments.txt"
          test "$(sha256sum "$SOURCE" | cut -d' ' -f1)" = "$PINNED_EEDF"
          cp -- "$SOURCE" "$DEST"
          test "$(sha256sum "$DEST" | cut -d' ' -f1)" = "$PINNED_EEDF"
          export CHATGPT_WORK_BASE_SHA="$PINNED_SOURCE"
          bash "$CHEM/issue397_l1_power_scan_replay.sh" prepare 400
          python3 .github/scripts/oxygen_legacy6_latest_100us.py --power-w 400 --prepare
          mkdir -p "$CHEM/c0_400_p2_preflight"
          export PYTHONPATH="$CONTROL_ROOT"
          python3 "$CONTROL_ROOT/bin/physics.py" oxygen-c0 \
            --root "$PWD" \
            --base-input "$PWD/$CHEM/rf_elastic_diss_ion_ei20_ei01_400w_adjacent_sheath_wall_closed_100us_dt1000ns.i" \
            --rf-parent "$PWD/$CHEM/rf_elastic_multiapp_parent_400w_100us_dt1000ns_overlay.i" \
            --output "$PWD/$CHEM/c0_400_p2_preflight/c0_manifest.json"
          test -n "$PRIVATE_RATES_B64" || { echo "::error::Private rate archive missing"; exit 22; }
          mkdir -p /tmp/oxygen25/private_rates
          printf '%s' "$PRIVATE_RATES_B64" | base64 --decode | tar -xJ -C /tmp/oxygen25/private_rates --no-same-owner
          python3 "$CONTROL_ROOT/experiments/Issue477_electron_shape/prepare_s4_o2_consumers.py" \
            --case "${{ matrix.case }}" --private-dir /tmp/oxygen25/private_rates --control-root "$CONTROL_ROOT"
          test -s "$CHEM/issue477_s5_o2_consumers/${{ matrix.case }}/case_manifest.json"
          rm -rf -- /tmp/oxygen25/private_rates
          mkdir -p "$CHEM/issue477_s5_o2_consumers/${{ matrix.case }}/comparison/candidate/run"
          echo "PR488_S5_417_407_ORIGINAL_INPUT_P0_PASS"

      - name: P1 build exact PR C++ changes on pinned native PhysicsApp
        id: p1
        shell: bash
        run: |
          set -euo pipefail
          cd target/pinned_oxygen14
          H=physics_app/include/materials/PhysicsElectronImpactRateMaterial.h
          C=physics_app/src/materials/PhysicsElectronImpactRateMaterial.C
          test "$(git rev-parse HEAD)" = "$PINNED_SOURCE"
          test -s "$GITHUB_WORKSPACE/control/$H" && test -s "$GITHUB_WORKSPACE/control/$C"
          grep -Fq 'LinearInterpolation _rate_interpolation;' "$GITHUB_WORKSPACE/control/$H"
          grep -Fq 'return _rate_interpolation.sample(coordinate);' "$GITHUB_WORKSPACE/control/$C"
          grep -Fq 'registerMooseObject("PhysicsApp", PhysicsElectronImpactRateMaterial);' "$GITHUB_WORKSPACE/control/$C"
          cp "$GITHUB_WORKSPACE/control/$H" "$H"
          cp "$GITHUB_WORKSPACE/control/$C" "$C"
          cmp "$H" "$GITHUB_WORKSPACE/control/$H"
          cmp "$C" "$GITHUB_WORKSPACE/control/$C"
          mapfile -t CHANGED < <(git diff --name-only -- physics_app)
          test "${#CHANGED[@]}" -eq 2
          test "${CHANGED[0]}" = "$H"
          test "${CHANGED[1]}" = "$C"
          ROOT="$CHEM/issue477_s5_o2_consumers/${{ matrix.case }}"
          {
            echo "pinned_physics_sha=$PINNED_SOURCE"
            echo "candidate_pr_head=${{ github.event.pull_request.head.sha }}"
            echo "moose_object_registration=PhysicsElectronImpactRateMaterial"
            echo "modified_physics_files=2"
            sha256sum "$H" "$C"
            echo "baseline_artifact_id=$BASELINE_ARTIFACT"
            echo "science=HOLD"
          } > "$ROOT/comparison/candidate/source_provenance.txt"
          export CHATGPT_WORK_BASE_SHA="$PINNED_SOURCE"
          bash "$CHEM/issue397_l1_power_scan_replay.sh" build 400
          test -x physics_app/physics-opt
          echo PR488_S5_NATIVE_NEW_LINEAR_BUILD_PASS

      - name: P2 actual native check-input with audited case overlays
        id: p2
        shell: bash
        run: |
          set -euo pipefail
          cd target/pinned_oxygen14
          CASE="${{ matrix.case }}"
          MANIFEST="$CHEM/issue477_s5_o2_consumers/$CASE/case_manifest.json"
          python3 - "$MANIFEST" <<'PY'
          import sys, json, hashlib
          from pathlib import Path
          record=json.loads(Path(sys.argv[1]).read_text())
          assert record["case"] in {
              "S5-417-412","S5-417-407","S5-417-2069","S5-417-H25",
              "S5-941-412","S5-941-407","S5-941-2069","S5-941-H25",
          }
          assert record["parent_case"] in ("S4-401-417", "S4-401-941")
          assert record["added_channel"] in ("EI-412","EI-407","EI-2069","H25")
          assert record["fresh_t0"] is True
          assert record["science_acceptance"] == "HOLD"
          parent_ion = "EI-"+record["parent_case"].rsplit("-",1)[1]
          assert record["chemistry_channels"] == ["EI-02","EI-17","EI-415","EI-401",parent_ion,record["added_channel"]]
          assert len(record["parent_inputs_sha256"]) == 7
          for path,digest in record["parent_inputs_sha256"].items():
              assert record["input_sha256"][path] == digest
          for path,digest in record["input_sha256"].items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==digest,path
          assert record["science_acceptance"]=="HOLD"
          print("ISSUE477_P2_PROVENANCE_INPUT_HASH_PASS")
          PY
          mapfile -t INPUTS < <(python3 -c 'import json,sys;print("\n".join(json.load(open(sys.argv[1]))["input_paths"]))' "$MANIFEST")
          test "${#INPUTS[@]}" -eq 8
          docker run --rm --entrypoint /bin/bash --user 0:0 \
            --workdir /workspace -v "$PWD:/workspace" "$BUILD_BASE_REF" -lc \
            'set -euo pipefail; source /environment; physics_app/physics-opt --check-input "$@"' -- -i "${INPUTS[@]}" \
            2>&1 | tee "$CHEM/issue477_s5_o2_consumers/$CASE/check_input.log"
          echo "ISSUE477_P2_NATIVE_CHECK_INPUT_PASS $CASE"

      - name: P3 genuine fresh 0-100us native solve
        id: p3
        shell: bash
        run: |
          set -euo pipefail
          cd target/pinned_oxygen14
          CASE="${{ matrix.case }}"
          ROOT="$CHEM/issue477_s5_o2_consumers/$CASE"
          MANIFEST="$ROOT/case_manifest.json"
          mapfile -t INPUTS < <(python3 -c 'import json,sys;print("\n".join(json.load(open(sys.argv[1]))["input_paths"]))' "$MANIFEST")
          test -s "$ROOT/check_input.log"
          test -s "$ROOT/comparison/candidate/source_provenance.txt"
          test ! -e "$ROOT/comparison/candidate/run/plasma.e"
          start="$(date +%s)"
          set +e
          timeout -s TERM -k 60s 19800s docker run --rm --entrypoint /bin/bash --user 0:0 \
            --workdir /workspace -v "$PWD:/workspace" "$BUILD_BASE_REF" -lc \
            'set -euo pipefail; source /environment; physics_app/physics-opt "$@"' \
            -- -i "${INPUTS[@]}" "Outputs/file_base=$ROOT/run/plasma" 2>&1 | tee "$ROOT/comparison/candidate/runtime.log"
          code="${PIPESTATUS[0]}"
          set -e
          elapsed="$(( $(date +%s) - start ))"
          printf 'case=%s\nsource_sha=%s\nend_time_s=0.0001\nexpected_steps=460\nsolver_exit=%s\nelapsed_s=%s\nscience=HOLD\n' \
            "$CASE" "$PINNED_SOURCE" "$code" "$elapsed" > "$ROOT/comparison/candidate/runtime_status.txt"
          echo "PR488_S5_CANDIDATE_NATIVE_CASE=$CASE EXIT=$code WALL_SECONDS=$elapsed"
          test "$code" -eq 0
          test -s "$ROOT/comparison/candidate/run/plasma.e"
          test -s "$ROOT/comparison/candidate/run/plasma.csv"


      - name: P4 compare to original complete 100us S5 artifact by Exodus CSV and Newton
        id: compare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT="target/pinned_oxygen14/$CHEM/issue477_s5_o2_consumers/S5-417-407"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$BASELINE_ARTIFACT" \
            --jq '.digest' | grep -Fx "$BASELINE_DIGEST"
          mkdir -p "$GITHUB_WORKSPACE/immutable_baseline"
          gh run download "$BASELINE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "$BASELINE_NAME" --dir "$GITHUB_WORKSPACE/immutable_baseline"
          BASE="$GITHUB_WORKSPACE/immutable_baseline/issue477_s5_o2_consumers/S5-417-407"
          test -s "$BASE/run/plasma.e"
          test -s "$BASE/run/plasma.csv"
          test -s "$BASE/runtime.log"
          test -s "$ROOT/comparison/candidate/run/plasma.e"
          source "$GITHUB_WORKSPACE/.issue477_venv/bin/activate"
          python3 "$GITHUB_WORKSPACE/control/experiments/Issue477_electron_shape/compare_s5_417_407_linear_native.py" \
            --baseline "$BASE" \
            --candidate "$GITHUB_WORKSPACE/$ROOT/comparison/candidate" \
            --output "$GITHUB_WORKSPACE/$ROOT/comparison/parity_report.json"
          echo "PR488_NATIVE_NUMERICAL_PARITY_COMPLETE_DIRECT_JACOBIAN_NOT_EVALUATED"

      - name: Always upload native parity evidence even if the solver fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr488-S5-417-407-native-linear-parity-${{ github.event.pull_request.head.sha }}
          retention-days: 90
          compression-level: 3
          if-no-files-found: warn
          path: |
            target/pinned_oxygen14/experiments/Issue395_powered_chemistry_ladder/issue477_s5_o2_consumers/S5-417-407/case_manifest.json
            target/pinned_oxygen14/experiments/Issue395_powered_chemistry_ladder/issue477_s5_o2_consumers/S5-417-407/comparison/**
