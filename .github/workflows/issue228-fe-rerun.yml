name: Issue-228 coupled FE Poisson harness-corrected rerun

on:
  push:
    branches: [issue-228-p2-e1-w2-pg]
    paths:
      - '.github/workflows/issue228-fe-rerun.yml'
      - 'experiments/Issue228_fe_rerun.py'

permissions:
  contents: read

env:
  BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
  MOOSE_SHA: 9f388366ccf38b9c34542ec5561198249fde0ac9
  CRANE_SHA: ba26970cf419dcac563a20ed7079d445bc6341c3
  SQUIRREL_SHA: 16a26d504f3ee11161a86d4e3ebf3c0e5f2afbb1
  ZAPDOS_SHA: 9eceffbc46048c3760bbfa9a7f1ca681ae35af1d

jobs:
  fe-coupled:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        mode: [fe_baseline, fe_wafer_matched, fe_right_matched]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Run corrected coupled FE case ${{ matrix.mode }}
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euxo pipefail
          source physics_app/dependencies.lock
          test "$MOOSE" = "$MOOSE_SHA"
          test "$CRANE" = "$CRANE_SHA"
          test "$SQUIRREL" = "$SQUIRREL_SHA"
          test "$ZAPDOS" = "$ZAPDOS_SHA"
          docker pull "$BUILD_BASE_REF"
          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace \
            -e MODE="$MODE" -v "$PWD:/workspace" "$BUILD_BASE_REF" -lc '
              set -euxo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              export PYTHONPATH=/workspace
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt
              uv pip install --system --python "$(command -v python3)" -r requirements-evidence-engine.txt
              uv pip install --system --python "$(command -v python3)" scipy
              python3 -m py_compile experiments/Issue228_fe_rerun.py
              make -C physics_app -j2
              python3 experiments/Issue228_fe_rerun.py \
                --mode "$MODE" --physics-opt physics_app/physics-opt \
                --results-root "issue228-rerun-fe-${MODE}-results" --timeout 1800
            '
      - name: Upload corrected FE evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue228-rerun-fe-${{ matrix.mode }}
          path: issue228-rerun-fe-${{ matrix.mode }}-results
          if-no-files-found: error
          retention-days: 7
