# Issue #432: code-generation/testing has no private data or archive secret.
# Processing approval: issues/432#issuecomment-6631358844. PNG disclosure is separate.
# Maintainers must configure the mcs-lookup-comparison Environment with required
# reviewers and prevent self-review. Missing/unprotected environments fail closed.
# Repository variables are maintainer attestations, not automatic review-content
# verification. Verify linked authors, exact commit, and disclosure scope first.
name: MCS oxygen reaction rates versus private MOOSE lookup
run-name: MCS MOOSE 3x3 linear comparison ${{ github.sha }}
on:
  push:
    branches: [issue-432-mcs-moose-3x3-linear]
  pull_request:
    branches: [mcs-ei407-ei415-compare-20261104]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed 40-character commit SHA; must equal the dispatched ref
        required: true
        type: string
      output_kind:
        description: Derived output release kind; ratios require distinct numeric disclosure approval
        required: true
        type: choice
        default: png
        options: [png, ratios]
permissions:
  contents: read
concurrency:
  group: mcs-lookup-comparison-${{ github.ref }}
  cancel-in-progress: false
jobs:
  synthetic-tests:
    name: Secret-free comparison and security tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only public test dependencies
        run: python -m pip install 'pytest>=8,<9' -r requirements-mcs-comparison.txt
      - name: Test with synthetic Lookup tables only
        run: python -m pytest -q tests/test_oxygen_mcs_rate_compare.py tests/test_mcs_comparison_workflow.py tests/test_oxygen_mcs_nine_ratio_ci.py

  approval-gate:
    name: Verify exact-head code and PNG disclosure approvals
    if: github.event_name == 'workflow_dispatch'
    needs: synthetic-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      approved_sha: ${{ steps.approvals.outputs.approved_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify maintainer attestations and protected Environment
        id: approvals
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          MCS_CODE_REVIEWED_SHA: ${{ vars.MCS_CODE_REVIEWED_SHA }}
          MCS_CODE_REVIEW_RECORD_URL: ${{ vars.MCS_CODE_REVIEW_RECORD_URL }}
          MCS_PNG_PUBLIC_DISCLOSURE_SHA: ${{ vars.MCS_PNG_PUBLIC_DISCLOSURE_SHA }}
          MCS_PNG_PUBLIC_DISCLOSURE_RECORD_URL: ${{ vars.MCS_PNG_PUBLIC_DISCLOSURE_RECORD_URL }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 .github/scripts/mcs_lookup_archive_ci.py --check-approvals
      - name: Verify distinct numeric ratio publication approval
        if: inputs.output_kind == 'ratios'
        env:
          MCS_RATIO_PUBLIC_DISCLOSURE_SHA: ${{ vars.MCS_RATIO_PUBLIC_DISCLOSURE_SHA }}
          MCS_RATIO_PUBLIC_DISCLOSURE_RECORD_URL: ${{ vars.MCS_RATIO_PUBLIC_DISCLOSURE_RECORD_URL }}
        run: python3 .github/scripts/mcs_lookup_archive_ci.py --check-ratio-disclosure

  compare-oxygen-rate-coefficients:
    name: Approved private runner and PNG-only output
    if: >-
      github.event_name == 'workflow_dispatch' &&
      needs.approval-gate.outputs.approved_sha == github.sha &&
      inputs.expected_sha == github.sha &&
      vars.MCS_CODE_REVIEWED_SHA == github.sha &&
      vars.MCS_PNG_PUBLIC_DISCLOSURE_SHA == github.sha
    needs: [synthetic-tests, approval-gate]
    environment: mcs-lookup-comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public plotting dependency before private restoration
        run: python -m pip install -r requirements-mcs-comparison.txt
      - name: Create runner-owned restricted working directory
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          PRIVATE_ROOT="$RUNNER_TEMP/mcs-lookup-comparison-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$PRIVATE_ROOT"
          mkdir -m 700 "$PRIVATE_ROOT"
          touch "$PRIVATE_ROOT/.owned-by-comparison-job"
          {
            printf 'PRIVATE_ROOT=%s\n' "$PRIVATE_ROOT"
            printf 'MPLCONFIGDIR=%s/mpl\n' "$PRIVATE_ROOT"
          } >> "$GITHUB_ENV"
      - name: Restore existing private Lookup archive only inside approved runner
        env:
          PRIVATE_RATES_B64: ${{ secrets.OXYGEN24_RATES_TAR_XZ_B64 }}
        run: |
          set -euo pipefail
          umask 077
          python3 .github/scripts/mcs_lookup_archive_ci.py --restore "$PRIVATE_ROOT/private_rates"
      - name: Render approved linear comparison without exporting numeric files
        if: inputs.output_kind == 'png'
        run: |
          set -euo pipefail
          umask 077
          if ! python3 .github/scripts/oxygen_mcs_rate_compare_ci.py \
            --mode linear-3x3 \
            --rate-dir "$PRIVATE_ROOT/private_rates" \
            --public-rate-dir physics_app/data/electron_impact \
            --mcs-csv experiments/Issue395_powered_chemistry_ladder/oxygen_mcs_lookup_compare_14.csv \
            --additional-mcs-csv experiments/Issue395_powered_chemistry_ladder/mcs_oxygen_five_omitted_reactions_20261104.csv \
            --additional-mcs-csv experiments/Issue395_powered_chemistry_ladder/mcs_oxygen_supplemental_reactions_20261104.csv \
            --require-complete-mcs \
            --output-dir "$PRIVATE_ROOT/output" > "$PRIVATE_ROOT/comparison.log" 2>&1; then
            echo '::error::Comparison failed; private diagnostics withheld'
            exit 30
          fi
          python3 .github/scripts/mcs_lookup_archive_ci.py --check-png "$PRIVATE_ROOT/output/MCS_MOOSE_3x3_LINEAR.png"
      - name: Compute nine reversible MOOSE/MCS ratios inside approved runner
        if: inputs.output_kind == 'ratios'
        run: |
          set -euo pipefail
          umask 077
          if ! python3 .github/scripts/oxygen_mcs_nine_ratio_ci.py \
            --rate-dir "$PRIVATE_ROOT/private_rates" \
            --public-rate-dir physics_app/data/electron_impact \
            --mcs-csv experiments/Issue395_powered_chemistry_ladder/oxygen_mcs_lookup_compare_14.csv \
            --additional-mcs-csv experiments/Issue395_powered_chemistry_ladder/mcs_oxygen_five_omitted_reactions_20261104.csv \
            --additional-mcs-csv experiments/Issue395_powered_chemistry_ladder/mcs_oxygen_supplemental_reactions_20261104.csv \
            --output-dir "$PRIVATE_ROOT/output" > "$PRIVATE_ROOT/comparison.log" 2>&1; then
            echo '::error::Ratio comparison failed; private diagnostics withheld'
            exit 31
          fi
          python3 .github/scripts/mcs_lookup_archive_ci.py --check-ratios \
            "$PRIVATE_ROOT/output/MCS_MOOSE_9_reaction_ratios.csv"
      - name: Publish only explicitly approved derived PNG
        if: inputs.output_kind == 'png'
        uses: actions/upload-artifact@v4
        with:
          name: MCS_MOOSE_3x3_LINEAR
          path: ${{ runner.temp }}/mcs-lookup-comparison-${{ github.run_id }}-${{ github.run_attempt }}/output/MCS_MOOSE_3x3_LINEAR.png
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false
      - name: Publish separately approved nine-reaction numeric ratio CSV only
        if: inputs.output_kind == 'ratios'
        uses: actions/upload-artifact@v4
        with:
          name: MCS_MOOSE_9_reaction_ratios
          path: ${{ runner.temp }}/mcs-lookup-comparison-${{ github.run_id }}-${{ github.run_attempt }}/output/MCS_MOOSE_9_reaction_ratios.csv
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false
      - name: Remove private tables, logs, caches, and generated PNG
        if: always()
        run: |
          set -euo pipefail
          if test -n "${PRIVATE_ROOT:-}" && test -f "$PRIVATE_ROOT/.owned-by-comparison-job"; then
            rm -rf -- "$PRIVATE_ROOT"
          fi
