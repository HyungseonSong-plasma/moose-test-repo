name: full monolithic L4 fast optimization

on:
  push:
    branches:
      - prototype-fully-implicit-electron-poisson
    paths:
      - '.ci_triggers/full-monolithic-l4-fastopt'

permissions:
  contents: read
  packages: read

env:
  BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008

jobs:
  l4-fastopt:
    name: L4-fastopt-${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, reverse, schur, reverse-schur]
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Pull build image
        run: docker pull "$BUILD_BASE_REF"

      - name: Build and run L4 fast optimization ${{ matrix.variant }}
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash --user 0:0 \
            -e VARIANT="$VARIANT" \
            --workdir /workspace \
            -v "$GITHUB_WORKSPACE:/workspace" \
            "$BUILD_BASE_REF" -lc '
              set -euo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory /opt/physics_vendor/moose
              git config --global --add safe.directory /opt/physics_vendor/crane
              git config --global --add safe.directory /opt/physics_vendor/squirrel
              git config --global --add safe.directory /opt/physics_vendor/zapdos
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt

              make -C physics_app -j2
              cd experiments/heavy_fast_logmolar_coupling

              python3 prepare_full_monolithic_l4_fastopt.py --variant "$VARIANT"
              SAFE_VARIANT="${VARIANT//-/_}"
              INPUT="full_monolithic_l4_fastopt_${SAFE_VARIANT}.i"
              OUTDIR="output_l4_fastopt_${SAFE_VARIANT}"
              FILEBASE="full_monolithic_log_simplex_l4_fastopt_${SAFE_VARIANT}"

              ../../physics_app/physics-opt -i "$INPUT" --check-input

              rm -rf "$OUTDIR"
              mkdir -p "$OUTDIR"
              set +e
              /usr/bin/time \
                -f "wall_seconds=%e\nuser_seconds=%U\nsystem_seconds=%S\nmax_rss_kb=%M" \
                -o "$OUTDIR/wall_time.txt" \
                timeout --signal=TERM 12m stdbuf -oL -eL \
                ../../physics_app/physics-opt -i "$INPUT" \
                > "$OUTDIR/run.log" 2>&1
              rc=$?
              set -e

              echo "run_rc=$rc" | tee "$OUTDIR/status.txt"
              echo "variant=$VARIANT" | tee "$OUTDIR/matrix.txt"
              cp "$INPUT" prepare_full_monolithic_l4_fastopt.py \
                 prepare_full_monolithic_log_simplex_level_matrix.py \
                 prepare_full_monolithic_log_simplex.py \
                 "$OUTDIR/"
              cp "${FILEBASE}_out.csv" "$OUTDIR/" 2>/dev/null || true
              cp "${FILEBASE}_out.e" "$OUTDIR/" 2>/dev/null || true
              grep -E "Time Step|SNES|KSP|Nonlinear|Linear|fieldsplit|CONVERGED|DIVERGED|Solve Did NOT Converge|log_ne|log_energy|potential|ERROR" \
                "$OUTDIR/run.log" > "$OUTDIR/summary.txt" || true
              tail -n 320 "$OUTDIR/run.log" || true
              exit "$rc"
            '

      - name: Upload L4 fast optimization ${{ matrix.variant }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l4-fastopt-${{ matrix.variant }}
          path: experiments/heavy_fast_logmolar_coupling/output_l4_fastopt_*/**
          retention-days: 30
