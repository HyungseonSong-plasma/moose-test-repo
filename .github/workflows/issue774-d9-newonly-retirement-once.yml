# #774 D9: branch-only source/CI contract replay; no Native rebuild or science.
name: Issue774 D9 New-only thermal retirement CI closure
on:
  pull_request:
    branches: [issue-774-d5-newonly-thermal-ab]
    types: [opened, synchronize, reopened]
    paths:
      - 'ci/guards/issue774_newonly_fvkernel_retirement.py'
      - 'tests/test_issue774_newonly_fvkernel_retirement.py'
      - '.github/workflows/ci.yml'
      - 'ci/workflow_templates/general-ci.yml'
      - '.github/workflows/issue774-d9-newonly-retirement-once.yml'
permissions:
  contents: read

jobs:
  exact_newonly_contract:
    name: D9 exact-HEAD New-only source and P6 CI owner (no Native)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == 'HyungseonSong-plasma/moose-test-repo'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout immutable PR HEAD, never merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Assert no worktree/source drift
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Validate existing P6 Workflow template and fail-closed CI semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/workflow_harness.py --self-test
          python3 ci/workflow_harness.py --check
          python3 ci/guards/p6_ci_workflow_safety_guard.py --self-test --check
      - name: Run canonical FVKernel Native registration source P0 and D9 negatives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 -m unittest discover -s tests -p test_fvkernel_native_usage_census.py -v 2>&1 \
            | tee evidence/d5_retained_source_census_tests.log
          python3 -m unittest discover -s tests -p test_issue774_newonly_fvkernel_retirement.py -v 2>&1 \
            | tee evidence/d9_newonly_ci_contract_tests.log
          python3 -m py_compile ci/guards/issue774_newonly_fvkernel_retirement.py
      - name: Export exact-head Git-tree retired Factory reference inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/guards/issue774_newonly_fvkernel_retirement.py \
            --expected-head "$SOURCE_HEAD" \
            --output evidence/d9_newonly_retirement_ci_receipt.json
      - name: Archive sanitized exact source P0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue774-d9-newonly-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
