# Issue #535 temporary one-shot transport only; do not merge to main.
# User approval: Issue #535 comment 6943043495. This runner only POSTs
# one authenticated workflow_dispatch to the UNMODIFIED manual S6 workflow.
# Clean up this temporary executable after readback of actual dispatch.
name: Issue535 S6 full 100us authorized one-shot dispatch transport
on:
  push:
    branches: [issue535-s6-p3-dispatch-once-20261117]
    paths:
      - .github/workflows/issue535-s6-p3-dispatch-once.yml
permissions:
  actions: write
  contents: read
  issues: read
concurrency:
  group: issue535-s6-p3-authorized-once-20261117
  cancel-in-progress: false
jobs:
  dispatch-manual-s6:
    if: ${{ github.event_name == 'push' && github.ref_name == 'issue535-s6-p3-dispatch-once-20261117' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN_SHA: 8263fbc1801f213b98183ba4876299041cd01dac
      EXPECTED_WORKFLOW_BLOB: 6c673628eac4693abe0d74b04fc31578a39b3971
      APPROVAL_TOKEN: ISSUE541_S6_400W_100US_BOTH_CASES_APPROVED
    steps:
      - name: Fail closed on source, operator approval, event, or duplicate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "HyungseonSong-plasma/moose-test-repo"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF_NAME" = "issue535-s6-p3-dispatch-once-20261117"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          jq -e --arg m "issue535-approved-s6-full-p3-dispatch-at-8263-once" '.head_commit.message == $m' "$GITHUB_EVENT_PATH" >/dev/null
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          actual="$(curl -fsS "${headers[@]}" "$API/branches/main" | jq -r '.commit.sha')"
          test "$actual" = "$EXPECTED_MAIN_SHA"
          blob="$(curl -fsS "${headers[@]}" "$API/contents/.github/workflows/issue541-arch-s6-p3-p4-replay.yml?ref=main" | jq -r '.sha')"
          test "$blob" = "$EXPECTED_WORKFLOW_BLOB"
          curl -fsS "${headers[@]}" "$API/issues/comments/6943043495" | jq -e --arg approval "$APPROVAL_TOKEN" '.id == 6943043495 and (.body | contains($approval)) and (.body | contains("400W"))' >/dev/null
          curl -fsS "${headers[@]}" "$API/issues/comments/6943333886" | jq -e '.id == 6943333886 and (.body | contains("one-shot"))' >/dev/null
          duplicates="$(curl -fsS "${headers[@]}" "$API/actions/runs?event=workflow_dispatch&per_page=100" | jq --arg sha "$EXPECTED_MAIN_SHA" '[.workflow_runs[] | select(.head_sha == $sha and (.name | contains("Issue541 ARCH maintained S6")))] | length')"
          test "$duplicates" = "0"
          echo "ISSUE535_S6_FULL_100US_DISPATCH_PREFLIGHT_PASS source=$EXPECTED_MAIN_SHA"
      - name: POST one manual-only S6 full two-case workflow_dispatch
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          payload="$(jq -nc --arg source "$EXPECTED_MAIN_SHA" --arg approval "$APPROVAL_TOKEN" '{ref:"main",inputs:{source_sha:$source,p3_approval:$approval}}')"
          code="$(curl -sS -o "$RUNNER_TEMP/issue535_s6_dispatch_response.txt" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$API/actions/workflows/issue541-arch-s6-p3-p4-replay.yml/dispatches")"
          test "$code" = "204" -o "$code" = "200"
          echo "ISSUE535_S6_FULL_100US_WORKFLOW_DISPATCH_POST_ACCEPTED source=$EXPECTED_MAIN_SHA target=issue541-arch-s6-p3-p4-replay.yml http=$code"
