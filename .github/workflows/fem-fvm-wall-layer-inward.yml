name: FV inward wall-layer depth with coarse-P1 potential 1 ns

on:
  push:
    branches:
      - issue-wall-layer-inward-extension
    paths:
      - 'experiments/fem_fvm_plasma_discriminator/.run_wall_layer_inward'
  workflow_dispatch:

jobs:
  compare:
    name: inward-L${{ matrix.layers }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        layers: [1, 2, 4]
    env:
      BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008

    steps:
      - uses: actions/checkout@v4
      - name: Pull build image
        run: docker pull "$BUILD_BASE_REF"
      - name: Build and run L${{ matrix.layers }} discriminator
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash --user 0:0 \
            -e WALL_LAYERS="${{ matrix.layers }}" \
            --workdir /workspace -v "$GITHUB_WORKSPACE:/workspace" \
            "$BUILD_BASE_REF" -lc '
              set -euo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory /opt/physics_vendor/moose
              git config --global --add safe.directory /opt/physics_vendor/crane
              git config --global --add safe.directory /opt/physics_vendor/squirrel
              git config --global --add safe.directory /opt/physics_vendor/zapdos
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt

              make -C physics_app -j2
              cd experiments/fem_fvm_plasma_discriminator
              python3 prepare_wall_layer_inward.py --layers "$WALL_LAYERS"

              CASE="hybrid_wall_layer_L${WALL_LAYERS}_coarse_p1"
              grep -q "type = PhysicsBoundaryLayerRefineGenerator" "${CASE}.i"
              grep -q "layers = ${WALL_LAYERS}" "${CASE}.i"
              grep -q "type = PhysicsCoarseP1ConstraintProblem" "${CASE}.i"
              grep -q "coarse_p1_auto_detect_refinement_midpoints = true" "${CASE}.i"
              if grep -q "LinearNodalConstraint\|\[Constraints\]" "${CASE}.i"; then
                echo "ERROR: residual/penalty constraint found in coarse-P1 experiment" >&2
                exit 2
              fi

              ../../physics_app/physics-opt -i "${CASE}.i" --check-input

              OUTDIR="output_wall_layer_inward/L${WALL_LAYERS}"
              rm -rf "$OUTDIR"
              mkdir -p "$OUTDIR"

              set +e
              /usr/bin/time -f "wall_seconds=%e\nuser_seconds=%U\nsystem_seconds=%S\nmax_rss_kb=%M" \
                -o "$OUTDIR/wall_time.txt" \
                timeout --signal=TERM 10m stdbuf -oL -eL \
                ../../physics_app/physics-opt --print-constraints -i "${CASE}.i" > "$OUTDIR/run.log" 2>&1
              rc=$?
              set -e
              echo "run_rc=$rc" > "$OUTDIR/status.txt"
              cp "${CASE}.i" "$OUTDIR/"
              cp "${CASE}_out.csv" "$OUTDIR/" 2>/dev/null || true
              cp "${CASE}_out.e" "$OUTDIR/" 2>/dev/null || true
              tail -n 1600 "$OUTDIR/run.log" > "$OUTDIR/tail.log" || true
              cp prepare_wall_layer_inward.py "$OUTDIR/"
              exit "$rc"
            '
      - name: Upload L${{ matrix.layers }} result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fv-wall-layer-inward-L${{ matrix.layers }}-coarse-p1-dt1ns
          path: experiments/fem_fvm_plasma_discriminator/output_wall_layer_inward/L${{ matrix.layers }}/**
          retention-days: 30
