# Validation-only child PR. Never merge into the production candidate.
name: Issue817 combined retirement exact-source P0 and bounded Native
on:
  pull_request:
    branches: [issue-817-combined-retirement-20261124]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: issue817-combined-validation-4a177e4d38a40b99998b1e46680a8c59be621cef
  cancel-in-progress: false
jobs:
  active_source_p0:
    name: Combined five-Factory census and current consumer P0
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_HEAD: 4a177e4d38a40b99998b1e46680a8c59be621cef
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4a177e4d38a40b99998b1e46680a8c59be621cef
          fetch-depth: 1
          persist-credentials: false
      - name: Pin CI identity and self-test canonical workflow safety
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test -z "$(git status --porcelain --untracked-files=no)"
          python3 ci/workflow_harness.py --self-test
          python3 ci/workflow_harness.py --check
          python3 ci/guards/p6_ci_workflow_safety_guard.py --self-test --check
          python3 -m pip install --disable-pip-version-check --quiet \
            -r requirements-evidence-engine.txt -r requirements-ontology.txt pytest
      - name: Validate combined inventory, historical pins and fail-closed controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 -m unittest discover -s tests -p test_fvkernel_native_usage_census.py -v 2>&1 | tee evidence/combined_census_tests.log
          python3 -m unittest discover -s tests -p test_issue774_newonly_fvkernel_retirement.py -v 2>&1 | tee evidence/combined_retirement_tests.log
          python3 ci/guards/issue774_newonly_fvkernel_retirement.py --expected-head "$SOURCE_HEAD" --output evidence/combined_retirement.json
          python3 -m unittest discover -s tests -p test_issue402_material_class_names.py -v
          python3 -m unittest discover -s tests -p test_issue402_species_transport_rule.py -v
      - name: Run source generator and explicit signed source contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 -m py_compile \
            ci/guards/issue817_code3_production_migration.py \
            tests/test_issue817_code3_production_migration.py \
            physics_app/ci/check_stage5_h05_runtime.py \
            physics_app/ci/check_r2_o2_ionization_implementation.py \
            physics_app/ci/check_stage5_ei20_runtime.py \
            physics_app/ci/check_stage5_edetach_runtime.py \
            experiments/historical_recipe_support/issue192_s5r.py
          python3 -m unittest discover -s tests -p test_issue817_code3_production_migration.py -v 2>&1 | tee evidence/owner_negative_tests.log
          python3 -m ci.guards.issue817_code3_production_migration \
            --expected-head "$SOURCE_HEAD" --phase postcut \
            --output evidence/current_signed_source_census.json
      - name: Execute current live CI source contracts and S5R static validators
        shell: bash
        run: |
          set -euo pipefail
          python3 physics_app/ci/check_r2_o2_ionization_implementation.py
          python3 physics_app/ci/check_r2_o2_ionization_implementation.py --self-test
          python3 physics_app/ci/check_stage5_h05_runtime.py --static
          python3 physics_app/ci/check_stage5_h05_runtime.py --self-test
          python3 physics_app/ci/check_stage5_ei20_runtime.py --static
          python3 physics_app/ci/check_stage5_ei20_runtime.py --self-test
          python3 physics_app/ci/check_stage5_edetach_runtime.py --static
          python3 physics_app/ci/check_stage5_edetach_runtime.py --self-test
          python3 physics_app/ci/check_e8_ei16_energy_contract.py
          python3 physics_app/ci/check_e8_ei16_energy_runtime.py --self-test
          python3 physics_app/ci/check_standard_moose_energy_projection.py --self-test
          python3 physics_app/ci/check_issue402_json_rate_native_p2.py --self-test
          python3 physics_app/ci/check_stage5_s5r_preflight.py
          python3 physics_app/ci/check_stage5_s5r_assembly.py --static
          python3 physics_app/ci/check_stage5_s5r_assembly.py --self-test
          python3 -m pytest -q \
            tests/characterization/test_issue192_s5r.py \
            tests/characterization/test_issue192_s5r_runtime.py
          echo ISSUE817_CODE3_ALL_LIVE_SOURCE_P0_PASS
      - name: Upload scoped P0 source and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue817-code3-production-p0-${{ github.run_id }}-${{ github.run_attempt }}-4a177e4d38a40b99998b1e46680a8c59be621cef
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
  postcut_source_new_binary:
    name: Postcut W1 and EI01 H05 R2 normalized signed P2 P3
    needs: active_source_p0
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    env:
      SOURCE_HEAD: 4a177e4d38a40b99998b1e46680a8c59be621cef
      OCI: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
    steps:
      - name: Checkout immutable exact source
        uses: actions/checkout@v4
        with:
          ref: 4a177e4d38a40b99998b1e46680a8c59be621cef
          fetch-depth: 1
          persist-credentials: false
      - name: Verify CI source and original Factory identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test -z "$(git status --porcelain --untracked-files=no -- physics_app)"
          test ! -e physics_app/physics-opt
          test "$(git hash-object physics_app/dependencies.lock)" = 0aae0ffb5699fcd5c17e8ebe9ea4f2effde9ff47
          grep -Fqx "PHYSICS_BUILD_BASE=$OCI" physics_app/dependencies.lock
          python3 -m pip install --disable-pip-version-check --quiet \
            -r requirements-evidence-engine.txt -r requirements-ontology.txt
          python3 -m unittest discover -s tests -p test_issue817_code3_production_migration.py -v
          python3 -m unittest discover -s tests -p test_issue774_newonly_fvkernel_retirement.py -v
          python3 -m unittest discover -s tests -p test_fvkernel_native_usage_census.py -v
          python3 -m ci.guards.issue817_code3_production_migration \
            --expected-head "$SOURCE_HEAD" --phase postcut --output /tmp/code3-postcut-p0.json
          python3 -m py_compile ci/guards/issue817_code3_postcut_native.py

      - name: Pull pinned Build Base and verify vendor source identities
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$OCI"
          for pair in 'moose MOOSE' 'crane CRANE' 'squirrel SQUIRREL' 'zapdos ZAPDOS'; do
            read -r key envname <<< "$pair"
            expected="$(sed -n "s/^$envname=//p" physics_app/dependencies.lock)"
            actual="$(docker image inspect "$OCI" --format "{{ index .Config.Labels \"io.physics.$key.sha\" }}")"
            test -n "$expected" && test "$expected" = "$actual"
          done
      - name: Compile one exact-head PhysicsApp ELF
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 --entrypoint /bin/bash --user 0:0 \
            --workdir /workspace -v "$PWD:/workspace" "$OCI" -lc '
              set -euo pipefail
              source /environment
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt
              make -C physics_app -j2 app_non_unity_dirs="%/utils"
            ' > "$RUNNER_TEMP/code3_build.log" 2>&1 || {
              tail -90 "$RUNNER_TEMP/code3_build.log"; exit 1;
            }
          test -s physics_app/physics-opt && test -x physics_app/physics-opt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('physics_app/physics-opt')
          assert p.read_bytes()[:4]==b'\x7fELF'
          print('ISSUE817_CODE3_W1_EXACT_ELF=PASS')
          PY
      - name: Execute current source-free physical and normalized Native P2/P3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 -m ci.guards.issue817_code3_postcut_native
      - name: Upload only sanitized SHA and bounded source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue817-code3-postcut-native-${{ github.run_id }}-${{ github.run_attempt }}-4a177e4d38a40b99998b1e46680a8c59be621cef
          path: evidence/code3_postcut_native_receipt.json
          if-no-files-found: warn
          retention-days: 30
