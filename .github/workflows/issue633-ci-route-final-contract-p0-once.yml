name: Issue633 final CI Template Trigger Artifact P05 route contract P0
on:
  push:
    branches: [issue-633-ci-route-final-p0-smoke-20261118]
    paths: [.github/workflows/issue633-ci-route-final-contract-p0-once.yml]
permissions:
  contents: read
jobs:
  contract:
    if: github.repository == 'HyungseonSong-plasma/moose-test-repo'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact immutable candidate (not temporary smoke source)
        uses: actions/checkout@v4
        with:
          ref: 9c57fbbb0ac2cb11cf7baed199ea670952f03ada
          path: candidate
          persist-credentials: false
      - name: Validate CI and Template, 14 negative mutations, workflow events and artifact custody
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          test "$(git rev-parse HEAD)" = "9c57fbbb0ac2cb11cf7baed199ea670952f03ada"
          test ! -e .github/workflows/issue633-ci-route-final-contract-p0-once.yml
          python3 -m py_compile ci/guards/issue633_s6_ci_route_guard.py ci/issue633_required_newonly_s6_native_p2.py
          python3 ci/guards/issue633_s6_ci_route_guard.py --self-test --check
          python3 ci/guards/workflow_surface_guard.py --self-test
          python3 ci/guards/workflow_surface_guard.py --check
          python3 ci/guards/issue541_artifact_evidence_guard.py --self-test
          python3 ci/guards/issue541_artifact_evidence_guard.py --check-policy
          python3 ci/workflow_harness.py --self-test
          python3 ci/workflow_harness.py --check
          echo ISSUE633_FINAL_CI_SPLIT_P0_ALL_GUARDS_PASS
