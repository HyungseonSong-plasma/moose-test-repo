# Oxygen ICP Legacy8 + H05: add only historical associative detachment O- + O -> O2 + e.
# Fresh 0-100us per power; preserve Legacy8 baseline and SCIENCE_HOLD.
# Rate owner EI-01 is the canonical o2_attachment_ei01 overlay (source locked).
# EI-16 is implemented by the specialized PhysicsElectronImpactIonizationMaterial.
name: Oxygen ICP Legacy8 plus H05 100us 400W 1000W
run-name: Legacy8 + H05 associative detachment 400 and 1000W to 100us ${{ github.sha }}
on:
  workflow_dispatch:
  push:
    branches: [issue-legacy8-h05-20261103]
    paths:
      - .github/workflows/oxygen-legacy8-h05-400-1000w-100us.yml

permissions:
  contents: read

concurrency:
  group: oxygen-legacy8-h05-100us-${{ github.ref }}
  cancel-in-progress: false

jobs:
  simulate:
    name: Native Legacy8 H05 0–100us ${{ matrix.power_w }}W
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        power_w: [400, 1000]
    env:
      POWER_W: ${{ matrix.power_w }}
      CHATGPT_WORK_BASE_SHA: 8e2fe042dbc204b5fda22d346f1ad8d2e32db3ab
      OXYGEN_RESEARCH_400: '1'
      OXYGEN_RESEARCH_FULL24: '0'
      OXYGEN_RESEARCH_EI2738_FORMULA: '1'
      OXYGEN_RESEARCH_LUMPED_O2A: '0'
      OXYGEN_RESEARCH_QUICK_5MIN: '0'
      END_NS: '100000'
      EEDF_SHA: 35534a522fa48ccb5222339c5040040630eef31e623e1c53f1e1c4540d2d653b
      CHEM: experiments/Issue395_powered_chemistry_ladder
      OXYGEN_RESEARCH_RATE_DIR: /tmp/oxygen25/private_rates
      EI407_OVERLAY: experiments/Issue395_powered_chemistry_ladder/ei407_only_${{ matrix.power_w }}w_100us_dt1000ns_overlay.i
      H05_OVERLAY: experiments/Issue395_powered_chemistry_ladder/h05_associative_detachment_${{ matrix.power_w }}w_100us_dt1000ns_overlay.i
    steps:
      - name: Checkout pinned original physics source
        uses: actions/checkout@v4
        with:
          ref: 8e2fe042dbc204b5fda22d346f1ad8d2e32db3ab
          fetch-depth: 1

      - name: Checkout research harness and saved initial-mixture EEDF lookup
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: _legacy6_control
          sparse-checkout: |
            .github/scripts/oxygen_legacy6_latest_100us.py
            .github/scripts/oxygen_legacy7_ei2738_100us.py
            .github/scripts/oxygen_legacy8_ei407_100us.py
            .github/scripts/oxygen_legacy8_h05_100us.py
            .github/oxygen25_eedf/initial_mixture_23xsec_transport.txt
          sparse-checkout-cone-mode: false

      - name: P0 exact baseline, six-channel inventory and EEDF table
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CHATGPT_WORK_BASE_SHA"
          export HARNESS=_legacy6_control/.github/scripts/oxygen_legacy6_latest_100us.py
          export LEGACY7=_legacy6_control/.github/scripts/oxygen_legacy7_ei2738_100us.py
          export LEGACY8=_legacy6_control/.github/scripts/oxygen_legacy8_ei407_100us.py
          export H05=_legacy6_control/.github/scripts/oxygen_legacy8_h05_100us.py
          test -s "$HARNESS"
          python3 "$HARNESS" --self-test
          python3 "$LEGACY7" --self-test
          python3 "$LEGACY8" --self-test
          python3 "$H05" --self-test
          python3 -m py_compile "$HARNESS" "$LEGACY7" "$LEGACY8" "$H05"
          bash -n "$CHEM/issue397_l1_power_scan_replay.sh"
          python3 -m venv .legacy6-venv
          .legacy6-venv/bin/python -m pip install --disable-pip-version-check --quiet numpy==2.1.2 scipy==1.14.1 'pytest>=8,<9'
          echo "$PWD/.legacy6-venv/bin" >> "$GITHUB_PATH"
          .legacy6-venv/bin/python -c "import numpy,scipy; print('OXYGEN_LEGACY6_NATIVE_PYTHON_DEPS_PASS',numpy.__version__,scipy.__version__)"
          test "$OXYGEN_RESEARCH_FULL24" = 0
          test "$OXYGEN_RESEARCH_QUICK_5MIN" = 0
          TABLE_SOURCE=_legacy6_control/.github/oxygen25_eedf/initial_mixture_23xsec_transport.txt
          test "$(sha256sum "$TABLE_SOURCE" | cut -d' ' -f1)" = "$EEDF_SHA"
          cp "$TABLE_SOURCE" experiments/Issue91_real_qvt_r3/r3_e0/electron_moments.txt
          test "$(sha256sum experiments/Issue91_real_qvt_r3/r3_e0/electron_moments.txt | cut -d' ' -f1)" = "$EEDF_SHA"
          echo "HARNESS=$HARNESS" >> "$GITHUB_ENV"
          echo "LEGACY7=$LEGACY7" >> "$GITHUB_ENV"
          echo "LEGACY8=$LEGACY8" >> "$GITHUB_ENV"
          echo "H05=$H05" >> "$GITHUB_ENV"
          echo "RESULT=$CHEM/results_rf_elastic_diss_ion_ei20_ei01_${POWER_W}w_adjacent_sheath_wall_closed_100us_dt1000ns" >> "$GITHUB_ENV"

      - name: P0 verify private EI407 lookup and original 19 rate tables
        env:
          PRIVATE_RATES_B64: ${{ secrets.OXYGEN24_RATES_TAR_XZ_B64 }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_RATES_B64" || { echo "::error::Missing private rate package"; exit 22; }
          umask 077
          mkdir -p "$OXYGEN_RESEARCH_RATE_DIR"
          printf '%s' "$PRIVATE_RATES_B64" | base64 --decode | tar -xJ -C "$OXYGEN_RESEARCH_RATE_DIR" --no-same-owner
          python3 - <<'PY'
          import importlib.util, os
          from pathlib import Path
          path=Path("experiments/Issue395_powered_chemistry_ladder/build_oxygen_24_source_overlay.py")
          spec=importlib.util.spec_from_file_location("legacy8_rates",path)
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          rates=m.validate_files(Path(os.environ["OXYGEN_RESEARCH_RATE_DIR"]))
          assert set(m.LOOKUP_IDS).issubset(rates)
          assert 407 in rates and rates[407].name=="EI-407_O2_X.txt"
          print("LEGACY8_EI407_PRIVATE_RATE_GATE_PASS",len(rates))
          PY

      - name: P0 prepare Legacy8 plus H05, with original eight unchanged
        run: |
          set -euo pipefail
          bash "$CHEM/issue397_l1_power_scan_replay.sh" prepare "$POWER_W"
          python3 "$HARNESS" --prepare --power-w "$POWER_W"
          python3 "$H05" --prepare-variant --power-w "$POWER_W"
          python3 "$H05" --verify-nine --power-w "$POWER_W"
          python3 bin/physics.py preflight --self-test
          python3 bin/physics.py preflight "$CHEM/ei2738_detachment_formula_${POWER_W}w_100us_dt1000ns_overlay.i"
          python3 bin/physics.py preflight "$EI407_OVERLAY"
          # The ParsedFunctorMaterial symbol 'e' is reserved; keep a named electron symbol.
          grep -Fq "functor_symbols = 'el om'" "$H05_OVERLAY"
          ! grep -Fq "functor_symbols = 'e om'" "$H05_OVERLAY"
          python3 bin/physics.py preflight "$H05_OVERLAY"
          test -s "$RESULT/legacy6_latest_variant.json"
          ! grep -q "R_EI415" "$CHEM/rf_elastic_diss_ion_ei20_ei01_${POWER_W}w_adjacent_sheath_wall_closed_100us_dt1000ns.i"
          test "$(sha256sum experiments/Issue91_real_qvt_r3/r3_e0/electron_moments.txt | cut -d' ' -f1)" = "$EEDF_SHA"
          echo "OXYGEN_LEGACY8_H05_400_1000W_FRESH_100US_P0_PASS"

      - name: P1 build pinned native PhysicsApp with same RF Maxwell coupling
        run: |
          set -euo pipefail
          bash "$CHEM/issue397_l1_power_scan_replay.sh" build "$POWER_W"

      - name: P2 native check-input with only H05 added to Legacy8
        run: |
          set -euo pipefail
          python3 "$H05" --verify-nine --power-w "$POWER_W"
          python3 "$H05" --patch-replay-argv --power-w "$POWER_W"
          bash -n "$CHEM/issue397_l1_power_scan_replay.sh"
          bash "$CHEM/issue397_l1_power_scan_replay.sh" check "$POWER_W"
          echo "OXYGEN_LEGACY8_H05_NATIVE_CHECK_INPUT_PASS"

      - name: P3 genuine native 0-100us transient run (5.5-hour cap)
        run: |
          set -euo pipefail
          # P2 applied guarded argv patch for EI2738 + EI407 + H05 before file_base.
          bash -n "$CHEM/issue397_l1_power_scan_replay.sh"
          test -s "$RESULT/legacy8_h05_argv_patch.json"
          start="$(date +%s)"
          set +e
          timeout -s TERM -k 60s 19800s bash "$CHEM/issue397_l1_power_scan_replay.sh" solve "$POWER_W"
          code=$?
          set -e
          elapsed=$(( $(date +%s) - start ))
          printf "power_w=%s\nend_ns=100000\nseconds=%s\nexit_code=%s\n" "$POWER_W" "$elapsed" "$code" > "$RESULT/runtime_status.txt"
          echo "OXYGEN_LEGACY8_H05_NATIVE_SOLVER_WALL_SECONDS=$elapsed EXIT=$code"
          test "$code" -eq 0

      - name: P4 verify true 100us endpoint and native restart state
        run: |
          set -euo pipefail
          python3 "$H05" --verify-and-archive --power-w "$POWER_W"
          test -s "$RESULT/legacy6_restart_100000ns_manifest.json"
          python3 - "$RESULT/legacy6_restart_100000ns_manifest.json" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1]))
          assert m["verified_full_native_100us_checkpoint"]
          assert m["native_endpoint_s"]==1e-4
          assert m["chemistry_channels"]==["EI-01","EI-02","DISS-G","EI-16","EI-17","EI-20","EI-2738","EI-407","H05"]
          assert m["variant"]=="LEGACY8_PLUS_H05_from_Legacy8"
          assert m["scientific_acceptance"]=="HOLD"
          assert any(x["path"].endswith("ei2738_detachment_formula_"+str(m["power_W"])+"w_100us_dt1000ns_overlay.i") for x in m["inventory"]["inputs"])
          assert any(x["path"].endswith("ei407_only_"+str(m["power_W"])+"w_100us_dt1000ns_overlay.i") for x in m["inventory"]["inputs"])
          assert any(x["path"].endswith("h05_associative_detachment_"+str(m["power_W"])+"w_100us_dt1000ns_overlay.i") for x in m["inventory"]["inputs"])
          assert m["h05_rate_particle_m3_s"]==3.0e-16
          assert m["h05_energy_incomplete"] is True
          assert m["restart_requires_exact_legacy8_h05_chemistry"] is True
          assert m["ei407_lookup_sha256"]==m["ei407_recovery_rate_sha256"]
          assert m["transport_table_sha256"]=="35534a522fa48ccb5222339c5040040630eef31e623e1c53f1e1c4540d2d653b"
          assert m["neutral_inlet_sccm"]==200
          assert m["native_initialization"]=="fresh_not_restarted"
          print("OXYGEN_LEGACY8_H05_100US_COMPLETE",m["power_W"])
          PY

      - name: Preserve verified full native 100us checkpoint and plots data
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: oxygen-legacy8-h05-latest-EEDF-100us-${{ matrix.power_w }}W
          if-no-files-found: error
          retention-days: 90
          path: |
            ${{ env.RESULT }}/legacy6_restart_run_100000ns.tar.gz
            ${{ env.RESULT }}/legacy6_restart_inputs_100000ns.tar.gz
            ${{ env.RESULT }}/legacy6_restart_100000ns_manifest.json
            ${{ env.RESULT }}/legacy6_latest_variant.json
            ${{ env.RESULT }}/legacy8_h05_argv_patch.json
            ${{ env.RESULT }}/runtime_status.txt
            ${{ env.RESULT }}/runtime.log
            ${{ env.RESULT }}/check_input.log
            ${{ env.RESULT }}/run/plasma.csv

      - name: Preserve failed-stage evidence without claiming science success
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oxygen-legacy8-h05-latest-EEDF-100us-diag-${{ matrix.power_w }}W
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ env.RESULT }}/legacy6_latest_variant.json
            ${{ env.RESULT }}/legacy8_h05_argv_patch.json
            ${{ env.RESULT }}/runtime_status.txt
            ${{ env.RESULT }}/runtime.log
            ${{ env.RESULT }}/check_input.log
            ${{ env.RESULT }}/run/plasma.csv
            ${{ env.RESULT }}/prep/**
