name: QPX Issue 144 retirement migration

on:
  push:
    branches:
      - issue-144-r4-r8

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble migration
        run: |
          cat \
            tools/issue144_finalize_retirement.py.part00 \
            tools/issue144_finalize_retirement.py.part01 \
            tools/issue144_finalize_retirement.py.part02 \
            tools/issue144_finalize_retirement.py.part03 \
            tools/issue144_finalize_retirement.py.part04 \
            > tools/issue144_finalize_retirement.py
          python -m py_compile tools/issue144_finalize_retirement.py
      - name: Apply retirement migration
        run: python tools/issue144_finalize_retirement.py
      - name: Validate migrated source
        run: |
          python -m compileall -q qpx_harness tests experiments tools
          python tools/qpx_architecture_census.py --require-no-legacy
          python tools/qpx_dependency_guard.py --check all
      - name: Commit migrated tree
        run: |
          git config user.name "HyungseonSong-plasma"
          git config user.email "hssongplasma@gmail.com"
          git add -A
          git rm -f \
            tools/issue144_finalize_retirement.py \
            tools/issue144_finalize_retirement.py.part00 \
            tools/issue144_finalize_retirement.py.part01 \
            tools/issue144_finalize_retirement.py.part02 \
            tools/issue144_finalize_retirement.py.part03 \
            tools/issue144_finalize_retirement.py.part04 \
            .github/workflows/qpx-staging-snapshot.yml
          git commit -m "refactor: complete QPX legacy namespace retirement"
          git push origin HEAD:issue-144-r4-r8
