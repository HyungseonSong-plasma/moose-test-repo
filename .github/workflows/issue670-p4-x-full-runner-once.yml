name: Issue 670 P4-X full production source-only integration
on:
  push:
    branches:
      - issue-670-p4-x-owner-runner-integration-20261118
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned source archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/HyungseonSong-plasma/moose-test-repo/actions/artifacts/14372278074/zip > p1-outer.zip
          gh api repos/HyungseonSong-plasma/moose-test-repo/actions/artifacts/14406746397/zip > p3x-actual.zip
          printf '%s  %s\n' '584fd8eff989ab1f7f0a7582ae72b4dc2429f84b8b05ed91c1a46f89df88da5e' 'p1-outer.zip' | sha256sum -c -
          printf '%s  %s\n' '592a7c82834bab841f6a2e1807db305d0eff1e953f50a0dcc6d7e21ff8820111' 'p3x-actual.zip' | sha256sum -c -
      - name: Execute actual production prepare_newonly source runner for 417 and 941
        run: |
          set -euo pipefail
          python3 ci/check_issue670_p4_x_full_newonly_runner.py --p1-outer p1-outer.zip --p3x-artifact p3x-actual.zip --report p4x-full-source-stage.json
      - name: Retain actual source stage SHA receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue670-p4x-full-production-source-stage
          path: p4x-full-source-stage.json
          if-no-files-found: warn
          retention-days: 14
