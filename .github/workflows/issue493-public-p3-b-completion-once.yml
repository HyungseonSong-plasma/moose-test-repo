name: Issue 493 Public S6 B Completion Max 340m
on:
  push:
    branches: [main]
    paths: [.github/workflows/issue493-public-p3-b-completion-once.yml]
permissions:
  contents: read
jobs:
  issue493-public-p3-b-completion:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case: ['417', '941']
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      PINNED_SOURCE: 29d1acc6ef7969908b86719e4b95c73a1565136d
      PINNED_CANDIDATE: bebaf47a33ff5ee1d6b933d9691bf48f5ec0f947
      BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
      OXYGEN_RESEARCH_400: '1'
      OXYGEN_RESEARCH_FULL24: '0'
      OXYGEN_RESEARCH_EI2738_FORMULA: '0'
      OXYGEN_RESEARCH_QUICK_5MIN: '0'
      CHEM: experiments/Issue395_powered_chemistry_ladder
    steps:
      - name: Checkout exact reviewed public data and bounded P3 diagnostics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 1
      - name: Checkout original archived public S6 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 29d1acc6ef7969908b86719e4b95c73a1565136d
          path: historical
          fetch-depth: 1
      - name: Checkout immutable reviewed PhysicsApp candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: bebaf47a33ff5ee1d6b933d9691bf48f5ec0f947
          path: candidate
          fetch-depth: 1
      - name: Verify public rate/deck provenance before native build
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C historical rev-parse HEAD)" = "$PINNED_SOURCE"
          test "$(git -C candidate rev-parse HEAD)" = "$PINNED_CANDIDATE"
          test "$(git -C control rev-parse HEAD)" = "${{ github.sha }}"
          source candidate/physics_app/dependencies.lock
          test "$PHYSICS_BUILD_BASE" = "$BUILD_BASE_REF"
          python3 control/experiments/Issue493_s6_boltzmann/public_p2_check.py \
            --control control --mode preflight
          python3 control/experiments/Issue493_s6_boltzmann/test_public_p3_run.py
          echo ISSUE493_PUBLIC_P3_P0_PREFLIGHT_PASS
      - name: Set up research Python for historical mesh preparation
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare original 400 W public mesh without protected coefficients
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet \
            numpy==2.1.2 scipy==1.14.1 matplotlib==3.9.2
          cd historical
          SRC=.github/oxygen25_eedf/initial_mixture_23xsec_transport.txt
          DST=experiments/Issue91_real_qvt_r3/r3_e0/electron_moments.txt
          test "$(sha256sum "$SRC" | cut -d' ' -f1)" = 35534a522fa48ccb5222339c5040040630eef31e623e1c53f1e1c4540d2d653b
          cp "$SRC" "$DST"
          export CHATGPT_WORK_BASE_SHA="$PINNED_SOURCE"
          bash "$CHEM/issue397_l1_power_scan_replay.sh" prepare 400
          python3 .github/scripts/oxygen_legacy6_latest_100us.py --power-w 400 --prepare
          test -s "$CHEM/baseline_plasma_plus_unstructured_cover_plus_wafer.msh"
          test ! -e "$CHEM/private_rates"
          echo ISSUE493_PUBLIC_P3_MESH_PREP_PASS
      - name: Pull pinned precompiled OCI and build PhysicsApp only
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get clean || true
          docker system prune -af --volumes || true
          for path in /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/share/swift /usr/local/.ghcup; do
            sudo rm -rf "$path" || true
          done
          test ! -e candidate/physics_app/physics-opt
          docker pull "$BUILD_BASE_REF"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.moose.sha" }}')" = "9f388366ccf38b9c34542ec5561198249fde0ac9"
          docker run --rm --network none --entrypoint /bin/bash --user 0:0 \
            --workdir /app -e EXPECTED_SHA="$PINNED_CANDIDATE" \
            -v "$PWD/candidate:/app:rw" -v "$PWD/control:/harness:ro" \
            "$BUILD_BASE_REF" -lc '
              set -euo pipefail
              source /environment
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos METHOD=opt
              python3 /harness/physics_harness/execution/native_build.py \
                --source-root /app --expected-sha "$EXPECTED_SHA" \
                --profile auto --max-jobs 4 --max-attempts 3 \
                --timeout-seconds 1800 \
                --log-dir /app/.native_p1_validation \
                --report /app/.native_p1_validation/report.json \
                --smoke-input ci/smoke.i
            '
          test -x candidate/physics_app/physics-opt
          python3 control/bin/physics.py native-p1-record \
            --source-root candidate --source-sha "$PINNED_CANDIDATE" \
            --binary candidate/physics_app/physics-opt --oci-ref "$BUILD_BASE_REF" \
            --build-report candidate/.native_p1_validation/report.json \
            --output "$RUNNER_TEMP/issue493_p1_provenance.json"
          echo ISSUE493_PUBLIC_P3_P1_BUILD_PASS
      - name: Attempt fresh full 460-step B-only P3 for max 20400s; C never starts
        shell: bash
        run: |
          set -euo pipefail
          # Explicitly user-authorized 460-step B-only completion trial.
          # Exit 3/HOLD is a genuine unsuccessful completion attempt, never
          # normalized to a passing full-solve result.
          set +e
          python3 control/experiments/Issue493_s6_boltzmann/public_p3_run.py \
            --control control --candidate candidate --historical historical \
            --p1-evidence "$RUNNER_TEMP/issue493_p1_provenance.json" \
            --output "$RUNNER_TEMP/issue493_p3_complete_b_${{ matrix.case }}" \
            --case "${{ matrix.case }}" --mode complete-b --authorize-full-p3 --timeout-seconds 20400
          rc=$?
          set -e
          python3 control/experiments/Issue493_s6_boltzmann/check_public_p3_b_completion.py \
            --case "${{ matrix.case }}" \
            --status "$RUNNER_TEMP/issue493_p3_complete_b_${{ matrix.case }}/non_sensitive_p3_status.json"
          test "$rc" -eq 0
          echo ISSUE493_PUBLIC_P3_B_COMPLETION_PROVEN
      - name: Publish sanitized max-budget B completion verdict and public P1 provenance only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue493-public-p3-b-completion-${{ matrix.case }}-${{ github.sha }}
          path: |
            candidate/.native_p1_validation/report.json
            ${{ runner.temp }}/issue493_p1_provenance.json
            ${{ runner.temp }}/issue493_p3_complete_b_${{ matrix.case }}/non_sensitive_p3_status.json
          if-no-files-found: warn
          retention-days: 14
