name: Issue-224 parallel hypothesis OS RSS fan-out v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue224-parallel-hypothesis-rss-v2.yml'
      - 'experiments/Issue224_element_aggregate_memory/run_parallel.py'
  workflow_dispatch:
    inputs:
      base_sha:
        description: 'Immutable experiment base SHA (40 hex chars)'
        required: true
        type: string
      experiments_json:
        description: 'JSON array of restricted hypothesis specs'
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

concurrency:
  group: issue224-parallel-v2-${{ github.event_name }}-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

env:
  BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
  MOOSE_SHA: 9f388366ccf38b9c34542ec5561198249fde0ac9
  CRANE_SHA: ba26970cf419dcac563a20ed7079d445bc6341c3
  SQUIRREL_SHA: 16a26d504f3ee11161a86d4e3ebf3c0e5f2afbb1
  ZAPDOS_SHA: 9eceffbc46048c3760bbfa9a7f1ca681ae35af1d

jobs:
  p0-push-validation:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate immutable build-base identity
        shell: bash
        run: |
          set -euxo pipefail
          source physics_app/dependencies.lock
          test "$MOOSE" = "$MOOSE_SHA"
          test "$CRANE" = "$CRANE_SHA"
          test "$SQUIRREL" = "$SQUIRREL_SHA"
          test "$ZAPDOS" = "$ZAPDOS_SHA"
          docker pull "$BUILD_BASE_REF"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.moose.sha" }}')" = "$MOOSE_SHA"
      - name: P0 parallel runner self-test
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace \
            -e GITHUB_SHA="$GITHUB_SHA" \
            -v "$PWD:/workspace" "$BUILD_BASE_REF" -lc '
              source /environment
              export PYTHONPATH=/workspace
              git config --global --add safe.directory /workspace
              test "$(git -C /workspace rev-parse HEAD)" = "$GITHUB_SHA"
              uv pip install --system --python "$(command -v python3)" -r requirements-evidence-engine.txt
              python3 -m py_compile /workspace/experiments/Issue224_element_aggregate_memory/run_parallel.py
              python3 /workspace/experiments/Issue224_element_aggregate_memory/run_parallel.py --self-test
            '
      - name: P0 nested-shell SHA verification self-test
        shell: bash
        run: |
          set -euxo pipefail
          printf 'issue224-sha-self-test\n' > .issue224-sha-self-test
          read -r EXPECTED_SHA256 _ < <(sha256sum .issue224-sha-self-test)
          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace \
            -e EXPECTED_SHA256="$EXPECTED_SHA256" \
            -v "$PWD:/workspace" "$BUILD_BASE_REF" -lc '
              set -euxo pipefail
              source /environment
              read -r actual_sha256 _ < <(sha256sum /workspace/.issue224-sha-self-test)
              test "$actual_sha256" = "$EXPECTED_SHA256"
            '
          rm -f .issue224-sha-self-test

  plan:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 224 &&
       github.event.comment.user.login == 'HyungseonSong-plasma' &&
       startsWith(github.event.comment.body, '/issue224-fanout-v2'))
    runs-on: ubuntu-24.04
    outputs:
      base_sha: ${{ steps.parse.outputs.base_sha }}
      matrix: ${{ steps.parse.outputs.matrix }}
    steps:
      - name: Parse bounded fan-out request
        id: parse
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_BASE_SHA: ${{ inputs.base_sha }}
          DISPATCH_EXPERIMENTS_JSON: ${{ inputs.experiments_json }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          if os.environ['EVENT_NAME'] == 'workflow_dispatch':
              base_sha = os.environ['DISPATCH_BASE_SHA'].strip()
              experiments = json.loads(os.environ['DISPATCH_EXPERIMENTS_JSON'])
          else:
              lines = os.environ['COMMENT_BODY'].splitlines()
              if not lines or lines[0].strip() != '/issue224-fanout-v2':
                  raise SystemExit('invalid issue-comment command header')
              payload = json.loads('\n'.join(lines[1:]).strip())
              base_sha = str(payload.get('base_sha', '')).strip()
              experiments = payload.get('experiments')
          if not re.fullmatch(r'[0-9a-fA-F]{40}', base_sha):
              raise SystemExit(f'invalid base_sha: {base_sha!r}')
          if not isinstance(experiments, list) or not (1 <= len(experiments) <= 12):
              raise SystemExit('experiments must be a JSON list with 1..12 entries')
          ids = set()
          normalized = []
          for spec in experiments:
              if not isinstance(spec, dict):
                  raise SystemExit('each experiment spec must be an object')
              sid = spec.get('id')
              mode = spec.get('mode')
              if not isinstance(sid, str) or not re.fullmatch(r'[A-Za-z0-9_.-]{1,48}', sid):
                  raise SystemExit(f'invalid experiment id: {sid!r}')
              if sid in ids:
                  raise SystemExit(f'duplicate experiment id: {sid}')
              ids.add(sid)
              if mode not in {'keep_initial', 'cell_average'}:
                  raise SystemExit(f'unsupported mode for {sid}: {mode!r}')
              extra = sorted(set(spec) - {'id', 'mode', 'keep_paths', 'target_paths'})
              if extra:
                  raise SystemExit(f'unsupported keys for {sid}: {extra}')
              normalized.append(spec)
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as f:
              f.write(f'base_sha={base_sha.lower()}\n')
              f.write('matrix<<EOF\n')
              f.write(json.dumps({'spec': normalized}, separators=(',', ':')) + '\n')
              f.write('EOF\n')
          print(json.dumps({'base_sha': base_sha.lower(), 'experiment_ids': sorted(ids)}))
          PY

  build-runtime-bundle:
    needs: plan
    if: needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      binary_sha256: ${{ steps.manifest.outputs.binary_sha256 }}
      bundle_sha256: ${{ steps.manifest.outputs.bundle_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.base_sha }}
          fetch-depth: 1
      - name: Verify immutable build identity
        shell: bash
        env:
          EXPERIMENT_BASE_SHA: ${{ needs.plan.outputs.base_sha }}
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPERIMENT_BASE_SHA"
          source physics_app/dependencies.lock
          test "$MOOSE" = "$MOOSE_SHA"
          test "$CRANE" = "$CRANE_SHA"
          test "$SQUIRREL" = "$SQUIRREL_SHA"
          test "$ZAPDOS" = "$ZAPDOS_SHA"
          docker pull "$BUILD_BASE_REF"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.moose.sha" }}')" = "$MOOSE_SHA"
      - name: Build runtime closure once
        shell: bash
        env:
          EXPERIMENT_BASE_SHA: ${{ needs.plan.outputs.base_sha }}
        run: |
          set -euxo pipefail
          rm -f physics_app/physics-opt physics_app/issue224-runtime-bundle.tgz
          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace \
            -e EXPERIMENT_BASE_SHA="$EXPERIMENT_BASE_SHA" \
            -v "$PWD:/workspace" "$BUILD_BASE_REF" -lc '
              set -euxo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt
              test "$(git -C /workspace rev-parse HEAD)" = "$EXPERIMENT_BASE_SHA"
              make -C /workspace/physics_app -j2
              test -x /workspace/physics_app/physics-opt
              ldd /workspace/physics_app/physics-opt | tee /workspace/physics_app/issue224-runtime-ldd.txt
              ! grep -q "not found" /workspace/physics_app/issue224-runtime-ldd.txt
              test -d /workspace/physics_app/lib
              test -d /workspace/physics_app/test/lib
              tar -C /workspace/physics_app -czf /workspace/physics_app/issue224-runtime-bundle.tgz physics-opt lib test/lib
              tar -tzf /workspace/physics_app/issue224-runtime-bundle.tgz > /workspace/physics_app/issue224-runtime-bundle.contents.txt
              grep -q "lib/.libs/libphysics-opt.so" /workspace/physics_app/issue224-runtime-bundle.contents.txt
              grep -q "test/lib/.libs/libphysics_test-opt.so" /workspace/physics_app/issue224-runtime-bundle.contents.txt
            '
      - name: Record runtime bundle provenance
        id: manifest
        shell: bash
        env:
          EXPERIMENT_BASE_SHA: ${{ needs.plan.outputs.base_sha }}
        run: |
          set -euxo pipefail
          read -r binary_sha256 _ < <(sha256sum physics_app/physics-opt)
          read -r bundle_sha256 _ < <(sha256sum physics_app/issue224-runtime-bundle.tgz)
          echo "binary_sha256=$binary_sha256" >> "$GITHUB_OUTPUT"
          echo "bundle_sha256=$bundle_sha256" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          def sha(path):
              return subprocess.check_output(['sha256sum', path], text=True).split()[0]
          Path('physics_app/issue224-runtime-bundle.manifest.json').write_text(json.dumps({
              'experiment_base_sha': os.environ['EXPERIMENT_BASE_SHA'],
              'binary_sha256': sha('physics_app/physics-opt'),
              'bundle_sha256': sha('physics_app/issue224-runtime-bundle.tgz'),
              'bundle_contents': ['physics-opt', 'lib', 'test/lib'],
          }, indent=2, sort_keys=True) + '\n')
          PY
      - name: Upload shared runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: issue224-shared-runtime-bundle
          path: |
            physics_app/issue224-runtime-bundle.tgz
            physics_app/issue224-runtime-bundle.manifest.json
          if-no-files-found: error
          retention-days: 1

  hypothesis:
    needs: [plan, build-runtime-bundle]
    if: needs.plan.result == 'success' && needs.build-runtime-bundle.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.spec.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.base_sha }}
          fetch-depth: 1
      - name: Verify immutable experiment base
        shell: bash
        env:
          EXPERIMENT_BASE_SHA: ${{ needs.plan.outputs.base_sha }}
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPERIMENT_BASE_SHA"
          source physics_app/dependencies.lock
          test "$MOOSE" = "$MOOSE_SHA"
          test "$CRANE" = "$CRANE_SHA"
          test "$SQUIRREL" = "$SQUIRREL_SHA"
          test "$ZAPDOS" = "$ZAPDOS_SHA"
          docker pull "$BUILD_BASE_REF"
      - name: Download shared exact runtime bundle
        uses: actions/download-artifact@v4
        with:
          name: issue224-shared-runtime-bundle
          path: physics_app
      - name: Restore and verify runtime closure
        shell: bash
        env:
          EXPERIMENT_BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          EXPECTED_BINARY_SHA256: ${{ needs.build-runtime-bundle.outputs.binary_sha256 }}
          EXPECTED_BUNDLE_SHA256: ${{ needs.build-runtime-bundle.outputs.bundle_sha256 }}
        run: |
          set -euxo pipefail
          read -r actual_bundle_sha256 _ < <(sha256sum physics_app/issue224-runtime-bundle.tgz)
          test "$actual_bundle_sha256" = "$EXPECTED_BUNDLE_SHA256"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          m = json.loads(Path('physics_app/issue224-runtime-bundle.manifest.json').read_text())
          assert m['experiment_base_sha'] == os.environ['EXPERIMENT_BASE_SHA']
          assert m['binary_sha256'] == os.environ['EXPECTED_BINARY_SHA256']
          assert m['bundle_sha256'] == os.environ['EXPECTED_BUNDLE_SHA256']
          print(m)
          PY
          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace \
            -e EXPECTED_BINARY_SHA256="$EXPECTED_BINARY_SHA256" \
            -v "$PWD:/workspace" "$BUILD_BASE_REF" -lc '
              set -euxo pipefail
              source /environment
              tar -xzf /workspace/physics_app/issue224-runtime-bundle.tgz -C /workspace/physics_app
              test -x /workspace/physics_app/physics-opt
              read -r actual_binary_sha256 _ < <(sha256sum /workspace/physics_app/physics-opt)
              test "$actual_binary_sha256" = "$EXPECTED_BINARY_SHA256"
              ldd /workspace/physics_app/physics-opt | tee /workspace/physics_app/issue224-restored-ldd.txt
              ! grep -q "not found" /workspace/physics_app/issue224-restored-ldd.txt
            '
      - name: Run hypothesis with shared runtime
        shell: bash
        env:
          EXPERIMENT_BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          SPEC_JSON: ${{ toJSON(matrix.spec) }}
        run: |
          set -euxo pipefail
          safe_id="$(printf '%s' '${{ matrix.spec.id }}' | tr -c 'A-Za-z0-9_.-' '_')"
          out="issue224-parallel-${safe_id}-results"
          rm -rf "$out"
          mkdir -p "$out"
          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace \
            -e GITHUB_SHA="$GITHUB_SHA" \
            -e EXPERIMENT_BASE_SHA="$EXPERIMENT_BASE_SHA" \
            -e SPEC_JSON="$SPEC_JSON" \
            -v "$PWD:/workspace" "$BUILD_BASE_REF" -lc '
              set -euxo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt
              export PYTHONPATH=/workspace
              test "$(git -C /workspace rev-parse HEAD)" = "$EXPERIMENT_BASE_SHA"
              test -x /usr/bin/time
              test -x /workspace/physics_app/physics-opt
              ldd /workspace/physics_app/physics-opt | tee /tmp/issue224-ldd.txt
              ! grep -q "not found" /tmp/issue224-ldd.txt
              uv pip install --system --python "$(command -v python3)" -r requirements-evidence-engine.txt
              python3 -m py_compile /workspace/experiments/Issue224_element_aggregate_memory/run_parallel.py
              python3 /workspace/experiments/Issue224_element_aggregate_memory/run_parallel.py --self-test
              python3 /workspace/experiments/Issue224_element_aggregate_memory/run_parallel.py \
                --physics-opt /workspace/physics_app/physics-opt \
                --results-root "/workspace/'"$out"'" \
                --spec-json "$SPEC_JSON" \
                --timeout 180
            '
      - name: Verify evidence contract
        shell: bash
        run: |
          set -euxo pipefail
          safe_id="$(printf '%s' '${{ matrix.spec.id }}' | tr -c 'A-Za-z0-9_.-' '_')"
          python3 - "$safe_id" "${{ needs.plan.outputs.base_sha }}" <<'PY'
          import json, sys
          from pathlib import Path
          sid, base_sha = sys.argv[1:]
          s = json.loads(Path(f'issue224-parallel-{sid}-results/summary.json').read_text())
          assert s['status'] == 'ISSUE224_PARALLEL_EVIDENCE_READY'
          assert s['base_sha'] == base_sha
          assert s['physical_timesteps_authorized'] == 0
          assert s['decision']['production_control_drift']['stable'] is True
          assert s['decision']['low_control_reduction_classification'] == 'MAJOR'
          assert s['decision']['promotion_authorized'] is False
          assert s['decision']['full_r2_solve_executed'] is False
          for name in ('production_before', 'candidate', 'all_57_deferred', 'production_after'):
              case = s['cases'][name]
              assert case['hard_pass'] is True, name
              assert case['guards']['no_linear_solve'] is True, name
              assert case['guards']['no_physical_timestep'] is True, name
              assert case['guards']['num_steps_is_zero'] is True, name
          print({'STATUS': s['status'], 'HYPOTHESIS': s['hypothesis_id'], 'CANDIDATE': s['decision']['candidate_comparison'], 'CANDIDATE_CLASS': s['decision']['candidate_reduction_classification']})
          PY
      - name: Upload hypothesis evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue224-parallel-${{ matrix.spec.id }}-evidence-v2
          path: issue224-parallel-*-results/**
          if-no-files-found: error
          retention-days: 7
