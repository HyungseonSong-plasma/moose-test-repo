name: full surface loss Newton diagnostic

on:
  push:
    branches:
      - prototype-fully-implicit-electron-poisson
    paths:
      - 'experiments/implicit_logmolar_surface_loss/input_10step.i'
      - '.github/workflows/full-surface-loss-newton-diagnostic.yml'
      - 'physics_app/**'
  workflow_dispatch:

jobs:
  jacobian:
    name: jacobian
    runs-on: ubuntu-24.04
    env:
      BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
    steps:
      - uses: actions/checkout@v4
      - run: docker pull "$BUILD_BASE_REF"
      - name: Build and test Jacobian
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace -v "$GITHUB_WORKSPACE:/workspace" "$BUILD_BASE_REF" -lc '
            set -euo pipefail
            source /environment
            git config --global --add safe.directory /workspace
            git config --global --add safe.directory /opt/physics_vendor/moose
            git config --global --add safe.directory /opt/physics_vendor/crane
            git config --global --add safe.directory /opt/physics_vendor/squirrel
            git config --global --add safe.directory /opt/physics_vendor/zapdos
            export MOOSE_DIR=/opt/physics_vendor/moose CRANE_DIR=/opt/physics_vendor/crane SQUIRREL_DIR=/opt/physics_vendor/squirrel ZAPDOS_DIR=/opt/physics_vendor/zapdos METHOD=opt
            make -C physics_app -j2
            cd experiments/implicit_logmolar_surface_loss
            mkdir -p diag_jac
            set +e
            ../../physics_app/physics-opt -i input_10step.i "Executioner/num_steps=1" "Executioner/end_time=1e-9" "Executioner/nl_max_its=1" "Executioner/nl_abs_tol=1e-10" -snes_test_jacobian > diag_jac/run.log 2>&1
            rc=$?
            set -e
            echo "run_rc=$rc" > diag_jac/status.txt
            grep -E "J - Jfd|Jfd|SNES Function norm|CONVERGED|DIVERGED" diag_jac/run.log > diag_jac/summary.txt || true
            cat diag_jac/status.txt
            cat diag_jac/summary.txt || true
          '
      - uses: actions/upload-artifact@v4
        with:
          name: full-surface-loss-jacobian
          path: experiments/implicit_logmolar_surface_loss/diag_jac/**

  linesearch:
    name: linesearch-${{ matrix.ls }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ls: [bt, basic, l2, cp]
    env:
      BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
    steps:
      - uses: actions/checkout@v4
      - run: docker pull "$BUILD_BASE_REF"
      - name: Build and test Newton globalization
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace -v "$GITHUB_WORKSPACE:/workspace" "$BUILD_BASE_REF" -lc '
            set -euo pipefail
            source /environment
            git config --global --add safe.directory /workspace
            git config --global --add safe.directory /opt/physics_vendor/moose
            git config --global --add safe.directory /opt/physics_vendor/crane
            git config --global --add safe.directory /opt/physics_vendor/squirrel
            git config --global --add safe.directory /opt/physics_vendor/zapdos
            export MOOSE_DIR=/opt/physics_vendor/moose CRANE_DIR=/opt/physics_vendor/crane SQUIRREL_DIR=/opt/physics_vendor/squirrel ZAPDOS_DIR=/opt/physics_vendor/zapdos METHOD=opt
            make -C physics_app -j2
            cd experiments/implicit_logmolar_surface_loss
            out="diag_${{ matrix.ls }}"
            mkdir -p "$out"
            set +e
            ../../physics_app/physics-opt -i input_10step.i \
              "Executioner/num_steps=1" "Executioner/end_time=1e-9" \
              "Executioner/nl_max_its=100" "Executioner/nl_abs_tol=1e-10" \
              "Executioner/petsc_options_iname=-ksp_type -pc_type -pc_factor_shift_type -snes_linesearch_type" \
              "Executioner/petsc_options_value=preonly lu NONZERO ${{ matrix.ls }}" \
              > "$out/run.log" 2>&1
            rc=$?
            set -e
            echo "run_rc=$rc" > "$out/status.txt"
            grep -E "SNES Function norm|CONVERGED|DIVERGED|Solve Converged|Solve Did NOT Converge" "$out/run.log" > "$out/summary.txt" || true
            cat "$out/status.txt"
            tail -n 120 "$out/summary.txt" || true
          '
      - uses: actions/upload-artifact@v4
        with:
          name: full-surface-loss-${{ matrix.ls }}
          path: experiments/implicit_logmolar_surface_loss/diag_${{ matrix.ls }}/**
