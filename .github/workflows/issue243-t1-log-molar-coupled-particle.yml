name: Issue-243 T1 coupled log-molar electron particle

on:
  workflow_dispatch:
  push:
    branches:
      - issue-243-t1-log-molar-coupled-particle
    paths:
      - physics_app/include/fvkernels/PhysicsFVLogMolarElectronTransport.h
      - physics_app/src/fvkernels/PhysicsFVLogMolarElectronTransport.C
      - physics_app/include/fvbcs/PhysicsFVElectronGroundedSheathCollectionBC.h
      - physics_app/src/fvbcs/PhysicsFVElectronGroundedSheathCollectionBC.C
      - physics_harness/bootstrap_environment.py
      - experiments/Issue243_t1_log_molar_coupled_particle/**
      - .github/workflows/issue243-t1-log-molar-coupled-particle.yml

permissions:
  contents: read

env:
  BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008

jobs:
  t1:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: P0 static ownership
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m physics_harness.bootstrap_environment --self-test
          python3 -m physics_harness.bootstrap ensure evidence --installer pip --manifest-out issue243-bootstrap-host.json
          python3 -m physics_harness.bootstrap check evidence --manifest-out issue243-bootstrap-host-check.json
          eval "$(python3 -m physics_harness.bootstrap_environment --profile evidence --shell bash)"
          test "$PHYSICS_REPO_ROOT" = "$GITHUB_WORKSPACE"
          python3 -m py_compile experiments/Issue243_t1_log_molar_coupled_particle/run.py experiments/Issue243_t1_log_molar_coupled_particle/p3_runtime.py
          python3 -m experiments.Issue243_t1_log_molar_coupled_particle.run | tee issue243-static.txt
      - name: P1-P3 build construct and coupled runtime
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p issue243-logs issue243-case
          docker pull "$BUILD_BASE_REF"
          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace -v "$PWD:/workspace" "$BUILD_BASE_REF" -lc '
            set -euxo pipefail
            source /environment
            git config --global --add safe.directory /workspace
            python3 -m physics_harness.bootstrap ensure evidence --installer uv --manifest-out issue243-logs/bootstrap-container.json
            python3 -m physics_harness.bootstrap check evidence --manifest-out issue243-logs/bootstrap-container-check.json
            eval "$(python3 -m physics_harness.bootstrap_environment --profile evidence --shell bash)"
            test "$PHYSICS_REPO_ROOT" = /workspace
            export MOOSE_DIR=/opt/physics_vendor/moose CRANE_DIR=/opt/physics_vendor/crane SQUIRREL_DIR=/opt/physics_vendor/squirrel ZAPDOS_DIR=/opt/physics_vendor/zapdos METHOD=opt
            make -C physics_app -j2
            python3 -c "from pathlib import Path; from experiments.Issue243_t1_log_molar_coupled_particle.run import build_t1_input,audit_t1_input; text,meta=build_t1_input(); audit=audit_t1_input(text); assert audit[\"status\"]==\"PASS\", audit; Path(\"issue243-case/input.i\").write_text(text)"
            cp experiments/Issue91_real_qvt_r3/r3_e0/qvt.msh issue243-case/
            cp experiments/Issue91_real_qvt_r3/r3_e0/transport_data.txt issue243-case/
            cp experiments/Issue91_real_qvt_r3/r3_e0/electron_moments.txt issue243-case/
            cp physics_app/data/electron_impact/* issue243-case/ || true
            cp physics_app/data/heavy_reactions/* issue243-case/ || true
            physics_app/physics-opt -i issue243-case/input.i --check-input > issue243-logs/check-input.log 2>&1
            timeout 1200s physics_app/physics-opt -i issue243-case/input.i > issue243-logs/runtime.log 2>&1
            python3 -m experiments.Issue243_t1_log_molar_coupled_particle.p3_runtime --case-dir issue243-case --input-file issue243-case/input.i --summary issue243-logs/p3-summary.json
          '
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue243-t1-evidence
          path: |
            issue243-static.txt
            issue243-bootstrap-host.json
            issue243-bootstrap-host-check.json
            issue243-logs
            issue243-case/input.i
            issue243-case/input_out.csv
          if-no-files-found: warn
          retention-days: 14
