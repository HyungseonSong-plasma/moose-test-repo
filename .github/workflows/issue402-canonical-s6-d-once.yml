name: Issue 402 Canonical S6 D Native P3 Once
# Issue #518 replay: operator-authorized exact-main validation after #513/#516/#517/#519.
on:
  push:
    branches: [main]
    paths: [.github/workflows/issue402-canonical-s6-d-once.yml]
permissions:
  contents: read
  actions: read
jobs:
  canonical-s6-d:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case: ['417', '941']
    env:
      HISTORICAL_SHA: 29d1acc6ef7969908b86719e4b95c73a1565136d
      OCI: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
      CHEM: experiments/Issue395_powered_chemistry_ladder
      # Preserve the pinned historical 400 W research-only opt-in.
      OXYGEN_RESEARCH_400: '1'
      OXYGEN_RESEARCH_FULL24: '0'
      OXYGEN_RESEARCH_EI2738_FORMULA: '0'
      OXYGEN_RESEARCH_QUICK_5MIN: '0'
    steps:
      - name: Checkout exact merged canonical PhysicsApp source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout immutable historical public mesh source
        uses: actions/checkout@v4
        with:
          ref: 29d1acc6ef7969908b86719e4b95c73a1565136d
          path: historical
          persist-credentials: false
          fetch-depth: 1
      - name: Confirm source, scientific hold and public rate provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C control rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git -C historical rev-parse HEAD)" = "$HISTORICAL_SHA"
          test ! -e historical/"$CHEM"/private_rates
          grep -Fq "$OCI" control/physics_app/dependencies.lock
          python3 control/experiments/Issue493_s6_boltzmann/public_p2_check.py --control control --mode preflight
      - name: Set up Python for public 400 W mesh and diagnostic plots
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned public numerical packages
        run: python3 -m pip install --disable-pip-version-check --quiet numpy==2.1.2 scipy==1.14.1 matplotlib==3.9.2
      - name: Prepare archived public 400 W mesh without private rates
        shell: bash
        run: |
          set -euo pipefail
          cd historical
          SRC=.github/oxygen25_eedf/initial_mixture_23xsec_transport.txt
          DST=experiments/Issue91_real_qvt_r3/r3_e0/electron_moments.txt
          test "$(sha256sum "$SRC" | cut -d ' ' -f1)" = 35534a522fa48ccb5222339c5040040630eef31e623e1c53f1e1c4540d2d653b
          cp "$SRC" "$DST"
          export CHATGPT_WORK_BASE_SHA="$HISTORICAL_SHA"
          bash "$CHEM/issue397_l1_power_scan_replay.sh" prepare 400
          python3 .github/scripts/oxygen_legacy6_latest_100us.py --power-w 400 --prepare
          test -s "$CHEM/baseline_plasma_plus_unstructured_cover_plus_wafer.msh"
          test ! -e "$CHEM/private_rates"
      - name: Verify exact merged checkout and preflight isolated P2
        shell: bash
        env:
          EXPECTED_SOURCE_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd control
          bash experiments/Issue402_plasma_dsl_g1/preflight_public_option_s6.sh
      - name: Build exact merged PhysicsApp and exercise Native P1/small smoke
        shell: bash
        run: |
          set -euo pipefail
          cd control
          bash experiments/Issue402_plasma_dsl_g1/run_native_binding_smoke.sh
      - name: Run one real 100 us canonical S6 D P3 and public Reference P4
        id: native_p3
        shell: bash
        run: |
          set -euo pipefail
          cd control
          python3 experiments/Issue402_plasma_dsl_g1/run_canonical_s6_p3_once.py \
            --case "${{ matrix.case }}" \
            --historical ../historical \
            --expected-head "${{ github.sha }}" \
            --output "$RUNNER_TEMP/canonical_s6_D_${{ matrix.case }}" \
            --timeout-seconds 19800
      # This is metadata-only and independent of GitHub Artifact storage.
      # The ephemeral Exodus/CSV data are NOT recoverable from a job summary.
      - name: Record status and source-bound hashes in job summary
        id: evidence
        if: always()
        shell: bash
        env:
          RESULTS_DIR: ${{ runner.temp }}/canonical_s6_D_${{ matrix.case }}/results
        run: |
          set -euo pipefail
          if [[ -f "$RESULTS_DIR/status.json" ]]; then
            echo "has_results=true" >> "$GITHUB_OUTPUT"
            python3 - "$RESULTS_DIR/status.json" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          from pathlib import Path
          import sys

          status = json.loads(Path(sys.argv[1]).read_text())
          lines = [
              "## Issue 402 canonical S6 D Native P3 evidence (metadata only)",
              "",
              f"Case: `{status.get('case', 'UNKNOWN')}`",
              f"P0: `{status.get('P0', 'UNKNOWN')}`",
              f"P1: `{status.get('P1', 'UNKNOWN')}`",
              f"P2: `{status.get('P2', 'UNKNOWN')}`",
              f"P3: `{status.get('P3', 'UNKNOWN')}`",
              f"P4: `{status.get('P4', 'UNKNOWN')}`",
              f"Science: `{status.get('science', 'SCIENCE_HOLD')}`",
              f"Runner status: `{status.get('status', 'UNKNOWN')}`",
          ]
          for key in ("source_sha", "binary_sha256", "sidecar_sha256",
                      "p2_log_sha256", "p3_log_sha256",
                      "native_exodus_sha256", "native_csv_sha256",
                      "reference_status", "blocker"):
              if key in status:
                  lines.append(f"{key}: `{status[key]}`")
          lines.append("Native fields and numerical comparison require the uploaded artifacts.")
          Path(sys.argv[2]).open("a").write("\n".join(lines) + "\n")
          PY
          else
            echo "has_results=false" >> "$GITHUB_OUTPUT"
            echo "Issue402: no status.json produced by earlier stages" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Individual retries are separate action steps, NEVER a re-run of Native P3.
      # Different names prevent v4 immutable Artifact naming conflicts.
      - name: Publish P3 evidence (artifact attempt 1)
        id: upload_1
        if: always() && steps.evidence.outputs.has_results == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: issue402-canonical-S6-${{ matrix.case }}-D-${{ github.sha }}-r1
          path: ${{ runner.temp }}/canonical_s6_D_${{ matrix.case }}/results/**
          if-no-files-found: error
          retention-days: 14
      - name: Verify P3 evidence receipt (attempt 1)
        id: receipt_1
        if: always() && steps.upload_1.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 control/ci/guards/verify_issue518_artifact_receipt.py \
            --artifact-id "${{ steps.upload_1.outputs.artifact-id }}" \
            --name "issue402-canonical-S6-${{ matrix.case }}-D-${{ github.sha }}-r1"

      - name: Publish P3 evidence (artifact attempt 2)
        id: upload_2
        if: always() && steps.evidence.outputs.has_results == 'true' && steps.receipt_1.outcome != 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: issue402-canonical-S6-${{ matrix.case }}-D-${{ github.sha }}-r2
          path: ${{ runner.temp }}/canonical_s6_D_${{ matrix.case }}/results/**
          if-no-files-found: error
          retention-days: 14
      - name: Verify P3 evidence receipt (attempt 2)
        id: receipt_2
        if: always() && steps.upload_2.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 control/ci/guards/verify_issue518_artifact_receipt.py \
            --artifact-id "${{ steps.upload_2.outputs.artifact-id }}" \
            --name "issue402-canonical-S6-${{ matrix.case }}-D-${{ github.sha }}-r2"

      - name: Publish P3 evidence (artifact attempt 3)
        id: upload_3
        if: always() && steps.evidence.outputs.has_results == 'true' && steps.receipt_1.outcome != 'success' && steps.receipt_2.outcome != 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: issue402-canonical-S6-${{ matrix.case }}-D-${{ github.sha }}-r3
          path: ${{ runner.temp }}/canonical_s6_D_${{ matrix.case }}/results/**
          if-no-files-found: error
          retention-days: 14
      - name: Verify P3 evidence receipt (attempt 3)
        id: receipt_3
        if: always() && steps.upload_3.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 control/ci/guards/verify_issue518_artifact_receipt.py \
            --artifact-id "${{ steps.upload_3.outputs.artifact-id }}" \
            --name "issue402-canonical-S6-${{ matrix.case }}-D-${{ github.sha }}-r3"

      - name: Require durable Artifact receipt on Native P3 completion
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.native_p3.outcome }}" == 'success' &&
                "${{ steps.evidence.outputs.has_results }}" != 'true' ]]; then
            echo "::error::Native P3 returned success but status.json is missing"
            exit 1
          fi
          if [[ "${{ steps.evidence.outputs.has_results }}" == 'true' ]]; then
            if [[ "${{ steps.receipt_1.outcome }}" == 'success' ||
                  "${{ steps.receipt_2.outcome }}" == 'success' ||
                  "${{ steps.receipt_3.outcome }}" == 'success' ]]; then
              echo "Issue402: public evidence archived and REST receipt verified"
              echo "Issue402 Artifact receipt: PASS" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::Native P3 evidence could not be archived after 3 independent action attempts"
              echo "Issue402 Artifact receipt: FAIL (Native results were ephemeral)" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi
