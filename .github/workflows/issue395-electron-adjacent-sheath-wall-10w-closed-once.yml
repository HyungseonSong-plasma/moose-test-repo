name: Issue 395 adjacent-cell sheath wall 10 W charged-closed elastic+dissociation 100 ns 15 us

on:
  push:
    branches:
      - issue395-electron-adjacent-sheath-wall-10w-closed-dissociation
    paths:
      - '.github/workflows/issue395-electron-adjacent-sheath-wall-10w-closed-once.yml'
      - 'experiments/Issue395_powered_chemistry_ladder/build_o2_dissociation_overlay.py'
      - 'experiments/Issue395_powered_chemistry_ladder/enable_electron_adjacent_sheath_wall.py'
      - 'physics_app/include/materials/PhysicsElectronAdjacentSheathWallFluxMaterial.h'
      - 'physics_app/src/materials/PhysicsElectronAdjacentSheathWallFluxMaterial.C'
      - 'physics_app/src/bcs/PhysicsFEMLogMolarElectronFieldLimitedWallBC.C'

permissions:
  contents: read

jobs:
  electron-adjacent-sheath-wall-10w-closed-dissociation-100ns-15us:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
      CHEM: experiments/Issue395_powered_chemistry_ladder
      DIEL: experiments/Issue3_dielectric_surface_charge
      BASE: experiments/fem_fvm_plasma_discriminator
      TABLE: experiments/Issue91_real_qvt_r3/r3_e0/electron_moments.txt
      RESULT: experiments/Issue395_powered_chemistry_ladder/results_rf_elastic_diss_10w_adjacent_sheath_wall_closed_100ns_15us
      INPUT: experiments/Issue395_powered_chemistry_ladder/rf_elastic_diss_10w_adjacent_sheath_wall_closed_100ns_15us.i

    steps:
      - name: Checkout exact pushed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify exact source revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install host preparation dependencies
        shell: bash
        run: python3 -m pip install --disable-pip-version-check --quiet numpy==2.1.2 scipy==1.14.1

      - name: Build 10 W elastic plus dissociation charged-closed adjacent-sheath-wall input
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RESULT"
          mkdir -p "$RESULT/prep" "$RESULT/run"

          python3 "$BASE/generate_contour_mesh.py" > "$RESULT/prep/mesh_plasma.log" 2>&1
          python3 "$DIEL/extend_cover_mesh.py" \
            "$BASE/plasma_contour_l3_4p5mm.msh" "$DIEL/baseline_cover_fine_source.msh" \
            > "$RESULT/prep/mesh_cover.log" 2>&1
          python3 "$DIEL/build_unstructured_cover_wafer_mesh.py" \
            "$DIEL/baseline_cover_fine_source.msh" "$DIEL/baseline_plasma_plus_unstructured_cover_plus_wafer.msh" \
            > "$RESULT/prep/mesh_cover_wafer.log" 2>&1
          python3 "$DIEL/add_focus_ring_block.py" \
            "$DIEL/baseline_plasma_plus_unstructured_cover_plus_wafer.msh" "$DIEL/baseline_plasma_plus_unstructured_cover_plus_wafer.msh" \
            > "$RESULT/prep/mesh_focus.log" 2>&1
          python3 "$DIEL/add_vacuum_coils_block.py" \
            "$DIEL/baseline_plasma_plus_unstructured_cover_plus_wafer.msh" "$DIEL/baseline_plasma_plus_unstructured_cover_plus_wafer.msh" \
            > "$RESULT/prep/mesh_vacuum.log" 2>&1

          cp "$DIEL/baseline_plasma_plus_unstructured_cover_plus_wafer.msh" \
             "$CHEM/baseline_plasma_plus_unstructured_cover_plus_wafer.msh"
          python3 "$DIEL/prepare_baseline_cover_pilot.py" "$CHEM/a0_full_icp.i" > "$RESULT/prep/materialize.log" 2>&1
          python3 "$DIEL/finalize_baseline_cover_pilot.py" "$CHEM/a0_full_icp.i" > "$RESULT/prep/finalize.log" 2>&1
          python3 "$DIEL/promote_cover_wafer_15us.py" "$CHEM/a0_full_icp.i" > "$RESULT/prep/wafer.log" 2>&1
          python3 "$DIEL/promote_focus_ring_15us.py" "$CHEM/a0_full_icp.i" > "$RESULT/prep/focus.log" 2>&1
          python3 "$DIEL/promote_vacuum_coils_15us.py" "$CHEM/a0_full_icp.i" > "$RESULT/prep/vacuum.log" 2>&1

          cp "$CHEM/a0_full_icp.i" "$INPUT"
          python3 "$DIEL/promote_cover_15us.py" "$INPUT" | tee "$RESULT/prep/original_timegrid.log"
          python3 "$CHEM/set_timegrid_15us.py" "$INPUT" --dt-ns 100 \
            | tee "$RESULT/prep/timegrid_15us.log"
          python3 "$CHEM/enable_electron_adjacent_sheath_wall.py" "$INPUT" \
            | tee "$RESULT/prep/electron_adjacent_sheath_wall.log"

          python3 - "$INPUT" <<'PY' | tee "$RESULT/prep/inlet_outlet_charged_closed.log"
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(encoding='utf-8')
          block_re = re.compile(r'(?ms)^  \[(?P<name>[^\]\n]+)\]\n(?P<body>.*?)^  \[\]\n')
          blocks = {m.group('name'): m.group('body') for m in block_re.finditer(text)}
          expected = {
              'ion_wall': 'log_ni',
              'negative_ion_wall': 'log_nm',
              'atomic_positive_ion_wall': 'log_nop',
          }
          for name, variable in expected.items():
              body = blocks.get(name)
              if body is None:
                  raise SystemExit(f'missing {name}')
              if 'type = FVFunctorNeumannBC' not in body:
                  raise SystemExit(f'{name}: canonical wall-flux BC type missing')
              if f'variable = {variable}' not in body:
                  raise SystemExit(f'{name}: variable mismatch')
              m = re.search(r"(?m)^\s*boundary\s*=\s*'([^']+)'\s*$", body)
              if m is None:
                  raise SystemExit(f'{name}: boundary missing')
              boundaries = set(m.group(1).split())
              if not {'inlet', 'outlet'}.issubset(boundaries):
                  raise SystemExit(f'{name}: inlet/outlet not restored: {sorted(boundaries)}')
          print('ISSUE395_INLET_OUTLET_CHARGED_CLOSED_PASS')
          PY

          python3 "$CHEM/build_rf_multiapp_coupling_10w.py" \
            --table "$TABLE" \
            --parent-overlay "$CHEM/rf_elastic_multiapp_parent_10w_15us_overlay.i" \
            --child-overlay "$CHEM/rf_elastic_multiapp_maxwell_10w_15us_overlay.i" \
            --child-input "$CHEM/rf_elastic_multiapp_maxwell_10w_15us_child.i" \
            | tee "$RESULT/prep/multiapp_10w.log"

          cp physics_app/data/electron_impact/o2_elastic.txt "$CHEM/o2_elastic.txt"
          python3 "$CHEM/build_o2_elastic_overlay.py" \
            --base-input "$CHEM/a0_full_icp.i" \
            --output "$CHEM/o2_elastic_10w_15us_overlay.i" \
            --elastic-table o2_elastic.txt \
            | tee "$RESULT/prep/elastic_overlay.log"

          python3 "$CHEM/build_o2_dissociation_overlay.py" \
            --base-input "$CHEM/a0_full_icp.i" \
            --output "$CHEM/o2_dissociation_10w_15us_overlay.i" \
            | tee "$RESULT/prep/dissociation_overlay.log"

          python3 -m py_compile \
            "$CHEM/set_timegrid_15us.py" \
            "$CHEM/enable_electron_adjacent_sheath_wall.py" \
            "$CHEM/build_rf_multiapp_coupling_10w.py" \
            "$CHEM/build_o2_elastic_overlay.py" \
            "$CHEM/build_o2_dissociation_overlay.py"

          grep -q 'ISSUE395_INLET_OUTLET_CHARGED_CLOSED_PASS' "$RESULT/prep/inlet_outlet_charged_closed.log"
          grep -q 'ISSUE395_ELECTRON_ADJACENT_SHEATH_WALL_PASS' "$RESULT/prep/electron_adjacent_sheath_wall.log"
          grep -q 'ISSUE395_TIMEGRID_15US_PASS' "$RESULT/prep/timegrid_15us.log"
          grep -q 'main_1_to_15us_dt_ns=100' "$RESULT/prep/timegrid_15us.log"
          grep -q 'total_steps=330' "$RESULT/prep/timegrid_15us.log"
          grep -q 'end_time = 1.5e-5' "$INPUT"
          grep -q 'type = PhysicsElectronAdjacentSheathWallFluxMaterial' "$INPUT"
          grep -q 'potential = potential' "$INPUT"
          grep -q 'use_element_gradient_for_potential = true' "$INPUT"
          test "$(grep -c 'type = PhysicsFEMLogMolarElectronFieldLimitedFluxBC' "$INPUT")" -eq 4
          test "$(grep -c 'type = PhysicsFEMLogMolarElectronEnergyFieldLimitedFluxBC' "$INPUT")" -eq 4
          test "$(grep -c "boundary = 'inlet outlet plasma_electrode plasma_metal plasma_right'" "$INPUT")" -eq 3
          grep -q 'type = FullSolveMultiApp' "$CHEM/rf_elastic_multiapp_parent_10w_15us_overlay.i"
          grep -q 'target = 10' "$CHEM/rf_elastic_multiapp_parent_10w_15us_overlay.i"
          grep -q 'ISSUE395_RF_MULTIAPP_10W_BUILD_PASS' "$RESULT/prep/multiapp_10w.log"
          grep -q 'R_elastic_O2' "$CHEM/o2_elastic_10w_15us_overlay.i"
          ! grep -q 'R_diss_O2' "$CHEM/o2_elastic_10w_15us_overlay.i"
          ! grep -q 'R_ion_O2' "$CHEM/o2_elastic_10w_15us_overlay.i"
          grep -q 'ISSUE395_O2_DISSOCIATION_OVERLAY_BUILD_PASS' "$RESULT/prep/dissociation_overlay.log"
          grep -q 'property_name = R_diss_O2' "$CHEM/o2_dissociation_10w_15us_overlay.i"
          grep -q 'property_name = S_O_mass_diss' "$CHEM/o2_dissociation_10w_15us_overlay.i"
          grep -q 'property_name = S_electron_energy_molar_diss' "$CHEM/o2_dissociation_10w_15us_overlay.i"
          grep -q '12.62' "$CHEM/o2_dissociation_10w_15us_overlay.i"
          ! grep -q 'R_ion_O2' "$CHEM/o2_dissociation_10w_15us_overlay.i"
          ! grep -q 'R_ion_O' "$CHEM/o2_dissociation_10w_15us_overlay.i"

      - name: Pull pinned Physics build image
        shell: bash
        run: docker pull "$BUILD_BASE_REF"

      - name: Build exact-head Physics application
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash --user 0:0 \
            --workdir /workspace -v "$GITHUB_WORKSPACE:/workspace" \
            "$BUILD_BASE_REF" -lc '
              set -euo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory /opt/physics_vendor/moose
              git config --global --add safe.directory /opt/physics_vendor/crane
              git config --global --add safe.directory /opt/physics_vendor/squirrel
              git config --global --add safe.directory /opt/physics_vendor/zapdos
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt
              make -C physics_app -j2
            '
          test -x physics_app/physics-opt

      - name: Check 10 W charged-closed elastic plus dissociation input
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash --user 0:0 \
            --workdir /workspace -v "$GITHUB_WORKSPACE:/workspace" \
            "$BUILD_BASE_REF" -lc "
              set -euo pipefail
              source /environment
              physics_app/physics-opt --check-input \
                -i '$INPUT' \
                '$CHEM/rf_elastic_multiapp_parent_10w_15us_overlay.i' \
                '$CHEM/o2_elastic_10w_15us_overlay.i' \
                '$CHEM/o2_dissociation_10w_15us_overlay.i'
            " 2>&1 | tee "$RESULT/check_input.log"

      - name: Run 10 W charged-closed elastic plus dissociation case to 15 us
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash --user 0:0 \
            --workdir /workspace -v "$GITHUB_WORKSPACE:/workspace" \
            "$BUILD_BASE_REF" -lc "
              set -euo pipefail
              source /environment
              physics_app/physics-opt \
                -i '$INPUT' \
                '$CHEM/rf_elastic_multiapp_parent_10w_15us_overlay.i' \
                '$CHEM/o2_elastic_10w_15us_overlay.i' \
                '$CHEM/o2_dissociation_10w_15us_overlay.i' \
                Outputs/file_base='$RESULT/run/plasma'
            " 2>&1 | tee "$RESULT/runtime.log"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue395-rf-elastic-diss-10w-adjacent-sheath-wall-closed-100ns-15us-evidence
          path: |
            experiments/Issue395_powered_chemistry_ladder/results_rf_elastic_diss_10w_adjacent_sheath_wall_closed_100ns_15us/**
            experiments/Issue395_powered_chemistry_ladder/rf_elastic_diss_10w_adjacent_sheath_wall_closed_100ns_15us.i
            experiments/Issue395_powered_chemistry_ladder/a0_full_icp.i
            experiments/Issue395_powered_chemistry_ladder/rf_elastic_multiapp_parent_10w_15us_overlay.i
            experiments/Issue395_powered_chemistry_ladder/rf_elastic_multiapp_maxwell_10w_15us_overlay.i
            experiments/Issue395_powered_chemistry_ladder/rf_elastic_multiapp_maxwell_10w_15us_child.i
            experiments/Issue395_powered_chemistry_ladder/o2_elastic_10w_15us_overlay.i
            experiments/Issue395_powered_chemistry_ladder/o2_dissociation_10w_15us_overlay.i
            experiments/Issue395_powered_chemistry_ladder/build_o2_dissociation_overlay.py
            experiments/Issue395_powered_chemistry_ladder/enable_electron_adjacent_sheath_wall.py
            physics_app/include/materials/PhysicsElectronAdjacentSheathWallFluxMaterial.h
            physics_app/src/materials/PhysicsElectronAdjacentSheathWallFluxMaterial.C
            physics_app/src/bcs/PhysicsFEMLogMolarElectronFieldLimitedWallBC.C
          if-no-files-found: warn
          retention-days: 30
