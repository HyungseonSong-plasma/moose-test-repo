name: Issue-218 R2 resource-feasible discriminator

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/issue218-r2-resource-feasible.yml'
      - 'experiments/Issue218_r2_resource/**'
      - 'experiments/Issue216_w5_multistep_acceptance/**'
      - 'experiments/Issue217_sheath_energy_closure/**'
      - 'experiments/Issue27_surface_reactions/final_stage6.py'
      - 'experiments/Issue27_surface_reactions/controlled_wall/**'
      - 'experiments/Issue27_stage6_final_acceptance/**'
      - 'experiments/Issue192_s5r_representative/**'
      - 'experiments/Issue91_real_qvt_r3/r3_e0/**'
      - 'experiments/historical_recipe_support/issue26_energy_chain.py'
      - 'experiments/historical_recipe_support/issue26_e1.py'
      - 'physics_app/include/fvbcs/PhysicsGroundedElectronSheathFlux.h'
      - 'physics_app/include/fvbcs/PhysicsFVElectronGroundedSheathCollectionBC.h'
      - 'physics_app/src/fvbcs/PhysicsFVElectronGroundedSheathCollectionBC.C'
      - 'physics_app/include/fvbcs/PhysicsFVElectronGroundedSheathEnergyBC.h'
      - 'physics_app/src/fvbcs/PhysicsFVElectronGroundedSheathEnergyBC.C'
  workflow_dispatch:

concurrency:
  group: issue218-r2-resource-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
  MOOSE_SHA: 9f388366ccf38b9c34542ec5561198249fde0ac9
  CRANE_SHA: ba26970cf419dcac563a20ed7079d445bc6341c3
  SQUIRREL_SHA: 16a26d504f3ee11161a86d4e3ebf3c0e5f2afbb1
  ZAPDOS_SHA: 9eceffbc46048c3760bbfa9a7f1ca681ae35af1d

jobs:
  r2-resource:
    name: R2 solver bridge and resource-feasible endpoint
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate immutable build-base identity
        shell: bash
        run: |
          set -euxo pipefail
          source physics_app/dependencies.lock
          test "$MOOSE" = "$MOOSE_SHA"
          test "$CRANE" = "$CRANE_SHA"
          test "$SQUIRREL" = "$SQUIRREL_SHA"
          test "$ZAPDOS" = "$ZAPDOS_SHA"
          docker pull "$BUILD_BASE_REF"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.moose.sha" }}')" = "$MOOSE_SHA"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.crane.sha" }}')" = "$CRANE_SHA"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.squirrel.sha" }}')" = "$SQUIRREL_SHA"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.zapdos.sha" }}')" = "$ZAPDOS_SHA"

      - name: P0 solver-only equivalence construction
        shell: bash
        run: |
          set -euxo pipefail
          CONTAINER_PREFLIGHT=$(cat <<'BASH'
          set -euxo pipefail
          source /environment
          git config --global --add safe.directory /workspace
          export PYTHONPATH=/workspace
          test "$(git -C /workspace rev-parse HEAD)" = "$GITHUB_SHA"
          uv pip install --system --python "$(command -v python3)" -r requirements-evidence-engine.txt
          python3 -m py_compile /workspace/experiments/Issue218_r2_resource/run.py
          python3 /workspace/experiments/Issue218_r2_resource/run.py --self-test
          python3 /workspace/experiments/Issue27_stage6_final_acceptance/run.py --self-test
          BASH
          )
          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace \
            -e GITHUB_SHA="$GITHUB_SHA" \
            -v "$PWD:/workspace" "$BUILD_BASE_REF" -lc "$CONTAINER_PREFLIGHT"

      - name: Build exact head and execute solver bridge plus R2
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf issue218-r2-resource-results issue218-stage6-control-results
          mkdir -p issue218-r2-resource-results issue218-stage6-control-results
          CONTAINER_SCRIPT=$(cat <<'BASH'
          set -euxo pipefail
          source /environment
          git config --global --add safe.directory /workspace
          export MOOSE_DIR=/opt/physics_vendor/moose
          export CRANE_DIR=/opt/physics_vendor/crane
          export SQUIRREL_DIR=/opt/physics_vendor/squirrel
          export ZAPDOS_DIR=/opt/physics_vendor/zapdos
          export METHOD=opt
          export PYTHONPATH=/workspace
          uv pip install --system --python "$(command -v python3)" -r requirements-evidence-engine.txt
          test "$(git -C /workspace rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -e physics_app/physics-opt
          make -C physics_app -j2
          test -x physics_app/physics-opt

          set +e
          /usr/bin/time -v -o /workspace/issue218-r2-resource-results/runner_resource.txt \
            python3 /workspace/experiments/Issue218_r2_resource/run.py \
              --physics-opt /workspace/physics_app/physics-opt \
              --results-root /workspace/issue218-r2-resource-results \
              --timeout 3600
          R2_RC=$?

          python3 /workspace/experiments/Issue27_stage6_final_acceptance/run.py \
            --physics-opt /workspace/physics_app/physics-opt \
            --results-root /workspace/issue218-stage6-control-results \
            --timeout 900
          STAGE6_RC=$?
          set -e

          test -f /workspace/issue218-r2-resource-results/summary.json
          test -f /workspace/issue218-stage6-control-results/summary.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r2 = json.loads(Path('/workspace/issue218-r2-resource-results/summary.json').read_text())
          s6 = json.loads(Path('/workspace/issue218-stage6-control-results/summary.json').read_text())
          print({
              'ISSUE218_STATUS': r2.get('status'),
              'BRIDGE_PASS': r2.get('bridge_equivalence', {}).get('passed'),
              'R2_COMPLETE': r2.get('decision', {}).get('r2_endpoint_complete'),
              'NON_CONTRACTING': r2.get('mesh_convergence', {}).get('non_contracting_observables'),
              'STAGE6_SCIENTIFIC_HARD_PASS': s6.get('decision', {}).get('scientific_hard_pass'),
          })
          assert s6.get('decision', {}).get('scientific_hard_pass') is True
          PY
          test "$R2_RC" -eq 0
          test "$STAGE6_RC" -eq 0
          BASH
          )
          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace \
            -e GITHUB_SHA="$GITHUB_SHA" \
            -v "$PWD:/workspace" "$BUILD_BASE_REF" -lc "$CONTAINER_SCRIPT"

      - name: Upload Issue-218 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue218-r2-resource-evidence
          path: |
            issue218-r2-resource-results/**
            issue218-stage6-control-results/**
          if-no-files-found: error
          retention-days: 7
