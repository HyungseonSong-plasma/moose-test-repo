name: Gen34 Oracle Bundle Inspect

on:
  push:
    branches:
      - issue-gen34-parity-inspect

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Checkout qualified Gen34 source
        uses: actions/checkout@v4
        with:
          repository: HyungseonSong-plasma/moose-test-repo
          ref: cdba1cba025da3c8442c0ad2993aeccab0111732
          path: oracle

      - name: Generate qualified Gen34 inputs
        shell: bash
        run: |
          set -euxo pipefail
          cd oracle
          python3 experiments/Issue310_fp_acceleration/control_seq34_relax2x_reference_input.py --build
          root="experiments/Issue310_fp_acceleration/generated_fp34_relax2x_reference/optimized_endpoint_20ns"
          test -f "$root/input.i"
          test -f "$root/fast_sub.i"
          test -f "$root/poisson_sub.i"
          test -f "$root/electron_moments.txt"
          test -f "$root/transport_data.txt"
          test -f "$root/o2_elastic.txt"
          mkdir -p ../gen34-oracle
          cp "$root"/input.i ../gen34-oracle/
          cp "$root"/fast_sub.i ../gen34-oracle/
          cp "$root"/poisson_sub.i ../gen34-oracle/
          cp "$root"/electron_moments.txt ../gen34-oracle/
          cp "$root"/transport_data.txt ../gen34-oracle/
          cp "$root"/o2_elastic.txt ../gen34-oracle/
          cp "$root"/case.json ../gen34-oracle/
          sha256sum ../gen34-oracle/*

      - name: Upload qualified Gen34 bundle
        uses: actions/upload-artifact@v4
        with:
          name: gen34-qualified-oracle-bundle
          path: gen34-oracle
          retention-days: 1
