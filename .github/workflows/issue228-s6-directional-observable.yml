name: Issue-228 S6-A directional observable qualification

on:
  push:
    branches: [issue-228-s6-directional-observable]
    paths:
      - '.github/workflows/issue228-s6-directional-observable.yml'
      - 'experiments/Issue228_s6_directional_observable/**'
      - 'physics_app/include/fvkernels/PhysicsFVDiffusionDiagnostic.h'
      - 'physics_app/src/fvkernels/PhysicsFVDiffusionDiagnostic.C'

permissions:
  contents: read
  actions: read

env:
  BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
  MOOSE_SHA: 9f388366ccf38b9c34542ec5561198249fde0ac9
  CRANE_SHA: ba26970cf419dcac563a20ed7079d445bc6341c3
  SQUIRREL_SHA: 16a26d504f3ee11161a86d4e3ebf3c0e5f2afbb1
  ZAPDOS_SHA: 9eceffbc46048c3760bbfa9a7f1ca681ae35af1d

jobs:
  s6a-observable-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact provenance and pinned dependencies
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          source physics_app/dependencies.lock
          test "$MOOSE" = "$MOOSE_SHA"
          test "$CRANE" = "$CRANE_SHA"
          test "$SQUIRREL" = "$SQUIRREL_SHA"
          test "$ZAPDOS" = "$ZAPDOS_SHA"
          docker pull "$BUILD_BASE_REF"

      - name: Download governed step-10 snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p snapshot
          gh run download 34949699566 -n issue228-pgw-baseline-snapshot -D snapshot
          test -f snapshot/case/input_out.e
          test -f snapshot/summary.json

      - name: Build and qualify S6-A observable
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf issue228-s6a-results
          mkdir -p issue228-s6a-results
          set +e
          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace \
            -e GITHUB_SHA="$GITHUB_SHA" \
            -v "$PWD:/workspace" "$BUILD_BASE_REF" -lc '
              set -euxo pipefail
              source /environment
              export PYTHONPATH=/workspace
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt
              git config --global --add safe.directory /workspace
              test "$(git -C /workspace rev-parse HEAD)" = "$GITHUB_SHA"
              uv pip install --system --python "$(command -v python3)" -r requirements-evidence-engine.txt
              uv pip install --system --python "$(command -v python3)" scipy
              python3 -m py_compile experiments/Issue228_s6_directional_observable/run.py
              python3 experiments/Issue228_s6_directional_observable/run.py --self-test
              make -C physics_app -j2
              test -x physics_app/physics-opt
              python3 experiments/Issue228_s6_directional_observable/run.py \
                --snapshot-root snapshot \
                --physics-opt physics_app/physics-opt \
                --results-root issue228-s6a-results \
                --timeout 900
            '
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ ! -f issue228-s6a-results/summary.json ]; then
            python3 - "$rc" "$GITHUB_SHA" <<'PY'
          import json
          import sys
          from pathlib import Path

          rc = int(sys.argv[1])
          sha = sys.argv[2]
          payload = {
              "ci_status": "FAILURE",
              "evidence_valid": False,
              "scientific_outcome": "NOT_EVALUATED",
              "status": "HARNESS_OR_CONSTRUCTION_FAIL",
              "failure_stage": "workflow_or_container_pre_science",
              "container_exit_code": rc,
              "github_sha": sha,
          }
          Path("issue228-s6a-results/summary.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          fi
          exit "$rc"

      - name: Upload S6-A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue228-s6a-directional-observable
          path: issue228-s6a-results
          if-no-files-found: error
          retention-days: 7
