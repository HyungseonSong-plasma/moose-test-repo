name: Issue 3 actions cleanup one-shot

on:
  push:
    branches: [main]
    paths: [.github/workflows/issue3-actions-cleanup-once.yml]

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Delete cancelled and skipped workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          snapshot_ids="$(mktemp)"
          for conclusion in cancelled skipped; do
            gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/actions/runs?status=$conclusion&per_page=100" \
              --jq ".workflow_runs[] | select(.status == \"completed\" and .conclusion == \"$conclusion\") | .id" \
              >> "$snapshot_ids"
          done
          sort -n -u -o "$snapshot_ids" "$snapshot_ids"

          mapfile -t run_ids < "$snapshot_ids"
          echo "CANCELLED_OR_SKIPPED_RUNS_FOUND=${#run_ids[@]}"

          for run_id in "${run_ids[@]}"; do
            if [ "$run_id" = "$GITHUB_RUN_ID" ]; then
              continue
            fi
            echo "Deleting workflow run $run_id"
            gh api --method DELETE \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/actions/runs/$run_id"
          done

          remaining=-1
          for attempt in 1 2 3 4 5; do
            current_ids="$(mktemp)"
            for conclusion in cancelled skipped; do
              gh api --paginate \
                -H 'Accept: application/vnd.github+json' \
                "repos/$GITHUB_REPOSITORY/actions/runs?status=$conclusion&per_page=100" \
                --jq ".workflow_runs[] | select(.status == \"completed\" and .conclusion == \"$conclusion\") | .id" \
                >> "$current_ids"
            done
            sort -n -u -o "$current_ids" "$current_ids"
            remaining="$(comm -12 "$snapshot_ids" "$current_ids" | wc -l | tr -d ' ')"
            rm -f "$current_ids"
            echo "SNAPSHOT_RUNS_REMAINING=$remaining verification_attempt=$attempt"
            if [ "$remaining" = "0" ]; then
              break
            fi
            sleep 2
          done

          rm -f "$snapshot_ids"
          test "$remaining" = "0"
