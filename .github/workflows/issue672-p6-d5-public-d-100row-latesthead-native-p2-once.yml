name: Issue672 P6-D5 Public D 100row generated Chemistry Physics Native P2 once
on:
  push:
    branches:
      - issue-672-p6-d5-public-d-100row-physics-integrate-20261118
    paths:
      - .github/workflows/issue672-p6-d5-public-d-100row-latesthead-native-p2-once.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: issue672-p6-d5-latest-665-public-d-original100-native-p2-20261118
  cancel-in-progress: false
jobs:
  original-100row-native-p2:
    if: github.repository == 'HyungseonSong-plasma/moose-test-repo'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OCI: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
      BASE_HEAD: ${{ github.sha }}
    steps:
      - name: Checkout exact source without writing authentication credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact New Physics source and immutable original 100-row table
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_HEAD"
          git merge-base --is-ancestor 52067302d16074592503d0ef6b903cc344f55a08 HEAD
          test "$(git hash-object physics_app/src/physics/plasma/DDContinuityEq.C)" = 13b25226d463b8fd1e4acaee16358f8f17d710a0
          test "$(git hash-object physics_app/src/physics/plasma/Chemistry.C)" = 045de080e3d836d75495b1749d75d5d3deea2330
          test "$(git hash-object experiments/Issue91_real_qvt_r3/r3_e0/electron_moments.txt)" = bedcaf17fb3ef93ba8973cc6b32aa6e783e2292a
          echo "994f6b1deece3c53be7fb3e7f9526555d0f9314fd58749bea6346639f08aa387  experiments/Issue91_real_qvt_r3/r3_e0/electron_moments.txt" | sha256sum --check -
          test ! -e physics_app/physics-opt
          test ! -e experiments/Issue395_powered_chemistry_ladder/private_rates
          echo PUBLIC_D_ORIGINAL_100ROW_AND_CHEMISTRY_PHYSICS_SOURCE_PIN_PASS
      - name: Checkout immutable historical public S6 mesh and support source
        uses: actions/checkout@v4
        with:
          ref: 29d1acc6ef7969908b86719e4b95c73a1565136d
          path: historical
          fetch-depth: 1
          persist-credentials: false
      - name: Reproduce exact SHA-pinned 400 W public parent plasma mesh
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet \
            'pytest>=8,<9' 'pydantic>=2,<3' numpy==2.1.2 scipy==1.14.1 matplotlib==3.9.2 \
            -r requirements-evidence-engine.txt -r requirements-ontology.txt
          cd historical
          # Historical 400W mesh preparation is a DIFFERENT reference contract.
          # Only inside this discarded historical checkout, use the 42-row
          # 23xsec reference expected by its pre-existing mesh generator.
          # Actual Public D source and final disposable Physics input remain
          # pinned to their immutable ORIGINAL 100-row table SHA.
          SRC=.github/oxygen25_eedf/initial_mixture_23xsec_transport.txt
          DST=experiments/Issue91_real_qvt_r3/r3_e0/electron_moments.txt
          echo "994f6b1deece3c53be7fb3e7f9526555d0f9314fd58749bea6346639f08aa387  $DST" | sha256sum --check -
          echo "35534a522fa48ccb5222339c5040040630eef31e623e1c53f1e1c4540d2d653b  $SRC" | sha256sum --check -
          cp "$SRC" "$DST"
          echo "35534a522fa48ccb5222339c5040040630eef31e623e1c53f1e1c4540d2d653b  $DST" | sha256sum --check -
          export CHATGPT_WORK_BASE_SHA=29d1acc6ef7969908b86719e4b95c73a1565136d
          export OXYGEN_RESEARCH_400=1
          CHEM=experiments/Issue395_powered_chemistry_ladder
          bash "$CHEM/issue397_l1_power_scan_replay.sh" prepare 400
          python3 .github/scripts/oxygen_legacy6_latest_100us.py --power-w 400 --prepare
          echo "ac70642df75bf7b4bc4ec0d92511e545f0942f9e07a1361618fb9eb5696b83fc  $CHEM/baseline_plasma_plus_unstructured_cover_plus_wafer.msh" | sha256sum --check -
          test ! -e "$CHEM/private_rates"
          echo P05_PUBLIC_MESH_SHA_PASS

      - name: Download exact verified 417 941 P3-X public source and immutable diagnostic staging helper
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p05-in"
          curl --fail --location --silent --show-error --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/14406746397/zip" \
            --output "$RUNNER_TEMP/p05-in/p3x-source.zip"
          echo "592a7c82834bab841f6a2e1807db305d0eff1e953f50a0dcc6d7e21ff8820111  $RUNNER_TEMP/p05-in/p3x-source.zip" | sha256sum --check -
          curl --fail --location --silent --show-error --retry 3 \
            "https://raw.githubusercontent.com/HyungseonSong-plasma/moose-test-repo/41ab61e442a497db2388c025075237bd24cfd025/ci/issue671_p5_d8_native_probe.py" \
            --output "$RUNNER_TEMP/p05-in/pinned_source_stager.py"
          test "$(git hash-object "$RUNNER_TEMP/p05-in/pinned_source_stager.py")" = 8bf49b7807c9f9b3eed8e622e72062f2b5c822bc
          python3 -m py_compile "$RUNNER_TEMP/p05-in/pinned_source_stager.py"
          echo P05_PUBLIC_ARTIFACT_AND_STAGER_PIN_PASS

      - name: Stage real eleven-layer inputs with original mesh and support; exact P4-X owner cutover
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p05-in/staged"
          python3 "$RUNNER_TEMP/p05-in/pinned_source_stager.py" \
            --source "$GITHUB_WORKSPACE" --repo-head "$BASE_HEAD" \
            --artifact "$RUNNER_TEMP/p05-in/p3x-source.zip" \
            --historical-mesh "$GITHUB_WORKSPACE/historical/experiments/Issue395_powered_chemistry_ladder/baseline_plasma_plus_unstructured_cover_plus_wafer.msh" \
            --historical-support-root "$GITHUB_WORKSPACE/historical" \
            --output "$RUNNER_TEMP/p05-in/staged" --stage-only
          python3 - "$RUNNER_TEMP/p05-in/staged" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/p05-in/p4_receipt.json" <<'PY'
          from pathlib import Path
          import sys,json,hashlib
          stage=Path(sys.argv[1]); root=Path(sys.argv[2]); out=Path(sys.argv[3])
          sys.path.insert(0,str(root/"experiments/Issue402_plasma_dsl_g1/chemistry"))
          from retire_s6_p4_duplicate_owners import retire_p4_duplicate_owners, C0, AFTER_SHA
          stages=json.loads((stage/"readiness.json").read_text())["stage_cases"]
          receipts={}
          for case in ("417","941"):
              folder=stage/"scratch"/case/"experiments"/"Issue395_powered_chemistry_ladder"
              raw_ordered=stages[case]["ordered"]
              ordered=[Path(p).name for p in raw_ordered]
              assert len(ordered)==11 and ordered[0]==C0 and len(set(ordered))==11
              sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
              baseline={n:sha(folder/n) for n in ordered}
              marker=folder/".issue633_disposable_scratch"
              assert not marker.is_symlink()
              if marker.exists():
                  assert marker.read_text().strip()=="issue633-scratch-only"
              else:
                  marker.write_text("issue633-scratch-only\n")
              js=json.loads((folder/"chemistry"/f"unified_s6_{case}_newonly.json").read_text())
              cut=retire_p4_duplicate_owners(folder,ordered,js,post_p3_layer_sha=baseline)
              assert sha(folder/C0)==AFTER_SHA
              assert all(sha(folder/n)==baseline[n] for n in ordered[1:])
              assert cut["retired_source_materials"]==6 and cut["carrier_one_preserved"]
              receipts[case]={"P4X":"P4X_7_OWNER_SOURCE_PASS","post_p4_C0_sha256":sha(folder/C0),
                              "retired_old_ion_FV":26,"retired_old_electron":10,
                              "retired_old_duplicate_materials":6,"carrier_one_preserved":True,
                              "ordered_inputs":raw_ordered,
                              "11_layer_sha256":{n:sha(folder/n) for n in ordered},
                              "JSON_sha256":sha(folder/"chemistry"/f"unified_s6_{case}_newonly.json"),
                              "parent_mesh_sha256":sha(folder/"baseline_plasma_plus_unstructured_cover_plus_wafer.msh")}
          out.write_text(json.dumps(receipts,indent=2,sort_keys=True)+"\n")
          print("P05_REAL_POST_P4X_STAGE_BOTH_CASES_11_LAYER_PASS")
          PY

      - name: Cutover staged original 100-row D and verify Physics Chemistry 12+12 source graph
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          mkdir -p "$RUNNER_TEMP/p05-out"
          python3 - "$RUNNER_TEMP/p05-in/p4_receipt.json" "$RUNNER_TEMP/p05-in/staged" <<'PY'
          from pathlib import Path
          import json,sys
          p4=json.loads(Path(sys.argv[1]).read_text())
          out=Path(sys.argv[2])
          for case in ("417","941"):
              v=p4[case]
              assert len(v["ordered_inputs"])==11
              assert v["retired_old_ion_FV"]==26
              assert v["retired_old_electron"]==10
              assert v["retired_old_duplicate_materials"]==6
              assert v["carrier_one_preserved"] is True
              (out/("ordered-"+case+".json")).write_text(json.dumps(v["ordered_inputs"])+"\n")
          PY
          for case in 417 941; do
            folder="$RUNNER_TEMP/p05-in/staged/scratch/$case/experiments/Issue395_powered_chemistry_ladder"
            python3 experiments/Issue402_plasma_dsl_g1/chemistry/prepare_public_d_newphysics_100row.py \
              --case "$case" --folder "$folder" \
              --ordered "$RUNNER_TEMP/p05-in/staged/ordered-$case.json" \
              --original-table "$GITHUB_WORKSPACE/experiments/Issue91_real_qvt_r3/r3_e0/electron_moments.txt" \
              --receipt "$RUNNER_TEMP/p05-out/public-d-$case.json"
          done
          echo "994f6b1deece3c53be7fb3e7f9526555d0f9314fd58749bea6346639f08aa387  experiments/Issue91_real_qvt_r3/r3_e0/electron_moments.txt" | sha256sum --check -
          test ! -e experiments/Issue395_powered_chemistry_ladder/private_rates
          echo PUBLIC_D_REAL_11LAYER_ORIGINAL_100ROW_PHYSICS_417_941_STAGE_PASS
      - name: Build one source-HEAD PhysicsApp ELF and app libraries in pinned OCI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p05-out"
          test "$(git rev-parse HEAD)" = "$BASE_HEAD"
          test ! -e physics_app/physics-opt
          docker pull "$OCI"
          docker run --rm --network none --platform linux/amd64 --entrypoint /bin/bash --user 0:0 \
            --workdir /workspace -v "$PWD:/workspace" "$OCI" -lc '
              set -euo pipefail
              source /environment
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt
              make -C physics_app -j2 app_non_unity_dirs="%/utils"
              test -x physics_app/physics-opt
            ' > "$RUNNER_TEMP/p05-out/build.log" 2>&1
          python3 - "$RUNNER_TEMP/p05-out/build-identity.json" <<'PY'
          from pathlib import Path
          import hashlib,subprocess,os,sys,json
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          files=[
            Path("physics_app/physics-opt"),
            Path("physics_app/lib/libphysics-opt.so.0"),
            Path("physics_app/test/lib/libphysics_test-opt.so.0"),
          ]
          if any(not p.is_file() or p.open("rb").read(4)!=b"\x7fELF" for p in files):
              raise RuntimeError("PUBLIC_D_EXACT_HEAD_ELF_OR_APP_LIBS_MISSING")
          head=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          if head!=os.environ["BASE_HEAD"]:
              raise RuntimeError("PUBLIC_D_BINARY_SOURCE_HEAD_DRIFT")
          identity={
            "source_head":head,
            "OCI":os.environ["OCI"],
            "build_count":1,
            "binary_sha256":sha(files[0]),
            "app_libraries_sha256":{p.name:sha(p) for p in files[1:]},
            "source_material":"original 100-row table; generated Physics Chemistry 8 reactions",
            "P2":"NOT_RUN","P3":"NOT_RUN","P4":"NOT_RUN",
          }
          Path(sys.argv[1]).write_text(json.dumps(identity,indent=2,sort_keys=True)+"\n")
          print("PUBLIC_D_EXACT_SOURCE_W1_SINGLE_BINARY_AND_2_APPLIBS_PASS",head,identity["binary_sha256"])
          PY
      - name: Secure protected EI rates and two distinct 100-row Public D Native checks
        shell: bash
        env:
          PROTECTED_ARCHIVE_B64: ${{ secrets.OXYGEN24_RATES_TAR_XZ_B64 }}
        run: |
          set -euo pipefail
          umask 077
          python3 - "$RUNNER_TEMP/p05-in/staged" "$RUNNER_TEMP/p05-in/p4_receipt.json" \
            "$RUNNER_TEMP/p05-out" "$GITHUB_WORKSPACE" <<'PY'
          from pathlib import Path
          import hashlib,json,os,shlex,shutil,subprocess,sys,tempfile
          staged,p4file,out,repo=map(Path,sys.argv[1:5])
          out.mkdir(exist_ok=True)
          sys.path.insert(0,str(repo/"ci"/"guards"))
          from issue671_secure_ei_rate_scratch import read_hashed_rows,REQUIRED,EXPECTED,validate_rows
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          p4=json.loads(p4file.read_text())
          ident=json.loads((out/"build-identity.json").read_text())
          binary=repo/"physics_app/physics-opt"
          status={"schema":"issue672.p6_d5.public_d_100row_newphysics_native_p2.v1",
                  "source_head":ident["source_head"],"OCI":ident["OCI"],
                  "binary_sha256":ident["binary_sha256"],
                  "app_libraries_sha256":ident["app_libraries_sha256"],
                  "shared_binary_for_both_cases":True,"original_100row_sha256":
                  "994f6b1deece3c53be7fb3e7f9526555d0f9314fd58749bea6346639f08aa387",
                  "mode":"PUBLIC_D_GENERATED_PHYSICS_CHEMISTRY_ONLY",
                  "historical_public_D_compat_runner":"NOT_CREATED",
                  "P2":"HOLD","P3":"NOT_RUN","P4":"NOT_RUN",
                  "science":"SCIENCE_HOLD","cases":{},"protected_rates_staged_only_in_tmpfs":True,
                  "protected_raw_rate_in_artifact":False,"tmpfs_cleanup_verified":False}
          private=None
          try:
              if ident["source_head"]!=os.environ["BASE_HEAD"] or sha(binary)!=ident["binary_sha256"]:
                  raise RuntimeError("PUBLIC_D_EXACT_HEAD_OR_BINARY_CHANGED")
              meta,rates=read_hashed_rows()
              if set(rates)!=set(EXPECTED) or not all(v["sha256_match"] and v["numeric_shape_pass"] for v in meta.values() if v["file"] in EXPECTED):
                  raise RuntimeError("PUBLIC_D_PROTECTED_RATE_ORIGINAL_SHA_HOLD")
              os.environ.pop("PROTECTED_ARCHIVE_B64",None)
              private=Path(tempfile.mkdtemp(prefix="issue672-public-d-",dir="/dev/shm"))
              if (private.stat().st_mode & 0o777)!=0o700: raise RuntimeError("PUBLIC_D_PRIVATE_DIR_PERMISSIONS")
              for case in ("417","941"):
                  case_stage=staged/"scratch"/case
                  original=case_stage/"experiments/Issue395_powered_chemistry_ladder"
                  stage_receipt=json.loads((out/f"public-d-{case}.json").read_text())
                  if stage_receipt["case"]!=case or stage_receipt["original_table_rows"]!=100:
                      raise RuntimeError("PUBLIC_D_SOURCE_RECEIPT_NOT_ORIGINAL100")
                  if p4[case]["retired_old_ion_FV"]!=26 or p4[case]["retired_old_electron"]!=10 or p4[case]["retired_old_duplicate_materials"]!=6:
                      raise RuntimeError("PUBLIC_D_OWNER_RETIREMENT_INCOMPLETE")
                  work=private/case
                  shutil.copytree(case_stage,work,symlinks=False)
                  chem=work/"experiments/Issue395_powered_chemistry_ladder"
                  table=work/"experiments/Issue91_real_qvt_r3/r3_e0/electron_moments.txt"
                  if sha(table)!=status["original_100row_sha256"] or len(table.read_bytes().splitlines())!=100:
                      raise RuntimeError("PUBLIC_D_PRIVATE_NATIVE_NOT_ORIGINAL_100_ROWS")
                  js=chem/"chemistry"/f"public_d_s6_{case}_physics.json"
                  if sha(js)!=stage_receipt["json_sha256"] or sha(chem/"migrated_continuity.i")!=stage_receipt["overlay_sha256"]:
                      raise RuntimeError("PUBLIC_D_PRIVATE_SCRATCH_JUST_CHANGED")
                  rate_root=chem/"private_rates"
                  if rate_root.exists(): raise RuntimeError("PUBLIC_D_PROTECTED_DEST_ALREADY_EXISTS")
                  rate_root.mkdir(mode=0o700)
                  for name in sorted(REQUIRED[case]):
                      data=rates[name]
                      if hashlib.sha256(data).hexdigest()!=EXPECTED[name] or validate_rows(data)!=100:
                          raise RuntimeError("PUBLIC_D_PROTECTED_SOURCE_SHA_SHAPE_CHANGED")
                      dest=rate_root/name
                      fd=os.open(dest,os.O_CREAT|os.O_EXCL|os.O_WRONLY|getattr(os,"O_NOFOLLOW",0),0o600)
                      with os.fdopen(fd,"wb") as f: f.write(data)
                      if sha(dest)!=EXPECTED[name]:
                          raise RuntimeError("PUBLIC_D_PROTECTED_RATE_SCRATCH_READBACK_FAILED")
                  inputs=p4[case]["ordered_inputs"]
                  cmd=["docker","run","--rm","--network","none","--entrypoint","/bin/bash",
                       "--user","0:0","--workdir","/case",
                       "--env","OXYGEN_RESEARCH_400=1","--env","OXYGEN_RESEARCH_FULL24=0",
                       "--env","OXYGEN_RESEARCH_EI2738_FORMULA=0","--env","OXYGEN_RESEARCH_QUICK_5MIN=0",
                       "--mount",f"type=bind,src={repo},dst=/workspace,readonly",
                       "--mount",f"type=bind,src={work},dst=/case",
                       ident["OCI"],"-lc",
                       "set -uo pipefail; source /environment; trap 'rm -rf /case/.jitcache' EXIT; "
                       +"/workspace/physics_app/physics-opt --check-input -i "
                       +" ".join(shlex.quote(p) for p in inputs)]
                  try:
                      result=subprocess.run(cmd,text=True,capture_output=True,timeout=750,check=False,
                          env={k:v for k,v in os.environ.items() if k!="PROTECTED_ARCHIVE_B64"})
                      rc=result.returncode;log=(result.stdout or "")+"\n"+(result.stderr or "")
                  except subprocess.TimeoutExpired:
                      rc=124;log="PUBLIC_D_NATIVE_P2_TIMEOUT_NO_TIMESTEPS"
                  first_failure=next((signal for signal in (
                    "P05 FV Native/Physics duplicate or unexpected owner",
                    "P05 missing or duplicate FV Kernel",
                    "P05 legacy, duplicate or unexpected FV BC",
                    "Missing drift-diffusion transport JSON record",
                    "FV species kernels require",
                    "error while loading shared libraries",
                    "cannot open transport table",
                    "Invalid JSON",
                    "invalid reaction",
                    "Syntax OK",
                  ) if signal in log), "UNCLASSIFIED")
                  good=rc==0 and "Syntax OK" in log
                  status["cases"][case]={
                    "P2":"PASS" if good else "HOLD",
                    "exit_code":rc,"syntax_ok":good,
                    "first_signal":first_failure,
                    "native_log_sha256":hashlib.sha256(log.encode()).hexdigest(),
                    "private_rate_files":len(REQUIRED[case]),
                    "case_json_sha256":sha(js),"original_100row_table_sha256":sha(table),
                    "exact_staged_source_11_layers":len(inputs),
                  }
                  if sha(binary)!=ident["binary_sha256"]:
                      raise RuntimeError("PUBLIC_D_NATIVE_BINARY_MUTATED_"+case)
              status["P2"]="PASS" if all(v["P2"]=="PASS" for v in status["cases"].values()) else "HOLD"
          except Exception as exc:
              status["P2"]="HOLD"
              status["harness_error_class"]=type(exc).__name__
              status["harness_error_code"]=str(exc)[:220] if str(exc).startswith("PUBLIC_D_") else "UNCLASSIFIED"
          finally:
              os.environ.pop("PROTECTED_ARCHIVE_B64",None)
              if private is not None and private.exists():
                  fix=subprocess.run(["sudo","chown","-R",f"{os.getuid()}:{os.getgid()}",str(private)],
                                     capture_output=True,check=False)
                  if fix.returncode==0: shutil.rmtree(private)
              status["tmpfs_cleanup_verified"]=(private is not None and not private.exists())
              if not status["tmpfs_cleanup_verified"]: status["P2"]="HOLD"
              (out/"native-receipt.json").write_text(json.dumps(status,indent=2,sort_keys=True)+"\n")
              print("PUBLIC_D_100ROW_NATIVE_P2",status["P2"],
                    {k:(v["P2"],v["first_signal"]) for k,v in status["cases"].items()},
                    "SOURCE",status["source_head"],"SAME_ELF",status["binary_sha256"],
                    "PRIVATE_TMPFS_CLEAN",status["tmpfs_cleanup_verified"])
          sys.exit(0 if status["P2"]=="PASS" else 2)
          PY
      - name: Upload bounded exact-head Public D Native evidence (no raw rates)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue672-public-d-100row-native-p2-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/p05-out/public-d-417.json
            ${{ runner.temp }}/p05-out/public-d-941.json
            ${{ runner.temp }}/p05-out/native-receipt.json
            ${{ runner.temp }}/p05-out/build-identity.json
            ${{ runner.temp }}/p05-in/p4_receipt.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload bounded dual-case source-stage evidence (no private rates)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue672-public-d-100row-stage-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/p05-out/public-d-417.json
            ${{ runner.temp }}/p05-out/public-d-941.json
            ${{ runner.temp }}/p05-in/p4_receipt.json
            ${{ runner.temp }}/p05-in/staged/readiness.json
          if-no-files-found: error
          retention-days: 30
