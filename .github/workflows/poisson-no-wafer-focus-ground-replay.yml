name: Poisson No Wafer Focus Cover Ground Replay

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: poisson-no-wafer-focus-cover-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frozen-source-no-wafer-focus-cover:
    if: github.event_name == 'pull_request' && github.head_ref == 'issue-359-qualified-gummel-icp'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      POISSON_DIR: experiments/2d-icp-poisson-experiment
      BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build exact-head Physics runtime
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          docker pull "$BUILD_BASE_REF"
          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace -v "$PWD:/workspace" "$BUILD_BASE_REF" -lc '
            set -euxo pipefail
            source /environment
            git config --global --add safe.directory /workspace
            git config --global --add safe.directory /opt/physics_vendor/moose
            git config --global --add safe.directory /opt/physics_vendor/crane
            git config --global --add safe.directory /opt/physics_vendor/squirrel
            git config --global --add safe.directory /opt/physics_vendor/zapdos
            export MOOSE_DIR=/opt/physics_vendor/moose
            export CRANE_DIR=/opt/physics_vendor/crane
            export SQUIRREL_DIR=/opt/physics_vendor/squirrel
            export ZAPDOS_DIR=/opt/physics_vendor/zapdos
            export METHOD=opt
            make -C /workspace/physics_app -j2
            chmod -R a+rwX /workspace/physics_app
          '
          test -x physics_app/physics-opt

      - name: Run canonical 4 ns source-producing case
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .ci-no-wafer-focus-cover
          mkdir -p .ci-no-wafer-focus-cover/canonical
          cp -R "$POISSON_DIR"/. .ci-no-wafer-focus-cover/canonical/
          docker run --rm --entrypoint /bin/bash --user "$(id -u):$(id -g)" --workdir /workspace/.ci-no-wafer-focus-cover/canonical -v "$PWD:/workspace" "$BUILD_BASE_REF" -lc '
            set -euxo pipefail
            source /environment
            /workspace/physics_app/physics-opt --check-input -i input.i
            /workspace/physics_app/physics-opt -i input.i > runtime.log 2>&1
          '
          test -f .ci-no-wafer-focus-cover/canonical/poisson.e

      - name: Replay frozen source without wafer focus-ring and cover ground
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .ci-no-wafer-focus-cover/replay
          cp "$POISSON_DIR/frozen_source_no_wafer_focus_poisson.i" .ci-no-wafer-focus-cover/replay/input.i
          cp "$POISSON_DIR/qvt.msh" .ci-no-wafer-focus-cover/replay/qvt.msh
          cp .ci-no-wafer-focus-cover/canonical/poisson.e .ci-no-wafer-focus-cover/replay/canonical_source.e
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.ci-no-wafer-focus-cover/replay/input.i')
          s = p.read_text()
          old = "boundary = 'inlet outlet plasma_electrode plasma_metal plasma_right plasma_cover'"
          new = "boundary = 'inlet outlet plasma_electrode plasma_metal plasma_right'"
          if old not in s:
              raise SystemExit('expected grounded-boundary line not found')
          p.write_text(s.replace(old, new))
          PY
          docker run --rm --entrypoint /bin/bash --user "$(id -u):$(id -g)" --workdir /workspace/.ci-no-wafer-focus-cover/replay -v "$PWD:/workspace" "$BUILD_BASE_REF" -lc '
            set -euxo pipefail
            source /environment
            /workspace/physics_app/physics-opt --check-input -i input.i
            /workspace/physics_app/physics-opt -i input.i > runtime.log 2>&1
          '
          test -f .ci-no-wafer-focus-cover/replay/frozen_source_no_wafer_focus.e

      - name: Compare morphology
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import csv, json
          root = Path('.ci-no-wafer-focus-cover')
          def latest_rows(directory, pattern):
              files = sorted((root / directory).glob(pattern))
              if not files:
                  raise SystemExit(f'missing profile: {directory}/{pattern}')
              with files[-1].open(newline='') as handle:
                  rows = list(csv.DictReader(handle))
              rows.sort(key=lambda row: int(row['id']))
              return rows
          canonical = latest_rows('canonical', 'poisson_final_profile_*.csv')
          replay = latest_rows('replay', 'frozen_source_no_wafer_focus_final_profile_*.csv')
          if [int(r['id']) for r in canonical] != [int(r['id']) for r in replay]:
              raise SystemExit('cell identity mismatch')
          c_source = [float(r['poisson_source_out']) for r in canonical]
          r_source = [float(r['frozen_poisson_source']) for r in replay]
          source_scale = max(max(abs(v) for v in c_source), 1.0)
          source_linf = max(abs(a-b) for a,b in zip(c_source, r_source))
          if source_linf/source_scale > 1.0e-12:
              raise SystemExit('frozen source mismatch')
          def stats(rows, key):
              vals=[(float(r['x']),float(r['y']),float(r[key]),int(r['id'])) for r in rows]
              vmax=max(vals,key=lambda v:v[2]); vmin=min(vals,key=lambda v:v[2])
              axis=max((v for v in vals if v[0] < 0.01), key=lambda v:v[2])
              return {'phi_max_V':vmax[2],'max_location':{'id':vmax[3],'r_m':vmax[0],'z_m':vmax[1]},'phi_min_V':vmin[2],'axis_side_max_V':axis[2],'axis_side_max_location':{'id':axis[3],'r_m':axis[0],'z_m':axis[1]},'off_axis_excess_over_axis_V':vmax[2]-axis[2]}
          c=stats(canonical,'phi'); r=stats(replay,'phi')
          result={'ungrounded':['plasma_wafer','plasma_focus_ring','plasma_cover'],'still_grounded':['inlet','outlet','plasma_electrode','plasma_metal','plasma_right'],'source_linf_relative_to_canonical_scale':source_linf/source_scale,'canonical':c,'replay':r,'delta_off_axis_excess_V':r['off_axis_excess_over_axis_V']-c['off_axis_excess_over_axis_V']}
          (root/'no_wafer_focus_cover_ground_result.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: poisson-no-wafer-focus-cover-ground-replay
          path: |
            .ci-no-wafer-focus-cover/no_wafer_focus_cover_ground_result.json
            .ci-no-wafer-focus-cover/canonical/poisson.e
            .ci-no-wafer-focus-cover/canonical/poisson_final_profile_*.csv
            .ci-no-wafer-focus-cover/replay/input.i
            .ci-no-wafer-focus-cover/replay/runtime.log
            .ci-no-wafer-focus-cover/replay/frozen_source_no_wafer_focus.e
            .ci-no-wafer-focus-cover/replay/frozen_source_no_wafer_focus_final_profile_*.csv
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
