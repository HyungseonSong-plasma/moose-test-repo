name: FV wall-layer refine with coarse-P1 potential 1 ns

on:
  push:
    branches:
      - experiment-wall-layer-coarse-p1
    paths:
      - 'experiments/fem_fvm_plasma_discriminator/.run_wall_layer_coarse_p1'
  workflow_dispatch:

jobs:
  compare:
    name: coarse-p1-potential-only
    runs-on: ubuntu-24.04
    env:
      BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008

    steps:
      - uses: actions/checkout@v4
      - name: Pull build image
        run: docker pull "$BUILD_BASE_REF"
      - name: Build and run exact DofMap-constrained 1 ns case
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash --user 0:0 \
            --workdir /workspace -v "$GITHUB_WORKSPACE:/workspace" \
            "$BUILD_BASE_REF" -lc '
              set -euo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory /opt/physics_vendor/moose
              git config --global --add safe.directory /opt/physics_vendor/crane
              git config --global --add safe.directory /opt/physics_vendor/squirrel
              git config --global --add safe.directory /opt/physics_vendor/zapdos
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt

              make -C physics_app -j2
              cd experiments/fem_fvm_plasma_discriminator
              python3 prepare_wall_layer_coarse_p1.py

              CP1="hybrid_wall_layer_coarse_p1"

              # Hard guard: this experiment must use exact libMesh DofMap elimination,
              # never a MOOSE residual/penalty nodal constraint.
              grep -q "type = PhysicsCoarseP1ConstraintProblem" "${CP1}.i"
              if grep -q "LinearNodalConstraint\|\[Constraints\]" "${CP1}.i"; then
                echo "ERROR: residual/penalty constraint found in exact coarse-P1 experiment" >&2
                exit 2
              fi

              ../../physics_app/physics-opt -i "${CP1}.i" --check-input

              OUTDIR="output_wall_layer_coarse_p1"
              rm -rf "$OUTDIR"
              mkdir -p "$OUTDIR/coarse_p1"

              set +e
              /usr/bin/time -f "wall_seconds=%e\nuser_seconds=%U\nsystem_seconds=%S\nmax_rss_kb=%M" \
                -o "$OUTDIR/coarse_p1/wall_time.txt" \
                timeout --signal=TERM 10m stdbuf -oL -eL \
                ../../physics_app/physics-opt --print-constraints -i "${CP1}.i" > "$OUTDIR/coarse_p1/run.log" 2>&1
              rc=$?
              set -e
              echo "run_rc=$rc" > "$OUTDIR/coarse_p1/status.txt"
              echo "coarse_p1_rc=$rc" > "$OUTDIR/status.txt"
              cp "${CP1}.i" "$OUTDIR/coarse_p1/"
              cp "${CP1}_out.csv" "$OUTDIR/coarse_p1/" 2>/dev/null || true
              cp "${CP1}_out.e" "$OUTDIR/coarse_p1/" 2>/dev/null || true
              tail -n 1600 "$OUTDIR/coarse_p1/run.log" > "$OUTDIR/coarse_p1/tail.log" || true
              cp prepare_wall_layer_coarse_p1.py prepare_wall_layer_hrefine.py prepare_hybrid_1ns.py "$OUTDIR/"
              exit "$rc"
            '
      - name: Upload comparison result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fv-wall-layer-coarse-p1-dofmap-dt1ns
          path: experiments/fem_fvm_plasma_discriminator/output_wall_layer_coarse_p1/**
          retention-days: 30
