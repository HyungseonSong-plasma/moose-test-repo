name: Issue 3 baseline cover dielectric 15 us comparison

on:
  push:
    branches:
      - issue3-d0-dielectric-surface-charge
    paths:
      - '.github/workflows/issue3-baseline-cover-15us.yml'
      - 'experiments/Issue3_dielectric_surface_charge/prepare_baseline_cover_pilot.py'
      - 'experiments/Issue3_dielectric_surface_charge/finalize_baseline_cover_pilot.py'
      - 'experiments/Issue3_dielectric_surface_charge/promote_cover_15us.py'
      - 'experiments/Issue3_dielectric_surface_charge/analyze_cover_15us.py'
      - 'experiments/Issue3_dielectric_surface_charge/extend_cover_mesh.py'
      - 'physics_app/src/bcs/PhysicsFEMLogMolarDielectricFluxBC.C'
      - 'physics_app/src/bcs/PhysicsFEMLogMolarElectronEnergyDielectricBC.C'
      - 'physics_app/src/functormaterials/PhysicsIonWallTotalFluxMaterial.C'
      - 'physics_app/src/fvbcs/PhysicsFVLogMolarDielectricFluxBC.C'
      - 'physics_app/src/kernels/PhysicsLowerDSurfaceCurrent.C'
      - 'physics_app/src/bcs/PhysicsADSurfaceChargePoissonBC.C'

permissions:
  contents: read

jobs:
  baseline-cover-dielectric-15us:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008

    steps:
      - uses: actions/checkout@v4

      - name: Pull build image
        run: docker pull "$BUILD_BASE_REF"

      - name: Build and run 15 us cover dielectric comparison
        shell: bash
        run: |
          set -euo pipefail
          OUT=experiments/Issue3_dielectric_surface_charge/output_cover_15us
          mkdir -p "$OUT"

          docker run --rm --entrypoint /bin/bash --user 0:0 \
            --workdir /workspace -v "$GITHUB_WORKSPACE:/workspace" \
            "$BUILD_BASE_REF" -lc '
              set -euo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory /opt/physics_vendor/moose
              git config --global --add safe.directory /opt/physics_vendor/crane
              git config --global --add safe.directory /opt/physics_vendor/squirrel
              git config --global --add safe.directory /opt/physics_vendor/zapdos
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt

              BASE=experiments/fem_fvm_plasma_discriminator
              CASEDIR=experiments/Issue3_dielectric_surface_charge
              CASE=$CASEDIR/baseline_cover_dielectric_15us.i
              MESH=$CASEDIR/baseline_cover_dielectric.msh
              OUT=$CASEDIR/output_cover_15us

              python3 "$BASE/generate_contour_mesh.py" > "$OUT/mesh_plasma.log" 2>&1
              python3 "$CASEDIR/extend_cover_mesh.py" \
                "$BASE/plasma_contour_l3_4p5mm.msh" "$MESH" \
                > "$OUT/mesh_cover.log" 2>&1
              python3 "$CASEDIR/prepare_baseline_cover_pilot.py" "$CASE" \
                > "$OUT/materialize.log" 2>&1
              python3 "$CASEDIR/finalize_baseline_cover_pilot.py" "$CASE" \
                > "$OUT/finalize.log" 2>&1
              python3 "$CASEDIR/promote_cover_15us.py" "$CASE" \
                > "$OUT/promote_15us.log" 2>&1
              python3 -m py_compile "$CASEDIR/analyze_cover_15us.py"

              python3 -c "from physics_harness.adapters.moose.preflight import parser_symbol_self_test; raise SystemExit(parser_symbol_self_test())" \
                > "$OUT/preflight_selftest.log" 2>&1
              python3 -c "from pathlib import Path; from physics_harness.adapters.moose.preflight import validate_input_preflight; validate_input_preflight(Path(\"$CASE\"))" \
                > "$OUT/preflight_input.log" 2>&1

              make -C physics_app -j2
              physics_app/physics-opt -i "$CASE" --check-input > "$OUT/check.log" 2>&1

              set +e
              physics_app/physics-opt -i "$CASE" > "$OUT/run.log" 2>&1
              solve_rc=$?
              set -e

              cd "$CASEDIR"
              cp baseline_cover_dielectric_15us.i output_cover_15us/
              cp baseline_cover_dielectric.msh output_cover_15us/
              test -f baseline_cover_dielectric_15us_out.csv && cp baseline_cover_dielectric_15us_out.csv output_cover_15us/ || true
              test -f baseline_cover_dielectric_15us_out.e && cp baseline_cover_dielectric_15us_out.e output_cover_15us/ || true

              converged_count=$(grep -c "Solve Converged!" output_cover_15us/run.log || true)
              printf "{\"expected\":285,\"observed\":%s,\"solve_rc\":%s}\n" "$converged_count" "$solve_rc" \
                | tee output_cover_15us/convergence.json

              if [ "$solve_rc" -ne 0 ]; then
                exit "$solve_rc"
              fi

              test "$converged_count" -ge 285
              python3 analyze_cover_15us.py baseline_cover_dielectric_15us_out.csv baseline_cover_dielectric_15us.i \
                | tee output_cover_15us/analysis.json
            '

      - name: Upload 15 us cover comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue3-cover-dielectric-15us-comparison-evidence
          path: experiments/Issue3_dielectric_surface_charge/output_cover_15us/**
          if-no-files-found: warn
          retention-days: 30
