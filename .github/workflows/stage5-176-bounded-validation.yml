name: Stage-5 #176 bounded representative validation

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/stage5-176-bounded-validation.yml'
      - 'experiments/historical_recipe_support/issue192_s5r.py'
      - 'experiments/Issue192_s5r_representative/run.py'
      - 'experiments/historical_recipe_support/issue31_r4_qf1.py'
      - 'experiments/Issue91_real_qvt_r3/r3_e0/**'
      - 'physics_app/data/electron_impact/**'
      - 'physics_app/data/heavy_reactions/stage5_s5d_oxygen_heavy.txt'
      - 'physics_app/data/heavy_reactions/stage5_s5e_h05_oxygen_heavy.txt'
  workflow_dispatch:

concurrency:
  group: stage5-176-bounded-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
  MOOSE_SHA: 9f388366ccf38b9c34542ec5561198249fde0ac9
  CRANE_SHA: ba26970cf419dcac563a20ed7079d445bc6341c3
  SQUIRREL_SHA: 16a26d504f3ee11161a86d4e3ebf3c0e5f2afbb1
  ZAPDOS_SHA: 9eceffbc46048c3760bbfa9a7f1ca681ae35af1d

jobs:
  bounded-stage5-runtime:
    name: '#176 governed bounded pre-Maxwell Stage-5 runtime'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate immutable runtime identity
        shell: bash
        run: |
          set -euxo pipefail
          [[ "$BUILD_BASE_REF" =~ ^ghcr\.io/hyungseonsong-plasma/physics-build-base@sha256:[0-9a-f]{64}$ ]]
          source physics_app/dependencies.lock
          test "$MOOSE" = "$MOOSE_SHA"
          test "$CRANE" = "$CRANE_SHA"
          test "$SQUIRREL" = "$SQUIRREL_SHA"
          test "$ZAPDOS" = "$ZAPDOS_SHA"
          docker pull "$BUILD_BASE_REF"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.moose.sha" }}')" = "$MOOSE_SHA"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.crane.sha" }}')" = "$CRANE_SHA"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.squirrel.sha" }}')" = "$SQUIRREL_SHA"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.zapdos.sha" }}')" = "$ZAPDOS_SHA"

      - name: Build exact head and run bounded Stage-5 evidence surface
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf stage5-176-bounded-results
          mkdir -p stage5-176-bounded-results

          cat > stage5-176-bounded-results/runner.py <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import os
          from pathlib import Path

          from experiments.Issue192_s5r_representative import run as s5r
          from physics_harness.adapters.moose import parameters as mp
          from physics_harness.execution.cases import stage_case, validate_case_references

          ROOT = Path('/workspace')
          OUT = ROOT / 'stage5-176-bounded-results'
          CASES = OUT / 'cases'
          LOGS = OUT / 'logs'
          CASES.mkdir(parents=True, exist_ok=True)
          LOGS.mkdir(parents=True, exist_ok=True)
          EXE = ROOT / 'physics_app/physics-opt'
          END_TIME = 1.0e-5
          CASE_SPECS = (('dt_10us', 1.0e-5), ('dt_5us', 5.0e-6))

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          INITIAL_INVENTORY_PPS = (
              'n_e_inventory',
              'domain_volume',
              'mass_total',
              'mass_O2',
              'mass_O2s',
              'mass_O2p',
              'mass_O',
              'mass_Om',
              'mass_Op',
              'mass_Os',
          )

          summary = {
              'schema_version': 1,
              'issue': 176,
              'stage': 'STAGE_5_BOUNDED_PRE_MAXWELL',
              'repository_head': os.environ['GITHUB_SHA'],
              'runtime_authority': 'governed_ci_provenance_controlled',
              'physics_opt_sha256': sha256(EXE),
              'physical_horizon_s': END_TIME,
              'claim_boundary': {
                  'on_green': 'bounded pre-Maxwell representative Stage-5 chemistry integration evidence ready for controller review',
                  'does_not_establish': [
                      'long-time unpowered electron-energy stability',
                      'RF/Maxwell powered ICP closure',
                      'Stage-6 acceptance',
                      'Integrated Physics Accuracy',
                  ],
              },
              'instrumentation_decision': {
                  'initial_inventory_observers': 'execute on INITIAL and TIMESTEP_END',
                  'physics_semantics_changed': False,
              },
              'cases': {},
              'timestep_sensitivity': {},
              'status': 'NOT_RUN',
          }

          # The old #192 experiment selected 0.5 ms, but the Stage-5 contract did
          # not freeze that horizon.  #176 exercises the identical production model
          # over a bounded 10 us pre-Maxwell transient without changing source laws.
          s5r.END_TIME_S = END_TIME

          endpoints = {}
          all_pass = True
          for name, dt in CASE_SPECS:
              case_dir = CASES / name
              case_dir.mkdir(parents=True, exist_ok=True)
              text, meta = s5r._runtime_input(dt)

              # Inherited R3 inventory postprocessors are TIMESTEP_END-only; their
              # CSV INITIAL row is zero even though the solver IC is nonzero.  Make
              # those observers execute at INITIAL as an evidence-only correction.
              for pp in INITIAL_INVENTORY_PPS:
                  text = mp.upsert_parameter(
                      text,
                      f'Postprocessors/{pp}',
                      'execute_on',
                      "'INITIAL TIMESTEP_END'",
                  )

              audit = s5r.audit_s5r_input(text)
              if audit['status'] != 'PASS':
                  raise RuntimeError(
                      f"{name}: S5-R semantic audit failed: {audit['failed_checks']}"
                  )

              staged = stage_case(
                  s5r.SOURCE,
                  case_dir,
                  input_text=text,
                  purge_directory_names=('.jitcache', 'checkpoint', 'checkpoints'),
                  purge_patterns=('input_out*', '*.log', '*.e', '*.exo', 'prepare_evidence.json'),
              )
              s5r._copy_runtime_assets(case_dir)
              references = validate_case_references(case_dir)
              (case_dir / 'prepare_evidence.json').write_text(
                  json.dumps(meta, indent=2, sort_keys=True) + '\n'
              )

              p2 = s5r._p2(EXE, case_dir, LOGS / f'{name}_p2.log', timeout=900.0)
              runtime = {'returncode': None}
              evidence = {'hard_pass': False}
              if p2['returncode'] == 0:
                  runtime = s5r._runtime(
                      EXE, case_dir, LOGS / f'{name}_runtime.log', timeout=900.0
                  )
                  if runtime['returncode'] == 0:
                      evidence = s5r._analyze_case(case_dir, input_text=text)

              case_pass = (
                  p2['returncode'] == 0
                  and runtime.get('returncode') == 0
                  and evidence.get('hard_pass') is True
              )
              all_pass = all_pass and case_pass
              summary['cases'][name] = {
                  'dt_s': dt,
                  'end_time_s': END_TIME,
                  'semantic_audit': audit,
                  'staging': staged,
                  'references': references,
                  'p2': p2,
                  'runtime': runtime,
                  'evidence': evidence,
                  'pass': case_pass,
              }
              if case_pass:
                  endpoints[name] = evidence['endpoint']

          if all_pass:
              summary['timestep_sensitivity'] = s5r._timestep_sensitivity(
                  endpoints['dt_10us'], endpoints['dt_5us']
              )
              summary['status'] = 'STAGE5_BOUNDED_REPRESENTATIVE_EVIDENCE_READY'
          else:
              summary['status'] = 'STAGE5_BOUNDED_REPRESENTATIVE_FAIL'

          path = OUT / 'summary.json'
          path.write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(path.read_text())
          if not all_pass:
              raise SystemExit(1)
          PY

          CONTAINER_SCRIPT="$(cat <<'BASH'
          set -euxo pipefail
          source /environment
          git config --global --add safe.directory /workspace
          git config --global --add safe.directory /opt/physics_vendor/moose
          git config --global --add safe.directory /opt/physics_vendor/crane
          git config --global --add safe.directory /opt/physics_vendor/squirrel
          git config --global --add safe.directory /opt/physics_vendor/zapdos
          test "$(git -C /workspace rev-parse HEAD)" = "$GITHUB_SHA"
          export MOOSE_DIR=/opt/physics_vendor/moose
          export CRANE_DIR=/opt/physics_vendor/crane
          export SQUIRREL_DIR=/opt/physics_vendor/squirrel
          export ZAPDOS_DIR=/opt/physics_vendor/zapdos
          export METHOD=opt
          python3 bin/physics.py preflight --self-test
          python3 experiments/Issue192_s5r_representative/run.py --self-test
          test ! -e physics_app/physics-opt
          make -C physics_app -j2
          test -x physics_app/physics-opt
          python3 stage5-176-bounded-results/runner.py
          BASH
          )"

          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace \
            -e GITHUB_SHA="$GITHUB_SHA" -e BUILD_BASE_REF="$BUILD_BASE_REF" \
            -e MOOSE_SHA="$MOOSE_SHA" -e CRANE_SHA="$CRANE_SHA" \
            -e SQUIRREL_SHA="$SQUIRREL_SHA" -e ZAPDOS_SHA="$ZAPDOS_SHA" \
            -v "$PWD:/workspace" "$BUILD_BASE_REF" -lc "$CONTAINER_SCRIPT"

      - name: Upload bounded Stage-5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage5-176-bounded-representative-evidence
          path: stage5-176-bounded-results/**
          if-no-files-found: error
