name: One-shot branch cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/branch-cleanup-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Run SHA-bound branch cleanup
        run: python3 tools/workflow/branch_cleanup_once.py
