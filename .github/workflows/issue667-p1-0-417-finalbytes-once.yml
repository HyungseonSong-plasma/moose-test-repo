# One-shot source-bound verification; NO physics-opt, no --check-input, no P3/P4.
# Workflow is branch-scoped and the tested code is the exact unmodified PR #665 SHA.
name: Issue667 P1-0 S6-417 final 11-layer byte preservation
on:
  push:
    branches: [issue-667-p1-0-417-finalbytes-20261117]
    paths:
      - .github/workflows/issue667-p1-0-417-finalbytes-once.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: issue667-p1-0-417-finalbytes-once
  cancel-in-progress: false

jobs:
  archive-and-hash:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout evidence-only harness (not the PR source)
        uses: actions/checkout@v4
        with:
          path: evidence
          persist-credentials: false
      - name: Checkout pinned PR665 exact source, never moving HEAD
        uses: actions/checkout@v4
        with:
          path: control
          ref: 9c15a4f0e2cf8042cb0d4b2f18af31511021d168
          persist-credentials: false
      - name: Enforce exact checkout SHA and zero Native execution
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C control rev-parse HEAD)" = "9c15a4f0e2cf8042cb0d4b2f18af31511021d168"
          test -f evidence/ci/guards/issue667_s6_417_final_input_receipt.py
          python3 -m py_compile evidence/ci/guards/issue667_s6_417_final_input_receipt.py
          mkdir -p "$RUNNER_TEMP/issue667-417"
          echo "PR665_EXACT_HEAD_SOURCE_READY_NO_NATIVE_P2_P3_P4"
      - name: Download immutable S6-417 original Actions artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --retry 3 --retry-all-errors --fail --location --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/HyungseonSong-plasma/moose-test-repo/actions/artifacts/13677089020/zip" \
            --output "$RUNNER_TEMP/issue667-417/original.zip"
          echo "441eb637c0eefa947ecbc4e14853ab435e553616b8b6a1e1d11928309409bdcb  $RUNNER_TEMP/issue667-417/original.zip" | sha256sum --check -
      - name: Rebuild and preserve final 11 inputs from pinned source
        shell: bash
        run: |
          set -euo pipefail
          python3 evidence/ci/guards/issue667_s6_417_final_input_receipt.py \
            --control control \
            --archive "$RUNNER_TEMP/issue667-417/original.zip" \
            --output "$RUNNER_TEMP/issue667-417/results"
      - name: Independently re-hash copied files and all 26 Native ion blocks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,re,zipfile
          from pathlib import Path
          base=Path(os.environ["RUNNER_TEMP"])/"issue667-417/results/artifact"
          manifest=json.loads((base/"manifest.json").read_bytes())
          with zipfile.ZipFile(Path(os.environ["RUNNER_TEMP"])/"issue667-417/original.zip") as z:
              original_manifest=[n for n in z.namelist() if n.endswith("/case_manifest.json")]
              assert len(original_manifest)==1
              assert hashlib.sha256(z.read(original_manifest[0])).hexdigest()==manifest["original_case_manifest_sha256"]
          assert manifest["source_head"]=="9c15a4f0e2cf8042cb0d4b2f18af31511021d168"
          assert manifest["status"]=="FINAL_11_LAYER_PRESERVED_SOURCE_BOUND_NO_NATIVE_RUN"
          layers=manifest["ordered_files"]
          assert len(layers)==11 and len({x["file_name"] for x in layers})==11
          assert {p.name for p in (base/"final_inputs").glob("*.i")}=={x["file_name"] for x in layers}
          files={}
          for row in layers:
              data=(base/"final_inputs"/row["file_name"]).read_bytes()
              assert data and hashlib.sha256(data).hexdigest()==row["final_sha256"]
              files[row["file_name"]]=data.decode("utf-8")
          assert not list(base.rglob("private_rates"))
          assert not list(base.rglob("*.txt"))
          owners=manifest["ion_owners"]
          assert len(owners)==26 and len({(x["section"],x["name"]) for x in owners})==26
          section_counts={}
          for o in owners:
              source=files[o["file"]]
              regex=re.compile(r"(?m)^  \["+re.escape(o["name"])+r"\]\r?\n(?:^    [^\r\n]*\r?\n)+^  \[\](?:\r?\n|$)")
              candidates=[m for m in regex.finditer(source)
                          if re.findall(r"(?m)^\[([A-Za-z0-9_]+)\]\s*$",source[:m.start()])[-1:]==[o["section"]]]
              assert len(candidates)==1,("OWNER_COUNT",o["name"])
              b=candidates[0].group(0).encode("utf-8")
              assert hashlib.sha256(b).hexdigest()==o["old_block_sha256"],("BLOCK_SHA",o["name"])
              sections=re.findall(r"(?m)^\[([A-Za-z0-9_]+)\]\s*$",source[:candidates[0].start()])
              assert sections and sections[-1]==o["section"],("SECTION",o["name"])
              section_counts[o["section"]]=section_counts.get(o["section"],0)+1
          assert section_counts=={"FVKernels":14,"FVBCs":12},section_counts
          names={x["name"]:x for x in owners}
          assert names["legacy8_h05_ei417_op"]["file"] != names["h25_atomic_positive_ion"]["file"]
          assert names["legacy8_h05_ei417_op"]["variable"]=="log_Op"
          assert names["h25_atomic_positive_ion"]["variable"]=="log_Op"
          assert all(x["section"]=="FVKernels" and x["type"]=="FVCoupledForce" for x in owners if x["name"] in ("legacy8_h05_ei417_op","h25_atomic_positive_ion"))
          receipt={"schema":"issue667.p1_0.s6_417.independent_readback.v1",
                   "status":"PASS","source_pr":665,"source_head":manifest["source_head"],
                   "case_manifest_raw_sha256_verified":True,
                   "file_sha256_verified":11,"native_block_sha256_verified":26,
                   "native_kernel_count":14,"native_bc_count":12,
                   "B4_B5_unique_and_distinct":True,"private_rate_bytes_excluded":True,
                   "P2":"NOT_RUN","P3":"NOT_RUN","P4":"NOT_RUN","science":"SCIENCE_HOLD"}
          (base/"verification_receipt.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print("P1_0_INDEPENDENT_READBACK_PASS_11_FILES_26_BLOCKS")
          PY
      - name: Preserve only final .i files, public mechanism, SHA receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue667-p1-0-s6-417-finalbytes-pr665-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/issue667-417/results/artifact/
            ${{ runner.temp }}/issue667-417/results/failure_receipt.json
          if-no-files-found: warn
          retention-days: 30
