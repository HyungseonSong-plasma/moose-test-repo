name: Issue-236 kick reviewed fix application

on:
  push:
    branches: [issue-236-m1a-multiapp-smoke]
    paths:
      - '.github/workflows/issue236-kick-review-fixes.yml'

permissions:
  contents: write

jobs:
  kick:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Trigger the reviewed-fixes workflow once
        shell: bash
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '\n# kick reviewed fixes\n' >> .github/workflows/issue236-review-fixes-once.yml
          rm .github/workflows/issue236-kick-review-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Issue 236: trigger reviewed fix application"
          git remote set-url origin "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${GITHUB_REF_NAME}"
