name: Samuel one-time Actions history cleanup (exact ID, artifact safe)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/samuel-actions-history-cleanup-once.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: samuel-actions-cleanup-exact-ids-once
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Delete only preselected, completed cancelled runs with zero artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SELF_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import time
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          RUNS = {
              45064577998: "40d5af8819c1b27fd5b5903ec07910669a37748a",
              45063176575: "2fbceaa1ba3cdffc6d4b4fca02ace7b4e878c505",
              45017285135: "7de543ba84758ca64f839cf5891c5da0823224a6",
              44959708839: "44384ab51c730578359d0815a16f6df09719e09b",
              44959693459: "34be2dcf6389ecfa63fb2a401665f5f10a9045c7",
              44958660503: "5b02a12fe8fe7e060b2aac588edb40d4dceca85b",
              44958660425: "5b02a12fe8fe7e060b2aac588edb40d4dceca85b",
              44958616686: "9a1bf49eab502f2006a1dc26d6b196aa303fb647",
              44958578993: "5ca4c907d4f4d853907de10ed6fc5daa1f746b99",
              44958568374: "13bf3fd62315c54e9e2596a6634b5f46d3eecd54",
              44958568371: "13bf3fd62315c54e9e2596a6634b5f46d3eecd54",
              44958479415: "220a0f750a0a719c064de122d836c684adb46428",
          }
          base = "https://api.github.com/repos/" + os.environ["REPOSITORY"]
          self_run = int(os.environ["SELF_RUN_ID"])
          headers = {
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2026-03-10",
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
          }

          def api(method: str, path: str, *, missing_ok=False):
              req = Request(base + path, method=method, headers=headers)
              try:
                  with urlopen(req, timeout=30) as resp:
                      raw = resp.read()
                      return json.loads(raw) if raw else None
              except HTTPError as exc:
                  if missing_ok and exc.code == 404:
                      return None
                  raise

          def qualified(run_id: int, sha: str) -> bool:
              run = api("GET", f"/actions/runs/{run_id}", missing_ok=True)
              if run is None:
                  return False
              if (
                  run.get("id") != run_id
                  or run.get("status") != "completed"
                  or run.get("conclusion") != "cancelled"
                  or run.get("event") != "pull_request"
                  or run.get("head_sha") != sha
              ):
                  raise RuntimeError(f"RUN_IDENTITY_OR_STATUS_CHANGED:{run_id}")
              artifacts = api("GET", f"/actions/runs/{run_id}/artifacts?per_page=1")
              if type(artifacts.get("total_count")) is not int:
                  raise RuntimeError(f"ARTIFACT_COVERAGE_UNRESOLVED:{run_id}")
              if artifacts["total_count"] != 0:
                  raise RuntimeError(f"ARTIFACT_PRESENT_DO_NOT_DELETE:{run_id}")
              return True

          if self_run in RUNS or len(RUNS) != 12:
              raise RuntimeError("INVALID_EXACT_ID_DELETE_SNAPSHOT")

          # Preflight the entire fixed allowlist before starting any deletion.
          present = []
          absent = []
          for run_id, sha in sorted(RUNS.items()):
              if qualified(run_id, sha):
                  present.append(run_id)
              else:
                  absent.append(run_id)

          deleted = []
          for run_id in present:
              # Repeat identity, status and artifact checks directly before DELETE.
              if not qualified(run_id, RUNS[run_id]):
                  absent.append(run_id)
                  continue
              api("DELETE", f"/actions/runs/{run_id}")
              for attempt in range(6):
                  if api("GET", f"/actions/runs/{run_id}", missing_ok=True) is None:
                      break
                  if attempt == 5:
                      raise RuntimeError(f"DELETE_POSTCONDITION_FAILED:{run_id}")
                  time.sleep(2)
              deleted.append(run_id)

          report = {
              "allowlisted": len(RUNS),
              "deleted": len(deleted),
              "deleted_ids": deleted,
              "already_absent": sorted(absent),
          }
          print("SAMUEL_EXACT_ACTIONS_CLEANUP=" + json.dumps(report, sort_keys=True))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("## One-time cancelled Actions cleanup\n\n")
              out.write(f"- Exact-ID snapshot: {len(RUNS)}\n")
              out.write(f"- Deleted and 404 verified: {len(deleted)}\n")
              out.write(f"- Already absent: {len(absent)}\n")
              out.write("- Artifact-bearing or unlisted runs: never eligible\n")
          PY
