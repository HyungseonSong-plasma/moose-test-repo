name: Samuel one-time Actions cleanup (45 exact cancelled run IDs)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/samuel-actions-history-cleanup-once.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: samuel-exact-cancelled-runs-cleanup-once
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Delete exact approved cancelled runs (including their artifacts)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SELF_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          TARGETS = {
              45142269849: "f6f0e893e0eafdfa7e557420440e272252343faa",
              45141084514: "f2cde95bd32397c7c6028fff782ceec9c6549ae4",
              45137296749: "739f09cb51180db85d3a3799f234017cfceab0eb",
              45137296889: "739f09cb51180db85d3a3799f234017cfceab0eb",
              45081422214: "c889c1a31863b902e0608af22a436e1cad3e5dc6",
              45081422217: "c889c1a31863b902e0608af22a436e1cad3e5dc6",
              45081041446: "3a8b67147fb59770e02cdf891b3cac150480cf91",
              45081041457: "3a8b67147fb59770e02cdf891b3cac150480cf91",
              45080954660: "3a583fe4145f2bac5c2c253394f67646b44c2c4c",
              45080954664: "3a583fe4145f2bac5c2c253394f67646b44c2c4c",
              45078618810: "396af2ac9e864d3b2c0fe98d1e81ce64c94baa43",
              45076232415: "46299e45e9d9932e123cff2dd7d25ab9bd0b1bb8",
              45075140237: "c9b08d60eb9d3cc00c9224b0da05be6033e9c572",
              45075140238: "c9b08d60eb9d3cc00c9224b0da05be6033e9c572",
              45064377093: "3e5486ae257cda0aa36065c692d8f32f68e319d9",
              45064377148: "3e5486ae257cda0aa36065c692d8f32f68e319d9",
              45063326893: "060feab9d83e56d7fcbc9b654b3709c19e80c221",
              45063176620: "2fbceaa1ba3cdffc6d4b4fca02ace7b4e878c505",
              45063176626: "2fbceaa1ba3cdffc6d4b4fca02ace7b4e878c505",
              45063002738: "ed4e2ec8a9c3271d07479eafe82aeecc045c17c7",
              45063002643: "ed4e2ec8a9c3271d07479eafe82aeecc045c17c7",
              45062741959: "376a791477eddb5338f995fc3d919e78fc3fb05d",
              45062741963: "376a791477eddb5338f995fc3d919e78fc3fb05d",
              45061948276: "60028f47ec70a5156d898331eaac0e9184dc5daa",
              45024683686: "bd407e63404516a1fab50d764f55d58964d6e734",
              44959693535: "34be2dcf6389ecfa63fb2a401665f5f10a9045c7",
              44958616664: "9a1bf49eab502f2006a1dc26d6b196aa303fb647",
              44958579030: "5ca4c907d4f4d853907de10ed6fc5daa1f746b99",
              44958504073: "1d958cc947249a2c4acbec9f05a2ee043649b75a",
              44958020060: "1f2af7b497bf73b2f3367a0bb5966656d871ddf6",
              44746151607: "12156b94a7dc7a30f2ce5b29a9b8e10dc80195a8",
              44746071992: "44bd8de8fcccabccb182dede2df02bb40cfe2e53",
              44745924506: "7862e288d10954c8c862686651573cfc804989f8",
              44745924525: "7862e288d10954c8c862686651573cfc804989f8",
              44726083769: "b6851fc37034d509c6ecd616b57669c3b09a0e49",
              44725885392: "934ff098ce76a23a81a4a36c72d415a5d0ce64ad",
              44725885483: "934ff098ce76a23a81a4a36c72d415a5d0ce64ad",
              44725742812: "b4637d7201f9ca1a325e44e83123a0a2ceb814a3",
              44724535434: "104ab67dbdcaaedb0cde85a4f49d5e26b43e4cc7",
              44724535427: "104ab67dbdcaaedb0cde85a4f49d5e26b43e4cc7",
              44724481410: "b6876a95abbe3fe0f7e0e5f6672b6450657af06d",
              44724424004: "646814d2e1704d4aefd48b308c03abc25797561f",
              44567705611: "d7756d863d65a053f6c776ce6c45ba3097a98b21",
              44567653704: "faffb33dd74f7ccdf8da57bca016fd14ab63b9c4",
              43257553801: "3b90c193bc3f944b41c2d9bc4dc175532d9cdaae",
          }
          EXCLUDED_RUN_ID = 45145560514
          base = "https://api.github.com/repos/" + os.environ["REPOSITORY"]
          self_run = int(os.environ["SELF_RUN_ID"])
          headers = {
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2026-03-10",
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
          }

          def api(method, path, *, missing_ok=False):
              req = Request(base + path, method=method, headers=headers)
              try:
                  with urlopen(req, timeout=30) as response:
                      raw = response.read()
                      return json.loads(raw) if raw else None
              except HTTPError as exc:
                  if missing_ok and exc.code == 404:
                      return None
                  raise

          def verify_identity(run_id, sha):
              run = api("GET", f"/actions/runs/{run_id}", missing_ok=True)
              if run is None:
                  return False
              if (
                  run.get("id") != run_id
                  or run.get("status") != "completed"
                  or run.get("conclusion") != "cancelled"
                  or run.get("event") != "pull_request"
                  or run.get("head_sha") != sha
              ):
                  raise RuntimeError(f"RUN_IDENTITY_CHANGED:{run_id}")
              return True

          if len(TARGETS) != 45 or EXCLUDED_RUN_ID in TARGETS or self_run in TARGETS:
              raise RuntimeError("EXACT_ALLOWLIST_CONTRACT_VIOLATION")

          # Validate all 45 run identities before the first deletion.
          preflight_absent = []
          for run_id, sha in sorted(TARGETS.items()):
              if not verify_identity(run_id, sha):
                  preflight_absent.append(run_id)

          deleted = []
          already_absent = list(preflight_absent)
          for run_id, sha in sorted(TARGETS.items()):
              if run_id in preflight_absent:
                  continue
              if not verify_identity(run_id, sha):
                  already_absent.append(run_id)
                  continue
              # Artifact loss is explicitly accepted for these 45 cancelled runs.
              api("DELETE", f"/actions/runs/{run_id}")
              for attempt in range(6):
                  if api("GET", f"/actions/runs/{run_id}", missing_ok=True) is None:
                      break
                  if attempt == 5:
                      raise RuntimeError(f"DELETE_POSTCONDITION_FAILED:{run_id}")
                  time.sleep(2)
              deleted.append(run_id)

          report = {
              "allowlisted_count": len(TARGETS),
              "deleted_count": len(deleted),
              "deleted_ids": deleted,
              "already_absent": sorted(already_absent),
              "excluded_new_run_id": EXCLUDED_RUN_ID,
              "preservation_gate": "WAIVED_BY_USER_FOR_THESE_EXACT_45_RUNS",
          }
          print("SAMUEL_APPROVED_CANCELLED_CLEANUP=" + json.dumps(report, sort_keys=True))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Approved cancelled Actions cleanup\n\n")
              summary.write(f"- Approved exact Run IDs: {len(TARGETS)}\n")
              summary.write(f"- Deleted and verified 404: {len(deleted)}\n")
              summary.write(f"- Already absent: {len(already_absent)}\n")
              summary.write(f"- Excluded newer cancelled Run: {EXCLUDED_RUN_ID}\n")
              summary.write("- Artifacts of deleted runs were deliberately not preserved\n")
          PY
