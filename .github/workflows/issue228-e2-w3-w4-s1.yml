name: Issue-228 E2 W3 W4 S1 causal closure

on:
  push:
    branches: [issue-228-e2-w3-w4-s1]
    paths:
      - '.github/workflows/issue228-e2-w3-w4-s1.yml'
      - 'experiments/Issue228_e2_w3_w4_s1/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: issue228-e2-w3-w4-s1-${{ github.sha }}
  cancel-in-progress: false

env:
  BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
  MOOSE_SHA: 9f388366ccf38b9c34542ec5561198249fde0ac9
  CRANE_SHA: ba26970cf419dcac563a20ed7079d445bc6341c3
  SQUIRREL_SHA: 16a26d504f3ee11161a86d4e3ebf3c0e5f2afbb1
  ZAPDOS_SHA: 9eceffbc46048c3760bbfa9a7f1ca681ae35af1d

jobs:
  e2-av-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: h0500um, h_m: 0.0005}
          - {name: h1000um, h_m: 0.001}
          - {name: h2000um, h_m: 0.002}
          - {name: h3000um, h_m: 0.003}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify provenance and pinned image
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          source physics_app/dependencies.lock
          test "$MOOSE" = "$MOOSE_SHA"
          test "$CRANE" = "$CRANE_SHA"
          test "$SQUIRREL" = "$SQUIRREL_SHA"
          test "$ZAPDOS" = "$ZAPDOS_SHA"
          docker pull "$BUILD_BASE_REF"
      - name: Run E2 A/V closure ${{ matrix.name }}
        shell: bash
        env:
          CASE_NAME: ${{ matrix.name }}
          H_M: ${{ matrix.h_m }}
        run: |
          set -euxo pipefail
          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace \
            -e CASE_NAME="$CASE_NAME" -e H_M="$H_M" \
            -v "$PWD:/workspace" "$BUILD_BASE_REF" -lc '
              set -euxo pipefail
              source /environment
              export PYTHONPATH=/workspace
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt
              git config --global --add safe.directory /workspace
              uv pip install --system --python "$(command -v python3)" -r requirements-evidence-engine.txt
              uv pip install --system --python "$(command -v python3)" scipy
              python3 -m py_compile experiments/Issue228_e2_w3_w4_s1/run.py
              make -C physics_app -j2
              test -x physics_app/physics-opt
              python3 experiments/Issue228_e2_w3_w4_s1/run.py e2 \
                --h-m "$H_M" \
                --physics-opt physics_app/physics-opt \
                --results-root "issue228-e2-${CASE_NAME}-results"
            '
      - name: Upload E2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue228-e2-${{ matrix.name }}
          path: issue228-e2-${{ matrix.name }}-results
          if-no-files-found: error
          retention-days: 7

  w3-w4-frozen-fv:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [w3_excess, w4_electron]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify provenance and pinned image
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          source physics_app/dependencies.lock
          test "$MOOSE" = "$MOOSE_SHA"
          test "$CRANE" = "$CRANE_SHA"
          test "$SQUIRREL" = "$SQUIRREL_SHA"
          test "$ZAPDOS" = "$ZAPDOS_SHA"
          docker pull "$BUILD_BASE_REF"
      - name: Download governed step-10 baseline snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p snapshot
          gh run download 34949699566 -n issue228-pgw-baseline-snapshot -D snapshot
          test -f snapshot/summary.json
          test -f snapshot/case/input_out.e
      - name: Run ${{ matrix.mode }} frozen FV discriminator
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euxo pipefail
          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace \
            -e MODE="$MODE" -v "$PWD:/workspace" "$BUILD_BASE_REF" -lc '
              set -euxo pipefail
              source /environment
              export PYTHONPATH=/workspace
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt
              git config --global --add safe.directory /workspace
              uv pip install --system --python "$(command -v python3)" -r requirements-evidence-engine.txt
              uv pip install --system --python "$(command -v python3)" scipy
              python3 -m py_compile experiments/Issue228_e2_w3_w4_s1/run.py
              make -C physics_app -j2
              test -x physics_app/physics-opt
              python3 experiments/Issue228_e2_w3_w4_s1/run.py w \
                --mode "$MODE" \
                --snapshot-root snapshot \
                --physics-opt physics_app/physics-opt \
                --results-root "issue228-${MODE}-results"
            '
      - name: Upload W3/W4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue228-${{ matrix.mode }}
          path: issue228-${{ matrix.mode }}-results
          if-no-files-found: error
          retention-days: 7

  s1-sheath-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download governed step-10 baseline snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p snapshot
          gh run download 34949699566 -n issue228-pgw-baseline-snapshot -D snapshot
          test -f snapshot/summary.json
          test -f snapshot/case/input_out.e
      - name: Run S1 reduced Debye-scale Bohm sheath reference
        shell: bash
        run: |
          set -euxo pipefail
          docker pull "$BUILD_BASE_REF"
          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace \
            -v "$PWD:/workspace" "$BUILD_BASE_REF" -lc '
              set -euxo pipefail
              source /environment
              export PYTHONPATH=/workspace
              uv pip install --system --python "$(command -v python3)" -r requirements-evidence-engine.txt
              uv pip install --system --python "$(command -v python3)" scipy
              python3 -m py_compile experiments/Issue228_e2_w3_w4_s1/run.py
              python3 experiments/Issue228_e2_w3_w4_s1/run.py s1 \
                --snapshot-root snapshot \
                --results-root issue228-s1-results
            '
      - name: Upload S1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue228-s1
          path: issue228-s1-results
          if-no-files-found: error
          retention-days: 7
