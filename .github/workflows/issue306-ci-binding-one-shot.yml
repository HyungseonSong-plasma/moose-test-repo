name: Issue 306 CI binding one-shot

on:
  push:
    branches:
      - issue-306-heavy-charge-motion
    paths:
      - .github/workflows/issue306-ci-binding-one-shot.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE_SHA: 43567970db23ae6b97c5fc828a53ff95cef1d923
      OPERATION_SHA: 8d3ea7720549148a251a9e11f5733d543344fb2e
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          path: target
          fetch-depth: 1

      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "$BASE_SHA"

      - name: Validate governed workflow surface
        working-directory: target
        run: |
          python3 ci/guards/workflow_surface_guard.py --self-test
          python3 ci/guards/workflow_surface_guard.py --check

      - name: Validate Paul central operating contracts
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/operating_system/README.md
          test -f docs/operating_system/CENTRAL_SKILLS.md
          test -f docs/operating_system/central_skills.json
          grep -Fq "$OPERATION_SHA" docs/operating_system/README.md
          grep -Fq "$OPERATION_SHA" docs/operating_system/CENTRAL_SKILLS.md
          grep -Fq "HyungseonSong-plasma/chatgpt-operation/.github/actions/repository-mutation@$OPERATION_SHA" .github/workflows/refactor.yml
          grep -Fq "HyungseonSong-plasma/chatgpt-operation/.github/actions/governed-work@$OPERATION_SHA" .github/workflows/refactor.yml
          grep -Fq "HyungseonSong-plasma/chatgpt-operation/.github/actions/governed-work@$OPERATION_SHA" .github/workflows/experiment.yml
          grep -Fq "HyungseonSong-plasma/chatgpt-operation/.github/workflows/governed-matrix.yml@$OPERATION_SHA" .github/workflows/experiment.yml
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("docs/operating_system/central_skills.json").read_text())
          assert m["operating_system"]["revision"] == "8d3ea7720549148a251a9e11f5733d543344fb2e"
          entries={x["name"]:x for x in m["skills"]}
          assert set(entries) == {
              "session-bootstrap","state-refresh","repository-mutation",
              "governed-work","governed-matrix",
              "controller-throughput","controller-lifecycle",
          }
          assert entries["governed-matrix"]["load_on"] == ["GOVERNED_MATRIX"]
          assert all(x["revision"] == m["operating_system"]["revision"] for x in entries.values())
          PY
          tmp="$(mktemp -d)"
          git -C "$tmp" init -q
          git -C "$tmp" remote add origin https://github.com/HyungseonSong-plasma/chatgpt-operation.git
          git -C "$tmp" fetch --quiet --depth=1 origin "$OPERATION_SHA"
          CENTRAL_DIR="$tmp" python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          m=json.loads(Path("docs/operating_system/central_skills.json").read_text())
          root=os.environ["CENTRAL_DIR"]
          rev=m["operating_system"]["revision"]
          expected=[m["operating_system"]["index"],m["operating_system"]["essential_rules"]]
          expected += [{"path":x["path"],"expected_blob_sha":x["expected_blob_sha"]} for x in m["skills"]]
          for item in expected:
              actual=subprocess.check_output(["git","-C",root,"rev-parse",f'{rev}:{item["path"]}'],text=True).strip()
              assert actual == item["expected_blob_sha"], (item["path"],item["expected_blob_sha"],actual)
          PY
          rm -rf "$tmp"

      - name: Run routing characterization tests
        working-directory: target
        run: |
          python3 -m pip install -q pytest
          python3 -m pytest -q             tests/characterization/test_experiment_matrix_routing.py             tests/characterization/test_issue306_wall03.py
