name: Issue402 legacy symbol audit once
# Validate canonical scratch lookup report and readonly historical identity; P0 only.
run-name: Issue402 legacy symbol audit ${{ github.sha }}
on:
  push:
    branches: [main]
    paths: [.github/workflows/issue402-legacy-symbol-audit-once.yml]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: P0 broad source and scratch compatibility regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet 'pytest>=8,<9'
          python3 -m pytest -q \
            tests/test_issue402_dd_plasma_boundary_json.py \
            tests/test_issue402_material_class_names.py \
            tests/test_issue402_species_functor_naming.py \
            tests/test_issue402_s6_wall_naming_staging.py \
            tests/test_issue402_s6_electron_transport_compatibility.py \
            tests/test_issue402_retired_plasma_closures.py \
            tests/test_issue402_transport_material_consolidation.py \
            tests/test_issue402_species_transport_rule.py
          echo ISSUE402_CANONICAL_ENERGY_WALL_P0_PASS
      - name: Inventory tracked source references without modification
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import subprocess
          from collections import defaultdict
          terms = [
              r'log_energy', r'mean_en_solved', r'PhysicsElectronMeanEnergyMaterial',
              r'PhysicsElectronWallFluxMaterial', r'PhysicsElectronAdjacentSheathWallFluxMaterial',
              r'ElectronWallFluxMaterial', r'ESWallFluxMaterial',
              r'normalized'
          ]
          paths = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          for term in terms:
              hits = defaultdict(list)
              for p in paths:
                  if not p: continue
                  try:
                      with open(p, encoding="utf-8") as f:
                          for n, ln in enumerate(f, 1):
                              if term in ln:
                                  hits[p].append(n)
                  except (UnicodeError, OSError):
                      continue
              print("SYMBOL", term, "FILES", len(hits), "HITS", sum(map(len, hits.values())), flush=True)
              for p, lines in sorted(hits.items()):
                  print("REF", term, p, ",".join(map(str, lines[:40])), flush=True)
          PY
      - name: Inventory done
        shell: bash
        run: echo ISSUE402_LEGACY_SYMBOL_AUDIT_PASS
