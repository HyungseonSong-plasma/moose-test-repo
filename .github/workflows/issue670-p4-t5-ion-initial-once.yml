name: Issue670 P4-T5 ion initial density and IC owner P0
on:
  push:
    branches: [issue-670-p4-t5-ion-initial-20261117]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b5c1de717bd944bfa11685e826a922fbb6ae483a
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: issue668-p2-newonly-production-runner-static-417-941
          run-id: 44199587771
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: evidence
      - name: Independent per-case 11-layer and ion-density source readback
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = b5c1de717bd944bfa11685e826a922fbb6ae483a
          python3 - <<'PY'
          import ast,copy,hashlib,json,math,re
          from pathlib import Path
          HEAD="b5c1de717bd944bfa11685e826a922fbb6ae483a"
          STAGE_HEAD="9c15a4f0e2cf8042cb0d4b2f18af31511021d168"
          ROOT=Path("experiments/Issue402_plasma_dsl_g1")
          NA=6.02214076e23
          EXPECT_N={"O2p":1000000000000001.6,"Om":999999999999.9983,"Op":999999999999.9983}
          EXPECT_Q={"O2p":1,"Om":-1,"Op":1}
          JSON_SHA={"417":"ed99493d992c71b30e7a4120646af388894032d262b9af5bf299522629fe24ef",
                    "941":"2a7d6b191eddf6a92a6bcf74fc818ade8f30836fdd857dc70516f3aa57fa5dde"}
          OVERLAY_SHA={"417":"c89a01124fb96aa760b6753383eaa79ec6ae07d715d53910754dfe22afff6c8d",
                       "941":"76f52e0aa5e25bb094ca1946f5cb820ccbf5e64c1abc54fb4f1f5e45b23eacac"}
          def h(b):return hashlib.sha256(b).hexdigest()
          def check(t,why):
              if not t:raise ValueError(why)
          def unique(pairs):
              d={}
              for k,v in pairs:
                  check(k not in d,"DUPLICATE_JSON_KEY:"+k);d[k]=v
              return d
          def loads(b):return json.loads(b.decode("utf-8"),object_pairs_hook=unique)
          cpp=Path("physics_app/src/physics/plasma/DDContinuityEq.C").read_text()
          for tok in ['return "log_" + species;', 'variableExists(variable, /*error_if_aux=*/true)',
                      '/*error if already an IC*/ true','std::log(density) - std::log(PHYSICS_CONSTANTS::N_A)',
                      'getProblem().addFVInitialCondition(type, name() + "_" + species + "_density_ic", params)',
                      'params.set<std::string>("property_name") = id + "_number_density"',
                      'number_scale.str() + "*exp(log_c)"']:
              check(tok in cpp,"MISSING_CPP_ION_INITIAL_CONTRACT:"+tok)
          historical_source=(ROOT/"chemistry/prepare_hybrid_json_s6.py").read_text()
          nodes=ast.parse(historical_source).body
          pinned=[ast.literal_eval(x.value) for x in nodes if isinstance(x,ast.Assign) and
                  any(isinstance(t,ast.Name) and t.id=="PINNED_INITIAL_LOG" for t in x.targets)]
          check(len(pinned)==1,"HISTORICAL_INITIAL_REFERENCE_MISSING")
          old=pinned[0]
          def validate_json(j):
              vals={}
              for s,nexpected in EXPECT_N.items():
                  spec=j.get("species",{}).get(s,{})
                  n=spec.get("initial_number_density")
                  check(type(n) in (int,float) and math.isfinite(n) and n>0 and n==nexpected,
                        "INVALID_ION_INITIAL:"+s)
                  check(spec.get("charge_number")==EXPECT_Q[s],"INVALID_CHARGE:"+s)
                  x=math.log(n)-math.log(NA)
                  check(abs(x-float(old["log_"+s]))<1e-12,"HISTORICAL_LOG_MOLAR_DRIFT:"+s)
                  check(abs((NA*math.exp(x))/n-1)<1e-12,"NUMBER_DENSITY_UNIT_DRIFT:"+s)
                  vals[s]={"n_m_minus3":n,"charge":spec["charge_number"],"variable":"log_"+s,
                    "initial_log_mol_m_minus3":x,"historical_log_molar":float(old["log_"+s]),
                    "number_density_output":s+"_number_density",
                    "expected_IC_factory":"FVConstantIC"}
              return vals
          def validate_overlay(t,case):
              check(t.count("[Continuity]")==1,"MULTIPLE_CONTINUITY")
              check(t.count("fvm_species = 'O2p Om Op'")==1,"INCORRECT_FVM_SPECIES")
              check(t.count("files = 'chemistry/unified_s6_"+case+"_newonly.json'")==1,"WRONG_JSON_BINDING")
              check("dont_create_kernels" not in t,"DISABLED_KERNEL_GENERATION")

          def objects(blob,name,ordinal):
              out=[];stack=[];offset=0
              blob.decode("utf-8")
              for line_no,line in enumerate(blob.splitlines(keepends=True),1):
                  m=re.fullmatch(rb"\[([^\[\]]*)\]",line.strip())
                  if m:
                      symbol=m[1].decode()
                      if symbol:stack.append((symbol,offset,line_no))
                      elif stack:
                          obj,start,start_ln=stack.pop()
                          if len(stack)==1 and stack[0][0] in (
                            "Variables","FVVariables","ICs","FVICs","FVInitialConditions","InitialConditions",
                            "FunctorMaterials","Materials"):
                              raw=blob[start:offset+len(line)]
                              params={}
                              for row in raw.decode().splitlines()[1:-1]:
                                  kv=re.fullmatch(r"\s*([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*?)\s*",row)
                                  if kv:
                                      check(kv[1] not in params,"DUPLICATE_OBJECT_PARAM:"+obj)
                                      params[kv[1]]=kv[2].strip().strip("'\"")
                              out.append({"section":stack[0][0],"object_name":obj,
                                  "filename":name,"layer_ordinal":ordinal,"line_start":start_ln,
                                  "block_sha256":h(raw),"params":params})
                  offset+=len(line)
              check(not stack,"UNBALANCED_STAGE_INPUT:"+name)
              return out
          def collisions(entries):
              targets={"log_"+s for s in EXPECT_N}
              legacy={"log_ni","log_nm","log_nop"}
              out=[]
              for x in entries:
                  section=x["section"];name=x["object_name"];p=x["params"]
                  if section in ("Variables","FVVariables") and name in targets|legacy:
                      out.append({"cause":"EXTERNAL_SOLVER_VARIABLE","object":x})
                  if section in ("ICs","FVICs","FVInitialConditions","InitialConditions") and
                     p.get("variable") in targets|legacy:
                      out.append({"cause":"EXTERNAL_ION_IC","object":x})
              return out
          report_cases={}
          for case in ("417","941"):
              jpath=ROOT/"chemistry"/("unified_s6_"+case+"_newonly.json")
              tpath=ROOT/("issue633_newonly_s6_"+case+"_continuity.template.i")
              jraw=jpath.read_bytes();traw=tpath.read_bytes()
              check(h(jraw)==JSON_SHA[case] and h(traw)==OVERLAY_SHA[case],
                    "CURRENT_HEAD_JSON_OR_OVERLAY_DRIFT:"+case)
              j=loads(jraw);txt=traw.decode()
              expected=validate_json(j);validate_overlay(txt,case)
              croot=Path("evidence/cases")/case
              folder=croot/"experiments/Issue395_powered_chemistry_ladder"
              if not folder.is_dir():
                  print("DEBUG_ARTIFACT="+repr([str(x) for x in Path("evidence").rglob("*") if x.is_file()][:35]))
                  raise ValueError("STAGED_CASE_NOT_FOUND:"+case)
              stage=loads((croot/"newonly_stage_receipt.json").read_bytes())
              check(stage["source_head"]==STAGE_HEAD and str(stage["variant"])==case,
                    "STAGE_ORIGIN_NOT_EXACT:"+case)
              check(stage["status"]=="P2_NEWONLY_JSON_AND_LAYER11_STAGE_STATIC_PASS_RUNTIME_HOLD",
                    "STAGE_STATUS_INVALID:"+case)
              check(stage["retired_native_ion_owners"]==26 and stage["remaining_native_ion_fv_owners"]==0,
                    "STAGE_OLD_ION_OWNER_COUNT:"+case)
              hashes=stage["layers_after_sha256"]
              check(len(hashes)==11 and "migrated_continuity.i" in hashes,
                    "STAGE_11_LAYER_MANIFEST_BAD:"+case)
              obj=[];layers=[]
              for i,(name,expect_sha) in enumerate(hashes.items(),1):
                  file=folder/name
                  check(file.is_file() and not file.is_symlink() and name==file.name,
                        "STAGE_MISSING_FILE:"+case+name)
                  b=file.read_bytes()
                  check(0<len(b)<200000 and h(b)==expect_sha,
                        "STAGE_FILE_SHA_MISMATCH:"+case+name)
                  layers.append({"ordinal":i,"name":name,"file_sha256":h(b),"size_bytes":len(b)})
                  obj.extend(objects(b,name,i))
              check(h((folder/"migrated_continuity.i").read_bytes())==h(traw),
                    "STAGE_OVERLAY_BYTE_SHA_MISMATCH:"+case)
              check(h((folder/"chemistry"/jpath.name).read_bytes())==h(jraw),
                    "STAGE_JSON_BYTE_SHA_MISMATCH:"+case)
              issues=collisions(obj)
              alias={a:[{"layer":x["layer_ordinal"],"file":x["filename"],
                          "block_sha256":x["block_sha256"]}
                        for x in obj if x["object_name"]==a]
                     for a in ("n_i_physical","n_m_physical","n_op_physical")}
              report_cases[case]={"source_json_sha256":h(jraw),"source_overlay_sha256":h(traw),
                "actual_staged_json_sha256":h((folder/"chemistry"/jpath.name).read_bytes()),
                "actual_staged_layer11_sha256":h((folder/"migrated_continuity.i").read_bytes()),
                "staged_file_sha_checks":len(layers),"layers":layers,
                "ion_species_initials":expected,"explicit_external_ion_initial_conflicts":issues,
                "explicit_external_ion_initial_conflict_count":len(issues),
                "retained_legacy_density_aliases":alias,
                "stage_origin_head":STAGE_HEAD,
                "static_owner_verdict":"PASS_SOURCE_UNIQUE" if not issues else "HOLD_CONFLICT",
                "runtime_generated_IC_count":"NOT_RUN"}
              print("P4_T5_"+case+f"_FILE_SHA=11/11 JSON=PASS OVERLAY=PASS EXTERNAL_IC_CONFLICTS={len(issues)}")
              for collision in issues:
                  print("P4_T5_CONFLICT_"+case+"="+repr((collision["cause"],collision["object"]["object_name"])))
          negatives={}
          def reject(label,fn):
              try:fn()
              except ValueError:negatives[label]="REJECTED"
              else:raise ValueError("FALSE_PASS:"+label)
          base=loads((ROOT/"chemistry/unified_s6_417_newonly.json").read_bytes())
          for tag,s,field,new in (
              ("missing_O2p","O2p","initial_number_density",None),
              ("zero_Om","Om","initial_number_density",0),
              ("negative_Op","Op","initial_number_density",-1),
              ("changed_O2p","O2p","initial_number_density",2e15),
              ("charge_om","Om","charge_number",1)):
              j=copy.deepcopy(base)
              if new is None:j["species"][s].pop(field)
              else:j["species"][s][field]=new
              reject(tag,lambda j=j:validate_json(j))
          t=(ROOT/"issue633_newonly_s6_417_continuity.template.i").read_text()
          reject("duplicate_fvm_selector",lambda:validate_overlay(t.replace(
                "fvm_species = 'O2p Om Op'","fvm_species = 'O2p Om Op O2p'"),"417"))
          reject("missing_fvm_selector",lambda:validate_overlay(t.replace(
                "fvm_species = 'O2p Om Op'",""),"417"))
          sample={"section":"Variables","object_name":"log_Om","params":{}}
          reject("external_manual_solver",lambda:check(not collisions([sample]),"MANUAL_SOLVER_COLLISION"))
          sample={"section":"ICs","object_name":"manual_om_ic","params":{"variable":"log_Om"}}
          reject("external_manual_IC",lambda:check(not collisions([sample]),"MANUAL_IC_COLLISION"))
          reject("wrong_file_sha",lambda:check(h(b"mutated")=="0"*64,"FILE_SHA_MISMATCH"))
          check(len(negatives)==10,"NEGATIVE_TEST_COUNT")
          receipt={
            "schema":"issue670.p4_t5.ion_density_initial_source_and_stage.v1",
            "task_id":"P4-T5","current_review_head":HEAD,
            "original_P2_stage_source_head":STAGE_HEAD,
            "P2_run_id":44199587771,"P2_artifact_id":14380831538,
            "verdict":"CURRENT_SOURCE_AND_PRIOR_STAGE_STATIC_AUDIT_PASS_WITH_RUNTIME_HOLD",
            "cases":report_cases,"negative_controls":negatives,
            "cxx_contract":{"source":str(Path("physics_app/src/physics/plasma/DDContinuityEq.C")),
              "initial_log_law":"ln(number_density)-ln(N_A)",
              "physical_number_density_law":"N_A*exp(log_molar_density)",
              "manual_variable_guard":"variableExists(... error_if_aux=true)",
              "manual_IC_guard":"shouldCreateIC(... error_if_already_an_IC=true)",
              "expected_Physics_generated_IC_owner_count":3},
            "limitations":["P2 CI was built at source 9c15a4f, not at latest 665 review head",
              "Current JSON/overlay and C++ source blobs verified; current-head runtime not executed",
              "Actual generated IC and density Functor warehouse not inspected",
              "New-only P4 density/Poisson alias cutover remains P4-X",
              "Native P2/P3/P4 NOT_RUN; science HOLD"],
            "native_p2":"NOT_RUN","native_p3":"NOT_RUN","native_p4":"NOT_RUN","science":"SCIENCE_HOLD"
          }
          Path("p4t5-receipt").mkdir(exist_ok=True)
          (Path("p4t5-receipt")/"p4-t5-ion-density.json").write_text(json.dumps(receipt,sort_keys=True,indent=2)+"\n")
          print("P4_T5_NEGATIVE_CONTROLS=10/10_REJECTED")
          print("P4_T5_FINISHED_CURRENT_SOURCE_AND_OLDER_SOURCE_STAGE_BOUNDARY_HOLD")
          PY
      - name: Upload only P4-T5 receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue670-p4-t5-${{ github.run_id }}-${{ github.run_attempt }}
          path: p4t5-receipt/
          if-no-files-found: warn
          retention-days: 30
