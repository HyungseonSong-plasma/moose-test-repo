# One-shot: production PhysicsApp corrected-neutral Oxygen24 at 400 W / 1000 W.
# Strict P3 wall-time budget 285 seconds each; t_final = 2 ns (2 x 1 ns).
# No physical chemistry validity claim from a 2-ns initialization smoke.
name: Issue419 Oxygen24 2ns checkpoint and 4ns recover once
run-name: Oxygen24 checkpoint recover 2 to 4ns ${{ github.sha }}
on:
  push:
    branches: [experiment/oxygen24-restart-2ns-to-4ns-20261031]
    paths: [.github/workflows/issue419-oxygen24-restart-once.yml]

permissions:
  contents: read

concurrency:
  group: issue419-oxygen24-restart-once
  cancel-in-progress: false

jobs:
  private-rate-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check 19-table private rate secret
        env:
          PRIVATE_RATES_B64: ${{ secrets.OXYGEN24_RATES_TAR_XZ_B64 }}
        run: |
          test -n "$PRIVATE_RATES_B64" || { echo "::error::Private rate secret absent"; exit 22; }
          echo "OXYGEN24_PRIVATE_RATE_SECRET_PRESENT=YES"

  smoke:
    needs: private-rate-gate
    name: Real PhysicsApp ${{ matrix.power_w }}W 2ns to 4ns
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        power_w: [400, 1000]
    env:
      CHATGPT_WORK_BASE_SHA: ${{ github.sha }}
      OXYGEN_RESEARCH_400: '1'
      OXYGEN_RESEARCH_FULL24: '1'
      OXYGEN_RESEARCH_QUICK_5MIN: '1'
      OXYGEN_RESEARCH_RATE_DIR: /tmp/oxygen24/private_rates
      PWD_IN_RUNNER: ${{ github.workspace }}
    steps:
      - name: Checkout exact corrected source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Exact SHA and source policy
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CHATGPT_WORK_BASE_SHA"
          test "$OXYGEN_RESEARCH_QUICK_5MIN" = 1
          test ! -e experiments/Issue395_powered_chemistry_ladder/private_rates
          echo "SMOKE_EXACT_HEAD=$CHATGPT_WORK_BASE_SHA"

      - name: Restore and validate private 19 lookup rates
        env:
          PRIVATE_RATES_B64: ${{ secrets.OXYGEN24_RATES_TAR_XZ_B64 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$OXYGEN_RESEARCH_RATE_DIR"
          printf '%s' "$PRIVATE_RATES_B64" | base64 --decode | tar -xJ -C "$OXYGEN_RESEARCH_RATE_DIR" --no-same-owner
          python3 - <<'PY'
          import importlib.util, os
          from pathlib import Path
          p=Path(os.environ["OXYGEN_RESEARCH_RATE_DIR"])
          src=Path("experiments/Issue395_powered_chemistry_ladder/build_oxygen_24_source_overlay.py")
          spec=importlib.util.spec_from_file_location("chem24",src)
          m=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          files=m.validate_files(p)
          assert len(files)==19 and set(files)==set(m.LOOKUP_IDS)
          assert m.validate_network()["atoms_charge_mass"]=="PASS"
          print("OXYGEN24_PRIVATE_RATES_PASS")
          PY

      - name: Install preparation dependencies and run P0 regressions
        run: |
          set -euo pipefail
          python3 -m venv .issue419-smoke-venv
          .issue419-smoke-venv/bin/python -m pip install --disable-pip-version-check --quiet 'pytest>=8,<9' numpy==2.1.2 scipy==1.14.1
          .issue419-smoke-venv/bin/python -m pytest -q \
            tests/test_issue395_oxygen_full24_source_overlay.py \
            tests/test_issue395_oxygen_full24_seeds.py \
            tests/test_issue395_oxygen_full24_smoke_timegrid.py \
            tests/test_issue395_oxygen_full24_wall_sticking.py \
            tests/test_issue395_receiver_200sccm_inlet.py
          bash -n experiments/Issue395_powered_chemistry_ladder/issue397_l1_power_scan_replay.sh

      - name: P0 prepare real 2ns input and verify initial neutral fraction
        run: |
          set -euo pipefail
          source .issue419-smoke-venv/bin/activate
          bash experiments/Issue395_powered_chemistry_ladder/issue397_l1_power_scan_replay.sh prepare ${{ matrix.power_w }}

      - name: Enable real MOOSE parent+MultiApp checkpoint at every step
        run: |
          set -euo pipefail
          CHEM=experiments/Issue395_powered_chemistry_ladder
          INPUT="$CHEM/rf_elastic_diss_ion_ei20_ei01_${MATRIX_POWER}w_adjacent_sheath_wall_closed_100us_dt1000ns.i"
          python3 "$CHEM/oxygen24_checkpoint_restart.py" --self-test
          python3 "$CHEM/oxygen24_checkpoint_restart.py" --enable-checkpoint "$INPUT"
          bash -n "$CHEM/oxygen24_resume_native.sh"
        env:
          MATRIX_POWER: ${{ matrix.power_w }}

      - name: P1 build exact-source real physics-opt
        run: |
          set -euo pipefail
          bash experiments/Issue395_powered_chemistry_ladder/issue397_l1_power_scan_replay.sh build ${{ matrix.power_w }}

      - name: P2 production physics-opt --check-input
        run: |
          set -euo pipefail
          bash experiments/Issue395_powered_chemistry_ladder/issue397_l1_power_scan_replay.sh check ${{ matrix.power_w }}

      - name: P3 first native 0-to-2ns solve with checkpoint (max 285s)
        run: |
          set -euo pipefail
          started="$(date +%s)"
          set +e
          timeout -s TERM -k 10s 285s \
            bash experiments/Issue395_powered_chemistry_ladder/issue397_l1_power_scan_replay.sh solve ${{ matrix.power_w }}
          code="$?"
          set -e
          elapsed=$(( $(date +%s) - started ))
          echo "FIRST_2NS_WALL_SECONDS=$elapsed CODE=$code"
          test "$code" -eq 0
          printf 'first_2ns_wall_seconds=%s\nfirst_2ns_exit_code=%s\n' "$elapsed" "$code" > checkpoint-restart-${{ matrix.power_w }}W.status

      - name: P4 audit nested .rd and .cpa.gz 2ns checkpoint and freeze evidence
        env:
          MATRIX_POWER: ${{ matrix.power_w }}
        run: |
          set -euo pipefail
          CHEM=experiments/Issue395_powered_chemistry_ladder
          RESULT="$CHEM/results_rf_elastic_diss_ion_ei20_ei01_${MATRIX_POWER}w_adjacent_sheath_wall_closed_100us_dt1000ns"
          INPUT="$CHEM/rf_elastic_diss_ion_ei20_ei01_${MATRIX_POWER}w_adjacent_sheath_wall_closed_100us_dt1000ns.i"
          cp "$RESULT/run/plasma.csv" "$RESULT/first_2ns.csv"
          python3 "$CHEM/oxygen24_checkpoint_restart.py" --verify-first "$RESULT/first_2ns.csv" --power-w "$MATRIX_POWER" --manifest "$RESULT/first_2ns_evidence.json"
          find "$RESULT/run/plasma_cp" -type f -printf "%P\t%s bytes\n" | sort | tee "$RESULT/checkpoint_2ns_listing.txt"
          python3 "$CHEM/oxygen24_checkpoint_restart.py" --verify-checkpoint "$RESULT/run/plasma_cp" --manifest "$RESULT/checkpoint_2ns_manifest.json"
          # Preserve symlinks and the complete parent/MultiApp recovery state.
          tar -czf "$RESULT/checkpoint_2ns.tar.gz" -C "$RESULT/run" plasma_cp
          tar -tzf "$RESULT/checkpoint_2ns.tar.gz" > "$RESULT/checkpoint_tar_listing.txt"
          grep -q "^plasma_cp/" "$RESULT/checkpoint_tar_listing.txt"
          sha256sum "$RESULT/checkpoint_2ns.tar.gz" > "$RESULT/checkpoint_2ns.tar.gz.sha256"
          cp "$INPUT" "$RESULT/input_2ns_checkpoint.i"
          python3 "$CHEM/oxygen24_checkpoint_restart.py" --extend "$INPUT"
          echo "REAL_2NS_MOOSE_CHECKPOINT_PRESERVED_AND_4NS_INPUT_READY"

      - name: P5 check extended 4ns input before actual recovery
        run: |
          set -euo pipefail
          bash experiments/Issue395_powered_chemistry_ladder/issue397_l1_power_scan_replay.sh check ${{ matrix.power_w }}

      - name: P6 actual MOOSE --recover explicit 0002 checkpoint 2-to-4ns (max 285s)
        run: |
          set -euo pipefail
          started="$(date +%s)"
          set +e
          timeout -s TERM -k 10s 285s \
            bash experiments/Issue395_powered_chemistry_ladder/oxygen24_resume_native.sh ${{ matrix.power_w }}
          code="$?"
          set -e
          elapsed=$(( $(date +%s) - started ))
          echo "RECOVERY_2_TO_4NS_WALL_SECONDS=$elapsed CODE=$code"
          printf 'recovery_wall_seconds=%s\nrecovery_exit_code=%s\n' "$elapsed" "$code" >> checkpoint-restart-${{ matrix.power_w }}W.status
          test "$code" -eq 0

      - name: P7 verify recovered 4ns result and real solver log
        env:
          MATRIX_POWER: ${{ matrix.power_w }}
        run: |
          set -euo pipefail
          CHEM=experiments/Issue395_powered_chemistry_ladder
          RESULT="$CHEM/results_rf_elastic_diss_ion_ei20_ei01_${MATRIX_POWER}w_adjacent_sheath_wall_closed_100us_dt1000ns"
          python3 "$CHEM/oxygen24_checkpoint_restart.py" \
            --verify-restart "$RESULT/run/plasma.csv" --first-csv "$RESULT/first_2ns.csv" \
            --power-w "$MATRIX_POWER" --log "$RESULT/recovery_runtime.log" \
            --manifest "$RESULT/recovery_2ns_to_4ns_evidence.json"
          echo "OXYGEN24_GENUINE_CHECKPOINT_RECOVERY_PASS_${MATRIX_POWER}W"

      - name: Archive actual checkpoint and restart continuation evidence (no rate tables)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oxygen24-real-checkpoint-restart-${{ matrix.power_w }}W
          retention-days: 21
          if-no-files-found: warn
          path: |
            checkpoint-restart-${{ matrix.power_w }}W.status
            experiments/Issue395_powered_chemistry_ladder/results_rf_elastic_diss_ion_ei20_ei01_${{ matrix.power_w }}w_adjacent_sheath_wall_closed_100us_dt1000ns/first_2ns.csv
            experiments/Issue395_powered_chemistry_ladder/results_rf_elastic_diss_ion_ei20_ei01_${{ matrix.power_w }}w_adjacent_sheath_wall_closed_100us_dt1000ns/first_2ns_evidence.json
            experiments/Issue395_powered_chemistry_ladder/results_rf_elastic_diss_ion_ei20_ei01_${{ matrix.power_w }}w_adjacent_sheath_wall_closed_100us_dt1000ns/checkpoint_2ns.tar.gz
            experiments/Issue395_powered_chemistry_ladder/results_rf_elastic_diss_ion_ei20_ei01_${{ matrix.power_w }}w_adjacent_sheath_wall_closed_100us_dt1000ns/checkpoint_2ns.tar.gz.sha256
            experiments/Issue395_powered_chemistry_ladder/results_rf_elastic_diss_ion_ei20_ei01_${{ matrix.power_w }}w_adjacent_sheath_wall_closed_100us_dt1000ns/checkpoint_2ns_manifest.json
            experiments/Issue395_powered_chemistry_ladder/results_rf_elastic_diss_ion_ei20_ei01_${{ matrix.power_w }}w_adjacent_sheath_wall_closed_100us_dt1000ns/checkpoint_2ns_listing.txt
            experiments/Issue395_powered_chemistry_ladder/results_rf_elastic_diss_ion_ei20_ei01_${{ matrix.power_w }}w_adjacent_sheath_wall_closed_100us_dt1000ns/checkpoint_tar_listing.txt
            experiments/Issue395_powered_chemistry_ladder/results_rf_elastic_diss_ion_ei20_ei01_${{ matrix.power_w }}w_adjacent_sheath_wall_closed_100us_dt1000ns/input_2ns_checkpoint.i
            experiments/Issue395_powered_chemistry_ladder/results_rf_elastic_diss_ion_ei20_ei01_${{ matrix.power_w }}w_adjacent_sheath_wall_closed_100us_dt1000ns/check_input.log
            experiments/Issue395_powered_chemistry_ladder/results_rf_elastic_diss_ion_ei20_ei01_${{ matrix.power_w }}w_adjacent_sheath_wall_closed_100us_dt1000ns/runtime.log
            experiments/Issue395_powered_chemistry_ladder/results_rf_elastic_diss_ion_ei20_ei01_${{ matrix.power_w }}w_adjacent_sheath_wall_closed_100us_dt1000ns/recovery_runtime.log
            experiments/Issue395_powered_chemistry_ladder/results_rf_elastic_diss_ion_ei20_ei01_${{ matrix.power_w }}w_adjacent_sheath_wall_closed_100us_dt1000ns/run/plasma.csv
            experiments/Issue395_powered_chemistry_ladder/results_rf_elastic_diss_ion_ei20_ei01_${{ matrix.power_w }}w_adjacent_sheath_wall_closed_100us_dt1000ns/recovery_2ns_to_4ns_evidence.json
            experiments/Issue395_powered_chemistry_ladder/rf_elastic_diss_ion_ei20_ei01_${{ matrix.power_w }}w_adjacent_sheath_wall_closed_100us_dt1000ns.i
