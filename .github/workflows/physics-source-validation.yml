name: Physics source TDD validation

on:
  push:
    branches:
      - development
    paths:
      - 'physics_app/**'
      - '.github/workflows/physics-source-validation.yml'
  pull_request:
    branches:
      - development
    paths:
      - 'physics_app/**'
      - '.github/workflows/physics-source-validation.yml'

concurrency:
  group: physics-source-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/qpx-build-base@sha256:910d406eb3574a918290dc3621df1133569907d6e7af7884f68abe257a9a1999
  EXPECTED_MOOSE_SHA: 9f388366ccf38b9c34542ec5561198249fde0ac9
  EXPECTED_CRANE_SHA: ba26970cf419dcac563a20ed7079d445bc6341c3
  EXPECTED_SQUIRREL_SHA: 16a26d504f3ee11161a86d4e3ebf3c0e5f2afbb1
  EXPECTED_ZAPDOS_SHA: 9eceffbc46048c3760bbfa9a7f1ca681ae35af1d

jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout implementation and tests at one revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Validate canonical Physics source contract
        shell: bash
        run: |
          set -euxo pipefail
          test -f physics_app/Makefile
          test -f physics_app/src/main.C
          test -f physics_app/ci/smoke.i
          test -f physics_app/ci/electron_energy_transport_smoke.i
          test -f physics_app/ci/electron_energy_transport_smoke_table.txt
          test -f physics_app/ci/electron_energy_lookup_response_smoke.i
          test -f physics_app/ci/electron_energy_lookup_response_smoke_table.txt
          test -f physics_app/ci/check_electron_energy_lookup_response.py
          test -f physics_app/ci/electron_energy_joule_smoke.i
          test -f physics_app/ci/electron_energy_wall_smoke.i
          test -f physics_app/include/materials/PhysicsElectronMeanEnergyMaterial.h
          test -f physics_app/src/materials/PhysicsElectronMeanEnergyMaterial.C
          test -f physics_app/include/fvbcs/PhysicsFVElectronEnergyWallFluxBC.h
          test -f physics_app/src/fvbcs/PhysicsFVElectronEnergyWallFluxBC.C
          test -f physics_app/dependencies.lock
          test -f physics_app/SOURCE_PROVENANCE.md
          test -f experiments/Issue91_real_qvt_r3/r3_e0/electron_moments.txt

          grep -Fq 'const ADReal mean_en_solved =' physics_app/src/materials/PhysicsElectronMeanEnergyMaterial.C
          grep -Fq '_energy_reference_eV * n_epsilon_hat / n_e_hat;' physics_app/src/materials/PhysicsElectronMeanEnergyMaterial.C
          grep -Fq 'std::isfinite(n_e_hat.value())' physics_app/src/materials/PhysicsElectronMeanEnergyMaterial.C
          grep -Fq 'std::isfinite(n_epsilon_hat.value())' physics_app/src/materials/PhysicsElectronMeanEnergyMaterial.C
          grep -Fq 'std::isfinite(mean_en_solved.value())' physics_app/src/materials/PhysicsElectronMeanEnergyMaterial.C
          grep -Fq 'No denominator floor is applied.' physics_app/src/materials/PhysicsElectronMeanEnergyMaterial.C
          grep -Fq 'No clamp is applied.' physics_app/src/materials/PhysicsElectronMeanEnergyMaterial.C
          grep -Fq 'energy_reference_eV = 5.73276' physics_app/ci/electron_energy_transport_smoke.i
          grep -Fq 'mean_energy = mean_en_solved' physics_app/ci/electron_energy_transport_smoke.i
          grep -Fq 'bounds_policy = error' physics_app/ci/electron_energy_transport_smoke.i
          test "$(grep -Fc 'type = PhysicsElectronTransportLookupMaterial' physics_app/ci/electron_energy_transport_smoke.i)" -eq 1
          ! grep -Eq 'mean_energy[[:space:]]*=[[:space:]]*mean_en([[:space:]]|$)' physics_app/ci/electron_energy_transport_smoke.i
          grep -Fq 'mean_energy = mean_en_solved' physics_app/ci/electron_energy_lookup_response_smoke.i
          grep -Fq 'bounds_policy = error' physics_app/ci/electron_energy_lookup_response_smoke.i

          test "$(awk 'NR == 1 {print $1}' experiments/Issue91_real_qvt_r3/r3_e0/electron_moments.txt)" = "1.40991"
          test "$(awk 'END {print $1}' experiments/Issue91_real_qvt_r3/r3_e0/electron_moments.txt)" = "22.1378"

          grep -Fq '(5.0 / 6.0)' physics_app/src/fvbcs/PhysicsFVElectronEnergyWallFluxBC.C
          grep -Fq 'see_energy_eV = 4.0' physics_app/src/fvbcs/PhysicsFVElectronEnergyWallFluxBC.C
          ! grep -Fq 'absorbingNumberFlux' physics_app/src/fvbcs/PhysicsFVElectronEnergyWallFluxBC.C

          source physics_app/dependencies.lock
          test "$MOOSE" = "$EXPECTED_MOOSE_SHA"
          test "$CRANE" = "$EXPECTED_CRANE_SHA"
          test "$SQUIRREL" = "$EXPECTED_SQUIRREL_SHA"
          test "$ZAPDOS" = "$EXPECTED_ZAPDOS_SHA"
          test "$PHYSICS_BUILD_BASE" = "$BUILD_BASE_REF"

          test ! -e physics_app/physics-opt
          test ! -d physics_app/build
          test ! -d physics_app/lib
          test ! -d physics_app/.libs
          test ! -d physics_app/.jitcache
          test ! -d physics_app/.pytest_cache

          FORBIDDEN_TRACKED="$(git ls-files physics_app | grep -E '(^|/)(physics-opt|build/|lib/|\.libs/|\.jitcache/|\.pytest_cache/)|\.(o|lo|la|a|so)(\.|$)' || true)"
          test -z "$FORBIDDEN_TRACKED"
          echo PHYSICS_CANONICAL_SOURCE_CONTRACT_PASS

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare runner disk for accepted build-base
        shell: bash
        run: |
          set -euxo pipefail
          target_kb=$((14 * 1024 * 1024))
          free_kb() { df -Pk / | awk 'NR == 2 {print $4}'; }
          df -h /
          sudo apt-get clean || true
          docker system prune -af --volumes || true
          for path in \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/local/.ghcup
          do
            if (( $(free_kb) >= target_kb )); then
              break
            fi
            sudo rm -rf "$path" || true
          done
          df -h /
          test "$(free_kb)" -ge "$target_kb"

      - name: Pull immutable precompiled build base
        shell: bash
        run: |
          set -euxo pipefail
          docker pull "$BUILD_BASE_REF"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{index .RepoDigests 0}}' | sed 's/.*@//')" = "sha256:910d406eb3574a918290dc3621df1133569907d6e7af7884f68abe257a9a1999"

      - name: Build canonical physics_app and run real smoke
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm \
            --entrypoint /bin/bash \
            --user 0:0 \
            --workdir /workspace/physics_app \
            -e GITHUB_SHA="$GITHUB_SHA" \
            -v "$PWD:/workspace" \
            "$BUILD_BASE_REF" \
            -lc '
              set -euxo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory /opt/qpx_vendor/moose
              git config --global --add safe.directory /opt/qpx_vendor/crane
              git config --global --add safe.directory /opt/qpx_vendor/squirrel
              git config --global --add safe.directory /opt/qpx_vendor/zapdos

              test "$(git rev-parse --show-toplevel)" = "/workspace"
              test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

              export MOOSE_DIR=/opt/qpx_vendor/moose
              export CRANE_DIR=/opt/qpx_vendor/crane
              export SQUIRREL_DIR=/opt/qpx_vendor/squirrel
              export ZAPDOS_DIR=/opt/qpx_vendor/zapdos
              export METHOD=opt

              test ! -e ./physics-opt
              echo PHYSICS_SOURCE_BUILD_COMMAND_STARTED
              make -j2
              test -x ./physics-opt
              ./physics-opt --check-input -i ci/smoke.i
              ./physics-opt -i ci/smoke.i
              (
                cd ci
                ../physics-opt --check-input -i electron_energy_transport_smoke.i
                ../physics-opt -i electron_energy_transport_smoke.i
                ../physics-opt --check-input -i electron_energy_lookup_response_smoke.i
                ../physics-opt -i electron_energy_lookup_response_smoke.i Variables/n_epsilon/initial_condition=0.5
                mv electron_energy_lookup_response_smoke_out.csv electron_energy_lookup_response_low.csv
                ../physics-opt -i electron_energy_lookup_response_smoke.i Variables/n_epsilon/initial_condition=1.0
                mv electron_energy_lookup_response_smoke_out.csv electron_energy_lookup_response_base.csv
                ../physics-opt -i electron_energy_lookup_response_smoke.i Variables/n_epsilon/initial_condition=1.5
                mv electron_energy_lookup_response_smoke_out.csv electron_energy_lookup_response_high.csv

                REAL_QVT_TABLE=../../experiments/Issue91_real_qvt_r3/r3_e0/electron_moments.txt
                LOWER_HAT=0.2459391287966006
                UPPER_HAT=3.8616303490814197
                BELOW_HAT=0.245937384436118
                ABOVE_HAT=3.861632093441902

                ../physics-opt -i electron_energy_lookup_response_smoke.i FunctorMaterials/electron_transport/property_table_file="$REAL_QVT_TABLE" Variables/n_epsilon/initial_condition="$LOWER_HAT"
                python3 -c "import csv, math; r=list(csv.DictReader(open(\"electron_energy_lookup_response_smoke_out.csv\")))[-1]; assert math.isclose(float(r[\"mean_en_solved_avg\"]),1.40991,rel_tol=1e-12,abs_tol=1e-12); print(\"PHYSICS_ELECTRON_MEAN_ENERGY_LOWER_BOUND_PASS\")"

                ../physics-opt -i electron_energy_lookup_response_smoke.i FunctorMaterials/electron_transport/property_table_file="$REAL_QVT_TABLE" Variables/n_epsilon/initial_condition="$UPPER_HAT"
                python3 -c "import csv, math; r=list(csv.DictReader(open(\"electron_energy_lookup_response_smoke_out.csv\")))[-1]; assert math.isclose(float(r[\"mean_en_solved_avg\"]),22.1378,rel_tol=1e-12,abs_tol=1e-12); print(\"PHYSICS_ELECTRON_MEAN_ENERGY_UPPER_BOUND_PASS\")"

                if ../physics-opt -i electron_energy_lookup_response_smoke.i FunctorMaterials/electron_transport/property_table_file="$REAL_QVT_TABLE" Variables/n_epsilon/initial_condition="$BELOW_HAT" > electron_energy_below_bound.log 2>&1; then
                  echo "Expected below-table mean-energy failure did not occur" >&2
                  exit 1
                fi
                grep -Fq "below the lookup-table minimum 1.40991 eV" electron_energy_below_bound.log

                if ../physics-opt -i electron_energy_lookup_response_smoke.i FunctorMaterials/electron_transport/property_table_file="$REAL_QVT_TABLE" Variables/n_epsilon/initial_condition="$ABOVE_HAT" > electron_energy_above_bound.log 2>&1; then
                  echo "Expected above-table mean-energy failure did not occur" >&2
                  exit 1
                fi
                grep -Fq "above the lookup-table maximum 22.1378 eV" electron_energy_above_bound.log

                if ../physics-opt -i electron_energy_lookup_response_smoke.i Variables/n_e/initial_condition=0.0 > electron_energy_zero_density.log 2>&1; then
                  echo "Expected n_e_hat <= 0 failure did not occur" >&2
                  exit 1
                fi
                grep -Fq "requires n_e_hat > 0" electron_energy_zero_density.log

                if ../physics-opt -i electron_energy_lookup_response_smoke.i Variables/n_epsilon/initial_condition=-0.1 > electron_energy_negative_energy.log 2>&1; then
                  echo "Expected n_epsilon_hat < 0 failure did not occur" >&2
                  exit 1
                fi
                grep -Fq "requires n_epsilon_hat >= 0" electron_energy_negative_energy.log

                echo PHYSICS_ELECTRON_MEAN_ENERGY_REAL_TABLE_INVARIANTS_PASS

                ../physics-opt --check-input -i electron_energy_joule_smoke.i
                ../physics-opt -i electron_energy_joule_smoke.i
                ../physics-opt --check-input -i electron_energy_wall_smoke.i
                ../physics-opt -i electron_energy_wall_smoke.i
              )
              python3 -c "import csv, math; r=list(csv.DictReader(open(\"ci/electron_energy_transport_smoke_out.csv\")))[-1]; mu=float(r[\"electron_energy_mobility_avg\"])/float(r[\"electron_mobility_avg\"]); diff=float(r[\"electron_energy_diffusion_avg\"])/float(r[\"electron_diffusion_avg\"]); assert math.isclose(mu, 5.0/3.0, rel_tol=1.0e-12, abs_tol=0.0); assert math.isclose(diff, 5.0/3.0, rel_tol=1.0e-12, abs_tol=0.0); N=101325.0/(1.380649e-23*300.0); assert math.isclose(float(r[\"mean_en_solved_avg\"]),5.73276,rel_tol=1e-12); assert math.isclose(float(r[\"electron_mobility_avg\"]),1.0e24/N,rel_tol=1e-10); assert math.isclose(float(r[\"electron_diffusion_avg\"]),2.0e24/N,rel_tol=1e-10); print(\"PHYSICS_ELECTRON_ENERGY_TRANSPORT_5_OVER_3_PASS\"); print(\"PHYSICS_ELECTRON_TRANSPORT_CONSTANT_STATE_REGRESSION_PASS\")"
              python3 ci/check_electron_energy_lookup_response.py
              python3 -c "import csv, math; rows=list(csv.DictReader(open(\"ci/electron_energy_joule_smoke_out.csv\"))); i=rows[0]; f=rows[-1]; dt=1.0e-6; E=100.0; grad_n=0.5; n_avg=1.25; eps=5.0; mu=float(f[\"electron_mobility_avg\"]); D=float(f[\"electron_diffusion_avg\"]); drift=mu*n_avg*E*E/eps*dt; diff=D*E*grad_n/eps*dt; md=float(f[\"energy_drift_avg\"])-float(i[\"energy_drift_avg\"]); mp=float(f[\"energy_plus_avg\"])-float(i[\"energy_plus_avg\"]); mm=float(f[\"energy_minus_avg\"])-float(i[\"energy_minus_avg\"]); close=lambda a,b: math.isclose(a,b,rel_tol=1.0e-9,abs_tol=1.0e-12); assert close(md,drift), (md,drift); assert close(mp,drift+diff), (mp,drift+diff); assert close(mm,drift-diff), (mm,drift-diff); assert close((mp+mm)/2.0,drift), ((mp+mm)/2.0,drift); assert close(mp-mm,2.0*diff), (mp-mm,2.0*diff); print(\"PHYSICS_ELECTRON_ENERGY_FULL_FLUX_JOULE_PASS\")"
              python3 -c "import csv, math; rows=list(csv.DictReader(open(\"ci/electron_energy_wall_smoke_out.csv\"))); f=rows[-1]; dt=1.0e-8; mean_en=5.0; eps=5.0; see=100000.0; e=1.602176634e-19; me=9.1093837139e-31; v=math.sqrt(8.0*e*mean_en/(3.0*math.pi*me)); a=(5.0/6.0)*v; b=(4.0/eps)*see; expected_thermal=1.0/(1.0+dt*a); expected_see=(1.0+dt*b)/(1.0+dt*a); actual_thermal=float(f[\"energy_thermal_avg\"]); actual_see=float(f[\"energy_see_avg\"]); close=lambda x,y: math.isclose(x,y,rel_tol=2.0e-8,abs_tol=1.0e-11); assert close(actual_thermal,expected_thermal),(actual_thermal,expected_thermal); assert close(actual_see,expected_see),(actual_see,expected_see); assert actual_thermal < 1.0; assert actual_see > actual_thermal; print(\"PHYSICS_ELECTRON_ENERGY_WALL_E4_E5_PASS\")"
              echo PHYSICS_SOURCE_BUILD_AND_REAL_SMOKE_PASS
            '

      - name: Assert source validation evidence
        if: ${{ success() }}
        shell: bash
        run: |
          set -euxo pipefail
          test -x physics_app/physics-opt
          echo "REPOSITORY_SHA=${GITHUB_SHA}"
          echo "CANONICAL_PHYSICS_SOURCE_OWNER=moose-test-repo/physics_app"
          echo "IMPLEMENTATION_AND_TEST_REVISION_SHARED=true"
          echo "PHYSICS_SOURCE_CHANGE_USES_PRECOMPILED_BUILD_BASE=true"
          echo "PHYSICS_CHECK_INPUT_SMOKE=PASS"
          echo "ELECTRON_MEAN_ENERGY_BRIDGE_SOURCE=PASS"
          echo "ELECTRON_MEAN_ENERGY_FINITE_GUARDS=PASS"
          echo "ELECTRON_TRANSPORT_LOOKUP_MEAN_ENERGY=mean_en_solved"
          echo "ELECTRON_TRANSPORT_BOUNDS_POLICY=error"
          echo "ELECTRON_TRANSPORT_LOOKUP_OWNER_COUNT=1"
          echo "ELECTRON_TRANSPORT_CONSTANT_STATE_REGRESSION=PASS"
          echo "ELECTRON_SOLVED_MEAN_ENERGY_REACHES_LOOKUP=PASS"
          echo "ELECTRON_TRANSPORT_RESPONSE_DISCRIMINATOR=PASS"
          echo "ELECTRON_MEAN_ENERGY_REAL_TABLE_RANGE=1.40991..22.1378_eV"
          echo "ELECTRON_MEAN_ENERGY_REAL_TABLE_BOUNDARIES=PASS"
          echo "ELECTRON_MEAN_ENERGY_POSITIVITY_REJECTION=PASS"
          echo "ELECTRON_MEAN_ENERGY_OUT_OF_RANGE_REJECTION=PASS"
          echo "ELECTRON_ENERGY_TRANSPORT_5_OVER_3=PASS"
          echo "ELECTRON_ENERGY_FULL_FLUX_JOULE=PASS"
          echo "ELECTRON_ENERGY_WALL_E4_E5=PASS"
          echo "ELECTRON_ENERGY_WALL_ABSORBING_HELPER_REUSED=false"
          echo "BOUNDED_REAL_PHYSICS_RUN=PASS"
          echo "SCIENTIFIC_SEMANTICS_CHANGED=false"
