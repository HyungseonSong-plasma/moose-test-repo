name: predictor corrector transient state audit

on:
  workflow_dispatch:
  push:
    branches:
      - prototype-fully-implicit-electron-poisson
    paths:
      - '.ci_triggers/predictor-corrector-adaptive-dt'

permissions:
  contents: read
  packages: read

env:
  BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
  END_TIME_NS: 1
  OUTPUT_DIR: output_transient_state_audit
  MAX_CORRECTIONS: 10

jobs:
  transient-state-audit:
    name: audit-corrector-old-state-1ns
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Pull build image
        run: docker pull "$BUILD_BASE_REF"

      - name: Build and audit corrector transient old state
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash --user 0:0 \
            --workdir /workspace \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -e END_TIME_NS="$END_TIME_NS" \
            -e OUTPUT_DIR="$OUTPUT_DIR" \
            -e MAX_CORRECTIONS="$MAX_CORRECTIONS" \
            "$BUILD_BASE_REF" -lc '
              set -euo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory /opt/physics_vendor/moose
              git config --global --add safe.directory /opt/physics_vendor/crane
              git config --global --add safe.directory /opt/physics_vendor/squirrel
              git config --global --add safe.directory /opt/physics_vendor/zapdos
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt

              make -C physics_app -j2

              cd experiments/heavy_fast_logmolar_coupling
              python3 prepare_predictor_corrector_horizon.py

              cat >> fast_corrector.i <<EOF

[UserObjects]
  [state_audit_log_energy]
    type = PhysicsVariableStateAudit
    variable = log_energy
    execute_on = TIMESTEP_END
  []
[]
EOF

              cat >> electron_poisson_corrector_stage.i <<EOF

[UserObjects]
  [state_audit_log_ne]
    type = PhysicsVariableStateAudit
    variable = log_ne
    execute_on = TIMESTEP_END
  []
[]
EOF

              for input in \
                electron_poisson_stage.i \
                fast_child.i \
                electron_poisson_corrector_stage.i \
                fast_corrector.i \
                heavy_parent.i
              do
                ../../physics_app/physics-opt -i "$input" --check-input
              done

              rm -rf "$OUTPUT_DIR"
              mkdir -p "$OUTPUT_DIR"

              set +e
              /usr/bin/time \
                -f "wall_seconds=%e\nuser_seconds=%U\nsystem_seconds=%S\nmax_rss_kb=%M" \
                -o "$OUTPUT_DIR/wall_time.txt" \
                ../../physics_app/physics-opt -i heavy_parent.i \
                > "$OUTPUT_DIR/run.log" 2>&1
              rc=$?
              set -e

              echo "run_rc=$rc" | tee "$OUTPUT_DIR/status.txt"
              cp \
                heavy_parent.i \
                fast_child.i \
                electron_poisson_stage.i \
                fast_corrector.i \
                electron_poisson_corrector_stage.i \
                prepare_predictor_corrector_adaptive_dt.py \
                prepare_predictor_corrector_horizon.py \
                "$OUTPUT_DIR/"

              grep "STATE_AUDIT" "$OUTPUT_DIR/run.log" > "$OUTPUT_DIR/state_audit.txt" || true
              grep -E "Beginning fixed point iteration|Applying transferred-solution predictor|Fixed point convergence reason|Time Step|STATE_AUDIT" \
                "$OUTPUT_DIR/run.log" > "$OUTPUT_DIR/summary.txt" || true

              cat "$OUTPUT_DIR/state_audit.txt" || true
              cat "$OUTPUT_DIR/wall_time.txt" || true
              exit "$rc"
            '

      - name: Upload transient state audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: predictor-corrector-transient-state-audit
          path: experiments/heavy_fast_logmolar_coupling/output_transient_state_audit/**
          retention-days: 30
