name: Issue652 G6B case-lane contract P0 (branch-only)
on:
  push:
    branches: [issue-652-g6b-parallel-417-941-20261123]
    paths:
      - .github/workflows/issue652-g6b-case-tests-once.yml
permissions:
  contents: read
jobs:
  case-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assert exact candidate HEAD
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install P0 pytest only
        run: python3 -m pip install --disable-pip-version-check 'pytest>=8,<9'
      - name: Execute public case-isolation and 100-row tests
        run: |
          python3 -m pytest -q \
            tests/test_issue652_g6b_parallel_cases.py \
            tests/test_issue652_poisson_g6b_publicd100.py
          python3 -m py_compile \
            ci/guards/issue652_g6_runtime_gate.py \
            ci/guards/issue652_g6b_parallel_evidence.py
          echo G6B_CASE_LANES_P0_PASS_NO_NATIVE_NO_SECRETS
