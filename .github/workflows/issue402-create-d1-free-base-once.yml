name: Issue402 materialize canonical D base without retired debug
on:
  push:
    branches: [issue-402-species-functor-naming]
    paths: [.github/workflows/issue402-create-d1-free-base-once.yml]
permissions:
  contents: write
jobs:
  freeze-canonical-d-base:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Freeze source-proven canonical D base once (historical B/C immutable)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, importlib.util, io, json, pathlib, tarfile
          root=pathlib.Path.cwd()
          archive=root/"experiments/Issue493_s6_boltzmann/public_p2_decks.tar.xz.b64"
          compressed=base64.b64decode(archive.read_text(),validate=False)
          assert hashlib.sha256(compressed).hexdigest()=="9e801cc6dca3860750b7b97fb6ceca8e6060a3c894dd616cbaf688f529fea240"
          with tarfile.open(fileobj=io.BytesIO(compressed),mode="r:xz") as tf:
              content={x.name:tf.extractfile(x).read() for x in tf.getmembers() if x.isfile()}
          manifest=json.loads(content["manifest.json"])
          baselines=[]
          for case in ("417","941"):
              record=manifest["cases"][case]
              basename=record["input_order"][0]
              key=f"S6-{case}-407-2069-H25/C/{basename}"
              source=content[key]
              assert hashlib.sha256(source).hexdigest()==record["files_sha256"]["C"][basename]
              baselines.append((basename,source))
          assert baselines[0]==baselines[1], "S6 417/941 base identity differs; separate canonical bases required"
          basename,source=baselines[0]
          path=root/"experiments/Issue402_plasma_dsl_g1/chemistry/prepare_s6_run_input.py"
          spec=importlib.util.spec_from_file_location("s6_build_clean_native_base_once",path)
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          updated,provenance=mod.suspend_staged_retired_d1_observations({
              pathlib.Path(basename):source.decode("utf-8")})
          assert provenance["status"]=="OBSOLETE_D1_DEBUG_OBSERVATIONS_RETIRED"
          assert provenance["suspended_auxkernels"]==14
          assert provenance["suspended_auxvariables"]==14
          candidate=updated[pathlib.Path(basename)]
          assert candidate.count("PhysicsLowerDSurfaceCurrentProbeAux")==0
          assert candidate.count("PhysicsWaferD1GeometryProbeAux")==0
          assert "type = PhysicsLowerDSurfaceCurrent" in candidate
          assert "type = PhysicsElectronTransportLookupMaterial" in candidate
          assert len(candidate)<70000
          output=root/"experiments/Issue402_plasma_dsl_g1/native/s6_c0_physics_base_no_d1.i"
          output.parent.mkdir(parents=True,exist_ok=True)
          assert not output.exists(), "This is a ONE-TIME source fixture, do not silently regenerate"
          output.write_text(candidate,encoding="utf-8")
          print("CANONICAL_D_BASE_SOURCE_SHA256="+hashlib.sha256(source).hexdigest())
          print("CANONICAL_D_BASE_TARGET_SHA256="+hashlib.sha256(output.read_bytes()).hexdigest())
          print("CANONICAL_D_BASE_SOURCE_NAME="+basename)
          print("CANONICAL_D_BASE_RETIRED_PROVENANCE="+json.dumps(provenance,sort_keys=True))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/Issue402_plasma_dsl_g1/native/s6_c0_physics_base_no_d1.i
          git commit -m "data(#402): pin D-only original S6 physics base without obsolete D1 debugging"
          git push origin HEAD:issue-402-species-functor-naming
