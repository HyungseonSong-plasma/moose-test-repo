name: Governed experiment entrypoint
run-name: Issue_${{ inputs.issue }}_experiments${{ inputs.sequence }}

on:
  workflow_dispatch:
    inputs:
      issue:
        description: 'Owning issue number'
        required: true
        type: string
      sequence:
        description: 'Issue-local experiment sequence (for example 01)'
        required: true
        type: string
      manifest:
        description: 'Path below automation/manifests/experiments/'
        required: true
        type: string
      base_sha:
        description: 'Exact 40-hex source revision to execute'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: experiment-${{ inputs.issue }}-${{ inputs.sequence }}-${{ inputs.base_sha }}
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.route.outputs.mode }}
      case_count: ${{ steps.route.outputs.case_count }}
    env:
      ISSUE: ${{ inputs.issue }}
      SEQUENCE: ${{ inputs.sequence }}
      MANIFEST_INPUT: ${{ inputs.manifest }}
      BASE_SHA: ${{ inputs.base_sha }}
      OPERATION_SHA: 8d3ea7720549148a251a9e11f5733d543344fb2e
    steps:
      - name: Checkout exact consumer control
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_sha }}
          path: control
          fetch-depth: 1

      - name: Checkout exact operation source
        uses: actions/checkout@v4
        with:
          repository: HyungseonSong-plasma/chatgpt-operation
          ref: ${{ env.OPERATION_SHA }}
          path: operation
          fetch-depth: 1

      - name: Validate dispatch and classify manifest
        id: route
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ISSUE" =~ ^[1-9][0-9]*$ ]]
          [[ "$SEQUENCE" =~ ^[0-9]+$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MANIFEST_INPUT" =~ ^automation/manifests/experiments/[A-Za-z0-9_.-]+\.json$ ]]
          test "$(git -C control rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C operation rev-parse HEAD)" = "$OPERATION_SHA"
          python3 control/ci/guards/workflow_surface_guard.py --check --root control
          PYTHONPATH=operation/src python3 -m chatgpt_operation.cli matrix route \
            --manifest "control/$MANIFEST_INPUT" \
            --github-output "$GITHUB_OUTPUT"

  execute:
    needs: route
    if: needs.route.outputs.mode == 'serial'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ISSUE: ${{ inputs.issue }}
      SEQUENCE: ${{ inputs.sequence }}
      MANIFEST_INPUT: ${{ inputs.manifest }}
      BASE_SHA: ${{ inputs.base_sha }}
    steps:
      - name: Checkout exact experiment source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_sha }}
          path: target
          fetch-depth: 1

      - name: Execute central governed serial experiment
        uses: HyungseonSong-plasma/chatgpt-operation/.github/actions/governed-work@8d3ea7720549148a251a9e11f5733d543344fb2e
        with:
          kind: experiments
          manifest: ${{ github.workspace }}/target/${{ inputs.manifest }}
          control-root: ${{ github.workspace }}/target
          workspace: ${{ github.workspace }}/target
          base-sha: ${{ inputs.base_sha }}
          issue: ${{ inputs.issue }}
          sequence: ${{ inputs.sequence }}
          results: ${{ github.workspace }}/workflow-results

      - name: Upload governed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Issue_${{ inputs.issue }}_experiments${{ inputs.sequence }}-evidence
          path: workflow-results/**
          if-no-files-found: warn
          retention-days: 30

  matrix-execute:
    needs: route
    if: needs.route.outputs.mode == 'matrix'
    uses: HyungseonSong-plasma/chatgpt-operation/.github/workflows/governed-matrix.yml@8d3ea7720549148a251a9e11f5733d543344fb2e
    with:
      issue: ${{ inputs.issue }}
      sequence: ${{ inputs.sequence }}
      manifest: ${{ inputs.manifest }}
      base_sha: ${{ inputs.base_sha }}
      operation_sha: 8d3ea7720549148a251a9e11f5733d543344fb2e
