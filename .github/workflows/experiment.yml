name: Governed experiment entrypoint
run-name: Issue_\${{ inputs.issue }}_experiments\${{ inputs.sequence }}

on:
  workflow_dispatch:
    inputs:
      issue:
        description: 'Owning issue number'
        required: true
        type: string
      sequence:
        description: 'Issue-local experiment sequence (for example 01)'
        required: true
        type: string
      manifest:
        description: 'Path below automation/manifests/experiments/'
        required: true
        type: string
      base_sha:
        description: 'Exact 40-hex source revision to execute'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: experiment-\${{ inputs.issue }}-\${{ inputs.sequence }}-\${{ inputs.base_sha }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ISSUE: \${{ inputs.issue }}
      SEQUENCE: \${{ inputs.sequence }}
      MANIFEST_INPUT: \${{ inputs.manifest }}
      BASE_SHA: \${{ inputs.base_sha }}
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          path: control
          fetch-depth: 1

      - name: Checkout exact experiment source
        uses: actions/checkout@v4
        with:
          ref: \${{ inputs.base_sha }}
          path: target
          fetch-depth: 1

      - name: Validate execution surface and dispatch identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ISSUE" =~ ^[1-9][0-9]*$ ]]
          [[ "$SEQUENCE" =~ ^[0-9]+$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MANIFEST_INPUT" =~ ^automation/manifests/experiments/[A-Za-z0-9_.-]+\.json$ ]]
          python3 control/tools/workflow/workflow_guard.py --check --root control
          python3 control/tools/workflow/run_work.py \
            --kind experiments \
            --manifest "$GITHUB_WORKSPACE/control/$MANIFEST_INPUT" \
            --control-root "$GITHUB_WORKSPACE/control" \
            --workspace "$GITHUB_WORKSPACE/target" \
            --base-sha "$BASE_SHA" \
            --issue "$ISSUE" \
            --sequence "$SEQUENCE" \
            --results "$GITHUB_WORKSPACE/workflow-results"

      - name: Upload governed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Issue_\${{ inputs.issue }}_experiments\${{ inputs.sequence }}-evidence
          path: workflow-results/**
          if-no-files-found: warn
          retention-days: 30
