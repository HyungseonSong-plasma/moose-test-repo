name: L4 O2 ionization timestep ramp 20ns

on:
  push:
    branches:
      - prototype-fully-implicit-electron-poisson
    paths:
      - '.ci_triggers/l4-dt-ramp-ionization-20ns'

permissions:
  contents: read
  packages: read

env:
  BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008

jobs:
  ramp-20ns-compare:
    name: L4-${{ matrix.case }}
    strategy:
      fail-fast: false
      matrix:
        case: [ramp_0p1x100_0p2x50, control_0p1x200]
    runs-on: ubuntu-24.04
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4

      - name: Pull build image
        run: docker pull "$BUILD_BASE_REF"

      - name: Build and run ${{ matrix.case }}
        shell: bash
        env:
          CASE_NAME: ${{ matrix.case }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash --user 0:0 \
            -e CASE_NAME="$CASE_NAME" \
            --workdir /workspace \
            -v "$GITHUB_WORKSPACE:/workspace" \
            "$BUILD_BASE_REF" -lc '
              set -euo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory /opt/physics_vendor/moose
              git config --global --add safe.directory /opt/physics_vendor/crane
              git config --global --add safe.directory /opt/physics_vendor/squirrel
              git config --global --add safe.directory /opt/physics_vendor/zapdos
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt

              make -C physics_app -j2
              cd experiments/heavy_fast_logmolar_coupling

              python3 prepare_l4_dt_ramp_ionization_20ns_compare.py --case "$CASE_NAME"
              INPUT="full_monolithic_l4_dt_ramp_ionization_20ns_${CASE_NAME}.i"
              OUTDIR="output_l4_dt_ramp_ionization_20ns_${CASE_NAME}"

              ../../physics_app/physics-opt -i "$INPUT" --check-input

              rm -rf "$OUTDIR"
              mkdir -p "$OUTDIR"
              set +e
              /usr/bin/time \
                -f "wall_seconds=%e\nuser_seconds=%U\nsystem_seconds=%S\nmax_rss_kb=%M" \
                -o "$OUTDIR/wall_time.txt" \
                timeout --signal=TERM 320m stdbuf -oL -eL \
                ../../physics_app/physics-opt -i "$INPUT" \
                > "$OUTDIR/run.log" 2>&1
              rc=$?
              set -e

              echo "run_rc=$rc" | tee "$OUTDIR/status.txt"
              echo "case=$CASE_NAME" | tee "$OUTDIR/matrix.txt"
              cp "$INPUT" prepare_l4_dt_ramp_ionization_20ns_compare.py \
                 prepare_l4_o2_ionization_ab.py \
                 prepare_l4_feedback_density_compare.py \
                 prepare_l4_dt_compare.py \
                 prepare_full_monolithic_log_simplex_level_matrix.py \
                 prepare_full_monolithic_log_simplex.py \
                 "$OUTDIR/"
              cp *_out.csv "$OUTDIR/" 2>/dev/null || true
              cp *_out.e "$OUTDIR/" 2>/dev/null || true
              grep -E "Time Step|dt =|SNES|KSP|CONVERGED|DIVERGED|Solve Did NOT Converge|electron_n_|O2p_n_|charge_integral|potential_|mean_energy|R_ion_O2|electron_ionization|electron_sheath|ERROR" \
                "$OUTDIR/run.log" > "$OUTDIR/summary.txt" || true
              tail -n 500 "$OUTDIR/run.log" || true
              exit "$rc"
            '

      - name: Upload ${{ matrix.case }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l4-dt-ramp-ionization-20ns-${{ matrix.case }}
          path: experiments/heavy_fast_logmolar_coupling/output_l4_dt_ramp_ionization_20ns_${{ matrix.case }}/**
          retention-days: 30
