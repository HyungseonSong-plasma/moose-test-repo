name: QPX runtime producer

on:
  push:
    branches:
      - development
      - issue-165-canonical-qpx-source
    paths:
      - 'qpx_app/**'
      - 'ci/qpx-runtime-image/**'
      - '.github/workflows/qpx-runtime-producer.yml'
  workflow_dispatch:

concurrency:
  group: qpx-runtime-producer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/hyungseonsong-plasma/qpx-runtime
  BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/qpx-build-base@sha256:910d406eb3574a918290dc3621df1133569907d6e7af7884f68abe257a9a1999
  MOOSE_SHA: 9f388366ccf38b9c34542ec5561198249fde0ac9
  CRANE_SHA: ba26970cf419dcac563a20ed7079d445bc6341c3
  SQUIRREL_SHA: 16a26d504f3ee11161a86d4e3ebf3c0e5f2afbb1
  ZAPDOS_SHA: 9eceffbc46048c3760bbfa9a7f1ca681ae35af1d

jobs:
  build-publish-consume:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout canonical implementation and tests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Resolve and validate canonical source identity
        id: source
        shell: bash
        run: |
          set -euxo pipefail
          source qpx_app/dependencies.lock
          test "$MOOSE" = "$MOOSE_SHA"
          test "$CRANE" = "$CRANE_SHA"
          test "$SQUIRREL" = "$SQUIRREL_SHA"
          test "$ZAPDOS" = "$ZAPDOS_SHA"
          test "$QPX_BUILD_BASE" = "$BUILD_BASE_REF"

          git ls-files -z qpx_app \
            | sort -z \
            | xargs -0 sha256sum > /tmp/qpx-source-file-hashes.txt
          manifest="$(sha256sum /tmp/qpx-source-file-hashes.txt | awk '{print $1}')"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          echo "QPX_SOURCE_MANIFEST_SHA256=$manifest" >> "$GITHUB_ENV"
          echo "QPX_SOURCE_REPOSITORY_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"

          forbidden="$(git ls-files qpx_app | grep -E '(^|/)(qpx-opt|build/|lib/|\.libs/|\.jitcache/|\.pytest_cache/)|\.(o|lo|la|a|so)(\.|$)' || true)"
          test -z "$forbidden"
          echo QPX_CANONICAL_SOURCE_IDENTITY_PASS

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare runner disk
        shell: bash
        run: |
          set -euxo pipefail
          target_kb=$((14 * 1024 * 1024))
          free_kb() { df -Pk / | awk 'NR == 2 {print $4}'; }
          sudo apt-get clean || true
          docker system prune -af --volumes || true
          for path in /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/share/swift /usr/local/.ghcup; do
            if (( $(free_kb) >= target_kb )); then break; fi
            sudo rm -rf "$path" || true
          done
          df -h /
          test "$(free_kb)" -ge "$target_kb"

      - name: Pull accepted immutable build base
        shell: bash
        run: |
          set -euxo pipefail
          docker pull "$BUILD_BASE_REF"

      - name: Build canonical QPX source and check input
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm \
            --entrypoint /bin/bash \
            --user 0:0 \
            --workdir /workspace/qpx_app \
            -v "$PWD:/workspace" \
            "$BUILD_BASE_REF" \
            -lc '
              set -euxo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory /opt/qpx_vendor/moose
              git config --global --add safe.directory /opt/qpx_vendor/crane
              git config --global --add safe.directory /opt/qpx_vendor/squirrel
              git config --global --add safe.directory /opt/qpx_vendor/zapdos
              test "$(git rev-parse --show-toplevel)" = "/workspace"
              test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
              export MOOSE_DIR=/opt/qpx_vendor/moose
              export CRANE_DIR=/opt/qpx_vendor/crane
              export SQUIRREL_DIR=/opt/qpx_vendor/squirrel
              export ZAPDOS_DIR=/opt/qpx_vendor/zapdos
              export METHOD=opt
              test ! -e qpx-opt
              echo QPX_RUNTIME_PRODUCER_BUILD_STARTED
              make -j2
              test -x qpx-opt
              ./qpx-opt --check-input -i ci/smoke.i
              echo QPX_RUNTIME_PRODUCER_BUILD_PASS
            '

      - name: Export dependency-driven runtime closure
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf ci/qpx-runtime-image/runtime-root
          mkdir -p ci/qpx-runtime-image/runtime-root
          docker run --rm \
            --entrypoint /bin/bash \
            --user 0:0 \
            --workdir /opt/qpx \
            -v "$PWD/qpx_app:/opt/qpx:ro" \
            -v "$PWD/ci/qpx-runtime-image/collect-runtime.sh:/usr/local/bin/collect-qpx-runtime:ro" \
            -v "$PWD/ci/qpx-runtime-image/runtime-root:/runtime-root" \
            "$BUILD_BASE_REF" \
            -lc '
              set -euxo pipefail
              source /environment
              bash /usr/local/bin/collect-qpx-runtime /runtime-root
              echo QPX_RUNTIME_CLOSURE_PASS
            '

          test -x ci/qpx-runtime-image/runtime-root/opt/qpx/qpx-opt
          test -f ci/qpx-runtime-image/runtime-root/opt/qpx/ci/smoke.i
          test -r ci/qpx-runtime-image/runtime-root/opt/share/moose/data/README.md

          sudo tee ci/qpx-runtime-image/runtime-root/opt/qpx/RUNTIME_PROVENANCE.txt >/dev/null <<EOF
          REPOSITORY_SHA=${GITHUB_SHA}
          QPX_SOURCE_OWNER=moose-test-repo/qpx_app
          QPX_SOURCE_MANIFEST_SHA256=${QPX_SOURCE_MANIFEST_SHA256}
          BUILD_BASE=${BUILD_BASE_REF}
          MOOSE_SHA=${MOOSE_SHA}
          CRANE_SHA=${CRANE_SHA}
          SQUIRREL_SHA=${SQUIRREL_SHA}
          ZAPDOS_SHA=${ZAPDOS_SHA}
          SCIENTIFIC_SEMANTICS_CHANGED=false
          EOF
          cat ci/qpx-runtime-image/runtime-root/opt/qpx/RUNTIME_PROVENANCE.txt
          cat ci/qpx-runtime-image/runtime-root/opt/qpx/RUNTIME_CLOSURE.txt

      - name: Release heavy build base before final image build
        if: ${{ always() }}
        shell: bash
        run: |
          docker image rm "$BUILD_BASE_REF" || true
          docker system prune -af --volumes || true
          df -h /

      - name: Set up Docker Buildx
        if: ${{ success() }}
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build and publish immutable runtime candidate
        if: ${{ success() }}
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ci/qpx-runtime-image
          file: ci/qpx-runtime-image/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:git-${{ github.sha }}
          provenance: true
          build-args: |
            BUILD_BASE_REF=${{ env.BUILD_BASE_REF }}
            REPOSITORY_SHA=${{ github.sha }}
            QPX_SOURCE_MANIFEST_SHA256=${{ env.QPX_SOURCE_MANIFEST_SHA256 }}
            MOOSE_SHA=${{ env.MOOSE_SHA }}
            CRANE_SHA=${{ env.CRANE_SHA }}
            SQUIRREL_SHA=${{ env.SQUIRREL_SHA }}
            ZAPDOS_SHA=${{ env.ZAPDOS_SHA }}
          cache-from: type=gha,scope=qpx-runtime-final
          cache-to: type=gha,mode=max,scope=qpx-runtime-final

      - name: Pull published image by immutable digest and verify provenance
        if: ${{ success() }}
        id: image
        shell: bash
        run: |
          set -euxo pipefail
          ref="${IMAGE}@${{ steps.build.outputs.digest }}"
          docker pull "$ref"
          test "$(docker image inspect "$ref" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          test "$(docker image inspect "$ref" --format '{{ index .Config.Labels "io.qpx.source.owner" }}')" = "moose-test-repo/qpx_app"
          test "$(docker image inspect "$ref" --format '{{ index .Config.Labels "io.qpx.source.manifest-sha256" }}')" = "$QPX_SOURCE_MANIFEST_SHA256"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Run published runtime check-input smoke
        if: ${{ success() }}
        shell: bash
        run: docker run --rm "${{ steps.image.outputs.ref }}" --check-input -i /opt/qpx/ci/smoke.i

      - name: Run published bounded real QPX smoke
        if: ${{ success() }}
        shell: bash
        run: docker run --rm "${{ steps.image.outputs.ref }}" -i /opt/qpx/ci/smoke.i

      - name: Record runtime producer evidence
        if: ${{ success() }}
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/qpx-runtime-evidence
          cat > /tmp/qpx-runtime-evidence/runtime-producer.txt <<EOF
          CANONICAL_QPX_SOURCE_OWNER=moose-test-repo/qpx_app
          IMPLEMENTATION_AND_TEST_REVISION_SHARED=true
          REPOSITORY_SHA=${GITHUB_SHA}
          QPX_SOURCE_MANIFEST_SHA256=${QPX_SOURCE_MANIFEST_SHA256}
          BUILD_BASE=${BUILD_BASE_REF}
          RUNTIME_IMAGE=${{ steps.image.outputs.ref }}
          QPX_RUNTIME_IMAGE_PUBLISHED_BY_DIGEST=PASS
          QPX_RUNTIME_PROVENANCE_INCLUDES_REPOSITORY_SHA=PASS
          QPX_CHECK_INPUT_SMOKE=PASS
          BOUNDED_REAL_QPX_RUN=PASS
          EXTERNAL_COMPAT_PATCH_TRANSPORT_REQUIRED=false
          SCIENTIFIC_SEMANTICS_CHANGED=false
          EOF
          cat /tmp/qpx-runtime-evidence/runtime-producer.txt

      - name: Upload runtime producer evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qpx-runtime-producer-evidence
          path: /tmp/qpx-runtime-evidence/runtime-producer.txt
