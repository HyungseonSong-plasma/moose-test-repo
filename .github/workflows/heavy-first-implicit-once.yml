name: heavy first implicit once

on:
  push:
    branches: [ prototype-fully-implicit-electron-poisson ]
    paths:
      - 'experiments/heavy_fast_logmolar_coupling/prepare_heavy_first_once.py'
      - 'experiments/heavy_fast_logmolar_coupling/prepare_fast_child.py'
      - 'experiments/heavy_fast_logmolar_coupling/prepare_heavy_parent.py'
      - '.github/workflows/heavy-first-implicit-once.yml'
      - 'experiments/Issue91_real_qvt_r3/r3_e0/heavy_base.i'
      - 'experiments/implicit_logmolar_surface_loss/input_10step.i'
      - 'physics_app/**'
  workflow_dispatch:

jobs:
  heavy-first-implicit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        case: [full_joule, no_joule, lagged_joule]
    env:
      BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
      CASE: ${{ matrix.case }}
    steps:
      - uses: actions/checkout@v4
      - run: docker pull "$BUILD_BASE_REF"
      - name: Advance heavy 1 ns then solve fixed-heavy implicit plasma
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace -v "$GITHUB_WORKSPACE:/workspace" \
            -e CASE="$CASE" "$BUILD_BASE_REF" -lc '
            set -euo pipefail
            source /environment
            git config --global --add safe.directory /workspace
            git config --global --add safe.directory /opt/physics_vendor/moose
            git config --global --add safe.directory /opt/physics_vendor/crane
            git config --global --add safe.directory /opt/physics_vendor/squirrel
            git config --global --add safe.directory /opt/physics_vendor/zapdos
            export MOOSE_DIR=/opt/physics_vendor/moose CRANE_DIR=/opt/physics_vendor/crane SQUIRREL_DIR=/opt/physics_vendor/squirrel ZAPDOS_DIR=/opt/physics_vendor/zapdos METHOD=opt
            make -C physics_app -j2

            cd experiments/heavy_fast_logmolar_coupling
            export STARTUP_RHO=7.009816816733094e-6
            python3 prepare_heavy_first_once.py

            python3 - <<"PY"
import os
import re
from pathlib import Path

case = os.environ["CASE"]
p = Path("fast_child.i")
text = p.read_text(encoding="utf-8")

joule = re.compile(r"\n  \[energy_joule\]\n.*?\n  \[\]\n", re.S)
match = joule.search(text)
if not match:
    raise RuntimeError("energy_joule block not found")

if case == "no_joule":
    text = text[:match.start()] + "\n" + text[match.end():]
elif case == "lagged_joule":
    block = match.group(0)
    needle = "    state_form = molar_eV\n"
    if needle not in block:
        raise RuntimeError("state_form not found in energy_joule block")
    block = block.replace(needle, needle + "    lag_one_timestep = true\n", 1)
    text = text[:match.start()] + block + text[match.end():]
elif case != "full_joule":
    raise RuntimeError(f"unknown CASE={case}")

text += "\n[Debug]\n  show_var_residual_norms = true\n[]\n"
p.write_text(text, encoding="utf-8")
print(f"prepared CASE={case}")
PY

            ../../physics_app/physics-opt -i fast_child.i --check-input
            ../../physics_app/physics-opt -i heavy_parent.i --check-input

            out="output_heavy_first_${CASE}"
            rm -rf "$out" && mkdir "$out"
            set +e
            ../../physics_app/physics-opt -i heavy_parent.i \
              "MultiApps/fast_plasma/cli_args=Executioner/dt=1e-9;Executioner/dtmin=1e-9;Executioner/dtmax=1e-9;Executioner/num_steps=1;Executioner/end_time=1e-9;Executioner/nl_abs_tol=1e-10;Executioner/nl_rel_tol=1e-9;Executioner/nl_max_its=80;Outputs/file_base=${out}/fast" \
              "Outputs/file_base=${out}/heavy" \
              > "$out/run.log" 2>&1
            rc=$?
            set -e

            echo "case=${CASE}" | tee "$out/status.txt"
            echo "run_rc=$rc" | tee -a "$out/status.txt"
            cp heavy_parent.i fast_child.i "$out/"
            grep -E "Time Step|Solve Converged|Solve Did NOT Converge|SNES Function norm|log_ne|log_energy|potential|O2p_migration|positive_ion|n_O2p|phi_max|phi_min|charge_|mean_energy|rho_snapshot_rel_error|ERROR|DIVERGED|CONVERGED" \
              "$out/run.log" > "$out/summary.txt" || true
            tail -n 900 "$out/summary.txt" || true
            exit $rc
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heavy-first-implicit-${{ matrix.case }}
          path: experiments/heavy_fast_logmolar_coupling/output_heavy_first_${{ matrix.case }}/**
          retention-days: 30
