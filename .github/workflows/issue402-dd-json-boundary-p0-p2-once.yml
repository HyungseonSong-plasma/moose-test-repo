# Bounded branch-specific source-bound Native P0/P1/P2 only.
# Exact FEM BC parameter migration: grouped multi-sideset mapping final validation. No P3; SCIENCE_HOLD.
name: Issue402 DD JSON plasma boundary P0 P1 P2 once
run-name: Issue402 DD JSON plasma boundary exact ${{ github.sha }}
on:
  push:
    branches: [issue-402-dd-plasma-boundary-action]
    paths: [.github/workflows/issue402-dd-json-boundary-p0-p2-once.yml]
permissions:
  contents: read
jobs:
  dd-json-plasma-boundary:
    name: Native DD JSON boundary owner P0-P2
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OCI: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Exact source and physical-law owner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f physics_app/src/physics/plasma/Chemistry.C
          test ! -e physics_app/src/physics/plasma/PlasmaDriftDiffusionBoundaryAction.C
          grep -Fq "driftDiffusionBoundaries()" physics_app/src/physics/plasma/Chemistry.C
          test -f physics_app/src/bcs/FEMElectronSheathBC.C
          test -f physics_app/src/bcs/FEMElectronEnergySheathBC.C
          test -f physics_app/src/materials/PhysicsElectronAdjacentSheathWallFluxMaterial.C
          echo "DD_JSON_BOUNDARY_SOURCE=$GITHUB_SHA SCIENCE_HOLD P3_NOT_RUN"
      - name: P0 JSON boundary catalogue and existing Physics source contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet 'pytest>=8,<9'
          python3 -m pytest -q \
            tests/test_issue402_dd_plasma_boundary_json.py \
            tests/test_issue402_sccm_inlet_cpp.py \
            tests/test_issue402_species_initial_composition.py \
            tests/test_issue402_species_live_ic_inlet.py \
            2>&1 | tee /tmp/issue402_dd_json_boundary_p0.log
          echo DD_JSON_BOUNDARY_P0_PASS
      - name: Native P1 Physics application build (immutable Physics vendor image)
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$OCI"
          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace \
            -v "$PWD:/workspace" "$OCI" -lc '
              set -euo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt
              make -C physics_app -j2 app_non_unity_dirs="%/utils"
              test -x physics_app/physics-opt
            ' 2>&1 | tee /tmp/issue402_dd_json_boundary_p1.log
          echo DD_JSON_BOUNDARY_NATIVE_P1_PASS
      - name: Native P2 relocated JSON vs exact explicit legacy BCs and fail-closed mutations
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace \
            -v "$PWD:/workspace" "$OCI" -lc '
              set -euo pipefail
              source /environment
              cd /workspace/physics_app/ci
              /workspace/physics_app/physics-opt --check-input -i dd_plasma_boundary_json_p2.i
              /workspace/physics_app/physics-opt --check-input -i dd_plasma_boundary_legacy_p2.i
              cd /workspace
              python3 physics_app/ci/check_issue402_dd_json_plasma_boundary_p2.py \
                /workspace/physics_app/physics-opt
            ' 2>&1 | tee /tmp/issue402_dd_json_boundary_p2.log
          echo DD_JSON_BOUNDARY_NATIVE_P2_PASS_P3_NOT_RUN
      - name: Publish exact-source P0 P1 P2 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue402-dd-json-boundary-${{ github.sha }}
          path: |
            /tmp/issue402_dd_json_boundary_p0.log
            /tmp/issue402_dd_json_boundary_p1.log
            /tmp/issue402_dd_json_boundary_p2.log
          if-no-files-found: warn
          retention-days: 30
