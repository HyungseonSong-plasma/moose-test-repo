name: Poisson Parabolic Profile Probe

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: poisson-parabolic-profile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  parabolic-profile:
    if: github.event_name == 'pull_request' && github.head_ref == 'issue-359-qualified-gummel-icp'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      POISSON_DIR: experiments/2d-icp-poisson-experiment
      BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build exact-head Physics runtime
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          docker pull "$BUILD_BASE_REF"
          docker run --rm \
            --entrypoint /bin/bash \
            --user 0:0 \
            --workdir /workspace \
            -v "$PWD:/workspace" \
            "$BUILD_BASE_REF" \
            -lc '
              set -euxo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory /opt/physics_vendor/moose
              git config --global --add safe.directory /opt/physics_vendor/crane
              git config --global --add safe.directory /opt/physics_vendor/squirrel
              git config --global --add safe.directory /opt/physics_vendor/zapdos
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt
              make -C /workspace/physics_app -j2
              chmod -R a+rwX /workspace/physics_app
            '
          test -x physics_app/physics-opt

      - name: Run parabolic manufactured-potential probe
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .ci-poisson-parabolic-profile
          mkdir -p .ci-poisson-parabolic-profile
          cp "$POISSON_DIR/rz_parabolic_profile_probe.i" .ci-poisson-parabolic-profile/input.i
          cp "$POISSON_DIR/qvt.msh" .ci-poisson-parabolic-profile/qvt.msh

          docker run --rm \
            --entrypoint /bin/bash \
            --user "$(id -u):$(id -g)" \
            --workdir /workspace/.ci-poisson-parabolic-profile \
            -v "$PWD:/workspace" \
            "$BUILD_BASE_REF" \
            -lc '
              set -euxo pipefail
              source /environment
              /workspace/physics_app/physics-opt --check-input -i input.i
              /workspace/physics_app/physics-opt -i input.i > runtime.log 2>&1
            '

      - name: Verify axis-high wall-low morphology
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import csv, json, math

          root = Path('.ci-poisson-parabolic-profile')
          files = sorted(root.glob('rz_parabolic_profile_probe_final_profile_*.csv'))
          if not files:
              raise SystemExit('missing parabolic profile CSV')
          with files[-1].open(newline='') as handle:
              rows = list(csv.DictReader(handle))
          if not rows:
              raise SystemExit('empty parabolic profile CSV')

          R = 0.243
          phi0 = 1000.0
          values = []
          for row in rows:
              x = float(row['x'])
              y = float(row['y'])
              phi = float(row['phi_probe'])
              exact = phi0 * (1.0 - x*x/(R*R))
              values.append((x, y, phi, exact, phi-exact, int(row['id'])))

          numerical = [v[2] for v in values]
          exacts = [v[3] for v in values]
          errors = [v[4] for v in values]
          exact_span = max(exacts) - min(exacts)
          linf = max(abs(e) for e in errors)
          rms = math.sqrt(sum(e*e for e in errors)/len(errors))

          mean_n = sum(numerical)/len(numerical)
          mean_e = sum(exacts)/len(exacts)
          cov = sum((n-mean_n)*(e-mean_e) for n,e in zip(numerical, exacts))
          var_n = sum((n-mean_n)**2 for n in numerical)
          var_e = sum((e-mean_e)**2 for e in exacts)
          corr = cov / math.sqrt(var_n*var_e)

          max_i = max(range(len(values)), key=lambda i: values[i][2])
          min_i = min(range(len(values)), key=lambda i: values[i][2])

          xs = sorted(v[0] for v in values)
          x10 = xs[max(0, int(0.10*len(xs))-1)]
          x90 = xs[min(len(xs)-1, int(0.90*len(xs)))]
          inner = [v[2] for v in values if v[0] <= x10]
          outer = [v[2] for v in values if v[0] >= x90]
          inner_mean = sum(inner)/len(inner)
          outer_mean = sum(outer)/len(outer)

          result = {
              'manufactured_solution': 'phi=1000*(1-r^2/R^2)',
              'R_m': R,
              'phi0_V': phi0,
              'forcing': 4.0*phi0/(R*R),
              'cells': len(values),
              'phi_numerical_min_V': min(numerical),
              'phi_numerical_max_V': max(numerical),
              'phi_exact_min_V': min(exacts),
              'phi_exact_max_V': max(exacts),
              'phi_linf_V': linf,
              'phi_rms_V': rms,
              'phi_linf_over_exact_span': linf/max(exact_span, 1e-300),
              'phi_correlation': corr,
              'numerical_max_location': {
                  'id': values[max_i][5], 'r_m': values[max_i][0], 'z_m': values[max_i][1], 'phi_V': values[max_i][2]
              },
              'numerical_min_location': {
                  'id': values[min_i][5], 'r_m': values[min_i][0], 'z_m': values[min_i][1], 'phi_V': values[min_i][2]
              },
              'inner_10pct_radial_mean_phi_V': inner_mean,
              'outer_10pct_radial_mean_phi_V': outer_mean,
              'inner_to_outer_drop_V': inner_mean - outer_mean,
          }

          if result['phi_linf_over_exact_span'] > 5.0e-3:
              raise SystemExit(f"parabolic profile error too large: {result['phi_linf_over_exact_span']}")
          if result['phi_correlation'] < 0.99999:
              raise SystemExit(f"parabolic morphology correlation too low: {result['phi_correlation']}")
          if not (inner_mean > outer_mean):
              raise SystemExit('axis-side potential is not larger than outer-wall-side potential')
          if not (values[max_i][0] < values[min_i][0]):
              raise SystemExit('potential maximum is not radially inward of minimum')

          out = root / 'parabolic_profile_result.json'
          out.write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          PY

      - name: Upload parabolic-profile evidence
        uses: actions/upload-artifact@v4
        with:
          name: poisson-parabolic-profile-probe
          path: |
            .ci-poisson-parabolic-profile/input.i
            .ci-poisson-parabolic-profile/runtime.log
            .ci-poisson-parabolic-profile/parabolic_profile_result.json
            .ci-poisson-parabolic-profile/rz_parabolic_profile_probe.e
            .ci-poisson-parabolic-profile/rz_parabolic_profile_probe_final_profile_*.csv
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
