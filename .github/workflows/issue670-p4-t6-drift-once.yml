name: Issue670 P4-T6 FV drift policy, wall exclusion and 11-layer readback P0
on:
  push:
    branches: [issue-670-p4-t6-drift-input-20261118]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 395eeac274125ffa632b4d75a4531996dee24fe0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: issue669-p3x-newonly-10-electron-owner-source-417-941
          run-id: 44257739203
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: evidence
      - name: P4-T6 raw bytes and FV drift policy verification
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 395eeac274125ffa632b4d75a4531996dee24fe0
          python3 - <<'PY'
          import copy,hashlib,json,math,re
          from pathlib import Path
          CURRENT="395eeac274125ffa632b4d75a4531996dee24fe0"
          PIN="9c15a4f0e2cf8042cb0d4b2f18af31511021d168"
          STAGE=Path("evidence/cases")
          SRC=Path("experiments/Issue402_plasma_dsl_g1")
          JHASH={"417":"ed99493d992c71b30e7a4120646af388894032d262b9af5bf299522629fe24ef",
                 "941":"2a7d6b191eddf6a92a6bcf74fc818ade8f30836fdd857dc70516f3aa57fa5dde"}
          OHASH={"417":"c89a01124fb96aa760b6753383eaa79ec6ae07d715d53910754dfe22afff6c8d",
                 "941":"76f52e0aa5e25bb094ca1946f5cb820ccbf5e64c1abc54fb4f1f5e45b23eacac"}
          IONS={"O2p":{"q":1,"native":"ni_drift","oldvar":"log_ni","oldmob":"ion_mobility"},
                "Om":{"q":-1,"native":"nm_drift","oldvar":"log_nm","oldmob":"negative_ion_mobility"},
                "Op":{"q":1,"native":"nop_drift","oldvar":"log_nop","oldmob":"atomic_positive_ion_mobility"}}
          REGIONS={"inlet outlet":"FVFunctorNeumannBC",
                   "plasma_electrode plasma_metal plasma_right":"FVFunctorNeumannBC",
                   "plasma_cover":"FVLogMolarDielectricFluxBC",
                   "plasma_wafer":"FVLogMolarDielectricFluxBC",
                   "plasma_focus_ring":"FVLogMolarDielectricFluxBC"}
          SIDES=sorted({side for group in REGIONS for side in group.split()})
          def sha(b):return hashlib.sha256(b).hexdigest()
          def require(ok,label):
              if not ok:raise ValueError(label)
          def no_duplicate(pairs):
              d={}
              for k,v in pairs:
                  require(k not in d,"DUPLICATE_JSON_KEY:"+k);d[k]=v
              return d
          def load(b):return json.loads(b.decode("utf-8"),object_pairs_hook=no_duplicate)
          def parse(data,filename,ordinal,sect="FVKernels"):
              data.decode("utf-8")
              items=[];stack=[];offset=0
              for line_no,line in enumerate(data.splitlines(keepends=True),1):
                  m=re.fullmatch(rb"\[([^\[\]]*)\]",line.strip())
                  if m:
                      name=m.group(1).decode()
                      if name:stack.append((name,offset,line_no))
                      elif stack:
                          name,start,first=stack.pop()
                          if len(stack)==1 and stack[0][0]==sect:
                              raw=data[start:offset+len(line)]
                              pars={}
                              for text in raw.decode().splitlines()[1:-1]:
                                  m2=re.fullmatch(r"\s*([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*?)\s*",text)
                                  if m2:
                                      require(m2.group(1) not in pars,"DUPLICATE_PARAM:"+name)
                                      pars[m2.group(1)]=m2.group(2).strip().strip("'\"")
                              items.append({"section":sect,"name":name,"filename":filename,
                                  "layer":ordinal,"line_start":first,"line_end":line_no,
                                  "block_sha256":sha(raw),"parameters":pars})
                  offset+=len(line)
              require(not stack,"UNBALANCED_INPUT:"+filename)
              return items
          def assert_policy(j,overlay):
              require(set(j["drift_diffusion_boundaries"])==set(REGIONS),"BOUNDARY_GROUPS_NOT_HISTORIC")
              require("boundaries_to_avoid" not in j,"JSON_BOUNDARIES_OVERRIDE")
              require("migration_smoothing_width" not in j,"JSON_SMOOTHING_OVERRIDE")
              for group,factory in REGIONS.items():
                  region=j["drift_diffusion_boundaries"][group]
                  for ion,s in IONS.items():
                      bc=ion+"_wall" if factory=="FVFunctorNeumannBC" else ion+"_"+group[len("plasma_"):]+"_dielectric"
                      require(region.get(bc)=={"type":factory},
                              "MISSING_OR_WRONG_ION_WALL_BC:"+group+":"+bc)
              for ion,s in IONS.items():
                  require(j["species"][ion]["charge_number"]==s["q"],"ION_CHARGE_CHANGED:"+ion)
                  require(j["species"][ion]["transport_coef"]["type"]=="constant","ION_MOBILITY_NOT_CONSTANT:"+ion)
              require(overlay.count("fvm_species = 'O2p Om Op'")==1,"ION_SELECTOR_CHANGED")
              require(overlay.count("fem_potential = potential")==2,"ION_POTENTIAL_CHANGED")
              require(overlay.count("migration_smoothing_width = 0.001")==1,"SMOOTHING_WIDTH_CHANGED")
              require(overlay.count("wall_gradient = adjacent_element")==1,"WALL_GRADIENT_CHANGED")
              require("boundaries_to_avoid" not in overlay,"MOOSE_STATIC_BOUNDARY_OVERRIDE")
              require("dont_create_kernels" not in overlay,"KERNEL_GENERATION_DISABLED")
              return {ion:SIDES for ion in IONS}
          # Separate C++ drift gradient from Wall Material gradient/smoothing:
          # the latter are not drift Kernel parameters.
          dd=Path("physics_app/src/physics/plasma/DDContinuityEq.C").read_text()
          chem=Path("physics_app/src/physics/plasma/Chemistry.C").read_text()
          for token in (
            'const std::string drift_type = "FVLogMolarElectrostaticDrift";',
            'drift_params.set<MooseEnum>("advected_interp_method") = "upwind";',
            'drift_params.set<bool>("use_element_gradient_for_potential") = true;',
            'drift_params.set<MooseFunctorName>("carrier") = "carrier_one";',
            'drift_params.set<MooseFunctorName>("potential") = potential;',
            'drift_params.set<MooseFunctorName>("mobility") = id + "_mobility";',
            'drift_params.set<Real>("charge_number") = mechanism.species(id).charge_number;',
            'bc.variable == variable',
            'bc.type == "FVFunctorNeumannBC"',
            'bc.type == "FVLogMolarDielectricFluxBC"',
            'wall_sidesets.insert(boundary.mesh_boundaries.begin(),',
            'drift_params.set<std::vector<BoundaryName>>("boundaries_to_avoid") =',
            'getProblem().addFVKernel(drift_type, id + "_drift", drift_params);',
            'if (!std::isfinite(smoothing) || smoothing < 0.0)'
          ): require(token in dd,"CXX_DRIFT_CONTRACT:"+token)
          for token in (
            'params.set<Real>("migration_gate_smoothing_width") =',
            'continuity.front()->getParam<Real>("migration_smoothing_width");',
            'params.set<bool>("use_element_gradient_for_potential") =',
            'getParam<MooseEnum>("wall_gradient") == "adjacent_element";',
            'if (root.is_object() && root.contains("boundaries_to_avoid"))',
            'fail(file, "boundaries_to_avoid is derived from JSON boundaries; remove the duplicate field")'
          ):require(token in chem,"CXX_WALL_CONTRACT:"+token)
          orig=(SRC/"native/s6_c0_physics_base_no_d1.i").read_bytes()
          historical=parse(orig,"s6_c0_physics_base_no_d1.i",1)
          origDrift={}
          for ion,s in IONS.items():
              matches=[x for x in historical if x["name"]==s["native"]]
              require(len(matches)==1,"HISTORICAL_DRIFT_OWNER_COUNT:"+ion)
              obj=matches[0];params=obj["parameters"]
              for key,want in {"type":"PhysicsFVLogMolarElectrostaticDrift","variable":s["oldvar"],
                         "potential":"potential","mobility":s["oldmob"],
                         "carrier":"carrier_one","charge_number":str(s["q"]),
                         "advected_interp_method":"upwind",
                         "use_element_gradient_for_potential":"true"}.items():
                  require(params.get(key)==want,"HISTORICAL_DRIFT_PARAM:"+ion+":"+key)
              require(sorted(params["boundaries_to_avoid"].split())==SIDES,"HISTORICAL_DRIFT_SIDES:"+ion)
              origDrift[ion]={k:v for k,v in obj.items() if k!="parameters"}|{"parameters":params}
          cases={}
          for case in ("417","941"):
              base=STAGE/case
              folder=base/"experiments/Issue395_powered_chemistry_ladder"
              receipt=load((base/"newonly_stage_receipt.json").read_bytes())
              require(receipt["source_head"]==PIN and str(receipt["variant"])==case,"P3X_PIN_MISMATCH:"+case)
              require(receipt["status"]=="P2_NEWONLY_JSON_AND_LAYER11_STAGE_STATIC_PASS_RUNTIME_HOLD",
                      "P3X_STAGE_UNACCEPTED:"+case)
              require(receipt["retired_native_ion_owners"]==26 and
                      receipt["remaining_native_ion_fv_owners"]==0,"P3X_ION_RETIREMENT_MISSING:"+case)
              require(receipt["p3_x_electron"]["removed_native_electron_owners"]==10,
                      "P3X_ELECTRON_RETIREMENT_MISSING:"+case)
              stagehash=receipt["layers_after_sha256"]
              require(len(stagehash)==11 and len(set(stagehash))==11,"STAGE_LAYER_COUNT_INVALID:"+case)
              allobjects=[];layers=[]
              for i,(fname,digest) in enumerate(stagehash.items(),1):
                  f=folder/fname
                  require(f.name==fname and f.is_file() and not f.is_symlink(),"STAGE_FILE_MISSING:"+case+fname)
                  raw=f.read_bytes()
                  require(0<len(raw)<200000 and sha(raw)==digest,"STAGE_FILE_SHA_WRONG:"+case+fname)
                  layers.append({"ordinal":i,"filename":fname,"sha256":digest,"size_bytes":len(raw)})
                  allobjects.extend(parse(raw,fname,i))
              newjson=SRC/"chemistry"/("unified_s6_"+case+"_newonly.json")
              overlay=SRC/("issue633_newonly_s6_"+case+"_continuity.template.i")
              require(sha(newjson.read_bytes())==JHASH[case],"CURRENT_JSON_CHANGED:"+case)
              require(sha(overlay.read_bytes())==OHASH[case],"CURRENT_OVERLAY_CHANGED:"+case)
              require(sha((folder/"chemistry"/newjson.name).read_bytes())==JHASH[case],"STAGED_JSON_CHANGED:"+case)
              require(sha((folder/"migrated_continuity.i").read_bytes())==OHASH[case],"STAGED_OVERLAY_CHANGED:"+case)
              j=load(newjson.read_bytes())
              compiled=assert_policy(j,overlay.read_text())
              oldnames={s["native"] for s in IONS.values()}
              active=[x for x in allobjects if x["name"] in oldnames or
                      (x["parameters"].get("variable") in {"log_O2p","log_Om","log_Op"} and
                       "Drift" in x["parameters"].get("type",""))]
              require(len(active)==0,"OLD_NATIVE_DRIFT_NOT_RETIRED:"+case)
              cases[case]={"status":"SOURCE_AND_P3X_STAGE_STATIC_DRIFT_POLICY_PASS",
                           "file_sha256_checks":len(layers),"layers":layers,
                           "actual_native_drift_owner_count":len(active),
                           "expected_generated_drift_names":[s+"_drift" for s in IONS],
                           "expected_generated_drift_variables":["log_"+s for s in IONS],
                           "upwind":True,"use_element_gradient_for_potential":True,
                           "wall_migration_smoothing_width_V_per_m":0.001,
                           "smoothing_applies_to":"Ion Wall Flux Material, NOT interior FV Drift kernel",
                           "wall_gradient":"adjacent_element",
                           "boundaries_to_avoid_per_species":compiled,
                           "expected_number_unique_sidesets":len(SIDES),
                           "newonly_json_sha256":JHASH[case],"newonly_overlay_sha256":OHASH[case],
                           "generated_fv_warehouse":"NOT_RUN"}
              print("P4_T6_"+case+f"_INPUT_SHA=11/11 ION_DRIFT_NATIVE=0 WALL_SIDES={len(SIDES)}",flush=True)
          negatives={}
          j=load((SRC/"chemistry/unified_s6_417_newonly.json").read_bytes())
          template=(SRC/"issue633_newonly_s6_417_continuity.template.i").read_text()
          def reject(name,json_data,overlay_data):
              try:assert_policy(json_data,overlay_data)
              except ValueError:negatives[name]="REJECTED"
              else:raise ValueError("NEGATIVE_FALSE_PASS:"+name)
          bad=copy.deepcopy(j);bad["species"]["Om"]["charge_number"]=1
          reject("charge_sign",bad,template)
          bad=copy.deepcopy(j);del bad["drift_diffusion_boundaries"]["plasma_focus_ring"]["Om_focus_ring_dielectric"]
          reject("wall_missing",bad,template)
          bad=copy.deepcopy(j);bad["drift_diffusion_boundaries"]["plasma_cover"]["Op_cover_dielectric"]["type"]="NotIonBC"
          reject("wall_factory",bad,template)
          bad=copy.deepcopy(j);bad["drift_diffusion_boundaries"]["plasma_new_wall"]={"O2p_wall":{"type":"FVFunctorNeumannBC"}}
          reject("unexpected_boundary_group",bad,template)
          bad=copy.deepcopy(j);bad["boundaries_to_avoid"]=["plasma_cover"]
          reject("duplicate_json_boundary_policy",bad,template)
          bad=copy.deepcopy(j);bad["migration_smoothing_width"]=0.001
          reject("duplicate_json_smoothing_policy",bad,template)
          reject("upwind_not_in_overlay",j,template.replace("fvm_species = 'O2p Om Op'","fvm_species = 'O2p Op'"))
          reject("wrong_migration_smoothing",j,template.replace("migration_smoothing_width = 0.001","migration_smoothing_width = -0.1"))
          reject("wrong_wall_gradient",j,template.replace("wall_gradient = adjacent_element","wall_gradient = face"))
          reject("wrong_potential",j,template.replace("fem_potential = potential","fem_potential = wrong"))
          reject("disabled_kernel_generation",j,template+"\ndont_create_kernels = true")
          require(len(negatives)==11,"WRONG_NEGATIVE_COUNT")
          result={"schema":"issue670.p4_t6.fv_drift_source_and_stage.v1",
            "task_id":"P4-T6","source_head":CURRENT,"production_stage_origin_head":PIN,
            "source_stage_run":44257739203,"source_stage_artifact_id":14406746397,
            "status":"PASS_SOURCE_AND_P3X_STAGE_STATIC_DRIFT_POLICY__NATIVE_HOLD",
            "native_original_C0":{"path":str(SRC/"native/s6_c0_physics_base_no_d1.i"),
              "file_sha256":sha(orig),"original_drift_objects":origDrift},
            "cases":cases,"policy_edges":[
              {"producer":"Current overlay [Continuity] migration_smoothing_width=0.001",
               "consumer":"Chemistry.C Ion Wall Flux Material migration_gate_smoothing_width",
               "scope":"wall, not FV drift"},
              {"producer":"Current overlay root wall_gradient=adjacent_element",
               "consumer":"Chemistry.C Ion Wall Flux Material use_element_gradient_for_potential"},
              {"producer":"JSON typed boundaries grouped by mesh sideset",
               "consumer":"DDContinuityEq FV drift boundaries_to_avoid (deduplicated sorted set)"},
              {"producer":"Ion JSON charge_number + transport",
               "consumer":"FVLogMolarElectrostaticDrift charge sign and mobility"},
              {"producer":"DDContinuityEq generated FV drift",
               "consumer":"log_O2p, log_Om, log_Op; advected_interp_method=upwind; element potential gradient=true"}],
            "negative_controls":negatives,
            "limits":["C++ factory string/typed BC rules are source checked but no MOOSE objects instantiated",
                      "P3X artifact was produced at earlier pinned source; current HEAD source bytes read separately",
                      "No native FV TheWarehouse query or dynamic wall residual/gradient measurements",
                      "P4-X single-writer/source integration and P5 Native P2 remain separate gates"],
            "native_p2":"NOT_RUN","native_p3":"NOT_RUN","native_p4":"NOT_RUN","science":"SCIENCE_HOLD"}
          out=Path("t6-receipt");out.mkdir(exist_ok=True)
          (out/"p4-t6-drift-policy.json").write_text(json.dumps(result,sort_keys=True,indent=2)+"\n")
          print("P4_T6_NEGATIVES=11/11_REJECTED",flush=True)
          print("P4_T6_FINAL=PASS_SOURCE_AND_P3X_STAGE_STATIC_DRIFT_POLICY__NATIVE_HOLD",flush=True)
          PY
      - name: Preserve P4-T6 independent report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue670-p4-t6-${{ github.run_id }}-${{ github.run_attempt }}
          path: t6-receipt/
          if-no-files-found: warn
          retention-days: 30
