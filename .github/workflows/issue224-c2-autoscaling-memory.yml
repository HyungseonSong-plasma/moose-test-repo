name: Issue-224 C2 automatic-scaling setup memory discriminator

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/issue224-c2-autoscaling-memory.yml'
      - 'experiments/Issue224_autoscaling_memory/**'
  workflow_dispatch:

concurrency:
  group: issue224-c2-autoscaling-memory-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
  MOOSE_SHA: 9f388366ccf38b9c34542ec5561198249fde0ac9
  CRANE_SHA: ba26970cf419dcac563a20ed7079d445bc6341c3
  SQUIRREL_SHA: 16a26d504f3ee11161a86d4e3ebf3c0e5f2afbb1
  ZAPDOS_SHA: 9eceffbc46048c3760bbfa9a7f1ca681ae35af1d

jobs:
  autoscaling-memory:
    name: Zero-timestep production vs diagonal-only vs scaling-off
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate immutable build-base identity
        shell: bash
        run: |
          set -euxo pipefail
          source physics_app/dependencies.lock
          test "$MOOSE" = "$MOOSE_SHA"
          test "$CRANE" = "$CRANE_SHA"
          test "$SQUIRREL" = "$SQUIRREL_SHA"
          test "$ZAPDOS" = "$ZAPDOS_SHA"
          docker pull "$BUILD_BASE_REF"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.moose.sha" }}')" = "$MOOSE_SHA"

      - name: P0 autoscaling-memory discriminator self-test
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace \
            -e GITHUB_SHA="$GITHUB_SHA" \
            -v "$PWD:/workspace" "$BUILD_BASE_REF" -lc '
              source /environment
              export PYTHONPATH=/workspace
              git config --global --add safe.directory /workspace
              test "$(git -C /workspace rev-parse HEAD)" = "$GITHUB_SHA"
              uv pip install --system --python "$(command -v python3)" -r requirements-evidence-engine.txt
              python3 -m py_compile /workspace/experiments/Issue224_autoscaling_memory/run.py
              python3 /workspace/experiments/Issue224_autoscaling_memory/run.py --self-test
            '

      - name: Build exact head and execute zero-timestep memory discriminator
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf issue224-c2-autoscaling-memory-results
          mkdir -p issue224-c2-autoscaling-memory-results
          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace \
            -e GITHUB_SHA="$GITHUB_SHA" \
            -v "$PWD:/workspace" "$BUILD_BASE_REF" -lc '
              set -euxo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt
              export PYTHONPATH=/workspace
              uv pip install --system --python "$(command -v python3)" -r requirements-evidence-engine.txt
              test "$(git -C /workspace rev-parse HEAD)" = "$GITHUB_SHA"
              test ! -e physics_app/physics-opt
              make -C physics_app -j2
              test -x physics_app/physics-opt
              /usr/bin/time -v -o /workspace/issue224-c2-autoscaling-memory-results/runner_resource.txt \
                python3 /workspace/experiments/Issue224_autoscaling_memory/run.py \
                  --physics-opt /workspace/physics_app/physics-opt \
                  --results-root /workspace/issue224-c2-autoscaling-memory-results \
                  --timeout 180
            '

      - name: Verify setup-only contract and print attribution
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path('issue224-c2-autoscaling-memory-results/summary.json').read_text())
          assert s['physical_timesteps_authorized'] == 0
          assert s['decision']['full_r2_solve_executed'] is False
          for name, case in s['cases'].items():
              assert case['guards']['no_linear_solve'] is True, name
              assert case['guards']['no_physical_timestep'] is True, name
          print({
              'STATUS': s.get('status'),
              'CLASSIFICATION': s.get('decision', {}).get('classification'),
              'R1': s.get('decision', {}).get('fractions', {}).get('r1'),
              'R2': s.get('decision', {}).get('fractions', {}).get('r2'),
              'R2_COMPARISONS': s.get('decision', {}).get('comparisons', {}).get('r2'),
          })
          PY

      - name: Upload Issue-224 C2 memory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue224-c2-autoscaling-memory-evidence
          path: issue224-c2-autoscaling-memory-results/**
          if-no-files-found: error
          retention-days: 7
