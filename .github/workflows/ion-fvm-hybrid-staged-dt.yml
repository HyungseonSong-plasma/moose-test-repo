name: Ion-FVM New-only S6 source P0 (no Native or science)
# #633/P22: historical hybrid 150/200-step callers are retired from active CI.
# Source-only S6-417/941 contracts; P1/P2/solver/science NOT_RUN.
on:
  workflow_dispatch:
  pull_request:
    # Include the active integration stack for exact-head P0 checks before merge.
    branches: [main, issue-633-ion23-integration-20261117]
    paths:
      - '.github/workflows/ion-fvm-hybrid-staged-dt.yml'
      - 'experiments/Issue402_plasma_dsl_g1/chemistry/**'
      - 'experiments/Issue402_plasma_dsl_g1/issue633_newonly_s6_*'
      - 'physics_app/src/physics/plasma/**'
      - 'physics_app/src/bcs/FEMElectron*'
      - 'physics_app/src/functormaterials/IonWallFluxMaterial.C'
      - 'physics_app/src/fvbcs/FVLogMolarDielectricFluxBC.C'
      - 'ci/guards/issue633_c2_json_wiring.py'
      - 'ci/p1_ion_new_only_preflight.py'
      - 'tests/test_issue633_*.py'
      - 'tests/test_p1_ion_new_only_preflight.py'
      - 'tests/test_issue402_fem_electron_sheath_bc_retirement.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ion-fvm-hybrid-staged-dt.yml'
      - 'experiments/Issue402_plasma_dsl_g1/chemistry/**'
      - 'experiments/Issue402_plasma_dsl_g1/issue633_newonly_s6_*'
      - 'physics_app/src/physics/plasma/**'
      - 'physics_app/src/bcs/FEMElectron*'
      - 'physics_app/src/functormaterials/IonWallFluxMaterial.C'
      - 'physics_app/src/fvbcs/FVLogMolarDielectricFluxBC.C'
      - 'ci/guards/issue633_c2_json_wiring.py'
      - 'ci/p1_ion_new_only_preflight.py'
      - 'tests/test_issue633_*.py'
      - 'tests/test_p1_ion_new_only_preflight.py'
      - 'tests/test_issue402_fem_electron_sheath_bc_retirement.py'
permissions:
  contents: read
jobs:
  newonly-source-contract:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == 'HyungseonSong-plasma/moose-test-repo'
    strategy:
      fail-fast: false
      matrix:
        variant: ['417', '941']
    name: ion-FVM-newonly-S6-${{ matrix.variant }}-P0-only
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VARIANT: ${{ matrix.variant }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact active source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: P0 - pinned New-only JSON, overlay, approved BC and staging contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from copy import deepcopy
          from hashlib import sha256
          import json
          import os
          from pathlib import Path
          import sys
          case = os.environ['VARIANT']
          assert case in ('417', '941')
          root = Path.cwd()
          chem = root / 'experiments/Issue402_plasma_dsl_g1/chemistry'
          sys.path.insert(0, str(chem))
          from prepare_s6_newonly import PIN_HEAD, JSON_SHA, TEMPLATE_SHA
          from ci.guards.issue633_c2_json_wiring import validate, C2ContractError
          path = chem / f'unified_s6_{case}_newonly.json'
          overlay = chem.parent / f'issue633_newonly_s6_{case}_continuity.template.i'
          digest = lambda p: sha256(p.read_bytes()).hexdigest()
          assert digest(path) == JSON_SHA[case], 'NEWONLY_JSON_SHA_MISMATCH'
          assert digest(overlay) == TEMPLATE_SHA[case], 'NEWONLY_OVERLAY_SHA_MISMATCH'
          doc = json.loads(path.read_text())
          assert set(doc['equations']) == {'EI-02','EI-17','EI-415','EI-401','EI-407','EI-2069','H25',f'EI-{case}'}
          assert len(doc['reactions']) == 8
          assert {n:doc['species'][n]['charge_number'] for n in ('e','O2p','Om','Op')} == {'e':-1,'O2p':1,'Om':-1,'Op':1}
          counts = validate(doc)
          group = doc['drift_diffusion_boundaries']['plasma_electrode plasma_metal plasma_right']
          assert group['e_wall'] == {'type':'FEMElectronSheathBC'}
          assert group['e_energy_wall'] == {'type':'FEMElectronEnergySheathBC'}
          for name in ('FEMElectronSheathBC','FEMElectronEnergySheathBC'):
              source = (root/'physics_app/src/bcs'/f'{name}.C').read_text()
              assert source.count(f'registerMooseObject("PhysicsApp", {name});') == 1
          mutated = deepcopy(doc)
          mutated['drift_diffusion_boundaries']['plasma_electrode plasma_metal plasma_right']['e_wall']['type'] = 'PhysicsFEMLogMolarElectronGroundedSheathBC'
          try:
              validate(mutated)
          except C2ContractError:
              pass
          else:
              raise AssertionError('RETIRED_GROUNDED_BC_NOT_REJECTED')
          entry = (chem/'prepare_s6_run_input.py').read_text()
          stage = (chem/'prepare_s6_newonly.py').read_text()
          assert 'parser.add_argument("--newonly"' in entry
          assert 'from prepare_s6_newonly import prepare_newonly' in entry
          assert 'report = prepare_newonly(' in entry
          for gate in ('retire_in_disposable_scratch(', 'retire_electron_in_disposable_scratch(', 'retire_p4_duplicate_owners('):
              assert gate in stage, 'REQUIRED_STAGE_GATE_MISSING_' + gate
          deck = overlay.read_text()
          assert f"files = 'chemistry/unified_s6_{case}_newonly.json'" in deck
          assert "fvm_species = 'O2p Om Op'" in deck
          assert 'fem_species = e' in deck
          assert 'wall_gradient = adjacent_element' in deck
          receipt = {'status':'P0_SOURCE_ONLY_PASS', 'source_head':os.environ['EXPECTED_HEAD'],
                     'historical_manifest_head':PIN_HEAD, 'case':case, 'json_sha256':digest(path),
                     'overlay_sha256':digest(overlay), 'C2_static':counts,
                     'P1':'NOT_RUN','P2':'NOT_RUN','P3':'NOT_RUN','P4':'NOT_RUN','science':'SCIENCE_HOLD'}
          Path(f'ion_fvm_newonly_p0_{case}.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(f'ION_FVM_NEWONLY_S6_{case}_P0_PASS P1=NOT_RUN P2=NOT_RUN P3=NOT_RUN SCIENCE_HOLD')
          PY
      - name: P0 - focused source and negative-control tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet 'pytest>=8,<9'
          python3 -m pytest -q \
            tests/test_issue633_newonly_run_species_schema.py \
            tests/test_issue633_s6_energy_owner_cutover.py \
            tests/test_issue633_ion_wall_single_factory.py \
            tests/test_p1_ion_new_only_preflight.py \
            tests/test_issue402_fem_electron_sheath_bc_retirement.py
          echo 'ION_FVM_NEWONLY_P0_TESTS_PASS P1=NOT_RUN P2=NOT_RUN P3=NOT_RUN SCIENCE_HOLD'
      - name: Upload P0-only source receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ion-fvm-newonly-S6-${{ matrix.variant }}-P0-only
          path: ion_fvm_newonly_p0_${{ matrix.variant }}.json
          if-no-files-found: warn
          retention-days: 30
