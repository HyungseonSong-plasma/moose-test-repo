name: Issue-236 Om L nonlinear-globalization discriminator

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue236-om-l-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
  MOOSE_SHA: 9f388366ccf38b9c34542ec5561198249fde0ac9
  CRANE_SHA: ba26970cf419dcac563a20ed7079d445bc6341c3
  SQUIRREL_SHA: 16a26d504f3ee11161a86d4e3ebf3c0e5f2afbb1
  ZAPDOS_SHA: 9eceffbc46048c3760bbfa9a7f1ca681ae35af1d
  PYTHONPATH: .

jobs:
  nonlinear-discriminator:
    name: Om L0-L2 same-binary discriminator
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Require governed Issue-236 branch
        shell: bash
        run: |
          set -euxo pipefail
          test "$GITHUB_REF_NAME" = "issue-236-m1a-multiapp-smoke"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Static L qualification gate
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile experiments/Issue236_m1a_multiapp_smoke/run_om_nonlinear_ci.py
          python3 -m py_compile experiments/Issue236_m1a_multiapp_smoke/check_om_nonlinear_l.py
          python3 experiments/Issue236_m1a_multiapp_smoke/check_om_nonlinear_l.py --self-test

      - name: Verify exact provenance and pinned dependencies
        shell: bash
        run: |
          set -euxo pipefail
          source physics_app/dependencies.lock
          test "$MOOSE" = "$MOOSE_SHA"
          test "$CRANE" = "$CRANE_SHA"
          test "$SQUIRREL" = "$SQUIRREL_SHA"
          test "$ZAPDOS" = "$ZAPDOS_SHA"
          docker pull "$BUILD_BASE_REF"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.moose.sha" }}')" = "$MOOSE_SHA"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.crane.sha" }}')" = "$CRANE_SHA"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.squirrel.sha" }}')" = "$SQUIRREL_SHA"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.zapdos.sha" }}')" = "$ZAPDOS_SHA"

      - name: Build once and run L0 L1 L2 with the same executable
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf issue236-om-l-results issue236-om-l-logs issue236-om-l-qualification
          mkdir -p issue236-om-l-results issue236-om-l-logs/shared issue236-om-l-qualification

          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace \
            -e GITHUB_SHA="$GITHUB_SHA" -e GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            -e GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" -e BUILD_BASE_REF="$BUILD_BASE_REF" \
            -e MOOSE_SHA="$MOOSE_SHA" -e CRANE_SHA="$CRANE_SHA" \
            -e SQUIRREL_SHA="$SQUIRREL_SHA" -e ZAPDOS_SHA="$ZAPDOS_SHA" \
            -v "$PWD:/workspace" "$BUILD_BASE_REF" -lc '
              set -euxo pipefail
              source /environment
              export PYTHONPATH=/workspace MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos METHOD=opt
              export ISSUE236_NE_BOUNDARY_MODE=mirrors_one_term
              export ISSUE236_OM_FORENSIC=on
              export ISSUE236_OM_CASE_ID=O1
              git config --global --add safe.directory /workspace
              test "$(git -C /workspace rev-parse HEAD)" = "$GITHUB_SHA"

              uv pip install --system --python "$(command -v python3)" -r requirements-evidence-engine.txt
              make -C physics_app -j2
              test -x physics_app/physics-opt
              PHYSICS_SHA="$(sha256sum physics_app/physics-opt | awk "{print \$1}")"
              printf "%s  physics_app/physics-opt\n" "$PHYSICS_SHA" \
                | tee issue236-om-l-logs/shared/physics-opt.sha256

              printf "%s\n" \
                "{" \
                "  \"git_sha\": \"$GITHUB_SHA\"," \
                "  \"run_id\": \"$GITHUB_RUN_ID\"," \
                "  \"run_attempt\": \"$GITHUB_RUN_ATTEMPT\"," \
                "  \"build_base\": \"$BUILD_BASE_REF\"," \
                "  \"MOOSE_SHA\": \"$MOOSE_SHA\"," \
                "  \"CRANE_SHA\": \"$CRANE_SHA\"," \
                "  \"SQUIRREL_SHA\": \"$SQUIRREL_SHA\"," \
                "  \"ZAPDOS_SHA\": \"$ZAPDOS_SHA\"," \
                "  \"physics_opt_sha256\": \"$PHYSICS_SHA\"," \
                "  \"campaign\": \"Issue-236 Om L nonlinear-globalization discriminator\"," \
                "  \"same_binary\": true" \
                "}" > issue236-om-l-logs/provenance.json
              python3 -m json.tool issue236-om-l-logs/provenance.json >/dev/null

              run_case() {
                MODE="$1"
                export ISSUE236_OM_L_MODE="$MODE"
                rm -rf "issue236-om-l-results/$MODE" "issue236-om-l-logs/$MODE"
                mkdir -p "issue236-om-l-results/$MODE" "issue236-om-l-logs/$MODE"
                cp issue236-om-l-logs/shared/physics-opt.sha256 \
                  "issue236-om-l-logs/$MODE/physics-opt.sha256"
                test "$(sha256sum physics_app/physics-opt | awk "{print \$1}")" = "$PHYSICS_SHA"

                python3 experiments/Issue236_m1a_multiapp_smoke/run_om_nonlinear_ci.py --self-test \
                  | tee "issue236-om-l-logs/$MODE/preflight.log"

                set +e
                python3 experiments/Issue236_m1a_multiapp_smoke/run_om_nonlinear_ci.py \
                  --physics-opt physics_app/physics-opt --dt-e 1e-10 \
                  --results-root "issue236-om-l-results/$MODE" --timeout 1200
                RC=$?
                set -e
                printf "%s\n" "$RC" | tee "issue236-om-l-logs/$MODE/wrapper-returncode.txt"
                test "$(sha256sum physics_app/physics-opt | awk "{print \$1}")" = "$PHYSICS_SHA"
              }

              run_case L0_fullstep
              run_case L1_damp_0p5
              run_case L2_backtracking

              cmp issue236-om-l-logs/L0_fullstep/physics-opt.sha256 issue236-om-l-logs/L1_damp_0p5/physics-opt.sha256
              cmp issue236-om-l-logs/L0_fullstep/physics-opt.sha256 issue236-om-l-logs/L2_backtracking/physics-opt.sha256
            '

      - name: Classify nonlinear-globalization evidence
        if: always()
        shell: bash
        run: |
          set -uxo pipefail
          python3 experiments/Issue236_m1a_multiapp_smoke/check_om_nonlinear_l.py --self-test
          python3 experiments/Issue236_m1a_multiapp_smoke/check_om_nonlinear_l.py \
            --artifact-root . \
            --output issue236-om-l-qualification/om-l-qualification.json

      - name: Upload Om L evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue236-om-l-evidence
          path: |
            issue236-om-l-results
            issue236-om-l-logs
            issue236-om-l-qualification
          if-no-files-found: error
          retention-days: 14
