name: Issue-236 Om L nonlinear-globalization discriminator

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue236-om-l-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
  MOOSE_SHA: 9f388366ccf38b9c34542ec5561198249fde0ac9
  CRANE_SHA: ba26970cf419dcac563a20ed7079d445bc6341c3
  SQUIRREL_SHA: 16a26d504f3ee11161a86d4e3ebf3c0e5f2afbb1
  ZAPDOS_SHA: 9eceffbc46048c3760bbfa9a7f1ca681ae35af1d
  PYTHONPATH: .

jobs:
  nonlinear-discriminator:
    name: Om L1 damping-0.5 extended discriminator
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Require governed Issue-236 branch
        shell: bash
        run: |
          set -euxo pipefail
          test "$GITHUB_REF_NAME" = "issue-236-m1a-multiapp-smoke"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Bootstrap harness dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile physics_harness/bootstrap.py
          python3 -m physics_harness.bootstrap --self-test
          python3 -m physics_harness.bootstrap ensure evidence \
            --manifest-out issue236-om-l1-bootstrap-host.json

      - name: Static L1 qualification gate
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile experiments/Issue236_m1a_multiapp_smoke/run_om_nonlinear_ci.py
          ISSUE236_NE_BOUNDARY_MODE=mirrors_one_term \
          ISSUE236_OM_FORENSIC=on \
          ISSUE236_OM_CASE_ID=O1 \
          ISSUE236_OM_L_MODE=L1_damp_0p5 \
          python3 experiments/Issue236_m1a_multiapp_smoke/run_om_nonlinear_ci.py --self-test > l1-preflight-static.json
          python3 -c "import json; d=json.load(open('l1-preflight-static.json')); assert d['status']=='PASS'; assert d['om_nonlinear_mode']=='L1_damp_0p5'; assert d['om_nonlinear_control']=={'line_search':'basic','damping':0.5}"

      - name: Verify exact provenance and pinned dependencies
        shell: bash
        run: |
          set -euxo pipefail
          source physics_app/dependencies.lock
          test "$MOOSE" = "$MOOSE_SHA"
          test "$CRANE" = "$CRANE_SHA"
          test "$SQUIRREL" = "$SQUIRREL_SHA"
          test "$ZAPDOS" = "$ZAPDOS_SHA"
          docker pull "$BUILD_BASE_REF"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.moose.sha" }}')" = "$MOOSE_SHA"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.crane.sha" }}')" = "$CRANE_SHA"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.squirrel.sha" }}')" = "$SQUIRREL_SHA"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.zapdos.sha" }}')" = "$ZAPDOS_SHA"

      - name: Build once and run L1 extended
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf issue236-om-l1-extended-results issue236-om-l1-extended-logs
          mkdir -p issue236-om-l1-extended-results issue236-om-l1-extended-logs

          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace \
            -e GITHUB_SHA="$GITHUB_SHA" -e BUILD_BASE_REF="$BUILD_BASE_REF" \
            -e MOOSE_SHA="$MOOSE_SHA" -e CRANE_SHA="$CRANE_SHA" \
            -e SQUIRREL_SHA="$SQUIRREL_SHA" -e ZAPDOS_SHA="$ZAPDOS_SHA" \
            -v "$PWD:/workspace" "$BUILD_BASE_REF" -lc '
              set -euxo pipefail
              source /environment
              export PYTHONPATH=/workspace MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos METHOD=opt
              export ISSUE236_NE_BOUNDARY_MODE=mirrors_one_term
              export ISSUE236_OM_FORENSIC=on
              export ISSUE236_OM_CASE_ID=O1
              export ISSUE236_OM_L_MODE=L1_damp_0p5
              git config --global --add safe.directory /workspace
              test "$(git -C /workspace rev-parse HEAD)" = "$GITHUB_SHA"

              python3 -m physics_harness.bootstrap ensure evidence \
                --manifest-out issue236-om-l1-extended-logs/bootstrap-container.json
              make -C physics_app -j2
              test -x physics_app/physics-opt
              PHYSICS_SHA="$(sha256sum physics_app/physics-opt | awk "{print \$1}")"
              printf "%s  physics_app/physics-opt\n" "$PHYSICS_SHA" \
                | tee issue236-om-l1-extended-logs/physics-opt.sha256

              python3 experiments/Issue236_m1a_multiapp_smoke/run_om_nonlinear_ci.py --self-test \
                | tee issue236-om-l1-extended-logs/preflight.log

              set +e
              python3 experiments/Issue236_m1a_multiapp_smoke/run_om_nonlinear_ci.py \
                --physics-opt physics_app/physics-opt --dt-e 1e-10 \
                --results-root issue236-om-l1-extended-results --timeout 3000
              RC=$?
              set -e
              printf "%s\n" "$RC" | tee issue236-om-l1-extended-logs/wrapper-returncode.txt
              test "$(sha256sum physics_app/physics-opt | awk "{print \$1}")" = "$PHYSICS_SHA"
            '

      - name: Upload L1 extended evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue236-om-l1-extended-evidence
          path: |
            issue236-om-l1-extended-results
            issue236-om-l1-extended-logs
            issue236-om-l1-bootstrap-host.json
            l1-preflight-static.json
          if-no-files-found: error
          retention-days: 14
