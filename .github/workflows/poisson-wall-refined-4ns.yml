name: Poisson Wall Refined 4ns

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: poisson-wall-refined-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wall-refined-4ns:
    if: github.event_name == 'pull_request' && github.head_ref == 'issue-359-qualified-gummel-icp'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    env:
      POISSON_DIR: experiments/2d-icp-poisson-experiment
      BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build exact-head Physics runtime
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          docker pull "$BUILD_BASE_REF"
          docker run --rm \
            --entrypoint /bin/bash \
            --user 0:0 \
            --workdir /workspace \
            -v "$PWD:/workspace" \
            "$BUILD_BASE_REF" \
            -lc '
              set -euxo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory /opt/physics_vendor/moose
              git config --global --add safe.directory /opt/physics_vendor/crane
              git config --global --add safe.directory /opt/physics_vendor/squirrel
              git config --global --add safe.directory /opt/physics_vendor/zapdos
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt
              make -C /workspace/physics_app -j2
              chmod -R a+rwX /workspace/physics_app
            '
          test -x physics_app/physics-opt

      - name: Prepare wall-refined 4 ns case
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .ci-wall-refined-4ns
          mkdir -p .ci-wall-refined-4ns
          cp -R "$POISSON_DIR"/. .ci-wall-refined-4ns/
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.ci-wall-refined-4ns/input.i')
          text = path.read_text()
          anchor = """  [plasma_only]\n    type = BlockDeletionGenerator\n    input = plasma_focus_ring\n    operation = keep\n    block = plasma\n  []\n"""
          replacement = """  # Refine only the physical plasma-wall sidesets. The x=0 RZ axis is\n  # intentionally absent, so the axis/interior retain the baseline coarse mesh.\n  [wall_refined]\n    type = RefineSidesetGenerator\n    input = plasma_focus_ring\n    boundaries = 'inlet outlet plasma_electrode plasma_metal plasma_right plasma_cover plasma_wafer plasma_focus_ring'\n    refinement = '1 1 1 1 1 1 1 1'\n    boundary_side = primary\n    enable_neighbor_refinement = true\n  []\n  [plasma_only]\n    type = BlockDeletionGenerator\n    input = wall_refined\n    operation = keep\n    block = plasma\n  []\n"""
          if anchor not in text:
              raise SystemExit('canonical plasma_only mesh block not found')
          text = text.replace(anchor, replacement, 1)
          if '  end_time = 4.0e-9\n' not in text or '  num_steps = 4\n' not in text:
              raise SystemExit('canonical 4 ns execution contract not found')
          if '  dt = 1.0e-9\n' not in text:
              raise SystemExit('canonical 1 ns timestep not found')
          path.write_text(text)
          PY

      - name: Run wall-refined 4 ns case
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm \
            --entrypoint /bin/bash \
            --user "$(id -u):$(id -g)" \
            --workdir /workspace/.ci-wall-refined-4ns \
            -v "$PWD:/workspace" \
            "$BUILD_BASE_REF" \
            -lc '
              set -euxo pipefail
              source /environment
              /workspace/physics_app/physics-opt --check-input -i input.i
              /workspace/physics_app/physics-opt -i input.i > runtime.log 2>&1
            '
          test -f .ci-wall-refined-4ns/poisson.e
          ls .ci-wall-refined-4ns/poisson_final_profile_*.csv

      - name: Summarize refined profile
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import csv, json

          root = Path('.ci-wall-refined-4ns')
          files = sorted(root.glob('poisson_final_profile_*.csv'))
          if not files:
              raise SystemExit('missing final profile')
          with files[-1].open(newline='') as handle:
              rows = list(csv.DictReader(handle))

          def extremum(field, mode):
              fn = max if mode == 'max' else min
              row = fn(rows, key=lambda r: float(r[field]))
              return {
                  'value': float(row[field]),
                  'id': int(row['id']),
                  'x_m': float(row['x']),
                  'y_m': float(row['y']),
              }

          result = {
              'mesh_policy': 'one h-refinement level on eight physical plasma-wall sidesets; x=0 axis unrefined',
              'cells': len(rows),
              'phi_min': extremum('phi', 'min'),
              'phi_max': extremum('phi', 'max'),
              'charge_min': extremum('charge_density_out', 'min'),
              'charge_max': extremum('charge_density_out', 'max'),
              'source_min': extremum('poisson_source_out', 'min'),
              'source_max': extremum('poisson_source_out', 'max'),
              'electron_density_min': extremum('electron_density', 'min'),
              'electron_density_max': extremum('electron_density', 'max'),
          }
          (root / 'wall_refined_result.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          PY

      - name: Upload wall-refined evidence
        uses: actions/upload-artifact@v4
        with:
          name: poisson-wall-refined-4ns
          path: |
            .ci-wall-refined-4ns/input.i
            .ci-wall-refined-4ns/runtime.log
            .ci-wall-refined-4ns/wall_refined_result.json
            .ci-wall-refined-4ns/poisson.e
            .ci-wall-refined-4ns/poisson.csv
            .ci-wall-refined-4ns/poisson_final_profile_*.csv
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
