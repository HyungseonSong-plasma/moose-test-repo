name: Issue668 PR674 exact-head source-only premerge gate
# Retry after independent verifier section/name identity correction
on:
  push:
    branches:
      - issue-668-p2-production-newonly-stage-20261117
    paths:
      - .github/workflows/issue668-pr674-merge-gate-once.yml
permissions:
  contents: read
  actions: read
jobs:
  verify-newonly-static:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout isolated integration source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable baseline ancestor and source-only scope
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e 9c15a4f0e2cf8042cb0d4b2f18af31511021d168^{commit}
          git merge-base --is-ancestor 9c15a4f0e2cf8042cb0d4b2f18af31511021d168 HEAD
          python3 -m py_compile \
            experiments/Issue402_plasma_dsl_g1/chemistry/prepare_s6_run_input.py \
            experiments/Issue402_plasma_dsl_g1/chemistry/prepare_s6_newonly.py \
            experiments/Issue402_plasma_dsl_g1/chemistry/retire_s6_ion_fv_owners.py \
            ci/issue668_p2_newonly_stage_verify.py
      - name: Download immutable P1-0 and Maxwell source-only artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/p2-sources
          curl --fail --location --silent --show-error --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/14372278070/zip" \
            --output /tmp/p2-sources/p1-0.zip
          echo '97333b09ca3017edb04a35b2ceb82398894ddb61f256fee10e4e8cb7ede623db  /tmp/p2-sources/p1-0.zip' | sha256sum --check -
          curl --fail --location --silent --show-error --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/14379920938/zip" \
            --output /tmp/p2-sources/p2-maxwell.zip
          echo 'f940af496d12a4cf87903237a912922d42dd1308a38915dd38cb3ca2da0dd6a4  /tmp/p2-sources/p2-maxwell.zip' | sha256sum --check -
      - name: Pin historical public 42-row electron transport table
        shell: bash
        run: |
          set -euo pipefail
          git show '29d1acc6ef7969908b86719e4b95c73a1565136d:.github/oxygen25_eedf/initial_mixture_23xsec_transport.txt' > /tmp/p2-sources/electron_moments.txt
          echo '35534a522fa48ccb5222339c5040040630eef31e623e1c53f1e1c4540d2d653b  /tmp/p2-sources/electron_moments.txt' | sha256sum --check -
      - name: Execute production runner --newonly in independent 417 and 941 Scratch
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/issue668_p2_newonly_stage_verify.py \
            --base-zip /tmp/p2-sources/p1-0.zip \
            --maxwell-zip /tmp/p2-sources/p2-maxwell.zip \
            --moments /tmp/p2-sources/electron_moments.txt \
            --out /tmp/p2-source-newonly
      - name: Upload only source-stage SHA and public Scratch evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue668-p2-newonly-production-runner-static-417-941
          path: /tmp/p2-source-newonly/
          if-no-files-found: error
          retention-days: 30
