name: Samuel exact-SHA branch delete

on:
  push:
    branches: [main]
    paths:
      - 'automation/mutations/branch-delete-request.json'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.request.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: request
        name: Validate branch-delete request
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          request=json.loads(Path('automation/mutations/branch-delete-request.json').read_text(encoding='utf-8'))
          if set(request) != {'targets'} or not isinstance(request['targets'],list) or not request['targets']:
              raise SystemExit('branch-delete request must contain a non-empty targets list')
          seen=set()
          include=[]
          for item in request['targets']:
              if not isinstance(item,dict) or set(item) not in ({'branch','expected_sha'}, {'branch','expected_sha','archive_tag'}):
                  raise SystemExit('each target must contain branch, expected_sha, and optional archive_tag')
              branch=item['branch']
              sha=item['expected_sha']
              if not isinstance(branch,str) or not branch or branch == 'main' or branch in seen:
                  raise SystemExit(f'invalid or duplicate branch-delete target: {branch!r}')
              if not isinstance(sha,str) or re.fullmatch(r'[0-9a-f]{40}',sha) is None:
                  raise SystemExit(f'invalid expected_sha for {branch!r}')
              archive_tag=item.get('archive_tag','')
              if archive_tag:
                  archive_expected='archive/oxygen-cleanup-20261106/'+re.sub(r'[^A-Za-z0-9._-]','-',branch)+'-'+sha[:12]
                  if archive_tag != archive_expected:
                      raise SystemExit(f'invalid archive_tag for {branch!r}: {archive_tag!r}')
              seen.add(branch)
              include.append({'branch':branch,'expected_sha':sha,'archive_tag':archive_tag})
          matrix=json.dumps({'include':include},separators=(',',':'))
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f'matrix={matrix}\n')
          PY

  delete:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Preserve branch head as immutable archive tag before delete
        if: matrix.archive_tag != ''
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ matrix.branch }}
          EXPECTED_SHA: ${{ matrix.expected_sha }}
          ARCHIVE_TAG: ${{ matrix.archive_tag }}
        run: |
          python3 - <<'PY'
          import json, os
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          repo=os.environ['REPOSITORY']
          branch=os.environ['BRANCH']
          sha=os.environ['EXPECTED_SHA']
          tag=os.environ['ARCHIVE_TAG']
          def api(method, path, data=None, allow_404=False):
              url='https://api.github.com/repos/'+repo+path
              req=Request(url, method=method, data=(json.dumps(data).encode() if data is not None else None))
              req.add_header('Accept','application/vnd.github+json')
              req.add_header('Authorization','Bearer '+os.environ['GITHUB_TOKEN'])
              req.add_header('X-GitHub-Api-Version','2022-11-28')
              if data is not None: req.add_header('Content-Type','application/json')
              try:
                  with urlopen(req, timeout=30) as response: return json.load(response)
              except HTTPError as exc:
                  if allow_404 and exc.code==404: return None
                  raise
          current=api('GET','/git/ref/heads/'+quote(branch,safe='/'),allow_404=True)
          if current is None or current.get('object',{}).get('sha') != sha:
              raise SystemExit('ARCHIVE_DENIED: branch missing or exact SHA mismatch')
          tagpath='/git/ref/tags/'+quote(tag,safe='/')
          existing=api('GET',tagpath,allow_404=True)
          if existing is None:
              api('POST','/git/refs',{'ref':'refs/tags/'+tag,'sha':sha})
          elif existing.get('object',{}).get('sha') != sha or existing.get('object',{}).get('type') != 'commit':
              raise SystemExit('ARCHIVE_DENIED: tag collision or non-commit object')
          verified=api('GET',tagpath)
          if verified.get('object',{}).get('sha') != sha or verified.get('object',{}).get('type') != 'commit':
              raise SystemExit('ARCHIVE_DENIED: tag post-write verification failed')
          print('SAMUEL_ARCHIVE_TAG=PASS tag='+tag+' sha='+sha)
          PY
      - name: Delete branch through Samuel lease-guarded capability
        uses: HyungseonSong-plasma/chatgpt-operation/.github/actions/branch-delete@9b335e3fbb9c5e8e323e382daeec56fa25336822
        with:
          repository: HyungseonSong-plasma/moose-test-repo
          branch: ${{ matrix.branch }}
          expected-sha: ${{ matrix.expected_sha }}
          github-token: ${{ github.token }}
