name: log-molar particle sheath 10-step feedback

on:
  push:
    branches:
      - prototype-fully-implicit-electron-poisson
    paths:
      - 'experiments/implicit_logmolar_surface_loss/input_particle_only_1step.i'
      - '.github/workflows/logmolar-particle-sheath-10step.yml'
      - 'physics_app/**'
  workflow_dispatch:

jobs:
  feedback:
    name: particle-sheath-10step
    runs-on: ubuntu-24.04
    env:
      BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
    steps:
      - uses: actions/checkout@v4
      - name: Pull Physics build base
        run: docker pull "$BUILD_BASE_REF"
      - name: Build and run ten steps
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint /bin/bash \
            --user 0:0 \
            --workdir /workspace \
            -v "$GITHUB_WORKSPACE:/workspace" \
            "$BUILD_BASE_REF" \
            -lc '
              set -euo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory /opt/physics_vendor/moose
              git config --global --add safe.directory /opt/physics_vendor/crane
              git config --global --add safe.directory /opt/physics_vendor/squirrel
              git config --global --add safe.directory /opt/physics_vendor/zapdos
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt
              make -C physics_app -j2
              cd experiments/implicit_logmolar_surface_loss
              rm -rf particle_10step
              mkdir -p particle_10step
              set +e
              ../../physics_app/physics-opt -i input_particle_only_1step.i \
                "Executioner/num_steps=10" \
                "Executioner/end_time=1.0e-8" \
                "Executioner/nl_rel_tol=1.0e-9" \
                "Executioner/nl_abs_tol=1.0e-11" \
                "Outputs/file_base=particle_10step/solve" \
                > particle_10step/run.log 2>&1
              rc=$?
              set -e
              printf "run_rc=%s\n" "$rc" > particle_10step/status.txt
              grep -E "Time Step|SNES Function norm|CONVERGED|DIVERGED|Solve Converged|Solve Did NOT Converge" particle_10step/run.log > particle_10step/summary.txt || true
              cat particle_10step/status.txt
              tail -n 140 particle_10step/summary.txt || true
            '
      - name: Upload feedback result
        uses: actions/upload-artifact@v4
        with:
          name: logmolar-particle-sheath-10step
          path: experiments/implicit_logmolar_surface_loss/particle_10step/**
          retention-days: 30
