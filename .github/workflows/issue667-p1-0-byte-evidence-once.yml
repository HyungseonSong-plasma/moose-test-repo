name: Issue667 P1-0 pinned S6 11-layer byte receipt (P0 only)
run-name: Issue667 11-layer byte archive pinned 9c15a4f0
on:
  push:
    branches:
      - issue-667-p1-0-byte-evidence-20261117
    paths:
      - .github/workflows/issue667-p1-0-byte-evidence-once.yml
permissions:
  contents: read
concurrency:
  group: issue667-p1-0-byte-evidence-20261117
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SOURCE_HEAD: 9c15a4f0e2cf8042cb0d4b2f18af31511021d168
      HISTORICAL_HEAD: 29d1acc6ef7969908b86719e4b95c73a1565136d
      CHEM: experiments/Issue395_powered_chemistry_ladder
      OXYGEN_RESEARCH_400: '1'
      OXYGEN_RESEARCH_FULL24: '0'
      OXYGEN_RESEARCH_EI2738_FORMULA: '0'
      OXYGEN_RESEARCH_QUICK_5MIN: '0'
    steps:
      - name: Checkout exact source commit (never workflow branch)
        uses: actions/checkout@v4
        with:
          ref: 9c15a4f0e2cf8042cb0d4b2f18af31511021d168
          path: control
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout immutable historical public data
        uses: actions/checkout@v4
        with:
          ref: 29d1acc6ef7969908b86719e4b95c73a1565136d
          path: historical
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact source and protected data isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C control rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git -C historical rev-parse HEAD)" = "$HISTORICAL_HEAD"
          test ! -e "historical/$CHEM/private_rates"
          test -f control/experiments/Issue402_plasma_dsl_g1/chemistry/prepare_s6_run_input.py
          test -f control/experiments/Issue402_plasma_dsl_g1/chemistry/prepare_hybrid_json_s6.py
          test -f control/experiments/Issue402_plasma_dsl_g1/native/s6_c0_physics_base_no_d1.i
          test "$(sha256sum control/experiments/Issue402_plasma_dsl_g1/native/s6_c0_physics_base_no_d1.i | cut -d' ' -f1)" = e49e7b63566f16e9eaede7e97ec232338b04a8cdfc019527d73bdb519521abfd
          echo ISSUE667_SOURCE_PIN_P0_PASS
      - name: Use pinned Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install mesh preprocessing requirements only
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet numpy==2.1.2 scipy==1.14.1 matplotlib==3.9.2
      - name: Prepare public historical mesh (not P3 or P4)
        shell: bash
        run: |
          set -euo pipefail
          cd historical
          src=.github/oxygen25_eedf/initial_mixture_23xsec_transport.txt
          dst=experiments/Issue91_real_qvt_r3/r3_e0/electron_moments.txt
          test "$(sha256sum "$src" | cut -d' ' -f1)" = 35534a522fa48ccb5222339c5040040630eef31e623e1c53f1e1c4540d2d653b
          cp "$src" "$dst"
          export CHATGPT_WORK_BASE_SHA="$HISTORICAL_HEAD"
          bash "$CHEM/issue397_l1_power_scan_replay.sh" prepare 400
          python3 .github/scripts/oxygen_legacy6_latest_100us.py --power-w 400 --prepare
          test -s "$CHEM/baseline_plasma_plus_unstructured_cover_plus_wafer.msh"
          test ! -e "$CHEM/private_rates"
          echo ISSUE667_PUBLIC_MESH_PREP_P0_PASS
      - name: Rebuild and byte-export exactly 11 staged layers for each case
        shell: bash
        run: |
          set -euo pipefail
          cd control
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re, shutil, sys
          root = Path.cwd().resolve()
          historical = root.parent / "historical"
          pilot = root / "experiments/Issue402_plasma_dsl_g1"
          sys.path.insert(0, str(pilot))
          import public_option_s6_p2 as option
          from chemistry.prepare_s6_run_input import prepare as prepare_chemistry
          from chemistry.prepare_hybrid_json_s6 import prepare as prepare_hybrid
          source = "9c15a4f0e2cf8042cb0d4b2f18af31511021d168"
          hist = "29d1acc6ef7969908b86719e4b95c73a1565136d"
          def sha(data):
              return hashlib.sha256(data).hexdigest()
          assert option.git_head(root) == source
          assert option.git_head(historical) == hist
          assert option.p2.preflight(root)["P0"] == "PASS"
          deck_manifest = json.loads((root / option.p2.DECKS / "manifest.json").read_text())
          base = pilot / "native/s6_c0_physics_base_no_d1.i"
          assert sha(base.read_bytes()) == "e49e7b63566f16e9eaede7e97ec232338b04a8cdfc019527d73bdb519521abfd"
          target_root = root.parent / "issue667_artifact"
          assert not target_root.exists()
          target_root.mkdir()
          receipt = {"schema":"issue667.p1_0.source_bound_11_layers.v1",
                     "source_head":source, "historical_head":hist,
                     "P0":"PASS", "P2":"NOT_RUN", "P3":"NOT_RUN",
                     "P4":"NOT_RUN", "science":"SCIENCE_HOLD", "cases":{}}
          for case in ("417","941"):
              scratch = root.parent / "issue667_work" / ("S6-"+case) / "scratch_hybrid"
              layers = option.p2.stage(root, historical, case, "C", scratch,
                                       deck_manifest, d_base_source=base)
              assert len(layers) == 11
              chemistry = scratch / option.p2.CHEM
              migration = option.canonicalize_staged_D_inputs(chemistry,layers)
              remap = option.remap_staged_fem_types(chemistry,layers)
              chem = prepare_chemistry(chemistry,layers,case)
              hyb = prepare_hybrid(chemistry,layers,case,chemistry_cutover=chem)
              assert hyb["removed_generated_owner_count"] == 10
              assert hyb["rebound_native_sheath_bc_count"] == 8
              assert hyb["integrated_species_count"] == 7
              assert hyb["integrated_reaction_count"] == 8
              out = target_root / ("S6-"+case) / "layers"
              out.mkdir(parents=True)
              files = []
              objects = []
              for ordinal, rel in enumerate(layers, start=1):
                  item = scratch / rel
                  assert item.is_file() and not item.is_symlink()
                  name = Path(rel).name
                  data = item.read_bytes()
                  assert data and b"\x00" not in data
                  text = data.decode("utf-8")
                  includes = re.findall(r"(?m)^\s*!include\s+([^\r\n]+)",text)
                  assert not includes, "unresolved !include in "+name
                  dest = out / name
                  assert not dest.exists()
                  dest.write_bytes(data)
                  assert sha(dest.read_bytes()) == sha(data)
                  files.append({"layer_ordinal":ordinal,"file_path":rel,
                                "archive_path":str(dest.relative_to(target_root)),
                                "file_sha256":sha(data), "size_bytes":len(data),
                                "include_paths":[]})
                  for obj in ("nm_time","nm_diffusion","nm_drift"):
                      pattern = re.compile(r"(?ms)^  \["+obj+r"\]\r?\n.*?^  \[\]\r?\n")
                      blocks = pattern.findall(text)
                      for block in blocks:
                          objects.append({"layer_ordinal":ordinal,"object_name":obj,
                                          "file_path":rel,
                                          "block_sha256":sha(block.encode("utf-8")),
                                          "variable":re.search(r"(?m)^\s*variable\s*=\s*(\S+)",block).group(1)})
              assert len(files) == 11
              assert {x["object_name"] for x in objects} == {"nm_time","nm_diffusion","nm_drift"}
              assert len(objects) == 3
              assert all(x["variable"] == "log_Om" for x in objects)
              receipt["cases"][case] = {"files":files,"om_objects":objects,
                                       "integrated_json_sha256":hyb["integrated_json_source_sha256"],
                                       "scratch_migration_status":migration["status"],
                                       "fem_remap_status":remap["status"] if "status" in remap else "RECORDED",
                                       "native_owner_retirement":False}
          p = target_root / "manifest.json"
          p.write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          assert len(list(target_root.glob("S6-*/layers/*.i"))) == 22
          print("ISSUE667_P1_0_BYTE_EXPORT_PASS 417=11 941=11 P2_NOT_RUN P3_NOT_RUN P4_NOT_RUN SCIENCE_HOLD")
          PY
      - name: Upload only immutable final input layers and SHA receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue667-p1-0-final-11layer-byte-receipt-9c15a4f0
          path: issue667_artifact/
          if-no-files-found: warn
          retention-days: 60
