name: Issue633 Ion wall single-Factory P0 and pinned-OCI P1 (temporary evidence runner)

on:
  push:
    branches:
      - issue-633-ion-wall-single-factory-20261118
    paths:
      - '.github/workflows/issue633-ion-wall-single-factory-once.yml'
      - 'physics_app/**'
      - 'tests/**'
      - 'experiments/**'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  OCI: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008

jobs:
  source-p0:
    name: Python contract, archive migration and 6-output wall parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          echo "ISSUE633_ION_WALL_SOURCE_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Run maintained source contract and archive migration tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet 'pytest>=8,<9' 'pydantic>=2,<3' numpy==2.1.2
          python3 -m py_compile experiments/Issue402_plasma_dsl_g1/chemistry/prepare_s6_run_input.py tests/test_issue633_ion_wall_single_factory.py
          python3 -m pytest -q \
            tests/test_issue633_ion_wall_single_factory.py \
            tests/test_issue402_species_functor_naming.py \
            tests/test_issue402_wall_semantic_parity.py \
            tests/test_issue402_s6_wall_naming_staging.py \
            tests/test_issue402_public_option_s6_p2.py \
            tests/test_retired_legacy_physics_owners_contract.py 2>&1 | tee issue633-ionwall-p0.log
          echo "ISSUE633_ION_WALL_SINGLE_FACTORY_P0_PASS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue633-ionwall-source-p0
          path: issue633-ionwall-p0.log
          if-no-files-found: ignore
          retention-days: 14

  physics-native-p1:
    name: Pinned PhysicsApp Unity-compatible build (P1 only)
    needs: source-p0
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Exact source SHA and pinned build image
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "ISSUE633_ION_WALL_P1_SOURCE_SHA=$GITHUB_SHA"
          echo "ISSUE633_ION_WALL_P1_OCI=$OCI"
      - name: Build PhysicsApp against pinned MOOSE toolchain
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$OCI"
          docker run --rm --entrypoint /bin/bash --user 0:0 \
            --workdir /workspace -v "$PWD:/workspace" "$OCI" -lc '
              set -euo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt
              make -C physics_app -j2 app_non_unity_dirs="%/utils"
              test -x physics_app/physics-opt
            ' 2>&1 | tee issue633-ionwall-p1-build.log
          sha256sum physics_app/physics-opt | tee issue633-ionwall-p1-binary.sha256
          echo "ISSUE633_ION_WALL_SINGLE_FACTORY_NATIVE_P1_BUILD_PASS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue633-ionwall-native-p1
          path: |
            issue633-ionwall-p1-build.log
            issue633-ionwall-p1-binary.sha256
          if-no-files-found: ignore
          retention-days: 14
