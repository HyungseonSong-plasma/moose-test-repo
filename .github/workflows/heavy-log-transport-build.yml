name: heavy log transport build

on:
  push:
    branches:
      - prototype-fully-implicit-electron-poisson
    paths:
      - '.ci_triggers/heavy-log-transport-build'

permissions:
  contents: read
  packages: read

env:
  BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008

jobs:
  build-heavy-log-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Pull build image
        run: docker pull "$BUILD_BASE_REF"
      - name: Build heavy-log and run monolithic one-step
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash --user 0:0 \
            --workdir /workspace \
            -v "$GITHUB_WORKSPACE:/workspace" \
            "$BUILD_BASE_REF" -lc '
              set -euo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory /opt/physics_vendor/moose
              git config --global --add safe.directory /opt/physics_vendor/crane
              git config --global --add safe.directory /opt/physics_vendor/squirrel
              git config --global --add safe.directory /opt/physics_vendor/zapdos
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt

              make -C physics_app -j2
              cd experiments/heavy_fast_logmolar_coupling

              # Structural heavy-log/simplex qualification.
              python3 prepare_heavy_log_simplex_smoke.py
              ../../physics_app/physics-opt -i heavy_log_simplex_smoke.i --check-input

              # Full monolithic discriminator: heavy flow/transport + electron
              # continuity/energy + Poisson/Joule in one Newton system.
              python3 prepare_full_monolithic_log_simplex.py
              ../../physics_app/physics-opt -i full_monolithic_log_simplex.i --check-input

              rm -rf output_full_monolithic_log_simplex
              mkdir -p output_full_monolithic_log_simplex
              set +e
              /usr/bin/time \
                -f "wall_seconds=%e\nuser_seconds=%U\nsystem_seconds=%S\nmax_rss_kb=%M" \
                -o output_full_monolithic_log_simplex/wall_time.txt \
                ../../physics_app/physics-opt -i full_monolithic_log_simplex.i \
                > output_full_monolithic_log_simplex/run.log 2>&1
              rc=$?
              set -e

              echo "run_rc=$rc" | tee output_full_monolithic_log_simplex/status.txt
              cp full_monolithic_log_simplex.i prepare_full_monolithic_log_simplex.py \
                 prepare_heavy_log_simplex_smoke.py output_full_monolithic_log_simplex/
              cp full_monolithic_log_simplex_out.csv output_full_monolithic_log_simplex/ 2>/dev/null || true
              cp full_monolithic_log_simplex_out.e output_full_monolithic_log_simplex/ 2>/dev/null || true
              grep -E "Time Step|Nonlinear|Solve Did NOT Converge|CONVERGED|DIVERGED|log_ne|log_energy|potential|eta_|ERROR" \
                output_full_monolithic_log_simplex/run.log \
                > output_full_monolithic_log_simplex/summary.txt || true
              tail -n 180 output_full_monolithic_log_simplex/run.log || true
              exit "$rc"
            '

      - name: Upload full monolithic log-simplex result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-monolithic-log-simplex-one-step
          path: experiments/heavy_fast_logmolar_coupling/output_full_monolithic_log_simplex/**
          retention-days: 30
