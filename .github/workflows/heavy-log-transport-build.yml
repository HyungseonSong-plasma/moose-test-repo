name: heavy electron continuity A/B

on:
  push:
    branches:
      - prototype-fully-implicit-electron-poisson
    paths:
      - '.ci_triggers/heavy-log-transport-build'

permissions:
  contents: read
  packages: read

env:
  BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008

jobs:
  heavy-electron-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Pull build image
        run: docker pull "$BUILD_BASE_REF"
      - name: Build and run global-LU one-step
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash --user 0:0 \
            --workdir /workspace \
            -v "$GITHUB_WORKSPACE:/workspace" \
            "$BUILD_BASE_REF" -lc '
              set -euo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory /opt/physics_vendor/moose
              git config --global --add safe.directory /opt/physics_vendor/crane
              git config --global --add safe.directory /opt/physics_vendor/squirrel
              git config --global --add safe.directory /opt/physics_vendor/zapdos
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt

              make -C physics_app -j2
              cd experiments/heavy_fast_logmolar_coupling

              python3 prepare_heavy_electron_continuity_full.py
              ../../physics_app/physics-opt -i heavy_electron_continuity_full.i --check-input

              rm -rf output_heavy_electron_continuity_full
              mkdir -p output_heavy_electron_continuity_full
              set +e
              /usr/bin/time \
                -f "wall_seconds=%e\nuser_seconds=%U\nsystem_seconds=%S\nmax_rss_kb=%M" \
                -o output_heavy_electron_continuity_full/wall_time.txt \
                timeout --signal=TERM 12m stdbuf -oL -eL \
                ../../physics_app/physics-opt -i heavy_electron_continuity_full.i \
                > output_heavy_electron_continuity_full/run.log 2>&1
              rc=$?
              set -e

              echo "run_rc=$rc" | tee output_heavy_electron_continuity_full/status.txt
              cp heavy_electron_continuity_full.i prepare_heavy_electron_continuity_full.py \
                 prepare_heavy_log_simplex_smoke.py output_heavy_electron_continuity_full/
              cp heavy_electron_continuity_full_out.csv output_heavy_electron_continuity_full/ 2>/dev/null || true
              cp heavy_electron_continuity_full_out.e output_heavy_electron_continuity_full/ 2>/dev/null || true
              grep -E "Time Step|Nonlinear|Linear|KSP|Solve Did NOT Converge|CONVERGED|DIVERGED|log_ne|eta_|ERROR" \
                output_heavy_electron_continuity_full/run.log \
                > output_heavy_electron_continuity_full/summary.txt || true
              tail -n 220 output_heavy_electron_continuity_full/run.log || true
              exit "$rc"
            '
      - name: Upload global-LU result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heavy-electron-continuity-full
          path: experiments/heavy_fast_logmolar_coupling/output_heavy_electron_continuity_full/**
          retention-days: 30

  heavy-electron-level1:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Pull build image
        run: docker pull "$BUILD_BASE_REF"
      - name: Build and run Level-1 one-step
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash --user 0:0 \
            --workdir /workspace \
            -v "$GITHUB_WORKSPACE:/workspace" \
            "$BUILD_BASE_REF" -lc '
              set -euo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory /opt/physics_vendor/moose
              git config --global --add safe.directory /opt/physics_vendor/crane
              git config --global --add safe.directory /opt/physics_vendor/squirrel
              git config --global --add safe.directory /opt/physics_vendor/zapdos
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt

              make -C physics_app -j2
              cd experiments/heavy_fast_logmolar_coupling

              python3 prepare_heavy_electron_continuity_level1.py
              ../../physics_app/physics-opt -i heavy_electron_continuity_level1.i --check-input

              rm -rf output_heavy_electron_continuity_level1
              mkdir -p output_heavy_electron_continuity_level1
              set +e
              /usr/bin/time \
                -f "wall_seconds=%e\nuser_seconds=%U\nsystem_seconds=%S\nmax_rss_kb=%M" \
                -o output_heavy_electron_continuity_level1/wall_time.txt \
                timeout --signal=TERM 12m stdbuf -oL -eL \
                ../../physics_app/physics-opt -i heavy_electron_continuity_level1.i \
                > output_heavy_electron_continuity_level1/run.log 2>&1
              rc=$?
              set -e

              echo "run_rc=$rc" | tee output_heavy_electron_continuity_level1/status.txt
              cp heavy_electron_continuity_level1.i prepare_heavy_electron_continuity_level1.py \
                 prepare_heavy_electron_continuity_full.py prepare_heavy_log_simplex_smoke.py \
                 output_heavy_electron_continuity_level1/
              cp heavy_electron_continuity_level1_out.csv output_heavy_electron_continuity_level1/ 2>/dev/null || true
              cp heavy_electron_continuity_level1_out.e output_heavy_electron_continuity_level1/ 2>/dev/null || true
              grep -E "Time Step|Nonlinear|Linear|KSP|Solve Did NOT Converge|CONVERGED|DIVERGED|log_ne|eta_|ERROR" \
                output_heavy_electron_continuity_level1/run.log \
                > output_heavy_electron_continuity_level1/summary.txt || true
              tail -n 220 output_heavy_electron_continuity_level1/run.log || true
              exit "$rc"
            '
      - name: Upload Level-1 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heavy-electron-continuity-level1
          path: experiments/heavy_fast_logmolar_coupling/output_heavy_electron_continuity_level1/**
          retention-days: 30
