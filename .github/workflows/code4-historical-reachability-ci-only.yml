# Bounded evidence only. Never merge. No compile.
name: Code4 additional historical consumer reachability P2 (CI ONLY NEVER MERGE)
on:
  push:
    branches: [issue-713-code4-historical-reachability-ci-only]
    paths: [.github/workflows/code4-historical-reachability-ci-only.yml]
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_HEAD: 1cd5cbd79137791e1acdd13ac17c15c61e55f242
      SOURCE_TREE: e45aa72b23fc57963da5db5dacb24f450ae803ba
      W1_RUN: '45441439096'
      OCI: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 1cd5cbd79137791e1acdd13ac17c15c61e55f242
          path: target
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: p6-newonly-w1-45441439096-1-1cd5cbd79137791e1acdd13ac17c15c61e55f242
          run-id: 45441439096
          github-token: ${{ github.token }}
          path: w1
      - name: Verify W1 identity and restore ELF and app libs
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,tarfile,shutil
          P=pathlib.Path
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          rec=json.loads(P('w1/identity.json').read_text())
          assert rec['source_head']==os.environ['SOURCE_HEAD']==subprocess.check_output(['git','-C','target','rev-parse','HEAD'],text=True).strip()
          assert rec['source_tree']==os.environ['SOURCE_TREE']==subprocess.check_output(['git','-C','target','rev-parse','HEAD^{tree}'],text=True).strip()
          assert rec['run_id']==os.environ['W1_RUN'] and rec['oci']==os.environ['OCI']
          assert rec['build_count']==1 and rec['archive_roundtrip_check']=='PASS'
          assert rec['native_check_input']=='NOT_RUN' and rec['private_data_bundled'] is False
          assert rec['lock_sha256']==sha(P('target/physics_app/dependencies.lock'))
          archive=P('w1/physics-opt-and-app-libs.tar.gz')
          assert sha(archive)==rec['archive_sha256']
          paths={'physics-opt':P('target/physics_app/physics-opt'),
                 'lib/libphysics-opt.so.0':P('target/physics_app/lib/libphysics-opt.so.0'),
                 'lib/libphysics_test-opt.so.0':P('target/physics_app/test/lib/libphysics_test-opt.so.0')}
          entries={x['stored_path']:x for x in rec['file_records']}
          assert set(entries)==set(paths) and len(rec['file_records'])==3
          assert rec['binary_sha256']==entries['physics-opt']['sha256']
          for name in ('libphysics-opt.so.0','libphysics_test-opt.so.0'):
              assert rec['app_libraries'][name]['sha256']==entries['lib/'+name]['sha256']
          with tarfile.open(archive,'r:gz') as tar:
              assert set(tar.getnames())==set(paths) and len(tar.getmembers())==3
              for name,dst in paths.items():
                  m=tar.getmember(name)
                  assert m.isfile() and m.size==entries[name]['bytes']
                  assert not dst.exists()
                  dst.parent.mkdir(parents=True,exist_ok=True)
                  with tar.extractfile(m) as source,dst.open('wb') as output:shutil.copyfileobj(source,output)
                  assert sha(dst)==entries[name]['sha256'] and dst.open('rb').read(4)==bytes([127,69,76,70])
                  if name=='physics-opt':dst.chmod(0o755)
          P('evidence/w1_identity.json').write_text(json.dumps(rec,indent=2))
          PY
          docker pull "$OCI"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install repository staging dependencies on runner
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'scipy>=1.14,<2' 'matplotlib>=3.8,<4' -r requirements-evidence-engine.txt -r requirements-ontology.txt -r physics_harness/code/requirements.txt
          python -c "import polars, pyarrow, duckdb, pydantic, z3, owlready2, numpy, scipy, matplotlib, yaml; import physics_harness.evidence; print(polars.__version__)" | tee ../evidence/python-preflight.log
          python -m pip freeze > ../evidence/python-dependencies.txt
      - name: Stage historical inputs on runner and bind manifest
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile control/ci/guards/code4_historical_reachability.py
          python control/ci/guards/code4_historical_reachability.py target evidence stage
          echo "STAGE_SHA256=$(sha256sum evidence/stage_manifest.json | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
      - name: Run exact source and bounded historical P2 diagnostics
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint /bin/bash --user 0:0 -v "$PWD/target:/workspace" -v "$PWD/control:/control:ro" -e STAGE_SHA256 -v "$PWD/evidence:/evidence" --workdir /workspace "$OCI" -lc '
            set -euo pipefail
            source /environment
            git config --global --add safe.directory /workspace
            export LD_LIBRARY_PATH="/workspace/physics_app/lib:/workspace/physics_app/test/lib:${LD_LIBRARY_PATH:-}"
            ldd /workspace/physics_app/physics-opt | tee /evidence/ldd.log
            if grep -F "not found" /evidence/ldd.log; then exit 1; fi
            /workspace/physics_app/physics-opt --version | tee /evidence/version.log
            python3 /control/ci/guards/code4_historical_reachability.py /workspace /evidence native
          '
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code4-historical-additional-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 30
          if-no-files-found: error
