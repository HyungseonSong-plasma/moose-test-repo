name: Issue402 S6 retired lower-D Aux provenance P0 once
on:
  push:
    branches: [issue-402-species-functor-naming]
    paths: [.github/workflows/issue402-s6-d1-aux-provenance-once.yml]
permissions:
  contents: read
jobs:
  inspect-archived-diagnostic-owners:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read immutable public B/C S6 Aux ownership and consumers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,collections,hashlib,io,json,pathlib,re,tarfile
          path=pathlib.Path("experiments/Issue493_s6_boltzmann/public_p2_decks.tar.xz.b64")
          raw=base64.b64decode(path.read_text(),validate=False)
          assert hashlib.sha256(raw).hexdigest()=="9e801cc6dca3860750b7b97fb6ceca8e6060a3c894dd616cbaf688f529fea240"
          with tarfile.open(fileobj=io.BytesIO(raw),mode="r:xz") as t:
              files={x.name:t.extractfile(x).read() for x in t.getmembers() if x.isfile()}
          manifest=json.loads(files["manifest.json"])
          print("HEAD="+__import__("os").environ["GITHUB_SHA"])
          heading=re.compile(r"(?ms)^\[(?P<head>AuxVariables|AuxKernels)\]\s*\n(?P<blocks>.*?)^\[\]\s*$")
          children=re.compile(r"(?ms)^  \[(?P<name>[^\]\r\n]+)\]\s*\n(?P<body>.*?)^  \[\]\s*$")
          for case in ("417","941"):
              order=manifest["cases"][case]["input_order"]
              for variant in ("B","C"):
                  where=f"S6-{case}-407-2069-H25/{variant}/"
                  decks={}
                  for layer in order+(["migrated_continuity.i"] if variant=="C" else []):
                      value=files[where+layer]
                      assert hashlib.sha256(value).hexdigest()==manifest["cases"][case]["files_sha256"][variant][layer]
                      decks[layer]=value.decode()
                  observed=[]
                  variables={}
                  for layer,src in decks.items():
                      for top in heading.finditer(src):
                          for block in children.finditer(top.group("blocks")):
                              params=dict((a,b.strip()) for a,b in re.findall(r"(?m)^    ([A-Za-z_][A-Za-z0-9_]*)\s*=\s*([^\r\n]+)$",block.group("body")))
                              record={"section":top.group("head"),"layer":layer,"name":block.group("name"),"params":params}
                              observed.append(record)
                              if record["section"]=="AuxVariables":
                                  variables[record["name"]]=record
                  print("CASE",case,"VARIANT",variant,"BLOCKS",json.dumps(observed,sort_keys=True))
                  targets=[x for x in observed if x["section"]=="AuxKernels" and x["params"].get("type","").startswith("Physics")]
                  print("PHYSICS_AUX_COUNTS",json.dumps(collections.Counter(x["params"]["type"] for x in targets),sort_keys=True))
                  for rec in targets:
                      var=rec["params"].get("variable","")
                      all_references=[]
                      for layer,text in decks.items():
                          n=len(re.findall(r"(?<![A-Za-z0-9_])"+re.escape(var)+r"(?![A-Za-z0-9_])",text))
                          if n:all_references.append({"layer":layer,"count":n})
                      print("AUX_OWNER",json.dumps({"case":case,"variant":variant,"aux":rec["name"],"variable":var,"references":all_references,"aux_variable_exists":var in variables},sort_keys=True))
                  assert targets,"Expected preserved archived diagnostic AuxKernel owners"
          print("ISSUE402_ORIGINAL_LOWERD_AUX_ARCHIVE_AUDIT_PASS")
          print("P2=NOT_RUN P3=NOT_RUN SCIENCE=SCIENCE_HOLD")
          PY
