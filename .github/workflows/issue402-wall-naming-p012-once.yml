name: Issue402 wall naming P0 P1 P2 one-shot
on:
  push:
    branches:
      - issue-402-species-functor-naming
    paths:
      - .github/workflows/issue402-wall-naming-p012-once.yml

permissions:
  contents: read

jobs:
  wall-naming-p012:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PINNED_BASE: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
    steps:
      - name: Checkout and verify one-shot exact head
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact Git source and P0/P1/P2-only contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f physics_app/ci/species_wall_functor_naming_smoke.i
          test -f tests/test_issue402_species_functor_naming.py
          printf 'SOURCE_SHA=%s\n' "$GITHUB_SHA"
          echo 'P3=NOT_RUN SCIENCE=SCIENCE_HOLD'
      - name: P0 species-wall source and producer-consumer negative tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'pytest>=8,<9'
          python3 -m pytest -q tests/test_issue402_species_functor_naming.py
          echo 'ISSUE402_WALL_NAMING_P0_PASS'
      - name: P1 build exact-head Native PhysicsApp
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$PINNED_BASE"
          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace \
            -v "$PWD:/workspace" "$PINNED_BASE" -lc '
            set -euo pipefail
            source /environment
            git config --global --add safe.directory /workspace
            export MOOSE_DIR=/opt/physics_vendor/moose
            export CRANE_DIR=/opt/physics_vendor/crane
            export SQUIRREL_DIR=/opt/physics_vendor/squirrel
            export ZAPDOS_DIR=/opt/physics_vendor/zapdos
            export METHOD=opt
            make -C physics_app -j2 app_non_unity_dirs="%/utils"
            test -x physics_app/physics-opt
          '
          echo 'ISSUE402_WALL_NAMING_P1_PASS'
      - name: P2 check species-first multi-ion and electron wall input only
        shell: bash
        run: |
          set -euo pipefail
          test -x physics_app/physics-opt
          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace \
            -v "$PWD:/workspace" "$PINNED_BASE" -lc '
            set -euo pipefail
            source /environment
            export MOOSE_DIR=/opt/physics_vendor/moose
            export CRANE_DIR=/opt/physics_vendor/crane
            export SQUIRREL_DIR=/opt/physics_vendor/squirrel
            export ZAPDOS_DIR=/opt/physics_vendor/zapdos
            physics_app/physics-opt --check-input -i physics_app/ci/species_wall_functor_naming_smoke.i
          '
          echo 'ISSUE402_WALL_NAMING_P2_PASS'
          echo 'P3=NOT_RUN SCIENCE=SCIENCE_HOLD'
