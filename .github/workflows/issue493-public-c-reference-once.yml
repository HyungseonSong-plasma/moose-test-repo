name: Issue493 C Only then Reference P4
on:
  push:
    branches: [feat/issue493-c-first-p4-reuse-b-20261111]
    paths: [.github/workflows/issue493-public-c-reference-once.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: issue493-c-only-reference-p4-first
  cancel-in-progress: false
jobs:
  issue493-public-p3-reference-c:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case: ['417', '941']
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    env:
      PINNED_SOURCE: 29d1acc6ef7969908b86719e4b95c73a1565136d
      PINNED_CANDIDATE: bebaf47a33ff5ee1d6b933d9691bf48f5ec0f947
      BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
      OXYGEN_RESEARCH_400: '1'
      OXYGEN_RESEARCH_FULL24: '0'
      OXYGEN_RESEARCH_EI2738_FORMULA: '0'
      OXYGEN_RESEARCH_QUICK_5MIN: '0'
      CHEM: experiments/Issue395_powered_chemistry_ladder
    steps:
      - name: Checkout exact reviewed public data and bounded P3 diagnostics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 1
      - name: Checkout original archived public S6 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 29d1acc6ef7969908b86719e4b95c73a1565136d
          path: historical
          fetch-depth: 1
      - name: Checkout immutable reviewed PhysicsApp candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: bebaf47a33ff5ee1d6b933d9691bf48f5ec0f947
          path: candidate
          fetch-depth: 1
      - name: Verify public rate/deck provenance before native build
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C historical rev-parse HEAD)" = "$PINNED_SOURCE"
          test "$(git -C candidate rev-parse HEAD)" = "$PINNED_CANDIDATE"
          test "$(git -C control rev-parse HEAD)" = "${{ github.sha }}"
          source candidate/physics_app/dependencies.lock
          test "$PHYSICS_BUILD_BASE" = "$BUILD_BASE_REF"
          python3 control/experiments/Issue493_s6_boltzmann/public_p2_check.py \
            --control control --mode preflight
          python3 control/experiments/Issue493_s6_boltzmann/test_public_p3_run.py
          python3 control/experiments/Issue493_s6_boltzmann/test_public_p3_artifacts.py
          echo ISSUE493_PUBLIC_P3_P0_PREFLIGHT_PASS
      - name: Set up research Python for historical mesh preparation
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare original 400 W public mesh without protected coefficients
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet \
            numpy==2.1.2 scipy==1.14.1 matplotlib==3.9.2
          python3 control/experiments/Issue493_s6_boltzmann/test_compare_native_reference.py
          cd historical
          SRC=.github/oxygen25_eedf/initial_mixture_23xsec_transport.txt
          DST=experiments/Issue91_real_qvt_r3/r3_e0/electron_moments.txt
          test "$(sha256sum "$SRC" | cut -d' ' -f1)" = 35534a522fa48ccb5222339c5040040630eef31e623e1c53f1e1c4540d2d653b
          cp "$SRC" "$DST"
          export CHATGPT_WORK_BASE_SHA="$PINNED_SOURCE"
          bash "$CHEM/issue397_l1_power_scan_replay.sh" prepare 400
          python3 .github/scripts/oxygen_legacy6_latest_100us.py --power-w 400 --prepare
          test -s "$CHEM/baseline_plasma_plus_unstructured_cover_plus_wafer.msh"
          test ! -e "$CHEM/private_rates"
          echo ISSUE493_PUBLIC_P3_MESH_PREP_PASS
      - name: Reuse pinned successful B P1 executable and complete library closure
        uses: actions/download-artifact@v4
        with:
          name: issue493-source-bound-binary-${{ matrix.case }}-f5880e27ea32facdf4c6a4486c482ea242ce415c
          run-id: 42992475581
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/issue493_binary_${{ matrix.case }}
      - name: Verify same binary and immutable OCI before fresh C
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$BUILD_BASE_REF"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.moose.sha" }}')" = "9f388366ccf38b9c34542ec5561198249fde0ac9"
          test ! -e candidate/physics_app/physics-opt
          cp "$RUNNER_TEMP/issue493_binary_${{ matrix.case }}/physics-opt" candidate/physics_app/physics-opt
          chmod 0755 candidate/physics_app/physics-opt
          DIR="$RUNNER_TEMP/issue493_binary_${{ matrix.case }}"
          test -f "$DIR/app-lib.tar.gz"
          (cd "$DIR" && sha256sum -c app-lib.tar.gz.sha256)
          tar -C candidate/physics_app -xzf "$DIR/app-lib.tar.gz"
          test -e candidate/physics_app/test/lib/libphysics_test-opt.so.0
          # B P1 SHA proves executable identity, not dynamic library closure.
          # Preflight on the SAME pinned OCI as --check-input, no solver.
          docker run --rm --network none --entrypoint /bin/bash --user 0:0 \
            --workdir /app --mount "type=bind,src=$PWD/candidate,dst=/app,readonly" \
            "$BUILD_BASE_REF" -lc '
              set -euo pipefail
              source /environment
              ldd /app/physics_app/physics-opt > /tmp/issue493-c-ldd.txt
              if grep -q "not found" /tmp/issue493-c-ldd.txt; then
                echo ISSUE493_C_SHARED_LIBRARY_CLOSURE_MISSING
                exit 127
              fi
            '
          echo ISSUE493_C_SHARED_LIBRARY_CLOSURE_PASS
          cp "$RUNNER_TEMP/issue493_binary_${{ matrix.case }}/p1.json" "$RUNNER_TEMP/issue493_p1_provenance.json"
          PYTHONPATH=control python3 - <<'PY'
          import os
          from pathlib import Path
          from physics_harness.execution.native_gates import require_p1_success
          record=require_p1_success(
              Path(os.environ["RUNNER_TEMP"])/"issue493_p1_provenance.json",
              source_root=Path("candidate"), binary=Path("candidate/physics_app/physics-opt"),
              source_sha="bebaf47a33ff5ee1d6b933d9691bf48f5ec0f947",
              image_ref="ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008")
          print("ISSUE493_C_SAME_B_BINARY_VERIFIED", record["binary_sha256"])
          PY
          # Do not accept a different executable from the selected source run.
          case "${{ matrix.case }}" in
            417) EXPECTED_BINARY_SHA=dc23d693ecdaf4dbf4ce86e0bd104e254e82bfb7d78761b650c8030a138c5058 ;;
            941) EXPECTED_BINARY_SHA=12e4cfd750d4cb66a959d30691baa27c116d447c5de1388cf9810df72d04dc01 ;;
            *) exit 2 ;;
          esac
          test "$(sha256sum candidate/physics_app/physics-opt | cut -d' ' -f1)" = "$EXPECTED_BINARY_SHA"
          echo ISSUE493_C_PINNED_SOURCE_RUN_BINARY_SHA_PASS
      - name: Execute 460-step C and archive verified public Exodus CSV
        shell: bash
        run: |
          set -euo pipefail
          python3 control/experiments/Issue493_s6_boltzmann/public_p3_run.py \
            --control control --candidate candidate --historical historical \
            --p1-evidence "$RUNNER_TEMP/issue493_p1_provenance.json" \
            --output "$RUNNER_TEMP/issue493_archive_C_${{ matrix.case }}" \
            --case "${{ matrix.case }}" --mode complete-c --authorize-full-p3 --timeout-seconds 20400
          python3 control/experiments/Issue493_s6_boltzmann/archive_public_p3_results.py \
            --status "$RUNNER_TEMP/issue493_archive_C_${{ matrix.case }}/non_sensitive_p3_status.json" \
            --run-root "$RUNNER_TEMP/issue493_archive_C_${{ matrix.case }}" \
            --publish-root "$RUNNER_TEMP/issue493_publish_C_${{ matrix.case }}" \
            --case "${{ matrix.case }}" --arm C
      - name: Save public reference comparisons for completed C
        shell: bash
        run: |
          set -euo pipefail
          PUBLISHED="$RUNNER_TEMP/issue493_publish_C_${{ matrix.case }}"
          test -s "$PUBLISHED/plasma.e"
          test -s "$PUBLISHED/plasma.csv"
          test -s "$PUBLISHED/manifest.json"
          # Do not change the Native P3 verdict if diagnostics cannot be rendered:
          # keep original Exodus, CSV and manifest downloadable.
          if python3 control/experiments/Issue493_s6_boltzmann/compare_native_reference.py \
            --exodus "$PUBLISHED/plasma.e" --csv "$PUBLISHED/plasma.csv" \
            --manifest "$PUBLISHED/manifest.json" \
            --reference-vertical control/experiments/Issue493_s6_boltzmann/reference/reference_vertical.csv \
            --reference-horizontal control/experiments/Issue493_s6_boltzmann/reference/reference_horizontal.csv \
            --output "$PUBLISHED/reference_comparison" \
            --label "S6-${{ matrix.case }}/C" --time-us 100; then
            echo ISSUE493_PUBLIC_REFERENCE_COMPARISON_PASS
          else
            rm -rf "$PUBLISHED/reference_comparison"
            echo '{"schema":"issue493_reference_comparison_status_v1","status":"HOLD_ANALYSIS_ERROR","science":"SCIENCE_HOLD"}' > "$PUBLISHED/reference_comparison_status.json"
            echo ISSUE493_PUBLIC_REFERENCE_COMPARISON_HOLD_NATIVE_P3_UNAFFECTED
          fi
      - name: Upload public C Exodus CSV and SHA manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue493-public-${{ matrix.case }}-C-results
          path: ${{ runner.temp }}/issue493_publish_C_${{ matrix.case }}/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Upload sanitized C status on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue493-c-status-${{ matrix.case }}-${{ github.sha }}
          path: ${{ runner.temp }}/issue493_archive_C_${{ matrix.case }}/non_sensitive_p3_status.json
          if-no-files-found: warn
          retention-days: 30

  issue493-public-p4-reference-compare:
    needs: issue493-public-p3-reference-c
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact public reference and P4 implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: control
      - name: Set up Python3.12 for reference comparison
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download retained verified S6-417 B result (no B solve)
        uses: actions/download-artifact@v4
        with:
          name: issue493-public-417-B-results
          run-id: 42925621978
          github-token: ${{ github.token }}
          path: public-results/issue493-public-417-B-results
      - name: Download retained verified S6-941 B result (no B solve)
        uses: actions/download-artifact@v4
        with:
          name: issue493-public-941-B-results
          run-id: 42925621978
          github-token: ${{ github.token }}
          path: public-results/issue493-public-941-B-results
      - name: Download C result artifacts from current C-only run
        uses: actions/download-artifact@v4
        with:
          pattern: issue493-public-*-C-results
          path: public-results
          merge-multiple: false
      - name: Compare B and C independently to versioned vertical/horizontal reference
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet numpy==2.1.2 scipy==1.14.1 matplotlib==3.9.2 netCDF4==1.7.2
          python3 control/experiments/Issue493_s6_boltzmann/test_compare_native_reference.py
          python3 control/experiments/Issue493_s6_boltzmann/p4_compare_reference.py \
            --artifacts-root public-results \
            --reference-root control/experiments/Issue493_s6_boltzmann/reference \
            --output "$RUNNER_TEMP/issue493_reference_p4"
          echo ISSUE493_REFERENCE_P4_ALL_FOUR_ARMS_MEASURED_SCIENCE_HOLD
      - name: Upload reference P4 metrics and B/C absolute plots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue493-public-reference-p4-${{ github.sha }}
          path: ${{ runner.temp }}/issue493_reference_p4/
          if-no-files-found: warn
          retention-days: 90
