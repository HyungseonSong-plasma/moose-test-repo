name: Issue633 S6 CI split guarded New-only 417 941 Native E2E smoke
on:
  push:
    branches: [issue-633-ci-route-e2e-smoke-20261118]
    paths: [.github/workflows/issue633-s6-ci-split-smoke-once.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: issue633-s6-ci-required-newonly-smoke
  cancel-in-progress: false
jobs:
  issue633_newonly_s6_native_p2_required:
    name: Issue633 New-only S6-417/941 protected Native P2 (REQUIRED)
    if: github.repository == 'HyungseonSong-plasma/moose-test-repo' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    permissions:
      contents: read
      actions: read
    env:
      HISTORICAL_SHA: '29d1acc6ef7969908b86719e4b95c73a1565136d'
      OCI: 'ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008'
      EXPECTED_HEAD: ${{ github.sha }}
    steps:
      - name: Checkout exact New-only PR source HEAD (not synthetic merge)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Extra smoke source custody preflight
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 183ec0a2389fe176f6b51507be506e5e597b04e5 HEAD
          test "$(git diff --name-only 183ec0a2389fe176f6b51507be506e5e597b04e5 HEAD)" = '.github/workflows/issue633-s6-ci-split-smoke-once.yml'
          git diff --exit-code 183ec0a2389fe176f6b51507be506e5e597b04e5 HEAD -- physics_app experiments/Issue402_plasma_dsl_g1/chemistry ci/guards
          echo SMOKE_SOURCE_EQUALS_PR_CANDIDATE_EXCEPT_E2E_WORKFLOW
      - name: Fail-closed New-only PR source and lane routing
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test ! -e physics_app/physics-opt
          test ! -e experiments/Issue395_powered_chemistry_ladder/private_rates
          grep -Fq "$OCI" physics_app/dependencies.lock
          python3 -m py_compile ci/issue633_required_newonly_s6_native_p2.py
          python3 ci/guards/issue633_s6_ci_route_guard.py --check --self-test
          echo REQUIRED_NEWONLY_SOURCE_AND_ROUTING_P0_PASS
      - name: Checkout immutable historical public S6 mesh and support source
        uses: actions/checkout@v4
        with:
          ref: 29d1acc6ef7969908b86719e4b95c73a1565136d
          path: historical
          fetch-depth: 1
          persist-credentials: false
      - name: Reproduce exact SHA-pinned 400 W public parent plasma mesh
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet \
            'pytest>=8,<9' 'pydantic>=2,<3' numpy==2.1.2 scipy==1.14.1 matplotlib==3.9.2 \
            -r requirements-evidence-engine.txt -r requirements-ontology.txt
          cd historical
          SRC=.github/oxygen25_eedf/initial_mixture_23xsec_transport.txt
          DST=experiments/Issue91_real_qvt_r3/r3_e0/electron_moments.txt
          echo "35534a522fa48ccb5222339c5040040630eef31e623e1c53f1e1c4540d2d653b  $SRC" | sha256sum --check -
          cp "$SRC" "$DST"
          export CHATGPT_WORK_BASE_SHA=29d1acc6ef7969908b86719e4b95c73a1565136d
          export OXYGEN_RESEARCH_400=1
          CHEM=experiments/Issue395_powered_chemistry_ladder
          bash "$CHEM/issue397_l1_power_scan_replay.sh" prepare 400
          python3 .github/scripts/oxygen_legacy6_latest_100us.py --power-w 400 --prepare
          echo "ac70642df75bf7b4bc4ec0d92511e545f0942f9e07a1361618fb9eb5696b83fc  $CHEM/baseline_plasma_plus_unstructured_cover_plus_wafer.msh" | sha256sum --check -
          test ! -e "$CHEM/private_rates"
          echo P05_PUBLIC_MESH_SHA_PASS
      - name: Download exact verified 417 941 P3-X public source and immutable diagnostic staging helper
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p05-in"
          curl --fail --location --silent --show-error --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/14406746397/zip" \
            --output "$RUNNER_TEMP/p05-in/p3x-source.zip"
          echo "592a7c82834bab841f6a2e1807db305d0eff1e953f50a0dcc6d7e21ff8820111  $RUNNER_TEMP/p05-in/p3x-source.zip" | sha256sum --check -
          curl --fail --location --silent --show-error --retry 3 \
            "https://raw.githubusercontent.com/HyungseonSong-plasma/moose-test-repo/41ab61e442a497db2388c025075237bd24cfd025/ci/issue671_p5_d8_native_probe.py" \
            --output "$RUNNER_TEMP/p05-in/pinned_source_stager.py"
          test "$(git hash-object "$RUNNER_TEMP/p05-in/pinned_source_stager.py")" = 8bf49b7807c9f9b3eed8e622e72062f2b5c822bc
          python3 -m py_compile "$RUNNER_TEMP/p05-in/pinned_source_stager.py"
          echo P05_PUBLIC_ARTIFACT_AND_STAGER_PIN_PASS
      - name: Stage real eleven-layer inputs with original mesh and support; exact P4-X owner cutover
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p05-in/staged"
          python3 "$RUNNER_TEMP/p05-in/pinned_source_stager.py" \
            --source "$GITHUB_WORKSPACE" --repo-head "$EXPECTED_HEAD" \
            --artifact "$RUNNER_TEMP/p05-in/p3x-source.zip" \
            --historical-mesh "$GITHUB_WORKSPACE/historical/experiments/Issue395_powered_chemistry_ladder/baseline_plasma_plus_unstructured_cover_plus_wafer.msh" \
            --historical-support-root "$GITHUB_WORKSPACE/historical" \
            --output "$RUNNER_TEMP/p05-in/staged" --stage-only
          python3 - "$RUNNER_TEMP/p05-in/staged" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/p05-in/p4_receipt.json" <<'PY'
          from pathlib import Path
          import sys,json,hashlib
          stage=Path(sys.argv[1]); root=Path(sys.argv[2]); out=Path(sys.argv[3])
          sys.path.insert(0,str(root/"experiments/Issue402_plasma_dsl_g1/chemistry"))
          from retire_s6_p4_duplicate_owners import retire_p4_duplicate_owners, C0, AFTER_SHA
          stages=json.loads((stage/"readiness.json").read_text())["stage_cases"]
          receipts={}
          for case in ("417","941"):
              folder=stage/"scratch"/case/"experiments"/"Issue395_powered_chemistry_ladder"
              raw_ordered=stages[case]["ordered"]
              ordered=[Path(p).name for p in raw_ordered]
              assert len(ordered)==11 and ordered[0]==C0 and len(set(ordered))==11
              sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
              baseline={n:sha(folder/n) for n in ordered}
              marker=folder/".issue633_disposable_scratch"
              assert not marker.is_symlink()
              if marker.exists():
                  assert marker.read_text().strip()=="issue633-scratch-only"
              else:
                  marker.write_text("issue633-scratch-only\n")
              js=json.loads((folder/"chemistry"/f"unified_s6_{case}_newonly.json").read_text())
              cut=retire_p4_duplicate_owners(folder,ordered,js,post_p3_layer_sha=baseline)
              assert sha(folder/C0)==AFTER_SHA
              assert all(sha(folder/n)==baseline[n] for n in ordered[1:])
              assert cut["retired_source_materials"]==6 and cut["carrier_one_preserved"]
              receipts[case]={"P4X":"P4X_7_OWNER_SOURCE_PASS","post_p4_C0_sha256":sha(folder/C0),
                              "retired_old_ion_FV":26,"retired_old_electron":10,
                              "retired_old_duplicate_materials":6,"carrier_one_preserved":True,
                              "ordered_inputs":raw_ordered,
                              "11_layer_sha256":{n:sha(folder/n) for n in ordered},
                              "JSON_sha256":sha(folder/"chemistry"/f"unified_s6_{case}_newonly.json"),
                              "parent_mesh_sha256":sha(folder/"baseline_plasma_plus_unstructured_cover_plus_wafer.msh")}
          out.write_text(json.dumps(receipts,indent=2,sort_keys=True)+"\n")
          print("P05_REAL_POST_P4X_STAGE_BOTH_CASES_11_LAYER_PASS")
          PY
      - name: P1 build exactly one current-PR-HEAD PhysicsApp ELF in pinned OCI
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          docker pull "$OCI"
          docker run --rm --network none --entrypoint /bin/bash --user 0:0 \
            --workdir /workspace -v "$GITHUB_WORKSPACE:/workspace" "$OCI" -lc '
              set -euo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt
              make -C physics_app -j2 app_non_unity_dirs="%/utils"
              test -x physics_app/physics-opt
            '
          sha256sum physics_app/physics-opt | tee "$RUNNER_TEMP/p05-in/current-head-physics-opt.sha256"
          echo REQUIRED_NEWONLY_P1_EXACT_HEAD_SINGLE_ELF_PASS
      - name: P2 REQUIRED actual protected S6-417 AND 941 Native --check-input using SAME ELF
        shell: bash
        env:
          PROTECTED_ARCHIVE_B64: ${{ secrets.OXYGEN24_RATES_TAR_XZ_B64 }}
        run: |
          set -euo pipefail
          umask 077
          python3 ci/issue633_required_newonly_s6_native_p2.py \
            --stage "$RUNNER_TEMP/p05-in/staged" \
            --expected-head "$EXPECTED_HEAD" \
            --out "$RUNNER_TEMP/issue633-newonly-native"
          echo ISSUE633_NEWONLY_S6_417_941_BOTH_REQUIRED_P2_PASS
      - name: Upload REQUIRED New-only dual-case sanitized Native receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue633-newonly-s6-417-941-required-native-${{ github.sha }}
          path: |
            ${{ runner.temp }}/issue633-newonly-native/status.json
            ${{ runner.temp }}/issue633-newonly-native/S6-417-native-P2.log
            ${{ runner.temp }}/issue633-newonly-native/S6-941-native-P2.log
            ${{ runner.temp }}/p05-in/p4_receipt.json
            ${{ runner.temp }}/p05-in/current-head-physics-opt.sha256
          if-no-files-found: error
          retention-days: 14
