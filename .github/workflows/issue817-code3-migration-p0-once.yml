# #817 temporary production-consumer migration P0; delete before upstream merge.
name: Issue817 Code3 active consumers migration P0 once

on:
  push:
    branches: [issue-817-code3-integrated-retirement-20261123]
    paths: ['.github/workflows/issue817-code3-migration-p0-once.yml']

permissions:
  contents: read

jobs:
  source_consumers_p0:
    name: Exact-head migrated electron source P0 and representative regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      SOURCE_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Source identity and canonical CI safety
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          python3 ci/workflow_harness.py --self-test
          python3 ci/workflow_harness.py --check
          python3 ci/guards/p6_ci_workflow_safety_guard.py --self-test --check
          python3 -m pip install --disable-pip-version-check --quiet \
            -r requirements-evidence-engine.txt -r requirements-ontology.txt
      - name: Compile changed scripts and source-level tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 -m compileall -q physics_app/ci experiments/Code3_electron_source_retirement experiments/historical_recipe_support/issue192_s5r.py experiments/Issue224_standard_source_projector_memory tests
          python3 -m unittest discover -s tests -p test_code3_electron_source_retirement.py -v 2>&1 | tee evidence/code3_historical_fixture.log
          python3 -m unittest discover -s tests -p test_issue817_code3_consumer_pairs.py -v 2>&1 | tee evidence/code3_consumer_pairs.log
          python3 -m unittest discover -s tests -p test_issue817_code3_s5r_normalized.py -v 2>&1 | tee evidence/code3_normalized_ledger.log
          python3 -m experiments.Issue224_standard_source_projector_memory.run --self-test > evidence/issue224_heavy_only.json
          python3 - <<'PY'
          from tests.characterization import test_issue192_s5r as t
          for name in dir(t):
              if name.startswith("test_s5r_"):
                  getattr(t,name)()
          print("ISSUE817_NEW_S5R_CHARACTERIZATION=PASS")
          PY
          python3 physics_app/ci/check_stage5_h05_runtime.py --self-test 2>&1 | tee evidence/h05.log
          python3 physics_app/ci/check_r2_o2_ionization_implementation.py --self-test 2>&1 | tee evidence/r2.log
          python3 physics_app/ci/check_stage5_ei20_runtime.py --self-test 2>&1 | tee evidence/ei20.log
          python3 physics_app/ci/check_stage5_edetach_runtime.py --self-test 2>&1 | tee evidence/edetach.log
          echo "ISSUE817_MIGRATED_ACTIVE_CONSUMERS_PRECUT_P0_PASS"
      - name: Upload sanitized text P0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue817-migration-p0-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: evidence/
          retention-days: 30
          if-no-files-found: warn
