# #817 exact-head current-MOOSE EI16 EI20 EDETACH energy bridge P0; TEMPORARY.
name: Issue817 Code3 postcut exact-head active consumer P0 once

on:
  push:
    branches: [issue-817-code3-integrated-retirement-20261123]
    paths: ['.github/workflows/issue817-code3-migration-p0-once.yml']

permissions:
  contents: read

jobs:
  source_consumers_p0:
    name: Code3 C H absent, 11 C 16 Factory and owner correctness P0
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      SOURCE_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Source identity and canonical CI safety
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          python3 ci/workflow_harness.py --self-test
          python3 ci/workflow_harness.py --check
          python3 ci/guards/p6_ci_workflow_safety_guard.py --self-test --check
          python3 -m pip install --disable-pip-version-check --quiet \
            -r requirements-evidence-engine.txt -r requirements-ontology.txt
      - name: Compile changed scripts and source-level tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 -m compileall -q physics_app/ci experiments/Code3_electron_source_retirement experiments/historical_recipe_support/issue192_s5r.py experiments/Issue224_standard_source_projector_memory tests
          python3 -m unittest discover -s tests -p test_issue817_code3_retirement.py -v 2>&1 | tee evidence/issue817_postcut_guard.log
          python3 -m unittest discover -s tests -p test_issue774_newonly_fvkernel_retirement.py -v 2>&1 | tee evidence/d9_source_inventory.log
          python3 -m unittest discover -s tests -p test_fvkernel_native_usage_census.py -v 2>&1 | tee evidence/native_factory_census.log
          python3 ci/guards/issue817_code3_retirement.py --expected-head "$SOURCE_HEAD" --output evidence/issue817_postcut_receipt.json
          python3 -m unittest discover -s tests -p test_code3_electron_source_retirement.py -v 2>&1 | tee evidence/code3_historical_fixture.log
          python3 -m unittest discover -s tests -p test_issue817_code3_consumer_pairs.py -v 2>&1 | tee evidence/code3_consumer_pairs.log
          python3 -m unittest discover -s tests -p test_issue817_code3_s5r_normalized.py -v 2>&1 | tee evidence/code3_normalized_ledger.log
          python3 -m unittest discover -s tests -p test_issue817_energy_only_negatives.py -v 2>&1 | tee evidence/ei18_ei19_semantic_negatives.log
          python3 -m unittest discover -s tests -p test_issue817_electron_energy_logmolar_bridge.py -v 2>&1 | tee evidence/electron_energy_bridge_tests.log
          python3 physics_app/ci/check_e8_ei16_energy_runtime.py --self-test 2>&1 | tee evidence/ei16_static.log
          python3 physics_app/ci/check_stage5_ei18_runtime.py --self-test 2>&1 | tee evidence/ei18_static.log
          python3 - <<'PY' 2>&1 | tee evidence/ei19_static.log
          from physics_app.ci import check_e8_elastic_ei19_runtime as ei19
          from physics_app.ci.check_issue817_electron_source_absence import assert_no_electron_particle_source
          text = ei19._ei19_input()
          assert f"v = {ei19.EI19['progress']}" in text
          assert_no_electron_particle_source(text,channel="EI19")
          print("ISSUE817_EI19_SEMANTIC_NO_ELECTRON_PARTICLE_SOURCE_P0_PASS")
          PY
          python3 -m experiments.Issue224_standard_source_projector_memory.run --self-test > evidence/issue224_heavy_only.json
          python3 - <<'PY'
          from tests.characterization import test_issue192_s5r as t
          for name in dir(t):
              if name.startswith("test_s5r_"):
                  getattr(t,name)()
          print("ISSUE817_NEW_S5R_CHARACTERIZATION=PASS")
          PY
          python3 physics_app/ci/check_stage5_h05_runtime.py --self-test 2>&1 | tee evidence/h05.log
          python3 physics_app/ci/check_r2_o2_ionization_implementation.py --self-test 2>&1 | tee evidence/r2.log
          python3 physics_app/ci/check_stage5_ei20_runtime.py --self-test 2>&1 | tee evidence/ei20.log
          python3 physics_app/ci/check_stage5_edetach_runtime.py --self-test 2>&1 | tee evidence/edetach.log
          python3 - <<'PY'
          from physics_app.ci import check_stage5_h05_runtime as h05
          from physics_app.ci import check_r2_o2_ionization_implementation as r2
          from physics_app.ci import check_stage5_ei20_runtime as ei20
          h05.static_gate()
          r2.static_implementation_gate()
          ei20.static_gate()
          print("ISSUE817_POSTCUT_ACTIVE_CI_STATIC_GATES_PASS")
          PY
          echo "ISSUE817_POSTCUT_ALL_TRACKED_FACTORY_GATES_PASS"
      - name: Upload sanitized text P0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue817-migration-p0-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: evidence/
          retention-days: 30
          if-no-files-found: warn
