name: Issue-236 apply reviewed code fixes once

on:
  push:
    branches: [issue-236-m1a-multiapp-smoke]
    paths:
      - '.github/workflows/issue236-review-fixes-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Apply and validate reviewed Issue-236 code fixes
        shell: bash
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/issue236_apply_review_fixes.py
          python3 -m py_compile \
            experiments/historical_recipe_support/issue192_s5r.py \
            experiments/Issue236_m1a_multiapp_smoke/run.py \
            experiments/Issue236_m1a_multiapp_smoke/run_live_ci_nochem.py \
            tests/characterization/test_issue192_s5r_energy_transport.py
          python3 -m pip install --disable-pip-version-check --quiet pytest
          PYTHONPATH="$GITHUB_WORKSPACE" python3 -m pytest -q \
            tests/characterization/test_issue192_s5r.py \
            tests/characterization/test_issue192_s5r_energy_transport.py
          PYTHONPATH="$GITHUB_WORKSPACE" python3 \
            experiments/Issue236_m1a_multiapp_smoke/run_live_ci_nochem.py --self-test

          rm tools/issue236_apply_review_fixes.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Issue 236: apply review fixes and canonical energy drift [skip ci]"
          git remote set-url origin "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${GITHUB_REF_NAME}"
