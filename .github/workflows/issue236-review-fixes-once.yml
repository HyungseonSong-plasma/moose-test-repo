name: Issue-236 apply reviewed code fixes once

on:
  push:
    branches: [issue-236-m1a-multiapp-smoke]
    paths:
      - '.github/workflows/issue236-review-fixes-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Apply reviewed Issue-236 code fixes
        shell: bash
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one replacement target, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          canonical = "experiments/historical_recipe_support/issue192_s5r.py"
          replace_once(
              canonical,
              '        "FVKernels/s5r_n_epsilon_diffusion",\n    ):',
              '        "FVKernels/s5r_n_epsilon_diffusion",\n        "FVKernels/s5r_n_epsilon_drift",\n    ):',
          )
          replace_once(
              canonical,
              '''    text = _insert_kernel(\n        text,\n        "s5r_n_epsilon_diffusion",\n        """    type = FVDiffusion\n    variable = n_epsilon\n    coeff = electron_energy_diffusion\n    block = plasma""",\n    )\n    return text\n''',
              '''    text = _insert_kernel(\n        text,\n        "s5r_n_epsilon_diffusion",\n        """    type = FVDiffusion\n    variable = n_epsilon\n    coeff = electron_energy_diffusion\n    block = plasma""",\n    )\n    text = _insert_kernel(\n        text,\n        "s5r_n_epsilon_drift",\n        """    type = PhysicsFVElectrostaticDrift\n    variable = n_epsilon\n    mobility = electron_energy_mobility\n    block = plasma""",\n    )\n    for parameter in (\n        "potential",\n        "carrier",\n        "charge_number",\n        "advected_interp_method",\n        "boundaries_to_avoid",\n        "block",\n    ):\n        value = mp.get_parameter(text, "FVKernels/n_e_drift", parameter)\n        if value is None:\n            raise Issue192S5RError(\n                f"particle drift lacks required energy-transport topology parameter {parameter!r}"\n            )\n        text = mp.upsert_parameter(\n            text, "FVKernels/s5r_n_epsilon_drift", parameter, value\n        )\n    return text\n''',
          )
          audit_anchor = '    checks["solved_poisson_feedback_preserved"] = (\n'
          audit_insert = '''    energy_drift_path = "FVKernels/s5r_n_epsilon_drift"\n    particle_drift_path = "FVKernels/n_e_drift"\n    energy_drift_topology = (\n        "potential",\n        "carrier",\n        "charge_number",\n        "advected_interp_method",\n        "boundaries_to_avoid",\n        "block",\n    )\n    checks["solved_energy_transport_complete"] = (\n        mb.has_block(text, "FVKernels/s5r_n_epsilon_time")\n        and mb.has_block(text, "FVKernels/s5r_n_epsilon_diffusion")\n        and mb.has_block(text, energy_drift_path)\n        and mp.get_parameter(text, energy_drift_path, "type")\n        == "PhysicsFVElectrostaticDrift"\n        and mp.get_parameter(text, energy_drift_path, "variable") == "n_epsilon"\n        and mp.get_parameter(text, energy_drift_path, "mobility")\n        == "electron_energy_mobility"\n        and all(\n            mp.get_parameter(text, energy_drift_path, parameter)\n            == mp.get_parameter(text, particle_drift_path, parameter)\n            for parameter in energy_drift_topology\n        )\n    )\n\n'''
          replace_once(canonical, audit_anchor, audit_insert + audit_anchor)

          test_path = Path("tests/characterization/test_issue192_s5r_energy_transport.py")
          if test_path.exists():
              raise RuntimeError(f"unexpected existing test: {test_path}")
          test_path.write_text('''from __future__ import annotations\n\nfrom pathlib import Path\n\nfrom experiments.historical_recipe_support.issue192_s5r import (\n    audit_s5r_input,\n    build_s5r_input,\n)\nfrom physics_harness.adapters.moose import blocks as mb\nfrom physics_harness.adapters.moose import parameters as mp\n\nROOT = Path(__file__).resolve().parents[2]\nBASE = ROOT / "experiments/Issue91_real_qvt_r3/r3_e0/heavy_base.i"\nENERGY_DRIFT = "FVKernels/s5r_n_epsilon_drift"\nPARTICLE_DRIFT = "FVKernels/n_e_drift"\nTOPOLOGY = (\n    "potential",\n    "carrier",\n    "charge_number",\n    "advected_interp_method",\n    "boundaries_to_avoid",\n    "block",\n)\n\n\ndef _build() -> str:\n    text, _meta = build_s5r_input(BASE.read_text())\n    return text\n\n\ndef test_s5r_energy_transport_has_time_diffusion_and_drift() -> None:\n    text = _build()\n    assert mb.has_block(text, "FVKernels/s5r_n_epsilon_time")\n    assert mb.has_block(text, "FVKernels/s5r_n_epsilon_diffusion")\n    assert mb.has_block(text, ENERGY_DRIFT)\n    assert mp.get_parameter(text, ENERGY_DRIFT, "type") == "PhysicsFVElectrostaticDrift"\n    assert mp.get_parameter(text, ENERGY_DRIFT, "variable") == "n_epsilon"\n    assert mp.get_parameter(text, ENERGY_DRIFT, "mobility") == "electron_energy_mobility"\n    assert audit_s5r_input(text)["checks"]["solved_energy_transport_complete"] is True\n\n\ndef test_s5r_energy_drift_matches_particle_topology() -> None:\n    text = _build()\n    for parameter in TOPOLOGY:\n        assert mp.get_parameter(text, ENERGY_DRIFT, parameter) == mp.get_parameter(\n            text, PARTICLE_DRIFT, parameter\n        )\n\n\ndef test_s5r_energy_drift_mutation_fails_audit() -> None:\n    text = _build()\n    mutated = mp.upsert_parameter(text, ENERGY_DRIFT, "charge_number", "1")\n    mutated_audit = audit_s5r_input(mutated)\n    assert mutated_audit["status"] == "FAIL"\n    assert mutated_audit["checks"]["solved_energy_transport_complete"] is False\n''')

          nochem = "experiments/Issue236_m1a_multiapp_smoke/run_live_ci_nochem.py"
          p = Path(nochem)
          text = p.read_text()
          text = text.replace(
              "source/sink kernels from the fast child and restores the missing conservative\n"
              "electron-energy electrostatic drift term.",
              "source/sink kernels from the fast child and requires the canonical conservative\n"
              "electron-energy electrostatic drift term.",
          )
          pattern = r'\n\ndef _restore_energy_drift\(text: str\) -> str:\n.*?(?=\n\ndef _energy_drift_matches_particle_topology)'
          text, count = re.subn(pattern, "", text, count=1, flags=re.S)
          if count != 1:
              raise RuntimeError(f"{nochem}: failed to remove temporary drift-restoration function")
          old_build = '''def _build_child_input(production_text: str, *, dt_e: float) -> str:\n    """Build the no-chemistry child and restore the complete energy transport pair."""\n    text = _dr_build_child_input(production_text, dt_e=dt_e)\n    text = _restore_energy_drift(text)\n    return _remove_volumetric_electron_chemistry(text)\n'''
          new_build = '''def _build_child_input(production_text: str, *, dt_e: float) -> str:\n    """Build the no-chemistry child while preserving canonical energy transport."""\n    text = _dr_build_child_input(production_text, dt_e=dt_e)\n    if not base.mb.has_block(text, _ENERGY_DRIFT):\n        raise base.Issue236Error(\n            "canonical Stage-5 child lacks electron-energy electrostatic drift"\n        )\n    if not _energy_drift_matches_particle_topology(text):\n        raise base.Issue236Error(\n            "canonical electron-energy drift does not match particle-drift topology"\n        )\n    return _remove_volumetric_electron_chemistry(text)\n'''
          if old_build not in text:
              raise RuntimeError(f"{nochem}: build-child replacement target missing")
          p.write_text(text.replace(old_build, new_build, 1))

          run_py = "experiments/Issue236_m1a_multiapp_smoke/run.py"
          replace_once(
              run_py,
              '''def self_test() -> dict[str, Any]:\n    checks: dict[str, bool] = {}\n    parent, child, meta = build_split(dt_e=DT_E_SMOKE_S)\n    checks["split_builds"] = True\n''',
              '''def self_test() -> dict[str, Any]:\n    checks: dict[str, bool] = {}\n    try:\n        parent, child, meta = build_split(dt_e=DT_E_SMOKE_S)\n    except Issue236Error as error:\n        detail = error.args[0] if error.args else str(error)\n        return {\n            "status": "FAIL",\n            "checks": {"split_builds": False},\n            "failed_checks": ["split_builds"],\n            "detail": {"split_error": detail},\n        }\n    checks["split_builds"] = True\n''',
          )
          replace_once(
              run_py,
              '''    (case_dir / "electron_sub.i").write_text(child, encoding="utf-8")\n    meta["staging"] = stage\n''',
              '''    (case_dir / "electron_sub.i").write_text(child, encoding="utf-8")\n    w5.s5r._copy_runtime_assets(case_dir)\n    meta["staging"] = stage\n''',
          )

          readme = "experiments/Issue236_m1a_multiapp_smoke/README.md"
          replace_once(
              readme,
              '''Parent:\n- synchronization/state-carrier only for M1-A (`solve = false`);\n- heavy/gas state is frozen over one parent interval;\n- `dt_h = 1e-8 s`.\n''',
              '''Parent:\n- owns and executes the slow heavy/flow nonlinear solve (`solve = true`);\n- owns the heavy solver variables and their time kernels;\n- carries `n_e`, `n_epsilon`, and `potential_plasma` only as fast-state auxiliary mirrors;\n- `dt_h = 1e-8 s`.\n''',
          )
          replace_once(
              readme,
              '''- transferred FV auxiliary mirrors: `p`, `w_O2s`, `w_O2p`, `w_O`, `w_Om`, `w_Op`, `w_Os`\n  (plus `u`, `v` as inert mirrors for structural compatibility);\n''',
              '''- transferred FV auxiliary mirrors: `p`, `w_O2s`, `w_O2p`, `w_O`, `w_Om`, `w_Op`, `w_Os`;\n- flow velocities `u`, `v` are not solved or mirrored in the fast child;\n''',
          )
          replace_once(
              readme,
              '''- parent has no nonlinear solver-variable ownership;\n''',
              '''- parent owns the heavy/flow nonlinear variables while fast variables are auxiliary mirrors only;\n''',
          )
          PY

          python3 -m py_compile \
            experiments/historical_recipe_support/issue192_s5r.py \
            experiments/Issue236_m1a_multiapp_smoke/run.py \
            experiments/Issue236_m1a_multiapp_smoke/run_live_ci_nochem.py \
            tests/characterization/test_issue192_s5r_energy_transport.py

          PYTHONPATH="$GITHUB_WORKSPACE" python3 -m pytest -q \
            tests/characterization/test_issue192_s5r.py \
            tests/characterization/test_issue192_s5r_energy_transport.py

          PYTHONPATH="$GITHUB_WORKSPACE" python3 \
            experiments/Issue236_m1a_multiapp_smoke/run_live_ci_nochem.py --self-test

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            experiments/historical_recipe_support/issue192_s5r.py \
            experiments/Issue236_m1a_multiapp_smoke/run.py \
            experiments/Issue236_m1a_multiapp_smoke/run_live_ci_nochem.py \
            experiments/Issue236_m1a_multiapp_smoke/README.md \
            tests/characterization/test_issue192_s5r_energy_transport.py
          git commit -m "Issue 236: apply review fixes and canonical energy drift [skip ci]"
          git remote set-url origin "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${GITHUB_REF_NAME}"
