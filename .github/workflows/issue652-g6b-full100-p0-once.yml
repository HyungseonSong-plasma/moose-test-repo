name: Issue652 G6B 417 941 full100 preflight P0 branch-only
on:
  push:
    branches: [issue-652-g6b-publicd100-parallel-full100-20261123]
    paths: [.github/workflows/issue652-g6b-full100-p0-once.yml]
permissions:
  contents: read
jobs:
  full100-p0:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact reviewed candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact SHA and protected-rate absence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -e experiments/Issue395_powered_chemistry_ladder/private_rates
      - name: Run all G6B 100-row and full100 strict controls without Native
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet 'pytest>=8,<9'
          python3 -m pytest -q \
            tests/test_issue652_g6b_parallel_cases.py \
            tests/test_issue652_poisson_g6b_publicd100.py \
            tests/test_issue652_g6b_full100.py
          python3 -m py_compile \
            ci/guards/issue652_g6b_full100_case.py \
            ci/guards/issue652_g6b_full100_aggregate.py
          echo G6B_FULL100_STRICT_P0_TESTS_PASS_FLOAT_TOLERANCE_NO_PROTECTED_NATIVE
