# Next independent R4-QF1 / E1 / E2a diagnostic: automatic_scaling=false\n# applied only to research-projected inputs, not historical source.
# Direct historical heavy base contains nonregistered BaseMaterial and cannot run.\n# Differential experiment: same historical 2D geometry and runtime, compare
# heavy_base -> E1 energy time -> E2a D=0/100; no scientific approval.
# Research-only historical 2-D RZ E2a replay using explicitly audited\n# modern PhysicsApp object registration names; original input preserved.\n# Run after exact-head CI; no scientific equivalence claim or package work.
# The existing 1-D cosine numerical PASS is NOT automatically 2-D scientific PASS.
name: Issue282 RZ R4-QF1/E1/E2a fault localization once
run-name: Issue282 RZ R4QF1 E1 E2a native crash localization

on:
  push:
    branches: [main]
    paths: [.github/workflows/issue282-rz-segv-diff-once.yml]

permissions:
  contents: read

concurrency:
  group: issue282-rz-segv-diff-once
  cancel-in-progress: false

jobs:
  historical-rz-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout immutable triggered Physics source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Validate source SHA, workflow gate, and historical construction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python3 ci/guards/workflow_surface_guard.py --check
          python3 -m py_compile experiments/Issue282_e2a_rz_bridge/run_native.py experiments/Issue282_e2a_rz_bridge/diagnose_segv.py
          python3 -m venv .issue282-rz-venv
          .issue282-rz-venv/bin/python -m pip install --disable-pip-version-check -r requirements-evidence-engine.txt -r requirements-ontology.txt 'pytest==8.3.4' 'pydantic==2.10.6' 'numpy==2.1.2' 'netCDF4==1.7.3'
          .issue282-rz-venv/bin/python -m pytest -q tests/characterization/test_issue282_historical_e2a_rz_bridge.py
          python3 -m py_compile experiments/Issue282_e2a_rz_bridge/research_type_bridge.py
      - name: Pin and pull the real PhysicsApp runtime
        shell: bash
        run: |
          set -euo pipefail
          image='ghcr.io/hyungseonsong-plasma/physics-runtime@sha256:cda9f0d09a17aed5fa606e97d1ee5c3450f7280536cec2e5c635402bb07d972c'
          docker pull "$image"
          mkdir -p experiments/Issue282_e2a_rz_bridge/results
          docker image inspect "$image" --format '{{json .RepoDigests}}' > experiments/Issue282_e2a_rz_bridge/results/image-digests.json
      - name: P2 and P3 differential baseline E1 E2a D0 D100
        shell: bash
        run: |
          set -euo pipefail
          .issue282-rz-venv/bin/python experiments/Issue282_e2a_rz_bridge/diagnose_segv.py 2>&1 |
            tee experiments/Issue282_e2a_rz_bridge/diagnostic-driver.log
      - name: Preserve inputs, logs, original mesh, CSV and Exodus even if rejected
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue282-rz-heavy-e1-e2a-diagnostic
          path: |
            experiments/Issue282_e2a_rz_bridge/segv_differential_results/**
            experiments/Issue282_e2a_rz_bridge/diagnostic-driver.log
          if-no-files-found: warn
          retention-days: 30
