# Evidence only. Public D 417/941 native --check-input under 100-row and 42-row
# separately. DO NOT interpret 42-row substitution as scientific approval.
name: Issue672 P6-D2D4 original100 and prepared42 separate P2 with typed Warehouse
on:
  push:
    branches:
      - issue-672-d2d4-public-d-original100-authority-p2-20261118
    paths:
      - .github/workflows/issue672-d2d4-original100-prepared42-p2-typed-once.yml
permissions:
  contents: read
concurrency:
  group: issue672-p6-d2d4-dual-authority-typed-native-once
  cancel-in-progress: false
jobs:
  public-d-dual-input-p2:
    if: github.repository == 'HyungseonSong-plasma/moose-test-repo' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    env:
      SOURCE_SHA: 'ed8a48f26aeccb1f84c7103beda1039fdceceab1'
      HIST_SHA: '29d1acc6ef7969908b86719e4b95c73a1565136d'
      PARENT_SHA: '52067302d16074592503d0ef6b903cc344f55a08'
      OCI: 'ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008'
      OXYGEN_RESEARCH_400: '1'
      OXYGEN_RESEARCH_FULL24: '0'
      OXYGEN_RESEARCH_EI2738_FORMULA: '0'
      OXYGEN_RESEARCH_QUICK_5MIN: '0'
    steps:
      - name: Validate branch-only temporary workflow and exact checkout pins
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/issue-672-d2d4-public-d-original100-authority-p2-20261118"
          test "$GITHUB_REPOSITORY" = "HyungseonSong-plasma/moose-test-repo"
      - name: Checkout immutable isolated D4 candidate derived from PR684
        uses: actions/checkout@v4
        with:
          ref: ed8a48f26aeccb1f84c7103beda1039fdceceab1
          path: control
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout immutable historical Public D S6
        uses: actions/checkout@v4
        with:
          ref: 29d1acc6ef7969908b86719e4b95c73a1565136d
          path: historical
          fetch-depth: 1
          persist-credentials: false
      - name: Pin exact P6-D4 candidate, historical Lookup origin, and immutable OCI
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C control rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C historical rev-parse HEAD)" = "$HIST_SHA"
          test ! -e control/physics_app/physics-opt
          test ! -d historical/experiments/Issue395_powered_chemistry_ladder/private_rates
          grep -Fq "$OCI" control/physics_app/dependencies.lock
          test "$(git -C control rev-parse HEAD:physics_app/src/physics/plasma/DDContinuityEq.C)" = "958bee0bc7069319b2e9c1a54037f5c38d01453b"
          echo "994f6b1deece3c53be7fb3e7f9526555d0f9314fd58749bea6346639f08aa387  historical/experiments/Issue91_real_qvt_r3/r3_e0/electron_moments.txt" | sha256sum -c -
          echo "35534a522fa48ccb5222339c5040040630eef31e623e1c53f1e1c4540d2d653b  historical/.github/oxygen25_eedf/initial_mixture_23xsec_transport.txt" | sha256sum -c -
          mkdir -p d5_evidence/lookup42 d5_evidence/lookup100
          printf '%s\n' "$SOURCE_SHA" > d5_evidence/exact_PR684_head.txt
          printf '%s\n' "$PARENT_SHA" > d5_evidence/parent_PR665_head.txt
          echo "D5_TWO_DISTINCT_ORIGINAL_TABLE_SHA_PINNED"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original Public D P2 evidence dependencies
        run: >-
          python3 -m pip install --disable-pip-version-check --quiet
          'pytest>=8,<9' 'pydantic>=2,<3'
          numpy==2.1.2 scipy==1.14.1 matplotlib==3.9.2
          -r control/requirements-evidence-engine.txt
          -r control/requirements-ontology.txt
      - name: Run PR684 source regression and official P0/environment gate
        shell: bash
        run: |
          set -euo pipefail
          cd control
          python3 -m py_compile experiments/Issue402_plasma_dsl_g1/p6_d4_public_d_chemistry_scratch.py experiments/Issue402_plasma_dsl_g1/public_option_s6_p2.py
          python3 -m pytest -q tests/test_issue672_p6_d1_transport_owner_cutover.py
          EXPECTED_SOURCE_HEAD="$SOURCE_SHA" bash experiments/Issue402_plasma_dsl_g1/preflight_public_option_s6.sh
          E=experiments/Issue402_plasma_dsl_g1/evidence
          test -s "$E/option_s6_environment.json"
          cp "$E/option_s6_environment.json" "$GITHUB_WORKSPACE/d5_evidence/lookup42/"
          cp "$E/option_s6_environment.json" "$GITHUB_WORKSPACE/d5_evidence/lookup100/"
      - name: Prepare source-bound historical 400W mesh (not solver)
        shell: bash
        run: |
          set -euo pipefail
          cd historical
          CHEM=experiments/Issue395_powered_chemistry_ladder
          SRC=.github/oxygen25_eedf/initial_mixture_23xsec_transport.txt
          DST=experiments/Issue91_real_qvt_r3/r3_e0/electron_moments.txt
          cp "$SRC" "$DST"
          echo "35534a522fa48ccb5222339c5040040630eef31e623e1c53f1e1c4540d2d653b  $DST" | sha256sum -c -
          export CHATGPT_WORK_BASE_SHA="$HIST_SHA"
          bash "$CHEM/issue397_l1_power_scan_replay.sh" prepare 400
          python3 .github/scripts/oxygen_legacy6_latest_100us.py --power-w 400 --prepare
          test -s "$CHEM/baseline_plasma_plus_unstructured_cover_plus_wafer.msh"
          test ! -d "$CHEM/private_rates"
          sha256sum "$CHEM/baseline_plasma_plus_unstructured_cover_plus_wafer.msh" > "$GITHUB_WORKSPACE/d5_evidence/mesh.sha256"
      - name: Compile one isolated D2/D4 exact-source PhysicsApp with read-only P05 diagnostic
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$OCI"
          mkdir -p control/experiments/Issue402_plasma_dsl_g1/evidence
          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace \
            --mount "type=bind,src=$PWD/control,dst=/workspace" "$OCI" -lc '
              set -euo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt
              make -C physics_app -j2 app_non_unity_dirs="%/utils"
              test -x physics_app/physics-opt
            ' 2>&1 | tee control/experiments/Issue402_plasma_dsl_g1/evidence/native_build.log
          python3 - <<'PY'
          import hashlib,json,pathlib,os
          root=pathlib.Path("control")
          e=root/"experiments/Issue402_plasma_dsl_g1/evidence"
          binary=root/"physics_app/physics-opt"
          def sha(path):
              with path.open("rb") as f:return hashlib.file_digest(f,"sha256").hexdigest()
          p={"schema":"issue402.native_p1.job_local.v1","source_sha":os.environ["SOURCE_SHA"],
             "oci_image":os.environ["OCI"],"binary_sha256":sha(binary),
             "build_log_sha256":sha(e/"native_build.log"),"reusable_scope":"same_exact_head_ci_job_only",
             "P1":"PASS","P3":"NOT_RUN","science":"SCIENCE_HOLD"}
          (e/"native_p1_identity.json").write_text(json.dumps(p,indent=2,sort_keys=True)+"\n")
          pathlib.Path("d5_evidence/binary_sha256.txt").write_text(p["binary_sha256"]+"\n")
          print("D5_SINGLE_ELF",p["binary_sha256"])
          PY
      - name: P0 exact data source dual authority and 5/3 energy contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,pathlib,subprocess
          from math import isfinite
          root=pathlib.Path.cwd()
          cases=[
            ("original100","historical/experiments/Issue91_real_qvt_r3/r3_e0/electron_moments.txt",
             "35534a522fa48ccb5222339c5040040630eef31e623e1c53f1e1c4540d2d653b",42),
            ("prepared42","historical/.github/oxygen25_eedf/initial_mixture_23xsec_transport.txt",
             "35534a522fa48ccb5222339c5040040630eef31e623e1c53f1e1c4540d2d653b",42),
          ]
          original=(root/"historical/.github/oxygen25_eedf/initial_mixture_23xsec_transport.txt").read_bytes()
          assert hashlib.sha256(original).hexdigest()=="35534a522fa48ccb5222339c5040040630eef31e623e1c53f1e1c4540d2d653b"
          pristine=subprocess.check_output(["git","-C","historical","show",
            "29d1acc6ef7969908b86719e4b95c73a1565136d:experiments/Issue91_real_qvt_r3/r3_e0/electron_moments.txt"])
          assert hashlib.sha256(pristine).hexdigest()=="994f6b1deece3c53be7fb3e7f9526555d0f9314fd58749bea6346639f08aa387"
          assert pristine!=original
          for text,rows,start,end in [(pristine,100,1.40991,22.1378),
                                       (original,42,1.658212908,22.3312233)]:
            data=[tuple(map(float,s.split())) for s in text.decode().splitlines() if s.strip()]
            assert len(data)==rows and all(len(x)==3 and all(map(isfinite,x)) for x in data)
            assert data[0][0]==start and data[-1][0]==end
            assert all(data[i][0]<data[i+1][0] for i in range(rows-1))
          app=root/"control/physics_app/src/materials/DDTransportMaterial.C"
          dd=root/"control/physics_app/src/physics/plasma/DDContinuityEq.C"
          energy=root/"control/physics_app/src/physics/plasma/DDEnergyEq.C"
          assert "constexpr Real energy_factor = 5.0 / 3.0;" in app.read_text()
          assert 'params.set<bool>("fluid_energy") = fluid || legacy_fluid;' in dd.read_text()
          assert 'transport.set<MooseFunctorName>("mobility") = "e_energy_mobility";' in energy.read_text()
          assert 'transport.set<MooseFunctorName>("diffusion") = "e_energy_diffusivity";' in energy.read_text()
          driver=(root/"control/experiments/Issue402_plasma_dsl_g1/public_option_s6_p2.py").read_text()
          pilot=(root/"control/experiments/Issue402_plasma_dsl_g1/p6_d4_public_d_chemistry_scratch.py").read_text()
          assert all(q in driver and q in pilot for q in
                 ("original100","prepared42","994f6b1deece3c53be7fb3e7f9526555d0f9314fd58749bea6346639f08aa387",
                  "35534a522fa48ccb5222339c5040040630eef31e623e1c53f1e1c4540d2d653b"))
          print("P6_D2_D4_ORIGINAL100_PREPARED42_DISTINCT_AUTHORITY_P0_PASS")
          print("P6_D4_ENERGY_FLUID_5_OVER_3_SOURCE_CONTRACT_PASS")
          PY
      - name: Variant A exact prepared 42-row table Public B and D 417/941 P2
        shell: bash
        run: |
          set -euo pipefail
          lookup=historical/experiments/Issue91_real_qvt_r3/r3_e0/electron_moments.txt
          echo "35534a522fa48ccb5222339c5040040630eef31e623e1c53f1e1c4540d2d653b  $lookup" | sha256sum -c -
          cd control
          set +e
          python3 experiments/Issue402_plasma_dsl_g1/public_option_s6_p2.py \
            --historical "$GITHUB_WORKSPACE/historical" \
            --binary "$GITHUB_WORKSPACE/control/physics_app/physics-opt" \
            --expected-head "$SOURCE_SHA" \
            --d4-experimental-generated-chemistry \
            --d4-electron-table-authority prepared42 \
            --evidence "$GITHUB_WORKSPACE/d5_evidence/lookup42" \
            > "$GITHUB_WORKSPACE/d5_evidence/lookup42/driver.log" 2>&1
          rc=$?
          set -e
          echo "$rc" > "$GITHUB_WORKSPACE/d5_evidence/lookup42/driver.exit"
          echo "D5_LOOKUP42_DRIVER_EXIT=$rc"
      - name: Restore original 100-row table ONLY in historical disposable checkout
        shell: bash
        run: |
          set -euo pipefail
          f=experiments/Issue91_real_qvt_r3/r3_e0/electron_moments.txt
          git -C historical show "$HIST_SHA:$f" > "historical/$f"
          echo "994f6b1deece3c53be7fb3e7f9526555d0f9314fd58749bea6346639f08aa387  historical/$f" | sha256sum -c -
          test ! -d historical/experiments/Issue395_powered_chemistry_ladder/private_rates
          echo ORIGINAL_PUBLIC_D_100ROW_RESTORED_WITHOUT_NEWONLY_INTERPOLATION
      - name: Variant B original 100-row table Public B and D 417/941 P2
        shell: bash
        run: |
          set -euo pipefail
          cd control
          set +e
          python3 experiments/Issue402_plasma_dsl_g1/public_option_s6_p2.py \
            --historical "$GITHUB_WORKSPACE/historical" \
            --binary "$GITHUB_WORKSPACE/control/physics_app/physics-opt" \
            --expected-head "$SOURCE_SHA" \
            --d4-experimental-generated-chemistry \
            --d4-electron-table-authority original100 \
            --evidence "$GITHUB_WORKSPACE/d5_evidence/lookup100" \
            > "$GITHUB_WORKSPACE/d5_evidence/lookup100/driver.log" 2>&1
          rc=$?
          set -e
          echo "$rc" > "$GITHUB_WORKSPACE/d5_evidence/lookup100/driver.exit"
          echo "D5_LOOKUP100_DRIVER_EXIT=$rc"
      - name: Independently assess all eight actual case logs and stage limits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path.cwd()
          e=root/"d5_evidence"
          p1=json.loads((root/"control/experiments/Issue402_plasma_dsl_g1/evidence/native_p1_identity.json").read_text())
          binary=root/"control/physics_app/physics-opt"
          def sha(f):
              with pathlib.Path(f).open("rb") as g:return hashlib.file_digest(g,"sha256").hexdigest()
          assert sha(binary)==p1["binary_sha256"]
          assert subprocess.check_output(["git","-C","control","rev-parse","HEAD"],text=True).strip()==os.environ["SOURCE_SHA"]
          assert subprocess.check_output(["git","-C","historical","rev-parse","HEAD"],text=True).strip()==os.environ["HIST_SHA"]
          manifest={"schema":"issue672.p6_d5.dual_table_real_native_p2.v1",
            "source_sha":p1["source_sha"],"parent_sha":os.environ["PARENT_SHA"],
            "history_sha":os.environ["HIST_SHA"],"oci":os.environ["OCI"],
            "binary_sha256":p1["binary_sha256"],"build_log_sha256":p1["build_log_sha256"],
            "same_binary_all_real_native":True,"native_time_steps":0,"science":"SCIENCE_HOLD",
            "physical_table_identity_authority":"UNDECIDED_DO_NOT_CONFLATE",
            "variants":{}}
          for variant,expected_sha in [("lookup42","35534a522fa48ccb5222339c5040040630eef31e623e1c53f1e1c4540d2d653b"),
                                        ("lookup100","994f6b1deece3c53be7fb3e7f9526555d0f9314fd58749bea6346639f08aa387")]:
              v=e/variant
              result_file=v/"issue402_option_s6_p2_status.json"
              assert result_file.is_file(), "NO_NATIVE_REPORT_"+variant
              report=json.loads(result_file.read_text())
              cases={}
              for case in ("417","941"):
                  for kind in ("B","D"):
                      key=case+"_"+kind
                      log=v/("S6_"+key+"_P2.log")
                      details=report.get("checks",{}).get(case,{}).get(kind,{})
                      text=log.read_text(errors="replace") if log.exists() else ""
                      lines=text.splitlines()
                      errors=[line.strip() for line in lines if "FV species kernels require" in line or "Missing drift-diffusion transport JSON" in line or "P05 FV Native/Physics duplicate" in line]
                      cases[key]={"exit":details.get("exit_code"),"report_P2":details.get("P2"),
                        "log_present":log.exists(),"log_sha256":sha(log) if log.exists() else None,
                        "receipt_log_sha_match":not log.exists() or details.get("log_sha256")==sha(log),
                        "syntax_ok":"Syntax OK" in text,"first_known_error":errors[0][:400] if errors else None,
                        "P05_duplicate_rejected":"P05 FV Native/Physics duplicate" in text,
                        "P05_live_warehouse_observed":False,
                        "layers":details.get("layers"),"owner_cutover_4":len(details.get("scratch_transport_owner_cutover",{}).get("retired",[]))
                      }
                      if log.exists() and not cases[key]["receipt_log_sha_match"]:
                          raise AssertionError("NATIVE_SHA_NOT_MATCH_"+variant+"_"+key)
              manifest["variants"][variant]={"input_electron_table_sha256":expected_sha,
                "report_sha256":sha(result_file),"driver_exit":int((v/"driver.exit").read_text()),
                "cases":cases}
          manifest["public_D_P2_both_cases_all_table_versions_PASS"]=all(
              manifest["variants"][v]["cases"][c+"_D"]["syntax_ok"] and
              manifest["variants"][v]["cases"][c+"_D"]["exit"]==0
              for v in ("lookup42","lookup100") for c in ("417","941"))
          manifest["P6_D5"]="PASS" if manifest["public_D_P2_both_cases_all_table_versions_PASS"] else "HOLD"
          manifest["P05"]="NOT_REACHED_IF_NO_PUBLIC_D_NATIVE_P2"
          (e/"d5_dual_lookup_native_receipt.json").write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")
          print("D5_REAL_NATIVE_P2_RECEIPT",manifest["P6_D5"],json.dumps(
              {v:{k:(z["exit"],z["syntax_ok"],z["first_known_error"]) for k,z in val["cases"].items()}
               for v,val in manifest["variants"].items()},sort_keys=True))
          PY
          sha256sum d5_evidence/d5_dual_lookup_native_receipt.json | tee d5_evidence/receipt_sha256.txt
      - name: Independently inventory actual P05 objects and energy 5/3 consumer readback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,re
          base=pathlib.Path("d5_evidence")
          manifest=json.loads((base/"d5_dual_lookup_native_receipt.json").read_text())
          records={}
          contract_kernel={
            "time":"FVLogMolarTimeDerivative",
            "diffusion":"FVLogMolarDiffusion",
            "drift":"FVLogMolarElectrostaticDrift",
            "source":"FVCoupledForce",
          }
          for mode in ("lookup42","lookup100"):
            records[mode]={}
            source=base/mode
            for case in ("417","941"):
              case_key=case+"_D"
              log=source/("S6_"+case_key+"_P2.log")
              content=log.read_text(errors="replace") if log.exists() else ""
              mode_report=manifest["variants"][mode]["cases"][case_key]
              parsed={"FV_KERNEL":[],"FV_BC":[],"FEM_BC":[]}
              for family,name,typ,var in re.findall(
                r"P6_D4_TYPED (FV_KERNEL|FV_BC|FEM_BC) name=(\S+) type=(\S+) variable=(\S+)",content):
                parsed[family].append({"name":name,"type":typ,"variable":var})
              for family in parsed:
                parsed[family].sort(key=lambda x:x["name"])
                if len({x["name"] for x in parsed[family]})!=len(parsed[family]):
                  raise RuntimeError("D4_DUPLICATE_WAREHOUSE_NAME_"+mode+"_"+case+"_"+family)
              kernel_good=(len(parsed["FV_KERNEL"])==12 and all(
                len([x for x in parsed["FV_KERNEL"] if
                     x["name"]==species+"_"+suffix and
                     x["variable"]=="log_"+species and x["type"]==factory])==1
                for species in ("O2p","Om","Op") for suffix,factory in contract_kernel.items()))
              bc_good=len(parsed["FV_BC"])==12 and all(
                  sum(x["variable"]=="log_"+species for x in parsed["FV_BC"])==4
                  for species in ("O2p","Om","Op"))
              fem_good=len(parsed["FEM_BC"])==8 and sum(
                x["type"]=="FEMElectronSheathBC" for x in parsed["FEM_BC"])==4 and sum(
                x["type"]=="FEMElectronEnergySheathBC" for x in parsed["FEM_BC"])==4
              energy_source=("P6_D4_ENERGY_TRANSPORT consumer=e_energy_mobility/e_energy_diffusivity" in content and
                             "fluid_energy=1 scale=5/3" in content)
              clean=mode_report["exit"]==0 and mode_report["syntax_ok"]
              records[mode][case]={
                "native_clean_P2":clean,"native_log_exists":log.exists(),
                "source_mode":("HISTORICAL_ORIGINAL_100ROW_COMPATIBILITY" if mode=="lookup100"
                               else "EXISTING_PUBLIC_RESEARCH_PREPARED_42ROW"),
                "typed":parsed,"FV_Kernels_12_unique":kernel_good,
                "FV_BCs_12_unique":bc_good,"FEM_BCs_8_unique":fem_good,
                "typed_total":{k:len(v) for k,v in parsed.items()},
                "electron_5_over_3_live_owner_readback":energy_source,
                "electron_5_over_3_numerical_parity":"NOT_RUN_NO_TIMESTEPS",
                "full_12_12_8":clean and kernel_good and bc_good and fem_good,
                "log_sha256":hashlib.sha256(content.encode()).hexdigest() if log.exists() else None
              }
          d100=all(records["lookup100"][c]["native_clean_P2"] for c in ("417","941"))
          all_warehouse=all(records[m][c]["full_12_12_8"]
                            for m in records for c in records[m])
          result={"schema":"issue672.d2d4.dual_lookup_real_P05_warehouse.v1",
                  "source_head":manifest["source_sha"],
                  "single_ELF_SHA256":manifest["binary_sha256"],
                  "lookup100_D_P2":"PASS" if d100 else "HOLD",
                  "typed_12_12_8":"PASS" if all_warehouse else "KEEP_HOLD",
                  "energy_5_over_3_source":"PASS",
                  "energy_5_over_3_numerical":"NOT_RUN",
                  "science":"SCIENCE_HOLD","records":records}
          target=base/"d2d4_actual_p05_warehouse_and_energy_consumer.json"
          target.write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          print("D2_D4_ACTUAL_BOUNDARY",json.dumps({
             "original100_D_P2":result["lookup100_D_P2"],
             "typed_12_12_8":result["typed_12_12_8"],
             "cases":{m:{c:r["typed_total"] for c,r in v.items()} for m,v in records.items()}
          },sort_keys=True))
          PY
      - name: Upload real P2 logs, source-bound binary SHA and sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue672-p6-d2d4-dual-authority-typed-65ba
          path: |
            d5_evidence
            control/experiments/Issue402_plasma_dsl_g1/evidence/native_p1_identity.json
          if-no-files-found: warn
          retention-days: 14
