# Bounded research-only first SIGSEGV stack capture for Issue282.
# User approved Track A; no SOL/Adapter packaging, no science gate promotion.
# Self-path main trigger exactly once; remove after terminal evidence.
name: Issue282 native RZ first SIGSEGV stack once
run-name: Issue282 R4QF1 vs E2a D0 first native stack

on:
  push:
    branches: [main]
    paths: [.github/workflows/issue282-rz-gdb-stack-once.yml]

permissions:
  contents: read

concurrency:
  group: issue282-rz-gdb-stack-once
  cancel-in-progress: false

jobs:
  native-rz-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify source, offline projected input identity, and workflow policy
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python3 ci/guards/workflow_surface_guard.py --check
          python3 -m py_compile experiments/Issue282_e2a_rz_bridge/diagnose_gdb_stack.py
          python3 -m venv .issue282-stack-venv
          .issue282-stack-venv/bin/python -m pip install --disable-pip-version-check -r requirements-evidence-engine.txt -r requirements-ontology.txt 'pytest==8.3.4' 'pydantic==2.10.6' 'numpy==2.1.2' 'netCDF4==1.7.3'
          .issue282-stack-venv/bin/python -m pytest -q tests/characterization/test_issue282_rz_gdb_stack.py
      - name: Pull immutable published PhysicsApp runtime
        shell: bash
        run: |
          set -euo pipefail
          image='ghcr.io/hyungseonsong-plasma/physics-runtime@sha256:cda9f0d09a17aed5fa606e97d1ee5c3450f7280536cec2e5c635402bb07d972c'
          docker pull "$image"
          mkdir -p experiments/Issue282_e2a_rz_bridge/gdb_stack_results
          docker image inspect "$image" > experiments/Issue282_e2a_rz_bridge/gdb_stack_results/base-runtime-image.json
      - name: R4QF1 and E2a D0 exact-input native GDB first-signal capture
        shell: bash
        run: |
          set -euo pipefail
          .issue282-stack-venv/bin/python experiments/Issue282_e2a_rz_bridge/diagnose_gdb_stack.py 2>&1 |
            tee experiments/Issue282_e2a_rz_bridge/gdb_stack_results/driver.log
      - name: Always preserve original inputs mesh hash loaded modules and stack traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue282-native-rz-first-sigsegv-stack
          path: |
            experiments/Issue282_e2a_rz_bridge/gdb_stack_results/**
          if-no-files-found: warn
          retention-days: 30
