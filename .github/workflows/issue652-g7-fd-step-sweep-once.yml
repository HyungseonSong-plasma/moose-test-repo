# Fix isolated string-newline match in synthetic no-charge control fixture.
name: Issue652 G7 PETSc FD step sweep and charge-source ablation (branch-only)
on:
  push:
    branches: [issue-652-poisson-g7-equivalence-ad-20261123]
    paths: [.github/workflows/issue652-g7-fd-step-sweep-once.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: issue652-g7-pinned-elf-fd-step-sweep
  cancel-in-progress: false
jobs:
  fd-step-sweep:
    name: Fixed PETSc FD steps and source ablation (diagnostics only)
    if: github.repository == 'HyungseonSong-plasma/moose-test-repo'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      G7_SOURCE: 26e84a4a33cf93d9e278a4f0b2d78c53cae2d6ce
      G7_OCI: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
    steps:
      - name: Checkout actual unchanged PhysicsApp binary source (not newest branch)
        uses: actions/checkout@v4
        with:
          ref: 26e84a4a33cf93d9e278a4f0b2d78c53cae2d6ce
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout this reviewed G7 test harness separately
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: g7-analysis
          persist-credentials: false
          fetch-depth: 1
      - name: Assert exact dual-source identity and run fail-closed micro-Jacobian unit tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$G7_SOURCE"
          test "$(git -C g7-analysis rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m pip install --quiet --disable-pip-version-check 'pytest>=8,<9'
          python3 -m pytest -q g7-analysis/tests/test_issue652_g7_native_ad_jacobian.py g7-analysis/tests/test_issue652_g7_fd_step_sweep.py
          python3 -m py_compile g7-analysis/ci/guards/issue652_g7_native_ad_jacobian.py g7-analysis/ci/guards/issue652_g7_fd_step_sweep.py
      - name: Download shared ELF bytes from completed Poisson 100us run
        uses: actions/download-artifact@v4
        with:
          run-id: 45216929109
          name: issue652-g6b-shared-26e84a4a33cf93d9e278a4f0b2d78c53cae2d6ce
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/g7-shared
      - name: Validate pinned P1 ELF tar closure before extraction
        shell: bash
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/g7-shared" && sha256sum --check bundle.sha256)
          python3 - "$RUNNER_TEMP/g7-shared/bundle.tar.gz" <<'PY'
          import sys,tarfile
          allowed={"physics_app/physics-opt","physics_app/g6_owner_tracer.so",
                   "physics_app/lib/libphysics-opt.so.0",
                   "physics_app/test/lib/libphysics_test-opt.so.0"}
          with tarfile.open(sys.argv[1],"r:gz") as bundle:
              entries=bundle.getmembers()
              assert {entry.name for entry in entries} == allowed
              assert all(entry.isfile() and not entry.issym() for entry in entries)
          print("G7_SHARED_ELF_BINARY_ONLY_ARCHIVE_PASS")
          PY
          tar -xzf "$RUNNER_TEMP/g7-shared/bundle.tar.gz"
          chmod u+x physics_app/physics-opt
          python3 - "$RUNNER_TEMP/g7-shared/manifest.json" <<'PY'
          import hashlib,json,os,pathlib,sys
          manifest=json.load(open(sys.argv[1]))
          assert manifest["source_sha"] == os.environ["G7_SOURCE"]
          assert manifest["oci_ref"] == os.environ["G7_OCI"]
          for path,digest in manifest["files"].items():
              p=pathlib.Path(path)
              assert p.is_file() and not p.is_symlink()
              assert p.open("rb").read(4) == b"\x7fELF"
              assert hashlib.sha256(p.read_bytes()).hexdigest()==digest
          print("G7_PINNED_PHYSICS_SOURCE_AND_BUILD_SHA_PASS")
          PY
      - name: Sweep -snes_test_err and read numeric matrix-view differences (source bound)
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/g7-analysis${PYTHONPATH:+:$PYTHONPATH}"
          docker pull "$G7_OCI"
          python3 g7-analysis/ci/guards/issue652_g7_fd_step_sweep.py \
            --source "$GITHUB_WORKSPACE" \
            --manifest "$RUNNER_TEMP/g7-shared/manifest.json" \
            --output "$RUNNER_TEMP/g7-fd-sweep.json" \
            --authorize-native
          python3 - "$RUNNER_TEMP/g7-fd-sweep.json" <<'PY'
          import json,sys
          v=json.load(open(sys.argv[1]))
          assert v["diagnostic_status"] == "PASS_SWEEP_EVIDENCE_ONLY"
          assert len(v["sweep"]) == 9
          assert len(v["charge_free_control"]) == 2
          assert v["component_jacobian_strict_status"].startswith("HOLD")
          assert v["actual_s6_coupled_ad_jacobian"] == "UNVERIFIED"
          assert v["science"] == "SCIENCE_HOLD"
          print("G7_FD_SWEEP_COMPLETE_NO_JACOBIAN_APPROVAL")
          PY
      - name: Upload only sanitized PETSc FD sweep, matrix indices and source receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue652-g7-poisson-ad-fd-sweep-receipt
          path: ${{ runner.temp }}/g7-fd-sweep.json
          if-no-files-found: warn
          retention-days: 90
