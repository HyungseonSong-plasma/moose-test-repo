name: Governed refactor entrypoint
run-name: Issue_${{ inputs.issue }}_refactor${{ inputs.sequence }}

on:
  workflow_dispatch:
    inputs:
      issue:
        description: 'Owning issue number'
        required: true
        type: string
      sequence:
        description: 'Issue-local refactor sequence (for example 01)'
        required: true
        type: string
      task:
        description: 'Governed refactor/infrastructure task'
        required: true
        default: manifest
        type: choice
        options:
          - manifest
          - build_base
          - runtime_producer
          - runtime_consumer
          - runtime_strip
      manifest:
        description: 'Path below automation/manifests/refactors/ when task=manifest'
        required: false
        type: string
      base_sha:
        description: 'Exact 40-hex source revision'
        required: true
        type: string
      build_base_ref:
        description: 'Immutable build-base image ref when required'
        required: false
        type: string
      runtime_ref:
        description: 'Immutable runtime image ref when required'
        required: false
        type: string

permissions:
  contents: write
  packages: write
  actions: read

concurrency:
  group: refactor-${{ inputs.issue }}-${{ inputs.sequence }}-${{ inputs.task }}
  cancel-in-progress: false

jobs:
  manifest-refactor:
    if: inputs.task == 'manifest'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ISSUE: ${{ inputs.issue }}
      SEQUENCE: ${{ inputs.sequence }}
      MANIFEST_INPUT: ${{ inputs.manifest }}
      BASE_SHA: ${{ inputs.base_sha }}
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          path: control
          fetch-depth: 1

      - name: Checkout exact refactor source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_sha }}
          path: target
          fetch-depth: 1

      - name: Execute governed refactor manifest
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ISSUE" =~ ^[1-9][0-9]*$ ]]
          [[ "$SEQUENCE" =~ ^[0-9]+$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MANIFEST_INPUT" =~ ^automation/manifests/refactors/[A-Za-z0-9_.-]+\.json$ ]]
          python3 control/skills/workflow/workflow_guard.py --check --root control
          python3 control/skills/workflow/run_work.py \
            --kind refactor \
            --manifest "$GITHUB_WORKSPACE/control/$MANIFEST_INPUT" \
            --control-root "$GITHUB_WORKSPACE/control" \
            --workspace "$GITHUB_WORKSPACE/target" \
            --base-sha "$BASE_SHA" \
            --issue "$ISSUE" \
            --sequence "$SEQUENCE" \
            --results "$GITHUB_WORKSPACE/workflow-results"

      - name: Upload governed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Issue_${{ inputs.issue }}_refactor${{ inputs.sequence }}-evidence
          path: workflow-results/**
          if-no-files-found: warn
          retention-days: 30

  build-base:
    if: inputs.task == 'build_base'
    uses: ./.github/workflows/physics-build-base.yml
    secrets: inherit

  runtime-producer:
    if: inputs.task == 'runtime_producer'
    uses: ./.github/workflows/physics-runtime-producer.yml
    with:
      build_base_ref: ${{ inputs.build_base_ref }}
    secrets: inherit

  runtime-consumer:
    if: inputs.task == 'runtime_consumer'
    uses: ./.github/workflows/physics-runtime-consumer.yml
    with:
      runtime_ref: ${{ inputs.runtime_ref }}
      build_base_ref: ${{ inputs.build_base_ref }}
    secrets: inherit

  runtime-strip:
    if: inputs.task == 'runtime_strip'
    uses: ./.github/workflows/physics-runtime-strip-estimate.yml
    with:
      runtime_ref: ${{ inputs.runtime_ref }}
    secrets: inherit
