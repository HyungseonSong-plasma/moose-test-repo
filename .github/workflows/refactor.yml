name: Governed refactor entrypoint
run-name: Issue_${{ inputs.issue }}_refactor${{ inputs.sequence }}

on:
  workflow_dispatch:
    inputs:
      issue:
        description: 'Owning issue number'
        required: true
        type: string
      sequence:
        description: 'Issue-local refactor sequence (for example 01)'
        required: true
        type: string
      task:
        description: 'Governed refactor/infrastructure task'
        required: true
        default: manifest
        type: choice
        options:
          - manifest
          - build_base
          - runtime_producer
          - runtime_consumer
          - runtime_strip
          - repository_mutation
      manifest:
        description: 'Path below automation/manifests/refactors/ for manifest or automation/mutations/ for repository_mutation'
        required: false
        type: string
      base_sha:
        description: 'Exact 40-hex source revision'
        required: true
        type: string
      build_base_ref:
        description: 'Immutable build-base image ref when required'
        required: false
        type: string
      runtime_ref:
        description: 'Immutable runtime image ref when required'
        required: false
        type: string

permissions:
  contents: write
  packages: write
  actions: read

concurrency:
  group: refactor-${{ inputs.issue }}-${{ inputs.sequence }}-${{ inputs.task }}
  cancel-in-progress: false

jobs:
  manifest-refactor:
    if: inputs.task == 'manifest'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ISSUE: ${{ inputs.issue }}
      SEQUENCE: ${{ inputs.sequence }}
      MANIFEST_INPUT: ${{ inputs.manifest }}
      BASE_SHA: ${{ inputs.base_sha }}
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          path: control
          fetch-depth: 1

      - name: Checkout exact refactor source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_sha }}
          path: target
          fetch-depth: 1

      - name: Validate governed refactor dispatch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ISSUE" =~ ^[1-9][0-9]*$ ]]
          [[ "$SEQUENCE" =~ ^[0-9]+$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MANIFEST_INPUT" =~ ^automation/manifests/refactors/[A-Za-z0-9_.-]+\.json$ ]]
          python3 control/ci/guards/workflow_surface_guard.py --check --root control

      - name: Execute central governed refactor
        uses: HyungseonSong-plasma/chatgpt-operation/.github/actions/governed-work@8d3ea7720549148a251a9e11f5733d543344fb2e
        with:
          kind: refactor
          manifest: ${{ github.workspace }}/control/${{ inputs.manifest }}
          control-root: ${{ github.workspace }}/control
          workspace: ${{ github.workspace }}/target
          base-sha: ${{ inputs.base_sha }}
          issue: ${{ inputs.issue }}
          sequence: ${{ inputs.sequence }}
          results: ${{ github.workspace }}/workflow-results

      - name: Upload governed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Issue_${{ inputs.issue }}_refactor${{ inputs.sequence }}-evidence
          path: workflow-results/**
          if-no-files-found: warn
          retention-days: 30

  repository-mutation:
    if: inputs.task == 'repository_mutation'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      ISSUE: ${{ inputs.issue }}
      SEQUENCE: ${{ inputs.sequence }}
      MANIFEST_INPUT: ${{ inputs.manifest }}
      BASE_SHA: ${{ inputs.base_sha }}
    steps:
      - name: Checkout exact mutation control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.base_sha }}
          path: control
          fetch-depth: 1

      - name: Validate governed repository mutation request
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ISSUE" =~ ^[1-9][0-9]*$ ]]
          [[ "$SEQUENCE" =~ ^[0-9]+$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MANIFEST_INPUT" =~ ^automation/mutations/[A-Za-z0-9_.-]+\.json$ ]]
          test "$(git -C "$GITHUB_WORKSPACE/control" rev-parse HEAD)" = "$BASE_SHA"
          test -f "$GITHUB_WORKSPACE/control/.chatgpt-operation.json"
          test -f "$GITHUB_WORKSPACE/control/$MANIFEST_INPUT"
          mkdir -p "$GITHUB_WORKSPACE/repository-mutation-results"

      - name: Execute central repository mutation
        id: repository_mutation
        uses: HyungseonSong-plasma/chatgpt-operation/.github/actions/repository-mutation@8d3ea7720549148a251a9e11f5733d543344fb2e
        with:
          manifest: ${{ github.workspace }}/control/${{ inputs.manifest }}
          policy: ${{ github.workspace }}/control/.chatgpt-operation.json
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          current-run-id: ${{ github.run_id }}
          result-path: ${{ github.workspace }}/repository-mutation-results/result.json

      - name: Upload repository mutation result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Issue_${{ inputs.issue }}_refactor${{ inputs.sequence }}-repository-mutation
          path: repository-mutation-results/**
          if-no-files-found: warn
          retention-days: 30

  build-base:
    if: inputs.task == 'build_base'
    uses: ./.github/workflows/physics-build-base.yml
    secrets: inherit

  runtime-producer:
    if: inputs.task == 'runtime_producer'
    uses: ./.github/workflows/physics-runtime-producer.yml
    with:
      build_base_ref: ${{ inputs.build_base_ref }}
    secrets: inherit

  runtime-consumer:
    if: inputs.task == 'runtime_consumer'
    uses: ./.github/workflows/physics-runtime-consumer.yml
    with:
      runtime_ref: ${{ inputs.runtime_ref }}
      build_base_ref: ${{ inputs.build_base_ref }}
    secrets: inherit

  runtime-strip:
    if: inputs.task == 'runtime_strip'
    uses: ./.github/workflows/physics-runtime-strip-estimate.yml
    with:
      runtime_ref: ${{ inputs.runtime_ref }}
    secrets: inherit
