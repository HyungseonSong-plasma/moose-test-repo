name: Governed refactor entrypoint
run-name: Issue_${{ inputs.issue }}_refactor${{ inputs.sequence }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refactor.yml'
  workflow_dispatch:
    inputs:
      issue:
        description: 'Owning issue number'
        required: true
        type: string
      sequence:
        description: 'Issue-local refactor sequence (for example 01)'
        required: true
        type: string
      task:
        description: 'Governed refactor/infrastructure task'
        required: true
        default: manifest
        type: choice
        options:
          - manifest
          - build_base
          - runtime_producer
          - runtime_consumer
          - runtime_strip
      manifest:
        description: 'Path below automation/manifests/refactors/ when task=manifest'
        required: false
        type: string
      base_sha:
        description: 'Exact 40-hex source revision'
        required: true
        type: string
      build_base_ref:
        description: 'Immutable build-base image ref when required'
        required: false
        type: string
      runtime_ref:
        description: 'Immutable runtime image ref when required'
        required: false
        type: string

permissions:
  contents: write
  packages: write
  actions: read

concurrency:
  group: refactor-${{ inputs.issue }}-${{ inputs.sequence }}-${{ inputs.task }}
  cancel-in-progress: false

jobs:
  manifest-refactor:
    if: inputs.task == 'manifest'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ISSUE: ${{ inputs.issue }}
      SEQUENCE: ${{ inputs.sequence }}
      MANIFEST_INPUT: ${{ inputs.manifest }}
      BASE_SHA: ${{ inputs.base_sha }}
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          path: control
          fetch-depth: 1

      - name: Checkout exact refactor source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_sha }}
          path: target
          fetch-depth: 1

      - name: Execute governed refactor manifest
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ISSUE" =~ ^[1-9][0-9]*$ ]]
          [[ "$SEQUENCE" =~ ^[0-9]+$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MANIFEST_INPUT" =~ ^automation/manifests/refactors/[A-Za-z0-9_.-]+\.json$ ]]
          python3 control/tools/workflow/workflow_guard.py --check --root control
          python3 control/tools/workflow/run_work.py \
            --kind refactor \
            --manifest "$GITHUB_WORKSPACE/control/$MANIFEST_INPUT" \
            --control-root "$GITHUB_WORKSPACE/control" \
            --workspace "$GITHUB_WORKSPACE/target" \
            --base-sha "$BASE_SHA" \
            --issue "$ISSUE" \
            --sequence "$SEQUENCE" \
            --results "$GITHUB_WORKSPACE/workflow-results"

      - name: Upload governed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Issue_${{ inputs.issue }}_refactor${{ inputs.sequence }}-evidence
          path: workflow-results/**
          if-no-files-found: warn
          retention-days: 30

  build-base:
    if: inputs.task == 'build_base'
    uses: ./.github/workflows/physics-build-base.yml
    secrets: inherit

  runtime-producer:
    if: inputs.task == 'runtime_producer'
    uses: ./.github/workflows/physics-runtime-producer.yml
    with:
      build_base_ref: ${{ inputs.build_base_ref }}
    secrets: inherit

  runtime-consumer:
    if: inputs.task == 'runtime_consumer'
    uses: ./.github/workflows/physics-runtime-consumer.yml
    with:
      runtime_ref: ${{ inputs.runtime_ref }}
      build_base_ref: ${{ inputs.build_base_ref }}
    secrets: inherit

  runtime-strip:
    if: inputs.task == 'runtime_strip'
    uses: ./.github/workflows/physics-runtime-strip-estimate.yml
    with:
      runtime_ref: ${{ inputs.runtime_ref }}
    secrets: inherit


  branch-cleanup-once:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout maintenance head
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Delete stale branches and restore canonical workflow
        shell: bash
        run: |
          set -u
          target="docs/provenance/branch-cleanup-2026-09-18"
          mkdir -p "$target"
          git ls-remote --heads origin | awk '{sub("refs/heads/","",$2); print $2 "\t" $1}' | sort > "$target/refs-before.tsv"
          : > "$target/deleted.tsv"
          : > "$target/failed.tsv"

          cat > /tmp/delete-targets.tsv <<'EOF'
fix/aikido-security-code-audit-115212587-vr72	765742de0fcee9340eefd5ce231962b6547f8071
fix/aikido-security-code-audit-115214118-2teg	8b3606fd09e39b46577839d31c7dfdb8131574b2
harness-dependency-preflight	40a21971af67158f09f8461808613eec43d66ff7
issue-228-axis-bc-10step	13689874d70d1782ec5e4728ee11e6cca6cb3e07
issue-228-d1-s2	c7e8efba5ad991cdef79304f53e0aae3b3b6dbc1
issue-228-d1-s3	e74734f6349a1192d6f3cbc00b90374f74b9799a
issue-228-e2-w3-w4-s1	b4bba569a73afc806630585b07eedc49f13f646b
issue-228-face-flux-probe	880d0c1e8d2d001e4e99c15021d10090ea68264f
issue-228-ion-model-matrix	23488c27be70f75c529e8163d62b3296a612d1a6
issue-228-p2-e1-w2-pg	ef304dc85f0b11c07a19c210fc5780d3f745d3b0
issue-228-pgw-parallel	fc3bab84c1944649886b55d89d884e2b4e6b9c16
issue-228-s4-residual	94a96f5c585fbe86456fc9d2bc8e2cacbf9cda3e
issue-228-s5-local-bc-ci	811666ef24b49ef79bc6a1f58c4806b3023eb674
issue-228-s6-directional-observable	9071b1d3ab51cecfe259b6b6ef9a86a8010f6ef4
issue-228-s6b-baseline-wall-field	714d2b0f4362d4167995f10a44265187a66beee6
issue-228-wall-av-10step	bc9399bc8de458d67ab4d8f12719bd04057832e7
issue-236-m1a-multiapp-smoke	6fbeefa55acab15f41dbdecadefb0d7fe7d56ce2
issue-236-run32-preflight-gate	2eb6c66c251089b0a6604727107babd983543800
issue-236-transfer-diag-preflight-fix	24dd201bd58770479b5c151f5da024f8d395cc77
issue-236-transfer-diagnostics	2736105200f16a92520bd060df78b38a9855f638
issue-242-electron-log-molar-transport	d033d275bffa13262688202a352454cd64a83d7d
issue-243-t1-log-molar-coupled-particle	d746042323ad3817be80066a58d88f1196c82366
issue-245-t2-molar-electron-energy	2f2132672acd63fc70db475ddd57125ae93781df
issue192-p3-diagnostic-matrix	2a42f466871294dd1c04319ea402edf802cddca6
issue224-build-once-ten-way-fanout	b1b51e431037c74446ff463ed0b68f418b3f6d2b
issue224-c3-observability-memory	3b2569bbb28a8df1b3d24e966f4ffcc694d028fe
issue224-c5-observer-family-memory	8179e60bb4fe2eae0342f96e3905d8c20f72aada
issue224-c5r-os-rss	a0aa0ea3cb86ab8bd1f978c269ad380eadcea558
issue224-c6-element-aggregate-type-split	875cba854716dcf40916ed8141c9fbf92319cdcf
issue224-parallel-hypothesis-matrix-design	345977b9e9445fd7e7503eb43c3ba65ee1a50252
maintenance/physics-opt-doc-naming	ac89afadd96456976c1e6089f146c410e5d49dc8
probe/runner-1s-20260913	3142e48541be382c846de0e5bb1aadf3c5ac4750
science-standalone-bundle	db29de6d4fe8035e10db2176d5b1c9f666295a8f
standard-moose-energy-ab	6b875df183265bf50f909764d73a74a227090298
standard-moose-energy-retire	5dd5efbacdba99637e0dc6180627237f50b7476e
tmp-do-not-use	ef98515254b13ca9cb9ee456e48cd4dd4ef74c1e
work/192-governed-ci-runtime-authority	92af1e43df09d7ec526f341f04a48739b517780b
EOF

          while IFS=$'\t' read -r branch expected; do
            [ -n "$branch" ] || continue
            current="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
            if [ "$current" != "$expected" ]; then
              printf '%s\t%s\t%s\tSHA_MISMATCH\n' "$branch" "$expected" "$current" >> "$target/failed.tsv"
              continue
            fi
            if git push origin --delete "$branch"; then
              printf '%s\t%s\n' "$branch" "$expected" >> "$target/deleted.tsv"
            else
              printf '%s\t%s\tDELETE_FAILED\n' "$branch" "$expected" >> "$target/failed.tsv"
            fi
          done < /tmp/delete-targets.tsv

          git ls-remote --heads origin | awk '{sub("refs/heads/","",$2); print $2 "\t" $1}' | sort > "$target/refs-after.tsv"
          awk -F '\t' '$1 == "main" || $1 ~ /^issue-234-/ {print}' "$target/refs-after.tsv" > "$target/kept.tsv"
          awk -F '\t' '$1 != "main" && $1 !~ /^issue-234-/ {print}' "$target/refs-after.tsv" > "$target/unexpected-after.tsv"

          cat > "$target/README.md" <<'EOF'
# Branch cleanup provenance

Date: 2026-09-18

Policy:
- keep `main`;
- keep branches owned by currently open Issue #234;
- close stale PRs whose owning issues are terminal;
- delete terminal-issue, probe, maintenance, temporary, and superseded branches;
- delete only when the live remote SHA exactly matches the pre-cleanup inventory.

The exact pre/post refs and deletion results are preserved in this directory.
EOF

          git show HEAD^:.github/workflows/refactor.yml > .github/workflows/refactor.yml
          git show HEAD^:tools/workflow/workflow_guard.py > tools/workflow/workflow_guard.py

          git config user.name "physics-branch-cleanup"
          git config user.email "actions@users.noreply.github.com"
          git add "$target" .github/workflows/refactor.yml tools/workflow/workflow_guard.py
          git commit -m "Record branch cleanup provenance"
          git push origin HEAD:main

          if [ -s "$target/failed.tsv" ] || [ -s "$target/unexpected-after.tsv" ]; then
            echo "Branch cleanup completed with exceptions" >&2
            cat "$target/failed.tsv" >&2 || true
            cat "$target/unexpected-after.tsv" >&2 || true
            exit 1
          fi
          echo "BRANCH_CLEANUP=PASS"
