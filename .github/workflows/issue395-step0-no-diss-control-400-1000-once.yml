# BOUNDED USER-REQUESTED SCIENCE-HOLD EXPERIMENT.
# Source checkout is an exact experiment SHA, not main.
# Retire this self-path one-shot only after both jobs terminal and artifacts verified.
name: Issue395 Step0 both DISS OFF 400 1000 W once
run-name: Step0 no dissociation 400/1000 W control @ ${{ github.sha }}
on:
  push:
    branches: [main]
    paths: [.github/workflows/issue395-step0-no-diss-control-400-1000-once.yml]
permissions:
  contents: read
jobs:
  mixed-dissociation:
    name: Step0 both DISS OFF ${{ matrix.power_w }}W
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      DISS_CHANNEL: 'off'
      CHATGPT_WORK_BASE_SHA: fa44aa24f4059eab60f1236e9e5beef7a2e7e1c0
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        power_w: [400, 1000]
    steps:
      - name: Pin exact experimental source
        uses: actions/checkout@v4
        with:
          ref: fa44aa24f4059eab60f1236e9e5beef7a2e7e1c0
      - name: P0 source tests and one-chemistry-only 100us input
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CHATGPT_WORK_BASE_SHA"
          test "$DISS_CHANNEL" = off
          python3 -m pip install --disable-pip-version-check --quiet 'pytest>=8,<9'
          python3 -m pytest -q \
            tests/test_o2_ground_state_dissociation_overlay.py \
            tests/test_o2_mixed_state_dissociation_overlay.py \
            tests/test_o2_mixed_dissociation_power_replay.py \
            tests/test_o2_mixed_power_audit.py \
            tests/test_issue395_step0_diss_off_control.py
          python3 -m venv .issue395-mixed-venv
          .issue395-mixed-venv/bin/python -m pip install --disable-pip-version-check --quiet numpy==2.1.2 scipy==1.14.1
          source .issue395-mixed-venv/bin/activate
          bash experiments/Issue395_powered_chemistry_ladder/issue397_l1_power_scan_replay.sh prepare "${{ matrix.power_w }}"
          CHEM=experiments/Issue395_powered_chemistry_ladder
          FILE="$CHEM/o2_dissociation_${{ matrix.power_w }}w_100us_dt1000ns_overlay.i"
          grep -Fqx '# Controlled Step0 knockout: ground and mixed O2 dissociation OFF.' "$FILE"
          test "$(wc -l < "$FILE")" -eq 1
          ! grep -Eq 'R_diss_O2|S_O_mass_diss|\[FunctorMaterials\]|\[FVKernels\]' "$FILE"
          BASE_INPUT="$CHEM/rf_elastic_diss_ion_ei20_ei01_${{ matrix.power_w }}w_adjacent_sheath_wall_closed_100us_dt1000ns.i"
          ! grep -Eq 'R_diss_O2|S_O_mass_diss' "$BASE_INPUT"
          grep -q '    initial_condition = 0.10309278350515465' "$BASE_INPUT"
          grep -q '    default = 1.9995862855975097e-07' "$BASE_INPUT"
          grep -Fq 'ISSUE395_TIMEGRID_100US_460STEPS_PASS' "$CHEM/results_rf_elastic_diss_ion_ei20_ei01_${{ matrix.power_w }}w_adjacent_sheath_wall_closed_100us_dt1000ns_both_diss_off_step0_control/prep/timegrid_460.log"
      - name: P1 exact PhysicsApp build
        shell: bash
        run: bash experiments/Issue395_powered_chemistry_ladder/issue397_l1_power_scan_replay.sh build "${{ matrix.power_w }}"
      - name: P2 real physics-opt --check-input
        shell: bash
        run: bash experiments/Issue395_powered_chemistry_ladder/issue397_l1_power_scan_replay.sh check "${{ matrix.power_w }}"
      - name: P3 bounded 100us real physics-opt solve
        id: p3
        shell: bash
        run: timeout -s TERM -k 60s 19000s bash experiments/Issue395_powered_chemistry_ladder/issue397_l1_power_scan_replay.sh solve "${{ matrix.power_w }}"
      - name: P4 native 27-face D1 charge-current audit
        id: p4
        if: steps.p3.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          source .issue395-mixed-venv/bin/activate
          bash experiments/Issue395_powered_chemistry_ladder/issue397_l1_power_scan_replay.sh audit "${{ matrix.power_w }}"
      - name: P5 fail-closed DISS-absent, RF power, 100us and D1 verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result="experiments/Issue395_powered_chemistry_ladder/results_rf_elastic_diss_ion_ei20_ei01_${{ matrix.power_w }}w_adjacent_sheath_wall_closed_100us_dt1000ns_both_diss_off_step0_control"
          python3 experiments/Issue395_powered_chemistry_ladder/analyze_ground_state_power_scan.py \
            --channel off --result "$result" \
            --power-w "${{ matrix.power_w }}" \
            --source-sha "$CHATGPT_WORK_BASE_SHA" \
            --p3-outcome "${{ steps.p3.outcome }}" \
            --p4-outcome "${{ steps.p4.outcome }}"
      - name: Preserve exact input, overlay, full outputs and D1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue395-step0-both-diss-off-${{ matrix.power_w }}W-100us
          retention-days: 30
          if-no-files-found: warn
          path: |
            experiments/Issue395_powered_chemistry_ladder/results_rf_elastic_diss_ion_ei20_ei01_${{ matrix.power_w }}w_adjacent_sheath_wall_closed_100us_dt1000ns_both_diss_off_step0_control/**
            experiments/Issue395_powered_chemistry_ladder/rf_elastic_diss_ion_ei20_ei01_${{ matrix.power_w }}w_adjacent_sheath_wall_closed_100us_dt1000ns.i
            experiments/Issue395_powered_chemistry_ladder/o2_dissociation_${{ matrix.power_w }}w_100us_dt1000ns_overlay.i
            experiments/Issue395_powered_chemistry_ladder/rf_elastic_multiapp_parent_${{ matrix.power_w }}w_100us_dt1000ns_overlay.i
            experiments/Issue395_powered_chemistry_ladder/rf_elastic_multiapp_maxwell_${{ matrix.power_w }}w_100us_dt1000ns_child.i
            experiments/Issue395_powered_chemistry_ladder/issue397_maxwell_steady_abs1e11.i
