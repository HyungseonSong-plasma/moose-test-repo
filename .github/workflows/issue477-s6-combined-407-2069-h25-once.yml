# Issue #477: governed one-shot, two fresh 400W/100us native runs, each with
# exact S4 parent + EI407 + EI2069 + H25 (eight active channels).
# No timing delay, no arbitrary dispatch, no retries, science acceptance HOLD.
name: Issue477 S6 combined EI407 EI2069 H25 twice once
run-name: Issue477 S6 417 vs 941 combined chemistry @ ${{ github.sha }}
on:
  push:
    branches: [main]
    paths: [.github/workflows/issue477-s6-combined-407-2069-h25-once.yml]

permissions:
  contents: read

concurrency:
  group: issue477-s6-407-2069-h25-${{ github.sha }}
  cancel-in-progress: false

jobs:
  native-two-cases:
    name: 400W 100us S6 ${{ matrix.case }} native + 2D
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case: [S6-417-407-2069-H25, S6-941-407-2069-H25]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PINNED_SOURCE: 29d1acc6ef7969908b86719e4b95c73a1565136d
      PINNED_EEDF: 35534a522fa48ccb5222339c5040040630eef31e623e1c53f1e1c4540d2d653b
      OXYGEN_RESEARCH_400: '1'
      OXYGEN_RESEARCH_FULL24: '0'
      OXYGEN_RESEARCH_EI2738_FORMULA: '0'
      OXYGEN_RESEARCH_QUICK_5MIN: '0'
      BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
      CHEM: experiments/Issue395_powered_chemistry_ladder
    steps:
      - name: Checkout exact merged control / current plotting implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 1

      - name: Checkout pinned Oxygen14 physics implementation
        uses: actions/checkout@v4
        with:
          ref: 29d1acc6ef7969908b86719e4b95c73a1565136d
          path: target/pinned_oxygen14
          fetch-depth: 1

      - name: P0 pin original S4 plus EI407 + EI2069 + H25
        id: p0
        shell: bash
        env:
          PRIVATE_RATES_B64: ${{ secrets.OXYGEN24_RATES_TAR_XZ_B64 }}
        run: |
          set -euo pipefail
          CONTROL_ROOT="$GITHUB_WORKSPACE/control"
          cd target/pinned_oxygen14
          test "$(git rev-parse HEAD)" = "$PINNED_SOURCE"
          test "$(git -C "$CONTROL_ROOT" rev-parse HEAD)" = "${{ github.sha }}"
          python3 -m venv "$GITHUB_WORKSPACE/.issue477_venv"
          "$GITHUB_WORKSPACE/.issue477_venv/bin/python" -m pip install --disable-pip-version-check --quiet numpy==2.1.2 scipy==1.14.1 matplotlib==3.9.2
          source "$GITHUB_WORKSPACE/.issue477_venv/bin/activate"
          SOURCE=".github/oxygen25_eedf/initial_mixture_23xsec_transport.txt"
          DEST="experiments/Issue91_real_qvt_r3/r3_e0/electron_moments.txt"
          test "$(sha256sum "$SOURCE" | cut -d' ' -f1)" = "$PINNED_EEDF"
          cp -- "$SOURCE" "$DEST"
          test "$(sha256sum "$DEST" | cut -d' ' -f1)" = "$PINNED_EEDF"
          export CHATGPT_WORK_BASE_SHA="$PINNED_SOURCE"
          bash "$CHEM/issue397_l1_power_scan_replay.sh" prepare 400
          python3 .github/scripts/oxygen_legacy6_latest_100us.py --power-w 400 --prepare
          mkdir -p "$CHEM/c0_400_p2_preflight"
          export PYTHONPATH="$CONTROL_ROOT"
          python3 "$CONTROL_ROOT/bin/physics.py" oxygen-c0 \
            --root "$PWD" \
            --base-input "$PWD/$CHEM/rf_elastic_diss_ion_ei20_ei01_400w_adjacent_sheath_wall_closed_100us_dt1000ns.i" \
            --rf-parent "$PWD/$CHEM/rf_elastic_multiapp_parent_400w_100us_dt1000ns_overlay.i" \
            --output "$PWD/$CHEM/c0_400_p2_preflight/c0_manifest.json"
          test -n "$PRIVATE_RATES_B64" || { echo "::error::Private rate archive missing"; exit 22; }
          mkdir -p /tmp/oxygen25/private_rates
          printf '%s' "$PRIVATE_RATES_B64" | base64 --decode | tar -xJ -C /tmp/oxygen25/private_rates --no-same-owner
          python3 "$CONTROL_ROOT/experiments/Issue477_electron_shape/prepare_s6_combined_consumers.py" \
            --case "${{ matrix.case }}" --private-dir /tmp/oxygen25/private_rates --control-root "$CONTROL_ROOT"
          test -s "$CHEM/issue477_s6_combined_consumers/${{ matrix.case }}/case_manifest.json"
          rm -rf -- /tmp/oxygen25/private_rates
          echo "ISSUE477_S6_COMBINED_P0_PASS ${{ matrix.case }}"

      - name: P1 build exact pinned native PhysicsApp
        id: p1
        shell: bash
        run: |
          set -euo pipefail
          cd target/pinned_oxygen14
          export CHATGPT_WORK_BASE_SHA="$PINNED_SOURCE"
          bash "$CHEM/issue397_l1_power_scan_replay.sh" build 400
          test -x physics_app/physics-opt
          echo ISSUE477_P1_NATIVE_BUILD_PASS

      - name: P2 actual native check-input with audited case overlays
        id: p2
        shell: bash
        run: |
          set -euo pipefail
          cd target/pinned_oxygen14
          CASE="${{ matrix.case }}"
          MANIFEST="$CHEM/issue477_s6_combined_consumers/$CASE/case_manifest.json"
          python3 - "$MANIFEST" <<'PY'
          import sys, json, hashlib
          from pathlib import Path
          record=json.loads(Path(sys.argv[1]).read_text())
          assert record["case"] in {"S6-417-407-2069-H25", "S6-941-407-2069-H25"}
          assert record["parent_case"] in ("S4-401-417", "S4-401-941")
          assert record["schema"] == "issue477_s6_combined_407_2069_h25_v1"
          assert record["added_channels"] == ["EI-407", "EI-2069", "H25"]
          assert record["fresh_t0"] is True
          assert record["native_end_s"] == 0.0001
          assert record["science_acceptance"] == "HOLD"
          parent_ion = "EI-"+record["parent_case"].rsplit("-",1)[1]
          assert record["chemistry_channels"] == [
              "EI-02","EI-17","EI-415","EI-401",parent_ion,
              "EI-407","EI-2069","H25"]
          assert len(record["input_paths"]) == 10
          assert len(record["expected_progress_owners"]) == 8
          assert len(record["parent_inputs_sha256"]) == 7
          assert record["private_rate_sha256_no_bytes"]["EI-407"] == (
              "2565be45b9a13204583b6714a7d1b581cf29c157c78ac502d665649e4065b359")
          assert record["private_rate_sha256_no_bytes"]["EI-2069"] == (
              "5eba74c1870e0635a3e316e143961e9f04e259675ddad00fd8653de28980644a")
          for path,digest in record["parent_inputs_sha256"].items():
              assert record["input_sha256"][path] == digest
          for path,digest in record["input_sha256"].items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==digest,path
          assert record["science_acceptance"]=="HOLD"
          print("ISSUE477_P2_PROVENANCE_INPUT_HASH_PASS")
          PY
          mapfile -t INPUTS < <(python3 -c 'import json,sys;print("\n".join(json.load(open(sys.argv[1]))["input_paths"]))' "$MANIFEST")
          test "${#INPUTS[@]}" -eq 10
          docker run --rm --entrypoint /bin/bash --user 0:0 \
            --workdir /workspace -v "$PWD:/workspace" "$BUILD_BASE_REF" -lc \
            'set -euo pipefail; source /environment; physics_app/physics-opt --check-input "$@"' -- -i "${INPUTS[@]}" \
            2>&1 | tee "$CHEM/issue477_s6_combined_consumers/$CASE/check_input.log"
          echo "ISSUE477_P2_NATIVE_CHECK_INPUT_PASS $CASE"

      - name: P3 genuine fresh 0-100us native solve
        id: p3
        shell: bash
        run: |
          set -euo pipefail
          cd target/pinned_oxygen14
          CASE="${{ matrix.case }}"
          ROOT="$CHEM/issue477_s6_combined_consumers/$CASE"
          MANIFEST="$ROOT/case_manifest.json"
          mapfile -t INPUTS < <(python3 -c 'import json,sys;print("\n".join(json.load(open(sys.argv[1]))["input_paths"]))' "$MANIFEST")
          test -s "$ROOT/check_input.log"
          test ! -e "$ROOT/run/plasma.e"
          start="$(date +%s)"
          set +e
          timeout -s TERM -k 60s 19800s docker run --rm --entrypoint /bin/bash --user 0:0 \
            --workdir /workspace -v "$PWD:/workspace" "$BUILD_BASE_REF" -lc \
            'set -euo pipefail; source /environment; physics_app/physics-opt "$@"' \
            -- -i "${INPUTS[@]}" "Outputs/file_base=$ROOT/run/plasma" 2>&1 | tee "$ROOT/runtime.log"
          code="${PIPESTATUS[0]}"
          set -e
          elapsed="$(( $(date +%s) - start ))"
          printf 'case=%s\nsource_sha=%s\nend_time_s=0.0001\nexpected_steps=460\nsolver_exit=%s\nelapsed_s=%s\nscience=HOLD\n' \
            "$CASE" "$PINNED_SOURCE" "$code" "$elapsed" > "$ROOT/runtime_status.txt"
          echo "ISSUE477_P3_CASE=$CASE EXIT=$code WALL_SECONDS=$elapsed"
          test "$code" -eq 0
          test -s "$ROOT/run/plasma.e"
          test -s "$ROOT/run/plasma.csv"

      - name: P4 produce native 2D maps at 25 50 75 100 us using merged default-plot
        id: plot
        if: steps.p3.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          CONTROL_ROOT="$GITHUB_WORKSPACE/control"
          source "$GITHUB_WORKSPACE/.issue477_venv/bin/activate"
          export PYTHONPATH="$CONTROL_ROOT"
          cd target/pinned_oxygen14
          ROOT="$CHEM/issue477_s6_combined_consumers/${{ matrix.case }}"
          BASE="$CHEM/rf_elastic_diss_ion_ei20_ei01_400w_adjacent_sheath_wall_closed_100us_dt1000ns__C0_chemistry_off.i"
          test -s "$BASE"
          test "$(git -C "$CONTROL_ROOT" rev-parse HEAD)" = "${{ github.sha }}"
          for t in 25 50 75 100; do
            python3 "$CONTROL_ROOT/bin/physics.py" default-plot \
              --mode 2d-map --exodus "$ROOT/run/plasma.e" --input "$BASE" \
              --time-us "$t" --cmap rainbow --color-scale linear --output "$ROOT/plots/2d_map_${t}us.png"
            test -s "$ROOT/plots/2d_map_${t}us.png"
            test -s "$ROOT/plots/2d_map_${t}us.png.json"
          done
          python3 "$CONTROL_ROOT/bin/physics.py" default-plot \
            --mode time-trace --exodus "$ROOT/run/plasma.e" --input "$BASE" \
            --variables power T_e --layout 1x2 \
            --output "$ROOT/plots/power_te_time_trace.png"
          test -s "$ROOT/plots/power_te_time_trace.png"
          test -s "$ROOT/plots/power_te_time_trace.png.json"
          printf 'case=%s\nplot_mode=2d-map,time-trace\ncmap=rainbow\ncolor_scale=linear\ntimes_us=25,50,75,100\ntrace_fields=power,T_e\nscience=HOLD\n' \
            "${{ matrix.case }}" > "$ROOT/plots/plots_manifest.txt"
          echo "ISSUE477_S6_COMBINED_NATIVE_LINEAR_MAP_AND_TRACE_PASS ${{ matrix.case }}"

      - name: Always upload per-case native Exodus logs input SHA manifests and 2D map figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue477-s6-combined-${{ matrix.case }}-400W-100us-${{ github.sha }}
          retention-days: 90
          compression-level: 3
          if-no-files-found: warn
          path: |
            target/pinned_oxygen14/experiments/Issue395_powered_chemistry_ladder/issue477_s6_combined_consumers/${{ matrix.case }}/**
            target/pinned_oxygen14/experiments/Issue395_powered_chemistry_ladder/c0_400_p2_preflight/c0_manifest.json
            target/pinned_oxygen14/experiments/Issue395_powered_chemistry_ladder/rf_elastic_diss_ion_ei20_ei01_400w_adjacent_sheath_wall_closed_100us_dt1000ns__C0_chemistry_off.i
            target/pinned_oxygen14/experiments/Issue395_powered_chemistry_ladder/rf_elastic_multiapp_parent_400w_100us_dt1000ns_overlay.i
            target/pinned_oxygen14/experiments/Issue395_powered_chemistry_ladder/o2_elastic_400w_100us_dt1000ns_overlay.i
            target/pinned_oxygen14/experiments/Issue395_powered_chemistry_ladder/o_elastic_ei17_400w_100us_dt1000ns_overlay.i
            target/pinned_oxygen14/experiments/Issue395_powered_chemistry_ladder/issue477_S2-415_generation_overlay.i
            target/pinned_oxygen14/experiments/Issue395_powered_chemistry_ladder/issue477_S3-415-401_extra_overlay.i
            target/pinned_oxygen14/experiments/Issue395_powered_chemistry_ladder/issue477_S4-401-417_op_ionization_overlay.i
            target/pinned_oxygen14/experiments/Issue395_powered_chemistry_ladder/issue477_S4-401-941_op_ionization_overlay.i
            target/pinned_oxygen14/experiments/Issue395_powered_chemistry_ladder/issue477_S5-417-407_o2_consumer_overlay.i
            target/pinned_oxygen14/experiments/Issue395_powered_chemistry_ladder/issue477_S5-941-407_o2_consumer_overlay.i
            target/pinned_oxygen14/experiments/Issue395_powered_chemistry_ladder/issue477_${{ matrix.case }}_EI2069_overlay.i
            target/pinned_oxygen14/experiments/Issue395_powered_chemistry_ladder/issue477_${{ matrix.case }}_H25_overlay.i
