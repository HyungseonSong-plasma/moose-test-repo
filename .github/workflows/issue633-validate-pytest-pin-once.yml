name: Issue633 validate pytest pin fixture regression one-shot
on:
  push:
    branches:
      - issue-633-validate-pytest-pin-fixtures-20261118
permissions:
  contents: read
jobs:
  validate_pinned_cutover_fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest only
        run: python -m pip install --disable-pip-version-check --quiet 'pytest>=8,<9'
      - name: Run all Issue633 ion retirement tests on exact branch source
        run: python -m pytest -q tests/test_issue633_s6_scratch_ion_retirement.py
