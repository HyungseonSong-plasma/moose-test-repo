name: Issue-228 ion transport-law matrix

on:
  push:
    branches: [issue-228-ion-model-matrix]
    paths:
      - '.github/workflows/issue228-ion-model-matrix.yml'
      - 'experiments/Issue228_ion_model_matrix/**'

permissions:
  contents: read

concurrency:
  group: issue228-ion-model-matrix-${{ github.sha }}
  cancel-in-progress: false

env:
  BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
  MOOSE_SHA: 9f388366ccf38b9c34542ec5561198249fde0ac9
  CRANE_SHA: ba26970cf419dcac563a20ed7079d445bc6341c3
  SQUIRREL_SHA: 16a26d504f3ee11161a86d4e3ebf3c0e5f2afbb1
  ZAPDOS_SHA: 9eceffbc46048c3760bbfa9a7f1ca681ae35af1d

jobs:
  ion-model:
    name: ion-model-${{ matrix.mode }}
    strategy:
      fail-fast: false
      matrix:
        mode: [mixture, no_molar_grad, fickian_charged]
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify exact provenance and pinned dependencies
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          source physics_app/dependencies.lock
          test "$MOOSE" = "$MOOSE_SHA"
          test "$CRANE" = "$CRANE_SHA"
          test "$SQUIRREL" = "$SQUIRREL_SHA"
          test "$ZAPDOS" = "$ZAPDOS_SHA"
          docker pull "$BUILD_BASE_REF"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{ index .Config.Labels "io.physics.moose.sha" }}')" = "$MOOSE_SHA"

      - name: Build and run ${{ matrix.mode }}
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euxo pipefail
          RESULTS="issue228-ion-model-${MODE}-results"
          rm -rf "$RESULTS"
          docker run --rm --entrypoint /bin/bash --user 0:0 --workdir /workspace \
            -e GITHUB_SHA="$GITHUB_SHA" \
            -e MODE="$MODE" \
            -v "$PWD:/workspace" "$BUILD_BASE_REF" -lc '
              set -euxo pipefail
              source /environment
              export PYTHONPATH=/workspace
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt
              git config --global --add safe.directory /workspace
              test "$(git -C /workspace rev-parse HEAD)" = "$GITHUB_SHA"
              uv pip install --system --python "$(command -v python3)" -r requirements-evidence-engine.txt
              python3 -m py_compile experiments/Issue228_ion_model_matrix/run.py
              python3 experiments/Issue228_ion_model_matrix/run.py --self-test
              make -C physics_app -j2
              test -x physics_app/physics-opt
              python3 experiments/Issue228_ion_model_matrix/run.py \
                --mode "$MODE" \
                --physics-opt physics_app/physics-opt \
                --results-root "issue228-ion-model-${MODE}-results" \
                --timeout 1800
            '

      - name: Upload ${{ matrix.mode }} evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue228-ion-model-${{ matrix.mode }}
          path: issue228-ion-model-${{ matrix.mode }}-results
          if-no-files-found: error
          retention-days: 7
