name: Issue 306 wall07 partial evidence extract

on:
  push:
    branches:
      - issue-306-heavy-charge-motion
    paths:
      - .github/workflows/issue306-wall07-extract.yml

permissions:
  contents: read
  actions: read

jobs:
  extract:
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: thermal_ratio2
            artifact_id: 10698682779
          - case: thermal_ratio4
            artifact_id: 10698578587
    runs-on: ubuntu-latest
    steps:
      - name: Download existing artifact ZIP without extracting runtime log
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ matrix.artifact_id }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" \
            -o artifact.zip
          unzip -tq artifact.zip >/dev/null

      - name: Extract compact diagnostics only
        run: |
          set -euo pipefail
          mkdir -p extracted
          prefix="artifacts/experiments/Issue306_heavy_charge_motion/generated_wall07/${{ matrix.case }}"
          for f in             "$prefix/input_step_csv.csv"             "$prefix/input_out_electron0_step_csv.csv"; do
            unzip -p artifact.zip "$f" > "extracted/$(basename "$f")"
          done

          latest_parent=$(unzip -Z1 artifact.zip | grep "$prefix/input_step_csv_parent_profile_" | sort | tail -1)
          latest_energy=$(unzip -Z1 artifact.zip | grep "$prefix/input_out_electron0_step_csv_energy_profile_" | sort | tail -1)
          printf '%s\n' "$latest_parent" > extracted/latest_parent_path.txt
          printf '%s\n' "$latest_energy" > extracted/latest_energy_path.txt
          unzip -p artifact.zip "$latest_parent" > extracted/latest_parent_profile.csv
          unzip -p artifact.zip "$latest_energy" > extracted/latest_energy_profile.csv

          printf 'case=%s\n' "${{ matrix.case }}" > extracted/extract_metadata.txt
          printf 'archive_entries=%s\n' "$(unzip -Z1 artifact.zip | wc -l)" >> extracted/extract_metadata.txt
          printf 'energy_profiles=%s\n' "$(unzip -Z1 artifact.zip | grep -c "$prefix/input_out_electron0_step_csv_energy_profile_")" >> extracted/extract_metadata.txt
          printf 'parent_profiles=%s\n' "$(unzip -Z1 artifact.zip | grep -c "$prefix/input_step_csv_parent_profile_")" >> extracted/extract_metadata.txt

      - uses: actions/upload-artifact@v4
        with:
          name: issue306-wall07-partial-${{ matrix.case }}
          path: extracted/**
          retention-days: 30
