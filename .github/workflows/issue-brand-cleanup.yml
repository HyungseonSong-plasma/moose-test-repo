name: Issue brand cleanup

on:
  push:
    paths:
      - .github/workflows/issue-brand-cleanup.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Normalize Issue titles, bodies, and comments
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request, urllib.error

          repo = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          base = "https://api.github.com"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "physics-issue-brand-cleanup",
          }

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.load(r)

          def normalize(text):
              if not text:
                  return text
              # Preserve historical evidence without retaining the retired brand token.
              replacements = [
                  ("qpx-build-base", "legacy-build-base"),
                  ("qpx-runtime", "legacy-runtime"),
                  ("QPX_BUILD_BASE", "LEGACY_BUILD_BASE"),
                  ("QPX_RUNTIME", "LEGACY_RUNTIME"),
                  ("qpx_app", "physics_app"),
                  ("qpx_harness", "physics_harness"),
                  ("qpx-opt", "physics-opt"),
                  ("QPX_", "PHYSICS_"),
                  ("qpx_", "physics_"),
                  ("QPX", "Physics"),
                  ("qpx", "physics"),
              ]
              for old, new in replacements:
                  text = text.replace(old, new)
              return text

          issues_seen = issues_changed = comments_seen = comments_changed = 0
          page = 1
          while True:
              items = request("GET", f"/repos/{repo}/issues?state=all&per_page=100&page={page}")
              if not items:
                  break
              for item in items:
                  if "pull_request" in item:
                      continue
                  issues_seen += 1
                  number = item["number"]
                  new_title = normalize(item.get("title"))
                  new_body = normalize(item.get("body"))
                  patch = {}
                  if new_title != item.get("title"):
                      patch["title"] = new_title
                  if new_body != item.get("body"):
                      patch["body"] = new_body
                  if patch:
                      request("PATCH", f"/repos/{repo}/issues/{number}", patch)
                      issues_changed += 1

                  if item.get("comments", 0):
                      cp = 1
                      while True:
                          comments = request("GET", f"/repos/{repo}/issues/{number}/comments?per_page=100&page={cp}")
                          if not comments:
                              break
                          for comment in comments:
                              comments_seen += 1
                              new_comment = normalize(comment.get("body"))
                              if new_comment != comment.get("body"):
                                  request("PATCH", f"/repos/{repo}/issues/comments/{comment['id']}", {"body": new_comment})
                                  comments_changed += 1
                          if len(comments) < 100:
                              break
                          cp += 1
              if len(items) < 100:
                  break
              page += 1

          # Direct API readback; do not rely on search-index freshness.
          residues = []
          page = 1
          pattern = re.compile("qpx", re.I)
          while True:
              items = request("GET", f"/repos/{repo}/issues?state=all&per_page=100&page={page}")
              if not items:
                  break
              for item in items:
                  if "pull_request" in item:
                      continue
                  number = item["number"]
                  if pattern.search(item.get("title") or "") or pattern.search(item.get("body") or ""):
                      residues.append(f"issue:{number}")
                  if item.get("comments", 0):
                      cp = 1
                      while True:
                          comments = request("GET", f"/repos/{repo}/issues/{number}/comments?per_page=100&page={cp}")
                          if not comments:
                              break
                          for comment in comments:
                              if pattern.search(comment.get("body") or ""):
                                  residues.append(f"comment:{comment['id']}@issue:{number}")
                          if len(comments) < 100:
                              break
                          cp += 1
              if len(items) < 100:
                  break
              page += 1

          print(f"ISSUES_SEEN={issues_seen}")
          print(f"ISSUES_CHANGED={issues_changed}")
          print(f"COMMENTS_SEEN={comments_seen}")
          print(f"COMMENTS_CHANGED={comments_changed}")
          print(f"QPX_RESIDUE_COUNT={len(residues)}")
          if residues:
              print("RESIDUES=" + ",".join(residues[:100]))
              raise SystemExit(1)
          PY
