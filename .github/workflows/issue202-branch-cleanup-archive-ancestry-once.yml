name: One-shot archive-ancestry branch cleanup

on:
  push:
    branches: [main]
    paths: [.github/workflows/issue202-branch-cleanup-archive-ancestry-once.yml]

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete only branches contained by the preserved archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/workflow/branch_cleanup_round5_20261008.py
