name: Issue541 ARCH S6 historical Hybrid P2 compatibility diagnostic
# Manual-only, intentionally observes P05 failure; never production New-only success.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  issue541_arch_s6_hybrid_native_p2:
    name: Historical ARCH Hybrid 417+941 P05 failure custody (KEEP_HOLD)
    if: github.repository == 'HyungseonSong-plasma/moose-test-repo' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      HISTORICAL_SHA: 29d1acc6ef7969908b86719e4b95c73a1565136d
      OCI: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
      CHEM: experiments/Issue395_powered_chemistry_ladder
      OXYGEN_RESEARCH_400: '1'
      OXYGEN_RESEARCH_FULL24: '0'
      OXYGEN_RESEARCH_EI2738_FORMULA: '0'
      OXYGEN_RESEARCH_QUICK_5MIN: '0'
      EXPECTED_HEAD: ${{ github.sha }}
    steps:
      - name: Checkout exact ARCH source for both S6 variants
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout public original 400W data with immutable historical commit
        uses: actions/checkout@v4
        with:
          ref: 29d1acc6ef7969908b86719e4b95c73a1565136d
          path: historical
          fetch-depth: 1
          persist-credentials: false
      - name: Source and no-private-rate guard for S6 P2
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C control rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git -C historical rev-parse HEAD)" = "$HISTORICAL_SHA"
          test ! -e "historical/$CHEM/private_rates"
          grep -Fq "$OCI" control/physics_app/dependencies.lock
          test -f control/ci/guards/issue541_arch_s6_native_p2_only.py
          python3 -m py_compile control/ci/guards/issue541_arch_s6_native_p2_only.py
          mkdir -p control/experiments/Issue402_plasma_dsl_g1/evidence
          echo ISSUE541_ARCH_S6_SOURCE_PIN_AND_NO_PRIVATE_RATES_P0_PASS
      - name: Set up public 400W Python dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical preprocessing dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --quiet numpy==2.1.2 scipy==1.14.1 matplotlib==3.9.2
      - name: Prepare original 400W public mesh (no private rates)
        shell: bash
        run: |
          set -euo pipefail
          cd historical
          src=.github/oxygen25_eedf/initial_mixture_23xsec_transport.txt
          dst=experiments/Issue91_real_qvt_r3/r3_e0/electron_moments.txt
          test "$(sha256sum "$src" | cut -d ' ' -f1)" = 35534a522fa48ccb5222339c5040040630eef31e623e1c53f1e1c4540d2d653b
          cp "$src" "$dst"
          export CHATGPT_WORK_BASE_SHA="$HISTORICAL_SHA"
          bash "$CHEM/issue397_l1_power_scan_replay.sh" prepare 400
          python3 .github/scripts/oxygen_legacy6_latest_100us.py --power-w 400 --prepare
          test -s "$CHEM/baseline_plasma_plus_unstructured_cover_plus_wafer.msh"
          test ! -e "$CHEM/private_rates"
          echo ISSUE541_ARCH_S6_HISTORICAL_400W_PUBLIC_MESH_P0_PASS
      - name: P1 build exact-source Native once for both S6-417 and S6-941
        shell: bash
        run: |
          set -euo pipefail
          cd control
          docker pull "$OCI"
          docker run --rm --network none --entrypoint /bin/bash --user 0:0 \
            --workdir /workspace -v "$PWD:/workspace" "$OCI" -lc '
              set -euo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt
              make -C physics_app -j2 app_non_unity_dirs="%/utils"
              test -x physics_app/physics-opt
            ' 2>&1 | tee experiments/Issue402_plasma_dsl_g1/evidence/native_build.log
          EXPECTED_HEAD="$EXPECTED_HEAD" OCI="$OCI" python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path("experiments/Issue402_plasma_dsl_g1/evidence")
          def sha(p):
              h=hashlib.sha256()
              with open(p,'rb') as f:
                  for block in iter(lambda:f.read(1048576), b''): h.update(block)
              return h.hexdigest()
          binary=pathlib.Path("physics_app/physics-opt")
          receipt={"schema":"issue402.native_p1.job_local.v1",
                   "reusable_scope":"same_exact_head_ci_job_only",
                   "source_sha":os.environ["EXPECTED_HEAD"],
                   "oci_image":os.environ["OCI"],
                   "binary_sha256":sha(binary),
                   "build_log_sha256":sha(root/"native_build.log"),
                   "P1":"PASS","P3":"NOT_RUN","science":"SCIENCE_HOLD"}
          (root/"native_p1_identity.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print("ISSUE541_ARCH_S6_NATIVE_P1_SHA="+receipt["binary_sha256"])
          PY
      - name: P2 real hybrid JSON+Native check-input for both distinct S6 cases (no timestep)
        shell: bash
        run: |
          set -euo pipefail
          cd control
          test ! -e ../issue541_arch_s6_p2_evidence
          mkdir -p ../issue541_arch_s6_p2_evidence
          set +e
          python3 ci/guards/issue541_arch_s6_native_p2_only.py \
            --case 417 --historical ../historical \
            --expected-head "$EXPECTED_HEAD" \
            --output ../issue541_arch_s6_p2_evidence/S6-417
          first=$?
          python3 ci/guards/issue541_arch_s6_native_p2_only.py \
            --case 941 --historical ../historical \
            --expected-head "$EXPECTED_HEAD" \
            --output ../issue541_arch_s6_p2_evidence/S6-941
          second=$?
          set -e
          # This is a manual COMPATIBILITY NEGATIVE, not production P2 success.
          # The original runner must continue returning HOLD / exit=3.
          test "$first" -eq 3
          test "$second" -eq 3
          python3 - <<'PY'
          import json
          from pathlib import Path
          for case in ("417", "941"):
              root=Path("../issue541_arch_s6_p2_evidence")/f"S6-{case}"
              status=json.loads((root/"status.json").read_text())
              log=(root/"native_P2.log").read_text(errors="replace")
              assert status["P2"]=="HOLD"
              assert status["native_check"]["exit_code"]==1
              assert "P05 FV Native/Physics duplicate or unexpected owner" in log
              assert "on 'log_O2p': ni_time" in log
              assert "PhysicsFVLogMolarElectronTimeDerivative" in log
              assert status["P3"]=="NOT_RUN" and status["science"]=="SCIENCE_HOLD"
          print("ARCH_HYBRID_P05_FAILURE_REPRO_BOTH_CASES_KEEP_HOLD")
          PY
      - name: Always upload both S6 P2 diagnostics, no raw scratch or protected archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue541-arch-s6-hybrid-compat-keep-hold-${{ github.sha }}
          path: |
            issue541_arch_s6_p2_evidence/*/status.json
            issue541_arch_s6_p2_evidence/*/native_P2.log
            control/experiments/Issue402_plasma_dsl_g1/evidence/native_p1_identity.json
            control/experiments/Issue402_plasma_dsl_g1/evidence/native_build.log
          if-no-files-found: error
          retention-days: 30
