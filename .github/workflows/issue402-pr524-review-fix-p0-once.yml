name: Issue402 PR524 review correction P0 one-shot
on:
  push:
    branches: [issue-402-species-functor-naming]
    paths: [.github/workflows/issue402-pr524-review-fix-p0-once.yml]
permissions:
  contents: read
jobs:
  review-fix-p0:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact-head electron owner and S6 public archive P0 only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -e physics_app/src/functormaterials/PhysicsIonWallTotalFluxMaterial.C
          python3 -m pip install --disable-pip-version-check --quiet 'pytest>=8,<9'
          python3 -m py_compile experiments/Issue402_plasma_dsl_g1/chemistry/prepare_s6_run_input.py
          python3 -m pytest -q tests/test_issue402_s6_wall_naming_staging.py tests/test_issue402_wall_semantic_parity.py tests/test_issue402_species_functor_naming.py tests/test_retired_legacy_physics_owners_contract.py tests/test_issue402_s6_chemistry_run_templates.py tests/test_issue402_full_s6_p2_only.py
          echo "ISSUE402_PR524_REVIEW_FIX_P0_PASS SOURCE=$GITHUB_SHA"
          echo 'P3=NOT_RUN SCIENCE=SCIENCE_HOLD'
