name: Physics Runtime Consumer

on:
  workflow_dispatch:
    inputs:
      runtime_ref:
        description: 'Immutable public physics-runtime ref (image@sha256:digest)'
        required: true
        type: string
      build_base_ref:
        description: 'Immutable physics-build-base ref recorded in runtime provenance'
        required: true
        type: string

concurrency:
  group: physics-runtime-consumer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PHYSICS_RUNTIME_REF: ${{ inputs.runtime_ref }}
  EXPECTED_BUILD_BASE_REF: ${{ inputs.build_base_ref }}
  EXPECTED_SOURCE_OWNER: moose-test-repo/physics_app
  EXPECTED_MOOSE_SHA: 9f388366ccf38b9c34542ec5561198249fde0ac9
  EXPECTED_CRANE_SHA: ba26970cf419dcac563a20ed7079d445bc6341c3
  EXPECTED_SQUIRREL_SHA: 16a26d504f3ee11161a86d4e3ebf3c0e5f2afbb1
  EXPECTED_ZAPDOS_SHA: 9eceffbc46048c3760bbfa9a7f1ca681ae35af1d

jobs:
  runtime-contract:
    name: public-immutable-runtime-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Validate immutable public refs
        shell: bash
        run: |
          set -euxo pipefail
          [[ "$PHYSICS_RUNTIME_REF" =~ ^ghcr\.io/hyungseonsong-plasma/physics-runtime@sha256:[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_BUILD_BASE_REF" =~ ^ghcr\.io/hyungseonsong-plasma/physics-build-base@sha256:[0-9a-f]{64}$ ]]

      - name: Pull public Physics runtime without package credentials
        id: pull
        shell: bash
        run: |
          set -euxo pipefail
          start="$(date +%s)"
          docker pull "$PHYSICS_RUNTIME_REF"
          end="$(date +%s)"
          pull_seconds="$((end - start))"
          size_bytes="$(docker image inspect "$PHYSICS_RUNTIME_REF" --format '{{.Size}}')"
          echo "pull_seconds=$pull_seconds" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$size_bytes" >> "$GITHUB_OUTPUT"

      - name: Verify immutable Physics provenance
        shell: bash
        run: |
          set -euxo pipefail
          source_owner="$(docker image inspect "$PHYSICS_RUNTIME_REF" --format '{{ index .Config.Labels "io.physics.source.owner" }}')"
          source_manifest="$(docker image inspect "$PHYSICS_RUNTIME_REF" --format '{{ index .Config.Labels "io.physics.source.manifest-sha256" }}')"
          repository_sha="$(docker image inspect "$PHYSICS_RUNTIME_REF" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          build_base="$(docker image inspect "$PHYSICS_RUNTIME_REF" --format '{{ index .Config.Labels "io.physics.build-base.ref" }}')"
          moose_sha="$(docker image inspect "$PHYSICS_RUNTIME_REF" --format '{{ index .Config.Labels "io.physics.moose.sha" }}')"
          crane_sha="$(docker image inspect "$PHYSICS_RUNTIME_REF" --format '{{ index .Config.Labels "io.physics.crane.sha" }}')"
          squirrel_sha="$(docker image inspect "$PHYSICS_RUNTIME_REF" --format '{{ index .Config.Labels "io.physics.squirrel.sha" }}')"
          zapdos_sha="$(docker image inspect "$PHYSICS_RUNTIME_REF" --format '{{ index .Config.Labels "io.physics.zapdos.sha" }}')"

          test "$source_owner" = "$EXPECTED_SOURCE_OWNER"
          [[ "$source_manifest" =~ ^[0-9a-f]{64}$ ]]
          [[ "$repository_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$build_base" = "$EXPECTED_BUILD_BASE_REF"
          test "$moose_sha" = "$EXPECTED_MOOSE_SHA"
          test "$crane_sha" = "$EXPECTED_CRANE_SHA"
          test "$squirrel_sha" = "$EXPECTED_SQUIRREL_SHA"
          test "$zapdos_sha" = "$EXPECTED_ZAPDOS_SHA"
          echo PHYSICS_RUNTIME_PROVENANCE_PASS

      - name: Census runtime filesystem size
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail
          rootfs="$(mktemp -d)"
          cid="$(docker create "$PHYSICS_RUNTIME_REF")"
          cleanup() {
            docker rm -f "$cid" >/dev/null 2>&1 || true
            sudo rm -rf "$rootfs" || true
          }
          trap cleanup EXIT

          docker export "$cid" | tar -C "$rootfs" -xf -
          docker rm "$cid" >/dev/null
          cid=""

          {
            echo "RUNTIME_CENSUS_TOTAL_BYTES=$(du -sb "$rootfs" | awk '{print $1}')"
            echo "RUNTIME_CENSUS_TOP_LEVEL_BEGIN"
            for path in "$rootfs"/opt/* "$rootfs"/usr/* "$rootfs"/lib "$rootfs"/lib64; do
              [[ -e "$path" || -L "$path" ]] || continue
              bytes="$(du -sb "$path" | awk '{print $1}')"
              printf '%s\t/%s\n' "$bytes" "${path#"$rootfs"/}"
            done | sort -nr
            echo "RUNTIME_CENSUS_TOP_LEVEL_END"

            echo "RUNTIME_CENSUS_OPT_SHARE_BEGIN"
            for path in "$rootfs"/opt/share/*; do
              [[ -e "$path" || -L "$path" ]] || continue
              bytes="$(du -sb "$path" | awk '{print $1}')"
              printf '%s\t/%s\n' "$bytes" "${path#"$rootfs"/}"
            done | sort -nr
            echo "RUNTIME_CENSUS_OPT_SHARE_END"

            echo "RUNTIME_CENSUS_PHYSICS_VENDOR_BEGIN"
            for path in "$rootfs"/opt/physics_vendor/*; do
              [[ -e "$path" || -L "$path" ]] || continue
              bytes="$(du -sb "$path" | awk '{print $1}')"
              printf '%s\t/%s\n' "$bytes" "${path#"$rootfs"/}"
            done | sort -nr
            echo "RUNTIME_CENSUS_PHYSICS_VENDOR_END"

            echo "RUNTIME_CENSUS_LARGEST_FILES_BEGIN"
            find "$rootfs" -type f -printf '%s\t/%P\n' | sort -nr | sed -n '1,40p'
            echo "RUNTIME_CENSUS_LARGEST_FILES_END"
          } > physics-runtime-census.txt

          cat physics-runtime-census.txt

      - name: Run Physics check-input smoke
        shell: bash
        run: docker run --rm "$PHYSICS_RUNTIME_REF" --check-input -i /opt/physics/ci/smoke.i

      - name: Run bounded real Physics smoke
        shell: bash
        run: docker run --rm "$PHYSICS_RUNTIME_REF" -i /opt/physics/ci/smoke.i

      - name: Record runtime consumer evidence
        if: always()
        shell: bash
        run: |
          {
            echo "PHYSICS_RUNTIME_REF=$PHYSICS_RUNTIME_REF"
            echo "EXPECTED_BUILD_BASE_REF=$EXPECTED_BUILD_BASE_REF"
            echo "RUNTIME_PULL_SECONDS=${{ steps.pull.outputs.pull_seconds }}"
            echo "RUNTIME_LOCAL_SIZE_BYTES=${{ steps.pull.outputs.size_bytes }}"
            echo "PUBLIC_RUNTIME_PULL_WITHOUT_PRIVATE_CREDENTIAL=${{ job.status == 'success' && 'PASS' || 'FAIL' }}"
            echo "PHYSICS_CHECK_INPUT_SMOKE=${{ job.status == 'success' && 'PASS' || 'FAIL' }}"
            echo "BOUNDED_REAL_PHYSICS_RUN=${{ job.status == 'success' && 'PASS' || 'FAIL' }}"
            echo "ORDINARY_CI_PULLS_MOOSE_DEV=false"
            echo "ORDINARY_CI_PULLS_PHYSICS_BUILD_BASE=false"
            echo "ORDINARY_CI_REBUILDS_MOOSE_STACK=false"
            echo "ORDINARY_CI_COMPILES_PHYSICS_APPLICATION=false"
          } > physics-runtime-consumer-evidence.txt

      - name: Upload runtime consumer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: physics-runtime-consumer-evidence
          path: physics-runtime-consumer-evidence.txt

      - name: Upload runtime size census
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: physics-runtime-size-census
          path: physics-runtime-census.txt
