name: Issue 376 Maxwell plasma RF transfer T1-T3

on:
  push:
    branches:
      - issue376-maxwell-plasma-rf-transfer
    paths:
      - '.github/workflows/issue376-t1b-once.yml'
      - 'experiments/Issue376_maxwell_plasma_rf_transfer/**'

permissions:
  contents: read

jobs:
  transfer-t1-t3:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
      CASE: experiments/Issue376_maxwell_plasma_rf_transfer
      MAXWELL: experiments/Issue202_maxwell_scalar_fem_m0
      PLASMA_MESH: experiments/fem_fvm_plasma_discriminator/plasma_contour_l3_4p5mm.msh

    steps:
      - name: Checkout exact pushed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify exact source revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Set up deterministic Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned analysis dependencies
        shell: bash
        run: python3 -m pip install --disable-pip-version-check --quiet numpy==2.1.2 scipy==1.14.1

      - name: Generate current accepted contour plasma mesh
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/fem_fvm_plasma_discriminator/generate_contour_mesh.py | tee "$CASE/mesh.log"
          test -f "$PLASMA_MESH"

      - name: Pull pinned Physics build environment
        shell: bash
        run: docker pull "$BUILD_BASE_REF"

      - name: Build current exact-head Physics application
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash --user 0:0 \
            --workdir /workspace -v "$GITHUB_WORKSPACE:/workspace" \
            "$BUILD_BASE_REF" -lc '
              set -euo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory /opt/physics_vendor/moose
              git config --global --add safe.directory /opt/physics_vendor/crane
              git config --global --add safe.directory /opt/physics_vendor/squirrel
              git config --global --add safe.directory /opt/physics_vendor/zapdos
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt
              make -C physics_app -j2
            '
          test -x physics_app/physics-opt

      - name: Reproduce frozen Issue 202 Maxwell source field
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CASE/results_t1b" "$CASE/results_t3"
          docker run --rm --entrypoint /bin/bash --user 0:0 \
            --workdir /workspace -v "$GITHUB_WORKSPACE:/workspace" \
            "$BUILD_BASE_REF" -lc "source /environment && physics_app/physics-opt -i '$MAXWELL/rf_power.i' Outputs/file_base='$CASE/results_t1b/maxwell'" \
            2>&1 | tee "$CASE/results_t1b/maxwell.log"
          test -f "$CASE/results_t1b/maxwell.e"
          test -f "$CASE/results_t1b/maxwell.csv"

      - name: Check transfer target against exact-head physics-opt
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash --user 0:0 \
            --workdir /workspace -v "$GITHUB_WORKSPACE:/workspace" \
            "$BUILD_BASE_REF" -lc "source /environment && physics_app/physics-opt --check-input -i '$CASE/t1b_target.i'" \
            2>&1 | tee "$CASE/results_t1b/check_target.log"

      - name: T1 transfer-disabled baseline mapping
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash --user 0:0 \
            --workdir /workspace -v "$GITHUB_WORKSPACE:/workspace" \
            "$BUILD_BASE_REF" -lc "source /environment && physics_app/physics-opt -i '$CASE/t1b_target.i' source_enable=0 rf_scale=1 Outputs/file_base='$CASE/results_t1b/raw'" \
            2>&1 | tee "$CASE/results_t1b/raw.log"

      - name: Compute conservative power renormalization
        id: scale
        shell: bash
        run: |
          set -euo pipefail
          scale=$(python3 - <<'PY'
          import csv
          from pathlib import Path
          case = Path('experiments/Issue376_maxwell_plasma_rf_transfer/results_t1b')
          def last(path):
              with path.open(newline='') as f:
                  rows=list(csv.DictReader(f))
              return rows[-1]
          p_src=float(last(case/'maxwell.csv')['P_abs'])
          p_raw=float(last(case/'raw.csv')['P_rf_raw_W'])
          if not (p_src > 0 and p_raw > 0):
              raise SystemExit('non-positive source/raw power')
          print(f'{p_src/p_raw:.17g}')
          PY
          )
          echo "rf_scale=$scale" | tee "$CASE/results_t1b/scale.txt"
          echo "value=$scale" >> "$GITHUB_OUTPUT"

      - name: T1 conservative RF source injection into FEM log_energy
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash --user 0:0 \
            --workdir /workspace -v "$GITHUB_WORKSPACE:/workspace" \
            "$BUILD_BASE_REF" -lc "source /environment && physics_app/physics-opt -i '$CASE/t1b_target.i' source_enable=1 rf_scale='${{ steps.scale.outputs.value }}' Outputs/file_base='$CASE/results_t1b/scaled'" \
            2>&1 | tee "$CASE/results_t1b/scaled.log"

      - name: Analyze T1 transfer and electron-energy closure
        shell: bash
        run: |
          set -euo pipefail
          python3 "$CASE/analyze_t1b.py" \
            --maxwell "$CASE/results_t1b/maxwell.csv" \
            --raw "$CASE/results_t1b/raw.csv" \
            --scaled "$CASE/results_t1b/scaled.csv" \
            --mesh "$PLASMA_MESH" \
            --input "$CASE/t1b_target.i" \
            --scale "${{ steps.scale.outputs.value }}" \
            --output "$CASE/results_t1b/analysis.json" \
            | tee "$CASE/results_t1b/analyzer.log"

      - name: Analyze T2 independent spatial transfer
        shell: bash
        run: |
          set -euo pipefail
          python3 "$CASE/analyze_t2_spatial.py" \
            --source "$CASE/results_t1b/maxwell.e" \
            --target "$CASE/results_t1b/raw.e" \
            --maxwell-csv "$CASE/results_t1b/maxwell.csv" \
            --raw-csv "$CASE/results_t1b/raw.csv" \
            --output "$CASE/results_t1b/t2_spatial_analysis.json" \
            | tee "$CASE/results_t1b/t2_spatial_analyzer.log"

      - name: T3 frozen-state repeat Maxwell and transfer
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash --user 0:0 \
            --workdir /workspace -v "$GITHUB_WORKSPACE:/workspace" \
            "$BUILD_BASE_REF" -lc "source /environment && physics_app/physics-opt -i '$MAXWELL/rf_power.i' Outputs/file_base='$CASE/results_t3/baseline_repeat'" \
            2>&1 | tee "$CASE/results_t3/baseline_repeat.log"
          docker run --rm --entrypoint /bin/bash --user 0:0 \
            --workdir /workspace -v "$GITHUB_WORKSPACE:/workspace" \
            "$BUILD_BASE_REF" -lc "source /environment && physics_app/physics-opt -i '$CASE/t1b_target.i' maxwell_solution_file=results_t3/baseline_repeat.e source_enable=0 rf_scale=1 Outputs/file_base='$CASE/results_t3/baseline_transfer_repeat'" \
            2>&1 | tee "$CASE/results_t3/baseline_transfer_repeat.log"

      - name: T3 RF source-off counterfactual
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash --user 0:0 \
            --workdir /workspace -v "$GITHUB_WORKSPACE:/workspace" \
            "$BUILD_BASE_REF" -lc "source /environment && physics_app/physics-opt -i '$MAXWELL/rf_power.i' source_scale=0 Outputs/file_base='$CASE/results_t3/field_off_source'" \
            2>&1 | tee "$CASE/results_t3/field_off_source.log"
          docker run --rm --entrypoint /bin/bash --user 0:0 \
            --workdir /workspace -v "$GITHUB_WORKSPACE:/workspace" \
            "$BUILD_BASE_REF" -lc "source /environment && physics_app/physics-opt -i '$CASE/t1b_target.i' maxwell_solution_file=results_t3/field_off_source.e source_enable=1 rf_scale=1 plasma_sigma_real=5 Outputs/file_base='$CASE/results_t3/field_off_target'" \
            2>&1 | tee "$CASE/results_t3/field_off_target.log"

      - name: T3 sigma_R-zero reactive-only counterfactual
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash --user 0:0 \
            --workdir /workspace -v "$GITHUB_WORKSPACE:/workspace" \
            "$BUILD_BASE_REF" -lc "source /environment && physics_app/physics-opt -i '$MAXWELL/rf_power.i' plasma_sigma_real=0 plasma_sigma_imag=-10 Outputs/file_base='$CASE/results_t3/reactive_source'" \
            2>&1 | tee "$CASE/results_t3/reactive_source.log"
          docker run --rm --entrypoint /bin/bash --user 0:0 \
            --workdir /workspace -v "$GITHUB_WORKSPACE:/workspace" \
            "$BUILD_BASE_REF" -lc "source /environment && physics_app/physics-opt -i '$CASE/t1b_target.i' maxwell_solution_file=results_t3/reactive_source.e source_enable=1 rf_scale=1 plasma_sigma_real=0 Outputs/file_base='$CASE/results_t3/reactive_target'" \
            2>&1 | tee "$CASE/results_t3/reactive_target.log"

      - name: Analyze T3 counterfactuals
        shell: bash
        run: |
          set -euo pipefail
          python3 "$CASE/analyze_t3_counterfactuals.py" \
            --baseline-source-csv "$CASE/results_t1b/maxwell.csv" \
            --baseline-source-e "$CASE/results_t1b/maxwell.e" \
            --baseline-target-csv "$CASE/results_t1b/raw.csv" \
            --baseline-target-e "$CASE/results_t1b/raw.e" \
            --repeat-source-csv "$CASE/results_t3/baseline_repeat.csv" \
            --repeat-source-e "$CASE/results_t3/baseline_repeat.e" \
            --repeat-target-csv "$CASE/results_t3/baseline_transfer_repeat.csv" \
            --repeat-target-e "$CASE/results_t3/baseline_transfer_repeat.e" \
            --field-off-source-csv "$CASE/results_t3/field_off_source.csv" \
            --field-off-target-csv "$CASE/results_t3/field_off_target.csv" \
            --reactive-source-csv "$CASE/results_t3/reactive_source.csv" \
            --reactive-target-csv "$CASE/results_t3/reactive_target.csv" \
            --output "$CASE/results_t3/analysis.json" \
            | tee "$CASE/results_t3/analyzer.log"

      - name: Upload T1-T3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue376-t1-t3-rf-transfer-evidence
          path: |
            experiments/Issue376_maxwell_plasma_rf_transfer/results_t1b/**
            experiments/Issue376_maxwell_plasma_rf_transfer/results_t3/**
            experiments/Issue376_maxwell_plasma_rf_transfer/t1b_target.i
            experiments/fem_fvm_plasma_discriminator/plasma_contour_l3_4p5mm.msh
          if-no-files-found: warn
          retention-days: 30
