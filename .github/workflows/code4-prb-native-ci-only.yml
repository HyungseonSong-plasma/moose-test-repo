# CI-only evidence branch for #708. NEVER MERGE this workflow to main.
# A governed workflow-surface guard excludes ad-hoc permanent workflows.
name: Code4 PR-B bounded exact-source Native A-B (CI ONLY NEVER MERGE)

on:
  push:
    branches:
      - issue-708-code4-native-evidence-ci-only
    paths:
      - .github/workflows/code4-prb-native-ci-only.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code4-native-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      OCI: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
    steps:
      - name: Checkout exact evidence-only source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact HEAD and independent P0 controls
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          python3 -m unittest discover -s tests -p test_code4_drift_bounded_ab.py -v

      - name: Generate ten exact-head old/new bounded fixture inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/code4_drift_retirement/bounded_ab.py \
            --prepare --directory code4-pr-b --expected-head "$GITHUB_SHA"
          test "$(find code4-pr-b -maxdepth 1 -name '*.i' | wc -l)" -eq 10

      - name: P1 - build exact source in pinned Physics build OCI
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$OCI"
          docker run --rm --network none --entrypoint /bin/bash \
            --user 0:0 --workdir /workspace -v "$PWD:/workspace" "$OCI" -lc '
              set -euo pipefail
              source /environment
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt
              make -C physics_app -j2 app_non_unity_dirs="%/utils"
              test -x physics_app/physics-opt
            ' 2>&1 | tee code4-pr-b/native_build.log
          sha256sum physics_app/physics-opt | awk '{print $1}' > code4-pr-b/binary_sha256.txt
          docker image inspect "$OCI" --format '{{json .RepoDigests}}' > code4-pr-b/oci_repodigests.json
          echo "CODE4_PR_B_P1=PASS"

      - name: P2 - check both real Native input types for five controls
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint /bin/bash \
            --user 0:0 --workdir /workspace -v "$PWD:/workspace" "$OCI" -lc '
              set -euo pipefail
              cd code4-pr-b
              for f in *.i; do
                echo "P2_CHECK:$f"
                if ! /workspace/physics_app/physics-opt --check-input -i "$f" \
                    > "${f%.i}_p2.log" 2>&1; then
                  echo "P2_FAIL:$f"
                  tail -n 80 "${f%.i}_p2.log"
                  exit 1
                fi
              done
            '
          echo "CODE4_PR_B_P2=PASS TEN_CASES"

      - name: P3 - run old and candidate time integration from one Native binary
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint /bin/bash \
            --user 0:0 --workdir /workspace -v "$PWD:/workspace" "$OCI" -lc '
              set -euo pipefail
              cd code4-pr-b
              for f in *.i; do
                echo "P3_RUN:$f"
                if ! /workspace/physics_app/physics-opt -i "$f" \
                    > "${f%.i}_p3.log" 2>&1; then
                  echo "P3_FAIL:$f"
                  tail -n 100 "${f%.i}_p3.log"
                  exit 1
                fi
              done
            '
          echo "CODE4_PR_B_P3_EXECUTED=TEN_CASES"

      - name: Independent analysis of bounded Native observed trajectories
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/code4_drift_retirement/bounded_ab.py \
            --analyze --directory code4-pr-b \
            --expected-head "$GITHUB_SHA" \
            --binary-sha256 "$(cat code4-pr-b/binary_sha256.txt)"
          echo "CODE4_PR_B_ANALYSIS_COMPLETE=YES"

      - name: Upload exact-head A-B evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code4-prb-native-${{ github.sha }}
          path: code4-pr-b/
          if-no-files-found: warn
          retention-days: 30
