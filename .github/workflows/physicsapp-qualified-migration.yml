name: PhysicsApp Qualified Migration

on:
  push:
    branches:
      - physicsapp-qualified-migration-20260927
  pull_request:
    branches:
      - main
    paths:
      - 'physics_app/**'
      - '.github/workflows/physicsapp-qualified-migration.yml'

permissions:
  contents: read
  packages: read

env:
  BUILD_BASE: ghcr.io/hyungseonsong-plasma/physics-build-base:moose-9f388366-deps-ba26970-16a26d5-9eceffb-v1

jobs:
  build-and-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and validate migrated PhysicsApp surface
        shell: bash
        run: |
          set -euxo pipefail
          docker pull "$BUILD_BASE"
          docker run --rm             --entrypoint /bin/bash             --user 0:0             --workdir /workspace/physics_app             -v "$PWD:/workspace"             "$BUILD_BASE"             -lc '
              set -euxo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt

              python3 ci/check_gummel_iteration_action_contract.py
              python3 ci/check_plasma_closures_contract.py
              make -j2
              ./physics-opt --check-input -i ci/gummel_action_smoke.i
              ./physics-opt --check-input -i ci/plasma_closures_smoke.i
              ./physics-opt -i ci/plasma_closures_smoke.i
            '

      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: physicsapp-qualified-migration-source
          path: |
            physics_app/.clang-format
            physics_app/Makefile
            physics_app/LICENSE
            physics_app/README.md
            physics_app/SOURCE_PROVENANCE.md
            physics_app/dependencies.lock
            physics_app/include
            physics_app/src
            physics_app/ci
            physics_app/data
            physics_app/docs
            physics_app/test
          if-no-files-found: error
