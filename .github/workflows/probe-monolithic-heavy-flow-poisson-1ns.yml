name: Probe Monolithic Heavy Flow Poisson 1ns

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: probe-monolithic-heavy-flow-poisson-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  monolithic-heavy-flow-poisson-1ns:
    if: github.event_name == 'pull_request' && github.head_ref == 'issue-359-qualified-gummel-icp'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    env:
      BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
      PROBE_DIR: experiments/2d-icp-poisson-experiment/probes/monolithic_heavy_flow_1ns

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build exact-head Physics runtime
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          docker pull "$BUILD_BASE_REF"
          docker run --rm \
            --entrypoint /bin/bash \
            --user 0:0 \
            --workdir /workspace \
            -v "$PWD:/workspace" \
            "$BUILD_BASE_REF" \
            -lc '
              set -euxo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory /opt/physics_vendor/moose
              git config --global --add safe.directory /opt/physics_vendor/crane
              git config --global --add safe.directory /opt/physics_vendor/squirrel
              git config --global --add safe.directory /opt/physics_vendor/zapdos
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt
              make -C /workspace/physics_app -j2
              chmod -R a+rwX /workspace/physics_app
            '
          test -x physics_app/physics-opt

      - name: Prepare atomic monolithic input
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .ci-monolithic-heavy-flow-poisson
          PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}" \
            python3 "$PROBE_DIR/prepare.py" .ci-monolithic-heavy-flow-poisson/case
          PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}" \
            python3 "$PROBE_DIR/standardize_output.py" .ci-monolithic-heavy-flow-poisson/case

          python3 - <<'PY'
          from pathlib import Path
          import json, re

          p = Path('.ci-monolithic-heavy-flow-poisson/case/input.i')
          s = p.read_text()
          all_ground = (
              'inlet outlet plasma_electrode plasma_metal plasma_right '
              'plasma_cover plasma_wafer plasma_focus_ring'
          )
          pattern = (
              r'(\[phi_grounded_walls\].*?\n\s*type\s*=\s*FVDirichletBC.*?'
              r'\n\s*variable\s*=\s*phi.*?\n)\s*boundary\s*=.*?(\n\s*value\s*=\s*0(?:\.0+)?)'
          )
          repl = rf"\1    boundary = '{all_ground}'\2"
          s2, n = re.subn(pattern, repl, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('failed to enforce phi_grounded_walls boundary list')
          p.write_text(s2)

          block = re.search(r'\[phi_grounded_walls\](.*?)\n\s*\[\]', s2, re.S)
          if not block:
              raise SystemExit('missing phi_grounded_walls block after enforcement')
          m = re.search(r"boundary\s*=\s*'([^']+)'", block.group(1))
          if not m:
              raise SystemExit('missing grounded boundary parameter')
          grounded = m.group(1).split()
          expected = all_ground.split()
          if grounded != expected:
              raise SystemExit(f'grounding mismatch: {grounded} != {expected}')
          if 'inlet' not in grounded or 'outlet' not in grounded:
              raise SystemExit('inlet/outlet are not grounded')

          Path('.ci-monolithic-heavy-flow-poisson/case/grounding_contract.json').write_text(
              json.dumps({
                  'phi_dirichlet_value_V': 0.0,
                  'grounded_boundaries': grounded,
                  'inlet_grounded': True,
                  'outlet_grounded': True,
              }, indent=2) + '\n'
          )
          print('Poisson all-ground enforced:', ' '.join(grounded))
          PY

          test -f .ci-monolithic-heavy-flow-poisson/case/input.i
          test -f .ci-monolithic-heavy-flow-poisson/case/probe_contract.json
          test -f .ci-monolithic-heavy-flow-poisson/case/output_schema.json
          test -f .ci-monolithic-heavy-flow-poisson/case/grounding_contract.json

      - name: Check monolithic input
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm \
            --entrypoint /bin/bash \
            --user "$(id -u):$(id -g)" \
            --workdir /workspace/.ci-monolithic-heavy-flow-poisson/case \
            -v "$PWD:/workspace" \
            "$BUILD_BASE_REF" \
            -lc 'source /environment && /workspace/physics_app/physics-opt --check-input -i input.i'

      - name: Run one 1 ns monolithic step
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm \
            --entrypoint /bin/bash \
            --user "$(id -u):$(id -g)" \
            --workdir /workspace/.ci-monolithic-heavy-flow-poisson/case \
            -v "$PWD:/workspace" \
            "$BUILD_BASE_REF" \
            -lc '
              set +e
              source /environment
              /workspace/physics_app/physics-opt -i input.i > runtime.log 2>&1
              rc=$?
              cat runtime.log
              exit $rc
            '
          test -f .ci-monolithic-heavy-flow-poisson/case/poisson.e
          cp .ci-monolithic-heavy-flow-poisson/case/poisson.e \
             .ci-monolithic-heavy-flow-poisson/monolithic_heavy_flow_poisson_1ns.e

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monolithic-heavy-flow-poisson-1ns
          path: |
            .ci-monolithic-heavy-flow-poisson/monolithic_heavy_flow_poisson_1ns.e
            .ci-monolithic-heavy-flow-poisson/case/probe_contract.json
            .ci-monolithic-heavy-flow-poisson/case/output_schema.json
            .ci-monolithic-heavy-flow-poisson/case/grounding_contract.json
            .ci-monolithic-heavy-flow-poisson/case/input.i
            .ci-monolithic-heavy-flow-poisson/case/runtime.log
            .ci-monolithic-heavy-flow-poisson/case/poisson*.csv
            .ci-monolithic-heavy-flow-poisson/case/poisson*.e
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
