name: Probe Monolithic Heavy Flow Poisson 20ns

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: probe-monolithic-heavy-flow-poisson-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  monolithic-heavy-flow-poisson-20ns:
    if: github.event_name == 'pull_request' && github.head_ref == 'issue-359-qualified-gummel-icp'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      packages: read
    env:
      BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/physics-build-base@sha256:2c3352da4f5c1b2ae98475fc01463ad0cdbc6ce7d221ce55055ddea152182008
      PROBE_DIR: experiments/2d-icp-poisson-experiment/probes/monolithic_heavy_flow_1ns

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build exact-head Physics runtime
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          docker pull "$BUILD_BASE_REF"
          docker run --rm \
            --entrypoint /bin/bash \
            --user 0:0 \
            --workdir /workspace \
            -v "$PWD:/workspace" \
            "$BUILD_BASE_REF" \
            -lc '
              set -euxo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory /opt/physics_vendor/moose
              git config --global --add safe.directory /opt/physics_vendor/crane
              git config --global --add safe.directory /opt/physics_vendor/squirrel
              git config --global --add safe.directory /opt/physics_vendor/zapdos
              export MOOSE_DIR=/opt/physics_vendor/moose
              export CRANE_DIR=/opt/physics_vendor/crane
              export SQUIRREL_DIR=/opt/physics_vendor/squirrel
              export ZAPDOS_DIR=/opt/physics_vendor/zapdos
              export METHOD=opt
              make -C /workspace/physics_app -j2
              chmod -R a+rwX /workspace/physics_app
            '
          test -x physics_app/physics-opt

      - name: Prepare all-ground monolithic 20 ns input
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .ci-monolithic-heavy-flow-poisson
          PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}" \
            python3 "$PROBE_DIR/prepare.py" .ci-monolithic-heavy-flow-poisson/case
          PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}" \
            python3 "$PROBE_DIR/standardize_output.py" .ci-monolithic-heavy-flow-poisson/case

          python3 - <<'PY'
          from pathlib import Path
          import json, re

          case = Path('.ci-monolithic-heavy-flow-poisson/case')
          p = case / 'input.i'
          s = p.read_text()

          # Enforce all electrostatic boundaries grounded.
          all_ground = (
              'inlet outlet plasma_electrode plasma_metal plasma_right '
              'plasma_cover plasma_wafer plasma_focus_ring'
          )
          pattern = (
              r'(\[phi_grounded_walls\].*?\n\s*type\s*=\s*FVDirichletBC.*?'
              r'\n\s*variable\s*=\s*phi.*?\n)\s*boundary\s*=.*?(\n\s*value\s*=\s*0(?:\.0+)?)'
          )
          s, n = re.subn(pattern, rf"\1    boundary = '{all_ground}'\2", s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('failed to enforce phi_grounded_walls boundary list')

          # Keep dt=1 ns, extend only to 20 ns / 20 steps.
          exec_match = re.search(r'(\[Executioner\].*?\n\[\])', s, re.S)
          if not exec_match:
              raise SystemExit('missing Executioner block')
          block = exec_match.group(1)
          replacements = {
              'dt': '1.0e-9',
              'dtmin': '1.0e-9',
              'dtmax': '1.0e-9',
              'end_time': '2.0e-8',
              'num_steps': '20',
          }
          for key, value in replacements.items():
              block2, count = re.subn(
                  rf'(?m)^(\s*{key}\s*=\s*).+$',
                  rf'\g<1>{value}',
                  block,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f'failed to set Executioner/{key}')
              block = block2
          s = s[:exec_match.start()] + block + s[exec_match.end():]
          p.write_text(s)

          grounded_block = re.search(r'\[phi_grounded_walls\](.*?)\n\s*\[\]', s, re.S)
          grounded = re.search(r"boundary\s*=\s*'([^']+)'", grounded_block.group(1)).group(1).split()
          if grounded != all_ground.split():
              raise SystemExit(f'grounding mismatch: {grounded}')

          exec_block = re.search(r'\[Executioner\](.*?)\n\[\]', s, re.S).group(1)
          def value(name):
              m = re.search(rf'(?m)^\s*{name}\s*=\s*([^#\s]+)', exec_block)
              if not m:
                  raise SystemExit(f'missing Executioner/{name}')
              return m.group(1)
          contract = {
              'dt_s': float(value('dt')),
              'end_time_s': float(value('end_time')),
              'num_steps': int(value('num_steps')),
              'gas_temperature_K': 300.0,
              'inlet_flow_sccm': 20.0,
              'outlet_pressure_Pa': 1.333223684,
              'outlet_pressure_mTorr': 10.0,
              'grounded_boundaries': grounded,
              'inlet_grounded': 'inlet' in grounded,
              'outlet_grounded': 'outlet' in grounded,
              'bulk_drift': False,
              'electron_joule_heating': False,
          }
          if contract['dt_s'] != 1.0e-9 or contract['end_time_s'] != 2.0e-8 or contract['num_steps'] != 20:
              raise SystemExit(f'time contract mismatch: {contract}')
          (case / 'run_contract_20ns.json').write_text(json.dumps(contract, indent=2) + '\n')
          print(json.dumps(contract, indent=2))
          PY

          test -f .ci-monolithic-heavy-flow-poisson/case/input.i
          test -f .ci-monolithic-heavy-flow-poisson/case/output_schema.json
          test -f .ci-monolithic-heavy-flow-poisson/case/run_contract_20ns.json

      - name: Check monolithic 20 ns input
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm \
            --entrypoint /bin/bash \
            --user "$(id -u):$(id -g)" \
            --workdir /workspace/.ci-monolithic-heavy-flow-poisson/case \
            -v "$PWD:/workspace" \
            "$BUILD_BASE_REF" \
            -lc 'source /environment && /workspace/physics_app/physics-opt --check-input -i input.i'

      - name: Run 20 ns monolithic transient
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm \
            --entrypoint /bin/bash \
            --user "$(id -u):$(id -g)" \
            --workdir /workspace/.ci-monolithic-heavy-flow-poisson/case \
            -v "$PWD:/workspace" \
            "$BUILD_BASE_REF" \
            -lc '
              set +e
              source /environment
              /workspace/physics_app/physics-opt -i input.i > runtime.log 2>&1
              rc=$?
              cat runtime.log
              exit $rc
            '
          test -f .ci-monolithic-heavy-flow-poisson/case/poisson.e
          cp .ci-monolithic-heavy-flow-poisson/case/poisson.e \
             .ci-monolithic-heavy-flow-poisson/monolithic_heavy_flow_poisson_20ns.e

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monolithic-heavy-flow-poisson-20ns
          path: |
            .ci-monolithic-heavy-flow-poisson/monolithic_heavy_flow_poisson_20ns.e
            .ci-monolithic-heavy-flow-poisson/case/probe_contract.json
            .ci-monolithic-heavy-flow-poisson/case/output_schema.json
            .ci-monolithic-heavy-flow-poisson/case/run_contract_20ns.json
            .ci-monolithic-heavy-flow-poisson/case/input.i
            .ci-monolithic-heavy-flow-poisson/case/runtime.log
            .ci-monolithic-heavy-flow-poisson/case/poisson*.csv
            .ci-monolithic-heavy-flow-poisson/case/poisson*.e
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
