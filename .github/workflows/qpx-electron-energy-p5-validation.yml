name: QPX P5 E7 real-QVT validation

on:
  push:
    branches:
      - development
      - issue-26-electron-energy-p5
    paths:
      - 'qpx_app/ci/electron_energy_real_qvt_inventory_smoke.i'
      - 'qpx_app/ci/check_electron_energy_real_qvt_inventory.py'
      - 'qpx_app/include/materials/QPXElectronMeanEnergyMaterial.h'
      - 'qpx_app/src/materials/QPXElectronMeanEnergyMaterial.C'
      - 'qpx_app/include/materials/QPXElectronTransportLookupMaterial.h'
      - 'qpx_app/src/materials/QPXElectronTransportLookupMaterial.C'
      - 'experiments/Issue91_real_qvt_r3/r3_e0/qvt.msh'
      - 'experiments/Issue91_real_qvt_r3/r3_e0/electron_moments.txt'
      - '.github/workflows/qpx-electron-energy-p5-validation.yml'
  pull_request:
    branches:
      - development
    paths:
      - 'qpx_app/**'
      - 'experiments/Issue91_real_qvt_r3/r3_e0/qvt.msh'
      - 'experiments/Issue91_real_qvt_r3/r3_e0/electron_moments.txt'
      - '.github/workflows/qpx-electron-energy-p5-validation.yml'

concurrency:
  group: qpx-electron-energy-p5-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  BUILD_BASE_REF: ghcr.io/hyungseonsong-plasma/qpx-build-base@sha256:910d406eb3574a918290dc3621df1133569907d6e7af7884f68abe257a9a1999
  EXPECTED_MOOSE_SHA: 9f388366ccf38b9c34542ec5561198249fde0ac9

jobs:
  real-qvt-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact implementation and oracle revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Validate frozen P5 E7 source contract
        shell: bash
        run: |
          set -euxo pipefail
          INPUT=qpx_app/ci/electron_energy_real_qvt_inventory_smoke.i
          CHECK=qpx_app/ci/check_electron_energy_real_qvt_inventory.py
          TABLE=experiments/Issue91_real_qvt_r3/r3_e0/electron_moments.txt
          MESH=experiments/Issue91_real_qvt_r3/r3_e0/qvt.msh

          test -f "$INPUT"
          test -f "$CHECK"
          test -f "$TABLE"
          test -f "$MESH"
          test -f qpx_app/dependencies.lock

          grep -Fq 'coord_type = RZ' "$INPUT"
          grep -Fq "qvt.msh'" "$INPUT"
          grep -Fq 'type = BlockDeletionGenerator' "$INPUT"
          grep -Fq 'input = main' "$INPUT"
          grep -Fq 'operation = keep' "$INPUT"
          grep -Fq 'block = plasma' "$INPUT"
          grep -Fq "electron_moments.txt'" "$INPUT"
          grep -Fq 'type = QPXElectronMeanEnergyMaterial' "$INPUT"
          grep -Fq 'energy_reference_eV = 5.73276' "$INPUT"
          grep -Fq 'mean_energy = mean_en_solved' "$INPUT"
          grep -Fq 'bounds_policy = error' "$INPUT"
          ! grep -Fq 'bounds_policy = clamp' "$INPUT"
          test "$(grep -Fc 'type = QPXElectronTransportLookupMaterial' "$INPUT")" -eq 1
          test "$(grep -Fc 'type = FVDiffusion' "$INPUT")" -eq 2
          grep -Fq 'coeff = electron_diffusion' "$INPUT"
          grep -Fq 'coeff = electron_energy_diffusion' "$INPUT"
          grep -Fq 'type = ADElementIntegralFunctorPostprocessor' "$INPUT"
          grep -Fq '[n_e_inventory]' "$INPUT"
          grep -Fq '[n_epsilon_inventory]' "$INPUT"
          grep -Fq '[n_e_min]' "$INPUT"
          grep -Fq '[n_epsilon_min]' "$INPUT"
          grep -Fq '[mean_en_solved_min]' "$INPUT"
          grep -Fq '[mean_en_solved_max]' "$INPUT"
          ! grep -Fq '[FVBCs]' "$INPUT"
          ! grep -Eq 'Joule|WallFlux|SEE|Reaction|reaction' "$INPUT"

          test "$(awk 'NR == 1 {print $1}' "$TABLE")" = '1.40991'
          test "$(awk 'END {print $1}' "$TABLE")" = '22.1378'
          grep -Fq '2 53 "plasma"' "$MESH"

          grep -Fq 'std::isfinite(n_e_hat.value())' qpx_app/src/materials/QPXElectronMeanEnergyMaterial.C
          grep -Fq 'std::isfinite(n_epsilon_hat.value())' qpx_app/src/materials/QPXElectronMeanEnergyMaterial.C
          grep -Fq 'std::isfinite(mean_en_solved.value())' qpx_app/src/materials/QPXElectronMeanEnergyMaterial.C
          grep -Fq 'No denominator floor is applied.' qpx_app/src/materials/QPXElectronMeanEnergyMaterial.C
          grep -Fq 'No clamp is applied.' qpx_app/src/materials/QPXElectronMeanEnergyMaterial.C

          source qpx_app/dependencies.lock
          test "$MOOSE" = "$EXPECTED_MOOSE_SHA"
          test "$QPX_BUILD_BASE" = "$BUILD_BASE_REF"
          echo QPX_E7_STATIC_CONTRACT_PASS

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare runner disk
        shell: bash
        run: |
          set -euxo pipefail
          target_kb=$((14 * 1024 * 1024))
          free_kb() { df -Pk / | awk 'NR == 2 {print $4}'; }
          sudo apt-get clean || true
          docker system prune -af --volumes || true
          for path in /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/share/swift /usr/local/.ghcup
          do
            if (( $(free_kb) >= target_kb )); then break; fi
            sudo rm -rf "$path" || true
          done
          test "$(free_kb)" -ge "$target_kb"

      - name: Pull immutable accepted build base
        shell: bash
        run: |
          set -euxo pipefail
          docker pull "$BUILD_BASE_REF"
          test "$(docker image inspect "$BUILD_BASE_REF" --format '{{index .RepoDigests 0}}' | sed 's/.*@//')" = 'sha256:910d406eb3574a918290dc3621df1133569907d6e7af7884f68abe257a9a1999'

      - name: Build exact head and run bounded real-QVT oracle
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm \
            --entrypoint /bin/bash \
            --user 0:0 \
            --workdir /workspace/qpx_app \
            -e GITHUB_SHA="$GITHUB_SHA" \
            -v "$PWD:/workspace" \
            "$BUILD_BASE_REF" \
            -lc '
              set -euxo pipefail
              source /environment
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory /opt/qpx_vendor/moose
              git config --global --add safe.directory /opt/qpx_vendor/crane
              git config --global --add safe.directory /opt/qpx_vendor/squirrel
              git config --global --add safe.directory /opt/qpx_vendor/zapdos

              test "$(git rev-parse --show-toplevel)" = /workspace
              test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

              export MOOSE_DIR=/opt/qpx_vendor/moose
              export CRANE_DIR=/opt/qpx_vendor/crane
              export SQUIRREL_DIR=/opt/qpx_vendor/squirrel
              export ZAPDOS_DIR=/opt/qpx_vendor/zapdos
              export METHOD=opt

              test ! -e ./qpx-opt
              make -j2
              test -x ./qpx-opt

              cd ci
              ../qpx-opt --check-input -i electron_energy_real_qvt_inventory_smoke.i
              ../qpx-opt -i electron_energy_real_qvt_inventory_smoke.i
              python3 check_electron_energy_real_qvt_inventory.py electron_energy_real_qvt_inventory_smoke_out.csv
            '

      - name: Assert P5 E7 evidence
        if: ${{ success() }}
        shell: bash
        run: |
          set -euxo pipefail
          echo "REPOSITORY_SHA=${GITHUB_SHA}"
          echo "P5_E7_REAL_QVT_GEOMETRY=true"
          echo "P5_E7_CHEMISTRY_OFF=true"
          echo "P5_E7_ZERO_EXTERNAL_BOUNDARY_FLUX=true"
          echo "P5_E7_PARTICLE_AND_ENERGY_INVENTORIES_SEPARATE=true"
          echo "P5_E7_LOOKUP_BOUNDS_POLICY=error"
          echo "P5_E7_REAL_QVT_INVARIANTS=PASS"
          echo "P5_E7_REAL_QVT_INVENTORY=PASS"
          echo "SCIENTIFIC_SEMANTICS_CHANGED=false"
