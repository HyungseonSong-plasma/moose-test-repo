# #817 TEMPORARY P0. Delete before any production integration.
name: Issue817 Code3 H05 R2 S5R consumer P0 one-off

on:
  push:
    branches: [issue-817-code3-consumer-pair-d3]
    paths: ['.github/workflows/issue817-code3-consumers-p0-once.yml']
  pull_request:
    branches: [issue-817-code3-newonly-retirement]
    types: [opened, synchronize, reopened]
permissions:
  contents: read

jobs:
  source_consumer_pairs:
    name: Exact-head H05 R2 S5R input-only A-B P0
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Exact source and existing CI guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          python3 ci/workflow_harness.py --self-test
          python3 ci/workflow_harness.py --check
          python3 ci/guards/p6_ci_workflow_safety_guard.py --self-test --check
          python3 -m pip install --disable-pip-version-check --quiet \
            -r requirements-evidence-engine.txt -r requirements-ontology.txt
      - name: Generate 3 real old-candidate source pairs and fail-closed tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 -m unittest discover -s tests -p test_issue817_code3_consumer_pairs.py -v 2>&1 | tee evidence/pair_tests.log
          python3 - <<'PY'
          import json,hashlib,os
          from pathlib import Path
          from experiments.Code3_electron_source_retirement import consumer_pairs as cp
          from experiments.Code3_electron_source_retirement import run as old
          cases=(("H05",cp.h05_pair,cp.H05_TARGET),
                 ("R2",cp.r2_pair,cp.R2_TARGET),
                 ("S5R",cp.s5r_pair,cp.S5R_TARGET))
          records=[]
          for name,maker,target in cases:
              a,b,meta=maker()
              assert a != b
              assert old._outside_target(a,target)==old._outside_target(b,target)
              records.append({"case":name,"path":target,"original_sha256":hashlib.sha256(a.encode()).hexdigest(),
                              "candidate_sha256":hashlib.sha256(b.encode()).hexdigest(),
                              "source_functor":meta["source_functor"],
                              "state_mode":meta["mode"],"coef":meta["coefficient"],
                              "outside_electron_block_identical":True,
                              "Native_P2":"NOT_RUN","Native_P3":"NOT_RUN","AD_Jacobian":"NOT_PROVEN"})
          Path("evidence/pairs.json").write_text(json.dumps({
              "schema":"issue817.code3.consumer_pairs.v0.1",
              "source_head":os.environ["SOURCE_HEAD"],"pairs":records,
              "old_factory_retained":True,"live_consumer_migration":False,"safe_delete":False
          },indent=2,sort_keys=True)+"\n")
          print("ISSUE817_REAL_H05_R2_S5R_P0_PAIRS_PASS")
          PY
          python3 ci/guards/issue817_code3_retirement.py --expected-head "$SOURCE_HEAD" --output evidence/consumer_census.json
      - name: Preserve hash-only inputs/guard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue817-consumer-p0-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
