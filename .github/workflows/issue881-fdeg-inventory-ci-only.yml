name: Issue881 immutable original evidence blob staging (one-shot)
on:
  push:
    branches: [issue-881-fdeg-inventory-ci-only]
    paths: [.github/workflows/issue881-fdeg-inventory-ci-only.yml]
permissions:
  actions: read
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify original ZIP bytes and stage exactly two Git blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "HyungseonSong-plasma/moose-test-repo"
          test "$GITHUB_REF" = "refs/heads/issue-881-fdeg-inventory-ci-only"
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, zipfile
          repo = os.environ["GITHUB_REPOSITORY"]
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "issue881-custody"
          out.mkdir()
          specs = [
              (14959988094, 45476946329, "f9d89f8313ba0a885f1a2cf10ab5d02d0e46f134414cab5266e41e362f37edf6", "live-electron/manifest.json", "baseline_head", "cee3dd7447e5ca776d85cd600944bbac287d6610"),
              (14962467467, 45484020418, "37238045a198628ac8d65a27e96cfda9cec245f45e1ede1d46924e9ca3bc301e", "code6-comparison.json", "source_head", "7a119106a22f2de2ca5c761a4119f00509e0efdd"),
          ]
          rows = []
          for artifact, run, sha256, member, key, expected in specs:
              meta = json.loads(subprocess.check_output(["gh", "api", f"repos/{repo}/actions/artifacts/{artifact}"]))
              assert meta["id"] == artifact and meta["workflow_run"]["id"] == run
              assert meta["digest"] == "sha256:" + sha256 and not meta["expired"]
              p = out / f"artifact-{artifact}.zip"
              with p.open("wb") as fp:
                  subprocess.run(["gh", "api", f"repos/{repo}/actions/artifacts/{artifact}/zip"], stdout=fp, check=True)
              data = p.read_bytes()
              assert hashlib.sha256(data).hexdigest() == sha256, "original ZIP digest mismatch"
              with zipfile.ZipFile(p) as z:
                  assert z.testzip() is None
                  receipt = json.loads(z.read(member))
                  assert receipt[key] == expected
              blob = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
              request = json.dumps({"content": base64.b64encode(data).decode(), "encoding": "base64"}).encode()
              result = json.loads(subprocess.check_output(["gh", "api", "--method", "POST", f"repos/{repo}/git/blobs", "--input", "-"], input=request))
              assert result["sha"] == blob, "Git blob identity mismatch"
              rows.append({"artifact_id": artifact, "producer_run_id": run, "source_head": expected,
                           "zip_sha256": sha256, "git_blob_sha": blob, "bytes": len(data)})
          result = {"schema": "issue881.original_zip_blob_staging.v1",
                    "request_head": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"],
                    "rows": rows, "ref_mutation": False, "custody_complete": False}
          (out / "receipt.json").write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: issue881-original-zip-blob-staging-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/issue881-custody/receipt.json
          if-no-files-found: error
          retention-days: 30
